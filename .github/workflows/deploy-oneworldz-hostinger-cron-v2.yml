name: Deploy OneWorldz Repair via Hostinger Cron V2

on:
  push:
    branches: [main]
    paths:
      - 'deployments/oneworldz-hostinger-cron-v2.request'

permissions:
  contents: read

concurrency:
  group: oneworldz-hostinger-cron-v2
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: oneworldz-production
      url: https://oneworldz.com
    env:
      API: https://developers.hostinger.com
      LIVE_URL: https://oneworldz.com
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - name: Checkout request and candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Lock candidate and verify before writes
        id: lock
        shell: bash
        run: |
          set -euo pipefail
          req='deployments/oneworldz-hostinger-cron-v2.request'
          source_commit="$(sed -n 's/^source_commit=//p' "$req" | tail -n1)"
          test "$(sed -n 's/^target=//p' "$req" | tail -n1)" = 'oneworldz.com'
          test "$(sed -n 's/^authorization=//p' "$req" | tail -n1)" = 'GO'
          test "$source_commit" = '${{ github.event.before }}'
          git checkout --detach "$source_commit"
          bash -n ops/oneworldz/remote-visual-repair.sh
          ! grep -Eqi 'NEXT PASS' apps/cryptoworldz-web-core/assets/oneworldz-next.js
          grep -Fq 'One Connected Gateway' apps/cryptoworldz-web-core/assets/oneworldz-next.js
          grep -Fq 'reagan-children/' apps/cryptoworldz-web-core/assets/oneworldz-next.js
          grep -Fq 'oneworldz-live-fix.css' apps/cryptoworldz-web-core/assets/site-router.js
          grep -Fq '20260816-oneworldz-visual2' apps/cryptoworldz-web-core/index.html
          npm ci
          npm run verify:web
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"

      - name: Resolve exact Hostinger target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          auth="Authorization: Bearer $HOSTINGER_API_TOKEN"
          data="$(curl --fail --silent --show-error -H "$auth" -H 'Accept: application/json' "$API/api/hosting/v1/websites?domain=oneworldz.com")"
          row="$(printf '%s' "$data" | jq -c '.data[] | select(.domain=="oneworldz.com" and .is_enabled==true)' | head -n1)"
          test -n "$row"
          username="$(printf '%s' "$row" | jq -r '.username')"
          root="$(printf '%s' "$row" | jq -r '.root_directory')"
          case "$root" in /home/*/domains/oneworldz.com/public_html) ;; *) exit 1;; esac
          home="${root%%/domains/*}"
          case "$home" in /home/*) ;; *) exit 1;; esac
          remote_script="$home/.oneworldz-visual-repair-${GITHUB_RUN_ID}.sh"
          echo "::add-mask::$username"
          echo "::add-mask::$root"
          echo "::add-mask::$home"
          echo "::add-mask::$remote_script"
          echo "username=$username" >> "$GITHUB_OUTPUT"
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "remote_script=$remote_script" >> "$GITHUB_OUTPUT"
          echo 'Exact OneWorldz Hostinger root resolved.'

      - name: Bootstrap pinned repair script with simple Hostinger cron command
        id: bootstrap
        shell: bash
        env:
          USERNAME: ${{ steps.target.outputs.username }}
          REMOTE_SCRIPT: ${{ steps.target.outputs.remote_script }}
          SOURCE_COMMIT: ${{ steps.lock.outputs.source_commit }}
        run: |
          set -euo pipefail
          auth="Authorization: Bearer $HOSTINGER_API_TOKEN"
          url="https://raw.githubusercontent.com/CryptoWorldz/CryptoWorldz-Bot/$SOURCE_COMMIT/ops/oneworldz/remote-visual-repair.sh"
          command="curl -fsSL $url -o $REMOTE_SCRIPT"
          payload="$(jq -n --arg time '* * * * *' --arg command "$command" '{time:$time,command:$command}')"
          response="$RUNNER_TEMP/bootstrap-create.json"
          code="$(curl --silent --show-error --request POST -H "$auth" -H 'Accept: application/json' -H 'Content-Type: application/json' --data "$payload" -o "$response" -w '%{http_code}' "$API/api/hosting/v1/accounts/$USERNAME/cron-jobs" || true)"
          if [ "$code" != '200' ]; then
            echo "::error::Hostinger bootstrap cron rejected with HTTP $code"
            jq -c '{message,error,errors,correlation_id}' "$response" 2>/dev/null || true
            exit 1
          fi
          uid="$(jq -r '.uid // empty' "$response")"
          test -n "$uid"
          echo "::add-mask::$uid"
          echo "uid=$uid" >> "$GITHUB_OUTPUT"
          echo 'Bootstrap cron accepted; waiting for its first scheduled execution.'
          sleep 70
          curl --silent --show-error --request DELETE -H "$auth" "$API/api/hosting/v1/accounts/$USERNAME/cron-jobs/$uid" >/dev/null || true
          echo 'Bootstrap cron removed after one execution window.'

      - name: Execute guarded four-file repair with simple Hostinger cron command
        id: deploy
        shell: bash
        env:
          USERNAME: ${{ steps.target.outputs.username }}
          ROOT: ${{ steps.target.outputs.root }}
          REMOTE_SCRIPT: ${{ steps.target.outputs.remote_script }}
          SOURCE_COMMIT: ${{ steps.lock.outputs.source_commit }}
        run: |
          set -euo pipefail
          auth="Authorization: Bearer $HOSTINGER_API_TOKEN"
          command="/bin/bash $REMOTE_SCRIPT deploy $ROOT $SOURCE_COMMIT $GITHUB_RUN_ID"
          payload="$(jq -n --arg time '* * * * *' --arg command "$command" '{time:$time,command:$command}')"
          response="$RUNNER_TEMP/deploy-create.json"
          code="$(curl --silent --show-error --request POST -H "$auth" -H 'Accept: application/json' -H 'Content-Type: application/json' --data "$payload" -o "$response" -w '%{http_code}' "$API/api/hosting/v1/accounts/$USERNAME/cron-jobs" || true)"
          if [ "$code" != '200' ]; then
            echo "::error::Hostinger deploy cron rejected with HTTP $code"
            jq -c '{message,error,errors,correlation_id}' "$response" 2>/dev/null || true
            exit 1
          fi
          uid="$(jq -r '.uid // empty' "$response")"
          test -n "$uid"
          echo "::add-mask::$uid"
          echo "uid=$uid" >> "$GITHUB_OUTPUT"
          ok=0
          for attempt in $(seq 1 36); do
            sleep 5
            output_json="$(curl --fail --silent --show-error -H "$auth" -H 'Accept: application/json' "$API/api/hosting/v1/accounts/$USERNAME/cron-jobs/$uid/output")"
            output="$(printf '%s' "$output_json" | jq -r '.output // empty')"
            if printf '%s' "$output" | grep -Fq "ONEWORLDZ_VISUAL_REPAIR_OK $GITHUB_RUN_ID"; then ok=1; break; fi
            if printf '%s' "$output" | grep -Fq 'ONEWORLDZ_VISUAL_REPAIR_FAILED'; then
              echo '::error::Hostinger-side repair script reported failure.'
              printf '%s\n' "$output" | tail -n 5
              break
            fi
            echo "Waiting for guarded repair execution ($attempt/36)..."
          done
          curl --silent --show-error --request DELETE -H "$auth" "$API/api/hosting/v1/accounts/$USERNAME/cron-jobs/$uid" >/dev/null || true
          test "$ok" = 1
          echo 'written=true' >> "$GITHUB_OUTPUT"
          echo 'Four-file OneWorldz repair executed and deployment cron removed.'

      - name: Clear Hostinger cache and prove repaired public assets
        id: public
        shell: bash
        env:
          USERNAME: ${{ steps.target.outputs.username }}
        run: |
          set -euo pipefail
          auth="Authorization: Bearer $HOSTINGER_API_TOKEN"
          curl --fail --silent --show-error --request DELETE -H "$auth" -H 'Accept: application/json' "$API/api/hosting/v1/accounts/$USERNAME/websites/oneworldz.com/cache/clear" >/dev/null
          mkdir -p "$RUNNER_TEMP/oneworldz-proof"
          ok=0
          for attempt in $(seq 1 36); do
            router="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$LIVE_URL/assets/site-router.js?v=${GITHUB_RUN_ID}-$attempt" || true)"
            page="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$LIVE_URL/assets/oneworldz-next.js?v=${GITHUB_RUN_ID}-$attempt" || true)"
            css="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$LIVE_URL/assets/oneworldz-live-fix.css?v=${GITHUB_RUN_ID}-$attempt" || true)"
            index="$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "$LIVE_URL/?repair=${GITHUB_RUN_ID}-$attempt" || true)"
            if printf '%s' "$router" | grep -Fq 'oneworldz-live-fix.css' \
              && printf '%s' "$page" | grep -Fq 'One Connected Gateway' \
              && printf '%s' "$page" | grep -Fq 'reagan-children/' \
              && ! printf '%s' "$page" | grep -Eqi 'NEXT PASS' \
              && printf '%s' "$css" | grep -Fq 'owz-fixed-hero' \
              && printf '%s' "$index" | grep -Fq '20260816-oneworldz-visual2'; then
              ok=1
              printf '%s' "$page" > "$RUNNER_TEMP/oneworldz-proof/oneworldz-next.js"
              printf '%s' "$css" > "$RUNNER_TEMP/oneworldz-proof/oneworldz-live-fix.css"
              break
            fi
            echo "Waiting for public convergence ($attempt/36)..."
            sleep 5
          done
          test "$ok" = 1
          echo 'proved=true' >> "$GITHUB_OUTPUT"
          echo 'Exact repaired assets are publicly live.'

      - name: Strict mobile and desktop visual proof
        id: visual
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oneworldz-proof"
          npm install --no-save --package-lock=false playwright@1.62.1 >/dev/null
          npx playwright install chromium >/dev/null
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const out=process.env.RUNNER_TEMP+'/oneworldz-proof';
          const browser=await chromium.launch({headless:true});
          try {
            const p=await browser.newPage({viewport:{width:390,height:844}});
            await p.goto('https://oneworldz.com/?visual='+process.env.GITHUB_RUN_ID,{waitUntil:'networkidle',timeout:90000});
            await p.waitForSelector('.owz-fixed-hero',{timeout:30000});
            const r=await p.evaluate(()=>({
              viewport:innerWidth,
              scrollWidth:document.documentElement.scrollWidth,
              nextPass:/NEXT PASS/i.test(document.body.innerText),
              gateway:/One Connected Gateway/i.test(document.body.innerText),
              reagan:/Action Spreads Smiles/i.test(document.body.innerText),
              worlds:document.querySelectorAll('.wx-world-link').length,
              loops:document.querySelectorAll('.wx-loop span').length,
              imageLoaded:!!document.querySelector('.wx-hero-media img')?.naturalWidth,
              headerHeight:document.querySelector('.site-header')?.getBoundingClientRect().height||999,
              h1Size:parseFloat(getComputedStyle(document.querySelector('.owz-fixed-hero h1')).fontSize)
            }));
            fs.writeFileSync(out+'/mobile-proof.json',JSON.stringify(r,null,2));
            if(r.scrollWidth>r.viewport+2||r.nextPass||!r.gateway||!r.reagan||r.worlds<17||r.loops!==7||!r.imageLoaded||r.headerHeight>100||r.h1Size>48) throw new Error('mobile_visual_gate_failed '+JSON.stringify(r));
            await p.screenshot({path:out+'/mobile-390x844.png',fullPage:true});
            const d=await browser.newPage({viewport:{width:1440,height:1100}});
            await d.goto('https://oneworldz.com/?desktop='+process.env.GITHUB_RUN_ID,{waitUntil:'networkidle',timeout:90000});
            await d.waitForSelector('.owz-fixed-hero',{timeout:30000});
            if(await d.evaluate(()=>document.documentElement.scrollWidth>innerWidth+2)) throw new Error('desktop_horizontal_overflow');
            await d.screenshot({path:out+'/desktop-1440x1100.png',fullPage:true});
          } finally { await browser.close(); }
          NODE
          echo 'proved=true' >> "$GITHUB_OUTPUT"
          echo 'Strict mobile and desktop visual proof passed.'

      - name: Roll back automatically if external proof fails
        if: ${{ failure() && steps.deploy.outputs.written == 'true' && (steps.public.outputs.proved != 'true' || steps.visual.outputs.proved != 'true') }}
        shell: bash
        env:
          USERNAME: ${{ steps.target.outputs.username }}
          ROOT: ${{ steps.target.outputs.root }}
          REMOTE_SCRIPT: ${{ steps.target.outputs.remote_script }}
          SOURCE_COMMIT: ${{ steps.lock.outputs.source_commit }}
        run: |
          set -u
          auth="Authorization: Bearer $HOSTINGER_API_TOKEN"
          command="/bin/bash $REMOTE_SCRIPT rollback $ROOT $SOURCE_COMMIT $GITHUB_RUN_ID"
          payload="$(jq -n --arg time '* * * * *' --arg command "$command" '{time:$time,command:$command}')"
          created="$(curl --silent --show-error --request POST -H "$auth" -H 'Content-Type: application/json' --data "$payload" "$API/api/hosting/v1/accounts/$USERNAME/cron-jobs" || true)"
          uid="$(printf '%s' "$created" | jq -r '.uid // empty' 2>/dev/null || true)"
          if [ -n "$uid" ]; then
            for attempt in $(seq 1 36); do
              sleep 5
              out="$(curl --silent -H "$auth" "$API/api/hosting/v1/accounts/$USERNAME/cron-jobs/$uid/output" | jq -r '.output // empty' 2>/dev/null || true)"
              printf '%s' "$out" | grep -Fq "ONEWORLDZ_VISUAL_ROLLBACK_OK $GITHUB_RUN_ID" && break
            done
            curl --silent --request DELETE -H "$auth" "$API/api/hosting/v1/accounts/$USERNAME/cron-jobs/$uid" >/dev/null || true
            curl --silent --request DELETE -H "$auth" "$API/api/hosting/v1/accounts/$USERNAME/websites/oneworldz.com/cache/clear" >/dev/null || true
          fi
          echo 'Automatic rollback path completed/attempted.'

      - name: Upload proof evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: oneworldz-real-visual-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/oneworldz-proof/
          if-no-files-found: warn
          retention-days: 14

      - name: Final approval gate
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.public.outputs.proved }}' = true
          test '${{ steps.visual.outputs.proved }}' = true
          echo 'ONEWORLDZ REAL VISUAL/UX APPROVAL PASSED.'
