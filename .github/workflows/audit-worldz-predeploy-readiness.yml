name: Audit Worldz Predeploy Readiness

on:
  workflow_dispatch:
  push:
    branches:
      - forensics/browser-proof-gate-v4
    paths:
      - 'tools/worldz-predeploy-readiness.mjs'
      - '.github/workflows/audit-worldz-predeploy-readiness.yml'

permissions:
  contents: read

jobs:
  readiness:
    name: DNS HTTPS fundraiser and source readiness
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run non-deploying readiness audit
        run: node tools/worldz-predeploy-readiness.mjs
      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldz-predeploy-readiness-${{ github.run_id }}
          path: predeploy-readiness/report.json
          if-no-files-found: error
          retention-days: 30
