name: Website Deployments STOPPED

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/website-images-direct.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jayjay-chatgpt-oneworldz-single-rail
  cancel-in-progress: true

jobs:
  stop:
    name: STOP ALL WEBSITE DEPLOYMENTS
    runs-on: ubuntu-latest
    steps:
      - name: Confirm deployment stop
        run: |
          echo 'WEBSITE_DEPLOYMENTS=STOPPED'
          echo 'No build, Hostinger upload, or live write is permitted by this workflow.'
