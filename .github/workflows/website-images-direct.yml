name: OneWorldz Static Deploy
run-name: OneWorldz Static Deploy — ${{ github.sha }}

on:
  push:
    branches: [main]
    paths:
      - "apps/oneworldz-ecosystem-release/**"
      - ".github/workflows/website-images-direct.yml"
      - ".github/full-current-static-deploy.sh"
      - ".github/lftp-compat.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  deploy_static:
    name: BUILD → HOSTINGER → LIVE
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install FTPS transport
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/lftp-compat.py
          mkdir -p "$RUNNER_TEMP/oneworldz-bin"
          cat > "$RUNNER_TEMP/oneworldz-bin/lftp" <<'SH'
          #!/usr/bin/env bash
          exec python3 "$GITHUB_WORKSPACE/.github/lftp-compat.py" "$@"
          SH
          chmod +x "$RUNNER_TEMP/oneworldz-bin/lftp"
          echo "$RUNNER_TEMP/oneworldz-bin" >> "$GITHUB_PATH"

      - name: Install dependencies
        run: npm ci

      - name: Build websites
        shell: bash
        run: |
          set -euo pipefail
          npm run build:ecosystem-release
          test -s apps/oneworldz-ecosystem-release/dist/ecosystem/oneworldz/index.html

      - name: Check this is still current main
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping superseded commit before any Hostinger write."
          fi

      - name: Deploy static websites
        if: steps.freshness.outputs.deploy == 'true'
        shell: bash
        run: bash .github/full-current-static-deploy.sh

      - name: Deployment verdict
        if: steps.freshness.outputs.deploy == 'true'
        run: echo 'ONEWORLDZ_STATIC_DEPLOYMENT=PASS'
