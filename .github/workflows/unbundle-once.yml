name: Generate Unbundled Workflow Candidate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'GENERATE UNBUNDLED WORKFLOW CANDIDATE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish authenticated candidate-generation start
        run: bash .github/publish-progress.sh UNBUNDLE_CANDIDATE STARTED

      - name: Generate exact unbundled main workflow
        shell: bash
        env:
          SPLIT_B64: 
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64, os
          from pathlib import Path
          p=Path('.github/workflows/main.yml')
          y=p.read_text()
          start=y.find('  verify:\n')
          end=y.find('  preview:\n', start)
          if start < 0 or end < 0: raise SystemExit('Bundled verify block not found')
          split=base64.b64decode(os.environ['SPLIT_B64']).decode()
          y=y[:start]+split+y[end:]
          y=y.replace('    needs: verify\n    name: Desktop + mobile candidate proof','    needs: lighthouse\n    name: Desktop + mobile candidate proof')
          y=y.replace('    needs: [verify, preview]\n    name: Deploy + prove ZED, Mini App and guarded GPT','    needs: [build, lighthouse, preview]\n    name: Deploy + prove ZED, Mini App and guarded GPT')
          y=y.replace('    needs: [verify, preview, zed]\n    name: Exact 18-site Hostinger deployment','    needs: [build, lighthouse, preview, zed]\n    name: Exact 18-site Hostinger deployment')
          y=y.replace('needs.verify.outputs.static_tree','needs.build.outputs.static_tree')
          y=y.replace('    needs: [verify, deploy]\n    name: Live 18-site + full ZED proof','    needs: [build, deploy]\n    name: Live 18-site + full ZED proof')
          y=y.replace('    needs: [verify, live-proof]\n    name: Record only the proven latest generation','    needs: [build, live-proof]\n    name: Record only the proven latest generation')
          for token in ['  build:\n','  tests:\n','  lighthouse:\n','needs: lighthouse','needs: [build, lighthouse, preview]','needs.build.outputs.static_tree']:
            if token not in y: raise SystemExit('Missing split token: '+token)
          if '  verify:\n' in y: raise SystemExit('verify job survived')
          Path('workflow-candidate.txt').write_text(y)
          PY

      - name: Prove candidate then restore workflow files
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'name: SUCCESS STORY 1 — BUILD' workflow-candidate.txt
          grep -Fq 'name: SUCCESS STORY 2 — TESTS' workflow-candidate.txt
          grep -Fq 'name: SUCCESS STORY 3 — LIGHTHOUSE 100' workflow-candidate.txt
          ! grep -Fq '  verify:' workflow-candidate.txt
          git status --short

      - name: Publish candidate as normal repository file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workflow-candidate.txt
          git commit -m 'PUBLISH UNBUNDLED WORKFLOW CANDIDATE'
          git push origin HEAD:main
