name: Check SolWorldz Mobile Layout

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-solworldz-mobile-layout.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile:
    name: Verify live phone-width layout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify versioned mobile assets are live
        shell: bash
        run: |
          set -euo pipefail
          base='https://solworldz.xyz'
          curl -L -fsS -A 'Mozilla/5.0 (Linux; Android 13; Mobile) SolWorldzMobileCheck' -H 'Cache-Control: no-cache' --max-time 30 "$base/?mobilecheck=${GITHUB_RUN_ID}" -o "$RUNNER_TEMP/index.html"
          grep -Fq 'solworldz-mobile-fix.css?v=20260808-mobile3' "$RUNNER_TEMP/index.html"
          grep -Fq 'site-router.js?v=20260808-mobile3' "$RUNNER_TEMP/index.html"
          curl -L -fsS -A 'Mozilla/5.0 (Linux; Android 13; Mobile) SolWorldzMobileCheck' --max-time 30 "$base/assets/solworldz-mobile-fix.css?v=20260808-mobile3" -o "$RUNNER_TEMP/mobile.css"
          grep -Fq 'grid-template-areas:' "$RUNNER_TEMP/mobile.css"
          grep -Fq 'overflow-x: auto' "$RUNNER_TEMP/mobile.css"
          grep -Fq '@media (max-width: 390px)' "$RUNNER_TEMP/mobile.css"

      - name: Verify computed phone layout in Chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          [[ -n "$chrome" ]] || { echo '::error::Chrome is unavailable'; exit 1; }

          "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --remote-debugging-port=9222 \
            --window-size=390,844 \
            "https://solworldz.xyz/?mobilecheck=${GITHUB_RUN_ID}" \
            >"$RUNNER_TEMP/chrome.out" 2>"$RUNNER_TEMP/chrome.err" &
          chrome_pid=$!
          trap 'kill "$chrome_pid" 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json/list -o "$RUNNER_TEMP/tabs.json"; then break; fi
            sleep 1
          done

          node <<'NODE'
          const fs = require('fs');
          const tabs = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/tabs.json', 'utf8'));
          const tab = tabs.find(t => t.type === 'page');
          if (!tab?.webSocketDebuggerUrl) throw new Error('No Chrome page target');

          const ws = new WebSocket(tab.webSocketDebuggerUrl);
          let seq = 0;
          const pending = new Map();
          ws.onmessage = event => {
            const msg = JSON.parse(event.data);
            if (msg.id && pending.has(msg.id)) {
              const {resolve, reject} = pending.get(msg.id);
              pending.delete(msg.id);
              msg.error ? reject(new Error(JSON.stringify(msg.error))) : resolve(msg.result);
            }
          };
          const send = (method, params = {}) => new Promise((resolve, reject) => {
            const id = ++seq;
            pending.set(id, {resolve, reject});
            ws.send(JSON.stringify({id, method, params}));
          });

          await new Promise((resolve, reject) => {
            ws.onopen = resolve;
            ws.onerror = reject;
          });
          await send('Runtime.enable');
          await new Promise(r => setTimeout(r, 5000));

          const expression = `(() => {
            const q = s => document.querySelector(s);
            const nav = q('.main-nav');
            const header = q('.site-header');
            const hero = q('.sw-hero');
            const grid = q('.sw-token-grid');
            const button = q('#wallet-button');
            const rect = el => el ? el.getBoundingClientRect() : null;
            return {
              innerWidth,
              scrollWidth: document.documentElement.scrollWidth,
              navDisplay: nav ? getComputedStyle(nav).display : null,
              navOverflowX: nav ? getComputedStyle(nav).overflowX : null,
              navLinks: nav ? nav.querySelectorAll('a').length : 0,
              header: rect(header),
              hero: rect(hero),
              wallet: rect(button),
              tokenColumns: grid ? getComputedStyle(grid).gridTemplateColumns : null,
              loadingVisible: document.body.innerText.includes('Loading the Worldz experience…'),
              hasSolWorldz: document.body.innerText.includes('SolWorldz'),
              hasImpactBased: document.body.innerText.includes('ImpactBased'),
              hasNetwork: document.body.innerText.includes('Explore the Network')
            };
          })()`;
          const result = await send('Runtime.evaluate', {expression, returnByValue: true});
          const m = result.result.value;
          console.log(JSON.stringify(m, null, 2));

          const fail = msg => { console.error('MOBILE_LAYOUT_ERROR:', msg); process.exitCode = 1; };
          if (m.scrollWidth > m.innerWidth + 2) fail(`horizontal overflow ${m.scrollWidth}px > ${m.innerWidth}px`);
          if (m.navDisplay !== 'flex') fail(`mobile nav display is ${m.navDisplay}`);
          if (!['auto', 'scroll'].includes(m.navOverflowX)) fail(`mobile nav overflow-x is ${m.navOverflowX}`);
          if (m.navLinks < 6) fail(`only ${m.navLinks} mobile nav links rendered`);
          if (!m.header || m.header.width > m.innerWidth + 1) fail('header exceeds viewport');
          if (!m.hero || m.hero.width > m.innerWidth + 1) fail('hero exceeds viewport');
          if (!m.wallet || m.wallet.right > m.innerWidth + 1) fail('Zed button exceeds viewport');
          if (m.tokenColumns && m.tokenColumns.includes(' ')) fail(`token grid is not single-column: ${m.tokenColumns}`);
          if (m.loadingVisible) fail('loading shell remains visible');
          if (!m.hasSolWorldz || !m.hasImpactBased || !m.hasNetwork) fail('key SolWorldz sections are missing');
          ws.close();
          if (process.exitCode) process.exit(process.exitCode);
          NODE

      - name: Publish mobile check
        if: always()
        run: |
          {
            echo '## SolWorldz Mobile Layout Check'
            echo '- Viewport: 390 × 844'
            echo '- Checks: cache-busted CSS/JS, visible scrollable nav, no horizontal overflow, one-column token cards, key live sections'
            echo '- Target: https://solworldz.xyz'
          } >> "$GITHUB_STEP_SUMMARY"
