name: Deploy Spam2Ham Subdomain

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-spam2ham.yml"
      - "spam2ham.cryptoworldz.xyz/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spam2ham-cryptoworldz-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate Spam2Ham build
        run: |
          set -euo pipefail
          test -f spam2ham.cryptoworldz.xyz/index.html
          test -f spam2ham.cryptoworldz.xyz/style.css
          test -f spam2ham.cryptoworldz.xyz/coin-rescue.js
          node --check spam2ham.cryptoworldz.xyz/coin-rescue.js
          grep -q '2026-09-20-spam2ham-coin-rescue-v2' spam2ham.cryptoworldz.xyz/index.html
          grep -q 'National Spam2Ham Day' spam2ham.cryptoworldz.xyz/index.html
          grep -q 'Start 60 Minutes' spam2ham.cryptoworldz.xyz/index.html
          grep -q 'ACMA — Dealing with Spam' spam2ham.cryptoworldz.xyz/index.html
          grep -q 'Pilot only — no cash or crypto value' spam2ham.cryptoworldz.xyz/index.html
          grep -q 'SPAM COIN RESCUE' spam2ham.cryptoworldz.xyz/index.html
          grep -q 'HAM Node Mesh' spam2ham.cryptoworldz.xyz/index.html
          grep -q 'READ ONLY • NO SIGNATURE' spam2ham.cryptoworldz.xyz/index.html
          grep -q 'spam2ham-solana-scan' spam2ham.cryptoworldz.xyz/coin-rescue.js

      - name: Upload Spam2Ham to Hostinger
        run: |
          python3 - <<'PY'
          import os, ssl
          from ftplib import FTP_TLS
          from pathlib import Path, PurePosixPath

          local_root = Path("spam2ham.cryptoworldz.xyz")
          remote_root = PurePosixPath("domains/cryptoworldz.xyz/public_html/spam2ham")

          ftp = FTP_TLS(context=ssl._create_unverified_context())
          ftp.connect(os.environ["FTP_HOST"], int(os.environ.get("FTP_PORT","21")), timeout=45)
          ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
          ftp.prot_p()
          ftp.set_pasv(True)

          def ensure_dir(path):
              ftp.cwd("/")
              for part in PurePosixPath(path).parts:
                  if part in ("","/"):
                      continue
                  try:
                      ftp.cwd(part)
                  except Exception:
                      ftp.mkd(part)
                      ftp.cwd(part)

          uploaded = 0
          for f in sorted(p for p in local_root.rglob("*") if p.is_file()):
              rel = f.relative_to(local_root).as_posix()
              remote = remote_root / rel
              ensure_dir(str(remote.parent))
              with f.open("rb") as h:
                  ftp.storbinary(f"STOR {remote.name}", h, blocksize=262144)
              uploaded += 1
          try: ftp.quit()
          except Exception: ftp.close()
          print(f"SPAM2HAM_UPLOAD=PASS files={uploaded}")
          PY

      - name: Verify public subdomain
        run: |
          set -euo pipefail
          body="$(curl --fail --silent --show-error --location --retry 6 --retry-delay 5 --max-time 20 https://spam2ham.cryptoworldz.xyz/)"
          printf '%s' "$body" | grep -q '2026-09-20-spam2ham-coin-rescue-v2'
          printf '%s' "$body" | grep -q 'Kill Spam. Earn HAM. Turn Bytes into Bites.'
          printf '%s' "$body" | grep -q 'SPAM COIN RESCUE'
          printf '%s' "$body" | grep -q 'HAM Node Mesh'
          js="$(curl --fail --silent --show-error --location --retry 4 --retry-delay 3 --max-time 20 https://spam2ham.cryptoworldz.xyz/coin-rescue.js)"
          printf '%s' "$js" | grep -q 'spam2ham-solana-scan'
          echo "SPAM2HAM_PUBLIC_VERIFY=PASS coin_rescue=1 ham_nodes=1 read_only=1"
