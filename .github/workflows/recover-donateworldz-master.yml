name: Recover DonateWorldz approved master read-only

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/recover-donateworldz-master.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
    steps:
      - name: Install read-only recovery tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp libavif-bin imagemagick

      - name: Mirror DonateWorldz production directory read-only
        shell: bash
        run: |
          set -euo pipefail
          host="$(printf '%s' "$FTP_HOST" | sed -e 's#^ftp[s]*://##' -e 's#/.*$##')"
          if [[ "$host" != *:*:* && "$host" == *:* ]]; then host="${host%%:*}"; fi
          mkdir -p recovered
          cat > "$RUNNER_TEMP/recover.lftp" <<'LFTP'
          set cmd:fail-exit true
          set net:max-retries 2
          set net:timeout 30
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          cd "domains/donateworldz.com/public_html"
          lcd "recovered"
          mirror --verbose --parallel=2 . .
          bye
          LFTP
          timeout 600 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/recover.lftp" "$host"

      - name: Inventory and validate hosted image candidates
        shell: bash
        run: |
          set -euo pipefail
          echo '=== REMOTE FILE INVENTORY ==='
          find recovered -type f -printf '%s\t%p\n' | sort -n
          echo '=== IMAGE CANDIDATES ==='
          find recovered -type f \( -iname '*.avif' -o -iname '*.webp' -o -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' \) -print0 | while IFS= read -r -d '' f; do
            echo "CANDIDATE $(stat -c '%s' "$f") $f"
            identify "$f" 2>&1 || true
            if [[ "$f" == *.avif ]]; then avifdec --info "$f" 2>&1 || true; fi
          done
          echo '=== DONATEWORLDZ NAMED FILES BASE64 ==='
          find recovered -type f \( -iname '*donateworldz*' -o -path '*approved*' \) -print0 | while IFS= read -r -d '' f; do
            case "$f" in
              *.avif|*.webp|*.png|*.jpg|*.jpeg)
                echo "BEGIN_FILE $f $(stat -c '%s' "$f")"
                base64 -w0 "$f"
                echo
                echo "END_FILE $f"
                ;;
            esac
          done

      - name: Upload read-only recovery snapshot
        uses: actions/upload-artifact@v4
        with:
          name: donateworldz-readonly-recovery-${{ github.run_id }}
          path: recovered/
          if-no-files-found: error
          retention-days: 7
