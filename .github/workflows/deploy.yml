name: Deploy OneWorldz Ecosystem
# mission-production-trigger: 2026-09-19-donateworldz-masterpiece-global-v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy.yml"
      - "tools/**"
      - "oneworldz.com/**"
      - "cryptoworldz.xyz/**"
      - "solworldz.xyz/**"
      - "ethworldz.xyz/**"
      - "baseworldz.xyz/**"
      - "bnbworldz.xyz/**"
      - "xrpworldz.xyz/**"
      - "suiworldz.xyz/**"
      - "hyperworldz.xyz/**"
      - "robinworldz.xyz/**"
      - "hodlerworldz.xyz/**"
      - "purplediamondcrew.com/**"
      - "impactbased.oneworldz.com/**"
      - "law.oneworldz.com/**"
      - "learn.oneworldz.com/**"
      - "hodlergalaxy.xyz/**"
      - "foodworldz.com/**"
      - "donateworldz.com/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oneworldz-production-v2
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[cancel-full-deploy]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
    steps:
      - uses: actions/checkout@v4

      - name: Compile mission builders
        run: python3 -m py_compile tools/apply_mission_worldz.py tools/apply_specialist_worldz.py tools/apply_heroes_worldz.py tools/apply_slice_of_hope_visual.py tools/apply_donateworldz_brand.py tools/deploy_hostinger_robust.py tools/prune_public_bloat.py tools/apply_pdc_five_page.py tools/repair_stage_1_writing.py tools/render_all_pages.py tools/full_site_audit_core.py

      - name: Build ecosystem baseline
        run: python3 tools/build_ecosystem.py

      - name: Apply approved visual architecture
        run: python3 tools/apply_visual_fixes.py

      - name: Apply direct Facebook support routes
        run: python3 tools/apply_facebook_support.py

      - name: Permanently remove retired Uganda support content
        run: python3 tools/remove_retired_uganda_support.py

      - name: Apply permanent mobile safety rail
        run: python3 tools/apply_mobile_safety.py

      - name: Apply legacy vision layer
        run: python3 tools/apply_jayjay_vision_57.py

      - name: Build the OneWorldz mission departments
        run: python3 tools/apply_mission_worldz.py

      - name: Build the specialist Worldz departments
        run: python3 tools/apply_specialist_worldz.py

      - name: Build the six approved OneWorldz Heroes and Worldz Live plan
        run: python3 tools/apply_heroes_worldz.py

      - name: Build Slice of Hope visual and floating actions
        run: python3 tools/apply_slice_of_hope_visual.py

      - name: Re-apply mobile safety to newly built mission pages
        run: python3 tools/apply_mobile_safety.py

      - name: "Repair Stage 1/3 — Writing, spacing and clean buttons"
        run: python3 tools/repair_stage_1_writing.py

      - name: "Repair Stage 2/3 — Images and visual integrity"
        run: python3 tools/repair_stage_2_images.py

      - name: "Repair Stage 3/3 — Structure, metadata and other defects"
        run: python3 tools/repair_stage_3_other.py

      - name: "Install global image override LAST on all 18 domains"
        run: python3 tools/apply_global_image_overrides.py

      - name: "Remove brochure-page bloat and hero showroom"
        shell: bash
        run: |
          set +e
          python3 tools/prune_public_bloat.py >prune.out 2>prune.err
          code=$?
          cat prune.out
          if [ "$code" -ne 0 ]; then
            while IFS= read -r line; do echo "::error::$line"; done < prune.err
            exit "$code"
          fi

      - name: "Build Purple Diamond Crew — locked five-page surface"
        run: python3 tools/apply_pdc_five_page.py

      - name: "Lock DonateWorldz masterpiece across the ecosystem LAST"
        run: python3 tools/apply_donateworldz_brand.py

      - name: Validate 18-site contract and retired-content removal
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import urlparse
          from html import unescape

          domains=[d.strip() for d in Path('DOMAINS.txt').read_text().splitlines() if d.strip()]
          assert len(domains)==18 and len(set(domains))==18, domains
          urls=[u.strip() for u in Path('.ecosystem-urls.txt').read_text().splitlines() if u.strip()]
          assert len(urls)==67 and len(urls)==len(set(urls)), (len(urls),len(set(urls)))

          forbidden=('reagan','action spreads smiles','action spread smiles','action creates smiles','196prufjjq')
          for u in urls:
              p=urlparse(u); rel=p.path.strip('/')
              f=Path(p.netloc)/(rel if rel else '')/'index.html'
              assert f.is_file(), (u,f)
              text=f.read_text(encoding='utf-8').lower()
              assert '<meta name="viewport"' in text, f
              assert '/style.css' in text, f
              assert '/mobile-safe.css' in text, f
              assert '<iframe' not in text, f
              assert 'facebook.com/plugins/' not in text, f
              assert 'based.bid' not in text and 'powered by based' not in text, f
              assert not any(token in text for token in forbidden), (f,'retired-content')

          for d in domains:
              css=Path(d)/'mobile-safe.css'
              assert css.is_file(), d
              c=css.read_text(encoding='utf-8')
              assert 'overflow-x:hidden!important' in c and '@media(max-width:720px)' in c, d

          for retired in [
              Path('oneworldz.com/heroes/reagan-kauja'),
              Path('donateworldz.com/reagan-children'),
              Path('oneworldz.com/reagan.png'),
              Path('donateworldz.com/reagan.png'),
              Path('foodworldz.com/reagan.png'),
          ]:
              assert not retired.exists(), retired

          one=Path('oneworldz.com/index.html').read_text(encoding='utf-8')
          one_low=one.lower()
          for forbidden in ('data-final-heroes=', 'class="hero-list"', 'OneWorldz GPT System', 'href="/gpt/"', 'href="/directory/"', 'cryptoworldz', 'hodlerworldz', 'solworldz', 'ethworldz', 'baseworldz', 'jayjayteamdev'):
              assert forbidden.lower() not in one_low, forbidden
          assert 'href="/community-support/"' in one
          assert 'href="/links-in-dubbo/"' in one
          for required in ('End World Hunger', 'ResearchWorldz', 'LawWorldz', 'FoodWorldz', 'DonateWorldz'):
              assert required in one, required
          assert 'data-specialist-worldz="1"' in one
          specialist_routes = [
              'specialist-worldz','waterworldz','growworldz','healthworldz','shelterworldz',
              'educationworldz','energyworldz','wasteworldz','transportworldz','moneyworldz','integrityworldz'
          ]
          for route in specialist_routes:
              p=Path('oneworldz.com')/route/'index.html'
              assert p.is_file(), p
              body=p.read_text(encoding='utf-8')
              assert 'ResearchWorldz' in body and 'LawWorldz' in body and 'data-oneworldz-build=' in body, route

          retired_manifest=Path('.retired-generated-routes.txt')
          assert retired_manifest.is_file()
          for line in retired_manifest.read_text(encoding='utf-8').splitlines():
              if not line.strip(): continue
              host,route=line.split('|',1)
              assert route and not (Path(host)/route/'index.html').exists(), (host,route)

          donate=Path('donateworldz.com/index.html').read_text(encoding='utf-8')
          donate_low=donate.lower()
          assert 'data-donateworldz-brand="masterpiece-v1"' in donate, 'donateworldz-brand-marker'
          assert 'https://donateworldz.com/assets/brand/donateworldz/donateworldz-mark.svg' in donate
          assert Path('donateworldz.com/assets/brand/donateworldz/donateworldz-mark.svg').is_file()
          assert Path('donateworldz.com/site-icon.svg').is_file()
          assert '<svg' in Path('donateworldz.com/site-icon.svg').read_text(encoding='utf-8')
          assert 'Slice of Hope Australia' in donate and 'href="/slice-of-hope-australia/"' in donate
          assert 'donate to jayjayteamdev' in donate_low and 'jayjay-support' in donate_low
          for href in ['/slice-of-hope-australia/','/davis-family/','/community-impact/','/fresh-water-mission/','/grow-food-mission/','/jayjay-support/']:
              assert f'href="{href}"' in donate, href

          slice_page=Path('donateworldz.com/slice-of-hope-australia/index.html').read_text(encoding='utf-8')
          for required in ('data-slice-hope-visual="1"','Donate Now','Volunteer','Partner With Us','/fresh-water-mission/','/grow-food-mission/','Pizza Hut Australia has not yet approved'):
              assert required in slice_page, required

          food=unescape(Path('foodworldz.com/index.html').read_text(encoding='utf-8'))
          for required in ('Food Rescue','Food Safety','Storage & Cold Chain','Shipping & Logistics','Food Waste','Food Law'):
              assert required in food, required

          law=Path('law.oneworldz.com/index.html').read_text(encoding='utf-8')
          for required in ('LawWorldz','Change the Law','Public Money','Integrity','Model Laws'):
              assert required in law, required

          research=Path('learn.oneworldz.com/index.html').read_text(encoding='utf-8')
          for required in ('ResearchWorldz','Country Research','Best Practice','Evidence Brief','Send to LawWorldz'):
              assert required in research, required

          visual_roots = {
            'oneworldz.com/index.html':'OneWorldz',
            'learn.oneworldz.com/index.html':'ResearchWorldz',
            'law.oneworldz.com/index.html':'LawWorldz',
            'foodworldz.com/index.html':'FoodWorldz',
            'donateworldz.com/index.html':'DonateWorldz',
          }
          for path,label in visual_roots.items():
              body=Path(path).read_text(encoding='utf-8')
              assert 'data-verified-identity="text-first"' in body, (label,'verified-text-first-identity')
              assert '<img class="hero-art" src="/hero.png"' not in body, (label,'stale-generic-root-hero')
          crypto_root=Path('cryptoworldz.xyz/index.html').read_text(encoding='utf-8')
          assert 'data-verified-identity="cryptoworldz-text-first"' in crypto_root
          assert '<img class="hero-art" src="/hero.png"' not in crypto_root
          assert '<img class="hero-art" src="/command-centre-five.png"' not in crypto_root
          mobile_css=Path('cryptoworldz.xyz/mobile-safe.css').read_text(encoding='utf-8')
          assert 'overflow-x:auto!important' in mobile_css and 'flex-wrap:nowrap!important' in mobile_css
          assert '@media(max-width:360px){.nav{grid-template-columns:1fr!important}}' not in mobile_css

          community_one=Path('oneworldz.com/community-support/index.html').read_text(encoding='utf-8')
          community_donate=Path('donateworldz.com/community-impact/index.html').read_text(encoding='utf-8')
          assert community_one.count('https://www.facebook.com/share/')==35
          assert community_donate.count('https://www.facebook.com/share/')==35

          dubbo=Path('oneworldz.com/links-in-dubbo/index.html').read_text(encoding='utf-8')
          for required in (
              'https://stride.com.au/services/dubbo-medicare-mental-health-centre/',
              'https://www.oranasupport.com.au',
              'https://www.emmanuelcarecentre.com.au/',
              'https://ccsd.org.au/',
              'https://baptistcare.org.au/hopestreet/locations/dubbo/',
              'https://bunmabunmarra.com.au',
              'https://www.miraclechurch.com.au',
              'https://www.salvationarmy.org.au/orana/',
              'https://www.dubbobaptist.org.au/',
          ):
              assert required in dubbo, ('links-in-dubbo',required)


          hero_routes = [
              'heroes',
              'heroes/just-knate',
              'heroes/victor-good-boss',
              'heroes/sam-weidenhofer',
              'heroes/bi-phakathi',
              'heroes/mdmotivator',
              'heroes/dylan-thiry',
              'heroes/destination-inspiration',
          ]
          for route in hero_routes:
              p=Path('oneworldz.com')/route/'index.html'
              assert p.is_file(), ('hero-route',route)
              body=p.read_text(encoding='utf-8')
              assert 'data-oneworldz-heroes=' in body, route
          heroes_home=Path('oneworldz.com/heroes/index.html').read_text(encoding='utf-8')
          for required in ('Just Knate','Victor — The Good Boss','Sam Weidenhofer','Bi Phakathi','MDMotivator','Dylan Thiry','Purple Diamond Crew','Worldz Live'):
              assert required in heroes_home, ('heroes',required)
          for retired_hero in ('heroes/reagan-kauja','heroes/bob-roofer','heroes/solmotivator'):
              assert not (Path('oneworldz.com')/retired_hero/'index.html').exists(), ('retired-hero',retired_hero)
          event=Path('oneworldz.com/heroes/destination-inspiration/index.html').read_text(encoding='utf-8')
          for required in ('Open invitation to P!NK','Uganda Pilot','direct humanitarian funds','UNDP 2025 MPI Data'):
              assert required in event, ('worldz-live',required)

          support={
            'davis':('donateworldz.com/davis-family/index.html','https://www.facebook.com/share/165Ken5f2Bt/'),
            'jayjay':('donateworldz.com/jayjay-support/index.html','https://buy.stripe.com/6oUeVd9tU0Ktewm0Xb0kE00'),
          }
          for name,(path,url) in support.items():
              text=Path(path).read_text(encoding='utf-8')
              assert url in text and '<iframe' not in text.lower(), name

          print(f'CONTRACT=PASS sites=18 pages={len(urls)} mission_system=1 specialist_worldz=10 researchworldz=1 lawworldz=1 foodworldz=1 water_mission=1 jayjay_vision_support=1 community_links=35 core_style=1')
          PY

      - name: Audit every page, stylesheet and image before deployment
        shell: bash
        run: |
          set +e
          python3 tools/full_site_audit.py --static >audit.out 2>&1
          code=$?
          cat audit.out
          if [ "$code" -ne 0 ]; then
            head -n 120 audit.out | while IFS= read -r line; do echo "::error::$line"; done
            exit "$code"
          fi

      - name: Render every page on mobile and desktop before deployment
        run: python3 tools/full_site_audit.py --render

      - name: Deploy all 18 Hostinger destinations with per-site reconnect and retry
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/deploy_hostinger_robust.py

      - name: Verify every public page, style, image and retired URL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import concurrent.futures,time,urllib.request,urllib.error
          from pathlib import Path
          urls=[u.strip() for u in Path('.ecosystem-urls.txt').read_text().splitlines() if u.strip()]
          forbidden=('reagan','action spreads smiles','action spread smiles','action creates smiles','196prufjjq')
          def get(u):
              req=urllib.request.Request(u,headers={'User-Agent':'OneWorldz-Live-Verify/5.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=25) as r:return r.status,r.read().decode('utf-8','ignore')
          def check(u):
              last=''
              for a in range(4):
                  try:
                      status,body=get(u); low=body.lower()
                      ok=status==200 and 'data-oneworldz-build=' in body and '/style.css' in body and '/mobile-safe.css' in body and '<iframe' not in low and not any(x in low for x in forbidden)
                      if ok:return u,True,''
                      last=f'status={status} retired={any(x in low for x in forbidden)}'
                  except Exception as e:last=repr(e)
                  time.sleep(3+a*2)
              return u,False,last
          fails=[]
          with concurrent.futures.ThreadPoolExecutor(max_workers=12) as ex:
              for r in ex.map(check,urls):
                  print('LIVE PASS' if r[1] else 'LIVE FAIL',r[0],r[2])
                  if not r[1]: fails.append(r)
          if fails: raise SystemExit(f'LIVE_VERIFICATION_FAILED count={len(fails)} {fails[:5]}')
          for u in ['https://oneworldz.com/heroes/reagan-kauja/','https://donateworldz.com/reagan-children/','https://oneworldz.com/reagan.png','https://donateworldz.com/reagan.png','https://foodworldz.com/reagan.png']:
              try:
                  status,body=get(u)
                  raise SystemExit(f'RETIRED_URL_STILL_LIVE {u} status={status}')
              except urllib.error.HTTPError as e:
                  assert e.code in (404,410), (u,e.code)
                  print('RETIRED URL GONE',u,e.code)

          # Every generic brochure route removed from the build must also be gone live.
          retired_manifest=Path('.retired-generated-routes.txt')
          for line in retired_manifest.read_text(encoding='utf-8').splitlines():
              if not line.strip(): continue
              host,route=line.split('|',1)
              u=f'https://{host}/{route.strip("/")}/'
              try:
                  status,body=get(u)
                  raise SystemExit(f'BLOAT_URL_STILL_LIVE {u} status={status}')
              except urllib.error.HTTPError as e:
                  assert e.code in (404,410), (u,e.code)
          specials={
            'https://donateworldz.com/slice-of-hope-australia/':('data-slice-hope-visual="1"',1),
            'https://donateworldz.com/davis-family/':('https://www.facebook.com/share/165Ken5f2Bt/',1),
            'https://donateworldz.com/fresh-water-mission/':('Offer equipment or expertise',1),
            'https://donateworldz.com/grow-food-mission/':('Offer tools, seed, trees or expertise',1),
            'https://donateworldz.com/jayjay-support/':('https://buy.stripe.com/6oUeVd9tU0Ktewm0Xb0kE00',1),
            'https://donateworldz.com/community-impact/':('https://www.facebook.com/share/',35),
            'https://oneworldz.com/community-support/':('https://www.facebook.com/share/',35),
          }
          for u,(needle,count) in specials.items():
              status,body=get(u); assert status==200 and body.count(needle)==count,(u,body.count(needle),count)
          status,dubbo_body=get('https://oneworldz.com/links-in-dubbo/')
          assert status==200, ('links-in-dubbo',status)
          for required in (
              'https://stride.com.au/services/dubbo-medicare-mental-health-centre/',
              'https://www.oranasupport.com.au',
              'https://www.emmanuelcarecentre.com.au/',
              'https://ccsd.org.au/',
              'https://baptistcare.org.au/hopestreet/locations/dubbo/',
              'https://bunmabunmarra.com.au',
              'https://www.miraclechurch.com.au',
              'https://www.salvationarmy.org.au/orana/',
              'https://www.dubbobaptist.org.au/',
          ):
              assert required in dubbo_body, ('links-in-dubbo-live',required)
          status,brand_home=get('https://donateworldz.com/')
          assert 'data-donateworldz-brand="masterpiece-v1"' in brand_home
          assert 'assets/brand/donateworldz/' in brand_home
          req=urllib.request.Request('https://donateworldz.com/site-icon.svg?brand=1',headers={'User-Agent':'OneWorldz-Live-Verify/5.0','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=25) as r:
              icon_svg=r.read().decode('utf-8','ignore')
              assert r.status==200 and '<svg' in icon_svg and 'DonateWorldz' in icon_svg
          req=urllib.request.Request('https://donateworldz.com/assets/brand/donateworldz/donateworldz-mark.svg?brand=1',headers={'User-Agent':'OneWorldz-Live-Verify/5.0','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=25) as r:
              brand_svg=r.read().decode('utf-8','ignore')
              assert r.status==200 and '<svg' in brand_svg and 'DonateWorldz' in brand_svg
          status,body=get('https://donateworldz.com/slice-of-hope-australia/')
          for needle in ('https://donate.stripe.com/14A6oHcG61Ox87Y0Xb0kE01','Volunteer','Partner With Us','Fresh Water Mission','Grow Food Mission','Pizza Hut Australia has not yet approved'):
              assert needle in body, ('slice-of-hope',needle)
          print(f'FINAL=PASS pages={len(urls)} sites=18 mission_system=1 specialist_worldz=10 researchworldz=1 lawworldz=1 foodworldz=1 water_mission=1 jayjay_vision_support=1 core_style=1')
          PY
          python3 tools/full_site_audit.py --live
