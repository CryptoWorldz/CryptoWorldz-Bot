name: Deploy OneWorldz Ecosystem

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy.yml"
      - "oneworldz.com/**"
      - "cryptoworldz.xyz/**"
      - "solworldz.xyz/**"
      - "ethworldz.xyz/**"
      - "baseworldz.xyz/**"
      - "bnbworldz.xyz/**"
      - "xrpworldz.xyz/**"
      - "suiworldz.xyz/**"
      - "hyperworldz.xyz/**"
      - "robinworldz.xyz/**"
      - "hodlerworldz.xyz/**"
      - "purplediamondcrew.com/**"
      - "impactbased.oneworldz.com/**"
      - "law.oneworldz.com/**"
      - "learn.oneworldz.com/**"
      - "hodlergalaxy.xyz/**"
      - "foodworldz.com/**"
      - "donateworldz.com/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oneworldz-ecosystem-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate the clean 18-site build
        shell: bash
        run: |
          set -euo pipefail
          sites=(oneworldz.com cryptoworldz.xyz solworldz.xyz ethworldz.xyz baseworldz.xyz bnbworldz.xyz xrpworldz.xyz suiworldz.xyz hyperworldz.xyz robinworldz.xyz hodlerworldz.xyz purplediamondcrew.com impactbased.oneworldz.com law.oneworldz.com learn.oneworldz.com hodlergalaxy.xyz foodworldz.com donateworldz.com)
          for site in "${sites[@]}"; do
            test -f "$site/index.html"
            test -f "$site/style.css"
            grep -q 'data-oneworldz-build="2026-09-03"' "$site/index.html"
          done
          ! grep -RniE 'https?://[^" ]*based\.bid|powered by[[:space:]]+based' --include='*.html' --include='*.css' .
          grep -q 'ImpactBased LaunchPad' impactbased.oneworldz.com/index.html
          grep -q 'Hope Chest 1927' purplediamondcrew.com/index.html
          grep -q 'Open Command Centre' cryptoworldz.xyz/index.html
          echo 'BUILD=PASS sites=18'

      - name: Deploy once to the 18 Hostinger destinations
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, ssl
          from ftplib import FTP_TLS, error_perm
          from pathlib import Path, PurePosixPath

          host = os.environ['FTP_HOST']
          user = os.environ['FTP_USERNAME']
          password = os.environ['FTP_PASSWORD']
          port = int(os.environ.get('FTP_PORT', '21'))
          targets = {
              'oneworldz.com': 'domains/oneworldz.com/public_html',
              'cryptoworldz.xyz': 'domains/cryptoworldz.xyz/public_html',
              'solworldz.xyz': 'domains/solworldz.xyz/public_html',
              'ethworldz.xyz': 'domains/ethworldz.xyz/public_html',
              'baseworldz.xyz': 'domains/baseworldz.xyz/public_html',
              'bnbworldz.xyz': 'domains/bnbworldz.xyz/public_html',
              'xrpworldz.xyz': 'domains/xrpworldz.xyz/public_html',
              'suiworldz.xyz': 'domains/suiworldz.xyz/public_html',
              'hyperworldz.xyz': 'domains/hyperworldz.xyz/public_html',
              'robinworldz.xyz': 'domains/robinworldz.xyz/public_html',
              'hodlerworldz.xyz': 'domains/hodlerworldz.xyz/public_html',
              'purplediamondcrew.com': 'domains/purplediamondcrew.com/public_html',
              'impactbased.oneworldz.com': 'domains/oneworldz.com/public_html/impactbased',
              'law.oneworldz.com': 'domains/oneworldz.com/public_html/law',
              'learn.oneworldz.com': 'domains/oneworldz.com/public_html/learn',
              'hodlergalaxy.xyz': 'domains/hodlergalaxy.xyz/public_html',
              'foodworldz.com': 'domains/foodworldz.com/public_html',
              'donateworldz.com': 'domains/donateworldz.com/public_html',
          }

          context = ssl._create_unverified_context()
          ftp = FTP_TLS(context=context)
          ftp.connect(host, port, timeout=45)
          ftp.login(user, password)
          ftp.prot_p()
          ftp.set_pasv(True)

          def ensure_dir(remote_dir):
              ftp.cwd('/')
              for part in PurePosixPath(remote_dir).parts:
                  if part in ('', '/'):
                      continue
                  try:
                      ftp.cwd(part)
                  except error_perm:
                      ftp.mkd(part)
                      ftp.cwd(part)

          for local_name, remote_root in targets.items():
              local_root = Path(local_name)
              files = sorted(p for p in local_root.rglob('*') if p.is_file())
              for file in files:
                  rel = file.relative_to(local_root).as_posix()
                  remote_file = PurePosixPath(remote_root) / rel
                  ensure_dir(str(remote_file.parent))
                  with file.open('rb') as fh:
                      ftp.storbinary(f'STOR {remote_file.name}', fh, blocksize=262144)
              print(f'DEPLOYED {local_name} files={len(files)} -> {remote_root}')

          ftp.quit()
          print('HOSTINGER_DEPLOY=PASS sites=18')
          PY

      - name: Verify the 18 public sites
        shell: bash
        run: |
          set -euo pipefail
          hosts=(oneworldz.com cryptoworldz.xyz solworldz.xyz ethworldz.xyz baseworldz.xyz bnbworldz.xyz xrpworldz.xyz suiworldz.xyz hyperworldz.xyz robinworldz.xyz hodlerworldz.xyz purplediamondcrew.com impactbased.oneworldz.com law.oneworldz.com learn.oneworldz.com hodlergalaxy.xyz foodworldz.com donateworldz.com)
          for host in "${hosts[@]}"; do
            ok=0
            for attempt in 1 2 3 4; do
              body="$(curl -fsSL --max-time 25 "https://$host/" || true)"
              if grep -q 'data-oneworldz-build="2026-09-03"' <<<"$body"; then ok=1; break; fi
              sleep 4
            done
            test "$ok" = 1
            echo "LIVE PASS https://$host/"
          done
          echo 'FINAL=PASS sites=18'
