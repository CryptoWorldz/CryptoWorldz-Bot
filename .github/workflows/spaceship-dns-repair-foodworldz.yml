name: Repair FoodWorldz DNS via Spaceship API

on:
  push:
    branches: [main]
    paths:
      - 'deployments/spaceship-dns-repair-foodworldz.request'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SPACESHIP_API_KEY: ${{ secrets.SPACESHIP_API_KEY }}
      SPACESHIP_API_SECRET: ${{ secrets.SPACESHIP_API_SECRET }}
      TARGET_DOMAIN: foodworldz.com
      HOSTINGER_IPV4: 145.223.108.40
    steps:
      - name: Confirm Spaceship credentials are wired
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SPACESHIP_API_KEY"
          test -n "$SPACESHIP_API_SECRET"
          echo 'Spaceship API credentials are available to Actions.'

      - name: Prove FoodWorldz registrar ownership and capture current state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/spaceship-food"
          base='https://spaceship.dev/api'
          curl --fail --silent --show-error \
            -H "X-API-Key: $SPACESHIP_API_KEY" \
            -H "X-API-Secret: $SPACESHIP_API_SECRET" \
            "$base/v1/domains/$TARGET_DOMAIN" \
            | tee "$RUNNER_TEMP/spaceship-food/domain-before.json"
          jq -e --arg d "$TARGET_DOMAIN" '.name==$d and .lifecycleStatus=="registered"' \
            "$RUNNER_TEMP/spaceship-food/domain-before.json" >/dev/null

      - name: Read staged Spaceship DNS records before nameserver change
        shell: bash
        run: |
          set -euo pipefail
          base='https://spaceship.dev/api'
          curl --fail --silent --show-error \
            -H "X-API-Key: $SPACESHIP_API_KEY" \
            -H "X-API-Secret: $SPACESHIP_API_SECRET" \
            "$base/v1/dns/records/$TARGET_DOMAIN?take=500&skip=0" \
            | tee "$RUNNER_TEMP/spaceship-food/records-before.json"

      - name: Switch FoodWorldz to Spaceship basic authoritative DNS
        shell: bash
        run: |
          set -euo pipefail
          base='https://spaceship.dev/api'
          provider="$(jq -r '.nameservers.provider // empty' "$RUNNER_TEMP/spaceship-food/domain-before.json")"
          if [ "$provider" = 'basic' ]; then
            echo 'FoodWorldz already uses Spaceship basic nameservers.'
            exit 0
          fi
          code="$(curl --silent --show-error --request PUT \
            -H "X-API-Key: $SPACESHIP_API_KEY" \
            -H "X-API-Secret: $SPACESHIP_API_SECRET" \
            -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data '{"provider":"basic"}' \
            -o "$RUNNER_TEMP/spaceship-food/nameserver-update.json" -w '%{http_code}' \
            "$base/v1/domains/$TARGET_DOMAIN/nameservers" || true)"
          echo "Spaceship nameserver update HTTP $code"
          cat "$RUNNER_TEMP/spaceship-food/nameserver-update.json" 2>/dev/null || true
          echo
          test "$code" = '200'

      - name: Save exact FoodWorldz web DNS records in Spaceship
        shell: bash
        run: |
          set -euo pipefail
          base='https://spaceship.dev/api'
          payload="$(jq -n --arg ip "$HOSTINGER_IPV4" '{force:true,items:[{type:"A",address:$ip,name:"@",ttl:300},{type:"CNAME",cname:"foodworldz.com",name:"www",ttl:300}]}')"
          printf '%s\n' "$payload" | tee "$RUNNER_TEMP/spaceship-food/proposed-records.json"
          code="$(curl --silent --show-error --request PUT \
            -H "X-API-Key: $SPACESHIP_API_KEY" \
            -H "X-API-Secret: $SPACESHIP_API_SECRET" \
            -H 'Content-Type: application/json' -H 'Accept: application/json' \
            --data "$payload" \
            -o "$RUNNER_TEMP/spaceship-food/records-save-response.txt" -w '%{http_code}' \
            "$base/v1/dns/records/$TARGET_DOMAIN" || true)"
          echo "Spaceship DNS save HTTP $code"
          cat "$RUNNER_TEMP/spaceship-food/records-save-response.txt" 2>/dev/null || true
          echo
          test "$code" = '204'

      - name: Prove registrar state and exact staged records
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          base='https://spaceship.dev/api'
          curl --fail --silent --show-error \
            -H "X-API-Key: $SPACESHIP_API_KEY" \
            -H "X-API-Secret: $SPACESHIP_API_SECRET" \
            "$base/v1/domains/$TARGET_DOMAIN" \
            | tee "$RUNNER_TEMP/spaceship-food/domain-after.json"
          curl --fail --silent --show-error \
            -H "X-API-Key: $SPACESHIP_API_KEY" \
            -H "X-API-Secret: $SPACESHIP_API_SECRET" \
            "$base/v1/dns/records/$TARGET_DOMAIN?take=500&skip=0" \
            | tee "$RUNNER_TEMP/spaceship-food/records-after.json"
          jq -e '.nameservers.provider=="basic"' "$RUNNER_TEMP/spaceship-food/domain-after.json" >/dev/null
          jq -e --arg ip "$HOSTINGER_IPV4" '.items[] | select(.type=="A" and .name=="@" and .address==$ip)' "$RUNNER_TEMP/spaceship-food/records-after.json" >/dev/null
          jq -e '.items[] | select(.type=="CNAME" and .name=="www" and .cname=="foodworldz.com")' "$RUNNER_TEMP/spaceship-food/records-after.json" >/dev/null
          jq -r '.nameservers.hosts[]' "$RUNNER_TEMP/spaceship-food/domain-after.json" > "$RUNNER_TEMP/spaceship-food/expected-ns.txt"
          echo 'Spaceship control-plane proof passed.'

      - name: Wait for public nameserver and A-record propagation
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            ns="$(dig +short NS "$TARGET_DOMAIN" | sed 's/\.$//' | sort)"
            expected="$(sort "$RUNNER_TEMP/spaceship-food/expected-ns.txt")"
            public_ip="$(dig +short A "$TARGET_DOMAIN" | grep -E '^[0-9.]+$' | head -n1 || true)"
            if [ "$ns" = "$expected" ] && [ "$public_ip" = "$HOSTINGER_IPV4" ]; then
              echo "Public DNS live: $TARGET_DOMAIN -> $public_ip"
              exit 0
            fi
            echo "Waiting for registrar/DNS propagation ($attempt/60)..."
            sleep 30
          done
          echo '::warning::Spaceship control plane is correct; public DNS propagation is still pending.'

      - name: Check FoodWorldz HTTPS readiness
        shell: bash
        run: |
          set -euo pipefail
          if curl --fail --silent --show-error --head --connect-timeout 10 --max-time 20 "https://$TARGET_DOMAIN/" >/dev/null; then
            echo 'FoodWorldz HTTPS is responding.'
          else
            echo '::warning::FoodWorldz DNS control is configured but HTTPS/SSL is not ready yet.'
          fi

      - name: Upload repair evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: spaceship-foodworldz-dns-${{ github.run_id }}
          path: ${{ runner.temp }}/spaceship-food/
          if-no-files-found: warn
          retention-days: 14
