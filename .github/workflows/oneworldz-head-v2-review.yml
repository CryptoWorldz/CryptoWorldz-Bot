name: OneWorldz Head V2 Review Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'apps/oneworldz-ecosystem-release/oneworldz-head-v2.mjs'
      - 'apps/oneworldz-ecosystem-release/build-oneworldz-head-v2.mjs'
      - 'apps/oneworldz-ecosystem-release/source/head-v2.css'
      - 'apps/oneworldz-ecosystem-release/source/assets/desktop/oneworldz-v2/**'
      - 'apps/oneworldz-ecosystem-release/source/assets/mobile/oneworldz-v2/**'
      - 'apps/oneworldz-ecosystem-release/package.json'
      - '.github/workflows/oneworldz-head-v2-review.yml'

permissions:
  contents: read

jobs:
  review-build:
    name: Build OneWorldz V2 review package only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Confirm production deployment is impossible in this workflow
        run: |
          set -euo pipefail
          test ! -n "${FTP_HOST:-}"
          test ! -n "${FTP_USERNAME:-}"
          test ! -n "${FTP_PASSWORD:-}"
          ! grep -Eq 'lftp|ftp-deploy|rsync|scp|ssh|curl.*upload' .github/workflows/oneworldz-head-v2-review.yml
      - name: Build isolated OneWorldz V2 review package
        working-directory: apps/oneworldz-ecosystem-release
        run: npm run build:oneworldz-v2
      - name: Prove review-only guard
        run: |
          set -euo pipefail
          root='apps/oneworldz-ecosystem-release/dist/oneworldz-head-v2'
          test -s "$root/index.html"
          test -s "$root/REVIEW-ONLY.txt"
          grep -Fq 'NO PRODUCTION DEPLOYMENT AUTHORIZED' "$root/REVIEW-ONLY.txt"
          grep -Fq 'https://learn.oneworldz.com' "$root/index.html"
          grep -Fq 'https://law.oneworldz.com' "$root/index.html"
          grep -Fq 'https://impactbased.oneworldz.com' "$root/index.html"
      - name: Upload V2 review artifact
        uses: actions/upload-artifact@v4
        with:
          name: oneworldz-head-v2-review-${{ github.run_id }}
          path: apps/oneworldz-ecosystem-release/dist/oneworldz-head-v2
          if-no-files-found: error
          retention-days: 7
