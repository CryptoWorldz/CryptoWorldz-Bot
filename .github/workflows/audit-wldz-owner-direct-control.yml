name: Audit WLDZ Owner Direct Control

on:
  push:
    branches: [main]
    paths:
      - "worldzpad-mainnet/scripts/audit-wldz-owner-direct-control.mjs"
      - ".github/workflows/audit-wldz-owner-direct-control.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worldzpad-mainnet
    env:
      SOLANA_RPC_URL: https://hknymhhyqldtzmplzuzh.supabase.co/functions/v1/worldz-solana-rpc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned SDKs
        run: npm install --no-audit --no-fund
      - name: Audit direct owner control
        run: node scripts/audit-wldz-owner-direct-control.mjs
