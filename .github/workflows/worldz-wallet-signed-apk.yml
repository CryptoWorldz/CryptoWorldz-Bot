name: Worldz Wallet Signed APK Candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: worldz-wallet-release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Require signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.WORLDZ_WALLET_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.WORLDZ_WALLET_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WORLDZ_WALLET_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WORLDZ_WALLET_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/worldz-wallet-release.keystore"
          test -s "$RUNNER_TEMP/worldz-wallet-release.keystore"
      - name: Install SDK and Gradle
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
          curl --fail --location --silent --show-error --retry 3 https://services.gradle.org/distributions/gradle-8.13-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo "20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  $RUNNER_TEMP/gradle.zip" | sha256sum --check --
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Compile unsigned release APK
        working-directory: apps/worldz-wallet-android
        run: gradle :app:assembleRelease --no-daemon
      - name: Sign and verify APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.WORLDZ_WALLET_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WORLDZ_WALLET_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WORLDZ_WALLET_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS="$ANDROID_SDK_ROOT/build-tools/36.0.0"
          OUT="$RUNNER_TEMP/worldz-wallet-release"
          mkdir -p "$OUT"
          INPUT="apps/worldz-wallet-android/app/build/outputs/apk/release/app-release-unsigned.apk"
          "$BUILD_TOOLS/zipalign" -v -p 4 "$INPUT" "$OUT/worldz-wallet-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/worldz-wallet-release.keystore" \
            --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD --out "$OUT/worldz-wallet-release.apk" "$OUT/worldz-wallet-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$OUT/worldz-wallet-release.apk"
          sha256sum "$OUT/worldz-wallet-release.apk" > "$OUT/SHA256SUMS.txt"
          rm -f "$RUNNER_TEMP/worldz-wallet-release.keystore"
      - name: Upload signed release candidate (not public release)
        uses: actions/upload-artifact@v4
        with:
          name: worldz-wallet-signed-release-candidate
          path: |
            ${{ runner.temp }}/worldz-wallet-release/worldz-wallet-release.apk
            ${{ runner.temp }}/worldz-wallet-release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
