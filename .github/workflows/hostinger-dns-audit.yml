name: Hostinger DNS Audit — FoodWorldz + DonateWorldz

on:
  push:
    branches: [main]
    paths:
      - 'deployments/hostinger-dns-audit.request'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - name: Confirm Hostinger API token is wired
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_API_TOKEN"
          echo "Hostinger API token is available to Actions."

      - name: Audit Hostinger DNS and hosting state
        shell: bash
        run: |
          set -euo pipefail
          api='https://developers.hostinger.com'
          auth="Authorization: Bearer $HOSTINGER_API_TOKEN"
          mkdir -p "$RUNNER_TEMP/hostinger-audit"

          for domain in donateworldz.com foodworldz.com; do
            echo "===== $domain : DNS ZONE ====="
            curl --fail --silent --show-error \
              -H "$auth" -H 'Accept: application/json' \
              "$api/api/dns/v1/zones/$domain" \
              | tee "$RUNNER_TEMP/hostinger-audit/${domain}-dns.json"
            echo

            echo "===== $domain : DOMAIN PORTFOLIO ====="
            curl --fail --silent --show-error \
              -H "$auth" -H 'Accept: application/json' \
              "$api/api/domains/v1/portfolio/$domain" \
              | tee "$RUNNER_TEMP/hostinger-audit/${domain}-portfolio.json" || true
            echo

            echo "===== $domain : HOSTING WEBSITE ====="
            curl --fail --silent --show-error --get \
              -H "$auth" -H 'Accept: application/json' \
              --data-urlencode "domain=$domain" \
              "$api/api/hosting/v1/websites" \
              | tee "$RUNNER_TEMP/hostinger-audit/${domain}-website.json"
            echo

            echo "===== $domain : PUBLIC DNS ====="
            echo 'A:'
            dig +short A "$domain" || true
            echo 'AAAA:'
            dig +short AAAA "$domain" || true
            echo 'NS:'
            dig +short NS "$domain" || true
            echo 'www:'
            dig +short CNAME "www.$domain" || true
            dig +short A "www.$domain" || true

            echo "===== $domain : HTTPS ====="
            curl --silent --show-error --location --head \
              --connect-timeout 10 --max-time 20 \
              "https://$domain/" || true
            echo
          done

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-dns-audit-${{ github.run_id }}
          path: ${{ runner.temp }}/hostinger-audit/
          if-no-files-found: error
          retention-days: 7
