name: Repository Hygiene Audit
# Triggered after Actions artifact backlog cleanup

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/repo-hygiene-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Audit tracked repository files
        shell: bash
        run: |
          python - <<'PY'
          import os, re, json, hashlib
          from pathlib import Path
          from collections import defaultdict, Counter

          root = Path(".")
          skip_dirs = {".git", "node_modules", ".next", "dist", "build"}
          media_ext = {".png",".jpg",".jpeg",".webp",".gif",".svg",".ico",".avif",".mp3",".m4a",".wav",".mp4",".mov"}
          text_ext = {
              ".html",".css",".js",".mjs",".cjs",".ts",".tsx",".jsx",".json",".md",".yml",".yaml",
              ".py",".sh",".txt",".xml",".php",".sql",".example",".gitignore",".marker",".b64"
          }

          files=[]
          for p in root.rglob("*"):
              if not p.is_file():
                  continue
              if any(part in skip_dirs for part in p.parts):
                  continue
              rel=p.as_posix().lstrip("./")
              try: size=p.stat().st_size
              except: size=0
              files.append((p,rel,size))

          text_cache={}
          for p,rel,size in files:
              if p.suffix.lower() in text_ext or p.name in {".gitignore",".env.example"}:
                  try:
                      text_cache[rel]=p.read_text(encoding="utf-8", errors="ignore")
                  except Exception:
                      pass

          def top_scope(rel):
              return rel.split("/",1)[0] if "/" in rel else ""

          def referenced(rel):
              p=Path(rel)
              base=p.name
              scope=top_scope(rel)
              scoped_rel=rel.split("/",1)[1] if "/" in rel else rel
              needles={rel, scoped_rel, base, "./"+base, "/"+base}
              for tpath,txt in text_cache.items():
                  if tpath == rel:
                      continue
                  # Prefer same-site/domain references for generic basenames such as hero.png.
                  same_scope = top_scope(tpath)==scope
                  for n in needles:
                      if not n:
                          continue
                      if n in {base,"./"+base,"/"+base} and base.lower()=="hero.png" and not same_scope:
                          continue
                      if n in txt:
                          return True, tpath, n
              return False, None, None

          media=[]
          for p,rel,size in files:
              if p.suffix.lower() in media_ext:
                  ref,by,needle=referenced(rel)
                  media.append({"path":rel,"size":size,"referenced":ref,"reference_file":by,"needle":needle})

          # Exact duplicate file content.
          sha_groups=defaultdict(list)
          for p,rel,size in files:
              try:
                  h=hashlib.sha256(p.read_bytes()).hexdigest()
                  sha_groups[(h,size)].append(rel)
              except Exception:
                  pass
          duplicates=[]
          for (h,size),paths in sha_groups.items():
              if len(paths)>1:
                  duplicates.append({"size":size,"count":len(paths),"wasted_bytes":size*(len(paths)-1),"paths":paths})
          duplicates.sort(key=lambda x:x["wasted_bytes"], reverse=True)

          suspicious_patterns = re.compile(r"(\.b64$|(^|/)(tmp|temp|backup|backups|archive|archives|generated|artifacts?|screenshots?|test-output|results?)(/|$)|\.bak$|\.old$|~$)", re.I)
          suspicious=[]
          for p,rel,size in files:
              if suspicious_patterns.search(rel):
                  ref,by,needle=referenced(rel)
                  suspicious.append({"path":rel,"size":size,"referenced":ref,"reference_file":by})

          # Large tracked blobs.
          largest=sorted(
              [{"path":rel,"size":size} for p,rel,size in files],
              key=lambda x:x["size"], reverse=True
          )[:80]

          # Site/domain roots and file counts.
          roots=Counter()
          root_bytes=Counter()
          for p,rel,size in files:
              key=top_scope(rel) or "(root)"
              roots[key]+=1
              root_bytes[key]+=size

          report={
              "summary":{
                  "tracked_files":len(files),
                  "tracked_bytes":sum(s for _,_,s in files),
                  "media_files":len(media),
                  "unreferenced_media":sum(1 for x in media if not x["referenced"]),
                  "duplicate_groups":len(duplicates),
                  "suspicious_files":len(suspicious),
              },
              "unreferenced_media":[x for x in media if not x["referenced"]],
              "referenced_media":[x for x in media if x["referenced"]],
              "duplicates":duplicates[:100],
              "suspicious":suspicious,
              "largest":largest,
              "roots":[{"root":k,"files":roots[k],"bytes":root_bytes[k]} for k in sorted(roots)],
          }
          print("REPO_HYGIENE_JSON_BEGIN")
          print(json.dumps(report, indent=2))
          print("REPO_HYGIENE_JSON_END")
          PY

      - name: Deep clutter classification
        shell: bash
        run: |
          python - <<'PY'
          import re, json
          from pathlib import Path

          text_ext={".html",".css",".js",".mjs",".cjs",".ts",".tsx",".jsx",".json",".md",".yml",".yaml",".py",".sh",".txt",".xml",".php",".sql"}
          texts={}
          for p in Path(".").rglob("*"):
              if p.is_file() and ".git" not in p.parts and p.suffix.lower() in text_ext:
                  try: texts[p.as_posix()]=p.read_text(encoding="utf-8",errors="ignore")
                  except: pass

          workflows=[]
          wfdir=Path(".github/workflows")
          for p in sorted(list(wfdir.glob("*.yml"))+list(wfdir.glob("*.yaml"))):
              txt=texts.get(p.as_posix(),"")
              triggers={
                  "dispatch":"workflow_dispatch:" in txt,
                  "schedule":bool(re.search(r"(?m)^\s*schedule\s*:",txt)),
                  "push":bool(re.search(r"(?m)^\s*push\s*:",txt)),
                  "pull_request":bool(re.search(r"(?m)^\s*pull_request\s*:",txt)),
              }
              manual_only=triggers["dispatch"] and not any(triggers[k] for k in ("schedule","push","pull_request"))
              oneoff_name=bool(re.search(r"(diagnos|repair|restore|probe|proof|audit|emergency)",p.name,re.I))
              workflows.append({
                  "path":p.as_posix(),
                  "bytes":p.stat().st_size,
                  "triggers":triggers,
                  "manual_only":manual_only,
                  "oneoff_name":oneoff_name,
                  "cleanup_candidate":manual_only and oneoff_name and p.name not in {"repo-hygiene-audit.yml"}
              })

          root_candidates=[]
          for p in Path(".").iterdir():
              if not p.is_file(): continue
              if not re.search(r"(AUDIT|VERIFY|FIX|REPAIR|V\d+|FINAL|OLD|BACKUP)",p.name,re.I): continue
              rel=p.as_posix()
              base=p.name
              refs=[]
              for tpath,txt in texts.items():
                  if tpath==rel: continue
                  if rel in txt or base in txt:
                      refs.append(tpath)
              root_candidates.append({"path":rel,"bytes":p.stat().st_size,"reference_count":len(refs),"references":refs[:12]})

          versioned=[]
          lp=Path("launchpad.cryptoworldz.xyz")
          if lp.exists():
              for d in sorted([x for x in lp.iterdir() if x.is_dir() and re.search(r"v\d+$",x.name,re.I)]):
                  rel=d.as_posix()
                  refs=[]
                  for tpath,txt in texts.items():
                      if tpath.startswith(rel+"/"): continue
                      if rel in txt or d.name in txt:
                          refs.append(tpath)
                  size=sum(x.stat().st_size for x in d.rglob("*") if x.is_file())
                  versioned.append({"path":rel,"bytes":size,"reference_count":len(refs),"references":refs[:12]})

          print("DEEP_HYGIENE_JSON_BEGIN")
          print(json.dumps({
              "workflow_count":len(workflows),
              "manual_oneoff_candidates":[x for x in workflows if x["cleanup_candidate"]],
              "root_candidates":root_candidates,
              "versioned_launchpad_dirs":versioned
          },indent=2))
          print("DEEP_HYGIENE_JSON_END")
          PY

      - name: Report blockchain hero true formats
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          hosts=['solworldz.xyz','ethworldz.xyz','baseworldz.xyz','bnbworldz.xyz','xrpworldz.xyz','suiworldz.xyz','hyperworldz.xyz','robinworldz.xyz']
          def kind(data):
              if data.startswith(b'\x89PNG\r\n\x1a\n'): return 'png'
              if data.startswith(b'\xff\xd8\xff'): return 'jpg'
              if len(data)>=12 and data[:4]==b'RIFF' and data[8:12]==b'WEBP': return 'webp'
              if data.startswith((b'GIF87a',b'GIF89a')): return 'gif'
              return 'unknown'
          for host in hosts:
              p=Path(host)/'hero.png'
              data=p.read_bytes()
              print(f'CHAIN_HERO_FORMAT host={host} current=hero.png true={kind(data)} bytes={len(data)}')
          PY
