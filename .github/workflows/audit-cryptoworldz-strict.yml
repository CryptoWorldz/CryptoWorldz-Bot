name: Audit CryptoWorldz Strict — No Deploy

on:
  push:
    branches: [main]
    paths:
      - 'deployments/cryptoworldz-strict-audit.request'

permissions:
  contents: read

concurrency:
  group: cryptoworldz-strict-no-deploy
  cancel-in-progress: true

jobs:
  audit:
    name: 14 pages desktop mobile visual audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prove CryptoWorldz-only no-deploy authority
        shell: bash
        run: |
          set -euo pipefail
          f='deployments/cryptoworldz-strict-audit.request'
          test "$(sed -n 's/^requested_by=//p' "$f" | tail -n1)" = 'JayJayTeamDev'
          test "$(sed -n 's/^target=//p' "$f" | tail -n1)" = 'cryptoworldz.xyz'
          test "$(sed -n 's/^mode=//p' "$f" | tail -n1)" = 'AUDIT_ONLY_NO_DEPLOY'
      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$chrome"
          echo "path=$chrome" >> "$GITHUB_OUTPUT"
      - name: Define exact page inventory
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/routes.tsv" <<'ROUTES'
          home	/
          command-centre	/command-centre/
          miniapp	/miniapp/
          support-reagan	/support/reagan-children/
          support-community	/support/community-impact/
          support-jayjay	/support/jayjayteamdev/
          division-vision	/divisions/visionworldz/
          division-ai	/divisions/aiworldz/
          division-music	/divisions/musicworldz/
          division-movie	/divisions/movieworldz/
          division-art	/divisions/artworldz/
          division-learn	/divisions/learnworldz/
          division-business	/divisions/businessworldz/
          division-law	/divisions/lawworldz/
          ROUTES
          test "$(wc -l < "$RUNNER_TEMP/routes.tsv" | tr -d ' ')" = 14
      - name: Prove all routes live
        shell: bash
        run: |
          set -euo pipefail
          failures=0
          while IFS=$'\t' read -r name route; do
            code="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --connect-timeout 15 --max-time 45 "https://cryptoworldz.xyz${route}?strictqa=${GITHUB_RUN_ID}" || printf '000')"
            if [[ "$code" =~ ^(2|3) ]]; then echo "OK $code $name"; else echo "BROKEN $code $name"; failures=$((failures+1)); fi
          done < "$RUNNER_TEMP/routes.tsv"
          test "$failures" = 0
      - name: Capture 28 real viewport screenshots and 14 DOM files
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p cryptoworldz-strict-proof
          while IFS=$'\t' read -r name route; do
            url="https://cryptoworldz.xyz${route}?strictqa=${GITHUB_RUN_ID}"
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=5000 --screenshot="cryptoworldz-strict-proof/${name}-desktop.png" "$url"
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=5000 --screenshot="cryptoworldz-strict-proof/${name}-mobile.png" "$url"
            "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=8000 --dump-dom "$url" > "cryptoworldz-strict-proof/${name}-dom.html"
          done < "$RUNNER_TEMP/routes.tsv"
          test "$(find cryptoworldz-strict-proof -name '*-desktop.png' | wc -l | tr -d ' ')" = 14
          test "$(find cryptoworldz-strict-proof -name '*-mobile.png' | wc -l | tr -d ' ')" = 14
          test "$(find cryptoworldz-strict-proof -name '*-dom.html' | wc -l | tr -d ' ')" = 14
      - name: Audit page visuals metadata and local links
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const routes=fs.readFileSync(process.env.RUNNER_TEMP+'/routes.tsv','utf8').trim().split('\n').map(x=>x.split('\t'));
          const failures=[]; const report=[];
          for(const [name,route] of routes){
            const html=fs.readFileSync(`cryptoworldz-strict-proof/${name}-dom.html`,'utf8');
            const ids=new Set([...html.matchAll(/\sid="([^"]+)"/g)].map(m=>m[1]));
            for(const m of html.matchAll(/href="#([^"]+)"/g)) if(!ids.has(m[1])) failures.push(`${name}: broken local link #${m[1]}`);
            const title=(html.match(/<title>([\s\S]*?)<\/title>/i)||[])[1]||'';
            const hasImage=/<img\b/i.test(html);
            const hasMainVisual=/hero-art|support-emblem/i.test(html);
            const hasCanonical=/rel="canonical"/i.test(html);
            const og=/property="og:image"/i.test(html);
            const twitter=/name="twitter:card" content="summary_large_image"/i.test(html);
            if(!title) failures.push(`${name}: missing title`);
            if(!hasImage) failures.push(`${name}: no image`);
            if(!hasMainVisual) failures.push(`${name}: no main visual`);
            if(!hasCanonical) failures.push(`${name}: no canonical`);
            if(!og) failures.push(`${name}: no og:image`);
            if(!twitter) failures.push(`${name}: no twitter large preview`);
            report.push({name,route,title,hasImage,hasMainVisual,hasCanonical,og,twitter});
          }
          fs.writeFileSync('cryptoworldz-strict-proof/page-contract.json',JSON.stringify(report,null,2));
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cryptoworldz-strict-proof-${{ github.run_id }}
          path: cryptoworldz-strict-proof/
          if-no-files-found: error
          retention-days: 30
