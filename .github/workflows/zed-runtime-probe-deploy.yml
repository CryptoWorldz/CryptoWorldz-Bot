name: ZED Runtime Probe Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zed-runtime-probe-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zed-runtime-probe-deploy
  cancel-in-progress: true

env:
  PROTECTED_DOMAIN: cryptobotz.cryptoworldz.xyz

jobs:
  inspect-build-recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cryptoworldz-production
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/publish-progress.sh ZED_BUILD_METADATA STARTED
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read sanitized Hostinger Node build recipes
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$HOSTINGER_API_TOKEN"
          domain_enc="$(node -p 'encodeURIComponent(process.env.PROTECTED_DOMAIN)')"
          curl --fail --silent --show-error --location -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "https://developers.hostinger.com/api/hosting/v1/websites?domain=${domain_enc}&per_page=25" -o "$RUNNER_TEMP/websites.json"
          username="$(node - <<'NODE'
          const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/websites.json','utf8'));const d=process.env.PROTECTED_DOMAIN.toLowerCase();const row=(p.data||[]).find(x=>String(x.domain||'').toLowerCase()===d);if(!row?.username)process.exit(2);process.stdout.write(String(row.username));
          NODE
          )"
          echo "::add-mask::$username"
          user_enc="$(HOSTINGER_USERNAME="$username" node -p 'encodeURIComponent(process.env.HOSTINGER_USERNAME)')"
          base="https://developers.hostinger.com/api/hosting/v1/accounts/${user_enc}/websites/${domain_enc}/nodejs"
          curl --fail --silent --show-error --location -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "$base/builds?per_page=25" -o "$RUNNER_TEMP/builds.json"
          BUILDS="$RUNNER_TEMP/builds.json" node <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.BUILDS,'utf8'));
          const allowed=['node_version','app_type','root_directory','output_directory','build_script','entry_file','package_manager','source_type','source_options'];
          for(const b of (p.data||[]).slice(0,10)){
            const o=b._options||b.options||{}; const safe={};
            for(const k of allowed){ if(o[k]!==undefined) safe[k]=o[k]; }
            const redact=(v)=>{ if(Array.isArray(v)) return v.map(redact); if(v&&typeof v==='object'){const x={};for(const [k,val] of Object.entries(v)){x[k]=/(token|secret|password|auth|key)/i.test(k)?'[REDACTED]':redact(val)}return x;} return typeof v==='string'?v.replace(/(?:sk-|eyJ)[A-Za-z0-9._-]{12,}/g,'[REDACTED]'):v; };
            console.log('HOSTINGER_BUILD_RECIPE '+JSON.stringify({uuid:b.uuid,state:b.state,created_at:b.created_at,options:redact(safe)}));
          }
          NODE
      - if: success()
        run: bash .github/publish-progress.sh ZED_BUILD_METADATA PASS
      - if: failure()
        run: bash .github/publish-progress.sh ZED_BUILD_METADATA FAIL
