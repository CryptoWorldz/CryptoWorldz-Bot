name: ZED Runtime Probe Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zed-runtime-probe-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zed-runtime-probe-deploy
  cancel-in-progress: true

env:
  PROBE_REVISION: locate-active-build-20260819

jobs:
  locate-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cryptoworldz-production
    env:
      PROTECTED_NODE_ROOT: /domains/cryptobotz.cryptoworldz.xyz/nodejs
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/publish-progress.sh ZED_ACTIVE_BUILD_LOCATE STARTED
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node .github/install-ci-apt-wrapper.cjs
      - name: Install bounded FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: List protected Node runtime tree safely
        shell: bash
        run: |
          set -euo pipefail
          for value in "$FTP_HOST" "$FTP_USERNAME" "$FTP_PASSWORD"; do echo "::add-mask::$value"; done
          raw_host="$(printf '%s' "$FTP_HOST" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#^ftp://##' -e 's#^ftps://##' -e 's#/.*$##')"
          if [[ "$raw_host" != *:*:* && "$raw_host" == *:* ]]; then raw_host="${raw_host%%:*}"; fi
          cat > "$RUNNER_TEMP/locate.lftp" <<EOF
          set cmd:fail-exit true
          set net:max-retries 2
          set net:timeout 20
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          cls -la $PROTECTED_NODE_ROOT
          cls -la $PROTECTED_NODE_ROOT/*
          cls -la $PROTECTED_NODE_ROOT/*/*
          bye
          EOF
          timeout 120 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/locate.lftp" "$raw_host" | sed -E 's/[A-Za-z0-9_-]{40,}/[LONG_VALUE_REDACTED]/g'
      - if: success()
        run: bash .github/publish-progress.sh ZED_ACTIVE_BUILD_LOCATE PASS
      - if: failure()
        run: bash .github/publish-progress.sh ZED_ACTIVE_BUILD_LOCATE FAIL
