name: ZED Runtime Probe Deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zed-runtime-probe-deploy.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zed-runtime-probe-deploy
  cancel-in-progress: true

env:
  PROBE_REVISION: force-20260819-2021-stack2

jobs:
  deploy-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cryptoworldz-production
    env:
      PROTECTED_DOMAIN: cryptobotz.cryptoworldz.xyz
      PROTECTED_NODE_ROOT: /domains/cryptobotz.cryptoworldz.xyz/nodejs
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/publish-progress.sh ZED_RUNTIME_PROBE_DEPLOY STARTED
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node .github/install-ci-apt-wrapper.cjs
      - name: Add sanitized stack location to temporary probe only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'src/full-runtime-entry.js';
          let source = fs.readFileSync(path, 'utf8');
          const oldLine = '  const raw = String(error && error.message || error && error.code || "unknown_startup_error");';
          const newLine = '  const raw = String(error && error.message || error && error.code || "unknown_startup_error") + " | " + String(error && error.stack || "").split(/\\r?\\n/).slice(1,6).map((line) => line.trim()).join(" | ");';
          if (!source.includes(oldLine)) throw new Error('startup_probe_patch_anchor_missing');
          source = source.replace(oldLine, newLine);
          fs.writeFileSync(path, source);
          NODE
          node --check src/full-runtime-entry.js
      - name: Install bounded FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Deploy only startup-probe runtime file
        shell: bash
        run: |
          set -euo pipefail
          for value in "$FTP_HOST" "$FTP_USERNAME" "$FTP_PASSWORD" "$HOSTINGER_API_TOKEN"; do echo "::add-mask::$value"; done
          raw_host="$(printf '%s' "$FTP_HOST" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#^ftp://##' -e 's#^ftps://##' -e 's#/.*$##')"
          if [[ "$raw_host" != *:*:* && "$raw_host" == *:* ]]; then raw_host="${raw_host%%:*}"; fi
          cat > "$RUNNER_TEMP/probe-put.lftp" <<EOF
          set cmd:fail-exit true
          set net:max-retries 2
          set net:timeout 20
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          put src/full-runtime-entry.js -o $PROTECTED_NODE_ROOT/src/full-runtime-entry.js
          get $PROTECTED_NODE_ROOT/src/full-runtime-entry.js -o $RUNNER_TEMP/remote-full-runtime-entry.js
          bye
          EOF
          success=0
          for attempt in 1 2 3; do
            echo "ZED_PROBE_FTPS attempt=$attempt"
            if timeout 120 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/probe-put.lftp" "$raw_host"; then success=1; break; fi
            sleep 5
          done
          test "$success" = 1
          cmp -s src/full-runtime-entry.js "$RUNNER_TEMP/remote-full-runtime-entry.js"
          echo 'ZED_RUNTIME_PROBE_REMOTE_BYTES=PASS'
      - name: Restart Hostinger Node process
        shell: bash
        run: |
          set -euo pipefail
          domain_enc="$(node -p 'encodeURIComponent(process.env.PROTECTED_DOMAIN)')"
          curl --fail --silent --show-error --location -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "https://developers.hostinger.com/api/hosting/v1/websites?domain=${domain_enc}&per_page=25" -o "$RUNNER_TEMP/websites.json"
          username="$(node - <<'NODE'
          const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/websites.json','utf8')); const d=process.env.PROTECTED_DOMAIN.toLowerCase(); const row=(p.data||[]).find(x=>String(x.domain||'').toLowerCase()===d); if(!row?.username) process.exit(2); process.stdout.write(String(row.username));
          NODE
          )"
          echo "::add-mask::$username"
          user_enc="$(HOSTINGER_USERNAME="$username" node -p 'encodeURIComponent(process.env.HOSTINGER_USERNAME)')"
          url="https://developers.hostinger.com/api/hosting/v1/accounts/${user_enc}/websites/${domain_enc}/nodejs/server/restart"
          code="$(curl --silent --show-error --location --request POST -o "$RUNNER_TEMP/restart.json" -w '%{http_code}' -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "$url")"
          case "$code" in 200|201|202|204) ;; *) cat "$RUNNER_TEMP/restart.json"; exit 1;; esac
          echo "HOSTINGER_ZED_RESTART=PASS HTTP=$code"
      - name: Read startup response
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            sleep 4
            code="$(curl --silent --show-error --location --connect-timeout 8 --max-time 12 -o "$RUNNER_TEMP/live.json" -w '%{http_code}' "https://$PROTECTED_DOMAIN/health?probe=$GITHUB_RUN_ID-$i" || true)"
            echo "ZED_STARTUP_PROBE attempt=$i http=$code"
            if [ "$code" != 000 ]; then cat "$RUNNER_TEMP/live.json" || true; fi
            if [ "$code" = 200 ]; then exit 0; fi
            if [ "$code" = 503 ] && grep -Fq 'startup_failure_probe_v1' "$RUNNER_TEMP/live.json"; then exit 1; fi
          done
          exit 1
      - if: success()
        run: bash .github/publish-progress.sh ZED_RUNTIME_PROBE_DEPLOY PASS
      - if: failure()
        run: bash .github/publish-progress.sh ZED_RUNTIME_PROBE_DEPLOY FAIL
