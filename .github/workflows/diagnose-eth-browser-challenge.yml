name: Diagnose EthWorldz Browser Challenge

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/ethworldz-browser-challenge.request'

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax-check challenge-aware browser proof
        run: node --check tools/prove-live-worldz-v2.mjs
      - name: Run read-only desktop/mobile browser proof against current EthWorldz
        env:
          WORLDZ_PROOF_DIR: ${{ runner.temp }}/eth-browser-proof
        run: node tools/prove-live-worldz-v2.mjs 'https://ethworldz.xyz' 'EthWorldz' ''
      - name: Preserve read-only proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eth-browser-challenge-${{ github.run_id }}
          path: ${{ runner.temp }}/eth-browser-proof/
          if-no-files-found: error
          retention-days: 7
