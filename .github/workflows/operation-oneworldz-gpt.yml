name: Operation OneWorldz GPT

on:
  push:
    branches: [main]
    paths:
      - ".github/operation-oneworldz-gpt.sh"
      - ".github/workflows/operation-oneworldz-gpt.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: jayjay-chatgpt-oneworldz-single-rail
  cancel-in-progress: false

env:
  PROTECTED_DOMAIN: cryptobotz.cryptoworldz.xyz
  PROTECTED_NODE_ROOT: /domains/cryptobotz.cryptoworldz.xyz/nodejs

jobs:
  repair_and_prove_gpt:
    name: EXISTING KEY → HOSTINGER NODE RELEASE → RESTART → REAL GPT PROOF
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install repository FTPS transport
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/lftp-compat.py
          mkdir -p "$RUNNER_TEMP/oneworldz-bin"
          cat > "$RUNNER_TEMP/oneworldz-bin/lftp" <<'SH'
          #!/usr/bin/env bash
          exec python3 "$GITHUB_WORKSPACE/.github/lftp-compat.py" "$@"
          SH
          chmod +x "$RUNNER_TEMP/oneworldz-bin/lftp"
          echo "$RUNNER_TEMP/oneworldz-bin" >> "$GITHUB_PATH"

      - name: Deploy and prove Operation OneWorldz GPT
        shell: bash
        run: bash .github/operation-oneworldz-gpt.sh
