name: WorldzHQ and PDC verified Hostinger deployment
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: worldz-new-sites-only
  cancel-in-progress: false
jobs:

  public-health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Independently compare public content against GitHub source
        run: python3 tools/check_worldz_public_health.py
