name: Diagnose DonateWorldz DNS

on:
  push:
    branches: [main]
    paths:
      - 'deployments/diagnose-donateworldz-dns.request'

permissions:
  contents: read

jobs:
  diagnose:
    name: Read-only DonateWorldz DNS chain diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install DNS tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dnsutils whois
      - name: Diagnose registry delegation and DNS chain
        shell: bash
        run: |
          set +e
          echo '=== WHOIS / REGISTRAR NAMESERVERS ==='
          whois donateworldz.com | grep -Ei 'Registrar:|Name Server:|DNSSEC:' | head -40
          echo
          echo '=== SYSTEM RESOLVER NS ==='
          dig donateworldz.com NS +noall +answer +comments
          echo
          echo '=== GOOGLE NS ==='
          dig @8.8.8.8 donateworldz.com NS +noall +answer +comments
          echo
          echo '=== CLOUDFLARE NS ==='
          dig @1.1.1.1 donateworldz.com NS +noall +answer +comments
          echo
          echo '=== SOA ==='
          dig @8.8.8.8 donateworldz.com SOA +noall +answer +comments
          echo
          echo '=== A ==='
          dig @8.8.8.8 donateworldz.com A +noall +answer +comments
          echo
          echo '=== AAAA ==='
          dig @8.8.8.8 donateworldz.com AAAA +noall +answer +comments
          echo
          echo '=== WWW A/CNAME ==='
          dig @8.8.8.8 www.donateworldz.com A +noall +answer +comments
          dig @8.8.8.8 www.donateworldz.com CNAME +noall +answer +comments
          echo
          echo '=== DS / DNSSEC AT PARENT ==='
          dig @8.8.8.8 donateworldz.com DS +noall +answer +comments
          echo
          echo '=== TRACE ==='
          timeout 90 dig +trace donateworldz.com NS
          echo
          echo '=== HTTPS HEAD ==='
          curl -I -L --connect-timeout 10 --max-time 20 https://donateworldz.com/ || true
