name: Deploy OneWorldz Sequential Pass
on:
  push:
    branches: [oneworldz-recovery]
    paths: [deployments/oneworldz-attempt-4.request]
permissions: { contents: read }
concurrency:
  group: oneworldz-sequential-production
  cancel-in-progress: true
jobs:
  one-site-until-passed:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: cryptoworldz-production
      url: https://oneworldz.com/
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      REMOTE_DIR: domains/oneworldz.com/public_html
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick lftp curl
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Build exact desktop/mobile assets
        run: bash apps/cryptoworldz-web-core/scripts/build-oneworldz-attempt-4-images.sh
      - name: Source gate
        run: node apps/cryptoworldz-web-core/scripts/verify-oneworldz-recovery.mjs
      - name: Prepare release
        run: |
          root='apps/cryptoworldz-web-core'; rm -rf /tmp/ow-release; mkdir -p /tmp/ow-release/assets/images
          cp "$root/oneworldz-index.html" /tmp/ow-release/index.html
          cp "$root/assets/oneworldz-next.js" /tmp/ow-release/assets/oneworldz-next.js
          cp -a "$root/assets/images/oneworldz-pass110" /tmp/ow-release/assets/images/
          test "$(find /tmp/ow-release/assets/images/oneworldz-pass110 -name '*.webp' | wc -l | tr -d ' ')" = 4
      - name: Resolve Hostinger
        run: |
          set -euo pipefail; test -n "$FTP_HOST"; test -n "$FTP_USERNAME"; test -n "$FTP_PASSWORD"
          h="$(printf '%s' "$FTP_HOST" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#^ftp://##' -e 's#^ftps://##' -e 's#/.*$##')"; [[ "$h" != *:*:* && "$h" == *:* ]] && h="${h%%:*}" || true
          echo "RAW_FTP_HOST=$h" >> "$GITHUB_ENV"; echo "::add-mask::$FTP_HOST"; echo "::add-mask::$FTP_USERNAME"; echo "::add-mask::$FTP_PASSWORD"
          timeout 90 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "set cmd:fail-exit true; set net:timeout 25; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true; set ssl:check-hostname false; cd $REMOTE_DIR; pwd; bye" "$h"
      - name: Backup live files
        run: |
          rm -rf /tmp/ow-backup; mkdir -p /tmp/ow-backup/assets
          timeout 180 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "set cmd:fail-exit true; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true; set ssl:check-hostname false; cd $REMOTE_DIR; get index.html -o /tmp/ow-backup/index.html; get assets/oneworldz-next.js -o /tmp/ow-backup/assets/oneworldz-next.js; bye" "$RAW_FTP_HOST"
      - name: Deploy OneWorldz only
        id: deploy
        continue-on-error: true
        run: |
          timeout 420 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "set cmd:fail-exit true; set net:timeout 30; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true; set ssl:check-hostname false; cd $REMOTE_DIR; lcd /tmp/ow-release; mirror -R --verbose . .; bye" "$RAW_FTP_HOST"
      - name: Real desktop/mobile visual functional gate
        id: proof
        if: ${{ steps.deploy.outcome == 'success' }}
        continue-on-error: true
        run: |
          cat > gate.mjs <<'NODE'
          import {chromium,request} from 'playwright'; import {writeFileSync} from 'node:fs';
          const browser=await chromium.launch({headless:true}), api=await request.newContext({extraHTTPHeaders:{'Cache-Control':'no-cache'}});
          const required=['ONEWORLDZ','HELPING THE PEOPLE WHO HELP PEOPLE.','KNOWLEDGE CREATES POWER.','UNDERSTAND THE PATHWAY.','IDEAS WITH PURPOSE. PROJECTS WITH PROOF.','EXPLORE THE WORLDZ'];
          const ids=['home','vision','framework','action','learn','law','impact','worldz']; let failed=false; const results={};
          for(const [name,w,h] of [['desktop',1440,1100],['mobile',390,844]]){
            const p=await browser.newPage({viewport:{width:w,height:h}}), errors=[], reqfails=[];
            p.on('console',m=>{if(m.type()==='error')errors.push(m.text())}); p.on('pageerror',e=>errors.push(e.message)); p.on('requestfailed',r=>reqfails.push(r.url()));
            const r=await p.goto(`https://oneworldz.com/?pass110=${Date.now()}`,{waitUntil:'networkidle',timeout:60000}); await p.waitForTimeout(1500);
            const a=await p.evaluate(({required,ids})=>{const body=document.body.innerText.toUpperCase(),imgs=[...document.images].map(i=>({src:i.currentSrc||i.src,nw:i.naturalWidth,nh:i.naturalHeight,w:i.clientWidth,h:i.clientHeight,visible:!!(i.offsetWidth||i.offsetHeight||i.getClientRects().length)}));return{title:document.title,body,imgs,links:[...document.links].map(x=>({text:x.innerText.trim(),href:x.href})),missingText:required.filter(t=>!body.includes(t)),missingIds:ids.filter(id=>!document.getElementById(id)),scrollWidth:document.documentElement.scrollWidth,clientWidth:document.documentElement.clientWidth};},{required,ids});
            Object.assign(a,{status:r?.status()||0,errors,reqfails,brokenImages:a.imgs.filter(i=>!i.nw||!i.nh||!i.visible),overflow:a.scrollWidth>a.clientWidth+2});
            if(a.status!==200||a.errors.length||a.reqfails.length||a.brokenImages.length||a.overflow||a.missingText.length||a.missingIds.length||a.imgs.length!==2||a.imgs.some(i=>!i.src.includes('/oneworldz-pass110/')))failed=true;
            await p.screenshot({path:`oneworldz-${name}.png`,fullPage:true}); writeFileSync(`oneworldz-${name}.json`,JSON.stringify(a,null,2)); results[name]=a; await p.close();
          }
          const hrefs=[...new Set(results.desktop.links.map(x=>x.href))].filter(h=>!h.includes('#')&&(h.startsWith('https://oneworldz.com/')||h==='https://cryptoworldz.xyz/'||h==='https://purplediamondcrew.com/'||h.startsWith('https://cryptobotz.cryptoworldz.xyz'))), links=[];
          for(const href of hrefs){try{const r=await api.get(href,{timeout:30000,maxRedirects:8});const ok=r.status()>=200&&r.status()<400;links.push({href,status:r.status(),ok});if(!ok)failed=true}catch(e){links.push({href,status:0,ok:false,error:String(e)});failed=true}}
          writeFileSync('oneworldz-links.json',JSON.stringify(links,null,2)); await api.dispose(); await browser.close(); if(failed)process.exit(1); console.log('ONEWORLDZ LIVE MACHINE GATE PASS ✅');
          NODE
          node gate.mjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneworldz-pass110-proof
          path: |
            oneworldz-desktop.png
            oneworldz-mobile.png
            oneworldz-desktop.json
            oneworldz-mobile.json
            oneworldz-links.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Roll back on any failure
        if: ${{ steps.deploy.outcome == 'failure' || steps.proof.outcome == 'failure' }}
        run: |
          timeout 420 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "set cmd:fail-exit false; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true; set ssl:check-hostname false; cd $REMOTE_DIR; rm -r assets/images/oneworldz-pass110; lcd /tmp/ow-backup; put index.html -o index.html; put assets/oneworldz-next.js -o assets/oneworldz-next.js; bye" "$RAW_FTP_HOST"
      - name: Block progression after rollback
        if: ${{ steps.deploy.outcome == 'failure' || steps.proof.outcome == 'failure' }}
        run: exit 1
      - name: OneWorldz machine pass marker
        if: success()
        run: echo 'ONEWORLDZ MACHINE GATE PASS — SCREENSHOT REVIEW REQUIRED BEFORE NEXT SITE ✅'
