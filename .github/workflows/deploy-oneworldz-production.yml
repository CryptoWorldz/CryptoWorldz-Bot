name: Deploy OneWorldz Production

on:
  push:
    branches: [main]
    paths:
      - 'deployments/oneworldz-production.request'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oneworldz-production-v2
  cancel-in-progress: false

jobs:
  deploy:
    name: Back up, deploy and verify OneWorldz.com
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: oneworldz-production
      url: https://oneworldz.com
    env:
      FTP_HOST: '145.223.108.40'
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: '21'
      FTP_SERVER_DIR: '/public_html'
      FTP_ACCOUNT_SCOPE: ${{ vars.FTP_ACCOUNT_SCOPE }}
      DEPLOY_GUARD: ${{ vars.DEPLOY_GUARD }}
      LIVE_URL: https://oneworldz.com
    steps:
      - name: Check out approved main commit
        uses: actions/checkout@v4

      - name: Validate OneWorldz approval
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          APPROVED_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test -f deployments/oneworldz-production.request
          test "$(sed -n 's/^target=//p' deployments/oneworldz-production.request | tail -n1)" = 'oneworldz.com'
          test "$(sed -n 's/^confirmation=//p' deployments/oneworldz-production.request | tail -n1)" = 'APPROVE TOTAL DEPLOYMENT'
          if [[ "$EVENT_NAME" == 'push' ]]; then
            test "$(sed -n 's/^source_commit=//p' deployments/oneworldz-production.request | tail -n1)" = "$APPROVED_BEFORE"
            echo 'Push-triggered immutable approval validated.'
          elif [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            echo 'Manual OneWorldz production run authorised by workflow_dispatch.'
          else
            echo "::error::Unsupported deployment event: $EVENT_NAME"
            exit 1
          fi

      - name: Lock deployment to OneWorldz only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FTP_HOST" == '145.223.108.40' ]]
          [[ "$FTP_PORT" == '21' ]]
          [[ "$FTP_SERVER_DIR" == '/public_html' ]]
          [[ "$FTP_ACCOUNT_SCOPE" == 'DOMAIN_ONLY' ]]
          [[ "$DEPLOY_GUARD" == 'ONEWORLDZ.COM' ]]
          [[ -n "$FTP_USERNAME" && -n "$FTP_PASSWORD" ]]
          echo "::add-mask::$FTP_USERNAME"
          echo "::add-mask::$FTP_HOST"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build dedicated OneWorldz package
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/oneworldz-package"
          rm -rf "$stage"
          cp -a "$GITHUB_WORKSPACE/apps/cryptoworldz-web-core" "$stage"
          cp "$stage/oneworldz-index.html" "$stage/index.html"
          cp "$stage/oneworldz-robots.txt" "$stage/robots.txt"
          cp "$stage/oneworldz-sitemap.xml" "$stage/sitemap.xml"
          rm -f "$stage/oneworldz-index.html" "$stage/oneworldz-robots.txt" "$stage/oneworldz-sitemap.xml"

          grep -Fq '<title>OneWorldz 🌏 One Vision' "$stage/index.html"
          grep -Fq 'property="og:site_name" content="OneWorldz"' "$stage/index.html"
          ! grep -Fq '<title>CryptoWorldz' "$stage/index.html"
          grep -Fq 'Action Spread Smiles Organisation' "$stage/donate.html"
          test -f "$stage/reagan-kauja.html"
          test -f "$stage/assets/reagan-hero-media.js"
          test -f "$stage/assets/reagan-real-media.js"
          test -f "$stage/assets/reagan-smiles-media.js"
          grep -Fq 'data:image/webp;base64,' "$stage/assets/reagan-hero-media.js"
          grep -Fq 'data:image/webp;base64,' "$stage/assets/reagan-real-media.js"
          grep -Fq 'data:image/webp;base64,' "$stage/assets/reagan-smiles-media.js"
          echo 'Dedicated OneWorldz package gate passed.'

      - name: Verify repository and deployment helper
        run: |
          npm ci
          npm run verify
          bash -n tools/worldz-direct-ftp.sh
          WORLDZ_FTP_DRY_RUN=1 FTP_HOST=145.223.108.40 FTP_USERNAME=dry FTP_PASSWORD=dry FTP_TLS_VERIFY=no bash tools/worldz-direct-ftp.sh upload "$RUNNER_TEMP/oneworldz-package"

      - name: Install secure FTP tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp zip

      - name: Confirm encrypted OneWorldz target
        shell: bash
        run: |
          set -euo pipefail
          timeout 35 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 1
          set net:timeout 12
          set ftp:passive-mode yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          cd "$FTP_SERVER_DIR"
          pwd
          bye
          LFTP

      - name: Capture lean rollback snapshot
        shell: bash
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/oneworldz-backup"
          mkdir -p "$backup"
          # Back up only files/paths this release can replace. Avoid mirroring the
          # entire hosting account and duplicate historical image libraries.
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" <<LFTP
          set cmd:fail-exit no
          set net:max-retries 1
          set net:timeout 15
          set ftp:passive-mode yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          cd "$FTP_SERVER_DIR"
          lcd "$backup"
          get index.html -o index.html
          get donate.html -o donate.html
          get reagan-kauja.html -o reagan-kauja.html
          get robots.txt -o robots.txt
          get sitemap.xml -o sitemap.xml
          get .htaccess -o .htaccess
          mkdir -p assets
          lcd assets
          cd assets
          get oneworldz.js -o oneworldz.js
          get reagan-hero-media.js -o reagan-hero-media.js
          get reagan-real-media.js -o reagan-real-media.js
          get reagan-smiles-media.js -o reagan-smiles-media.js
          bye
          LFTP
          cd "$backup"
          zip -qr "$RUNNER_TEMP/oneworldz-predeploy.zip" .
          test -s "$RUNNER_TEMP/oneworldz-predeploy.zip"

      - name: Preserve rollback package
        uses: actions/upload-artifact@v4
        with:
          name: oneworldz-predeploy-${{ github.run_id }}
          path: ${{ runner.temp }}/oneworldz-predeploy.zip
          retention-days: 14
          if-no-files-found: error

      - name: Upload dedicated OneWorldz package
        shell: bash
        env:
          FTP_TRANSFER_TIMEOUT: '300'
          FTP_TLS_VERIFY: 'no'
        run: |
          set -euo pipefail
          echo 'ONEWORLDZ_UPLOAD_STARTED=true' >> "$GITHUB_ENV"
          bash tools/worldz-direct-ftp.sh upload "$RUNNER_TEMP/oneworldz-package"

      - name: Verify live OneWorldz
        shell: bash
        run: |
          set -euo pipefail
          agent='Mozilla/5.0 (OneWorldz Production Verify)'
          verified='false'
          for attempt in 1 2 3 4 5 6; do
            cache="release=${GITHUB_SHA}-${GITHUB_RUN_ID}-${attempt}"
            if curl -fsSL -A "$agent" -H 'Cache-Control: no-cache' --connect-timeout 15 --max-time 30 "$LIVE_URL/?$cache" -o "$RUNNER_TEMP/home.html" \
              && curl -fsSL -A "$agent" -H 'Cache-Control: no-cache' --connect-timeout 15 --max-time 30 "$LIVE_URL/reagan-kauja/?$cache" -o "$RUNNER_TEMP/reagan.html"; then
              if grep -Fq '<title>OneWorldz 🌏 One Vision' "$RUNNER_TEMP/home.html" \
                && grep -Fq '<title>Reagan Kauja | Action Spread Smiles Organisation Uganda | OneWorldz</title>' "$RUNNER_TEMP/reagan.html"; then
                verified='true'
                break
              fi
            fi
            sleep 5
          done
          [[ "$verified" == 'true' ]] || { echo '::error::OneWorldz live verification failed.'; exit 1; }

      - name: Restore previous OneWorldz files if deployment fails
        if: failure() && env.ONEWORLDZ_UPLOAD_STARTED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/oneworldz-backup"
          [[ -d "$backup" ]] || exit 0
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 1
          set net:timeout 20
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          lcd "$backup"
          cd "$FTP_SERVER_DIR"
          mirror --reverse --parallel=3 . .
          bye
          LFTP
          echo 'Previous OneWorldz release files restored.'

      - name: Publish deployment summary
        if: always()
        run: |
          {
            echo '## OneWorldz Production'
            echo '- Manual Run Workflow: supported'
            echo '- Lean rollback: only release-critical files/assets'
            echo '- Duplicate/historical hosting images are not downloaded for backup'
            echo '- Target: OneWorldz.com only'
            echo '- Zed: untouched'
            echo '- Auto: untouched'
          } >> "$GITHUB_STEP_SUMMARY"
