name: Diagnose Hostinger FTPS Certificate

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/hostinger-ftps-cert.request'

permissions:
  contents: read

jobs:
  certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public FTP TLS and SFTP identities
        shell: bash
        run: |
          set -euo pipefail
          ip='145.223.108.40'
          echo "PTR candidates:"
          getent hosts "$ip" || true
          echo "Plain FTP service banner:"
          timeout 8 bash -c "printf 'QUIT\r\n' | nc -v '$ip' 21" 2>&1 || true
          echo "FTP FEAT response:"
          timeout 8 bash -c "printf 'FEAT\r\nQUIT\r\n' | nc '$ip' 21" 2>&1 || true
          echo "TLS certificate:"
          timeout 20 openssl s_client -starttls ftp -connect "$ip:21" -showcerts </dev/null 2>/dev/null \
            | openssl x509 -noout -subject -issuer -serial -fingerprint -sha256 -ext subjectAltName
          echo "SFTP/SSH host keys on port 65002:"
          timeout 20 ssh-keyscan -T 10 -p 65002 "$ip" 2>/dev/null | tee /tmp/hostinger-known-hosts
          test -s /tmp/hostinger-known-hosts
          ssh-keygen -lf /tmp/hostinger-known-hosts -E sha256
