name: Validate OneWorldz Production Readiness

on:
  pull_request:
    paths:
      - 'apps/oneworldz-ecosystem-release/**'
      - 'deployments/oneworldz-19-production-gate.lock'
      - '.github/workflows/validate-oneworldz-production-readiness.yml'
  push:
    branches:
      - build/oneworldz-19-destination-upgrade
    paths:
      - 'apps/oneworldz-ecosystem-release/**'
      - 'deployments/oneworldz-19-production-gate.lock'
      - '.github/workflows/validate-oneworldz-production-readiness.yml'

permissions:
  contents: read

concurrency:
  group: oneworldz-production-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    name: Prove 19 destinations and 17 exact static targets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and run complete release verification
        working-directory: apps/oneworldz-ecosystem-release
        run: npm run verify
      - name: Enforce production mapping safety boundary
        shell: bash
        run: |
          set -euo pipefail
          cd apps/oneworldz-ecosystem-release
          node - <<'NODE'
          import { productionGate, productionTargets } from './production-targets.mjs';
          if (productionGate.ecosystemDestinations !== 19) throw new Error('Destination count drift');
          if (productionGate.activeOwnedRootDomains !== 15) throw new Error('Owned-domain count drift');
          if (productionTargets.length !== 17) throw new Error('Static-target count drift');
          if (productionGate.deploymentState !== 'NOT_EXECUTED') throw new Error('Readiness CI cannot authorize deployment');
          const domains = productionTargets.map(site => site.domain);
          if (domains.includes('solworld.fun')) throw new Error('Legacy SolWorld.fun entered production fleet');
          if (domains.includes('oneworldz.com')) throw new Error('Protected OneWorldz package detected');
          if (domains.includes('cryptobotz.cryptoworldz.xyz')) throw new Error('Protected CryptoBotz package detected');
          NODE
