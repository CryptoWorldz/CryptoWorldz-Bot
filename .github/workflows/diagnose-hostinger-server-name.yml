name: Diagnose Hostinger Server Name

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/hostinger-server-name.request'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install DNS tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils
      - name: Resolve Hostinger Jakarta hstgr.io candidates to locked IP
        shell: bash
        run: |
          set -euo pipefail
          target='145.223.108.40'
          out="$RUNNER_TEMP/matches.txt"
          : > "$out"
          export target out
          seq 1 3200 | xargs -P 100 -I{} bash -c '
            for label in "id-dci-web{}" "id-dci-h5g-node{}" "id-dci-web{}-files"; do
              answer="$(dig +short +time=1 +tries=1 A "$label.hstgr.io" | tail -n1)"
              if [[ "$answer" == "$target" ]]; then echo "$label.hstgr.io $answer" >> "$out"; fi
            done
          '
          sort -u "$out" | tee "$RUNNER_TEMP/sorted-matches.txt"
          test -s "$RUNNER_TEMP/sorted-matches.txt"
          while read -r host ip; do
            echo "Validating $host -> $ip"
            test "$(dig +short A "$host" | tail -n1)" = "$target"
            timeout 20 openssl s_client -starttls ftp -connect "$host:21" -servername "$host" -verify_return_error </dev/null 2>"$RUNNER_TEMP/openssl.err" \
              | openssl x509 -noout -subject -issuer -ext subjectAltName
            if grep -Eqi 'verify error|certificate verify failed' "$RUNNER_TEMP/openssl.err"; then
              cat "$RUNNER_TEMP/openssl.err"
              exit 1
            fi
          done < "$RUNNER_TEMP/sorted-matches.txt"
