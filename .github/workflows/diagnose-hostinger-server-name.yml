name: Diagnose Hostinger Server Name

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/hostinger-server-name.request'

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Install DNS tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils
      - name: Resolve Hostinger hstgr.io candidates to locked IP
        shell: bash
        run: |
          set -euo pipefail
          target='145.223.108.40'
          out="$RUNNER_TEMP/matches.txt"
          : > "$out"
          export target out
          seq 1 2600 | xargs -P 80 -I{} bash -c '
            for label in "srv{}" "srv{}-files"; do
              answer="$(dig +short +time=1 +tries=1 A "$label.hstgr.io" | tail -n1)"
              if [[ "$answer" == "$target" ]]; then echo "$label.hstgr.io $answer" >> "$out"; fi
            done
          '
          sort -u "$out" | tee "$RUNNER_TEMP/sorted-matches.txt"
          test -s "$RUNNER_TEMP/sorted-matches.txt"
