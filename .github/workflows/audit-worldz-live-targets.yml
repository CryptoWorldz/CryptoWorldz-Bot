name: Audit Worldz Live Targets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'diagnostics/worldz-live-audit.request'
      - '.github/workflows/audit-worldz-live-targets.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate read-only audit request when push-triggered
        if: github.event_name == 'push'
        shell: bash
        env:
          APPROVED_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test -f diagnostics/worldz-live-audit.request
          test "$(sed -n 's/^confirmation=//p' diagnostics/worldz-live-audit.request | tail -n1)" = 'APPROVE READ ONLY AUDIT'
          test "$(sed -n 's/^source_commit=//p' diagnostics/worldz-live-audit.request | tail -n1)" = "$APPROVED_BEFORE"

      - name: Audit DNS and HTTPS and fail on required target faults
        shell: bash
        run: |
          set -u
          targets=(
            cryptoworldz.xyz
            solworldz.xyz
            purplediamondcrew.com
            oneworldz.com
            impactbased.oneworldz.com
            law.oneworldz.com
            learn.oneworldz.com
            ethworldz.xyz
            baseworldz.xyz
            bnbworldz.xyz
            xrpworldz.xyz
            suiworldz.xyz
            hyperworldz.xyz
            robinworldz.xyz
            bitcoinworldz.xyz
            hodlerworldz.xyz
          )

          failures=0
          printf '%-34s | %-4s | %-4s | %s\n' 'TARGET' 'DNS' 'HTTP' 'A/CNAME'
          printf '%s\n' '------------------------------------------------------------------------------------------------'
          for host in "${targets[@]}"; do
            a="$(dig +short "$host" A | paste -sd, -)"
            cname="$(dig +short "$host" CNAME | paste -sd, -)"
            dns='NO'
            [[ -n "$a$cname" ]] && dns='YES'
            code="$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 5 --max-time 15 "https://$host/?worldz-audit=${GITHUB_RUN_ID}" 2>/dev/null || true)"
            [[ -n "$code" ]] || code='ERR'
            routing="$a"
            [[ -n "$cname" ]] && routing="${routing:+$routing;}$cname"
            printf '%-34s | %-4s | %-4s | %s\n' "$host" "$dns" "$code" "$routing"

            if [[ "$dns" != 'YES' ]]; then
              echo "::error::$host has no A/CNAME resolution"
              failures=$((failures+1))
            fi
            if [[ ! "$code" =~ ^2[0-9][0-9]$ ]]; then
              echo "::error::$host failed HTTPS acceptance with HTTP $code"
              failures=$((failures+1))
            fi
          done

          if (( failures > 0 )); then
            echo "::error::Worldz live target audit failed with $failures DNS/HTTPS finding(s)."
            exit 1
          fi
          echo 'Worldz live target audit passed with zero DNS/HTTPS failures.'

      - name: Audit summary
        if: always()
        run: |
          {
            echo '## Worldz live deployment inventory'
            echo
            echo '- Read only: DNS and HTTPS checks only.'
            echo '- This summary never overrides the job conclusion.'
            echo '- A required DNS/HTTPS failure now makes the workflow fail.'
          } >> "$GITHUB_STEP_SUMMARY"
