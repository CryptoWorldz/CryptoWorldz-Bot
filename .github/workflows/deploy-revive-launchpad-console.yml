name: Deploy REVIVE LaunchPad Console

on:
  push:
    branches: [main]
    paths:
      - 'launchpad.cryptoworldz.xyz/wldz/revive-launch/index.html'
      - '.github/workflows/deploy-revive-launchpad-console.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate console
        run: |
          grep -q 'SIGN & LAUNCH REVIVE' launchpad.cryptoworldz.xyz/wldz/revive-launch/index.html
          grep -q 'noindex,nofollow,noarchive' launchpad.cryptoworldz.xyz/wldz/revive-launch/index.html
          grep -q 'worldz-solana-rpc' launchpad.cryptoworldz.xyz/wldz/revive-launch/index.html
          ! grep -q '\\n<meta' launchpad.cryptoworldz.xyz/wldz/revive-launch/index.html
      - name: Upload console
        shell: python
        run: |
          import os,ssl
          from ftplib import FTP_TLS,error_perm
          from pathlib import Path
          local=Path('launchpad.cryptoworldz.xyz/wldz/revive-launch/index.html')
          remote_dir='domains/cryptoworldz.xyz/public_html/launchpad/wldz/revive-launch'
          ftp=FTP_TLS(context=ssl._create_unverified_context())
          ftp.connect(os.environ['FTP_HOST'],int(os.environ.get('FTP_PORT','21')),timeout=40)
          ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          ftp.prot_p(); ftp.set_pasv(True); ftp.cwd('/')
          for part in remote_dir.split('/'):
              if not part: continue
              try: ftp.cwd(part)
              except error_perm:
                  ftp.mkd(part); ftp.cwd(part)
          with local.open('rb') as h:
              ftp.storbinary('STOR index.html',h,blocksize=262144)
          ftp.quit()
          print('REVIVE_LAUNCHPAD_CONSOLE_DEPLOY=PASS')
      - name: Verify live
        shell: python
        run: |
          import urllib.request,time
          url='https://launchpad.cryptoworldz.xyz/wldz/revive-launch/?v='+str(int(time.time()))
          req=urllib.request.Request(url,headers={'User-Agent':'REVIVE-Launch-Verify/1.0','Cache-Control':'no-cache'})
          with urllib.request.urlopen(req,timeout=20) as r:
              body=r.read().decode('utf-8','ignore')
          assert 'SIGN & LAUNCH REVIVE' in body
          assert '\\n<meta' not in body
          print('REVIVE_LAUNCHPAD_CONSOLE_LIVE=PASS')
