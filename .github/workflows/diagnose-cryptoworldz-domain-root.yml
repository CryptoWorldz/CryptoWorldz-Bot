name: Diagnose CryptoWorldz Domain Root

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'diagnostics/cryptoworldz-domain-root.request'

permissions:
  contents: read

concurrency:
  group: cryptoworldz-domain-root-diagnostic
  cancel-in-progress: false

jobs:
  prove:
    name: Find live CryptoWorldz path inside jailed FTP account
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cryptoworldz-production
    env:
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: '21'
      HOSTINGER_LOCKED_IP: '145.223.108.40'
      HOSTINGER_TLS_ALIAS: 'cryptoworldz-ftp-pinned.hstgr.io'
      HOSTINGER_CERT_SHA256: '47:E1:B5:DC:5D:61:02:E8:ED:8C:01:21:61:AF:8B:22:53:70:AB:55:63:B0:0C:AF:14:6C:BD:7A:96:51:E9:5E'
      LIVE_HOME: 'https://cryptoworldz.xyz/'
    steps:
      - uses: actions/checkout@v4

      - name: Validate read-only request
        if: github.event_name == 'push'
        shell: bash
        env:
          APPROVED_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test "$(sed -n 's/^target=//p' diagnostics/cryptoworldz-domain-root.request | tail -n1)" = 'cryptoworldz.xyz'
          test "$(sed -n 's/^mode=//p' diagnostics/cryptoworldz-domain-root.request | tail -n1)" = 'read-only-domain-root-proof'
          test "$(sed -n 's/^approval=//p' diagnostics/cryptoworldz-domain-root.request | tail -n1)" = 'Approved by JayJayTeamDev'
          test "$(sed -n 's/^source_commit=//p' diagnostics/cryptoworldz-domain-root.request | tail -n1)" = "$APPROVED_BEFORE"

      - name: Install secure FTP tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Prove pinned Hostinger identity
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$FTP_USERNAME" && -n "$FTP_PASSWORD" ]] || { echo '::error::FTP credentials missing'; exit 1; }
          echo "::add-mask::$FTP_USERNAME"
          echo "::add-mask::$FTP_PASSWORD"
          echo "$HOSTINGER_LOCKED_IP $HOSTINGER_TLS_ALIAS" | sudo tee -a /etc/hosts >/dev/null
          cert="$RUNNER_TEMP/hostinger-cert.pem"
          session="$RUNNER_TEMP/hostinger-session.txt"
          timeout 30 openssl s_client -starttls ftp -connect "$HOSTINGER_LOCKED_IP:21" -verify_return_error -showcerts </dev/null >"$session" 2>/dev/null
          sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' "$session" | sed -n '1,/-----END CERTIFICATE-----/p' > "$cert"
          [[ "$(openssl x509 -in "$cert" -noout -fingerprint -sha256 | cut -d= -f2)" == "$HOSTINGER_CERT_SHA256" ]]
          openssl x509 -in "$cert" -noout -ext subjectAltName | grep -Fq 'DNS:*.hstgr.io'
          grep -Fq 'Verify return code: 0 (ok)' "$session"

      - name: List domains tree shallowly without writing
        shell: bash
        run: |
          set -euo pipefail
          root_list="$RUNNER_TEMP/domains-root.txt"
          cw_list="$RUNNER_TEMP/cw-domain.txt"
          timeout 60 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$HOSTINGER_TLS_ALIAS" -e "set cmd:fail-exit yes; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname yes; cd '/domains'; cls -1 > '$root_list'; set cmd:fail-exit no; cd '/domains/cryptoworldz.xyz'; cls -1 > '$cw_list'; bye"
          echo 'DOMAINS_ROOT_BEGIN'
          sed -n '1,100p' "$root_list"
          echo 'DOMAINS_ROOT_END'
          if [[ -s "$cw_list" ]]; then
            echo 'CRYPTOWORLDZ_DOMAIN_DIR_BEGIN'
            sed -n '1,100p' "$cw_list"
            echo 'CRYPTOWORLDZ_DOMAIN_DIR_END'
          else
            echo 'CRYPTOWORLDZ_DOMAIN_DIR=NOT_FOUND'
          fi

      - name: Download public homepage for exact comparison
        shell: bash
        run: |
          set -euo pipefail
          public="$RUNNER_TEMP/public-index.html"
          curl -4 -L -sS --fail --max-time 45 -o "$public" -H 'Cache-Control: no-cache, no-store, must-revalidate' "$LIVE_HOME?rootproof=${GITHUB_RUN_ID}"
          test -s "$public"
          echo "PUBLIC_SHA256=$(sha256sum "$public" | awk '{print $1}')"
          echo "PUBLIC_BYTES=$(wc -c < "$public" | tr -d ' ')"

      - name: Test likely Hostinger domain roots read-only
        shell: bash
        run: |
          set -euo pipefail
          public="$RUNNER_TEMP/public-index.html"
          public_sha="$(sha256sum "$public" | awk '{print $1}')"
          found=''
          for candidate in '/domains/cryptoworldz.xyz/public_html' '/domains/cryptoworldz.xyz' '/domains/www.cryptoworldz.xyz/public_html'; do
            safe="$(printf '%s' "$candidate" | tr '/.' '__')"
            local_file="$RUNNER_TEMP/candidate${safe}.html"
            rm -f "$local_file"
            set +e
            timeout 45 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$HOSTINGER_TLS_ALIAS" -e "set cmd:fail-exit yes; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname yes; cd '$candidate'; get index.html -o '$local_file'; bye"
            status=$?
            set -e
            if [[ "$status" != '0' || ! -s "$local_file" ]]; then
              echo "CANDIDATE_MISSING=$candidate"
              continue
            fi
            sha="$(sha256sum "$local_file" | awk '{print $1}')"
            bytes="$(wc -c < "$local_file" | tr -d ' ')"
            printf 'CANDIDATE path=%s sha256=%s bytes=%s title=' "$candidate" "$sha" "$bytes"
            sed -n 's:.*<title>\(.*\)</title>.*:\1:p' "$local_file" | head -n1
            if [[ "$sha" == "$public_sha" ]]; then
              echo "CRYPTOWORLDZ_LIVE_FTP_ROOT=$candidate"
              found="$candidate"
              break
            fi
          done
          if [[ -z "$found" ]]; then
            echo 'CRYPTOWORLDZ_LIVE_FTP_ROOT=NOT_EXACTLY_MATCHED'
          fi
