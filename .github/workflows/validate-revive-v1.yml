name: Validate REVIVE v1 private build

on:
  push:
    branches:
      - revive-v1-build
    paths:
      - 'worldzpad-mainnet/revive/**'
      - 'worldzpad-mainnet/fairfee/**'
      - 'worldzpad-mainnet/legacy-flywheel/**'
      - 'worldzpad-devnet/revive-party/**'
      - 'scripts/validate_revive_v1.py'
      - 'supabase/functions/revive-claim/**'
      - 'supabase/functions/revive-devnet-bootstrap/**'
      - 'supabase/functions/worldz-legacy-proof/**'
      - '.github/workflows/validate-revive-v1.yml'
  pull_request:
    paths:
      - 'worldzpad-mainnet/revive/**'
      - 'worldzpad-mainnet/fairfee/**'
      - 'worldzpad-mainnet/legacy-flywheel/**'
      - 'worldzpad-devnet/revive-party/**'
      - 'scripts/validate_revive_v1.py'
      - 'supabase/functions/revive-claim/**'
      - 'supabase/functions/revive-devnet-bootstrap/**'
      - 'supabase/functions/worldz-legacy-proof/**'

permissions:
  contents: read
  id-token: write

concurrency:
  group: revive-v1-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate REVIVE allocation and launch gates
        run: python scripts/validate_revive_v1.py
      - name: Ensure REVIVE remains outside public LaunchPad deployment root
        shell: bash
        run: |
          test ! -e launchpad.cryptoworldz.xyz/revive
          grep -q '"publicMainnetExecutionEnabled": false' worldzpad-mainnet/revive/revive-launch-contract.v1.json
          grep -q '"regenerationLockedUntilGeneratorFixVerified": true' worldzpad-mainnet/revive/revive-launch-contract.v1.json
      - name: Validate claim verifier is non-executing
        shell: bash
        run: |
          grep -q 'const CLAIM_EXECUTION_ENABLED = false' supabase/functions/revive-claim/index.ts
          ! grep -q 'claim_signature.*update' supabase/functions/revive-claim/index.ts
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned REVIVE proof SDKs
        working-directory: worldzpad-devnet/revive-party
        run: npm install --no-audit --no-fund
      - name: Syntax-check network proof scripts
        working-directory: worldzpad-devnet/revive-party
        run: |
          node --check scripts/01_dbc_devnet.mjs
          node --check scripts/02_verify_devnet.mjs
          node --check scripts/04_legacy_live_scanner.mjs
          node --check scripts/router_program_client.mjs
      - name: Run deterministic REVIVE proofs
        working-directory: worldzpad-devnet/revive-party
        run: |
          npm run static-proof
          npm run stage-b-static
          npm run legacy-epoch-proof
          npm run router-static
      - name: Compile-check Legacy router Rust program
        working-directory: worldzpad-devnet/revive-party
        run: cargo check --manifest-path router-program/Cargo.toml
      - name: Emit tested dependency lockfiles for source-control capture
        working-directory: worldzpad-devnet/revive-party
        shell: bash
        run: |
          test -s package-lock.json
          test -s router-program/Cargo.lock
          printf 'REVIVE_PACKAGE_LOCK_B64='
          base64 -w0 package-lock.json
          printf '\n'
          printf 'REVIVE_CARGO_LOCK_B64='
          base64 -w0 router-program/Cargo.lock
          printf '\n'

  devnet-stage-a:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    env:
      DEVNET_PAYER_SECRET_JSON: ${{ secrets.DEVNET_PAYER_SECRET_JSON }}
      SOLANA_RPC_URL: ${{ secrets.DEVNET_SOLANA_RPC_URL }}
      DEVNET_PAYER_KEYPAIR_FILE: /tmp/revive-devnet-payer.json
      DEVNET_PAYER_PUBKEY_FILE: /tmp/revive-devnet-payer.pubkey
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worldzpad-devnet/revive-party
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Solana + Meteora SDKs
        run: npm install --no-audit --no-fund
      - name: Static 75-bps MagicFee + 10 Legacy PDA proof
        run: npm run static-proof
      - name: Static partner router + six-hour HODLer settlement proof
        run: npm run stage-b-static
      - name: Deterministic six-hour Legacy epoch proof
        run: npm run legacy-epoch-proof
      - name: Static Legacy router program contract proof
        run: npm run router-static
      - name: Compile-check Legacy router Rust program
        run: cargo check --manifest-path router-program/Cargo.toml
      - name: Generate disposable devnet payer
        if: env.DEVNET_PAYER_SECRET_JSON == ''
        run: npm run prepare-payer
      - name: Bootstrap disposable payer from authenticated Worldz devnet helper
        if: env.DEVNET_PAYER_SECRET_JSON == ''
        shell: bash
        run: |
          OIDC_JSON=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=worldz-revive-devnet-bootstrap")
          OIDC=$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$OIDC_JSON")
          PUBKEY=$(tr -d '\n' < "$DEVNET_PAYER_PUBKEY_FILE")
          STATUS=$(curl -sS -o /tmp/revive-bootstrap-response.json -w "%{http_code}" -X POST "https://hknymhhyqldtzmplzuzh.supabase.co/functions/v1/revive-devnet-bootstrap" \
            -H "Authorization: Bearer $OIDC" \
            -H "Content-Type: application/json" \
            --data "{\"address\":\"$PUBKEY\"}")
          cat /tmp/revive-bootstrap-response.json || true
          echo "REVIVE_BOOTSTRAP_HELPER_HTTP=$STATUS"
          # The authenticated helper is best-effort because public devnet faucets are rate-limited.
          # The next step independently tries provider fallbacks and must prove the actual balance.
      - name: Prove tiny PoW transaction-gas bootstrap
        if: env.DEVNET_PAYER_SECRET_JSON == ''
        run: npm run bootstrap-payer
      - name: Install Solana devnet Proof-of-Work faucet client
        if: env.DEVNET_PAYER_SECRET_JSON == ''
        shell: bash
        run: cargo install devnet-pow
      - name: Mine disposable devnet SOL with the PoW faucet
        if: env.DEVNET_PAYER_SECRET_JSON == ''
        shell: bash
        run: |
          devnet-pow -k "$DEVNET_PAYER_KEYPAIR_FILE" -u dev -c confirmed mine -d 3 --reward 0.02 --no-infer --target-lamports 100000000
      - name: Prove disposable payer actually received devnet SOL
        if: env.DEVNET_PAYER_SECRET_JSON == ''
        run: npm run verify-payer
      - name: Create disposable REVIVE-style Meteora DBC pool on Solana devnet
        run: npm run dbc-proof
      - name: Independently verify devnet transaction and accounts
        run: npm run verify-proof
      - name: Publish Stage A evidence
        uses: actions/upload-artifact@v4
        with:
          name: revive-worldzparty-stage-a
          path: |
            worldzpad-devnet/revive-party/artifacts/revive-static-proof.json
            worldzpad-devnet/revive-party/artifacts/revive-stage-b-static-proof.json
            worldzpad-devnet/revive-party/artifacts/revive-router-program-static-proof.json
            worldzpad-devnet/revive-party/artifacts/revive-dbc-devnet-proof.json
            worldzpad-devnet/revive-party/artifacts/revive-dbc-devnet-verified.json
          if-no-files-found: error
          retention-days: 30


  legacy-live-boundary:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    env:
      LEGACY_READ_RPC_URL: ${{ secrets.LEGACY_READ_RPC_URL }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worldzpad-devnet/revive-party
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned SDKs
        run: npm install --no-audit --no-fund
      - name: Capture one read-only mainnet Legacy holder boundary
        run: npm run legacy-live-snapshot
      - name: Publish holder-boundary evidence
        uses: actions/upload-artifact@v4
        with:
          name: revive-legacy-live-boundary
          path: worldzpad-devnet/revive-party/artifacts/legacy-live-boundary-snapshot.json
          if-no-files-found: error
          retention-days: 30
