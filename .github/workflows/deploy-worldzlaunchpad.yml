name: Deploy WorldzLaunchPad

on:
  push:
    branches: [main]
    paths:
      - 'launchpad.cryptoworldz.xyz/**'
      - '.github/workflows/deploy-worldzlaunchpad.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worldzlaunchpad-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate public WorldzLaunchPad contract
        shell: python
        run: |
          import json
          from pathlib import Path

          root=Path('launchpad.cryptoworldz.xyz')
          platform=json.loads((root/'platform-config.json').read_text())
          fee=platform['feePolicy']
          safe=platform['safeLaunchPolicy']
          treasury=platform['treasuryRouting']
          founding=platform['founding100']
          base_adapter=platform['baseEvmFair']

          assert platform['publicLaunchPad'] is True
          assert platform['publicLaunchIntakeEnabled'] is True
          assert platform['publicLaunchRegistryEnabled'] is True
          assert platform['publicMainnetCreatorLaunchesEnabled'] is False
          assert platform['devnetTokenCreationEnabled'] is True

          assert fee['projectTradingFeeMinPercent']==0.5
          assert fee['projectTradingFeeMaxPercent']==3
          assert fee['worldzLaunchPadShareOfCollectedProjectFeePercent']==10
          assert fee['platformShareCapPercentOfCollectedProjectFee']==10
          assert fee['projectRetainedShareOfCollectedProjectFeePercent']==90
          assert fee['worldzLaunchPadShareOfTokenSupplyPercent']==0
          assert fee['worldzLaunchPadShareOfInitialLiquidityPercent']==0
          assert fee['walletTransferTaxPercent']==0

          assert treasury['destination']=='Worldz Treasury Multisig'
          assert treasury['requiredThreshold']=='2-of-3'
          assert treasury['vaultAddress']=='n9Jq3soh2ka22xNAy2syX96Pp3QZB7mc7kwysgNvhHB'
          assert treasury['status']=='VAULT_REGISTERED__MAINNET_ROUTE_PROOF_PENDING'
          assert treasury['verifiedEvidence']['memberCount']==3
          assert treasury['verifiedEvidence']['threshold']=='2-of-3'
          assert treasury['mainnetRoutingEnabled'] is False
          assert founding['totalPositions']==100
          assert founding['futureWorldzPoolPercent']==10
          assert founding['equalAllocationPerQualifiedPositionPercent']==0.1
          assert founding['devnetEligible'] is False
          assert founding['priceOrVolumeRankingUsed'] is False
          assert base_adapter['status']=='BASE_SEPOLIA_BETA'
          assert base_adapter['chainId']==84532
          assert base_adapter['mainnetChainId']==8453
          assert base_adapter['mainnetExecution'] is False
          assert base_adapter['tokenDeployment'] is True
          assert base_adapter['liquidityPoolCreation'] is False
          assert base_adapter['feeRouterExecuting'] is False

          assert safe['version']=='WORLDZ-SAFE-LAUNCH-1'
          assert safe['compulsory']['fixedSupply'] is True
          assert safe['compulsory']['revokeMintAuthorityAfterGenesis'] is True
          assert safe['compulsory']['revokeFreezeAuthorityAfterGenesis'] is True
          assert safe['allocations']['creatorTeamMaxPercent']==15
          assert safe['allocations']['creatorTeamUnlockedAtGenesisMaxPercent']==5
          assert safe['allocations']['liquidityMinPercent']==25
          assert safe['allocations']['liquidityMaxPercent']==60
          assert safe['allocations']['communityPublicMinPercent']==20
          assert safe['allocations']['treasuryReserveMaxPercent']==15
          assert safe['allocations']['founderCliffMinDays']==90
          assert safe['allocations']['founderVestingMinMonths']==18
          assert safe['allocations']['creatorControlledLpLockPercent']==100
          assert safe['allocations']['lpLockMinDays']==365
          assert safe['feeRoutes']['creatorMaxPercent']==20
          assert safe['feeRoutes']['treasuryMaxPercent']==20
          assert safe['feeRoutes']['lpGrowthMinPercent']==20
          assert safe['feeRoutes']['holdersLpCommunityCombinedMinPercent']==60

          required=[
            root/'index.html',root/'app.js',root/'style.css',root/'status.php',
            root/'platform-config.json',root/'metadata.php',
            root/'devnet/index.html',root/'devnet/app.js',
            root/'curve/index.html',root/'curve/app.js',
            root/'curve-pro/index.html',root/'curve-pro/app.js',
            root/'mainnet/index.html',root/'mainnet/app.js',
            root/'base/index.html',root/'base/app.js',
            root/'omnichain/index.html'
          ]
          for p in required:
              assert p.is_file() and p.stat().st_size>500, p

          home=(root/'index.html').read_text()
          app=(root/'app.js').read_text()
          devnet=(root/'devnet/index.html').read_text()
          devnet_js=(root/'devnet/app.js').read_text()
          curve=(root/'curve/index.html').read_text()
          curve_js=(root/'curve/app.js').read_text()
          curve_pro=(root/'curve-pro/index.html').read_text()
          curve_pro_js=(root/'curve-pro/app.js').read_text()
          mainnet=(root/'mainnet/index.html').read_text()
          mainnet_js=(root/'mainnet/app.js').read_text()
          base_html=(root/'base/index.html').read_text()
          base_js=(root/'base/app.js').read_text()

          assert 'PUBLIC TOKEN LAUNCHPAD' in home
          assert 'Who will be first?' in home
          assert 'of your collected token fee only' in home
          assert 'of that fee remains for your project routing' in home
          assert 'of your token supply taken by WorldzLaunchPad' in home
          assert 'WORLDZ SAFE LAUNCH STANDARD' in home
          assert 'FIRST PUBLIC LAUNCH SLOT OPEN' in app
          assert 'WORLDZLAUNCHPAD FOUNDING 100' in home
          assert '10% of the future WORLDZ supply' in home
          assert 'Founding 100 contract mismatch' in app
          assert 'platformShareCapPercentOfCollectedProjectFee' in app

          banned=[
            'REVIVE','RVIV','PHENIX','PNEX','MIRACLE','MRCL','WLDZ',
            'GENESIS FOUR','Genesis Four','Legacy Loyalty','SolSavewXRP',
            'worldzpad-four-token','FOUR-TOKEN-LAUNCH'
          ]
          public_files=[p for p in root.rglob('*') if p.is_file() and p.suffix.lower() in {'.html','.js','.json','.php','.css'}]
          for p in public_files:
              text=p.read_text(errors='ignore')
              for term in banned:
                  assert term not in text, f'PRIVATE_PLAN_TERM_EXPOSED {term} in {p}'

          assert 'Create Devnet Token' in devnet
          assert 'worldz-launch-register' in devnet_js
          assert 'DEVNET_PROGRAM_ID.CREATE_CPMM_POOL_PROGRAM' in devnet_js
          assert 'RAYDIUM LAUNCHLAB DEVNET LAUNCH CREATED' in curve
          assert 'createPlatformConfig' in curve_js and 'createLaunchpad' in curve_js
          assert 'METEORA DBC DEVNET LAUNCH CREATED' in curve_pro
          assert 'Project trading fee must be 0.50%–3.00%.' in curve_pro_js
          assert 'Creator/team locked vesting must be 0–15%.' in curve_pro_js
          assert 'PUBLIC MAINNET ROUTE' in mainnet
          assert '10% ONLY' in mainnet
          assert 'Gate Locked' in mainnet
          assert "clusterApiUrl('mainnet-beta')" in mainnet_js
          assert 'feeClaimer:treasuryVault' in mainnet_js
          assert 'creatorTradingFeePercentage:90' in mainnet_js
          assert 'partnerPermanentLockedLiquidityPercentage:10' in mainnet_js
          assert 'creatorPermanentLockedLiquidityPercentage:90' in mainnet_js
          assert 'if(!gateOpen())' in mainnet_js
          assert "client.state.getPoolConfig(configKey.publicKey)" in mainnet_js
          assert "String(configInfo.feeClaimer)!==treasuryVault.toBase58()" in mainnet_js
          assert "Number(configInfo.creatorTradingFeePercentage)!==90" in mainnet_js
          assert 'WORLDZ EVM FAIR' in base_html
          assert 'Base Sepolia' in base_html
          assert 'WORLDZ_SAFE_LAUNCH_VERSION = 1' in base_js
          assert 'creator >5%' in base_js
          assert 'duplicate recipient' in base_js

          print('WORLDZLAUNCHPAD_PUBLIC_CONTRACT=PASS public=1 fee_share=10 project_share=90 supply_take=0 liquidity_take=0 founding100=1 base_sepolia=1 private_plan_exposure=0 mainnet_adapter_prepared=1 mainnet=0')

      - name: Run 100+ anti-cheat tokenomics scenarios
        shell: python
        run: |
          import json, math
          from pathlib import Path

          p=json.loads(Path('launchpad.cryptoworldz.xyz/platform-config.json').read_text())
          safe=p['safeLaunchPolicy']
          fee=p['feePolicy']
          A=safe['allocations']
          R=safe['feeRoutes']

          def valid(cfg):
              try:
                  supply=int(cfg['supply']); decimals=int(cfg['decimals']); f=float(cfg['fee'])
                  alloc=cfg['alloc']; routes=cfg['routes']
                  if not (p['safeLaunchPolicy']['token']['supplyMin'] <= supply <= p['safeLaunchPolicy']['token']['supplyMax']): return False
                  if not (p['safeLaunchPolicy']['token']['decimalsMin'] <= decimals <= p['safeLaunchPolicy']['token']['decimalsMax']): return False
                  if not (fee['projectTradingFeeMinPercent'] <= f <= fee['projectTradingFeeMaxPercent']): return False
                  if abs(sum(alloc.values())-100)>1e-9: return False
                  if any((not math.isfinite(float(v)) or v<0 or v>100) for v in alloc.values()): return False
                  if alloc['creatorTeam']>A['creatorTeamMaxPercent']: return False
                  if cfg['creatorUnlocked']>A['creatorTeamUnlockedAtGenesisMaxPercent'] or cfg['creatorUnlocked']>alloc['creatorTeam']: return False
                  if not (A['liquidityMinPercent']<=alloc['liquidity']<=A['liquidityMaxPercent']): return False
                  if alloc['communityPublic']<A['communityPublicMinPercent']: return False
                  if alloc['treasuryReserve']>A['treasuryReserveMaxPercent']: return False
                  if cfg['cliffDays']<A['founderCliffMinDays']: return False
                  if cfg['vestingMonths']<A['founderVestingMinMonths']: return False
                  if cfg['lpLockPercent']!=100 or cfg['lpLockDays']<A['lpLockMinDays']: return False
                  if abs(sum(routes.values())-100)>1e-9: return False
                  if any((not math.isfinite(float(v)) or v<0 or v>100) for v in routes.values()): return False
                  if routes['creator']>R['creatorMaxPercent']: return False
                  if routes['treasury']>R['treasuryMaxPercent']: return False
                  if routes['lp']<R['lpGrowthMinPercent']: return False
                  if routes['holders']+routes['lp']+routes['community']<R['holdersLpCommunityCombinedMinPercent']: return False
                  return True
              except Exception:
                  return False

          base={
            'supply':1_000_000,'decimals':9,'fee':1.0,
            'alloc':{'creatorTeam':15,'liquidity':30,'communityPublic':30,'treasuryReserve':10,'growthEcosystem':15},
            'creatorUnlocked':5,'cliffDays':90,'vestingMonths':24,'lpLockPercent':100,'lpLockDays':365,
            'routes':{'creator':20,'holders':30,'lp':25,'treasury':15,'community':10}
          }
          def clone():
              return json.loads(json.dumps(base))

          cases=[]
          cases.append(('baseline_valid',clone(),True))

          for f in [0,0.1,0.49,0.5,0.75,1,1.5,2,2.5,3,3.01,4,9,99]:
              c=clone();c['fee']=f;cases.append((f'fee_{f}',c,0.5<=f<=3))
          for v in range(0,26):
              c=clone();c['alloc']['creatorTeam']=v;c['alloc']['growthEcosystem']=30-v
              c['creatorUnlocked']=min(5,v)
              cases.append((f'creator_alloc_{v}',c,v<=15))
          for v in range(15,71,5):
              c=clone();delta=v-c['alloc']['liquidity'];c['alloc']['liquidity']=v;c['alloc']['growthEcosystem']-=delta
              expect=25<=v<=60 and c['alloc']['growthEcosystem']>=0
              cases.append((f'liquidity_{v}',c,expect))
          for v in [0,5,10,15,19,20,21,30,50]:
              c=clone();delta=v-c['routes']['creator'];c['routes']['creator']=v;c['routes']['holders']-=delta
              expect=v<=20 and c['routes']['holders']>=0
              cases.append((f'creator_route_{v}',c,expect))
          for v in [0,5,10,15,19,20,21,30,50]:
              c=clone();delta=v-c['routes']['treasury'];c['routes']['treasury']=v;c['routes']['holders']-=delta
              expect=v<=20 and c['routes']['holders']>=0
              cases.append((f'treasury_route_{v}',c,expect))
          for v in [0,5,10,15,19,20,21,25,30,50]:
              c=clone();delta=v-c['routes']['lp'];c['routes']['lp']=v;c['routes']['holders']-=delta
              expect=v>=20 and c['routes']['holders']>=0 and (c['routes']['holders']+v+c['routes']['community']>=60)
              cases.append((f'lp_route_{v}',c,expect))
          for v in [0,30,60,89,90,91,120,365]:
              c=clone();c['cliffDays']=v;cases.append((f'cliff_{v}',c,v>=90))
          for v in [0,1,6,12,17,18,19,24,36,60]:
              c=clone();c['vestingMonths']=v;cases.append((f'vesting_{v}',c,v>=18))
          for v in [0,30,90,180,364,365,366,730]:
              c=clone();c['lpLockDays']=v;cases.append((f'lp_lock_days_{v}',c,v>=365))
          for v in [0,25,50,99,100]:
              c=clone();c['lpLockPercent']=v;cases.append((f'lp_lock_percent_{v}',c,v==100))
          for v in [1,999,1000,10_000,1_000_000,1_000_000_000_000,1_000_000_000_001]:
              c=clone();c['supply']=v;cases.append((f'supply_{v}',c,1000<=v<=1_000_000_000_000))
          for v in [-1,0,1,6,9,10]:
              c=clone();c['decimals']=v;cases.append((f'decimals_{v}',c,0<=v<=9))

          # Deliberate total/negative/over-100 tampering.
          for i in range(25):
              c=clone()
              if i%5==0: c['alloc']['growthEcosystem']+=1
              elif i%5==1: c['alloc']['creatorTeam']=-1
              elif i%5==2: c['routes']['community']+=1
              elif i%5==3: c['routes']['creator']=-1
              else: c['routes']['lp']=101
              cases.append((f'tamper_{i}',c,False))

          assert len(cases)>=100, len(cases)
          failed=[]
          for name,cfg,expected in cases:
              got=valid(cfg)
              if got!=expected: failed.append((name,expected,got,cfg))
          assert not failed, failed[:5]
          print(f'WORLDZLAUNCHPAD_POLICY_SCENARIOS=PASS scenarios={len(cases)}')

      - name: Deploy public WorldzLaunchPad to Hostinger
        shell: python
        run: |
          import os, ssl
          from ftplib import FTP_TLS, error_perm
          from pathlib import Path, PurePosixPath

          local_root=Path('launchpad.cryptoworldz.xyz')
          remote_root='domains/cryptoworldz.xyz/public_html/launchpad'
          ftp=FTP_TLS(context=ssl._create_unverified_context())
          ftp.connect(os.environ['FTP_HOST'],int(os.environ.get('FTP_PORT','21')),timeout=40)
          ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          ftp.prot_p(); ftp.set_pasv(True)

          def ensure_dir(directory):
              ftp.cwd('/')
              for part in PurePosixPath(directory).parts:
                  if part in ('','/'): continue
                  try: ftp.cwd(part)
                  except error_perm:
                      ftp.mkd(part); ftp.cwd(part)

          count=0
          for f in sorted(p for p in local_root.rglob('*') if p.is_file()):
              rel=f.relative_to(local_root).as_posix()
              remote=PurePosixPath(remote_root)/rel
              ensure_dir(str(remote.parent))
              with f.open('rb') as handle:
                  ftp.storbinary(f'STOR {remote.name}',handle,blocksize=262144)
              count+=1

          # Purge obsolete private-plan artifacts from the public document root.
          for old in ['default.php','tokens.json','console-data.json','wldz-mainnet-plan.json']:
              try: ftp.delete(str(PurePosixPath(remote_root)/old))
              except Exception: pass

          try: ftp.quit()
          except Exception: ftp.close()
          print(f'WORLDZLAUNCHPAD_DEPLOY=PASS files={count} target={remote_root}')

      - name: Verify live public application
        shell: python
        run: |
          import json,time,urllib.request,urllib.error
          base='https://launchpad.cryptoworldz.xyz'
          registry='https://hknymhhyqldtzmplzuzh.supabase.co/functions/v1/worldz-launch-register'
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'WorldzLaunchPad-Live-Verify/5.0','Cache-Control':'no-cache','Origin':base})
              with urllib.request.urlopen(req,timeout=25) as r:return r.status,r.read().decode('utf-8','ignore')
          last=''
          banned=['REVIVE','RVIV','PHENIX','PNEX','MIRACLE','MRCL','WLDZ','GENESIS FOUR','Genesis Four','Legacy Loyalty','SolSavewXRP']
          for attempt in range(1,7):
              try:
                  status,body=get(base+'/?verify=public-v6')
                  _,platform_body=get(base+'/platform-config.json?verify=public-v6')
                  dev_code,dev_body=get(base+'/devnet/?verify=public-v6')
                  curve_code,curve_body=get(base+'/curve/?verify=public-v6')
                  pro_code,pro_body=get(base+'/curve-pro/?verify=public-v6')
                  mainnet_code,mainnet_body=get(base+'/mainnet/?verify=public-v6')
                  base_code,base_body=get(base+'/base/?verify=public-v6')
                  status_code,status_body=get(base+'/status.php?verify=public-v6')
                  reg_code,reg_body=get(registry+'?verify=public-v6')
                  platform=json.loads(platform_body); live=json.loads(status_body); public_registry=json.loads(reg_body)

                  assert status==200
                  assert 'PUBLIC TOKEN LAUNCHPAD' in body
                  assert 'Who will be first?' in body
                  assert 'of your collected token fee only' in body
                  assert 'of that fee remains for your project routing' in body
                  assert all(term not in body for term in banned)

                  assert platform['publicLaunchPad'] is True
                  assert platform['feePolicy']['platformShareCapPercentOfCollectedProjectFee']==10
                  assert platform['feePolicy']['projectRetainedShareOfCollectedProjectFeePercent']==90
                  assert platform['feePolicy']['worldzLaunchPadShareOfTokenSupplyPercent']==0
                  assert platform['feePolicy']['worldzLaunchPadShareOfInitialLiquidityPercent']==0
                  assert platform['publicMainnetCreatorLaunchesEnabled'] is False
                  assert platform['founding100']['totalPositions']==100
                  assert platform['founding100']['futureWorldzPoolPercent']==10
                  assert platform['baseEvmFair']['status']=='BASE_SEPOLIA_BETA'
                  assert platform['baseEvmFair']['mainnetExecution'] is False

                  assert dev_code==200 and 'Create Devnet Token' in dev_body
                  assert curve_code==200 and 'Worldz Curve™' in curve_body
                  assert pro_code==200 and 'Worldz Curve Pro™' in pro_body
                  assert mainnet_code==200 and 'PUBLIC MAINNET ROUTE' in mainnet_body and 'Gate Locked' in mainnet_body and '10% ONLY' in mainnet_body
                  assert base_code==200 and 'WORLDZ EVM FAIR™' in base_body and 'BASE SEPOLIA' in base_body
                  assert status_code==200 and live['ok'] is True
                  assert reg_code==200 and public_registry['ok'] is True
                  assert public_registry['platformSharePercentOfCollectedTokenFee']==10
                  assert public_registry['founding100']['totalPositions']==100
                  assert public_registry['founding100']['futureWorldzPoolPercent']==10
                  assert public_registry['founding100']['equalAllocationPerQualifiedPositionPercent']==0.1

                  print('WORLDZLAUNCHPAD_LIVE=PASS public=1 registry=1 fee_only_10=1 founding100=1 base_sepolia=1 private_plan_exposure=0 flash=1 curve=1 curve_pro=1 mainnet_adapter=1 mainnet_gate_closed=1')
                  raise SystemExit(0)
              except SystemExit: raise
              except Exception as e:
                  last=repr(e); print(f'LIVE_RETRY attempt={attempt} {last}'); time.sleep(attempt*3)
          raise SystemExit('WORLDZLAUNCHPAD_LIVE=FAIL '+last)
