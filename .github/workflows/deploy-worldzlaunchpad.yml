          assert 'createAssociatedTokenAccountInstruction(owner,ata,vault' in genesis_js
          assert all(term not in genesis_html and term not in genesis_js for term in banned)
          assert platform['worldzMint']['version']=='WORLDZMINT-1'
          assert platform['worldzMint']['status']=='PUBLIC_MAINNET_MINT_BETA'
          assert platform['worldzMint']['platformTokenSupplyTakePercent']==0
