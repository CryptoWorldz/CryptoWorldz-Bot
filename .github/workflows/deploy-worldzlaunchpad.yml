      - name: Deploy public WorldzLaunchPad to Hostinger
        shell: python
        run: |
          import os, ssl, time, hashlib, io
          from ftplib import FTP_TLS, error_perm
          from pathlib import Path, PurePosixPath

          local_root=Path('launchpad.cryptoworldz.xyz')
          remote_root='domains/cryptoworldz.xyz/public_html/launchpad'
          files=sorted(p for p in local_root.rglob('*') if p.is_file())

          def connect():
              ftp=FTP_TLS(context=ssl._create_unverified_context())
              ftp.connect(os.environ['FTP_HOST'],int(os.environ.get('FTP_PORT','21')),timeout=45)
              ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
              ftp.prot_p()
              ftp.set_pasv(True)
              return ftp

          def ensure_dir(ftp,directory):
              ftp.cwd('/')
              for part in PurePosixPath(directory).parts:
                  if part in ('','/'): continue
                  try: ftp.cwd(part)
                  except error_perm:
                      try: ftp.mkd(part)
                      except error_perm: pass
                      ftp.cwd(part)

          last=None
          for attempt in range(1,5):
              ftp=None
              try:
                  print(f'WORLDZLAUNCHPAD_FTPS attempt={attempt}/4')
                  ftp=connect()
                  count=0
                  for local in files:
                      rel=local.relative_to(local_root).as_posix()
                      remote=PurePosixPath(remote_root)/rel
                      ensure_dir(ftp,str(remote.parent))
                      with local.open('rb') as handle:
                          ftp.storbinary(f'STOR {remote.name}',handle,blocksize=262144)
                      count+=1

                  for old in ['default.php','tokens.json','console-data.json','wldz-mainnet-plan.json']:
                      try: ftp.delete(str(PurePosixPath(remote_root)/old))
                      except Exception: pass

                  # Prove the critical FullScope file actually reached Hostinger unchanged.
                  local_fullscope=local_root/'fullscope'/'index.html'
                  local_sha=hashlib.sha256(local_fullscope.read_bytes()).hexdigest()
                  remote_bytes=bytearray()
                  ftp.cwd('/'+str(PurePosixPath(remote_root)/'fullscope'))
                  ftp.retrbinary('RETR index.html', remote_bytes.extend, blocksize=262144)
                  remote_sha=hashlib.sha256(bytes(remote_bytes)).hexdigest()
                  print(f'WORLDZLAUNCHPAD_REMOTE_FULLSCOPE_SHA local={local_sha} remote={remote_sha} bytes={len(remote_bytes)}')
                  if remote_sha != local_sha:
                      raise RuntimeError('WORLDZLAUNCHPAD_REMOTE_FULLSCOPE_MISMATCH')

                  try: ftp.quit()
                  except Exception: ftp.close()
                  print(f'WORLDZLAUNCHPAD_DEPLOY=PASS files={count} target={remote_root} attempt={attempt}')
                  break
              except Exception as exc:
                  last=exc
                  print(f'WORLDZLAUNCHPAD_FTPS_RETRY attempt={attempt} error={type(exc).__name__}: {exc}')
                  if ftp is not None:
                      try: ftp.close()
                      except Exception: pass
                  if attempt==4:
                      raise
                  time.sleep(attempt*8)
          else:
              raise last or RuntimeError('WorldzLaunchPad FTPS deployment failed')

