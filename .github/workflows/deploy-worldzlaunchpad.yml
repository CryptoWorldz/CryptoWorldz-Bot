name: Deploy WorldzLaunchPad

on:
  push:
    branches: [main]
    paths:
      - 'launchpad.cryptoworldz.xyz/**'
      - '.github/workflows/deploy-worldzlaunchpad.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worldzlaunchpad-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
    steps:
      - uses: actions/checkout@v4

      - name: Gate production on canonical Worldz token identity
        run: python scripts/validate_worldz_token_identity.py

      - name: Validate public WorldzLaunchPad contract
        shell: python
        run: |
          import json
          from pathlib import Path

          root=Path('launchpad.cryptoworldz.xyz')
          platform=json.loads((root/'platform-config.json').read_text())
          fee=platform['feePolicy']
          safe=platform['safeLaunchPolicy']
          treasury=platform['treasuryRouting']
          founding=platform['founding100']
          base_adapter=platform['baseEvmFair']

          assert platform['publicLaunchPad'] is True
          assert platform['publicLaunchIntakeEnabled'] is True
          assert platform['publicLaunchRegistryEnabled'] is True
          assert platform['publicMainnetCreatorLaunchesEnabled'] is False
          assert platform['devnetTokenCreationEnabled'] is True

          assert fee['projectTradingFeeMinPercent']==0.5
          assert fee['projectTradingFeeMaxPercent']==3
          assert fee['worldzLaunchPadContributionChoicesPercent']==[3,5,8]
          assert fee['worldzLaunchPadContributionDefaultPercent']==5
          assert fee['contributionChoiceVoluntary'] is True
          assert fee['contributionChoiceSnapshottedAtLaunch'] is True
          assert fee['feeFlowVersion']=='WORLDZ-FEE-FLOW-V3'
          assert fee['creatorRetentionByContribution']=={'3':97,'5':95,'8':92}
          assert fee['legacyCorePercentOfWorldzContribution']==10
          assert fee['legacyCoreTokenCount']==12
          assert fee['coreFamilyMarketBuyPercentOfWorldzContribution']==10
          assert fee['coreFamilySymbols']==['WLDZ','RVIV','PNEX','MRCL']
          assert fee['worldzInternalSplitPercent']=={
            'operationsProductDevelopment':20,'treasury':20,'lpGrowth':15,'legacyCore':10,
            'worldzCoreFamilyMarketBuys':10,'impactCharity':10,'teamBuilderRewards':5,
            'futureLaunchInfrastructure':5,'launchReferrer':5
          }
          assert fee['treasuryLane']['worldzOperationsTreasuryPercent']==70
          assert fee['treasuryLane']['worldzMiracleTeamTreasuryPercent']==30
          assert fee['worldzLaunchPadShareOfTokenSupplyPercent']==0
          assert fee['worldzLaunchPadShareOfInitialLiquidityPercent']==0
          assert fee['walletTransferTaxPercent']==0

          assert treasury['destination']=='Worldz Treasury Multisig'
          assert treasury['requiredThreshold']=='3-of-5'
          assert treasury['vaultAddress']=='n9Jq3soh2ka22xNAy2syX96Pp3QZB7mc7kwysgNvhHB'
          assert treasury['multisigConfigAddress']=='B9S37HguduNZ5TXWCxMi7cZMCm89ExCB751N4bpMQ7bN'
          assert treasury['vaultIndex']==0
          assert treasury['status']=='OPERATIONS_3_OF_5_ONCHAIN_VERIFIED__FEE_ROUTING_GATED'
          assert treasury['verifiedEvidence']['providerProgram']=='SQDS4ep65T869zMMBKyuUq6aD6EgTu8psMjkvj52pCf'
          assert treasury['verifiedEvidence']['memberCount']==5
          assert treasury['verifiedEvidence']['threshold']=='3-of-5'
          assert treasury['verifiedEvidence']['vaultDerivationVerified'] is True
          assert treasury['verifiedEvidence']['squadsProgramOwnerVerified'] is True
          assert treasury['targetGovernance']=='3-of-5'
          assert treasury['targetMemberCount']==5
          assert treasury['targetThreshold']==3
          assert treasury['upgradeRequiredBeforeMainnetFeeRouting'] is False
          assert treasury['onchainVerificationRequiredBeforeMainnetFeeRouting'] is True
          assert treasury['reserveTargetGovernance']=='NOT_DEPLOYED'
          assert treasury['reserveMaximumRequiredApprovals']==0
          assert treasury['reserveSweepEnabled'] is False
          standard=platform['treasuryStandard']
          assert standard['version']=='WORLDZ-TREASURY-2'
          assert standard['operationsTreasury']['signerCount']==5
          assert standard['operationsTreasury']['approvalThreshold']==3
          assert standard['reserveTreasury']['enabled'] is False
          assert standard['reserveTreasury']['signerCount']==0
          assert standard['reserveTreasury']['approvalThreshold']==0
          assert standard['reserveTreasury']['maximumRequiredApprovals']==0
          assert standard['signerRules']['privateKeysInRepository'] is False
          treasury_policy=json.loads((root/'treasury-policy.json').read_text())
          assert treasury_policy['governance']['operations']['display']=='3-of-5'
          assert treasury_policy['governance']['reserve']['display']=='NOT_DEPLOYED'
          assert treasury_policy['governance']['maximumApprovalsRequiredByWorldzPolicy']==3
          assert treasury_policy['activation']['mainnetFeeRoutingEnabled'] is False
          assert treasury_policy['chains']['solana']['operations']['vaultAddress']==treasury['vaultAddress']
          assert treasury['mainnetRoutingEnabled'] is False
          assert founding['totalPositions']==100
          assert founding['futureWorldzPoolPercent']==10
          assert founding['equalAllocationPerQualifiedPositionPercent']==0.1
          assert founding['canonicalTokenSymbol']=='WLDZ'
          assert founding['canonicalWldzMint']=='AHYnPvXMsdWxjQQrS9j5P631WWS8xBVYC57jXB6hrJ6U'
          assert founding['canonicalWldzMaxSupplyTokens']==100000000
          assert founding['wldzAllocationPoolTokens']==10000000
          assert founding['wldzPerQualifiedPositionTokens']==100000
          assert founding['devnetEligible'] is False
          assert founding['priceOrVolumeRankingUsed'] is False
          assert base_adapter['status']=='BASE_SEPOLIA_BETA'
          assert base_adapter['chainId']==84532
          assert base_adapter['mainnetChainId']==8453
          assert base_adapter['mainnetExecution'] is False
          assert base_adapter['tokenDeployment'] is True
          assert base_adapter['liquidityPoolCreation'] is False
          assert base_adapter['feeRouterExecuting'] is False

          assert safe['version']=='WORLDZ-SAFE-LAUNCH-1'
          assert safe['compulsory']['fixedSupply'] is True
          assert safe['compulsory']['revokeMintAuthorityAfterGenesis'] is True
          assert safe['compulsory']['revokeFreezeAuthorityAfterGenesis'] is True
          assert safe['allocations']['creatorTeamMaxPercent']==15
          assert safe['allocations']['creatorTeamUnlockedAtGenesisMaxPercent']==5
          assert safe['allocations']['liquidityMinPercent']==25
          assert safe['allocations']['liquidityMaxPercent']==60
          assert safe['allocations']['communityPublicMinPercent']==20
          assert safe['allocations']['treasuryReserveMaxPercent']==15
          assert safe['allocations']['founderCliffMinDays']==90
          assert safe['allocations']['founderVestingMinMonths']==18
          assert safe['allocations']['creatorControlledLpLockPercent']==100
          assert safe['allocations']['lpLockMinDays']==365
          fee_routes=safe['feeRoutes']
          assert fee_routes['model']=='WORLDZ_FEE_FLOW_V3'
          assert fee_routes['creatorRetentionByWorldzContribution']=={'3':97,'5':95,'8':92}
          assert fee_routes['worldzContributionAllowedPercent']==[3,5,8]
          assert fee_routes['worldzInternalSplitPercent']=={
            'operationsProductDevelopment':20,'treasury':20,'lpGrowth':15,'legacyCore':10,
            'worldzCoreFamilyMarketBuys':10,'impactCharity':10,'teamBuilderRewards':5,
            'futureLaunchInfrastructure':5,'launchReferrer':5
          }
          assert fee_routes['treasuryLane']['percentOfWorldzContribution']==20
          assert fee_routes['treasuryLane']['worldzOperationsTreasuryPercent']==70
          assert fee_routes['treasuryLane']['worldzMiracleTeamTreasuryPercent']==30
          assert fee_routes['totalWorldzInternalPercent']==100
          assert fee_routes['walletTransferTaxPercent']==0

          required=[
            root/'index.html',root/'app.js',root/'style.css',root/'status.php',root/'deploy/index.html',
            root/'platform-config.json',root/'treasury-policy.json',root/'metadata.php',
            root/'devnet/index.html',root/'devnet/app.js',
            root/'curve/index.html',root/'curve/app.js',
            root/'curve-pro/index.html',root/'curve-pro/app.js',
            root/'mainnet/index.html',root/'mainnet/app.js',
            root/'base/index.html',root/'base/app.js',
            root/'genesis/index.html',root/'genesis/app.js',
            root/'mint/index.html',root/'mint/app.js',root/'mint/jupiter-mobile.js',
            root/'trust/index.html',root/'trust/app.js',
            root/'omnichain/index.html',root/'fullbuild/index.html',root/'fullbuild/contract.json',root/'fullscope/index.html',root/'inheritance/index.html',root/'inheritance/contract.json',
            root/'proof-receipt/index.html',root/'.well-known/worldz-proof-receipt.schema.json',root/'schemas/worldz-proof-receipt.v1.json',
            root/'worlddexpush/index.html',root/'worlddexpush/app.js',
            root/'worlddexpush/jupiter/index.html',root/'worlddexpush/jupiter/package.json',
            root/'worlddexpush/dexscreener/index.html',root/'worlddexpush/dexscreener/package.json',
            root/'bitworldz/index.html',root/'bitworldz/app.js',root/'capabilities/index.html',
            root/'technology/index.html',root/'technology.html',
            root/'advertise/index.html',root/'ads.js',
            root/'create-your-own-money/index.html',
            root/'launch-station/index.html',root/'community/index.html',root/'integrations/index.html',root/'ready/index.html',
            root/'.well-known/worldzlaunch-readiness.json',root/'.well-known/worldzlaunch-domain-plan.json',
            root/'wldz/index.html',root/'wldz/app.js',root/'wldz/launch-config.json',
            root/'tokenlist.json',root/'.well-known/worldz-tokens.json',
            root/'rviv/index.html',root/'rviv/verify/index.html',
            root/'rviv/token-metadata.json',root/'rviv/platform-submission-pack.json',
            root/'worldz-launch/index.html',root/'worldz-launch/campaign.json',root/'worldz-launch/social-pack.json'
          ]
          for p in required:
              assert p.is_file() and p.stat().st_size>500, p

          home=(root/'index.html').read_text()
          app=(root/'app.js').read_text()
          advertise_html=(root/'advertise/index.html').read_text()
          ads_js=(root/'ads.js').read_text()
          creator_campaign_html=(root/'create-your-own-money/index.html').read_text()
          assert 'data-worldz-ad-slot="home_spotlight"' in home
          assert all(price in advertise_html for price in ('A$5','A$12','A$22','A$75'))
          assert 'SUBMIT FOR REVIEW' in advertise_html
          assert 'worldz-launchpad-ads' in advertise_html and 'worldz-launchpad-ads' in ads_js
          assert 'SPONSORED' in ads_js and 'rel = "noopener sponsored"' in ads_js
          assert 'CREATE' in creator_campaign_html and 'YOUR OWN' in creator_campaign_html and 'MONEY' in creator_campaign_html
          assert 'create your own crypto token' in creator_campaign_html.lower()
          assert 'not automatically legal tender' in creator_campaign_html.lower()
          assert 'BUILD MY TOKEN PLAN' in creator_campaign_html
          assert 'href="/launch-station/"' in creator_campaign_html
          print('WORLDZ_SPOTLIGHT_LOCAL=PASS pricing=5/12/22/75_AUD slots=3')
          print('WORLDZ_CREATE_YOUR_OWN_MONEY_LOCAL=PASS')
          devnet=(root/'devnet/index.html').read_text()
          devnet_js=(root/'devnet/app.js').read_text()
          curve=(root/'curve/index.html').read_text()
          curve_js=(root/'curve/app.js').read_text()
          curve_pro=(root/'curve-pro/index.html').read_text()
          curve_pro_js=(root/'curve-pro/app.js').read_text()
          mainnet=(root/'mainnet/index.html').read_text()
          mainnet_js=(root/'mainnet/app.js').read_text()
          base_html=(root/'base/index.html').read_text()
          base_js=(root/'base/app.js').read_text()
          genesis_html=(root/'genesis/index.html').read_text()
          genesis_js=(root/'genesis/app.js').read_text()
          mint_html=(root/'mint/index.html').read_text()
          mint_js=(root/'mint/app.js').read_text()
          jupiter_mobile_js=(root/'mint/jupiter-mobile.js').read_text()
          trust_html=(root/'trust/index.html').read_text()
          trust_js=(root/'trust/app.js').read_text()
          technology_html=(root/'technology.html').read_text()
          wldz_html=(root/'wldz'/'index.html').read_text()
          wldz_cfg=json.loads((root/'wldz'/'launch-config.json').read_text())

          assert 'PUBLIC TOKEN LAUNCHPAD' in home
          assert 'Who will be first?' in home
          assert '3% • 5% • 8%' in home
          assert '15%' in home and 'Legacy Core' in home
          assert 'WLDZ • RVIV • PNEX • MRCL' in home
          assert 'token supply / initial LP taken by WorldzLaunchPad' in home
          assert 'WORLDZ SAFE LAUNCH STANDARD' in home
          assert 'FIRST PUBLIC LAUNCH SLOT OPEN' in app
          assert 'WORLDZLAUNCHPAD FOUNDING 100' in home
          assert '10,000,000 WLDZ' in home
          assert '100,000 WLDZ per qualified position' in home
          assert 'WORLDZLAUNCHPAD™ GLOBAL LAUNCH PACK' in home
          assert 'Founding 100 contract mismatch' in app
          assert 'WORLDZ-FEE-FLOW-V2' in app
          assert 'launchpad-contribution' in app
          assert 'legacyCoreTokenCount:12' in app
          assert 'WORLDZ TECHNOLOGY & MEANINGS' in technology_html
          assert 'SOLANA MAINNET • LIVE' in wldz_html
          assert 'Canonical WORLDZ (WLDZ) is live on Solana.' in wldz_html
          assert 'GCFKk1H5Z8EfxFuAvDEXTHn8b28deUA7HxVRsipjfPiJ' in wldz_html
          assert 'proposal.js' not in wldz_html
          assert not (root/'wldz'/'proposal.js').exists(), 'retired WLDZ proposal route must stay absent'
          assert wldz_cfg['token']['mint']=='AHYnPvXMsdWxjQQrS9j5P631WWS8xBVYC57jXB6hrJ6U'
          assert wldz_cfg['status'].startswith('LIVE__')
          assert wldz_cfg['launch']['poolAddress']=='GCFKk1H5Z8EfxFuAvDEXTHn8b28deUA7HxVRsipjfPiJ'
          assert wldz_cfg['launch']['baseAmountTokens']==15000000
          assert wldz_cfg['launch']['permanentLock'] is True
          assert wldz_cfg['launch']['permanentLockPercent']==100
          assert wldz_cfg['execution']['launchExecuted'] is True
          assert wldz_cfg['execution']['broadcasted'] is True
          assert wldz_cfg['execution']['duplicateExecutionDisabled'] is True
          assert wldz_cfg['execution']['publicCreatorGate'] is False
          campaign_html=(root/'worldz-launch'/'index.html').read_text()
          campaign_json=json.loads((root/'worldz-launch'/'campaign.json').read_text())
          social_pack=json.loads((root/'worldz-launch'/'social-pack.json').read_text())
          assert 'WorldzLaunchPad™ + Command Centre MAX™' in campaign_html
          assert '100,000 WLDZ' in campaign_html and '252' in campaign_html
          assert campaign_json['status']=='PUBLIC'
          assert campaign_json['wldz']['symbol']=='WLDZ'
          assert campaign_json['wldz']['founding100']['wldzPerQualifiedPosition']==100000
          assert campaign_json['creatorCampaign']['id']=='CREATE_YOUR_OWN_MONEY_2026_10_02'
          assert campaign_json['creatorCampaign']['url']=='https://launchpad.cryptoworldz.xyz/create-your-own-money/'
          assert social_pack['approvedBy']=='JayJayTeamDev'
          assert 'Swap API V2' in technology_html
          assert 'Worldz Confidence Pulse' in technology_html
          assert 'Worldz Fee Flow' in technology_html
          assert 'WorldzMINT' in technology_html

          # Token names/tickers are intentionally public identity data. Only retired/private
          # planning terms remain blocked from the generic public surfaces.
          private_terms=[
            'GENESIS FOUR','Genesis Four','Legacy Loyalty','SolSavewXRP',
            'worldzpad-four-token','FOUR-TOKEN-LAUNCH'
          ]
          # Public-plan secrecy applies to the public LaunchPad surface. Explicit noindex owner consoles
          # are private operational routes and are checked separately below.
          public_files=[
              p for p in root.rglob('*')
              if p.is_file()
              and p.suffix.lower() in {'.html','.js','.json','.php','.css'}
              and not p.relative_to(root).parts[0].startswith(('worldz-now','wldz'))
              # JayJayTeamDev's explicit noindex RVIV signing console is an
              # owner-only operational route, not a public launch announcement.
              and p.relative_to(root).parts[0]!='rviv-dev-setup'
              and p.relative_to(root).as_posix()!='revive-distribution/rpc.php'
          ]
          owner_route=root/'rviv-dev-setup'
          for filename in ('index.html','app.js','distribute.html','distribute.js'):
              assert (owner_route/filename).is_file(), filename
          for filename in ('index.html','distribute.html'):
              assert 'noindex,nofollow,noarchive' in (owner_route/filename).read_text()
          for p in public_files:
              text=p.read_text(errors='ignore')
              rel=p.relative_to(root).as_posix()
              for term in private_terms:
                  # JayJayTeamDev explicitly approved the public validation label
                  # "REVIVE v1 VALIDATION — SUCCESS" on the dedicated X-SAVE page only.
                  if rel=='x-save/index.html' and term=='REVIVE':
                      continue
                  assert term not in text, f'PRIVATE_PLAN_TERM_EXPOSED {term} in {p}'
          xsave_html=(root/'x-save'/'index.html').read_text(errors='ignore')
          assert 'data-worldz-x-save="1"' in xsave_html
          assert 'REVIVE v1 VALIDATION — SUCCESS' in xsave_html
          assert 'X-SAVE MAINNET — OFF UNTIL PROOF' in xsave_html
          assert '6UpQcMAb5xMzxc7ZfPaVMgx3KqsvKZdT5U718BzD5We2' in xsave_html
          assert 'Read the GitHub Validation' in xsave_html
          for retired in ['worldz-now','worldz-now-v4','worldz-now-v5','worldz-now-v6']:
              assert not (root/retired).exists(), f'retired owner launch console restored: {retired}'

          assert 'Create Devnet Token' in devnet
          assert 'worldz-launch-register' in devnet_js
          assert 'DEVNET_PROGRAM_ID.CREATE_CPMM_POOL_PROGRAM' in devnet_js
          assert 'RAYDIUM LAUNCHLAB DEVNET LAUNCH CREATED' in curve
          assert 'createPlatformConfig' in curve_js and 'createLaunchpad' in curve_js
          assert 'METEORA DBC DEVNET LAUNCH CREATED' in curve_pro
          assert 'Project trading fee must be 0.50%–3.00%.' in curve_pro_js
          assert 'Creator/team locked vesting must be 0–15%.' in curve_pro_js
          assert 'PUBLIC MAINNET ROUTE' in mainnet
          assert 'WORLDZ CONFIDENCE CURVE' in mainnet.upper()
          assert '3% / 5% / 8%' in mainnet
          assert '15% • 12 TOKENS' in mainnet
          assert 'Gate Locked' in mainnet
          assert "clusterApiUrl('mainnet-beta')" in mainnet_js
          assert 'feeClaimer:treasuryVault' in mainnet_js
          assert 'creatorTradingFeePercentage:90' in mainnet_js
          assert 'partnerPermanentLockedLiquidityPercentage:10' in mainnet_js
          assert 'creatorPermanentLockedLiquidityPercentage:90' in mainnet_js
          assert 'if(!gateOpen())' in mainnet_js
          assert "client.state.getPoolConfig(configKey.publicKey)" in mainnet_js
          assert "String(configInfo.feeClaimer)!==treasuryVault.toBase58()" in mainnet_js
          assert "Number(configInfo.creatorTradingFeePercentage)!==90" in mainnet_js
          assert 'WORLDZ EVM FAIR' in base_html
          assert 'Base Sepolia' in base_html
          assert 'WORLDZ_SAFE_LAUNCH_VERSION = 1' in base_js
          assert 'creator >5%' in base_js
          assert 'duplicate recipient' in base_js
          assert 'PRIVATE GENESIS CONSOLE' in genesis_html
          assert 'noindex,nofollow,noarchive' in genesis_html
          assert 'WORLDZ_GENESIS_AUTH_V1' in genesis_js
          assert 'Fap54GTCo4ZopkwmHtbSUJZTsjTybftJfN9sPG3MHp4u' in genesis_js
          assert 'AuthorityType.MintTokens,null' in genesis_js
          assert 'AuthorityType.FreezeAccount,null' in genesis_js
          assert 'createAssociatedTokenAccountInstruction(owner,ata,vault' in genesis_js
          assert all(term not in genesis_html and term not in genesis_js for term in private_terms)
          assert platform['worldzMint']['version']=='WORLDZMINT-1'
          assert platform['worldzMint']['status']=='PUBLIC_MAINNET_MINT_BETA'
          assert platform['worldzMint']['platformTokenSupplyTakePercent']==0
          assert platform['worldzMint']['walletTransferTaxPercent']==0
          assert platform['worldzMint']['compulsory']['revokeMintAuthorityAfterGenesis'] is True
          assert platform['worldzMint']['compulsory']['revokeFreezeAuthorityAfterGenesis'] is True
          assert platform['worldzMint']['compulsory']['metadataImmutableAfterGenesis'] is True
          assert platform['worldzMint']['authentication']['mode']=='ONCHAIN_TRANSACTION_SIGNATURES'
          assert platform['worldzMint']['authentication']['walletMessageSignaturesRequired'] is False
          assert platform['worldzMint']['authentication']['transactionApprovalsRequired']==3
          assert platform['worldzMint']['oneButtonFlow']['enabled'] is True
          assert platform['evmMultiChain']['status']=='PUBLIC_TESTNET_BETA'
          assert platform['evmMultiChain']['marketLaunchVerification'] is False
          assert len(platform['evmMultiChain']['networks'])>=5
          assert platform['xrplNative']['status']=='PUBLIC_TESTNET_BETA'
          assert platform['xrplNative']['testnetExecution'] is True
          assert platform['xrplNative']['mainnetExecution'] is False
          assert platform['founding100']['launchTypeNeutral'] is True
          assert platform['founding100']['chainNeutralWithinSupportedMainnetAdapters'] is True
          assert Path('launchpad.cryptoworldz.xyz/evm/index.html').exists()
          assert Path('launchpad.cryptoworldz.xyz/evm/app.js').exists()
          assert Path('launchpad.cryptoworldz.xyz/xrpl/index.html').exists()
          assert Path('launchpad.cryptoworldz.xyz/xrpl/app.js').exists()
          assert Path('launchpad.cryptoworldz.xyz/economics/index.html').exists()
          assert platform['worldzMint']['oneButtonFlow']['primaryAction']=='START WORLDZMINT™'
          assert platform['worldzMint']['oneButtonFlow']['transactionApprovalsRequired']==3
          assert "if(!walletCtx)" in mint_js
          assert "await connectWallet()" in mint_js
          assert "if(!await runPreflight())return" in mint_js
          assert "START WORLDZMINT™" in mint_html
          assert "LOAD WORLDZ $WLDZ — READY TO MINT" not in mint_html
          assert "START WORLDZ NOW" not in mint_html
          assert "WORLDZ_QUICKSTART" not in mint_js
          assert "loadPrivatePreset" in mint_js
          assert "applyPrivatePreset" in mint_js
          assert "?preset=" in mint_js
          assert "history.replaceState" in mint_js
          assert platform['worldzMint']['privatePreset']['enabled'] is True
          assert platform['worldzMint']['privatePreset']['serverSide'] is True
          assert platform['worldzMint']['privatePreset']['staticPrivateTerms'] is False
          assert "Optional: Check Preflight Only" in mint_html
          assert platform['worldzMint']['walletStandard']['transactionSigning']['mode']=='DIRECT_SIGN_TRANSACTION'
          assert platform['worldzMint']['walletStandard']['transactionSigning']['arguments']==['account','transaction']
          assert platform['worldzMint']['walletStandard']['transactionSigning']['chainHintPassed'] is False
          assert "prepareRegistryStage" in mint_js
          assert "authBody('PREPARE'" not in mint_js
          assert "authBody('FINALIZE'" not in mint_js
          assert "accountChains.includes(chain())" not in mint_js
          assert "transaction:new Uint8Array(wire)" in mint_js
          assert "chain:chain()" not in mint_js
          assert "Wallet approval 1/3" in mint_js
          assert "Wallet approval 2/3" in mint_js
          assert "Wallet approval 3/3" in mint_js
          assert platform['worldzMint']['imageUpload']['enabled'] is True
          assert platform['worldzMint']['imageUpload']['bucket']=='worldz-mint-art'
          assert platform['worldzMint']['imageUpload']['walletSignatureRequired'] is False
          assert platform['worldzMint']['imageUpload']['walletConnectionRequired'] is False
          assert platform['worldzMint']['imageUpload']['reuploadEnabled'] is True
          assert 'id="image-file"' in mint_html
          assert "UPLOAD_IMAGE" in mint_js
          assert "resizeTokenImage" in mint_js
          assert "WORLDZMINT_UPLOAD_IMAGE_V1" not in mint_js
          assert "No wallet connection or signature is required." in mint_js
          assert 'id="image-remove"' in mint_html
          assert 'NO SIGNING REQUIRED' in mint_html
          assert "worldzmint-draft-v1" in mint_js
          assert "saveDraft" in mint_js
          assert "restoreDraft" in mint_js
          assert "pagehide" in mint_js
          assert "visibilitychange" in mint_js
          assert platform['walletConnectivity']['version']=='WORLDZ-WALLET-BRIDGE-1'
          assert platform['walletConnectivity']['status']=='JUPITER_MOBILE_REOWN_ENABLED'
          assert platform['walletConnectivity']['jupiterMobile']['enabled'] is True
          assert platform['walletConnectivity']['jupiterMobile']['adapterPackage']=='@jup-ag/jup-mobile-adapter@0.0.2'
          assert platform['walletConnectivity']['reown']['metadataOrigin']=='https://launchpad.cryptoworldz.xyz'
