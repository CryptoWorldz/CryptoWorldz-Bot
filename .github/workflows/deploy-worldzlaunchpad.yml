name: Deploy WorldzLaunchPad

on:
  push:
    branches: [main]
    paths:
      - 'launchpad.cryptoworldz.xyz/**'
      - 'WORLDZPAD-FOUR-TOKEN-LAUNCH-MASTER.md'
      - 'worldzpad-four-token-registry.candidate.json'
      - 'worldzpad-mainnet/mainnet-plan.json'
      - '.github/workflows/deploy-worldzlaunchpad.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worldzlaunchpad-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
    steps:
      - uses: actions/checkout@v4

      - name: Sync canonical launch sources into public application
        shell: bash
        run: |
          set -euo pipefail
          cp worldzpad-four-token-registry.candidate.json launchpad.cryptoworldz.xyz/tokens.json
          cp worldzpad-mainnet/mainnet-plan.json launchpad.cryptoworldz.xyz/wldz-mainnet-plan.json

      - name: Validate Genesis Four, Fair Fee, CrossPair and fail-closed contracts
        shell: python
        run: |
          import json
          from pathlib import Path
          root=Path('launchpad.cryptoworldz.xyz')
          registry=json.loads((root/'tokens.json').read_text())
          plan=json.loads((root/'wldz-mainnet-plan.json').read_text())
          ui=json.loads((root/'console-data.json').read_text())
          platform=json.loads((root/'platform-config.json').read_text())

          expected=[('WORLDZ','WLDZ',100_000_000),('REVIVE','RVIV',200_000_000),('PHENIX','PNEX',250_000_000),('MIRACLE','MRCL',348_000_000)]
          assert registry['status']=='candidate-mainnet-disabled'
          assert registry['shared']['mainnet_authorized'] is False
          assert registry['shared']['trade_fee_bps']==200
          assert registry['shared']['legacy_loyalty_percent']==1
          assert len(registry['tokens'])==4
          for token,(name,ticker,supply) in zip(registry['tokens'],expected):
              assert (token['name'],token['ticker'],token['fixed_supply'])==(name,ticker,supply)
              assert sum(token['allocations'].values())==100
              assert sum(token['fee_split_percent'].values())==100
              assert ticker in ui['tokens']

          assert plan['executionEnabled'] is False and plan['launchAuthorization'] is False
          assert plan['preMainnetProof']['workflowRunId']==34155419579

          fee=platform['feePolicy']
          assert fee['projectTradingFeeMinPercent']==0.5
          assert fee['projectTradingFeeMaxPercent']==3.0
          assert fee['worldzLaunchPadShareOfCollectedProjectFeePercent']==10
          assert fee['worldzLaunchPadShareOfTokenSupplyPercent']==0
          assert fee['worldzLaunchPadShareOfInitialLiquidityPercent']==0
          assert platform['publicMainnetCreatorLaunchesEnabled'] is False
          assert platform['devnetTokenCreationEnabled'] is True
          safe=platform['safeLaunchPolicy']
          assert safe['version']=='WORLDZ-SAFE-LAUNCH-1'
          assert safe['compulsory']['fixedSupply'] is True
          assert safe['compulsory']['revokeMintAuthorityAfterGenesis'] is True
          assert safe['compulsory']['revokeFreezeAuthorityAfterGenesis'] is True
          assert safe['compulsory']['walletTransferTaxPercent']==0
          assert safe['compulsory']['treasuryProgramAuthorityMultisig'] is True
          assert safe['compulsory']['minimumMultisigThreshold']>=2
          assert safe['allocations']['creatorTeamMaxPercent']==15
          assert safe['allocations']['creatorTeamUnlockedAtGenesisMaxPercent']==5
          assert safe['allocations']['liquidityMinPercent']==25
          assert safe['allocations']['communityPublicMinPercent']==20
          assert safe['allocations']['treasuryReserveMaxPercent']==15
          assert safe['allocations']['founderCliffMinDays']==90
          assert safe['allocations']['founderVestingMinMonths']==18
          assert safe['allocations']['creatorControlledLpLockPercent']==100
          assert safe['allocations']['lpLockMinDays']==365
          assert safe['feeRoutes']['creatorMaxPercent']==20
          assert safe['feeRoutes']['treasuryMaxPercent']==20
          assert safe['feeRoutes']['lpGrowthMinPercent']==20
          assert platform['worldzFlash']['status']=='DEVNET_BETA'
          assert platform['worldzFlash']['stages']['metadata']['status']=='EXECUTABLE'
          assert platform['worldzFlash']['stages']['pair']['SOL']['status']=='EXECUTABLE_DEVNET'
          assert platform['worldzFlash']['stages']['pair']['wXRP']['status']=='VERIFIED_MAINNET_TARGET_ONLY'
          assert platform['worldzFlash']['stages']['feeRouter']['executing'] is False
          assert platform['worldzFlash']['stages']['lpLock']['enforced'] is False
          assert platform['worldzFlash']['stages']['vesting']['enforced'] is False
          assert platform['worldzCurve']['status']=='DEVNET_BETA'
          assert platform['worldzCurve']['devnetProgram']=='DRay6fNdQ5J82H7xV6uq2aV3mNrUZ1J4PgSKsWgptcm6'
          assert platform['worldzCurve']['solGlobalConfig']=='7ZR4zD7PYfY2XxoG1Gxcy2EgEeGYrpxrwzPuwdUBssEt'
          assert platform['worldzCurve']['downstreamAutoRouterExecuting'] is False
          assert platform['worldzCurvePro']['status']=='DEVNET_BETA'
          assert platform['worldzCurvePro']['devnetProgram']=='dbcij3LWUppWqq96dh6gJWwBifmcGfLSB5D4DuSMaqN'
          assert platform['worldzCurvePro']['projectTradingFeeRangePercent']==[0.5,3]
          assert platform['worldzCurvePro']['creatorTradingFeeSharePercent']==90
          assert platform['worldzCurvePro']['worldzPartnerTradingFeeSharePercent']==10
          assert platform['worldzCurvePro']['graduatedLiquidity']['totalPermanentLockedPercent']==100
          assert platform['worldzCurvePro']['lockedTokenVesting']['maxPercent']==15
          assert platform['worldzCurvePro']['lockedTokenVesting']['minimumCliffDays']==90
          assert platform['worldzCurvePro']['lockedTokenVesting']['minimumVestingMonths']==18

          wxrp=next(x for x in platform['verifiedQuoteAssets'] if x['id']=='wXRP')
          assert wxrp['solanaMint']=='6UpQcMAb5xMzxc7ZfPaVMgx3KqsvKZdT5U718BzD5We2'
          assert platform['crossPair']['status']=='BUILDING'

          required=[
            root/'index.html',root/'app.js',root/'style.css',root/'status.php',
            root/'platform-config.json',root/'metadata.php',
            root/'devnet/index.html',root/'devnet/app.js',
            root/'curve/index.html',root/'curve/app.js',
            root/'curve-pro/index.html',root/'curve-pro/app.js',
            root/'omnichain/index.html'
          ]
          for p in required:
              assert p.is_file() and p.stat().st_size>500, p

          home=(root/'index.html').read_text()
          devnet=(root/'devnet/index.html').read_text()
          curve=(root/'curve/index.html').read_text()
          curve_js=(root/'curve/app.js').read_text()
          curve_pro=(root/'curve-pro/index.html').read_text()
          curve_pro_js=(root/'curve-pro/app.js').read_text()
          omnichain=(root/'omnichain/index.html').read_text()
          assert 'Create a Launch' in home
          assert 'WORLDZ SAFE LAUNCH STANDARD' in home
          assert 'Creator/team ≤15%' in home
          assert 'COMPULSORY — revoke mint authority after genesis' in home
          assert 'WORLDZ CROSSPAIR' in home
          assert 'WORLDZ OMNICHAIN' in home
          assert 'MAINNET LAUNCH LOCKED' in home
          assert 'Create Devnet Token' in devnet
          assert 'Register + Write Metadata' in devnet
          assert 'Simulate + Create Raydium Devnet Pool' in devnet
          assert 'ROUTER EXECUTION NOT YET LIVE' in devnet
          assert 'ENFORCEMENT ADAPTER PENDING' in devnet
          assert 'Solana Devnet' in devnet
          assert 'worldz-launch-register' in (root/'devnet/app.js').read_text()
          assert 'DEVNET_PROGRAM_ID.CREATE_CPMM_POOL_PROGRAM' in (root/'devnet/app.js').read_text()
          assert 'RAYDIUM LAUNCHLAB DEVNET LAUNCH CREATED' in curve
          assert 'createPlatformConfig' in curve_js and 'createLaunchpad' in curve_js
          assert 'DEVNET_PROGRAM_ID.LAUNCHPAD_PROGRAM' in curve_js
          assert 'METEORA DBC DEVNET LAUNCH CREATED' in curve_pro
          assert 'createConfigAndPool' in curve_pro_js and 'buildCurve' in curve_pro_js
          assert 'Project trading fee must be 0.50%–3.00%.' in curve_pro_js
          assert 'Creator/team locked vesting must be 0–15%.' in curve_pro_js
          assert 'DEVNET ENGINE NOTICE' in curve_pro
          assert 'creatorTradingFeePercentage:90' in curve_pro_js
          assert 'partnerPermanentLockedLiquidityPercentage:10' in curve_pro_js
          assert 'creatorPermanentLockedLiquidityPercentage:90' in curve_pro_js
          assert 'WORLDZ OMNICHAIN™' in omnichain
          assert 'Every world is clickable.' in omnichain
          for url in ['https://solworldz.xyz/','https://ethworldz.xyz/','https://baseworldz.xyz/','https://xrpworldz.xyz/','https://suiworldz.xyz/','https://hyperworldz.xyz/','https://robinworldz.xyz/','https://bnbworldz.xyz/','https://hodlerworldz.xyz/']:
              assert url in omnichain
          assert '/omnichain/' in home
          print('WORLDZLAUNCHPAD_PLATFORM_CONTRACT=PASS safe_launch_v1=1 founder_cap=15 fee_max=3 lp_lock_days=365 multisig=1 flash=1 curve=1 curve_pro=1 omnichain=1 mainnet_public=0')

      - name: Deploy only WorldzLaunchPad to verified Hostinger document root
        shell: python
        run: |
          import os, ssl
          from ftplib import FTP_TLS, error_perm
          from pathlib import Path, PurePosixPath

          local_root=Path('launchpad.cryptoworldz.xyz')
          remote_root='domains/cryptoworldz.xyz/public_html/launchpad'
          ftp=FTP_TLS(context=ssl._create_unverified_context())
          ftp.connect(os.environ['FTP_HOST'],int(os.environ.get('FTP_PORT','21')),timeout=40)
          ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          ftp.prot_p(); ftp.set_pasv(True)

          def ensure_dir(directory):
              ftp.cwd('/')
              for part in PurePosixPath(directory).parts:
                  if part in ('','/'): continue
                  try: ftp.cwd(part)
                  except error_perm:
                      ftp.mkd(part); ftp.cwd(part)

          count=0
          for f in sorted(p for p in local_root.rglob('*') if p.is_file()):
              rel=f.relative_to(local_root).as_posix()
              remote=PurePosixPath(remote_root)/rel
              ensure_dir(str(remote.parent))
              with f.open('rb') as handle:
                  ftp.storbinary(f'STOR {remote.name}',handle,blocksize=262144)
              count+=1
          try: ftp.delete(str(PurePosixPath(remote_root)/'default.php'))
          except Exception: pass
          try: ftp.quit()
          except Exception: ftp.close()
          print(f'WORLDZLAUNCHPAD_DEPLOY=PASS files={count} target={remote_root}')

      - name: Verify live application, Devnet Lab, registry and fail-closed gate
        shell: python
        run: |
          import json,time,urllib.request
          base='https://launchpad.cryptoworldz.xyz'
          def get(path):
              req=urllib.request.Request(base+path,headers={'User-Agent':'WorldzLaunchPad-Live-Verify/3.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=25) as r:return r.status,r.read().decode('utf-8','ignore')
          last=''
          for attempt in range(1,7):
              try:
                  status,body=get('/?verify=platform-v3')
                  dev_code,dev_body=get('/devnet/?verify=platform-v3')
                  curve_code,curve_body=get('/curve/?verify=platform-v3')
                  curve_pro_code,curve_pro_body=get('/curve-pro/?verify=platform-v3')
                  omni_code,omni_body=get('/omnichain/?verify=platform-v3')
                  _,registry_body=get('/tokens.json?verify=platform-v3')
                  _,plan_body=get('/wldz-mainnet-plan.json?verify=platform-v3')
                  _,platform_body=get('/platform-config.json?verify=platform-v3')
                  status_code,status_body=get('/status.php?verify=platform-v3')
                  registry=json.loads(registry_body); plan=json.loads(plan_body); platform=json.loads(platform_body); live=json.loads(status_body)
                  assert status==200 and 'Create a Launch' in body and 'WORLDZ CROSSPAIR' in body and 'MAINNET LAUNCH LOCKED' in body
                  assert dev_code==200 and 'Create Devnet Token' in dev_body and 'Register + Write Metadata' in dev_body and 'Raydium Devnet Pool' in dev_body
                  assert curve_code==200 and 'Worldz Curve™' in curve_body and 'Raydium LaunchLab' in curve_body and 'Create Raydium LaunchLab Devnet Launch' in curve_body
                  assert curve_pro_code==200 and 'Worldz Curve Pro™' in curve_pro_body and 'Meteora DBC' in curve_pro_body and 'Create Meteora DBC Devnet Launch' in curve_pro_body
                  assert omni_code==200 and 'WORLDZ OMNICHAIN™' in omni_body and 'Every world is clickable.' in omni_body and 'SolWorldz' in omni_body and 'XRPWorldz' in omni_body
                  assert registry['status']=='candidate-mainnet-disabled' and registry['shared']['mainnet_authorized'] is False
                  assert plan['executionEnabled'] is False and plan['launchAuthorization'] is False
                  assert platform['publicMainnetCreatorLaunchesEnabled'] is False and platform['devnetTokenCreationEnabled'] is True
                  assert platform['feePolicy']['projectTradingFeeMaxPercent']==3.0
                  assert platform['feePolicy']['worldzLaunchPadShareOfCollectedProjectFeePercent']==10
                  assert status_code==200 and live['ok'] is True
                  assert platform['worldzCurve']['status']=='DEVNET_BETA' and platform['worldzCurvePro']['status']=='DEVNET_BETA'
                  print('WORLDZLAUNCHPAD_LIVE=PASS app=1 flash=1 curve=1 curve_pro=1 omnichain=1 crosspair=1 mainnet_locked=1 runtime_probe=1')
                  raise SystemExit(0)
              except SystemExit: raise
              except Exception as e:
                  last=repr(e); print(f'LIVE_RETRY attempt={attempt} {last}'); time.sleep(attempt*3)
          raise SystemExit('WORLDZLAUNCHPAD_LIVE=FAIL '+last)
