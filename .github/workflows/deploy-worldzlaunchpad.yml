      - name: Run 150+ Fee Flow V3 anti-cheat tokenomics scenarios
        shell: python
        run: |
          import json, math
          from pathlib import Path

          p=json.loads(Path('launchpad.cryptoworldz.xyz/platform-config.json').read_text())
          safe=p['safeLaunchPolicy']
          fee=p['feePolicy']
          A=safe['allocations']
          R=safe['feeRoutes']
          EXPECTED_INTERNAL={
            'operationsProductDevelopment':20,
            'treasury':20,
            'lpGrowth':15,
            'legacyCore':10,
            'worldzCoreFamilyMarketBuys':10,
            'impactCharity':10,
            'teamBuilderRewards':5,
            'futureLaunchInfrastructure':5,
            'launchReferrer':5,
          }
          RETENTION={3:97,5:95,8:92}
          EXPECTED_ROUTE_KEYS=set(EXPECTED_INTERNAL)

          assert R['model']=='WORLDZ_FEE_FLOW_V3'
          assert R['worldzContributionAllowedPercent']==[3,5,8]
          assert R['creatorRetentionByWorldzContribution']=={'3':97,'5':95,'8':92}
          assert R['worldzInternalSplitPercent']==EXPECTED_INTERNAL
          assert sum(R['worldzInternalSplitPercent'].values())==100
          assert R['treasuryLane']['percentOfWorldzContribution']==20
          assert R['treasuryLane']['worldzOperationsTreasuryPercent']==70
          assert R['treasuryLane']['worldzMiracleTeamTreasuryPercent']==30
          assert R['totalWorldzInternalPercent']==100
          assert R['walletTransferTaxPercent']==0

          def valid(cfg):
              try:
                  supply=int(cfg['supply']); decimals=int(cfg['decimals']); f=float(cfg['fee'])
                  alloc=cfg['alloc']; routes=cfg['routes']
                  choice=int(cfg['worldzContribution']); retention=int(cfg['creatorRetention'])
                  if not (p['safeLaunchPolicy']['token']['supplyMin'] <= supply <= p['safeLaunchPolicy']['token']['supplyMax']): return False
                  if not (p['safeLaunchPolicy']['token']['decimalsMin'] <= decimals <= p['safeLaunchPolicy']['token']['decimalsMax']): return False
                  if not (fee['projectTradingFeeMinPercent'] <= f <= fee['projectTradingFeeMaxPercent']): return False
                  step=float(fee['stepPercent']); base=float(fee['projectTradingFeeMinPercent'])
                  if abs(((f-base)/step)-round((f-base)/step))>1e-9: return False
                  if abs(sum(alloc.values())-100)>1e-9: return False
                  if any((not math.isfinite(float(v)) or v<0 or v>100) for v in alloc.values()): return False
                  if alloc['creatorTeam']>A['creatorTeamMaxPercent']: return False
                  if cfg['creatorUnlocked']>A['creatorTeamUnlockedAtGenesisMaxPercent'] or cfg['creatorUnlocked']>alloc['creatorTeam']: return False
                  if not (A['liquidityMinPercent']<=alloc['liquidity']<=A['liquidityMaxPercent']): return False
                  if alloc['communityPublic']<A['communityPublicMinPercent']: return False
                  if alloc['treasuryReserve']>A['treasuryReserveMaxPercent']: return False
                  if cfg['cliffDays']<A['founderCliffMinDays']: return False
                  if cfg['vestingMonths']<A['founderVestingMinMonths']: return False
                  if cfg['lpLockPercent']!=100 or cfg['lpLockDays']<A['lpLockMinDays']: return False
                  if set(routes)!=EXPECTED_ROUTE_KEYS: return False
                  if routes!=EXPECTED_INTERNAL: return False
                  if abs(sum(routes.values())-100)>1e-9: return False
                  if choice not in RETENTION: return False
                  if retention!=RETENTION[choice]: return False
                  if choice+retention!=100: return False
                  return True
              except Exception:
                  return False

          base={
            'supply':1_000_000,'decimals':9,'fee':1.0,
            'alloc':{'creatorTeam':15,'liquidity':30,'communityPublic':30,'treasuryReserve':10,'growthEcosystem':15},
            'creatorUnlocked':5,'cliffDays':90,'vestingMonths':24,'lpLockPercent':100,'lpLockDays':365,
            'routes':dict(EXPECTED_INTERNAL),'worldzContribution':5,'creatorRetention':95
          }
          def clone():
              return json.loads(json.dumps(base))

          cases=[('baseline_valid',clone(),True)]

          valid_fees={0.5,0.75,1,1.5,2,2.5,3}
          for f in [0,0.1,0.49,0.5,0.6,0.75,1,1.25,1.5,2,2.5,3,3.01,4,9,99]:
              x=clone();x['fee']=f;cases.append((f'fee_{f}',x,f in valid_fees or f==1.25))
          for v in range(0,26):
              x=clone();x['alloc']['creatorTeam']=v;x['alloc']['growthEcosystem']=30-v
              x['creatorUnlocked']=min(5,v)
              cases.append((f'creator_alloc_{v}',x,v<=15))
          for v in range(15,71,5):
              x=clone();delta=v-x['alloc']['liquidity'];x['alloc']['liquidity']=v;x['alloc']['growthEcosystem']-=delta
              expect=25<=v<=60 and x['alloc']['growthEcosystem']>=0
              cases.append((f'liquidity_{v}',x,expect))
          for v in [0,30,60,89,90,91,120,365]:
              x=clone();x['cliffDays']=v;cases.append((f'cliff_{v}',x,v>=90))
          for v in [0,1,6,12,17,18,19,24,36,60]:
              x=clone();x['vestingMonths']=v;cases.append((f'vesting_{v}',x,v>=18))
          for v in [0,30,90,180,364,365,366,730]:
              x=clone();x['lpLockDays']=v;cases.append((f'lp_lock_days_{v}',x,v>=365))
          for v in [0,25,50,99,100]:
              x=clone();x['lpLockPercent']=v;cases.append((f'lp_lock_percent_{v}',x,v==100))
          for v in [1,999,1000,10_000,1_000_000,1_000_000_000_000,1_000_000_000_001]:
              x=clone();x['supply']=v;cases.append((f'supply_{v}',x,1000<=v<=1_000_000_000_000))
          for v in [-1,0,1,6,9,10]:
              x=clone();x['decimals']=v;cases.append((f'decimals_{v}',x,0<=v<=9))

          # Only 3/5/8 are valid and creator retention is mathematically locked to 97/95/92.
          for choice in range(0,13):
              x=clone();x['worldzContribution']=choice;x['creatorRetention']=RETENTION.get(choice,100-choice)
              cases.append((f'worldz_choice_{choice}',x,choice in RETENTION))
          for choice in [3,5,8]:
              for retention in [0,50,91,92,94,95,96,97,98,100]:
                  x=clone();x['worldzContribution']=choice;x['creatorRetention']=retention
                  cases.append((f'retention_{choice}_{retention}',x,retention==RETENTION[choice]))

          # Every Worldz-internal lane is immutable. Any +/- 1 drift must fail.
          for key,value in EXPECTED_INTERNAL.items():
              for delta in [-1,1]:
                  x=clone();x['routes'][key]=value+delta
                  other='operationsProductDevelopment' if key!='operationsProductDevelopment' else 'lpGrowth'
                  x['routes'][other]-=delta
                  cases.append((f'internal_lane_drift_{key}_{delta:+d}',x,False))

          # Key injection/removal, negative values and over-100 values must fail.
          for i in range(30):
              x=clone()
              mode=i%6
              if mode==0: x['alloc']['growthEcosystem']+=1
              elif mode==1: x['alloc']['creatorTeam']=-1
              elif mode==2: x['routes']['legacyCore']=-1
              elif mode==3: x['routes']['lpGrowth']=101
              elif mode==4: x['routes']['unexpectedBucket']=0
              else: del x['routes']['impactCharity']
              cases.append((f'tamper_{i}',x,False))

          assert len(cases)>=150, len(cases)
          failed=[]
          for name,cfg,expected in cases:
              got=valid(cfg)
              if got!=expected: failed.append((name,expected,got,cfg))
          assert not failed, failed[:5]
          print(f'WORLDZLAUNCHPAD_POLICY_SCENARIOS=PASS scenarios={len(cases)} fee_flow=v3')

