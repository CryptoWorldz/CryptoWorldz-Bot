          assert treasury_policy['governance']['reserve']['display']=='6-of-9'
          assert treasury_policy['governance']['maximumApprovalsRequiredByWorldzPolicy']==6
          assert treasury_policy['activation']['mainnetFeeRoutingEnabled'] is False
