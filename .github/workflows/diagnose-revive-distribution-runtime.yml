name: Diagnose REVIVE Distribution Runtime

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-revive-distribution-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Test live wallet-login UI
        shell: bash
        run: |
          cat > runtime-diagnostic.cjs <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const url='https://launchpad.cryptoworldz.xyz/revive-distribution/?v=runtime-diagnostic-9';
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:412,height:915}});
            const messages=[];
            page.on('console',m=>messages.push('CONSOLE '+m.type()+': '+m.text()));
            page.on('pageerror',e=>messages.push('PAGEERROR: name='+e?.name+' message='+e?.message+' stack='+e?.stack+' raw='+String(e)));
            page.on('requestfailed',r=>messages.push('REQUESTFAILED: '+r.url()+' :: '+r.failure()?.errorText));
            page.on('response',r=>{if(/esm\.sh|reown|wallet-standard|solana\/web3|sqds|spl-token/.test(r.url()))messages.push('RESPONSE '+r.status()+': '+r.url())});

            const response=await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            console.log('HTTP_STATUS='+response?.status());
            console.log('TITLE='+await page.title());
            const liveHtml=await page.content();
            if(!liveHtml.includes('prepareFreshSigningBatch')) throw new Error('fresh-signing-batch patch is not live');
            if(!liveHtml.includes('plan=await prepareFreshSigningBatch(plan)')) throw new Error('execute path is not using fresh-signing-batch patch');
            if(!liveHtml.includes('Do not burn blockhash lifetime on a second signed simulation here.')) throw new Error('stale signed-simulation removal is not live');
            console.log('LIVE_BLOCKHASH_PATCH=PASS');
            await page.waitForTimeout(12000);

            console.log('MARKER='+await page.evaluate(()=>window.__REVIVE_DISTRIBUTION_WALLET__||'MISSING'));
            console.log('CONNECT_TEXT='+await page.locator('#connect').textContent().catch(()=>'<missing>'));
            console.log('STATUS_BEFORE='+await page.locator('#status').textContent().catch(()=>'<missing>'));

            await page.locator('#connect').click({timeout:10000});
            await page.waitForTimeout(6000);

            const state=await page.evaluate(()=>{
              const els=[...document.querySelectorAll('*')];
              const interesting=els.filter(el=>{
                const tag=(el.tagName||'').toLowerCase();
                const txt=(el.textContent||'').trim();
                return tag.includes('appkit')||tag.includes('w3m')||/connect wallet|walletconnect|all wallets|scan/i.test(txt);
              }).slice(0,40).map(el=>({
                tag:(el.tagName||'').toLowerCase(),
                id:el.id||'',
                cls:typeof el.className==='string'?el.className:'',
                text:(el.textContent||'').trim().slice(0,200)
              }));
              return {
                status:document.querySelector('#status')?.textContent||'',
                bodyText:document.body?.innerText?.slice(0,3000)||'',
                interesting
              };
            });
            console.log('STATE='+JSON.stringify(state));
            console.log(messages.join('\n'));

            const hasModal=state.interesting.some(x=>/appkit|w3m/.test(x.tag)||/connect wallet|walletconnect|all wallets|scan/i.test(x.text));
            if(hasModal){
              await page.keyboard.press('Escape').catch(()=>{});
              await page.waitForTimeout(500);
            }

            // Run the exact production FINAL LIVE PREFLIGHT without signing.
            // buildPlan itself does not require a wallet signature and cannot move RVIV.
            await page.evaluate(()=>{
              const b=document.querySelector('#preflight');
              if(!b) throw new Error('preflight button missing');
              b.disabled=false;
            });
            await page.locator('#preflight').click({timeout:10000});
            await page.waitForFunction(()=>{
              const s=document.querySelector('#status')?.textContent||'';
              return s.includes('READY ✅') || s.includes('PREFLIGHT BLOCKED');
            },{timeout:120000});
            const preflightStatus=await page.locator('#status').textContent();
            const proof=await page.locator('#proof').textContent();
            console.log('PREFLIGHT_STATUS='+preflightStatus);
            console.log('PREFLIGHT_PROOF='+proof);
            await page.screenshot({path:'revive-runtime.png',fullPage:true});

            const hasModalAgain=hasModal;
            if(!hasModalAgain){
              console.error('RUNTIME_DIAGNOSIS=FAIL_NO_WALLET_MODAL');
              process.exitCode=1;
            }else if(!String(preflightStatus).includes('READY ✅')){
              console.error('RUNTIME_DIAGNOSIS=FAIL_PREFLIGHT');
              process.exitCode=1;
            }else{
              console.log('RUNTIME_DIAGNOSIS=PASS_WALLET_MODAL_VISIBLE');
              console.log('RUNTIME_DIAGNOSIS=PASS_EXACT_LIVE_PREFLIGHT');
            }
            await browser.close();
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
          node runtime-diagnostic.cjs

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revive-runtime-diagnostic
          path: revive-runtime.png
