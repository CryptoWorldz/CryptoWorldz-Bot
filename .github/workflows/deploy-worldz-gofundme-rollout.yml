name: Roll Out OneWorldz GoFundMe — Proof First

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['deployments/worldz-gofundme.request']

permissions:
  contents: read

concurrency:
  group: worldz-gofundme-rollout
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.r.outputs.target }}
      environment: ${{ steps.r.outputs.environment }}
      live_url: ${{ steps.r.outputs.live_url }}
      guard: ${{ steps.r.outputs.guard }}
      expected_text: ${{ steps.r.outputs.expected_text }}
      hero_image: ${{ steps.r.outputs.hero_image }}
      secondary_image: ${{ steps.r.outputs.secondary_image }}
      art_marker: ${{ steps.r.outputs.art_marker }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        shell: bash
        run: |
          set -euo pipefail
          target="$(sed -n 's/^target=//p' deployments/worldz-gofundme.request|tail -n1)"
          test "$(sed -n 's/^approval=//p' deployments/worldz-gofundme.request|tail -n1)" = 'Approved by JayJayTeamDev'
          case "$target" in
            oneworldz) environment='oneworldz-production'; live_url='https://oneworldz.com'; guard='ONEWORLDZ.COM'; expected_text='OneWorldz'; hero_image='assets/worldz-master/oneworldz/oneworldz-master.png'; secondary_image='assets/worldz-master/oneworldz/oneworldz-gpt.png'; art_marker='oneworldz-master.png' ;;
            impactbased) environment='impactbased-production'; live_url='https://impactbased.oneworldz.com'; guard='IMPACTBASED.ONEWORLDZ.COM'; expected_text='ImpactBased'; hero_image='assets/worldz-master/cryptoworldz/impactbased.png'; secondary_image=''; art_marker='impactbased.png' ;;
            law-oneworldz) environment='law-oneworldz-production'; live_url='https://law.oneworldz.com'; guard='LAW.ONEWORLDZ.COM'; expected_text='Robin Hood'; hero_image='assets/worldz-master/tokens/robin-hood-law.png'; secondary_image=''; art_marker='robin-hood-law.png' ;;
            learn-oneworldz) environment='learn-oneworldz-production'; live_url='https://learn.oneworldz.com'; guard='LEARN.ONEWORLDZ.COM'; expected_text='LearnWorldz'; hero_image='assets/worldz-master/oneworldz/oneworldz-gpt.png'; secondary_image=''; art_marker='oneworldz-gpt.png' ;;
            ethworldz) environment='ethworldz-production'; live_url='https://ethworldz.xyz'; guard='ETHWORLDZ.XYZ'; expected_text='EthWorldz'; hero_image='assets/worldz-master/cryptoworldz/we-need-you.png'; secondary_image='assets/worldz-master/blockchains/ethworldz.png'; art_marker='cryptoworldz-we-need-you' ;;
            baseworldz) environment='baseworldz-production'; live_url='https://baseworldz.xyz'; guard='BASEWORLDZ.XYZ'; expected_text='BaseWorldz'; hero_image='assets/worldz-master/cryptoworldz/we-need-you.png'; secondary_image='assets/worldz-master/blockchains/baseworldz.png'; art_marker='cryptoworldz-we-need-you' ;;
            bnbworldz) environment='bnbworldz-production'; live_url='https://bnbworldz.xyz'; guard='BNBWORLDZ.XYZ'; expected_text='BNBWorldz'; hero_image='assets/worldz-master/cryptoworldz/we-need-you.png'; secondary_image='assets/worldz-master/blockchains/bnbworldz.png'; art_marker='cryptoworldz-we-need-you' ;;
            xrpworldz) environment='xrpworldz-production'; live_url='https://xrpworldz.xyz'; guard='XRPWORLDZ.XYZ'; expected_text='XRPWorldz'; hero_image='assets/worldz-master/cryptoworldz/we-need-you.png'; secondary_image='assets/worldz-master/blockchains/xrpworldz.png'; art_marker='cryptoworldz-we-need-you' ;;
            suiworldz) environment='suiworldz-production'; live_url='https://suiworldz.xyz'; guard='SUIWORLDZ.XYZ'; expected_text='SuiWorldz'; hero_image='assets/worldz-master/cryptoworldz/we-need-you.png'; secondary_image='assets/worldz-master/blockchains/suiworldz.png'; art_marker='cryptoworldz-we-need-you' ;;
            hyperworldz) environment='hyperworldz-production'; live_url='https://hyperworldz.xyz'; guard='HYPERWORLDZ.XYZ'; expected_text='HyperWorldz'; hero_image='assets/worldz-master/cryptoworldz/we-need-you.png'; secondary_image='assets/worldz-master/blockchains/hyperworldz.png'; art_marker='cryptoworldz-we-need-you' ;;
            robinworldz) environment='robinworldz-production'; live_url='https://robinworldz.xyz'; guard='ROBINWORLDZ.XYZ'; expected_text='RobinWorldz'; hero_image='assets/worldz-master/cryptoworldz/we-need-you.png'; secondary_image='assets/worldz-master/blockchains/robinworldz.png'; art_marker='cryptoworldz-we-need-you' ;;
            bitcoinworldz) environment='bitcoinworldz-production'; live_url='https://bitcoinworldz.xyz'; guard='BITCOINWORLDZ.XYZ'; expected_text='BitcoinWorldz'; hero_image='assets/worldz-master/cryptoworldz/we-need-you.png'; secondary_image='assets/worldz-master/blockchains/bitworldz.png'; art_marker='cryptoworldz-we-need-you' ;;
            hodlerworldz) environment='hodlerworldz-production'; live_url='https://hodlerworldz.xyz'; guard='HODLERWORLDZ.XYZ'; expected_text='HodlerWorldz'; hero_image='assets/worldz-master/cryptoworldz/we-need-you.png'; secondary_image=''; art_marker='cryptoworldz-we-need-you' ;;
            *) echo '::error::Unsupported rollout target'; exit 1 ;;
          esac
          for k in target environment live_url guard expected_text hero_image secondary_image art_marker; do echo "$k=${!k}" >> "$GITHUB_OUTPUT"; done

  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 38
    environment:
      name: ${{ needs.prepare.outputs.environment }}
      url: ${{ needs.prepare.outputs.live_url }}
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || '/' }}
      FTP_ACCOUNT_SCOPE: ${{ vars.FTP_ACCOUNT_SCOPE }}
      DEPLOY_GUARD: ${{ vars.DEPLOY_GUARD }}
      EXPECTED_GUARD: ${{ needs.prepare.outputs.guard }}
      LIVE_URL: ${{ needs.prepare.outputs.live_url }}
      EXPECTED_TEXT: ${{ needs.prepare.outputs.expected_text }}
      HERO_IMAGE: ${{ needs.prepare.outputs.hero_image }}
      SECONDARY_IMAGE: ${{ needs.prepare.outputs.secondary_image }}
      ART_MARKER: ${{ needs.prepare.outputs.art_marker }}
      HOSTINGER_LOCKED_IP: '145.223.108.40'
      HOSTINGER_TLS_ALIAS: 'worldz-gfm-pinned.hstgr.io'
      HOSTINGER_CERT_SHA256: '47:E1:B5:DC:5D:61:02:E8:ED:8C:01:21:61:AF:8B:22:53:70:AB:55:63:B0:0C:AF:14:6C:BD:7A:96:51:E9:5E'
      WORLDZ_MEDIA_RMSE_MAX: '0.05'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm}
      - name: Restore approved media and verify complete release
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/cryptoworldz-web-core/assets/worldz-master
          bash tools/restore-approved-worldz-media.sh apps/cryptoworldz-web-core/assets/worldz-master
          npm ci
          npm run verify
          test -s "apps/cryptoworldz-web-core/$HERO_IMAGE"
          test -s apps/cryptoworldz-web-core/assets/gofundme/oneworldz-survival-cover.webp
          grep -Fq 'https://gofund.me/933219353' apps/cryptoworldz-web-core/assets/worldz-donation-link.js
          grep -Fq 'https://www.gofundme.com/u/jayjayteamdev' apps/cryptoworldz-web-core/assets/worldz-donation-link.js
          grep -Fq 'https://gofund.me/933219353' apps/cryptoworldz-web-core/gofundme.html
          grep -Fq 'https://gofund.me/933219353' apps/cryptoworldz-web-core/donate.html
      - name: Lock domain-restricted target
        shell: bash
        run: |
          set -euo pipefail
          test "$FTP_ACCOUNT_SCOPE" = 'DOMAIN_ONLY'
          test "$DEPLOY_GUARD" = "$EXPECTED_GUARD"
          [[ "$FTP_SERVER_DIR" == '/' || "$FTP_SERVER_DIR" == '/public_html' ]]
          test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD" && test -n "$FTP_HOST"
          echo "::add-mask::$FTP_USERNAME"; echo "::add-mask::$FTP_PASSWORD"; echo "::add-mask::$FTP_HOST"
      - name: Install secure transfer and visual tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp zip imagemagick
      - name: Establish certificate-validated transfer host
        shell: bash
        run: |
          set -euo pipefail
          host="$(printf '%s' "$FTP_HOST"|sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#^ftp://##' -e 's#^ftps://##' -e 's#/.*$##')"
          if [[ "$host" != *:*:* && "$host" == *:* ]]; then host="${host%%:*}"; fi
          if [[ "$host" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            test "$host" = "$HOSTINGER_LOCKED_IP"; test "$FTP_PORT" = '21'
            echo "$HOSTINGER_LOCKED_IP $HOSTINGER_TLS_ALIAS" | sudo tee -a /etc/hosts >/dev/null
            cert="$RUNNER_TEMP/cert.pem"; session="$RUNNER_TEMP/session.txt"; err="$RUNNER_TEMP/err.txt"
            timeout 25 openssl s_client -starttls ftp -connect "$HOSTINGER_LOCKED_IP:21" -verify_return_error -showcerts </dev/null >"$session" 2>"$err"
            sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' "$session"|sed -n '1,/-----END CERTIFICATE-----/p' > "$cert"
            test "$(openssl x509 -in "$cert" -noout -fingerprint -sha256|cut -d= -f2)" = "$HOSTINGER_CERT_SHA256"
            openssl x509 -in "$cert" -noout -ext subjectAltName|grep -Fq 'DNS:*.hstgr.io'
            grep -Fq 'Verify return code: 0 (ok)' "$session"; ! grep -Eqi 'verify error|certificate verify failed' "$err"
            echo "FTP_CONNECT_HOST=$HOSTINGER_TLS_ALIAS" >> "$GITHUB_ENV"
          else
            echo "FTP_CONNECT_HOST=$host" >> "$GITHUB_ENV"
          fi
      - name: Confirm encrypted target
        run: timeout 45 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_CONNECT_HOST" -e "set cmd:fail-exit yes; set net:max-retries 1; set net:timeout 15; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname yes; cd '$FTP_SERVER_DIR'; bye"
      - name: Capture full rollback snapshot
        shell: bash
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/worldz-backup"; mkdir -p "$backup"
          timeout 360 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_CONNECT_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set ssl:check-hostname yes
          cd "$FTP_SERVER_DIR"
          lcd "$backup"
          mirror --parallel=3 --exclude-glob '.well-known/**' --exclude-glob '.env*' --exclude-glob '*.log' --exclude-glob 'cgi-bin/**' .
          bye
          LFTP
          test -n "$(find "$backup" -mindepth 1 -print -quit)"
          (cd "$backup" && find . -type f -print0|sort -z|xargs -0 sha256sum|sed 's#  \./#  #') > "$RUNNER_TEMP/worldz-backup.sha256"
          (cd "$backup" && zip -qr "$RUNNER_TEMP/worldz-predeploy.zip" .)
      - name: Preserve rollback package
        uses: actions/upload-artifact@v4
        with:
          name: worldz-gofundme-predeploy-${{ needs.prepare.outputs.target }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/worldz-predeploy.zip
            ${{ runner.temp }}/worldz-backup.sha256
          retention-days: 14
      - name: Upload exact approved core
        shell: bash
        run: |
          set -euo pipefail
          echo 'WORLDZ_UPLOAD_STARTED=true' >> "$GITHUB_ENV"
          node tools/build-worldz-media-payloads.mjs apps/cryptoworldz-web-core
          FTP_TRANSFER_TIMEOUT=360 bash tools/worldz-direct-ftp.sh upload "$GITHUB_WORKSPACE/apps/cryptoworldz-web-core"
      - name: Prove exact origin bytes and CDN visual media
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$SECONDARY_IMAGE" ]]; then bash tools/prove-worldz-origin-media.sh "$GITHUB_WORKSPACE/apps/cryptoworldz-web-core" "$HERO_IMAGE" "$SECONDARY_IMAGE"; else bash tools/prove-worldz-origin-media.sh "$GITHUB_WORKSPACE/apps/cryptoworldz-web-core" "$HERO_IMAGE"; fi
      - name: Prove live fundraising doorway
        shell: bash
        run: |
          set -euo pipefail
          cache="release=${GITHUB_SHA}-${GITHUB_RUN_ID}"
          curl -4 -L -fsS --retry 2 --retry-all-errors -H 'Cache-Control: no-cache' --max-time 40 "$LIVE_URL/?$cache" -o "$RUNNER_TEMP/live.html"
          grep -Fq 'worldz-donation-link.js' "$RUNNER_TEMP/live.html"
          curl -4 -L -fsS --retry 2 --retry-all-errors -H 'Cache-Control: no-cache' --max-time 40 "$LIVE_URL/assets/worldz-donation-link.js?$cache" -o "$RUNNER_TEMP/donation.js"
          grep -Fq 'https://gofund.me/933219353' "$RUNNER_TEMP/donation.js"
          grep -Fq 'https://www.gofundme.com/u/jayjayteamdev' "$RUNNER_TEMP/donation.js"
          if [[ "${{ needs.prepare.outputs.target }}" == 'oneworldz' ]]; then
            curl -4 -L -fsS --retry 2 --retry-all-errors --max-time 40 "$LIVE_URL/gofundme/?$cache" -o "$RUNNER_TEMP/gofundme.html"
            curl -4 -L -fsS --retry 2 --retry-all-errors --max-time 40 "$LIVE_URL/donate/?$cache" -o "$RUNNER_TEMP/donate.html"
            grep -Fq 'https://gofund.me/933219353' "$RUNNER_TEMP/gofundme.html"
            grep -Fq 'https://gofund.me/933219353' "$RUNNER_TEMP/donate.html"
          fi
      - name: Prove desktop and mobile rendering
        run: WORLDZ_PROOF_DIR="$RUNNER_TEMP/worldz-proof" node tools/prove-live-worldz.mjs "$LIVE_URL" "$EXPECTED_TEXT" "$ART_MARKER"
      - name: Preserve browser proof
        if: success() && env.WORLDZ_UPLOAD_STARTED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: worldz-gofundme-proof-${{ needs.prepare.outputs.target }}-${{ github.run_id }}
          path: ${{ runner.temp }}/worldz-proof/
          retention-days: 30
      - name: Restore previous site if any post-upload proof fails
        if: failure() && env.WORLDZ_UPLOAD_STARTED == 'true'
        run: FTP_TRANSFER_TIMEOUT=360 bash tools/worldz-direct-ftp.sh restore "$RUNNER_TEMP/worldz-backup"
