name: Deploy Worldz OneDrop Live

on:
  pull_request:
    branches:
      - main
    paths:
      - 'launchpad.cryptoworldz.xyz/onedrop/**'
      - 'launchpad.cryptoworldz.xyz/index.html'
      - '.github/workflows/deploy-onedrop-live.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worldz-onedrop-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate OneDrop public bundle
        shell: bash
        run: |
          set -euo pipefail
          node --check launchpad.cryptoworldz.xyz/onedrop/app.js
          node --check launchpad.cryptoworldz.xyz/onedrop/claim/app.js
          test -f launchpad.cryptoworldz.xyz/onedrop/revive-manifest.v1.json
          grep -q 'Worldz OneDrop' launchpad.cryptoworldz.xyz/onedrop/index.html
          grep -q 'REVIVE' launchpad.cryptoworldz.xyz/onedrop/claim/index.html
          echo WORLDZ_ONEDROP_BUNDLE=PASS

      - name: Publish OneDrop to both known LaunchPad Hostinger roots
        shell: python
        run: |
          import os, ssl
          from ftplib import FTP_TLS, error_perm
          from pathlib import Path, PurePosixPath

          site_root=Path('launchpad.cryptoworldz.xyz')
          targets=[
            (site_root/'onedrop', PurePosixPath('domains/launchpad.cryptoworldz.xyz/public_html/onedrop')),
            (site_root/'onedrop', PurePosixPath('domains/cryptoworldz.xyz/public_html/launchpad/onedrop')),
          ]
          root_files=[
            (site_root/'index.html', PurePosixPath('domains/launchpad.cryptoworldz.xyz/public_html/index.html')),
            (site_root/'index.html', PurePosixPath('domains/cryptoworldz.xyz/public_html/launchpad/index.html')),
          ]

          ftp=FTP_TLS(context=ssl._create_unverified_context())
          ftp.connect(os.environ['FTP_HOST'],int(os.environ.get('FTP_PORT','21')),timeout=45)
          ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          ftp.set_pasv(True)

          def ensure(directory):
              ftp.cwd('/')
              for part in PurePosixPath(directory).parts:
                  if part in ('','/'):
                      continue
                  try:
                      ftp.cwd(part)
                  except error_perm:
                      ftp.mkd(part)
                      ftp.cwd(part)

          count=0
          try:
              for local_root, remote_root in targets:
                  for local in sorted(p for p in local_root.rglob('*') if p.is_file()):
                      rel=local.relative_to(local_root)
                      remote=remote_root/PurePosixPath(rel.as_posix())
                      ensure(remote.parent)
                      with local.open('rb') as fh:
                          ftp.storbinary('STOR '+remote.name,fh,blocksize=262144)
                      print('ONEDROP_PUBLISHED',local.as_posix(),'->',remote.as_posix())
                      count+=1
              for local, remote in root_files:
                  ensure(remote.parent)
                  with local.open('rb') as fh:
                      ftp.storbinary('STOR '+remote.name,fh,blocksize=262144)
                  print('ONEDROP_ROOT_PUBLISHED',local.as_posix(),'->',remote.as_posix())
                  count+=1
          finally:
              try:
                  ftp.quit()
              except Exception:
                  ftp.close()

          print('WORLDZ_ONEDROP_UPLOAD=PASS files='+str(count))

      - name: Verify deployed bytes at Hostinger origin
        shell: python
        run: |
          import os, ssl, io
          from ftplib import FTP_TLS
          from pathlib import Path, PurePosixPath

          checks=[
            (Path('launchpad.cryptoworldz.xyz/onedrop/index.html'), PurePosixPath('domains/launchpad.cryptoworldz.xyz/public_html/onedrop/index.html')),
            (Path('launchpad.cryptoworldz.xyz/onedrop/app.js'), PurePosixPath('domains/launchpad.cryptoworldz.xyz/public_html/onedrop/app.js')),
            (Path('launchpad.cryptoworldz.xyz/onedrop/revive-manifest.v1.json'), PurePosixPath('domains/launchpad.cryptoworldz.xyz/public_html/onedrop/revive-manifest.v1.json')),
            (Path('launchpad.cryptoworldz.xyz/onedrop/claim/index.html'), PurePosixPath('domains/launchpad.cryptoworldz.xyz/public_html/onedrop/claim/index.html')),
            (Path('launchpad.cryptoworldz.xyz/onedrop/claim/app.js'), PurePosixPath('domains/launchpad.cryptoworldz.xyz/public_html/onedrop/claim/app.js')),
          ]

          ftp=FTP_TLS(context=ssl._create_unverified_context())
          ftp.connect(os.environ['FTP_HOST'],int(os.environ.get('FTP_PORT','21')),timeout=45)
          ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          try:
              for local,remote in checks:
                  buf=io.BytesIO()
                  ftp.retrbinary('RETR /'+str(remote),buf.write)
                  expected=local.read_bytes()
                  actual=buf.getvalue()
                  if actual!=expected:
                      raise SystemExit('HOSTINGER_ORIGIN_MISMATCH '+str(remote))
                  print('HOSTINGER_ORIGIN_PASS',remote,'bytes='+str(len(actual)))
          finally:
              try:ftp.quit()
              except Exception:ftp.close()
          print('WORLDZ_ONEDROP_ORIGIN=PASS files='+str(len(checks)))

      - name: Probe public edge without overriding origin proof
        continue-on-error: true
        shell: python
        run: |
          import urllib.request, urllib.error, time
          for url in [
            'https://launchpad.cryptoworldz.xyz/onedrop/',
            'https://launchpad.cryptoworldz.xyz/onedrop/claim/'
          ]:
              try:
                  req=urllib.request.Request(url+'?onedrop_probe='+str(int(time.time()*1000)),headers={
                    'User-Agent':'Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36',
                    'Accept':'text/html,application/xhtml+xml',
                    'Cache-Control':'no-cache'
                  })
                  with urllib.request.urlopen(req,timeout=20) as r:
                      print('PUBLIC_EDGE',url,'status='+str(r.status))
              except urllib.error.HTTPError as e:
                  print('PUBLIC_EDGE_BLOCKED',url,'status='+str(e.code))
              except Exception as e:
                  print('PUBLIC_EDGE_UNAVAILABLE',url,repr(e))


      - name: Android browser wallet-bridge smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({
              viewport:{width:412,height:915},
              userAgent:'Mozilla/5.0 (Linux; Android 13; CPH2197) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36',
              isMobile:true,
              hasTouch:true
            });
            const page=await context.newPage();
            const consoleErrors=[];
            const pageErrors=[];
            page.on('console',m=>{ if(m.type()==='error') consoleErrors.push(m.text()); });
            page.on('pageerror',e=>pageErrors.push(String(e)));
            const url='https://launchpad.cryptoworldz.xyz/onedrop/?wallet_e2e='+Date.now();
            const resp=await page.goto(url,{waitUntil:'domcontentloaded',timeout:60000});
            if(!resp || resp.status()!==200) throw new Error('OneDrop HTTP status '+(resp&&resp.status()));
            await page.waitForSelector('#connect',{state:'visible',timeout:20000});
            await page.click('#connect');
            let bridgeReady=false,modalOpen=false;
            try{
              await page.waitForFunction(()=>!!window.__WORLDZ_JUPITER_MOBILE_ADAPTER__,null,{timeout:20000});
              bridgeReady=true;
            }catch{}
            try{
              await page.waitForFunction(()=>window.__WORLDZ_REOWN_STATE__?.open===true,null,{timeout:15000});
              modalOpen=true;
            }catch{}
            const status=await page.locator('#status').innerText().catch(()=>'<missing>');
            const modalCount=await page.locator('w3m-modal,appkit-modal,w3m-router,wui-flex').count().catch(()=>0);
            const state=await page.evaluate(()=>window.__WORLDZ_REOWN_STATE__||{});
            console.log('ONEDROP_E2E_STATUS='+JSON.stringify(status));
            console.log('ONEDROP_E2E_BRIDGE_READY='+bridgeReady);
            console.log('ONEDROP_E2E_MODAL_OPEN='+modalOpen);
            console.log('ONEDROP_E2E_MODAL_NODES='+modalCount);
            console.log('ONEDROP_E2E_REOWN_STATE='+JSON.stringify(state));
            if(consoleErrors.length) console.log('ONEDROP_E2E_CONSOLE_ERRORS='+JSON.stringify(consoleErrors));
            if(pageErrors.length) console.log('ONEDROP_E2E_PAGE_ERRORS='+JSON.stringify(pageErrors));
            await browser.close();
            if(!bridgeReady || !modalOpen || pageErrors.length){
              throw new Error('Android wallet connection UI failed. '+JSON.stringify({bridgeReady,modalOpen,modalCount,status,state,consoleErrors,pageErrors}));
            }
            console.log('WORLDZ_ONEDROP_ANDROID_WALLET_BRIDGE=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

