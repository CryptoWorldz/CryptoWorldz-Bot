name: Deploy Worldz OneDrop Live

on:
  pull_request:
    branches: [main]
    paths:
      - 'launchpad.cryptoworldz.xyz/onedrop/**'
      - 'scripts/validate_onedrop_static.mjs'
      - '.github/workflows/deploy-onedrop-live.yml'
  push:
    branches: [main]
    paths:
      - 'launchpad.cryptoworldz.xyz/onedrop/**'
      - 'scripts/validate_onedrop_static.mjs'
      - '.github/workflows/deploy-onedrop-live.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worldz-onedrop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate OneDrop bundle
        shell: bash
        run: |
          set -euo pipefail
          node --check launchpad.cryptoworldz.xyz/onedrop/app.js
          node --check launchpad.cryptoworldz.xyz/onedrop/claim/app.js
          node --check launchpad.cryptoworldz.xyz/onedrop/wallet-mobile.js
          test -f launchpad.cryptoworldz.xyz/onedrop/revive-manifest.v1.json
          grep -q 'Worldz OneDrop' launchpad.cryptoworldz.xyz/onedrop/index.html
          grep -q 'REVIVE' launchpad.cryptoworldz.xyz/onedrop/claim/index.html
          echo WORLDZ_ONEDROP_BUNDLE=PASS

      - name: Validate distribution arithmetic and transaction packet size
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund @solana/web3.js@1.98.4 @solana/spl-token@0.4.15 @sqds/multisig@2.1.4
          node scripts/validate_onedrop_static.mjs

      - name: Validate live REVIVE source account BEFORE deployment
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const manifest=JSON.parse(fs.readFileSync('launchpad.cryptoworldz.xyz/onedrop/revive-manifest.v1.json','utf8'));
          const RPC='https://hknymhhyqldtzmplzuzh.supabase.co/functions/v1/worldz-solana-rpc';
          const MAINNET='5eykt4UsFv8P8NJdTREpY1vzqKqZKvdpKuc147dw2N9d';
          async function rpc(method,params=[]){
            const r=await fetch(RPC,{
              method:'POST',
              headers:{'content-type':'application/json'},
              body:JSON.stringify({jsonrpc:'2.0',id:method,method,params})
            });
            const j=await r.json();
            if(!r.ok||j.error) throw new Error(method+' failed: '+JSON.stringify(j.error||r.status));
            return j.result;
          }
          (async()=>{
            const genesis=await rpc('getGenesisHash');
            if(genesis!==MAINNET) throw new Error('wrong Solana genesis '+genesis);
            const ata=manifest.authority.squadsVaultRvivAta;
            const mint=manifest.token.mint;
            const vault=manifest.authority.squadsVault;
            const info=await rpc('getAccountInfo',[ata,{encoding:'jsonParsed',commitment:'confirmed'}]);
            if(!info?.value) throw new Error('REVIVE source ATA does not exist: '+ata);
            const parsed=info.value.data?.parsed?.info;
            if(!parsed) throw new Error('REVIVE source ATA is not a parsed SPL token account');
            if(parsed.mint!==mint) throw new Error('REVIVE source ATA mint mismatch: '+parsed.mint);
            if(parsed.owner!==vault) throw new Error('REVIVE source ATA owner mismatch: '+parsed.owner);
            const bal=await rpc('getTokenAccountBalance',[ata,{commitment:'confirmed'}]);
            const amount=BigInt(bal?.value?.amount||'0');
            const needed=BigInt(manifest.executableNow.totalMovedFromSquadsRaw);
            if(amount<needed) throw new Error('REVIVE source balance too low: '+amount+' < '+needed);
            console.log('WORLDZ_ONEDROP_LIVE_SOURCE=PASS ata='+ata+' raw='+amount);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Android wallet UI smoke test BEFORE deployment
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const path = require('path');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const context = await browser.newContext({
              viewport: { width: 412, height: 915 },
              userAgent: 'Mozilla/5.0 (Linux; Android 13; CPH2197) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Mobile Safari/537.36',
              isMobile: true,
              hasTouch: true
            });
            const page = await context.newPage();
            const siteRoot = path.resolve('launchpad.cryptoworldz.xyz');

            await page.route('https://launchpad.cryptoworldz.xyz/**', async route => {
              const u = new URL(route.request().url());
              let rel = u.pathname;
              while (rel.startsWith('/')) rel = rel.slice(1);
              if (rel === '') rel = 'index.html';
              if (rel.endsWith('/')) rel += 'index.html';
              const file = path.resolve(siteRoot, rel);
              if (!file.startsWith(siteRoot) || !fs.existsSync(file)) return route.continue();
              const ext = path.extname(file).toLowerCase();
              const contentType =
                ext === '.html' ? 'text/html; charset=utf-8' :
                ext === '.js' ? 'text/javascript; charset=utf-8' :
                ext === '.json' ? 'application/json; charset=utf-8' :
                'application/octet-stream';
              return route.fulfill({ status: 200, contentType, body: fs.readFileSync(file) });
            });

            const consoleErrors = [];
            const pageErrors = [];
            page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
            page.on('pageerror', e => pageErrors.push(String(e)));

            const resp = await page.goto(
              'https://launchpad.cryptoworldz.xyz/onedrop/?wallet_e2e=' + Date.now(),
              { waitUntil: 'domcontentloaded', timeout: 60000 }
            );
            if (!resp || resp.status() !== 200) throw new Error('OneDrop bundle failed to load');

            await page.waitForSelector('#connect', { state: 'visible', timeout: 20000 });
            await page.click('#connect');

            await page.waitForFunction(
              () => !!window.__WORLDZ_JUPITER_MOBILE_ADAPTER__,
              null,
              { timeout: 30000 }
            );

            await page.waitForFunction(
              () => window.__WORLDZ_REOWN_STATE__?.open === true,
              null,
              { timeout: 30000 }
            );

            const status = await page.locator('#status').innerText();
            const state = await page.evaluate(() => window.__WORLDZ_REOWN_STATE__ || {});
            console.log('ONEDROP_E2E_STATUS=' + JSON.stringify(status));
            console.log('ONEDROP_E2E_REOWN_OPEN=' + JSON.stringify(state.open));

            if (pageErrors.length) {
              throw new Error('Browser page errors: ' + JSON.stringify(pageErrors));
            }
            if (consoleErrors.some(x => /TypeError|SyntaxError|ReferenceError|does not provide an export/i.test(x))) {
              throw new Error('Browser console errors: ' + JSON.stringify(consoleErrors));
            }

            await browser.close();
            console.log('WORLDZ_ONEDROP_ANDROID_WALLET_UI=PASS');
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          NODE

  deploy:
    needs: validate
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
    steps:
      - uses: actions/checkout@v4

      - name: Publish approved main OneDrop bundle
        shell: python
        run: |
          import os, ssl
          from ftplib import FTP_TLS, error_perm
          from pathlib import Path, PurePosixPath

          site_root=Path('launchpad.cryptoworldz.xyz')
          targets=[
            (site_root/'onedrop', PurePosixPath('domains/launchpad.cryptoworldz.xyz/public_html/onedrop')),
            (site_root/'onedrop', PurePosixPath('domains/cryptoworldz.xyz/public_html/launchpad/onedrop')),
          ]

          ftp=FTP_TLS(context=ssl._create_unverified_context())
          ftp.connect(os.environ['FTP_HOST'], int(os.environ.get('FTP_PORT','21')), timeout=45)
          ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          ftp.set_pasv(True)

          def ensure(directory):
              ftp.cwd('/')
              for part in PurePosixPath(directory).parts:
                  if part in ('','/'):
                      continue
                  try:
                      ftp.cwd(part)
                  except error_perm:
                      ftp.mkd(part)
                      ftp.cwd(part)

          count=0
          try:
              for local_root, remote_root in targets:
                  for local in sorted(p for p in local_root.rglob('*') if p.is_file()):
                      rel=local.relative_to(local_root)
                      remote=remote_root/PurePosixPath(rel.as_posix())
                      ensure(remote.parent)
                      with local.open('rb') as fh:
                          ftp.storbinary('STOR '+remote.name, fh, blocksize=262144)
                      print('ONEDROP_PUBLISHED', local.as_posix(), '->', remote.as_posix())
                      count+=1
          finally:
              try: ftp.quit()
              except Exception: ftp.close()

          print('WORLDZ_ONEDROP_UPLOAD=PASS files='+str(count))

      - name: Verify deployed OneDrop bytes at Hostinger origin
        shell: python
        run: |
          import os, ssl, io
          from ftplib import FTP_TLS
          from pathlib import Path, PurePosixPath

          checks=[
            (Path('launchpad.cryptoworldz.xyz/onedrop/index.html'), PurePosixPath('domains/launchpad.cryptoworldz.xyz/public_html/onedrop/index.html')),
            (Path('launchpad.cryptoworldz.xyz/onedrop/app.js'), PurePosixPath('domains/launchpad.cryptoworldz.xyz/public_html/onedrop/app.js')),
            (Path('launchpad.cryptoworldz.xyz/onedrop/wallet-mobile.js'), PurePosixPath('domains/launchpad.cryptoworldz.xyz/public_html/onedrop/wallet-mobile.js')),
            (Path('launchpad.cryptoworldz.xyz/onedrop/revive-manifest.v1.json'), PurePosixPath('domains/launchpad.cryptoworldz.xyz/public_html/onedrop/revive-manifest.v1.json')),
            (Path('launchpad.cryptoworldz.xyz/onedrop/claim/index.html'), PurePosixPath('domains/launchpad.cryptoworldz.xyz/public_html/onedrop/claim/index.html')),
            (Path('launchpad.cryptoworldz.xyz/onedrop/claim/app.js'), PurePosixPath('domains/launchpad.cryptoworldz.xyz/public_html/onedrop/claim/app.js')),
          ]

          ftp=FTP_TLS(context=ssl._create_unverified_context())
          ftp.connect(os.environ['FTP_HOST'], int(os.environ.get('FTP_PORT','21')), timeout=45)
          ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          ftp.set_pasv(True)
          try:
              for local,remote in checks:
                  buf=io.BytesIO()
                  ftp.retrbinary('RETR /'+str(remote),buf.write)
                  actual=buf.getvalue()
                  expected=local.read_bytes()
                  if actual != expected:
                      raise SystemExit('HOSTINGER_ORIGIN_MISMATCH '+str(remote))
                  print('HOSTINGER_ORIGIN_PASS',remote,'bytes='+str(len(actual)))
          finally:
              try: ftp.quit()
              except Exception: ftp.close()
          print('WORLDZ_ONEDROP_ORIGIN=PASS')

      - name: Verify public pages
        shell: python
        run: |
          import time, urllib.request
          expected={
            'https://launchpad.cryptoworldz.xyz/onedrop/':['Worldz OneDrop','SIGN & LAUNCH ONEDROP'],
            'https://launchpad.cryptoworldz.xyz/onedrop/claim/':['REVIVE','Verify My Allocation']
          }
          for url,needles in expected.items():
              last=None
              for attempt in range(1,6):
                  try:
                      req=urllib.request.Request(
                        url+'?release='+str(int(time.time()*1000)),
                        headers={'User-Agent':'Mozilla/5.0','Cache-Control':'no-cache'}
                      )
                      with urllib.request.urlopen(req,timeout=30) as r:
                          body=r.read().decode('utf-8','ignore')
                          if r.status==200 and all(n in body for n in needles):
                              print('PUBLIC_PASS',url)
                              break
                          last='contract mismatch'
                  except Exception as e:
                      last=repr(e)
                  time.sleep(attempt*2)
              else:
                  raise SystemExit('PUBLIC_FAIL '+url+' '+str(last))
          print('WORLDZ_ONEDROP_PUBLIC=PASS')
