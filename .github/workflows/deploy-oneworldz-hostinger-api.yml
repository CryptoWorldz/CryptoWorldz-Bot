name: DEPLOY — OneWorldz — Hostinger Domain API Proof First

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-oneworldz-hostinger-api.yml'

permissions:
  contents: read

concurrency:
  group: oneworldz-hostinger-domain-deploy
  cancel-in-progress: true

env:
  DOMAIN: oneworldz.com
  SOURCE_ROOT: apps/cryptoworldz-web-core
  EXPECTED_HOSTING_USERNAME: u643166328
  EXPECTED_ORDER_ID: '1009657511'
  EXPECTED_ROOT: /home/u643166328/domains/oneworldz.com/public_html
  ROLLBACK_REF: c544ecd2a7dd003eaf7be4229118da05b2dc83fc
  RELEASE_MARKER: 20260812-oneworldz-support-v1

jobs:
  deploy:
    name: Backup → Domain Deploy → Desktop/Mobile QA → Rollback on failure
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: oneworldz-production
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Preflight live Hostinger assignment and build
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$HOSTINGER_API_TOKEN" ]]
          echo "::add-mask::$HOSTINGER_API_TOKEN"
          test -f "$SOURCE_ROOT/index.html"
          test ! -f "$SOURCE_ROOT/package.json"
          grep -Fq "$RELEASE_MARKER" "$SOURCE_ROOT/index.html"
          grep -Fq 'https://gofund.me/933219353' "$SOURCE_ROOT/assets/site-pages.js"
          grep -Fq 'https://www.gofundme.com/u/jayjayteamdev' "$SOURCE_ROOT/assets/site-pages.js"
          node --check "$SOURCE_ROOT/assets/site-pages.js"
          node --check "$SOURCE_ROOT/assets/site-router.js"
          node --check "$SOURCE_ROOT/assets/oneworldz-support-campaign.js"
          for p in 00 01 02 03; do test -s "$SOURCE_ROOT/assets/campaign/areas-support/$p.b64"; done

          f="$RUNNER_TEMP/sites.json"
          code=$(curl -fsS --max-time 30 -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' -o "$f" -w '%{http_code}' "https://developers.hostinger.com/api/hosting/v1/websites?domain=$DOMAIN")
          [[ "$code" == 200 ]]
          ok=$(jq '[.data[]? | select(.domain=="oneworldz.com" and .username=="u643166328" and (.order_id|tostring)=="1009657511" and .root_directory=="/home/u643166328/domains/oneworldz.com/public_html" and .is_enabled==true)] | length' "$f")
          [[ "$ok" == 1 ]]
          echo 'HOSTINGER_ASSIGNMENT=VERIFIED'

      - name: Build current and rollback archives
        id: archives
        shell: bash
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/live-before"
          mkdir -p "$before"
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "https://$DOMAIN/?before=$GITHUB_RUN_ID" -o "$before/index.html"
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache' "https://$DOMAIN/assets/site-pages.js?before=$GITHUB_RUN_ID" -o "$before/site-pages.js" || true
          sha256sum "$before/index.html" > "$before/index.sha256"

          current="$RUNNER_TEMP/oneworldz_$(date -u +%Y%m%d_%H%M%S).zip"
          rollback="$RUNNER_TEMP/oneworldz_rollback_$(date -u +%Y%m%d_%H%M%S).zip"
          (cd "$SOURCE_ROOT" && zip -qr "$current" .)
          git archive --format=zip --output="$rollback" "$ROLLBACK_REF:$SOURCE_ROOT"
          unzip -p "$current" index.html | grep -Fq "$RELEASE_MARKER"
          unzip -p "$current" assets/site-pages.js | grep -Fq 'https://gofund.me/933219353'
          unzip -p "$current" assets/site-pages.js | grep -Fq 'https://www.gofundme.com/u/jayjayteamdev'
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "rollback=$rollback" >> "$GITHUB_OUTPUT"

      - name: Preserve pre-deploy proof
        uses: actions/upload-artifact@v4
        with:
          name: oneworldz-before-${{ github.run_id }}
          path: ${{ runner.temp }}/live-before
          retention-days: 14

      - name: Install official Hostinger deployment tooling
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/hostinger-tools"
          mkdir -p "$tools"
          cd "$tools"
          npm init -y >/dev/null
          npm install --silent hostinger-api-mcp @modelcontextprotocol/sdk puppeteer-core
          test -x node_modules/.bin/hostinger-api-mcp
          echo "TOOLS_DIR=$tools" >> "$GITHUB_ENV"

      - name: Create Hostinger domain deploy client
        shell: bash
        run: |
          cat > "$TOOLS_DIR/deploy.mjs" <<'NODE'
          import {Client} from '@modelcontextprotocol/sdk/client/index.js';
          import {StdioClientTransport} from '@modelcontextprotocol/sdk/client/stdio.js';
          import path from 'node:path';
          const archivePath=process.env.DEPLOY_ARCHIVE;
          if(!archivePath) throw new Error('DEPLOY_ARCHIVE missing');
          const transport=new StdioClientTransport({command:path.resolve(process.env.TOOLS_DIR,'node_modules/.bin/hostinger-api-mcp'),args:['--stdio'],env:{...process.env,HOSTINGER_API_TOKEN:process.env.HOSTINGER_API_TOKEN,DEBUG:'false'}});
          const client=new Client({name:'oneworldz-production-deployer',version:'1.0.0'},{capabilities:{}});
          await client.connect(transport);
          const result=await client.callTool({name:'hosting_deployStaticWebsite',arguments:{domain:'oneworldz.com',archivePath,removeArchive:false}});
          if(result.isError) throw new Error(JSON.stringify(result.content));
          console.log('HOSTINGER_DOMAIN_DEPLOY=ACCEPTED');
          await client.close();
          NODE

      - name: Deploy current build to correct OneWorldz hosting account
        id: deploy
        shell: bash
        env:
          DEPLOY_ARCHIVE: ${{ steps.archives.outputs.current }}
        run: |
          set -euo pipefail
          cd "$TOOLS_DIR"
          node deploy.mjs
          code=$(curl -sS --max-time 30 -X DELETE -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' -o "$RUNNER_TEMP/cache.json" -w '%{http_code}' "https://developers.hostinger.com/api/hosting/v1/accounts/$EXPECTED_HOSTING_USERNAME/websites/$DOMAIN/cache/clear")
          [[ "$code" == 200 || "$code" == 204 ]]
          echo "CACHE_CLEAR_HTTP=$code"

      - name: Verify public release files
        shell: bash
        run: |
          set -euo pipefail
          probe(){
            local url="$1" needle="$2"
            for n in 1 2 3 4 5 6; do
              if curl -fsS --max-time 20 -H 'Cache-Control: no-cache, no-store' "${url}?cb=${GITHUB_RUN_ID}-${n}" | grep -Fq "$needle"; then return 0; fi
              sleep 3
            done
            return 1
          }
          probe "https://$DOMAIN/" "$RELEASE_MARKER"
          probe "https://$DOMAIN/assets/site-router.js" 'oneworldz-support-campaign.js'
          probe "https://$DOMAIN/assets/site-pages.js" 'https://gofund.me/933219353'
          probe "https://$DOMAIN/assets/site-pages.js" 'https://www.gofundme.com/u/jayjayteamdev'
          probe "https://$DOMAIN/assets/oneworldz-support-campaign.js" 'areas-support/00.b64'
          for p in 00 01 02 03; do
            bytes=$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache, no-store' "https://$DOMAIN/assets/campaign/areas-support/$p.b64?cb=$GITHUB_RUN_ID" | wc -c)
            [[ "$bytes" -gt 1000 ]]
          done
          echo 'PUBLIC_RELEASE=PASS'

      - name: Bounded desktop and mobile browser QA
        id: qa
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [[ -n "$chrome" ]]
          export CHROME_BIN="$chrome"
          qa="$RUNNER_TEMP/qa"
          mkdir -p "$qa"
          cat > "$TOOLS_DIR/qa.mjs" <<'NODE'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const browser=await puppeteer.launch({executablePath:process.env.CHROME_BIN,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          const stamp=Date.now();
          const checks=[
            ['desktop-home',`https://oneworldz.com/?qa=${stamp}`,1440,1000,false],
            ['mobile-home',`https://oneworldz.com/?qa=${stamp}-m`,390,844,false],
            ['desktop-help',`https://oneworldz.com/?page=help&qa=${stamp}-h`,1440,1000,true],
            ['mobile-help',`https://oneworldz.com/?page=help&qa=${stamp}-hm`,390,844,true]
          ];
          const report=[]; let failed=false;
          for(const [name,url,width,height,help] of checks){
            const page=await browser.newPage();
            await page.setViewport({width,height,isMobile:width<500,hasTouch:width<500});
            await page.goto(url,{waitUntil:'domcontentloaded',timeout:30000}).catch(()=>{});
            await sleep(4500);
            await page.evaluate(()=>{for(const img of document.images){img.loading='eager';img.scrollIntoView({block:'center'});}}).catch(()=>{});
            await sleep(2500);
            let data=null; let err='';
            for(let n=0;n<8&&!data;n++){
              try{
                data=await page.evaluate((help)=>{
                  const imgs=[...document.images].filter(i=>getComputedStyle(i).display!=='none'&&getComputedStyle(i).visibility!=='hidden');
                  const broken=imgs.filter(i=>!i.complete||i.naturalWidth===0||i.naturalHeight===0).map(i=>i.currentSrc||i.src);
                  const lowRes=imgs.filter(i=>i.naturalWidth>0&&i.clientWidth>0&&(i.naturalWidth<i.clientWidth*.75||i.naturalHeight<i.clientHeight*.75)).map(i=>({src:i.currentSrc||i.src,natural:[i.naturalWidth,i.naturalHeight],rendered:[i.clientWidth,i.clientHeight]}));
                  const hrefs=[...document.querySelectorAll('a[href]')].map(a=>a.href);
                  return {url:location.href,title:document.title,viewport:innerWidth,scrollWidth:document.documentElement.scrollWidth,imageCount:imgs.length,broken,lowRes,hasFeatured:hrefs.includes('https://gofund.me/933219353'),hasProfile:hrefs.includes('https://www.gofundme.com/u/jayjayteamdev'),supportLoaded:!document.querySelector('.ow-support-image')||document.querySelector('.ow-support-image').naturalWidth>0,help};
                },help);
              }catch(e){err=String(e);await sleep(600);}
            }
            if(!data){data={error:err};failed=true;}
            else {
              const overflow=data.scrollWidth>data.viewport+20;
              const badLinks=help&&(!data.hasFeatured||!data.hasProfile);
              const bad=data.broken.length>0||data.lowRes.length>0||overflow||badLinks||!data.supportLoaded;
              data.overflow=overflow; data.badLinks=badLinks;
              if(bad) failed=true;
            }
            report.push({name,data});
            await page.screenshot({path:`${process.env.QA_DIR}/${name}.png`,fullPage:true}).catch(()=>{});
            await page.close();
          }
          fs.writeFileSync(`${process.env.QA_DIR}/report.json`,JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          await browser.close();
          if(failed) process.exit(2);
          NODE
          cd "$TOOLS_DIR"
          QA_DIR="$qa" timeout 90 node qa.mjs
          echo 'BROWSER_QA=PASS'

      - name: Preserve live QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneworldz-live-qa-${{ github.run_id }}
          path: ${{ runner.temp }}/qa
          retention-days: 14
          if-no-files-found: ignore

      - name: Roll back automatically on failed live proof
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        shell: bash
        env:
          DEPLOY_ARCHIVE: ${{ steps.archives.outputs.rollback }}
        run: |
          set -euo pipefail
          cd "$TOOLS_DIR"
          node deploy.mjs
          code=$(curl -sS --max-time 30 -X DELETE -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' -o "$RUNNER_TEMP/cache-rollback.json" -w '%{http_code}' "https://developers.hostinger.com/api/hosting/v1/accounts/$EXPECTED_HOSTING_USERNAME/websites/$DOMAIN/cache/clear")
          [[ "$code" == 200 || "$code" == 204 ]]
          curl -fsS --max-time 30 -H 'Cache-Control: no-cache, no-store' "https://$DOMAIN/?rollback=$GITHUB_RUN_ID" >/dev/null
          echo 'ROLLBACK=COMPLETED'
