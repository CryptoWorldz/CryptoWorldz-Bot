name: CryptoWorldz Hostinger Environment Audit V2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hostinger-cryptoworldz-env-audit-v2.yml"

permissions:
  contents: write

env:
  CRYPTO_DOMAIN: cryptoworldz.xyz
  ZED_DOMAIN: cryptobotz.cryptoworldz.xyz

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish audit start
        run: bash .github/publish-progress.sh HOSTINGER_ENV_AUDIT STARTED
      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq lftp
      - name: Read-only Hostinger environment audit
        shell: bash
        run: |
          set -euo pipefail
          for v in "$FTP_HOST" "$FTP_USERNAME" "$FTP_PASSWORD" "$HOSTINGER_API_TOKEN"; do [ -z "$v" ] || echo "::add-mask::$v"; done
          test -n "$HOSTINGER_API_TOKEN"
          curl --fail --silent --show-error --location -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' \
            'https://developers.hostinger.com/api/hosting/v1/websites?per_page=100' -o "$RUNNER_TEMP/websites.json"
          node - <<'NODE'
          const fs=require('fs'); const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/websites.json','utf8')); const rows=p.data||[];
          for(const d of [process.env.CRYPTO_DOMAIN,process.env.ZED_DOMAIN]){
            const r=rows.find(x=>String(x.domain||'').toLowerCase()===d.toLowerCase());
            console.log(`HOSTINGER_SITE ${d}=${r?'REGISTERED':'NOT_REGISTERED'}`);
            if(r){console.log(`HOSTINGER_ACCOUNT ${d}=${r.username?'PRESENT':'ABSENT'}`); console.log(`HOSTINGER_STATUS ${d}=${r.status||'unknown'}`)}
          }
          NODE
          raw_host="$(printf '%s' "$FTP_HOST" | sed -e 's#^ftp://##' -e 's#^ftps://##' -e 's#/.*$##')"; if [[ "$raw_host" != *:*:* && "$raw_host" == *:* ]]; then raw_host="${raw_host%%:*}"; fi
          root="$RUNNER_TEMP/env-audit"; mkdir -p "$root"
          cat > "$RUNNER_TEMP/env-audit.lftp" <<EOF
          set cmd:fail-exit false
          set net:max-retries 2
          set net:timeout 25
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          cls -la /domains/cryptoworldz.xyz
          cls -la /domains/cryptoworldz.xyz/public_html
          cls -la /domains/cryptoworldz.xyz/nodejs
          cls -la /domains/cryptobotz.cryptoworldz.xyz
          cls -la /domains/cryptobotz.cryptoworldz.xyz/nodejs
          get /domains/cryptoworldz.xyz/.env -o $root/crypto-root.env
          get /domains/cryptoworldz.xyz/public_html/.env -o $root/crypto-public.env
          get /domains/cryptoworldz.xyz/nodejs/.env -o $root/crypto-node.env
          get /domains/cryptobotz.cryptoworldz.xyz/.env -o $root/zed-root.env
          get /domains/cryptobotz.cryptoworldz.xyz/nodejs/.env -o $root/zed-node.env
          bye
          EOF
          timeout 240 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/env-audit.lftp" "$raw_host" || true
          node - <<'NODE'
          const fs=require('fs'),path=require('path'); const root=path.join(process.env.RUNNER_TEMP,'env-audit');
          const wanted=['BOT_TOKEN','TELEGRAM_TOKEN','SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY','SUPABASE_ANON_KEY','OPENAI_API_KEY','HOSTINGER_API_TOKEN','ADMIN_API_TOKEN','HUB_API_SECRET'];
          for(const f of fs.existsSync(root)?fs.readdirSync(root).sort():[]){const p=path.join(root,f);if(!fs.statSync(p).isFile()||!fs.statSync(p).size)continue;const keys=fs.readFileSync(p,'utf8').split(/\r?\n/).map(x=>x.trim()).filter(x=>x&&!x.startsWith('#')&&x.includes('=')).map(x=>x.slice(0,x.indexOf('=')).trim());console.log(`ENV_FILE ${f}=PRESENT`);for(const k of wanted)console.log(`ENV_HAS ${f} ${k}=${keys.includes(k)?'YES':'NO'}`)}
          NODE
          node - <<'NODE' > "$RUNNER_TEMP/accounts.tsv"
          const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/websites.json','utf8'));const rows=p.data||[];for(const d of [process.env.CRYPTO_DOMAIN,process.env.ZED_DOMAIN]){const r=rows.find(x=>String(x.domain||'').toLowerCase()===d.toLowerCase());if(r?.username)console.log(`${d}\t${r.username}`)}
          NODE
          while IFS=$'\t' read -r domain username; do
            [ -n "$domain" ] || continue; echo "::add-mask::$username"; denc="$(DOMAIN="$domain" node -p 'encodeURIComponent(process.env.DOMAIN)')"; uenc="$(USERNAME="$username" node -p 'encodeURIComponent(process.env.USERNAME)')";
            code="$(curl --silent --show-error --location -o "$RUNNER_TEMP/builds.json" -w '%{http_code}' -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "https://developers.hostinger.com/api/hosting/v1/accounts/${uenc}/websites/${denc}/nodejs/builds?per_page=10" || true)";
            if [ "$code" = 200 ]; then echo "NODE_APP $domain=REGISTERED"; else echo "NODE_APP $domain=NO_NODE_ENDPOINT"; fi
          done < "$RUNNER_TEMP/accounts.tsv"
          echo 'CRYPTOWORLDZ_HOSTINGER_ENV_AUDIT=PASS_READ_ONLY'
      - name: Publish audit pass
        if: success()
        run: bash .github/publish-progress.sh HOSTINGER_ENV_AUDIT PASS
      - name: Publish audit fail
        if: failure()
        run: bash .github/publish-progress.sh HOSTINGER_ENV_AUDIT FAIL
