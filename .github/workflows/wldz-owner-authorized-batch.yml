name: WLDZ Historical Owner Launch Guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify completed owner launch cannot be rebuilt automatically
        run: |
          node --check worldzpad-mainnet/scripts/build-wldz-owner-authorized-batch.mjs
          node - <<'NODE'
          const fs=require('fs');
          const plan=JSON.parse(fs.readFileSync('worldzpad-mainnet/wldz-one-sided-launch.candidate.json','utf8'));
          if(plan.status!=='LIVE_EXECUTED__DO_NOT_REEXECUTE') throw new Error('WLDZ live status missing');
          if(plan.launchCompleted!==true || plan.duplicateExecutionProhibited!==true) throw new Error('duplicate launch guard missing');
          if(plan.executionEnabled!==false) throw new Error('execution flag must remain false');
          if(plan.livePool!=='GCFKk1H5Z8EfxFuAvDEXTHn8b28deUA7HxVRsipjfPiJ') throw new Error('canonical live pool drift');
          console.log('WLDZ_HISTORICAL_OWNER_LAUNCH_GUARD=PASS duplicate_execution=PROHIBITED');
          NODE
