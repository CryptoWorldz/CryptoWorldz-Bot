name: Validate PHENIX Chance Vault
on:
  pull_request:
    paths:
      - "worldzpad-mainnet/phenix/pnex-phenix-chance-vault.v1.json"
      - "worldzpad-mainnet/phenix/check-chance-seats.py"
      - "scripts/validate_pnex_chance_vault.py"
      - ".github/workflows/validate-pnex-chance-vault.yml"
  push:
    branches: [phenix-launch-prep, revive-v1-build]
    paths:
      - "worldzpad-mainnet/phenix/pnex-phenix-chance-vault.v1.json"
      - "worldzpad-mainnet/phenix/check-chance-seats.py"
      - "scripts/validate_pnex_chance_vault.py"
      - ".github/workflows/validate-pnex-chance-vault.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_pnex_chance_vault.py
      - run: python worldzpad-mainnet/phenix/check-chance-seats.py --self-test
