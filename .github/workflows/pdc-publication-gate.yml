name: Purple Diamond Crew publication gate
on:
  push:
    paths:
      - 'purplediamondcrew.com/**'
      - 'donateworldz.com/index.html'
      - 'scripts/validate_pdc_publication.py'
      - '.github/workflows/pdc-publication-gate.yml'
  pull_request:
    paths:
      - 'purplediamondcrew.com/**'
      - 'donateworldz.com/index.html'
      - 'scripts/validate_pdc_publication.py'
      - '.github/workflows/pdc-publication-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pdc-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_pdc_publication.py
