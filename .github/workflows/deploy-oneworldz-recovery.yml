name: Deploy OneWorldz Recovery

on:
  push:
    branches: [main]
    paths:
      - 'deployments/oneworldz-recovery.request'

permissions:
  contents: read

concurrency:
  group: oneworldz-recovery-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Back up, deploy and verify OneWorldz
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: oneworldz-production
      url: https://oneworldz.com
    env:
      FTP_HOST: '145.223.108.40'
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: '21'
      FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || '/' }}
      FTP_ACCOUNT_SCOPE: ${{ vars.FTP_ACCOUNT_SCOPE }}
      DEPLOY_GUARD: ${{ vars.DEPLOY_GUARD }}
      FTP_TLS_VERIFY: 'yes'
      LIVE_URL: https://oneworldz.com
      EXPECTED_SCRIPT: assets/oneworldz.js
      VERIFY_USER_AGENT: Mozilla/5.0 (compatible; OneWorldzDeployment/1.0; +https://oneworldz.com)
    steps:
      - name: Check out approved main commit
        uses: actions/checkout@v4

      - name: Validate immutable deployment approval
        shell: bash
        env:
          APPROVED_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test -f deployments/oneworldz-recovery.request
          test "$(sed -n 's/^confirmation=//p' deployments/oneworldz-recovery.request | tail -n1)" = 'APPROVE TOTAL DEPLOYMENT'
          test "$(sed -n 's/^source_commit=//p' deployments/oneworldz-recovery.request | tail -n1)" = "$APPROVED_BEFORE"

      - name: Lock deployment to OneWorldz only
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ "$FTP_ACCOUNT_SCOPE" == 'DOMAIN_ONLY' ]] || missing+=(FTP_ACCOUNT_SCOPE)
          [[ "$DEPLOY_GUARD" == 'ONEWORLDZ.COM' ]] || missing+=(DEPLOY_GUARD)
          [[ "$FTP_HOST" == '145.223.108.40' ]] || missing+=(FTP_HOST)
          [[ "$FTP_PORT" == '21' ]] || missing+=(FTP_PORT)
          [[ "$FTP_SERVER_DIR" == '/' ]] || missing+=(FTP_SERVER_DIR)
          [[ -n "$FTP_USERNAME" ]] || missing+=(FTP_USERNAME)
          [[ -n "$FTP_PASSWORD" ]] || missing+=(FTP_PASSWORD)
          if (( ${#missing[@]} )); then
            printf '::error::OneWorldz deployment environment does not match the locked target: %s\n' "${missing[*]}"
            exit 1
          fi
          echo "::add-mask::$FTP_USERNAME"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify complete repository and deployment helper
        run: |
          npm ci
          npm run verify
          bash -n tools/worldz-direct-ftp.sh

      - name: Install secure FTP client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp zip

      - name: Confirm encrypted OneWorldz Hostinger target
        shell: bash
        run: |
          set -euo pipefail
          timeout 45 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 1
          set net:timeout 15
          set net:idle 15
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          cd "$FTP_SERVER_DIR"
          pwd
          bye
          LFTP
          echo 'Confirmed encrypted OneWorldz document root.'

      - name: Capture exact rollback snapshot
        shell: bash
        run: |
          set -euo pipefail
          source_root="$GITHUB_WORKSPACE/apps/cryptoworldz-web-core"
          backup="$RUNNER_TEMP/oneworldz-backup"
          command_file="$RUNNER_TEMP/oneworldz-backup-${GITHUB_RUN_ID}.lftp"
          mkdir -p "$backup"

          mapfile -d '' files < <(
            {
              for relative in 404.html _headers live.html .htaccess; do
                [[ -f "$source_root/$relative" ]] && printf '%s\0' "$source_root/$relative"
              done
              for directory in assets config; do
                [[ -d "$source_root/$directory" ]] && find "$source_root/$directory" -type f -print0
              done
              [[ -f "$source_root/index.html" ]] && printf '%s\0' "$source_root/index.html"
            } | sort -z
          )

          {
            echo 'set cmd:fail-exit no'
            echo 'set net:max-retries 1'
            echo 'set net:timeout 20'
            echo 'set net:idle 20'
            echo 'set ftp:ssl-force yes'
            echo 'set ftp:ssl-protect-data yes'
            echo 'set ssl:verify-certificate no'
            printf 'cd "%s"\n' "$FTP_SERVER_DIR"
            for file in "${files[@]}"; do
              relative="${file#"$source_root"/}"
              mkdir -p "$backup/$(dirname "$relative")"
              printf 'get "%s" -o "%s"\n' "$relative" "$backup/$relative"
            done
            echo 'bye'
          } > "$command_file"

          timeout 120 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" < "$command_file" || true
          find "$backup" -type f -size 0 -delete || true
          find "$backup" -mindepth 1 -type d -empty -delete || true
          if ! find "$backup" -type f -print -quit | grep -q .; then
            touch "$backup/.empty-target"
          fi
          cd "$backup"
          zip -qr "$RUNNER_TEMP/oneworldz-backup-${GITHUB_RUN_ID}.zip" .

      - name: Preserve rollback package
        uses: actions/upload-artifact@v4
        with:
          name: oneworldz-predeploy-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/oneworldz-backup-${{ github.run_id }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload approved OneWorldz package
        shell: bash
        env:
          FTP_TRANSFER_TIMEOUT: '300'
          FTP_TLS_VERIFY: 'no'
        run: bash tools/worldz-direct-ftp.sh upload "$GITHUB_WORKSPACE/apps/cryptoworldz-web-core"

      - name: Verify live OneWorldz
        shell: bash
        run: |
          set -euo pipefail
          verified='false'
          for attempt in 1 2 3 4 5 6; do
            cache="release=${GITHUB_SHA}-${GITHUB_RUN_ID}-${attempt}"
            if curl -fsSL -A "$VERIFY_USER_AGENT" -H 'Cache-Control: no-cache' --max-time 20 "$LIVE_URL/?$cache" -o "$RUNNER_TEMP/index.html" \
              && curl -fsSL -A "$VERIFY_USER_AGENT" -H 'Cache-Control: no-cache' --max-time 20 "$LIVE_URL/$EXPECTED_SCRIPT?$cache" -o "$RUNNER_TEMP/expected.js" \
              && grep -Fq './config/worlds.js' "$RUNNER_TEMP/index.html" \
              && test -s "$RUNNER_TEMP/expected.js"; then
              verified='true'
              break
            fi
            sleep 5
          done
          [[ "$verified" == 'true' ]] || { echo '::error::OneWorldz live verification failed.' >&2; exit 1; }
          echo 'OneWorldz live target verified.'

      - name: Restore previous OneWorldz files if deployment fails
        if: failure()
        shell: bash
        env:
          FTP_TRANSFER_TIMEOUT: '180'
          FTP_TLS_VERIFY: 'no'
        run: |
          set -euo pipefail
          source_root="$GITHUB_WORKSPACE/apps/cryptoworldz-web-core"
          backup="$RUNNER_TEMP/oneworldz-backup"
          delete_commands="$RUNNER_TEMP/oneworldz-delete-${GITHUB_RUN_ID}.lftp"

          if [[ -z "$FTP_USERNAME" || -z "$FTP_PASSWORD" || ! -d "$backup" ]]; then
            echo 'No upload-capable backup exists; rollback is not required.' >&2
            exit 0
          fi

          mapfile -d '' files < <(
            {
              for relative in 404.html _headers live.html .htaccess; do
                [[ -f "$source_root/$relative" ]] && printf '%s\0' "$source_root/$relative"
              done
              for directory in assets config; do
                [[ -d "$source_root/$directory" ]] && find "$source_root/$directory" -type f -print0
              done
              [[ -f "$source_root/index.html" ]] && printf '%s\0' "$source_root/index.html"
            } | sort -z
          )

          {
            echo 'set cmd:fail-exit no'
            echo 'set net:max-retries 1'
            echo 'set net:timeout 20'
            echo 'set net:idle 20'
            echo 'set ftp:ssl-force yes'
            echo 'set ftp:ssl-protect-data yes'
            echo 'set ssl:verify-certificate no'
            printf 'cd "%s"\n' "$FTP_SERVER_DIR"
            for file in "${files[@]}"; do
              relative="${file#"$source_root"/}"
              printf 'rm "%s"\n' "$relative"
            done
            echo 'bye'
          } > "$delete_commands"

          timeout 120 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" < "$delete_commands" || true
          rm -f "$backup/.empty-target"
          if find "$backup" -type f -print -quit | grep -q .; then
            bash tools/worldz-direct-ftp.sh restore "$backup"
            echo 'Previous OneWorldz files restored after failed deployment.' >&2
          else
            echo 'No pre-existing package files existed; uploaded package files were removed.' >&2
          fi

      - name: Publish deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '## OneWorldz Production Deployment'
            echo
            echo '- Target: oneworldz.com'
            echo '- Environment: oneworldz-production'
            echo '- Host: locked Hostinger FTP endpoint'
            echo '- Transfer: encrypted FTPS on port 21'
            echo '- Rollback snapshot: captured before upload'
            echo "- Source commit: $GITHUB_SHA"
            echo '- Zed Node service: untouched'
            echo '- Auto service: untouched'
          } >> "$GITHUB_STEP_SUMMARY"
