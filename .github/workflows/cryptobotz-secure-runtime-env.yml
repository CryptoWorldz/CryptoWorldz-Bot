name: CryptoBotz Secure Runtime Environment

on:
  push:
    branches: [main]
    paths:
      - 'deployments/cryptobotz-secure-runtime-env.request'

permissions:
  contents: read

concurrency:
  group: cryptobotz-secure-runtime-env
  cancel-in-progress: false

env:
  TARGET_DOMAIN: cryptobotz.cryptoworldz.xyz
  HOSTINGER_USERNAME: u643166328
  REMOTE_ROOT: domains/cryptobotz.cryptoworldz.xyz/public_html

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate protected deployment request
        shell: bash
        run: |
          set -euo pipefail
          request='deployments/cryptobotz-secure-runtime-env.request'
          test "$(sed -n 's/^target=//p' "$request" | tail -n1)" = "$TARGET_DOMAIN"
          test "$(sed -n 's/^authority=//p' "$request" | tail -n1)" = 'JayJayTeamDev FULL ACCESS PERMISSION & AUTHORITY'
          test "$(sed -n 's/^mode=//p' "$request" | tail -n1)" = 'secure-runtime-env'
          test -n "$OPENAI_API_KEY"
          test -n "$HOSTINGER_API_TOKEN"
          test -n "$FTP_HOST"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          echo "::add-mask::$OPENAI_API_KEY"
          echo "::add-mask::$HOSTINGER_API_TOKEN"
          echo "::add-mask::$FTP_HOST"
          echo "::add-mask::$FTP_USERNAME"
          echo "::add-mask::$FTP_PASSWORD"

      - name: Install FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Wait for this Git push build to settle before touching runtime env
        shell: bash
        run: |
          set -euo pipefail
          commit_time="$(jq -r '.head_commit.timestamp // empty' "$GITHUB_EVENT_PATH")"
          test -n "$commit_time"
          url="https://developers.hostinger.com/api/hosting/v1/accounts/$HOSTINGER_USERNAME/websites/$TARGET_DOMAIN/nodejs/builds"
          settled=0
          sleep 20
          for attempt in $(seq 1 180); do
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' \
              "$url" -o "$RUNNER_TEMP/builds.json"
            if python3 - "$commit_time" "$RUNNER_TEMP/builds.json" <<'PY'
          import datetime as dt, json, sys
          commit=dt.datetime.fromisoformat(sys.argv[1].replace('Z','+00:00'))-dt.timedelta(seconds=8)
          payload=json.load(open(sys.argv[2]))
          items=payload if isinstance(payload,list) else payload.get('data',payload.get('items',[])) if isinstance(payload,dict) else []
          recent=[]
          for item in items:
              if not isinstance(item,dict): continue
              raw=item.get('created_at') or item.get('createdAt')
              if not raw: continue
              try: created=dt.datetime.fromisoformat(str(raw).replace('Z','+00:00'))
              except Exception: continue
              if created >= commit: recent.append(item)
          if not recent: raise SystemExit(2)
          active=[x for x in recent if str(x.get('state') or x.get('status') or '').lower() in {'pending','running','queued','in_progress'}]
          raise SystemExit(3 if active else 0)
          PY
            then
              settled=1
              break
            fi
            echo "Waiting for Hostinger Git build settlement $attempt/180"
            sleep 5
          done
          test "$settled" = 1

      - name: Preserve existing runtime env and verify exact app root
        shell: bash
        run: |
          set -euo pipefail
          host="$(printf '%s' "$FTP_HOST" | sed -e 's#^ftp[s]*://##' -e 's#/.*$##')"
          if [[ "$host" != *:*:* && "$host" == *:* ]]; then host="${host%%:*}"; fi
          printf '%s' "$host" > "$RUNNER_TEMP/ftp-host"
          cat > "$RUNNER_TEMP/read-runtime.lftp" <<EOF
          set cmd:fail-exit false
          set net:max-retries 3
          set net:timeout 30
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          cd $REMOTE_ROOT
          get package.json -o $RUNNER_TEMP/live-package.json
          get .env -o $RUNNER_TEMP/original.env
          bye
          EOF
          timeout 300 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/read-runtime.lftp" "$host" || true
          test -s "$RUNNER_TEMP/live-package.json"
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/live-package.json','utf8'));
          if(p.name!=='cryptoworldz-bot'||p.scripts?.start!=='node index.js') throw new Error('wrong_live_runtime_root');
          NODE
          test -f "$RUNNER_TEMP/original.env" || : > "$RUNNER_TEMP/original.env"

      - name: Merge protected secrets without exposing or replacing existing runtime values
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const file=process.env.RUNNER_TEMP+'/original.env';
          const out=process.env.RUNNER_TEMP+'/secure.env';
          const required={
            OPENAI_API_KEY:String(process.env.OPENAI_API_KEY||'').trim(),
            HOSTINGER_API_TOKEN:String(process.env.HOSTINGER_API_TOKEN||'').trim(),
            ONEWORLDZ_OPENAI_MODEL:'gpt-5.6'
          };
          if(!required.OPENAI_API_KEY||!required.HOSTINGER_API_TOKEN) throw new Error('protected_secret_missing');
          const existing=fs.readFileSync(file,'utf8').split(/\r?\n/);
          const keys=new Set(Object.keys(required));
          const kept=existing.filter(line=>{
            const m=line.match(/^\s*([A-Za-z_][A-Za-z0-9_]*)\s*=/);
            return !m||!keys.has(m[1]);
          });
          while(kept.length && kept[kept.length-1]==='') kept.pop();
          kept.push('', '# OneWorldz protected runtime values — server only');
          for(const [key,value] of Object.entries(required)) kept.push(`${key}=${value}`);
          kept.push('');
          fs.writeFileSync(out,kept.join('\n'),{mode:0o600});
          NODE

      - name: Upload protected env to the real Git-deployed runtime
        shell: bash
        run: |
          set -euo pipefail
          host="$(cat "$RUNNER_TEMP/ftp-host")"
          cat > "$RUNNER_TEMP/write-runtime.lftp" <<EOF
          set cmd:fail-exit true
          set net:max-retries 3
          set net:timeout 30
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          cd $REMOTE_ROOT
          put $RUNNER_TEMP/secure.env -o .env
          bye
          EOF
          timeout 300 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/write-runtime.lftp" "$host"

      - name: Restart Node.js through official Hostinger API
        shell: bash
        run: |
          set -euo pipefail
          url="https://developers.hostinger.com/api/hosting/v1/accounts/$HOSTINGER_USERNAME/websites/$TARGET_DOMAIN/nodejs/server/restart"
          code="$(curl --silent --show-error --location --request POST \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
            -H 'Accept: application/json' -H 'Content-Type: application/json' \
            -o "$RUNNER_TEMP/restart.json" -w '%{http_code}' "$url")"
          echo "Hostinger restart HTTP $code"
          case "$code" in 200|201|202|204) ;; *) exit 1;; esac

      - name: Prove OneWorldz GPT Hostinger auth and community support live
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 36); do
            sleep 5
            if curl --fail --silent --show-error --max-time 20 "https://$TARGET_DOMAIN/api/hub-central/status" -o "$RUNNER_TEMP/hub.json" \
              && curl --fail --silent --show-error --max-time 20 "https://$TARGET_DOMAIN/api/oneworldz-gpt/status" -o "$RUNNER_TEMP/gpt.json" \
              && curl --fail --silent --show-error --max-time 20 -H 'Origin: https://oneworldz.com' "https://$TARGET_DOMAIN/api/oneworldz-community-support" -o "$RUNNER_TEMP/community.json" \
              && node - <<'NODE'
          const fs=require('fs'), root=process.env.RUNNER_TEMP;
          const hub=JSON.parse(fs.readFileSync(root+'/hub.json'));
          const gpt=JSON.parse(fs.readFileSync(root+'/gpt.json'));
          const community=JSON.parse(fs.readFileSync(root+'/community.json'));
          if(!hub.ok||hub.hostinger_write_control!=='configured'||hub.oneworldz_gpt!=='configured') process.exit(1);
          if(!gpt.ok||gpt.openai_api_configured!==true||gpt.payments_in_chat!==false) process.exit(1);
          if(!community.ok||community.count!==35||(community.profiles||[]).length!==35) process.exit(1);
          NODE
            then
              success=1
              break
            fi
            echo "Protected runtime convergence $attempt/36"
          done
          test "$success" = 1
          curl --fail --silent --show-error --max-time 60 \
            -H 'Origin: https://oneworldz.com' -H 'Content-Type: application/json' \
            -d '{"page":"deployment-proof","message":"Reply with one short sentence confirming the OneWorldz guide is online."}' \
            "https://$TARGET_DOMAIN/api/oneworldz-gpt/chat" -o "$RUNNER_TEMP/gpt-live.json"
          node - <<'NODE'
          const j=require(process.env.RUNNER_TEMP+'/gpt-live.json');
          if(!j.ok||j.powered_by!=='OpenAI'||!String(j.text||'').trim()) process.exit(1);
          NODE

      - name: Preserve non-secret proof only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptobotz-secure-runtime-proof-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/hub.json
            ${{ runner.temp }}/gpt.json
            ${{ runner.temp }}/community.json
            ${{ runner.temp }}/gpt-live.json
          if-no-files-found: ignore
          retention-days: 7
