name: Hostinger Managed HBuilds Config Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hostinger-hbuilds-config-audit.yml"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/publish-progress.sh HOSTINGER_HBUILDS_CONFIG_AUDIT STARTED
      - run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq lftp
      - name: Inspect managed config key names only
        shell: bash
        run: |
          set -euo pipefail
          for v in "$FTP_HOST" "$FTP_USERNAME" "$FTP_PASSWORD"; do [ -z "$v" ] || echo "::add-mask::$v"; done
          raw_host="$(printf '%s' "$FTP_HOST" | sed -e 's#^ftp://##' -e 's#^ftps://##' -e 's#/.*$##')"
          if [[ "$raw_host" != *:*:* && "$raw_host" == *:* ]]; then raw_host="${raw_host%%:*}"; fi
          out="$RUNNER_TEMP/hbuilds-config"; mkdir -p "$out"
          cat > "$RUNNER_TEMP/config-audit.lftp" <<EOF
set cmd:fail-exit false
set net:max-retries 2
set net:timeout 25
set ftp:ssl-force true
set ftp:ssl-protect-data true
set ssl:verify-certificate true
set ssl:check-hostname false
cls -la /domains/cryptobotz.cryptoworldz.xyz/hbuilds/config
cls -la /domains/cryptobotz.cryptoworldz.xyz/hbuilds/current
mirror --verbose /domains/cryptobotz.cryptoworldz.xyz/hbuilds/config $out
bye
EOF
          timeout 240 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/config-audit.lftp" "$raw_host" || true
          ROOT="$out" node - <<'NODE'
const fs=require('fs'),path=require('path');
const root=process.env.ROOT;
const wanted=['BOT_TOKEN','TELEGRAM_TOKEN','SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY','SUPABASE_ANON_KEY','OPENAI_API_KEY','HOSTINGER_API_TOKEN','ADMIN_API_TOKEN','HUB_API_SECRET','NODE_ENV','PORT'];
function walk(p){for(const name of fs.existsSync(p)?fs.readdirSync(p):[]){const full=path.join(p,name);const st=fs.statSync(full);if(st.isDirectory())walk(full);else inspect(full)}}
function inspect(full){const rel=path.relative(root,full);const size=fs.statSync(full).size;console.log(`HBUILDS_CONFIG_FILE ${rel} size=${size}`);if(size>1024*1024)return;let raw='';try{raw=fs.readFileSync(full,'utf8')}catch{return}const upper=raw.toUpperCase();for(const k of wanted)console.log(`HBUILDS_CONFIG_MENTIONS ${rel} ${k}=${upper.includes(k)?'YES':'NO'}`);let keys=[];try{const obj=JSON.parse(raw);if(obj&&typeof obj==='object'&&!Array.isArray(obj))keys=Object.keys(obj)}catch{}if(!keys.length){for(const line0 of raw.split(/\r?\n/)){const line=line0.trim();if(!line||line.startsWith('#'))continue;let m=line.match(/^([A-Za-z_][A-Za-z0-9_]*)\s*=/);if(m)keys.push(m[1]);else{m=line.match(/^([A-Za-z_][A-Za-z0-9_.-]*)\s*:/);if(m)keys.push(m[1])}}}keys=[...new Set(keys)].sort();if(keys.length)console.log(`HBUILDS_CONFIG_KEYS ${rel}=${keys.join(',')}`)}
walk(root);
NODE
          echo 'HOSTINGER_HBUILDS_CONFIG_AUDIT=PASS_READ_ONLY'
      - if: success()
        run: bash .github/publish-progress.sh HOSTINGER_HBUILDS_CONFIG_AUDIT PASS
      - if: failure()
        run: bash .github/publish-progress.sh HOSTINGER_HBUILDS_CONFIG_AUDIT FAIL
