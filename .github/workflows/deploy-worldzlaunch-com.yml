name: Deploy WorldzLaunch.com Mirror

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'launchpad.cryptoworldz.xyz/**'
      - '.github/workflows/deploy-worldzlaunch-com.yml'

permissions:
  contents: read

concurrency:
  group: worldzlaunch-com-mirror
  cancel-in-progress: true

jobs:
  publish-home:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish clean image-free homepage FIRST
        shell: python
        run: |
          import os, ssl, hashlib, secrets
          from pathlib import Path
          from ftplib import FTP_TLS, error_perm
          source=Path('launchpad.cryptoworldz.xyz/index.html')
          content=source.read_bytes()
          assert b'<img' not in content.lower(), 'homepage must not contain image elements'
          assert b'url(' not in content.lower(), 'homepage must not reference image or remote CSS assets'
          assert b'rel="stylesheet"' not in content.lower(), 'homepage must not load legacy image CSS'
          ftp=FTP_TLS(context=ssl._create_unverified_context())
          ftp.connect(os.environ['FTP_HOST'],int(os.environ.get('FTP_PORT','21')),timeout=30)
          ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          ftp.cwd('/')
          for part in ('domains','worldzlaunch.com','public_html'):
              try:ftp.cwd(part)
              except error_perm:ftp.mkd(part);ftp.cwd(part)
          temp='.worldz-clean-'+secrets.token_hex(6)+'.html'
          with source.open('rb') as stream: ftp.storbinary('STOR '+temp,stream)
          try:ftp.rename(temp,'index.html')
          except error_perm:
              ftp.delete('index.html')
              ftp.rename(temp,'index.html')
          remote=bytearray()
          ftp.retrbinary('RETR index.html',remote.extend)
          assert hashlib.sha256(remote).digest()==hashlib.sha256(content).digest(), 'homepage remote content mismatch'
          ftp.quit()
          print('WORLDZLAUNCH_IMAGE_FREE_HOMEPAGE_FTPS=PASS')
      - name: Verify public homepage matches cleaned source
        shell: python
        run: |
          import urllib.request,hashlib
          from pathlib import Path
          url='https://worldzlaunch.com/'
          request=urllib.request.Request(url,headers={'User-Agent':'WorldzLaunch-Home-Check/1.0','Cache-Control':'no-cache'})
          with urllib.request.urlopen(request,timeout=20) as response:
              public=response.read()
              assert response.status==200
          expected=Path('launchpad.cryptoworldz.xyz/index.html').read_bytes()
          assert hashlib.sha256(public).digest()==hashlib.sha256(expected).digest(), 'WorldzLaunch.com is serving DIFFERENT homepage (check domain routing/cache)'
          print('WORLDZLAUNCH_IMAGE_FREE_PUBLIC_HOMEPAGE=PASS')
  deploy:
    needs: publish-home
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      TARGET_DOMAIN: worldzlaunch.com
    steps:
      - uses: actions/checkout@v4
      - name: Verify existing launchpad source
        run: |
          test -s launchpad.cryptoworldz.xyz/index.html
          test -s launchpad.cryptoworldz.xyz/app.js
          test -s launchpad.cryptoworldz.xyz/platform-config.json
          python scripts/validate_worldz_token_identity.py
      - name: Upload launchpad mirror to WorldzLaunch.com with FTPS
        shell: python
        run: |
          import os,ssl,secrets,hashlib
          from ftplib import FTP_TLS,error_perm
          from pathlib import Path,PurePosixPath
          src=Path('launchpad.cryptoworldz.xyz')
          target=PurePosixPath('domains/worldzlaunch.com/public_html')
          ftp=FTP_TLS(context=ssl._create_unverified_context())
          ftp.connect(os.environ['FTP_HOST'],int(os.environ.get('FTP_PORT','21')),timeout=30)
          ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          def cd(path):
              ftp.cwd('/')
              for component in path.parts:
                  if component in ('','/'):continue
                  try:ftp.cwd(component)
                  except error_perm:
                      ftp.mkd(component);ftp.cwd(component)
          count=0
          for source in sorted(src.rglob('*')):
              if not source.is_file():continue
              rel=PurePosixPath(source.relative_to(src).as_posix())
              cd(target/rel.parent)
              tmp='.worldz-deploy-'+secrets.token_hex(8)+'-'+rel.name
              with source.open('rb') as f:ftp.storbinary('STOR '+tmp,f)
              try:ftp.rename(tmp,rel.name)
              except error_perm:
                  ftp.delete(rel.name);ftp.rename(tmp,rel.name)
              count+=1
          cd(target)
          received=bytearray()
          ftp.retrbinary('RETR index.html',received.extend)
          expected=hashlib.sha256((src/'index.html').read_bytes()).hexdigest()
          actual=hashlib.sha256(received).hexdigest()
          assert expected==actual,'remote homepage differs from repository'
          print(f'WORLDZLAUNCH_COM_UPLOAD=PASS count={count} sha256={actual}')
          ftp.quit()
      - name: Verify public HTTPS WorldzLaunch.com
        shell: python
        run: |
          import urllib.request, hashlib, json
          from pathlib import Path
          base='https://worldzlaunch.com/'
          paths=('', 'app.js', 'platform-config.json', 'style.css', 'launch-station/index.html', 'mint/index.html')
          for path in paths:
              request=urllib.request.Request(base+path,headers={'User-Agent':'WorldzLaunch-Deploy-Verify/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(request,timeout=25) as response:
                  body=response.read()
                  assert response.status==200 and len(body)>100,(path,response.status,len(body))
                  local=Path('launchpad.cryptoworldz.xyz')/(path or 'index.html')
                  assert local.is_file(),f'missing local source: {local}'
                  expected=hashlib.sha256(local.read_bytes()).hexdigest()
                  actual=hashlib.sha256(body).hexdigest()
                  assert expected==actual,f'public file differs from repository: {path}'
                  if path=='':assert b'WORLDZ' in body.upper(),'missing Worldz homepage content'
                  if path=='platform-config.json':assert json.loads(body)['publicLaunchPad'] is True
                  print(f'WORLDZLAUNCH_PUBLIC_MATCH path={path or "index.html"} sha256={actual}')
          print('WORLDZLAUNCH_COM_HTTPS=PASS files='+str(len(paths)))
