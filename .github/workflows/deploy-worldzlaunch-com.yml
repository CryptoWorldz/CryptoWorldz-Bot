name: Deploy WorldzLaunch.com (gated)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worldzlaunch.com/**'
      - '.github/workflows/deploy-worldzlaunch-com.yml'
permissions:
  contents: read
concurrency:
  group: worldzlaunch-com-production
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-worldzlaunch-studio.cjs
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment: cryptoworldz-production
    timeout-minutes: 25
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload new WorldzLaunch.com site and verify assets
        shell: python
        run: |
          import os, ssl, hashlib, secrets, urllib.request
          from ftplib import FTP_TLS, error_perm
          from pathlib import Path, PurePosixPath
          source=Path('worldzlaunch.com')
          required=['index.html','fee-distribution-studio/index.html','assets/worldz-incorporated-profile.jpg']
          for item in required:
              assert (source/item).is_file(), 'missing '+item
          assert all(os.environ.get(x) for x in ('FTP_HOST','FTP_USERNAME','FTP_PASSWORD')), 'missing FTPS credentials'
          ftp=FTP_TLS(context=ssl.create_default_context())
          ftp.connect(os.environ['FTP_HOST'],int(os.environ.get('FTP_PORT','21')),timeout=30)
          ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          ftp.prot_p(); ftp.set_pasv(True)
          root=PurePosixPath('domains/worldzlaunch.com/public_html')
          def cd(parts):
              ftp.cwd('/')
              for part in parts.parts:
                  if part in ('','/'):continue
                  try:ftp.cwd(part)
                  except error_perm:ftp.mkd(part);ftp.cwd(part)
          for rel in sorted(required):
              local=source/rel
              cd(root/PurePosixPath(rel).parent)
              temp='.worldz-stage-'+secrets.token_hex(8)
              with local.open('rb') as stream:ftp.storbinary('STOR '+temp,stream)
              try:ftp.rename(temp,local.name)
              except error_perm:
                  ftp.delete(local.name);ftp.rename(temp,local.name)
              received=bytearray()
              ftp.retrbinary('RETR '+local.name,received.extend)
              assert hashlib.sha256(received).digest()==hashlib.sha256(local.read_bytes()).digest(), 'FTPS mismatch '+rel
          ftp.quit()
          for rel in required:
              url='https://worldzlaunch.com/'+rel
              request=urllib.request.Request(url,headers={'User-Agent':'WorldzLaunch-Release-Check/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(request,timeout=25) as response:
                  assert response.status==200, url
                  live=response.read()
              assert hashlib.sha256(live).digest()==hashlib.sha256((source/rel).read_bytes()).digest(), 'live mismatch '+url
          print('WORLDZLAUNCH_NEW_SITE_FTPS_AND_HTTPS_VERIFIED=PASS')
