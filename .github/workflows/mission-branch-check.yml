name: Mission Branch Check

on:
  push:
    branches: [build/mission-worldz-20260919]
    paths:
      - "tools/**"
      - ".github/workflows/mission-branch-check.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Compile changed Python
        run: python3 -m py_compile tools/apply_mission_worldz.py tools/prune_public_bloat.py tools/render_all_pages.py tools/full_site_audit_core.py
      - name: Build ecosystem baseline
        run: python3 tools/build_ecosystem.py
      - name: Apply visual architecture
        run: python3 tools/apply_visual_fixes.py
      - name: Apply direct support routes
        run: python3 tools/apply_facebook_support.py
      - name: Remove retired support content
        run: python3 tools/remove_retired_uganda_support.py
      - name: Apply mobile safety
        run: python3 tools/apply_mobile_safety.py
      - name: Apply legacy vision layer
        run: python3 tools/apply_jayjay_vision_57.py
      - name: Build mission departments
        run: python3 tools/apply_mission_worldz.py
      - name: Re-apply mobile safety
        run: python3 tools/apply_mobile_safety.py
      - name: Repair writing
        run: python3 tools/repair_stage_1_writing.py
      - name: Repair images
        run: python3 tools/repair_stage_2_images.py
      - name: Repair structure
        run: python3 tools/repair_stage_3_other.py
      - name: Install image override
        run: python3 tools/apply_global_image_overrides.py
      - name: Prune to mission public set
        run: python3 tools/prune_public_bloat.py
      - name: Static audit
        run: python3 tools/full_site_audit.py --static
