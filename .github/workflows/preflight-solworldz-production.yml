name: Preflight SolWorldz Production Origin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preflight-solworldz-production.yml'

permissions:
  contents: read

env:
  EXPECTED_GUARD: SOLWORLDZ.XYZ

jobs:
  preflight:
    name: Read-only FTPS and public-origin proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: solworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT }}
      FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
      FTP_ACCOUNT_SCOPE: ${{ vars.FTP_ACCOUNT_SCOPE }}
      DEPLOY_GUARD: ${{ vars.DEPLOY_GUARD }}
    steps:
      - name: Validate domain-only environment gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FTP_HOST:-}" || { echo '::error::FTP_HOST secret is missing'; exit 1; }
          test -n "${FTP_USERNAME:-}" || { echo '::error::FTP_USERNAME secret is missing'; exit 1; }
          test -n "${FTP_PASSWORD:-}" || { echo '::error::FTP_PASSWORD secret is missing'; exit 1; }
          [[ "${FTP_PORT:-21}" == '21' ]] || { echo '::error::FTP_PORT must be 21'; exit 1; }
          [[ "${FTP_SERVER_DIR:-/}" == '/' ]] || { echo '::error::FTP_SERVER_DIR must be / for the domain-scoped account'; exit 1; }
          [[ "${FTP_ACCOUNT_SCOPE:-}" == 'DOMAIN_ONLY' ]] || { echo '::error::FTP_ACCOUNT_SCOPE must be DOMAIN_ONLY'; exit 1; }
          [[ "${DEPLOY_GUARD:-}" == "$EXPECTED_GUARD" ]] || { echo '::error::DEPLOY_GUARD is missing or not SOLWORLDZ.XYZ'; exit 1; }
          echo 'Environment safety gate passed.'

      - name: Install FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Prove Hostinger TLS identity before credentials are used
        shell: bash
        run: |
          set -euo pipefail
          ftp_ip="$(getent ahostsv4 "$FTP_HOST" | awk 'NR==1{print $1}')"
          test -n "$ftp_ip" || { echo '::error::FTP host does not resolve to IPv4'; exit 1; }
          certs="$RUNNER_TEMP/ftp-certs.txt"
          openssl s_client -starttls ftp -connect "$ftp_ip:${FTP_PORT:-21}" -verify_return_error -CAfile /etc/ssl/certs/ca-certificates.crt -showcerts </dev/null >"$certs" 2>/dev/null
          awk '/-----BEGIN CERTIFICATE-----/{p=1} p{print} /-----END CERTIFICATE-----/{exit}' "$certs" > "$RUNNER_TEMP/ftp-leaf.pem"
          test -s "$RUNNER_TEMP/ftp-leaf.pem" || { echo '::error::Unable to read FTPS leaf certificate'; exit 1; }
          openssl x509 -in "$RUNNER_TEMP/ftp-leaf.pem" -noout -ext subjectAltName | grep -Fq 'DNS:*.hstgr.io' || {
            echo '::error::CA-valid certificate is not the expected Hostinger hstgr.io wildcard identity';
            exit 1;
          }
          fingerprint="$(openssl x509 -in "$RUNNER_TEMP/ftp-leaf.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          test -n "$fingerprint"
          echo "FTP_CERT_SHA256=$fingerprint" >> "$GITHUB_ENV"
          echo 'CA-verified Hostinger FTPS identity established without sending credentials.'

      - name: Prove FTPS login and read current root
        shell: bash
        run: |
          set -euo pipefail
          export LFTP_PASSWORD="$FTP_PASSWORD"
          lftp -u "$FTP_USERNAME,$LFTP_PASSWORD" -p "${FTP_PORT:-21}" "$FTP_HOST" <<EOF
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          set net:max-retries 1
          set net:timeout 20
          cd ${FTP_SERVER_DIR:-/}
          cls -1
          get index.html -o $RUNNER_TEMP/remote-index.html
          bye
          EOF
          test -s "$RUNNER_TEMP/remote-index.html" || { echo '::error::No readable index.html at the domain-scoped FTP root'; exit 1; }
          sha256sum "$RUNNER_TEMP/remote-index.html" | sed 's#  .*#  remote-index.html#'

      - name: Re-prove certificate identity after login
        shell: bash
        run: |
          set -euo pipefail
          ftp_ip="$(getent ahostsv4 "$FTP_HOST" | awk 'NR==1{print $1}')"
          openssl s_client -starttls ftp -connect "$ftp_ip:${FTP_PORT:-21}" -verify_return_error -CAfile /etc/ssl/certs/ca-certificates.crt -showcerts </dev/null > "$RUNNER_TEMP/ftp-certs-after.txt" 2>/dev/null
          awk '/-----BEGIN CERTIFICATE-----/{p=1} p{print} /-----END CERTIFICATE-----/{exit}' "$RUNNER_TEMP/ftp-certs-after.txt" > "$RUNNER_TEMP/ftp-leaf-after.pem"
          after="$(openssl x509 -in "$RUNNER_TEMP/ftp-leaf-after.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          [[ "$after" == "$FTP_CERT_SHA256" ]] || { echo '::error::FTPS certificate changed during preflight'; exit 1; }
          echo 'FTPS certificate remained stable across the authenticated read.'

      - name: Prove public SolWorldz serves the same origin
        shell: bash
        run: |
          set -euo pipefail
          cache="originproof=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          curl -fsSL --compressed -H 'Cache-Control: no-cache' "https://solworldz.xyz/?$cache" -o "$RUNNER_TEMP/public-index.html"
          test -s "$RUNNER_TEMP/public-index.html"
          remote_sha="$(sha256sum "$RUNNER_TEMP/remote-index.html" | awk '{print $1}')"
          public_sha="$(sha256sum "$RUNNER_TEMP/public-index.html" | awk '{print $1}')"
          echo "REMOTE_SHA=$remote_sha"
          echo "PUBLIC_SHA=$public_sha"
          [[ "$remote_sha" == "$public_sha" ]] || {
            echo '::error::Public SolWorldz does not match the authenticated domain-scoped FTPS root. Deployment is blocked.'
            exit 1
          }
          echo 'Public HTTPS and authenticated FTPS root are the same origin.'

      - name: Publish preflight summary
        if: always()
        run: |
          {
            echo '## SolWorldz Production Origin Preflight'
            echo '- Read-only: no files uploaded, deleted or changed'
            echo '- Environment guard required: SOLWORLDZ.XYZ'
            echo '- Domain-only FTP scope required'
            echo '- FTP endpoint is stored as a raw Hostinger endpoint, so login is permitted only after independent CA validation proves the server presents the expected *.hstgr.io certificate'
            echo '- ssl:verify-certificate remains enabled; only hostname matching is bypassed for the raw endpoint after the independent Hostinger certificate gate'
            echo '- Certificate fingerprint must remain unchanged across the authenticated read'
            echo '- Public HTTPS index must byte-match the authenticated FTP-root index'
          } >> "$GITHUB_STEP_SUMMARY"
