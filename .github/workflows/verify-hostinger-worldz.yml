name: Verify Hostinger API and Worldz Domains
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-hostinger-worldz.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: cryptoworldz-production
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - name: Read-only Hostinger API domain inventory
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${HOSTINGER_API_TOKEN:-}" ]]; then echo "::error::HOSTINGER_API_TOKEN missing"; exit 1; fi
          echo "::add-mask::$HOSTINGER_API_TOKEN"
          python3 - <<'PY'
          import os,json,urllib.request,urllib.error
          base='https://developers.hostinger.com/api/hosting/v1/websites'
          token=os.environ['HOSTINGER_API_TOKEN']
          domains=set()
          for page in range(1,11):
              url=f'{base}?per_page=100&page={page}'
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+token,'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=20) as response: data=json.load(response)
              except urllib.error.HTTPError as e:
                  print(f'HOSTINGER_API_HTTP_STATUS={e.code}')
                  raise SystemExit(1)
              rows=data.get('data',[]) if isinstance(data,dict) else data
              if not isinstance(rows,list): print('HOSTINGER_API_UNEXPECTED_RESPONSE');raise SystemExit(1)
              for row in rows:
                  if isinstance(row,dict) and row.get('domain'): domains.add(str(row['domain']).lower())
              if len(rows)<100: break
          print('HOSTINGER_API_AUTH=PASS')
          print('HOSTINGER_WEBSITE_COUNT='+str(len(domains)))
          for domain in ['worldzhq.com','worldz.live','donateworldz.com','cryptoworldz.xyz','purplediamondcrew.com']:
              print('HOSTINGER_DOMAIN_'+domain.upper().replace('.','_')+'='+('FOUND' if domain in domains else 'NOT_LISTED'))
          print('HOSTINGER_DOMAINS='+','.join(sorted(domains)))
          PY
