name: WLDZ Historical Mainnet Launch Guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify canonical WLDZ is live and duplicate launch is disabled
        run: |
          node worldzpad-mainnet/scripts/preflight.mjs
          node - <<'NODE'
          const fs=require('fs');
          const plan=JSON.parse(fs.readFileSync('worldzpad-mainnet/wldz-one-sided-launch.candidate.json','utf8'));
          if(plan.status!=='LIVE_EXECUTED__DO_NOT_REEXECUTE') throw new Error('expected completed WLDZ state');
          if(plan.executionEnabled!==false) throw new Error('execution must remain fail-closed');
          if(plan.duplicateExecutionProhibited!==true) throw new Error('duplicate execution protection missing');
          console.log('WLDZ_HISTORICAL_MAINNET_GUARD=PASS');
          NODE
