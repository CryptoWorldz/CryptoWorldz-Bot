name: WLDZ Mainnet Launch Preflight

on:
  workflow_dispatch:
  push:
    paths:
      - "worldzpad-mainnet/launch-builder/**"
      - "worldzpad-mainnet/wldz-one-sided-launch.candidate.json"
      - ".github/workflows/wldz-launch-preflight.yml"
  pull_request:
    paths:
      - "worldzpad-mainnet/launch-builder/**"
      - "worldzpad-mainnet/wldz-one-sided-launch.candidate.json"
      - ".github/workflows/wldz-launch-preflight.yml"

permissions:
  contents: read

concurrency:
  group: wldz-mainnet-launch-preflight
  cancel-in-progress: true

jobs:
  build-and-simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worldzpad-mainnet/launch-builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned launch SDKs
        run: npm install --no-audit --no-fund
      - name: Build and simulate canonical WLDZ launch
        env:
          SQUADS_CREATOR: Fap54GTCo4ZopkwmHtbSUJZTsjTybftJfN9sPG3MHp4u
        run: npm run preflight
      - name: Upload launch proof (non-blocking)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: wldz-mainnet-launch-preflight
          path: worldzpad-mainnet/artifacts/wldz-launch-preflight.json
          if-no-files-found: error
          retention-days: 7
