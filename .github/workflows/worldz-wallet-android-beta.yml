name: Worldz Wallet Android Beta APK
on:
  pull_request:
    paths:
      - 'apps/worldz-wallet-android/**'
      - '.github/workflows/worldz-wallet-android-beta.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check SDK root
        run: test -n "$ANDROID_SDK_ROOT"
      - name: Smoke
        run: echo "All build prerequisites loaded"
