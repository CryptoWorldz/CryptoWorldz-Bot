name: Worldz Wallet Android Beta APK
on:
  pull_request:
    paths:
      - 'apps/worldz-wallet-android/**'
      - '.github/workflows/worldz-wallet-android-beta.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 36
        run: |
          test -n "$ANDROID_SDK_ROOT"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Install verified Gradle 8.13 without setup-gradle action
        run: |
          curl --fail --location --silent --show-error --retry 3 \
            https://services.gradle.org/distributions/gradle-8.13-bin.zip \
            --output "$RUNNER_TEMP/gradle-8.13-bin.zip"
          echo "20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  $RUNNER_TEMP/gradle-8.13-bin.zip" | sha256sum --check --
          unzip -q "$RUNNER_TEMP/gradle-8.13-bin.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Test native public-address format checks
        run: |
          mkdir -p "$RUNNER_TEMP/worldz-wallet-validator-tests"
          javac -d "$RUNNER_TEMP/worldz-wallet-validator-tests" \
            apps/worldz-wallet-android/app/src/main/java/xyz/cryptoworldz/walletbeta/PublicAddressValidator.java \
            apps/worldz-wallet-android/tests/AddressValidationSmoke.java
          java -cp "$RUNNER_TEMP/worldz-wallet-validator-tests" AddressValidationSmoke
      - name: Compile debug APK
        working-directory: apps/worldz-wallet-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Record APK SHA256
        run: |
          cd apps/worldz-wallet-android/app/build/outputs/apk/debug
          sha256sum app-debug.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: worldz-wallet-beta-debug-apk
          path: |
            apps/worldz-wallet-android/app/build/outputs/apk/debug/app-debug.apk
            apps/worldz-wallet-android/app/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
