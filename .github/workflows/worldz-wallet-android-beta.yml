name: Worldz Wallet Android Beta APK
on:
  workflow_dispatch:
  push:
    branches: [feat/worldz-wallet-android-beta-apk]
    paths: ['apps/worldz-wallet-android/**', '.github/workflows/worldz-wallet-android-beta.yml']
  pull_request:
    paths: ['apps/worldz-wallet-android/**', '.github/workflows/worldz-wallet-android-beta.yml']
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/worldz-wallet-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Record checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: worldz-wallet-readonly-beta-debug-apk
          path: |
            apps/worldz-wallet-android/app/build/outputs/apk/debug/app-debug.apk
            apps/worldz-wallet-android/app/build/outputs/apk/debug/SHA256SUMS.txt
          retention-days: 14
