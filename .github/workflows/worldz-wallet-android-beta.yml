name: Worldz Wallet Android Beta APK
on:
  pull_request:
    paths:
      - 'apps/worldz-wallet-android/**'
      - '.github/workflows/worldz-wallet-android-beta.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workflow-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHub Actions can start
        run: echo "WORLDZ_WALLET_ACTIONS_STARTUP=PASS"
