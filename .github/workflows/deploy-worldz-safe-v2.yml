name: Deploy Worldz Safe V2 — Backup Proof Rollback

on:
  push:
    branches: [main]
    paths:
      - 'deployments/worldz-safe-v2.request'

permissions:
  contents: read

concurrency:
  group: worldz-safe-v2
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve locked Safe V2 target
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      environment: ${{ steps.resolve.outputs.environment }}
      live_url: ${{ steps.resolve.outputs.live_url }}
      guard: ${{ steps.resolve.outputs.guard }}
      expected_text: ${{ steps.resolve.outputs.expected_text }}
      hero_image: ${{ steps.resolve.outputs.hero_image }}
      secondary_image: ${{ steps.resolve.outputs.secondary_image }}
      art_marker: ${{ steps.resolve.outputs.art_marker }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        shell: bash
        env:
          APPROVED_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          request='deployments/worldz-safe-v2.request'
          test -f "$request"
          target="$(sed -n 's/^target=//p' "$request" | tail -n1)"
          source_commit="$(sed -n 's/^source_commit=//p' "$request" | tail -n1)"
          confirmation="$(sed -n 's/^confirmation=//p' "$request" | tail -n1)"
          test "$confirmation" = 'APPROVE TOTAL DEPLOYMENT'
          test -n "$source_commit"
          test "$source_commit" = "$APPROVED_BEFORE"

          case "$target" in
            oneworldz)
              environment='oneworldz-production'; live_url='https://oneworldz.com'; guard='ONEWORLDZ.COM'; expected_text='OneWorldz'; hero_image='assets/worldz-master/oneworldz/oneworldz-master.png'; secondary_image='assets/worldz-master/oneworldz/oneworldz-gpt.png'; art_marker='oneworldz-master.png' ;;
            bnbworldz)
              environment='bnbworldz-production'; live_url='https://bnbworldz.xyz'; guard='BNBWORLDZ.XYZ'; expected_text='BNBWorldz'; hero_image='assets/worldz-master/cryptoworldz/we-need-you.png'; secondary_image='assets/worldz-master/blockchains/bnbworldz.png'; art_marker='cryptoworldz-we-need-you' ;;
            xrpworldz)
              environment='xrpworldz-production'; live_url='https://xrpworldz.xyz'; guard='XRPWORLDZ.XYZ'; expected_text='XRPWorldz'; hero_image='assets/worldz-master/cryptoworldz/we-need-you.png'; secondary_image='assets/worldz-master/blockchains/xrpworldz.png'; art_marker='cryptoworldz-we-need-you' ;;
            suiworldz)
              environment='suiworldz-production'; live_url='https://suiworldz.xyz'; guard='SUIWORLDZ.XYZ'; expected_text='SuiWorldz'; hero_image='assets/worldz-master/cryptoworldz/we-need-you.png'; secondary_image='assets/worldz-master/blockchains/suiworldz.png'; art_marker='cryptoworldz-we-need-you' ;;
            hyperworldz)
              environment='hyperworldz-production'; live_url='https://hyperworldz.xyz'; guard='HYPERWORLDZ.XYZ'; expected_text='HyperWorldz'; hero_image='assets/worldz-master/cryptoworldz/we-need-you.png'; secondary_image='assets/worldz-master/blockchains/hyperworldz.png'; art_marker='cryptoworldz-we-need-you' ;;
            robinworldz)
              environment='robinworldz-production'; live_url='https://robinworldz.xyz'; guard='ROBINWORLDZ.XYZ'; expected_text='RobinWorldz'; hero_image='assets/worldz-master/cryptoworldz/we-need-you.png'; secondary_image='assets/worldz-master/blockchains/robinworldz.png'; art_marker='cryptoworldz-we-need-you' ;;
            hodlerworldz)
              environment='hodlerworldz-production'; live_url='https://hodlerworldz.xyz'; guard='HODLERWORLDZ.XYZ'; expected_text='HodlerWorldz'; hero_image='assets/worldz-master/cryptoworldz/we-need-you.png'; secondary_image=''; art_marker='cryptoworldz-we-need-you' ;;
            cryptoworldz|solworldz|purplediamondcrew)
              echo '::error::Protected site cannot be selected by Safe V2 generic deployment.'; exit 1 ;;
            *) echo '::error::Unsupported Safe V2 target.'; exit 1 ;;
          esac

          {
            echo "target=$target"
            echo "environment=$environment"
            echo "live_url=$live_url"
            echo "guard=$guard"
            echo "expected_text=$expected_text"
            echo "hero_image=$hero_image"
            echo "secondary_image=$secondary_image"
            echo "art_marker=$art_marker"
          } >> "$GITHUB_OUTPUT"

  deploy:
    name: Verify, backup, deploy and prove
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: ${{ needs.prepare.outputs.environment }}
      url: ${{ needs.prepare.outputs.live_url }}
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || '/' }}
      FTP_ACCOUNT_SCOPE: ${{ vars.FTP_ACCOUNT_SCOPE }}
      DEPLOY_GUARD: ${{ vars.DEPLOY_GUARD }}
      EXPECTED_GUARD: ${{ needs.prepare.outputs.guard }}
      LIVE_URL: ${{ needs.prepare.outputs.live_url }}
      HERO_IMAGE: ${{ needs.prepare.outputs.hero_image }}
      SECONDARY_IMAGE: ${{ needs.prepare.outputs.secondary_image }}
      EXPECTED_TEXT: ${{ needs.prepare.outputs.expected_text }}
      ART_MARKER: ${{ needs.prepare.outputs.art_marker }}
      FTP_TLS_VERIFY: yes
      FTP_TLS_CHECK_HOSTNAME: yes
      HOSTINGER_LOCKED_IP: '145.223.108.40'
      HOSTINGER_TLS_ALIAS: 'worldz-ftp-pinned.hstgr.io'
      HOSTINGER_CERT_SHA256: '47:E1:B5:DC:5D:61:02:E8:ED:8C:01:21:61:AF:8B:22:53:70:AB:55:63:B0:0C:AF:14:6C:BD:7A:96:51:E9:5E'
      WORLDZ_MEDIA_RMSE_MAX: '0.05'
    steps:
      - uses: actions/checkout@v4

      - name: Restore exact approved master media
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/cryptoworldz-web-core/assets/worldz-master
          bash tools/restore-approved-worldz-media.sh apps/cryptoworldz-web-core/assets/worldz-master
          test -s "apps/cryptoworldz-web-core/$HERO_IMAGE"
          if [[ -n "$SECONDARY_IMAGE" ]]; then test -s "apps/cryptoworldz-web-core/$SECONDARY_IMAGE"; fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Verify repository and deployment safety code
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run verify
          node --check tools/worldz-upload-manifest.mjs
          node --check tools/prove-live-worldz-v2.mjs
          node --check tools/prove-live-worldz.mjs
          bash -n tools/worldz-direct-ftp.sh
          bash -n tools/prove-worldz-origin-media.sh
          bash -n tools/worldz-establish-ftps-host.sh
          bash -n tools/worldz-exact-rollback.sh
          ! grep -RniE 'solworld\.fun' apps/cryptoworldz-web-core --exclude-dir='archive' --exclude='*.md'

      - name: Validate locked production credentials and target
        shell: bash
        run: |
          set -euo pipefail
          test "$FTP_ACCOUNT_SCOPE" = 'DOMAIN_ONLY'
          test "$DEPLOY_GUARD" = "$EXPECTED_GUARD"
          [[ "$FTP_SERVER_DIR" == '/' || "$FTP_SERVER_DIR" == '/public_html' ]] || { echo '::error::Unexpected FTP root'; exit 1; }
          test -n "$FTP_HOST" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          echo "::add-mask::$FTP_USERNAME"; echo "::add-mask::$FTP_HOST"; echo "::add-mask::$FTP_PASSWORD"

      - name: Install secure transfer and visual proof tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp zip unzip imagemagick

      - name: Establish certificate-validated transfer endpoint
        shell: bash
        run: bash tools/worldz-establish-ftps-host.sh

      - name: Confirm authenticated encrypted target
        shell: bash
        run: |
          set -euo pipefail
          timeout 60 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_CONNECT_HOST" -e "set cmd:fail-exit yes; set net:max-retries 2; set net:timeout 20; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname yes; cd '$FTP_SERVER_DIR'; pwd; bye"

      - name: Capture mandatory full rollback snapshot
        shell: bash
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/worldz-backup"; mkdir -p "$backup"
          timeout 180 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_CONNECT_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set ssl:check-hostname yes
          cd "$FTP_SERVER_DIR"
          lcd "$backup"
          mirror --parallel=3 --exclude-glob '.well-known/**' --exclude-glob '.env*' --exclude-glob '*.log' --exclude-glob 'cgi-bin/**' .
          bye
          LFTP
          test -n "$(find "$backup" -type f -print -quit)"
          (cd "$backup" && find . -type f -printf '%P\n' | sort) > "$RUNNER_TEMP/worldz-backup-manifest.txt"
          (cd "$backup" && find . -type f -print0 | sort -z | xargs -0 sha256sum | sed 's#  \./#  #') > "$RUNNER_TEMP/worldz-backup.sha256"
          cd "$backup"; zip -qr "$RUNNER_TEMP/worldz-backup-${GITHUB_RUN_ID}.zip" .
          test -s "$RUNNER_TEMP/worldz-backup-${GITHUB_RUN_ID}.zip"

      - name: Prepare exact upload and rollback manifests
        shell: bash
        run: |
          set -euo pipefail
          source_root="$GITHUB_WORKSPACE/apps/cryptoworldz-web-core"
          node tools/build-worldz-media-payloads.mjs "$source_root"
          node tools/worldz-upload-manifest.mjs "$source_root" "$RUNNER_TEMP/worldz-upload-manifest.txt"
          test -s "$RUNNER_TEMP/worldz-upload-manifest.txt"
          comm -23 "$RUNNER_TEMP/worldz-upload-manifest.txt" "$RUNNER_TEMP/worldz-backup-manifest.txt" > "$RUNNER_TEMP/worldz-rollback-new-files.txt"
          if grep -nE '(^/|(^|/)\.\.(/|$)|[[:cntrl:]])' "$RUNNER_TEMP/worldz-rollback-new-files.txt"; then exit 1; fi
          echo "Upload files: $(wc -l < "$RUNNER_TEMP/worldz-upload-manifest.txt")"
          echo "Rollback-new files: $(wc -l < "$RUNNER_TEMP/worldz-rollback-new-files.txt")"

      - name: Preserve rollback snapshot before production write
        uses: actions/upload-artifact@v4
        with:
          name: worldz-safe-v2-rollback-${{ needs.prepare.outputs.target }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/worldz-backup-${{ github.run_id }}.zip
            ${{ runner.temp }}/worldz-backup-manifest.txt
            ${{ runner.temp }}/worldz-backup.sha256
            ${{ runner.temp }}/worldz-upload-manifest.txt
            ${{ runner.temp }}/worldz-rollback-new-files.txt
          retention-days: 14
          if-no-files-found: error

      - name: Upload exact approved website
        shell: bash
        run: |
          set -euo pipefail
          echo 'WORLDZ_UPLOAD_STARTED=true' >> "$GITHUB_ENV"
          FTP_TRANSFER_TIMEOUT=420 bash tools/worldz-direct-ftp.sh upload "$GITHUB_WORKSPACE/apps/cryptoworldz-web-core"

      - name: Prove exact origin bytes and CDN visual media
        shell: bash
        run: bash tools/prove-worldz-origin-media.sh "$GITHUB_WORKSPACE/apps/cryptoworldz-web-core" "$HERO_IMAGE" "$SECONDARY_IMAGE"

      - name: Prove real desktop and mobile website in Chrome
        shell: bash
        run: WORLDZ_PROOF_DIR="$RUNNER_TEMP/worldz-proof" node tools/prove-live-worldz.mjs "$LIVE_URL" "$EXPECTED_TEXT" "$ART_MARKER"

      - name: Preserve browser proof screenshots
        if: always() && env.WORLDZ_UPLOAD_STARTED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: worldz-safe-v2-proof-${{ needs.prepare.outputs.target }}-${{ github.run_id }}
          path: ${{ runner.temp }}/worldz-proof/
          retention-days: 30
          if-no-files-found: ignore

      - name: Mandatory exact rollback on any post-upload failure
        if: failure() && env.WORLDZ_UPLOAD_STARTED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash tools/worldz-exact-rollback.sh \
            "$RUNNER_TEMP/worldz-backup" \
            "$RUNNER_TEMP/worldz-backup.sha256" \
            "$RUNNER_TEMP/worldz-rollback-new-files.txt"

      - name: Publish factual Safe V2 contract
        if: always()
        run: |
          {
            echo '## Worldz Safe V2 Production Contract'
            echo '- Full source verification occurs before server write.'
            echo '- Encrypted target identity is verified before backup.'
            echo '- Rollback snapshot is preserved before upload.'
            echo '- FTP-origin approved media bytes must match exactly.'
            echo '- Public CDN media must decode with matching dimensions and bounded pixel error.'
            echo '- Desktop and mobile real-browser proof is mandatory.'
            echo '- Any post-upload failure runs mandatory restore and exact SHA verification.'
          } >> "$GITHUB_STEP_SUMMARY"
