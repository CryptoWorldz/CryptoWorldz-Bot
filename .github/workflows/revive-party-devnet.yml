name: REVIVE WorldzParTy Devnet Proof — Manual Fallback

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revive-worldzparty-devnet-manual
  cancel-in-progress: false

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worldzpad-devnet/revive-party
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned SDKs
        run: npm install --no-audit --no-fund
      - name: Static MagicFee proof
        run: npm run static-proof
      - name: Static router and HODLer accounting proof
        run: npm run stage-b-static
      - name: Static Legacy payout program proof
        run: npm run router-static
      - name: Explain automatic on-chain path
        run: |
          echo "On-chain disposable DBC execution is intentionally owned by Validate REVIVE v1 private build / devnet-stage-a."
          echo "This manual fallback does not consume faucet SOL or execute a pool."
