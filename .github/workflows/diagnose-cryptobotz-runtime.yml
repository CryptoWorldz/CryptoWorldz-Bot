name: Diagnose CryptoBotz Hostinger Runtime

on:
  push:
    branches: [main]
    paths:
      - 'deployments/diagnose-cryptobotz-runtime.request'

permissions:
  contents: read

concurrency:
  group: diagnose-cryptobotz-runtime
  cancel-in-progress: true

jobs:
  diagnose:
    name: Read-only CryptoBotz runtime scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Prove request authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's/^target=//p' deployments/diagnose-cryptobotz-runtime.request | tail -n1)" = 'cryptobotz.cryptoworldz.xyz'
          test "$(sed -n 's/^mode=//p' deployments/diagnose-cryptobotz-runtime.request | tail -n1)" = 'read-only-runtime-discovery'
          test "$(sed -n 's/^authority=//p' deployments/diagnose-cryptobotz-runtime.request | tail -n1)" = 'JayJayTeamDev FULL ACCESS PERMISSION & AUTHORITY'

      - name: Download only safe runtime manifests for comparison
        shell: bash
        run: |
          set -euo pipefail
          raw_host="$(printf '%s' "$FTP_HOST" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#^ftp://##' -e 's#^ftps://##' -e 's#/.*$##')"
          if [[ "$raw_host" != *:*:* && "$raw_host" == *:* ]]; then raw_host="${raw_host%%:*}"; fi
          echo "::add-mask::$FTP_HOST"
          echo "::add-mask::$FTP_USERNAME"
          echo "::add-mask::$FTP_PASSWORD"
          cat > "$RUNNER_TEMP/scan.lftp" <<EOF
          set cmd:fail-exit true
          set net:max-retries 1
          set net:timeout 20
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          get /domains/cryptobotz.cryptoworldz.xyz/nodejs/package.json -o $RUNNER_TEMP/remote-package.json
          get /domains/cryptobotz.cryptoworldz.xyz/nodejs/index.js -o $RUNNER_TEMP/remote-index.js
          bye
          EOF
          timeout 240 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/scan.lftp" "$raw_host"

      - name: Compare live runtime with current approved source
        shell: bash
        run: |
          set -euo pipefail
          echo "REMOTE_INDEX_SHA=$(sha256sum "$RUNNER_TEMP/remote-index.js" | cut -d' ' -f1)"
          echo "CURRENT_INDEX_SHA=$(sha256sum index.js | cut -d' ' -f1)"
          echo "REMOTE_PACKAGE_SHA=$(sha256sum "$RUNNER_TEMP/remote-package.json" | cut -d' ' -f1)"
          echo "CURRENT_PACKAGE_SHA=$(sha256sum package.json | cut -d' ' -f1)"
          node - <<'NODE'
          const fs = require('fs');
          const live = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/remote-package.json','utf8'));
          const current = JSON.parse(fs.readFileSync('package.json','utf8'));
          const safe = (p) => ({name:p.name,version:p.version,main:p.main,start:p.scripts?.start || null,dependencies:Object.keys(p.dependencies || {}).sort()});
          console.log('LIVE_SAFE_PACKAGE=' + JSON.stringify(safe(live)));
          console.log('CURRENT_SAFE_PACKAGE=' + JSON.stringify(safe(current)));
          NODE
