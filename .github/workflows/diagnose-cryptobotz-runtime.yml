name: Diagnose CryptoBotz Hostinger Runtime

on:
  push:
    branches: [main]
    paths:
      - 'deployments/diagnose-cryptobotz-runtime.request'

permissions:
  contents: read

concurrency:
  group: diagnose-cryptobotz-runtime
  cancel-in-progress: true

jobs:
  diagnose:
    name: Read-only CryptoBotz runtime scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Prove request authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's/^target=//p' deployments/diagnose-cryptobotz-runtime.request | tail -n1)" = 'cryptobotz.cryptoworldz.xyz'
          test "$(sed -n 's/^mode=//p' deployments/diagnose-cryptobotz-runtime.request | tail -n1)" = 'read-only-runtime-discovery'
          test "$(sed -n 's/^authority=//p' deployments/diagnose-cryptobotz-runtime.request | tail -n1)" = 'JayJayTeamDev FULL ACCESS PERMISSION & AUTHORITY'

      - name: Download safe live routing files
        shell: bash
        run: |
          set -euo pipefail
          raw_host="$(printf '%s' "$FTP_HOST" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#^ftp://##' -e 's#^ftps://##' -e 's#/.*$##')"
          if [[ "$raw_host" != *:*:* && "$raw_host" == *:* ]]; then raw_host="${raw_host%%:*}"; fi
          echo "::add-mask::$FTP_HOST"
          echo "::add-mask::$FTP_USERNAME"
          echo "::add-mask::$FTP_PASSWORD"
          cat > "$RUNNER_TEMP/scan.lftp" <<EOF
          set cmd:fail-exit true
          set net:max-retries 1
          set net:timeout 20
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          get /domains/cryptobotz.cryptoworldz.xyz/nodejs/index.js -o $RUNNER_TEMP/remote-index.js
          get /domains/cryptobotz.cryptoworldz.xyz/public_html/.htaccess -o $RUNNER_TEMP/remote-htaccess
          bye
          EOF
          timeout 240 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/scan.lftp" "$raw_host"

      - name: Report structure only, never environment values
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync(process.env.RUNNER_TEMP + '/remote-index.js','utf8');
          const lines = text.split(/\r?\n/);
          const requires = [...text.matchAll(/require\(["']([^"']+)["']\)/g)].map(m => m[1]);
          const routes = [...text.matchAll(/app\.(?:get|post|put|delete|use)\(["']([^"']+)["']/g)].map(m => m[1]);
          const positions = {};
          for (const needle of ['express()','app.listen(','express.json(','express.static(']) {
            const i = lines.findIndex(line => line.includes(needle));
            positions[needle] = i >= 0 ? i + 1 : null;
          }
          console.log('LIVE_INDEX_LINES=' + lines.length);
          console.log('LIVE_REQUIRES=' + JSON.stringify([...new Set(requires)].sort()));
          console.log('LIVE_ROUTE_PATHS=' + JSON.stringify([...new Set(routes)].sort()));
          console.log('LIVE_STRUCTURE_POSITIONS=' + JSON.stringify(positions));
          const ht = fs.readFileSync(process.env.RUNNER_TEMP + '/remote-htaccess','utf8');
          console.log('HTACCESS_REWRITE_ENGINE=' + /RewriteEngine\s+On/i.test(ht));
          console.log('HTACCESS_FILE_BYPASS=' + /REQUEST_FILENAME[^\n]*!-f/i.test(ht));
          console.log('HTACCESS_DIR_BYPASS=' + /REQUEST_FILENAME[^\n]*!-d/i.test(ht));
          console.log('HTACCESS_SHA=' + require('crypto').createHash('sha256').update(ht).digest('hex'));
          NODE
