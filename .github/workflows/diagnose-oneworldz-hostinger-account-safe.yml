name: DIAGNOSE — OneWorldz Hostinger Account — SAFE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-oneworldz-hostinger-account-safe.yml'

permissions:
  contents: read

concurrency:
  group: diagnose-oneworldz-hostinger-account-safe
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: oneworldz-production
    env:
      TOKEN_PRIMARY: ${{ secrets.HOSTINGER_API_TOKEN }}
      TOKEN_LEGACY: ${{ secrets.API_TOKEN }}
      TOKEN_ALT: ${{ secrets.HAPI_TOKEN }}
      TOKEN_KEY: ${{ secrets.HOSTINGER_API_KEY }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: '21'
      LOCKED_IP: '145.223.108.40'
      TLS_ALIAS: 'cryptoworldz-ftp-pinned.hstgr.io'
      CERT_SHA256: '47:E1:B5:DC:5D:61:02:E8:ED:8C:01:21:61:AF:8B:22:53:70:AB:55:63:B0:0C:AF:14:6C:BD:7A:96:51:E9:5E'
      BASE: https://developers.hostinger.com
    steps:
      - name: Install secure clients
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp jq openssl

      - name: Select existing Hostinger API token without exposing it
        shell: bash
        run: |
          set -euo pipefail
          token=''
          for candidate in "$TOKEN_PRIMARY" "$TOKEN_LEGACY" "$TOKEN_ALT" "$TOKEN_KEY"; do
            if [[ -n "$candidate" ]]; then token="$candidate"; break; fi
          done

          if [[ -z "$token" ]]; then
            [[ -n "$FTP_USERNAME" && -n "$FTP_PASSWORD" ]] || { echo '::error::No Hostinger API token or OneWorldz FTPS credentials configured'; exit 1; }
            echo "::add-mask::$FTP_USERNAME"
            echo "::add-mask::$FTP_PASSWORD"

            session="$RUNNER_TEMP/ftps-session.txt"
            cert="$RUNNER_TEMP/ftps-cert.pem"
            timeout 25 openssl s_client -starttls ftp -connect "$LOCKED_IP:$FTP_PORT" -servername "$TLS_ALIAS" -verify_return_error -showcerts </dev/null >"$session" 2>/dev/null
            grep -Fq 'Verify return code: 0 (ok)' "$session"
            sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' "$session" | sed -n '1,/-----END CERTIFICATE-----/p' > "$cert"
            test -s "$cert"
            actual_fp="$(openssl x509 -in "$cert" -noout -fingerprint -sha256 | cut -d= -f2)"
            [[ "$actual_fp" == "$CERT_SHA256" ]]
            openssl x509 -in "$cert" -noout -ext subjectAltName | grep -Fq '*.hstgr.io'

            echo "$LOCKED_IP $TLS_ALIAS" | sudo tee -a /etc/hosts >/dev/null
            token_file="$RUNNER_TEMP/hostinger-api-token"
            timeout 60 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$TLS_ALIAS" -e "set cmd:fail-exit yes; set net:max-retries 1; set net:timeout 15; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname yes; cd '/'; get .api_token -o '$token_file'; bye"
            test -s "$token_file"
            chmod 600 "$token_file"
            token="$(tr -d '\r\n' < "$token_file")"
          fi

          [[ ${#token} -ge 20 ]] || { echo '::error::Existing Hostinger API token is unavailable or invalid'; exit 1; }
          echo "::add-mask::$token"
          printf '%s' "$token" > "$RUNNER_TEMP/hostinger-token-clean"
          chmod 600 "$RUNNER_TEMP/hostinger-token-clean"
          echo 'HOSTINGER_API_TOKEN_READY=YES'

      - name: Inspect OneWorldz website, hosting orders and DNS
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat "$RUNNER_TEMP/hostinger-token-clean")"
          auth=(-H "Authorization: Bearer $token" -H 'Accept: application/json')
          websites="$RUNNER_TEMP/websites.json"
          orders="$RUNNER_TEMP/orders.json"
          zone="$RUNNER_TEMP/zone.json"

          ws=$(curl -sS --max-time 30 "${auth[@]}" -o "$websites" -w '%{http_code}' "$BASE/api/hosting/v1/websites?per_page=100")
          echo "HOSTING_WEBSITES_HTTP=$ws"
          [[ "$ws" == 200 ]] || { echo '::error::Hostinger website lookup failed'; exit 1; }

          jq -r '
            [.data[]? | select(((.domain // "") | ascii_downcase) == "oneworldz.com")]
            | "ONEWORLDZ_MATCH_COUNT=\(length)",
              (.[] | "ONEWORLDZ_SITE domain=\(.domain // "") username=\(.username // "") vhost_type=\(.vhost_type // "") enabled=\(.is_enabled // "") order_id=\(.order_id // "") root_directory=\(.root_directory // "") created_at=\(.created_at // "")")
          ' "$websites"

          jq -r '
            .data[]? | select((((.domain // "") | ascii_downcase) | contains("oneworldz")) or (((.root_directory // "") | ascii_downcase) | contains("oneworldz")))
            | "RELATED_SITE domain=\(.domain // "") username=\(.username // "") vhost_type=\(.vhost_type // "") enabled=\(.is_enabled // "") order_id=\(.order_id // "") root_directory=\(.root_directory // "")"
          ' "$websites"

          os=$(curl -sS --max-time 30 "${auth[@]}" -o "$orders" -w '%{http_code}' "$BASE/api/hosting/v1/orders?per_page=100")
          echo "HOSTING_ORDERS_HTTP=$os"
          if [[ "$os" == 200 ]]; then
            jq -r '.data[]? | "HOSTING_ORDER id=\(.id // .order_id // "") status=\(.status // "") plan=\(.plan // .product_name // .name // "") username=\(.username // "")"' "$orders" | head -100
          fi

          zs=$(curl -sS --max-time 30 "${auth[@]}" -o "$zone" -w '%{http_code}' "$BASE/api/dns/v1/zones/oneworldz.com")
          echo "DNS_ZONE_HTTP=$zs"
          if [[ "$zs" == 200 ]]; then
            jq -r '
              (.data // .) as $z |
              ($z.records // $z)[]? |
              select((.type // "") == "A" or (.type // "") == "AAAA" or (.type // "") == "CNAME") |
              "DNS_RECORD type=\(.type // "") name=\(.name // .host // "") content=\(.content // .value // "") ttl=\(.ttl // "")"
            ' "$zone"
          fi

          live_ip=$(getent ahostsv4 oneworldz.com | awk 'NR==1{print $1}')
          echo "PUBLIC_IPV4=$live_ip"
          cert_info=$(echo | openssl s_client -connect oneworldz.com:443 -servername oneworldz.com -verify_return_error 2>/dev/null | openssl x509 -noout -subject -issuer -dates 2>/dev/null | tr '\n' ';' || true)
          [[ -n "$cert_info" ]] && echo "SSL_CERT=$cert_info"

      - name: Safe summary
        if: always()
        run: |
          {
            echo '## OneWorldz Hostinger Account Diagnostic'
            echo '- Read-only Hostinger API inspection only'
            echo '- No secrets or credentials printed'
            echo '- No DNS, SSL, hosting, files, or domain assignments changed'
            echo '- FTPS TLS certificate and hostname verification remained enabled'
          } >> "$GITHUB_STEP_SUMMARY"
