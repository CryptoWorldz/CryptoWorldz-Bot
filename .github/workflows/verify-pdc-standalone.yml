name: Verify PurpleDiamondCrew Standalone

on:
  push:
    branches: [main]
    paths:
      - 'apps/worldz-sites/purplediamondcrew/**'
      - 'tools/verify-pdc-standalone.mjs'
      - '.github/workflows/verify-pdc-standalone.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify PDC package and production readiness
    runs-on: ubuntu-latest
    environment:
      name: purplediamondcrew-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || '/' }}
      FTP_ACCOUNT_SCOPE: ${{ vars.FTP_ACCOUNT_SCOPE }}
      DEPLOY_GUARD: ${{ vars.DEPLOY_GUARD }}
    steps:
      - name: Check out approved main commit
        uses: actions/checkout@v4

      - name: Run standalone production gate
        run: node tools/verify-pdc-standalone.mjs

      - name: Check production environment without connecting
        shell: bash
        run: |
          set -euo pipefail
          ready=true
          [[ -n "$FTP_HOST" ]] || { echo '::warning::FTP_HOST is not configured'; ready=false; }
          [[ -n "$FTP_USERNAME" ]] || { echo '::warning::FTP_USERNAME is not configured'; ready=false; }
          [[ -n "$FTP_PASSWORD" ]] || { echo '::warning::FTP_PASSWORD is not configured'; ready=false; }
          [[ "$FTP_PORT" == '21' ]] || { echo '::warning::FTP_PORT must be 21'; ready=false; }
          [[ "$FTP_SERVER_DIR" == '/' ]] || { echo '::warning::FTP_SERVER_DIR must be / for the domain-only account'; ready=false; }
          [[ "$FTP_ACCOUNT_SCOPE" == 'DOMAIN_ONLY' ]] || { echo '::warning::FTP_ACCOUNT_SCOPE must be DOMAIN_ONLY'; ready=false; }
          [[ "$DEPLOY_GUARD" == 'PURPLEDIAMONDCREW.COM' ]] || { echo '::warning::DEPLOY_GUARD must be PURPLEDIAMONDCREW.COM'; ready=false; }
          if [[ "$ready" == true ]]; then
            echo 'PDC_INFRA_READY=true' >> "$GITHUB_ENV"
            echo 'PurpleDiamondCrew production environment is ready for guarded deployment.'
          else
            echo 'PDC_INFRA_READY=false' >> "$GITHUB_ENV"
            echo 'PurpleDiamondCrew website package is valid; production credentials are not fully configured.'
          fi

      - name: Publish readiness summary
        if: always()
        run: |
          {
            echo '## PurpleDiamondCrew Standalone Readiness'
            echo '- Package: 3 dedicated pages'
            echo '- Required artwork: built-in vector fallbacks'
            echo '- Hope Chest: verified master enhancement + fallback'
            echo '- Legacy tokens: 10 verified records'
            echo "- Production FTP ready: ${PDC_INFRA_READY:-unknown}"
            echo '- Upload performed: no'
          } >> "$GITHUB_STEP_SUMMARY"
