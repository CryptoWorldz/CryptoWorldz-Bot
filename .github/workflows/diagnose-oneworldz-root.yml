name: Diagnose OneWorldz Document Root

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/oneworldz-root.request'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: oneworldz-production
    env:
      FTP_HOST: '145.223.108.40'
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: '21'
      FTP_ACCOUNT_SCOPE: ${{ vars.FTP_ACCOUNT_SCOPE }}
      DEPLOY_GUARD: ${{ vars.DEPLOY_GUARD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate read-only request and OneWorldz guard
        shell: bash
        env:
          APPROVED_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test -f diagnostics/oneworldz-root.request
          test "$(sed -n 's/^confirmation=//p' diagnostics/oneworldz-root.request | tail -n1)" = 'APPROVE READ ONLY DIAGNOSTIC'
          test "$(sed -n 's/^source_commit=//p' diagnostics/oneworldz-root.request | tail -n1)" = "$APPROVED_BEFORE"
          [[ "$FTP_ACCOUNT_SCOPE" == 'DOMAIN_ONLY' ]]
          [[ "$DEPLOY_GUARD" == 'ONEWORLDZ.COM' ]]
          [[ -n "$FTP_USERNAME" && -n "$FTP_PASSWORD" ]]
          echo "::add-mask::$FTP_USERNAME"

      - name: Install FTP client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Inspect accessible OneWorldz folders only
        shell: bash
        run: |
          set +e
          timeout 90 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" <<'LFTP'
          set cmd:fail-exit no
          set net:max-retries 1
          set net:timeout 15
          set net:idle 15
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          echo === ROOT ===
          cd /
          pwd
          cls -la
          echo === PUBLIC_HTML ===
          cd /public_html
          pwd
          cls -la
          echo === DOMAINS ===
          cd /domains
          pwd
          cls -la
          echo === ONEWORLDZ_DOMAIN ===
          cd /domains/oneworldz.com
          pwd
          cls -la
          echo === ONEWORLDZ_PUBLIC_HTML ===
          cd /domains/oneworldz.com/public_html
          pwd
          cls -la
          bye
          LFTP
          echo "diagnostic_exit=$?"
          exit 0

      - name: Summary
        run: |
          {
            echo '## OneWorldz document-root diagnostic'
            echo
            echo '- Read only: no uploads, deletes, renames, or DNS changes.'
            echo '- Tested only the standard Hostinger website-root candidates.'
          } >> "$GITHUB_STEP_SUMMARY"
