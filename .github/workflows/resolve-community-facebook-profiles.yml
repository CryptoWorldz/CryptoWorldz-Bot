name: Resolve Community Support Facebook Profiles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resolve-community-facebook-profiles.yml'
      - 'tools/resolve-community-facebook-metadata.mjs'
      - 'governance/community-support-links.json'
      - 'deployments/oneworldz-19-total.request'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  probe-oneworldz-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: oneworldz-production
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - name: Wait, restart and diagnose managed Node deployment
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: '86'
          DOMAIN: cryptobotz.cryptoworldz.xyz
        shell: bash
        run: |
          set -euo pipefail
          enc="$(node -p 'encodeURIComponent(process.env.DOMAIN)')"
          curl --fail --silent --show-error -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "https://developers.hostinger.com/api/hosting/v1/websites?domain=${enc}&per_page=25" -o /tmp/websites.json
          username="$(node -e "const p=require('/tmp/websites.json');const x=(p.data||[]).find(x=>x.domain===process.env.DOMAIN);process.stdout.write(x?.username||'')")"
          test -n "$username"
          uenc="$(U="$username" node -p 'encodeURIComponent(process.env.U)')"
          base="https://developers.hostinger.com/api/hosting/v1/accounts/${uenc}/websites/${enc}/nodejs"
          for n in $(seq 1 80); do
            curl --fail --silent --show-error -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "$base/builds?per_page=5" -o /tmp/builds.json
            state="$(node -e "const p=require('/tmp/builds.json');process.stdout.write((p.data||[])[0]?.state||'missing')")"
            uuid="$(node -e "const p=require('/tmp/builds.json');process.stdout.write((p.data||[])[0]?.uuid||'')")"
            echo "BUILD_WAIT=$n STATE=$state UUID=$uuid"
            if [ "$state" = completed ]; then break; fi
            if [ "$state" = failed ]; then break; fi
            sleep 5
          done
          test -n "$uuid"
          curl --silent --show-error -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "$base/builds/$uuid/logs?from_line=0" -o /tmp/logs.json
          restart_code="$(curl --silent --show-error --location -o /tmp/restart.json -w '%{http_code}' -X POST -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "$base/server/restart" || true)"
          sleep 12
          live_code="$(curl --silent --show-error --location -o /tmp/live.txt -w '%{http_code}' "https://$DOMAIN/api/oneworldz-gpt/status?diag=$GITHUB_RUN_ID" || true)"
          summary="$(RESTART="$restart_code" LIVE="$live_code" node - <<'NODE'
          const fs=require('fs');
          const b=JSON.parse(fs.readFileSync('/tmp/builds.json','utf8'));
          const x=(b.data||[])[0]||{};
          const logs=fs.readFileSync('/tmp/logs.json','utf8').slice(-9000).replace(/[`\r]/g,'');
          const live=fs.readFileSync('/tmp/live.txt','utf8').slice(0,2000).replace(/[`\r]/g,'');
          console.log(`HOSTINGER_NODE_FINAL_DIAG uuid=${x.uuid||''} state=${x.state||''} source_type=${x.options?.source_type||''} branch=${x.options?.branch||''} repo=${x.options?.repository||x.options?.repo||''} restart_http=${process.env.RESTART} live_http=${process.env.LIVE}\nOPTIONS=${JSON.stringify(x.options||{})}\nLIVE_BODY=${live}\nBUILD_LOG_TAIL=${logs}`);
          NODE
          )"
          jq -n --arg body "$summary" '{body:$body}' >/tmp/comment.json
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --data-binary @/tmp/comment.json >/dev/null
          echo "RESTART_HTTP=$restart_code LIVE_HTTP=$live_code"

  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve public Facebook names and previews
        run: node tools/resolve-community-facebook-metadata.mjs governance/community-support-links.json tmp/community-facebook-metadata.json
      - name: Final 35-profile metadata gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.source_count' tmp/community-facebook-metadata.json)" = '35'
          resolved="$(jq -r '.resolved_count' tmp/community-facebook-metadata.json)"
          if [ "$resolved" != '35' ]; then
            echo "::error::Only $resolved/35 Facebook profiles exposed both a real public name and preview image anonymously."
            exit 1
          fi
