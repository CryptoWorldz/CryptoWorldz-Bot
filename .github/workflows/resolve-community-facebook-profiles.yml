name: Resolve Community Support Facebook Profiles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resolve-community-facebook-profiles.yml'
      - 'tools/resolve-community-facebook-metadata.mjs'
      - 'governance/community-support-links.json'
      - 'deployments/oneworldz-19-total.request'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  probe-oneworldz-production:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: oneworldz-production
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect protected Node filesystem and live service
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: '86'
          DOMAIN: cryptobotz.cryptoworldz.xyz
          NODE_ROOT: /domains/cryptobotz.cryptoworldz.xyz/nodejs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          raw_host="$(printf '%s' "$FTP_HOST" | sed -e 's#^ftp://##' -e 's#^ftps://##' -e 's#/.*$##')"
          if [[ "$raw_host" != *:*:* && "$raw_host" == *:* ]]; then raw_host="${raw_host%%:*}"; fi
          cat >/tmp/inspect.lftp <<EOF
          set cmd:fail-exit false
          set net:max-retries 2
          set net:timeout 25
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          cls -la $NODE_ROOT > /tmp/node-root.txt
          get $NODE_ROOT/index.js -o /tmp/remote-index.js
          get $NODE_ROOT/package.json -o /tmp/remote-package.json
          get $NODE_ROOT/.env -o /tmp/remote-env
          bye
          EOF
          timeout 180 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source /tmp/inspect.lftp" "$raw_host" || true
          remote_index='missing'; remote_package='missing'; env_keys='NONE'
          [ -s /tmp/remote-index.js ] && remote_index="$(sha256sum /tmp/remote-index.js | awk '{print $1}')"
          [ -s /tmp/remote-package.json ] && remote_package="$(sha256sum /tmp/remote-package.json | awk '{print $1}')"
          local_index="$(sha256sum index.js | awk '{print $1}')"
          local_package="$(sha256sum package.json | awk '{print $1}')"
          if [ -s /tmp/remote-env ]; then env_keys="$(sed -n 's/^\([A-Z0-9_]*\)=.*/\1/p' /tmp/remote-env | sort -u | paste -sd, -)"; fi
          enc="$(node -p 'encodeURIComponent(process.env.DOMAIN)')"
          curl --fail --silent --show-error -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "https://developers.hostinger.com/api/hosting/v1/websites?domain=${enc}&per_page=25" -o /tmp/websites.json
          username="$(node -e "const p=require('/tmp/websites.json');const x=(p.data||[]).find(x=>x.domain===process.env.DOMAIN);process.stdout.write(x?.username||'')")"
          uenc="$(U="$username" node -p 'encodeURIComponent(process.env.U)')"
          base="https://developers.hostinger.com/api/hosting/v1/accounts/${uenc}/websites/${enc}/nodejs"
          curl --fail --silent --show-error -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "$base/builds?per_page=5" -o /tmp/builds.json
          live_code="$(curl --silent --show-error --location -o /tmp/live.txt -w '%{http_code}' "https://$DOMAIN/api/oneworldz-gpt/status?fsdiag=$GITHUB_RUN_ID" || true)"
          latest="$(node -e "const p=require('/tmp/builds.json');const x=(p.data||[])[0]||{};process.stdout.write(JSON.stringify({uuid:x.uuid||'',state:x.state||'',options:x.options||{}}))")"
          listing="$(tr '\n' ';' </tmp/node-root.txt 2>/dev/null | head -c 3500 || true)"
          body="HOSTINGER_RUNTIME_FILE_DIAG live_http=$live_code local_index=$local_index remote_index=$remote_index local_package=$local_package remote_package=$remote_package env_keys=$env_keys\nLATEST_BUILD=$latest\nNODE_ROOT_LIST=$listing"
          jq -n --arg body "$body" '{body:$body}' >/tmp/comment.json
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --data-binary @/tmp/comment.json >/dev/null

  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve public Facebook names and previews
        run: node tools/resolve-community-facebook-metadata.mjs governance/community-support-links.json tmp/community-facebook-metadata.json
      - name: Final 35-profile metadata gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.source_count' tmp/community-facebook-metadata.json)" = '35'
          resolved="$(jq -r '.resolved_count' tmp/community-facebook-metadata.json)"
          if [ "$resolved" != '35' ]; then
            echo "::error::Only $resolved/35 Facebook profiles exposed both a real public name and preview image anonymously."
            exit 1
          fi
