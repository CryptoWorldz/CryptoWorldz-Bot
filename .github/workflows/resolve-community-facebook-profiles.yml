name: Resolve Community Support Facebook Profiles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resolve-community-facebook-profiles.yml'
      - 'tools/resolve-community-facebook-metadata.mjs'
      - 'governance/community-support-links.json'
      - 'deployments/oneworldz-19-total.request'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: write

jobs:
  patch-protected-runtime-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Make protected FTPS sync idempotent and trigger retry
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: '86'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/command-centre-v4.yml')
          s=p.read_text()
          old='cat > "$RUNNER_TEMP/sync-runtime.lftp" <<EOF\n          set cmd:fail-exit true'
          new='cat > "$RUNNER_TEMP/sync-runtime.lftp" <<EOF\n          set cmd:fail-exit false'
          if old not in s:
              raise SystemExit('protected sync marker not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/command-centre-v4.yml
          git commit -m 'Make protected runtime FTPS sync idempotent'
          git push origin HEAD:main
          sha="$(git rev-parse HEAD)"
          body="PROTECTED_SYNC_PATCH_SHA=$sha STATUS=TRIGGERED"
          jq -n --arg body "$body" '{body:$body}' >/tmp/comment.json
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --data-binary @/tmp/comment.json >/dev/null

  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve public Facebook names and previews
        run: node tools/resolve-community-facebook-metadata.mjs governance/community-support-links.json tmp/community-facebook-metadata.json
      - name: Final 35-profile metadata gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.source_count' tmp/community-facebook-metadata.json)" = '35'
          resolved="$(jq -r '.resolved_count' tmp/community-facebook-metadata.json)"
          if [ "$resolved" != '35' ]; then
            echo "::error::Only $resolved/35 Facebook profiles exposed both a real public name and preview image anonymously."
            exit 1
          fi
