name: Resolve Community Support Facebook Profiles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resolve-community-facebook-profiles.yml'
      - 'tools/resolve-community-facebook-metadata.mjs'
      - 'governance/community-support-links.json'
      - 'deployments/oneworldz-19-total.request'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  live-hostinger-managed-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cryptoworldz-production
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      PROTECTED_DOMAIN: cryptobotz.cryptoworldz.xyz
      ISSUE_NUMBER: '86'
    steps:
      - name: Report live monitor start
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          body="HOSTINGER_LIVE_MONITOR_RUN_ID=$GITHUB_RUN_ID TARGET_SHA=$GITHUB_SHA STATUS=STARTED"
          jq -n --arg body "$body" '{body:$body}' > "$RUNNER_TEMP/comment.json"
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            --data-binary @"$RUNNER_TEMP/comment.json" >/dev/null

      - name: Wait for managed build then restart and prove live API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_API_TOKEN"
          echo "::add-mask::$HOSTINGER_API_TOKEN"
          domain_enc="$(node -p 'encodeURIComponent(process.env.PROTECTED_DOMAIN)')"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' \
            "https://developers.hostinger.com/api/hosting/v1/websites?domain=${domain_enc}&per_page=25" \
            -o "$RUNNER_TEMP/websites.json"
          username="$(node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/websites.json','utf8'));
          const d=process.env.PROTECTED_DOMAIN.toLowerCase();
          const row=(p.data||[]).find(x=>String(x.domain||'').toLowerCase()===d);
          if(!row?.username) process.exit(2);
          process.stdout.write(String(row.username));
          NODE
          )"
          echo "::add-mask::$username"
          user_enc="$(HOSTINGER_USERNAME="$username" node -p 'encodeURIComponent(process.env.HOSTINGER_USERNAME)')"
          base="https://developers.hostinger.com/api/hosting/v1/accounts/${user_enc}/websites/${domain_enc}/nodejs"

          latest=''
          uuid=''
          state=''
          for attempt in $(seq 1 120); do
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' \
              "$base/builds?per_page=25" -o "$RUNNER_TEMP/builds.json"
            latest="$(node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/builds.json','utf8'));
          const rows=(p.data||[]).filter(x=>String(x.options?.source_type||'')==='git').sort((a,b)=>Date.parse(b.created_at||0)-Date.parse(a.created_at||0));
          const x=rows[0]||{};
          process.stdout.write(JSON.stringify({uuid:x.uuid||'',state:x.state||'',created_at:x.created_at||'',options:x.options||{}}));
          NODE
          )"
            uuid="$(printf '%s' "$latest" | jq -r '.uuid')"
            state="$(printf '%s' "$latest" | jq -r '.state')"
            active="$(node -e "const p=require(process.env.RUNNER_TEMP+'/builds.json');process.stdout.write(String((p.data||[]).filter(x=>!['completed','failed'].includes(String(x.state||'').toLowerCase())).length))")"
            echo "HOSTINGER_LIVE_BUILD attempt=$attempt uuid=$uuid state=$state active=$active"
            if [ -n "$uuid" ] && [ "$state" = completed ] && [ "$active" = 0 ]; then break; fi
            if [ -n "$uuid" ] && [ "$state" = failed ]; then break; fi
            sleep 5
          done

          sanitize() {
            sed -E \
              -e 's/sk-[A-Za-z0-9_-]+/[REDACTED_OPENAI_KEY]/g' \
              -e 's/(Bearer )[A-Za-z0-9._-]+/\1[REDACTED]/g' \
              -e 's/(password|token|secret|auth_key|rest_auth_key)[=:][^[:space:]",}]+/\1=[REDACTED]/Ig'
          }

          curl --silent --show-error --location \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' \
            "$base/builds/$uuid/logs?from_line=0" -o "$RUNNER_TEMP/build-logs.txt" || true
          build_excerpt="$(cat "$RUNNER_TEMP/build-logs.txt" | sanitize | tail -c 7000)"

          if [ "$state" != completed ]; then
            body="HOSTINGER_LIVE_MONITOR_RUN_ID=$GITHUB_RUN_ID STATUS=BUILD_FAILURE\nLATEST_BUILD=$latest\nBUILD_LOG_TAIL=$build_excerpt"
            jq -n --arg body "$body" '{body:$body}' > "$RUNNER_TEMP/comment.json"
            curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --data-binary @"$RUNNER_TEMP/comment.json" >/dev/null
            exit 1
          fi

          restart_code="$(curl --silent --show-error --location --connect-timeout 15 --max-time 45 --request POST \
            -o "$RUNNER_TEMP/restart.json" -w '%{http_code}' \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' \
            "$base/server/restart")"
          echo "HOSTINGER_MANAGED_RESTART_HTTP=$restart_code"
          case "$restart_code" in 200|201|202|204) ;; *) exit 1 ;; esac

          final_code=''
          final_body=''
          for i in $(seq 1 60); do
            sleep 5
            final_code="$(curl --silent --show-error --location --connect-timeout 12 --max-time 20 \
              -o "$RUNNER_TEMP/live.json" -w '%{http_code}' \
              "https://$PROTECTED_DOMAIN/api/oneworldz-gpt/status?proof=${GITHUB_SHA}-${GITHUB_RUN_ID}-${i}" || true)"
            final_body="$(cat "$RUNNER_TEMP/live.json" 2>/dev/null | head -c 2000)"
            echo "HOSTINGER_LIVE_PROOF attempt=$i HTTP=$final_code"
            if [ "$final_code" = 200 ] && LIVE="$RUNNER_TEMP/live.json" node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.LIVE,'utf8'));
          if(p.ok!==true||p.openai_api_configured!==true) process.exit(1);
          if(p.guard_profile!=="oneworldz-public-low-cost-v1"||p.guard_enforced!==true) process.exit(1);
          if(p.model!=="gpt-4o-mini"||p.max_output_tokens!==320) process.exit(1);
          if(p.per_ip_limit_10m!==8||p.daily_request_limit!==1000) process.exit(1);
          if(p.payments_in_chat!==false||p.secrets_in_browser!==false) process.exit(1);
          NODE
            then
              body="HOSTINGER_LIVE_MONITOR_RUN_ID=$GITHUB_RUN_ID STATUS=FULL_PASS ✅\nLATEST_BUILD=$latest\nLIVE_HTTP=200 LIVE_BODY=$final_body"
              jq -n --arg body "$body" '{body:$body}' > "$RUNNER_TEMP/comment.json"
              curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --data-binary @"$RUNNER_TEMP/comment.json" >/dev/null
              exit 0
            fi
          done

          body="HOSTINGER_LIVE_MONITOR_RUN_ID=$GITHUB_RUN_ID STATUS=LIVE_FAILURE\nLATEST_BUILD=$latest\nLIVE_HTTP=$final_code LIVE_BODY=$final_body\nBUILD_LOG_TAIL=$build_excerpt"
          jq -n --arg body "$body" '{body:$body}' > "$RUNNER_TEMP/comment.json"
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --data-binary @"$RUNNER_TEMP/comment.json" >/dev/null
          exit 1

  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve public Facebook names and previews
        run: node tools/resolve-community-facebook-metadata.mjs governance/community-support-links.json tmp/community-facebook-metadata.json
      - name: Final 35-profile metadata gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.source_count' tmp/community-facebook-metadata.json)" = '35'
          resolved="$(jq -r '.resolved_count' tmp/community-facebook-metadata.json)"
          if [ "$resolved" != '35' ]; then
            echo "::error::Only $resolved/35 Facebook profiles exposed both a real public name and preview image anonymously."
            exit 1
          fi
