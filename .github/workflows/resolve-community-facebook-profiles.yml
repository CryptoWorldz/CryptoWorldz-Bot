name: Resolve Community Support Facebook Profiles

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resolve-community-facebook-profiles.yml'
      - 'tools/resolve-community-facebook-metadata.mjs'
      - 'governance/community-support-links.json'
      - 'deployments/oneworldz-19-total.request'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  probe-oneworldz-production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: oneworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Report protected secret scope without values
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: '86'
        shell: bash
        run: |
          set -euo pipefail
          present=''
          missing=''
          for key in FTP_HOST FTP_USERNAME FTP_PASSWORD OPENAI_API_KEY HOSTINGER_API_TOKEN BOT_TOKEN SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -n "${!key:-}" ]; then
              present="${present}${present:+,}${key}"
              echo "::add-mask::${!key}"
            else
              missing="${missing}${missing:+,}${key}"
            fi
          done
          body="ONEWORLDZ_PRODUCTION_SECRET_SCOPE PRESENT=${present:-NONE} MISSING=${missing:-NONE}"
          jq -n --arg body "$body" '{body:$body}' > /tmp/comment.json
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" \
            --data-binary @/tmp/comment.json >/dev/null

  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Report protected public GPT final managed deployment
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: '34f237a827c6d3770276ceba70a15b97b27cbd44'
          ISSUE_NUMBER: '86'
        shell: bash
        run: |
          set -euo pipefail
          run=''
          for attempt in $(seq 1 30); do
            response="$(curl --fail --silent --show-error -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&event=push&per_page=20")"
            run="$(printf '%s' "$response" | jq -c '.workflow_runs[] | select(.path == ".github/workflows/command-centre-v4.yml")' | head -n1)"
            [ -n "$run" ] && break
            sleep 2
          done
          test -n "$run"
          run_id="$(printf '%s' "$run" | jq -r '.id')"
          status="$(printf '%s' "$run" | jq -r '.status')"
          conclusion="$(printf '%s' "$run" | jq -r '.conclusion // "pending"')"
          body="PROTECTED_GPT_PUBLIC_GUARD_RUN_ID=$run_id TARGET_SHA=$TARGET_SHA STATUS=$status CONCLUSION=$conclusion"
          jq -n --arg body "$body" '{body:$body}' > /tmp/comment.json
          curl --fail --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments" --data-binary @/tmp/comment.json >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Resolve public Facebook names and previews
        run: node tools/resolve-community-facebook-metadata.mjs governance/community-support-links.json tmp/community-facebook-metadata.json
      - name: Final 35-profile metadata gate
        shell: bash
        run: |
          set -euo pipefail
          test "$(jq -r '.source_count' tmp/community-facebook-metadata.json)" = '35'
          resolved="$(jq -r '.resolved_count' tmp/community-facebook-metadata.json)"
          if [ "$resolved" != '35' ]; then
            echo "::error::Only $resolved/35 Facebook profiles exposed both a real public name and preview image anonymously."
            exit 1
          fi
