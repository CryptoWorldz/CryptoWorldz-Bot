name: CryptoWorldz Hostinger Environment Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hostinger-cryptoworldz-env-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CRYPTO_DOMAIN: cryptoworldz.xyz
  ZED_DOMAIN: cryptobotz.cryptoworldz.xyz

jobs:
  audit:
    name: Read-only CryptoWorldz Hostinger environment audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install read-only audit utility
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq lftp

      - name: Audit Hostinger websites and Node app registrations
        shell: bash
        run: |
          set -euo pipefail
          for value in "$FTP_HOST" "$FTP_USERNAME" "$FTP_PASSWORD" "$HOSTINGER_API_TOKEN"; do
            [ -z "$value" ] || echo "::add-mask::$value"
          done
          test -n "$HOSTINGER_API_TOKEN"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
            -H 'Accept: application/json' \
            "https://developers.hostinger.com/api/hosting/v1/websites?per_page=100" \
            -o "$RUNNER_TEMP/websites.json"
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/websites.json','utf8'));
          const rows=p.data||[];
          for(const target of [process.env.CRYPTO_DOMAIN,process.env.ZED_DOMAIN]){
            const row=rows.find(x=>String(x.domain||'').toLowerCase()===target.toLowerCase());
            if(!row){console.log(`HOSTINGER_WEBSITE ${target}=NOT_REGISTERED`);continue;}
            console.log(`HOSTINGER_WEBSITE ${target}=REGISTERED`);
            console.log(`HOSTINGER_WEBSITE_TYPE ${target}=${String(row.type||row.website_type||'unknown')}`);
            console.log(`HOSTINGER_WEBSITE_STATUS ${target}=${String(row.status||'unknown')}`);
            console.log(`HOSTINGER_ACCOUNT_PRESENT ${target}=${row.username?'YES':'NO'}`);
          }
          NODE

      - name: Audit CryptoWorldz and ZED remote environment files by key name only
        shell: bash
        run: |
          set -euo pipefail
          raw_host="$(printf '%s' "$FTP_HOST" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#^ftp://##' -e 's#^ftps://##' -e 's#/.*$##')"
          if [[ "$raw_host" != *:*:* && "$raw_host" == *:* ]]; then raw_host="${raw_host%%:*}"; fi
          for value in "$raw_host" "$FTP_USERNAME" "$FTP_PASSWORD"; do [ -z "$value" ] || echo "::add-mask::$value"; done

          root="$RUNNER_TEMP/env-audit"
          mkdir -p "$root"
          cat > "$RUNNER_TEMP/audit.lftp" <<EOF
          set cmd:fail-exit false
          set net:max-retries 2
          set net:timeout 25
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          cls -la /domains/cryptoworldz.xyz
          cls -la /domains/cryptoworldz.xyz/public_html
          cls -la /domains/cryptobotz.cryptoworldz.xyz
          cls -la /domains/cryptobotz.cryptoworldz.xyz/nodejs
          get /domains/cryptoworldz.xyz/.env -o $root/cryptoworldz-root.env
          get /domains/cryptoworldz.xyz/.env.production -o $root/cryptoworldz-root.env.production
          get /domains/cryptoworldz.xyz/public_html/.env -o $root/cryptoworldz-public.env
          get /domains/cryptoworldz.xyz/nodejs/.env -o $root/cryptoworldz-node.env
          get /domains/cryptobotz.cryptoworldz.xyz/.env -o $root/zed-domain.env
          get /domains/cryptobotz.cryptoworldz.xyz/nodejs/.env -o $root/zed-node.env
          get /domains/cryptobotz.cryptoworldz.xyz/nodejs/.env.production -o $root/zed-node.env.production
          bye
          EOF
          timeout 240 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/audit.lftp" "$raw_host" || true

          node - <<'NODE'
          const fs=require('fs'), path=require('path');
          const root=path.join(process.env.RUNNER_TEMP,'env-audit');
          const wanted=['BOT_TOKEN','TELEGRAM_TOKEN','SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY','SUPABASE_ANON_KEY','OPENAI_API_KEY','HOSTINGER_API_TOKEN','ADMIN_API_TOKEN','HUB_API_SECRET'];
          for(const name of fs.existsSync(root)?fs.readdirSync(root).sort():[]){
            const p=path.join(root,name);
            if(!fs.statSync(p).isFile()||fs.statSync(p).size===0) continue;
            const keys=[];
            for(const raw of fs.readFileSync(p,'utf8').split(/\r?\n/)){
              const line=raw.trim();
              if(!line||line.startsWith('#')) continue;
              const i=line.indexOf('='); if(i<1) continue;
              keys.push(line.slice(0,i).trim());
            }
            console.log(`ENV_FILE ${name}=PRESENT`);
            console.log(`ENV_KEYS ${name}=${keys.sort().join(',')||'NONE'}`);
            for(const key of wanted) console.log(`ENV_HAS ${name} ${key}=${keys.includes(key)?'YES':'NO'}`);
          }
          NODE

      - name: Audit Node build registration for CryptoWorldz and ZED
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/websites.json','utf8'));
          const rows=p.data||[];
          for(const target of [process.env.CRYPTO_DOMAIN,process.env.ZED_DOMAIN]){
            const row=rows.find(x=>String(x.domain||'').toLowerCase()===target.toLowerCase());
            if(row?.username) console.log(`${target}\t${row.username}`);
          }
          NODE
          > "$RUNNER_TEMP/accounts.tsv.tmp"
          node - <<'NODE' > "$RUNNER_TEMP/accounts.tsv"
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/websites.json','utf8'));
          const rows=p.data||[];
          for(const target of [process.env.CRYPTO_DOMAIN,process.env.ZED_DOMAIN]){
            const row=rows.find(x=>String(x.domain||'').toLowerCase()===target.toLowerCase());
            if(row?.username) console.log(`${target}\t${row.username}`);
          }
          NODE
          while IFS=$'\t' read -r domain username; do
            [ -n "$domain" ] || continue
            echo "::add-mask::$username"
            denc="$(DOMAIN="$domain" node -p 'encodeURIComponent(process.env.DOMAIN)')"
            uenc="$(USERNAME="$username" node -p 'encodeURIComponent(process.env.USERNAME)')"
            code="$(curl --silent --show-error --location -o "$RUNNER_TEMP/builds.json" -w '%{http_code}' \
              -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' \
              "https://developers.hostinger.com/api/hosting/v1/accounts/${uenc}/websites/${denc}/nodejs/builds?per_page=10" || true)"
            if [ "$code" = 200 ]; then
              count="$(node -e "const p=require(process.env.RUNNER_TEMP+'/builds.json');process.stdout.write(String((p.data||[]).length))")"
              echo "NODE_APP $domain=REGISTERED builds=$count"
            else
              echo "NODE_APP $domain=NO_NODE_BUILD_ENDPOINT http=$code"
            fi
          done < "$RUNNER_TEMP/accounts.tsv"

      - name: Audit complete
        run: echo 'CRYPTOWORLDZ_HOSTINGER_ENV_AUDIT=PASS_READ_ONLY'
