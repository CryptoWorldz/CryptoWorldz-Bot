name: Deploy OneWorldz Perfect 19-Destination Release

on:
  push:
    branches: [main]
    paths:
      - 'deployments/oneworldz-perfect.request'

permissions:
  contents: read

concurrency:
  group: oneworldz-19-total-production
  cancel-in-progress: true

jobs:
  build:
    name: Build canonical release and lock 18 static targets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      source: ${{ steps.matrix.outputs.source }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prove total-deployment authority
        shell: bash
        run: |
          set -euo pipefail
          f='deployments/oneworldz-perfect.request'
          test "$(sed -n 's/^requested_by=//p' "$f" | tail -n1)" = 'JayJayTeamDev'
          test "$(sed -n 's/^authorization=//p' "$f" | tail -n1)" = 'APPROVE COMPLETE ECOSYSTEM BUILD AND TOTAL DEPLOYMENT'
          test "$(sed -n 's/^destinations=//p' "$f" | tail -n1)" = '19'
          test "$(sed -n 's/^static_targets=//p' "$f" | tail -n1)" = '18'
          test "$(sed -n 's/^protected=//p' "$f" | tail -n1)" = 'cryptobotz.cryptoworldz.xyz'
          test "$(sed -n 's/^excluded=//p' "$f" | tail -n1)" = 'solworld.fun'
      - name: Build and verify Perfect Plan
        run: npm run verify
      - id: matrix
        name: Freeze production target matrix
        working-directory: apps/oneworldz-ecosystem-release
        shell: bash
        run: |
          set -euo pipefail
          echo "source=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { productionTargets, productionGate } from './production-targets.mjs';
          if (productionTargets.length !== 18 || productionGate.ecosystemDestinations !== 19) throw new Error('architecture drift');
          if (JSON.stringify(productionGate.protectedDestinations) !== JSON.stringify(['cryptobotz.cryptoworldz.xyz'])) throw new Error('protected app drift');
          if (productionTargets.some(x => ['cryptobotz.cryptoworldz.xyz','solworld.fun'].includes(x.domain))) throw new Error('protected/excluded target entered static fleet');
          console.log('matrix=' + JSON.stringify({include: productionTargets.map(x => ({key:x.key,domain:x.domain,remote_dir:x.remoteDir,guard:x.guard,title:x.expectedTitle}))}));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: oneworldz-perfect-${{ github.run_id }}
          path: apps/oneworldz-ecosystem-release/dist/ecosystem/
          if-no-files-found: error
          retention-days: 30

  preflight:
    name: Read-only prove all exact Hostinger roots
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      MATRIX: ${{ needs.build.outputs.matrix }}
    steps:
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - shell: bash
        run: |
          set -euo pipefail
          host="$(printf '%s' "$FTP_HOST" | sed -e 's#^ftp[s]*://##' -e 's#/.*$##')"; if [[ "$host" != *:*:* && "$host" == *:* ]]; then host="${host%%:*}"; fi
          echo "::add-mask::$FTP_HOST"; echo "::add-mask::$FTP_USERNAME"; echo "::add-mask::$FTP_PASSWORD"
          node -e 'for(const x of JSON.parse(process.env.MATRIX).include) console.log(x.remote_dir)' > "$RUNNER_TEMP/roots.txt"
          test "$(wc -l < "$RUNNER_TEMP/roots.txt" | tr -d ' ')" = 18
          {
            echo 'set cmd:fail-exit true'; echo 'set net:max-retries 2'; echo 'set net:timeout 30'; echo 'set ftp:ssl-force true'; echo 'set ftp:ssl-protect-data true'; echo 'set ssl:verify-certificate true'; echo 'set ssl:check-hostname false'
            while read -r dir; do echo "cd $dir"; echo 'pwd'; echo 'cd /'; done < "$RUNNER_TEMP/roots.txt"
            echo bye
          } > "$RUNNER_TEMP/preflight.lftp"
          timeout 900 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/preflight.lftp" "$host"

  deploy:
    name: Deploy and prove ${{ matrix.domain }}
    needs: [build, preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.build.outputs.matrix) }}
    environment:
      name: cryptoworldz-production
      url: https://${{ matrix.domain }}/
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      REMOTE: ${{ matrix.remote_dir }}
      DOMAIN: ${{ matrix.domain }}
      GUARD: ${{ matrix.guard }}
      TITLE: ${{ matrix.title }}
      PACKAGE: apps/oneworldz-ecosystem-release/dist/ecosystem/${{ matrix.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.source }}
      - uses: actions/download-artifact@v4
        with:
          name: oneworldz-perfect-${{ github.run_id }}
          path: apps/oneworldz-ecosystem-release/dist/ecosystem
      - name: Enumerate exact package files
        shell: bash
        run: |
          set -euo pipefail
          test -s "$PACKAGE/index.html"; test -s "$PACKAGE/release-manifest.json"
          node - <<'NODE'
          const fs=require('fs'); const m=JSON.parse(fs.readFileSync(process.env.PACKAGE+'/release-manifest.json'));
          if(m.deploy_guard!==process.env.GUARD||m.ftp_root!=='/'||m.homepage!=='/index.html') throw new Error('release contract mismatch');
          if((m.protected_services_modified||[]).length) throw new Error('protected mutation declared');
          NODE
          (cd "$PACKAGE" && find . -type f -printf '%P\n' | sort) > "$RUNNER_TEMP/files.txt"
          while read -r rel; do mkdir -p "$RUNNER_TEMP/backup/$(dirname "$rel")"; done < "$RUNNER_TEMP/files.txt"
          sed 's#/[^/]*$##' "$RUNNER_TEMP/files.txt" | grep -v '^$' | sort -u > "$RUNNER_TEMP/dirs.txt" || true
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - id: write
        name: Exact-file backup and upload
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          host="$(printf '%s' "$FTP_HOST" | sed -e 's#^ftp[s]*://##' -e 's#/.*$##')"; if [[ "$host" != *:*:* && "$host" == *:* ]]; then host="${host%%:*}"; fi
          echo "::add-mask::$FTP_HOST"; echo "::add-mask::$FTP_USERNAME"; echo "::add-mask::$FTP_PASSWORD"
          {
            echo 'set cmd:fail-exit false'; echo 'set net:max-retries 2'; echo 'set net:timeout 25'; echo 'set ftp:ssl-force true'; echo 'set ftp:ssl-protect-data true'; echo 'set ssl:verify-certificate true'; echo 'set ssl:check-hostname false'; echo "cd $REMOTE"
            while read -r rel; do echo "get $rel -o $RUNNER_TEMP/backup/$rel"; done < "$RUNNER_TEMP/files.txt"
            echo bye
          } > "$RUNNER_TEMP/backup.lftp"
          timeout 600 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/backup.lftp" "$host" || true
          {
            echo 'set cmd:fail-exit false'; echo 'set net:max-retries 3'; echo 'set net:timeout 30'; echo 'set ftp:ssl-force true'; echo 'set ftp:ssl-protect-data true'; echo 'set ssl:verify-certificate true'; echo 'set ssl:check-hostname false'; echo "cd $REMOTE"; echo "lcd $PACKAGE"
            while read -r dir; do [ -n "$dir" ] && echo "mkdir -p $dir"; done < "$RUNNER_TEMP/dirs.txt"
            echo 'set cmd:fail-exit true'
            while read -r rel; do echo "put $rel -o $rel"; done < "$RUNNER_TEMP/files.txt"
            echo bye
          } > "$RUNNER_TEMP/upload.lftp"
          timeout 900 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/upload.lftp" "$host"
      - id: proof
        name: Live title proof
        if: ${{ steps.write.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq 1 30); do
            html="$(curl --fail --silent --show-error --location --connect-timeout 15 --max-time 45 -H 'Cache-Control: no-cache' "https://$DOMAIN/?release=${GITHUB_SHA}-${GITHUB_RUN_ID}" || true)"
            if printf '%s' "$html" | grep -Fq "<title>$TITLE</title>"; then echo "VERIFIED https://$DOMAIN/"; exit 0; fi
            sleep 10
          done
          exit 1
      - name: Restore exact prior files on failed write or proof
        if: ${{ steps.write.outcome == 'failure' || steps.proof.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          host="$(printf '%s' "$FTP_HOST" | sed -e 's#^ftp[s]*://##' -e 's#/.*$##')"; if [[ "$host" != *:*:* && "$host" == *:* ]]; then host="${host%%:*}"; fi
          {
            echo 'set cmd:fail-exit false'; echo 'set net:max-retries 2'; echo 'set net:timeout 25'; echo 'set ftp:ssl-force true'; echo 'set ftp:ssl-protect-data true'; echo 'set ssl:verify-certificate true'; echo 'set ssl:check-hostname false'; echo "cd $REMOTE"
            while read -r rel; do
              if [ -f "$RUNNER_TEMP/backup/$rel" ]; then echo "put $RUNNER_TEMP/backup/$rel -o $rel"; else echo "rm $rel"; fi
            done < "$RUNNER_TEMP/files.txt"
            echo bye
          } > "$RUNNER_TEMP/restore.lftp"
          timeout 900 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/restore.lftp" "$host" || true
      - name: Fail after protected rollback
        if: ${{ steps.write.outcome == 'failure' || steps.proof.outcome == 'failure' }}
        run: exit 1

  complete:
    name: Final whole-system live proof
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MATRIX: ${{ needs.build.outputs.matrix }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          test "$DEPLOY_RESULT" = success
          node -e 'for(const x of JSON.parse(process.env.MATRIX).include) console.log([x.domain,x.title].join("\t"))' > "$RUNNER_TEMP/targets.tsv"
          test "$(wc -l < "$RUNNER_TEMP/targets.tsv" | tr -d ' ')" = 18
          while IFS=$'\t' read -r domain title; do
            html="$(curl --fail --silent --show-error --location --connect-timeout 15 --max-time 45 -H 'Cache-Control: no-cache' "https://$domain/?final=${GITHUB_SHA}-${GITHUB_RUN_ID}")"
            printf '%s' "$html" | grep -Fq "<title>$title</title>"
            echo "VERIFIED https://$domain/"
          done < "$RUNNER_TEMP/targets.tsv"
          curl --fail --silent --show-error --max-time 30 https://cryptobotz.cryptoworldz.xyz/ > "$RUNNER_TEMP/cryptobotz.html"
          test -s "$RUNNER_TEMP/cryptobotz.html"
          echo 'VERIFIED protected https://cryptobotz.cryptoworldz.xyz/'
