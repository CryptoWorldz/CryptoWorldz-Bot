name: REVIVE Squads Mainnet Cost Preflight

on:
  workflow_dispatch:
  push:
    branches:
      - revive-v1-build
    paths:
      - 'worldzpad-devnet/revive-party/scripts/12_squads_mainnet_execution_cost_preflight.mjs'
      - '.github/workflows/revive-squads-mainnet-cost-preflight.yml'
      - 'worldzpad-mainnet/revive/revive-launch-contract.v1.json'
      - 'worldzpad-mainnet/revive/revive-direct-damm-v2-existing-mint.v1.json'
  pull_request:
    paths:
      - 'worldzpad-devnet/revive-party/scripts/12_squads_mainnet_execution_cost_preflight.mjs'
      - '.github/workflows/revive-squads-mainnet-cost-preflight.yml'
      - 'worldzpad-mainnet/revive/revive-launch-contract.v1.json'
      - 'worldzpad-mainnet/revive/revive-direct-damm-v2-existing-mint.v1.json'

permissions:
  contents: read

concurrency:
  group: revive-squads-mainnet-cost-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOLANA_MAINNET_RPC_URL: ${{ secrets.LEGACY_READ_RPC_URL }}
    defaults:
      run:
        working-directory: worldzpad-devnet/revive-party
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned REVIVE dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned Squads v4 SDK for read-only preflight
        run: npm install --no-save --no-package-lock --no-audit --no-fund @sqds/multisig@2.1.4
      - name: Run Squads-aware REVIVE mainnet cost preflight — READ ONLY
        run: node scripts/12_squads_mainnet_execution_cost_preflight.mjs
      - name: Publish cost evidence (best effort)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: revive-squads-mainnet-cost-preflight
          path: worldzpad-devnet/revive-party/artifacts/revive-squads-mainnet-execution-cost-preflight.json
          if-no-files-found: warn
          retention-days: 7
