name: OneWorldz Final Footer 100 Pass

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/footer-final-100.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: oneworldz-footer-final-100
  cancel-in-progress: false

jobs:
  final-footer-pass:
    name: Build → Footer Repair → Live 100 Proof
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - id: canonical
        name: Full canonical build + tests + SEO gate
        run: |
          set -euo pipefail
          npm run verify
          npm --prefix apps/oneworldz-ecosystem-release test
          npm audit --audit-level=high

      - id: runtime
        name: Prove content-hashed runtime and exact footer source contract
        shell: bash
        run: |
          set -euo pipefail
          root='apps/oneworldz-ecosystem-release/dist/ecosystem'
          test "$(find "$root" -type f -name '*.html' | wc -l | tr -d ' ')" = '35'
          ! grep -RFl --include='*.html' 'src="/assets/js/site.js"' "$root"
          node --input-type=module <<'NODE'
          import { readFile, readdir } from 'node:fs/promises';
          import path from 'node:path';
          import { productionTargets } from './apps/oneworldz-ecosystem-release/production-targets.mjs';
          const root = 'apps/oneworldz-ecosystem-release/dist/ecosystem';
          const exact = "Created with the Vision When Someone say's You can't Change the World 🌐 just Say “Why can't I?”";
          let pages = 0;
          async function files(dir, rel='') {
            const out=[];
            for (const e of await readdir(path.join(dir,rel),{withFileTypes:true})) {
              const c=path.join(rel,e.name);
              if(e.isDirectory()) out.push(...await files(dir,c)); else out.push(c);
            }
            return out;
          }
          for (const target of productionTargets) {
            const dir=path.join(root,target.key);
            const manifest=JSON.parse(await readFile(path.join(dir,'release-manifest.json'),'utf8'));
            if (!/^\/assets\/js\/site\.[0-9a-f]{12}\.js$/.test(manifest.runtime?.site_script || '')) throw new Error(`${target.key}: hashed runtime missing`);
            const runtime=path.join(dir, manifest.runtime.site_script.slice(1));
            await readFile(runtime);
            for (const file of (await files(dir)).filter((f)=>f.endsWith('.html'))) {
              pages++;
              const html=await readFile(path.join(dir,file),'utf8');
              if (!html.includes(`src="${manifest.runtime.site_script}"`)) throw new Error(`${target.key}/${file}: hashed runtime ref missing`);
              const match=html.match(/<footer class="site-footer vision-footer">([\s\S]*?)<\/footer>/);
              if (!match) throw new Error(`${target.key}/${file}: permanent footer missing`);
              if (/<a\b/i.test(match[1])) throw new Error(`${target.key}/${file}: footer contains link in source`);
              const text=match[1].replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();
              if (text !== exact) throw new Error(`${target.key}/${file}: footer source text drift: ${text}`);
            }
          }
          if (pages !== 35) throw new Error(`Expected 35 pages, got ${pages}`);
          console.log(`HASHED_RUNTIME_SOURCE_PASS pages=${pages}`);
          NODE

      - name: Install browser proof runtime
        working-directory: apps/oneworldz-ecosystem-release
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - id: candidate
        name: Candidate desktop + mobile proof — 18 sites / 35 pages
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p candidate-proof
          cd apps/oneworldz-ecosystem-release
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/candidate-targets.tsv"
          import { productionTargets } from './production-targets.mjs';
          for (const target of productionTargets) console.log([target.key,target.expectedTitle,target.requiredIdentityText,target.requiredIdentityImage].join('\t'));
          NODE
          test "$(wc -l < "$RUNNER_TEMP/candidate-targets.tsv" | tr -d ' ')" = '18' || exit 1
          failed=0
          while IFS=$'\t' read -r key title required_text required_image; do
            node browser-visual-proof.mjs \
              --name "$key" \
              --root "dist/ecosystem/$key" \
              --expected-title "$title" \
              --required-text "$required_text" \
              --required-image "$required_image" \
              --out "$GITHUB_WORKSPACE/candidate-proof/$key" || failed=1
          done < "$RUNNER_TEMP/candidate-targets.tsv"
          test "$(find "$GITHUB_WORKSPACE/candidate-proof" -mindepth 2 -maxdepth 2 -name visual-report.json | wc -l | tr -d ' ')" = '18' || failed=1
          test "$(find "$GITHUB_WORKSPACE/candidate-proof" -mindepth 2 -maxdepth 2 -name desktop.png | wc -l | tr -d ' ')" = '18' || failed=1
          test "$(find "$GITHUB_WORKSPACE/candidate-proof" -mindepth 2 -maxdepth 2 -name mobile.png | wc -l | tr -d ' ')" = '18' || failed=1
          exit "$failed"

      - name: Install FTPS client
        if: ${{ steps.candidate.outcome == 'success' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - id: deploy
        name: Exact targeted footer-runtime deployment with rollback on byte failure
        if: ${{ steps.candidate.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          host="$(printf '%s' "$FTP_HOST" | sed -e 's#^ftp[s]*://##' -e 's#/.*$##')"
          if [[ "$host" != *:*:* && "$host" == *:* ]]; then host="${host%%:*}"; fi
          test -n "$host" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          echo "::add-mask::$FTP_HOST"
          echo "::add-mask::$FTP_USERNAME"
          echo "::add-mask::$FTP_PASSWORD"

          cd apps/oneworldz-ecosystem-release
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/footer-targets.tsv"
          import { productionTargets } from './production-targets.mjs';
          const affected = new Set(['ethworldz','baseworldz','bnbworldz','hodlerworldz','purplediamondcrew','law-oneworldz','learn-oneworldz','hodlergalaxy','donateworldz']);
          for (const target of productionTargets.filter((t)=>affected.has(t.key))) console.log([target.key,target.domain,target.hostingerTransportDir].join('\t'));
          NODE
          test "$(wc -l < "$RUNNER_TEMP/footer-targets.tsv" | tr -d ' ')" = '9'
          cd "$GITHUB_WORKSPACE"

          : > "$RUNNER_TEMP/touched.tsv"
          failure=0
          failed_key=''
          while IFS=$'\t' read -r key domain transport; do
            release_root="$GITHUB_WORKSPACE/apps/oneworldz-ecosystem-release/dist/ecosystem/$key"
            backup="$RUNNER_TEMP/footer-backups/$key"
            post="$RUNNER_TEMP/footer-post/$key"
            mkdir -p "$backup" "$post"
            runtime="$(node -e 'const fs=require("fs");const m=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));process.stdout.write(m.runtime.site_script.replace(/^\//,""));' "$release_root/release-manifest.json")"
            [[ "$runtime" =~ ^assets/js/site\.[0-9a-f]{12}\.js$ ]] || { failure=1; failed_key="$key"; break; }
            test -s "$release_root/$runtime" || { failure=1; failed_key="$key"; break; }
            htmls="$RUNNER_TEMP/$key.htmls"
            (cd "$release_root" && grep -RIl --include='*.html' "src=\"/$runtime\"" . | sed 's#^\./##' | sort) > "$htmls"
            test -s "$htmls" || { failure=1; failed_key="$key"; break; }
            files="$RUNNER_TEMP/$key.files"
            { echo "$runtime"; echo 'release-manifest.json'; cat "$htmls"; } | sort -u > "$files"
            existing="$RUNNER_TEMP/$key.existing"
            while IFS= read -r rel; do mkdir -p "$backup/$(dirname "$rel")" "$post/$(dirname "$rel")"; done < "$files"

            {
              echo 'set cmd:fail-exit false'
              echo 'set net:max-retries 2'
              echo 'set net:timeout 30'
              echo 'set ftp:ssl-force true'
              echo 'set ftp:ssl-protect-data true'
              echo 'set ssl:verify-certificate true'
              echo 'set ssl:check-hostname false'
              printf 'cd "%s"\n' "$transport"
              echo 'pwd'
              echo 'cls -la'
              while IFS= read -r rel; do printf 'get "%s" -o "%s"\n' "$rel" "$backup/$rel"; done < "$files"
              echo 'bye'
            } > "$RUNNER_TEMP/$key.backup.lftp"
            timeout 600 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/$key.backup.lftp" "$host" || { failure=1; failed_key="$key"; break; }
            (cd "$backup" && find . -type f -printf '%P\n' | sort) > "$existing"
            printf '%s\t%s\t%s\n' "$key" "$domain" "$transport" >> "$RUNNER_TEMP/touched.tsv"

            {
              echo 'set cmd:fail-exit true'
              echo 'set net:max-retries 3'
              echo 'set net:timeout 30'
              echo 'set ftp:ssl-force true'
              echo 'set ftp:ssl-protect-data true'
              echo 'set ssl:verify-certificate true'
              echo 'set ssl:check-hostname false'
              printf 'cd "%s"\n' "$transport"
              printf 'mkdir -p "assets"\nmkdir -p "assets/js"\n'
              printf 'lcd "%s"\n' "$release_root"
              printf 'put "%s" -o "%s"\n' "$runtime" "$runtime"
              printf 'put "release-manifest.json" -o "release-manifest.json"\n'
              while IFS= read -r rel; do
                dir="$(dirname "$rel")"; [ "$dir" = '.' ] || printf 'mkdir -p "%s"\n' "$dir"
                printf 'put "%s" -o "%s"\n' "$rel" "$rel"
              done < "$htmls"
              echo 'bye'
            } > "$RUNNER_TEMP/$key.upload.lftp"
            if ! timeout 900 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/$key.upload.lftp" "$host"; then failure=1; failed_key="$key"; break; fi

            {
              echo 'set cmd:fail-exit true'
              echo 'set net:max-retries 2'
              echo 'set net:timeout 30'
              echo 'set ftp:ssl-force true'
              echo 'set ftp:ssl-protect-data true'
              echo 'set ssl:verify-certificate true'
              echo 'set ssl:check-hostname false'
              printf 'cd "%s"\n' "$transport"
              while IFS= read -r rel; do printf 'get "%s" -o "%s"\n' "$rel" "$post/$rel"; done < "$files"
              echo 'bye'
            } > "$RUNNER_TEMP/$key.post.lftp"
            if ! timeout 600 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/$key.post.lftp" "$host"; then failure=1; failed_key="$key"; break; fi
            while IFS= read -r rel; do cmp -s "$release_root/$rel" "$post/$rel" || { failure=1; failed_key="$key"; break 2; }; done < "$files"

            public_runtime="$RUNNER_TEMP/$key.public.js"
            proved=0
            for attempt in $(seq 1 8); do
              if curl --fail --silent --show-error --location --connect-timeout 15 --max-time 45 -H 'Cache-Control: no-cache, no-store' "https://$domain/$runtime?footer_runtime=${GITHUB_RUN_ID}-${attempt}" -o "$public_runtime" && cmp -s "$release_root/$runtime" "$public_runtime"; then proved=1; break; fi
              sleep 5
            done
            if [ "$proved" != '1' ]; then failure=1; failed_key="$key"; break; fi
            echo "FOOTER_RUNTIME_EXACT_BYTES_PROVED https://$domain/$runtime"
          done < "$RUNNER_TEMP/footer-targets.tsv"

          if [ "$failure" = '1' ]; then
            echo "::error::Footer deployment byte proof failed at $failed_key; rolling back touched targets."
            while IFS=$'\t' read -r key domain transport; do
              files="$RUNNER_TEMP/$key.files"
              existing="$RUNNER_TEMP/$key.existing"
              backup="$RUNNER_TEMP/footer-backups/$key"
              {
                echo 'set cmd:fail-exit false'
                echo 'set net:max-retries 2'
                echo 'set net:timeout 30'
                echo 'set ftp:ssl-force true'
                echo 'set ftp:ssl-protect-data true'
                echo 'set ssl:verify-certificate true'
                echo 'set ssl:check-hostname false'
                printf 'cd "%s"\n' "$transport"
                while IFS= read -r rel; do printf 'rm -f "%s"\n' "$rel"; done < "$files"
                printf 'lcd "%s"\n' "$backup"
                while IFS= read -r rel; do
                  dir="$(dirname "$rel")"; [ "$dir" = '.' ] || printf 'mkdir -p "%s"\n' "$dir"
                  printf 'put "%s" -o "%s"\n' "$rel" "$rel"
                done < "$existing"
                echo 'bye'
              } > "$RUNNER_TEMP/$key.rollback.lftp"
              timeout 900 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/$key.rollback.lftp" "$host" || true
              echo "ROLLBACK_ATTEMPTED https://$domain/"
            done < <(tac "$RUNNER_TEMP/touched.tsv")
            exit 1
          fi
          test "$(wc -l < "$RUNNER_TEMP/touched.tsv" | tr -d ' ')" = '9'
          echo 'TARGETED_FOOTER_RUNTIME_DEPLOYMENT_PASS_9_OF_9'

      - id: live
        name: Live desktop + mobile proof — all 18 sites / every sitemap page
        if: ${{ steps.deploy.outcome == 'success' }}
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p live-proof
          cd apps/oneworldz-ecosystem-release
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/live-targets.tsv"
          import { productionTargets } from './production-targets.mjs';
          for (const target of productionTargets) console.log([target.key,target.domain,target.expectedTitle,target.requiredIdentityText,target.requiredIdentityImage].join('\t'));
          NODE
          test "$(wc -l < "$RUNNER_TEMP/live-targets.tsv" | tr -d ' ')" = '18' || exit 1
          failed=0
          while IFS=$'\t' read -r key domain title required_text required_image; do
            node browser-visual-proof.mjs \
              --name "$key" \
              --url "https://$domain/?footer_final_proof=${GITHUB_RUN_ID}-${key}" \
              --expected-title "$title" \
              --required-text "$required_text" \
              --required-image "$required_image" \
              --out "$GITHUB_WORKSPACE/live-proof/$key" || failed=1
          done < "$RUNNER_TEMP/live-targets.tsv"
          test "$(find "$GITHUB_WORKSPACE/live-proof" -mindepth 2 -maxdepth 2 -name visual-report.json | wc -l | tr -d ' ')" = '18' || failed=1
          test "$(find "$GITHUB_WORKSPACE/live-proof" -mindepth 2 -maxdepth 2 -name desktop.png | wc -l | tr -d ' ')" = '18' || failed=1
          test "$(find "$GITHUB_WORKSPACE/live-proof" -mindepth 2 -maxdepth 2 -name mobile.png | wc -l | tr -d ' ')" = '18' || failed=1
          exit "$failed"

      - id: cryptobotz
        name: Prove protected CryptoBotz remained separate
        if: ${{ steps.live.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl --fail --silent --show-error --location --connect-timeout 15 --max-time 30 -H 'Cache-Control: no-cache' https://cryptobotz.cryptoworldz.xyz/health)"
          printf '%s' "$health" | grep -Fq '"ok":true'
          root="$(curl --fail --silent --show-error --location --connect-timeout 15 --max-time 30 -H 'Cache-Control: no-cache' https://cryptobotz.cryptoworldz.xyz/)"
          test -n "$root"

      - name: Upload final proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneworldz-footer-final-100-${{ github.run_id }}
          path: |
            candidate-proof/
            live-proof/
          if-no-files-found: warn
          retention-days: 30

      - name: Record self-reporting final result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result=FAIL
          if [ '${{ steps.canonical.outcome }}' = 'success' ] \
            && [ '${{ steps.runtime.outcome }}' = 'success' ] \
            && [ '${{ steps.candidate.outcome }}' = 'success' ] \
            && [ '${{ steps.deploy.outcome }}' = 'success' ] \
            && [ '${{ steps.live.outcome }}' = 'success' ] \
            && [ '${{ steps.cryptobotz.outcome }}' = 'success' ]; then result=PASS; fi
          mkdir -p deployments
          cat > deployments/footer-final-100.status <<EOF
          result=$result
          run_id=${GITHUB_RUN_ID}
          commit=${GITHUB_SHA}
          canonical_build=${{ steps.canonical.outcome }}
          runtime_contract=${{ steps.runtime.outcome }}
          candidate_18_site_35_page_desktop_mobile=${{ steps.candidate.outcome }}
          targeted_footer_deploy_9_sites=${{ steps.deploy.outcome }}
          live_18_site_all_sitemap_desktop_mobile=${{ steps.live.outcome }}
          protected_cryptobotz=${{ steps.cryptobotz.outcome }}
          proof_artifact=oneworldz-footer-final-100-${GITHUB_RUN_ID}
          final_100_percent_pass=$result
          EOF
          git config user.name 'OneWorldz Final Gate'
          git config user.email 'jayjayteamdev@outlook.com'
          git add deployments/footer-final-100.status
          git commit -m "RECORD ONEWORLDZ FOOTER FINAL 100 RESULT" || true
          git push origin HEAD:main
