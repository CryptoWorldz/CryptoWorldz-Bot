name: Fix Reagan GoFundMe Live Link

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/fix-reagan-gofundme.request'

permissions:
  contents: write

concurrency:
  group: fix-reagan-gofundme
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Confirm explicit repair request
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's/^confirmation=//p' diagnostics/fix-reagan-gofundme.request | tail -n1)" = 'APPROVE REAGAN GOFUNDME LIVE LINK REPAIR'

      - name: Replace only the banned fundraiser URL and bust Telegram cache
        shell: bash
        run: |
          set -euo pipefail
          old='https://gofund.me/65129e58a'
          new='https://www.gofundme.com/f/action-spread-smiles-organisation'
          grep -Fq "$old" public/miniapp/app.js
          sed -i "s#${old}#${new}#g" public/miniapp/app.js
          grep -Fq "$new" public/miniapp/app.js
          if grep -Fq "$old" public/miniapp/app.js; then
            echo '::error::Banned fundraiser URL still exists in Mini App source.'
            exit 1
          fi
          sed -i -E 's#(/miniapp/app\.js\?v=)[0-9.]+#\13.0.9#g' public/miniapp/index.html
          grep -Fq '/miniapp/app.js?v=3.0.9' public/miniapp/index.html

      - name: Verify Zed before commit
        run: |
          set -euo pipefail
          npm ci
          npm run verify
          npm audit --audit-level=high

      - name: Commit exact repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'CryptoWorldz Repair Bot'
          git config user.email 'jayjayteamdev@outlook.com'
          git add public/miniapp/app.js public/miniapp/index.html
          git diff --cached --check
          git diff --cached --quiet && { echo '::error::No repair changes detected.'; exit 1; }
          git commit -m 'Fix Reagan GoFundMe link in Zed Mini App'
          git push origin HEAD:main

      - name: Repair summary
        if: always()
        run: |
          {
            echo '## Reagan GoFundMe repair'
            echo
            echo '- Replaces only the stale banned fundraiser URL'
            echo '- Sets current fundraiser: action-spread-smiles-organisation'
            echo '- Bumps app.js cache key to v3.0.9'
            echo '- Requires full Zed verification before commit'
          } >> "$GITHUB_STEP_SUMMARY"
