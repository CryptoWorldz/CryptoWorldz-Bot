name: Diagnose OneWorldz Web Root Paths

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/oneworldz-root-cd.request'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: oneworldz-production
    env:
      FTP_HOST: '145.223.108.40'
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: '21'
      FTP_ACCOUNT_SCOPE: ${{ vars.FTP_ACCOUNT_SCOPE }}
      DEPLOY_GUARD: ${{ vars.DEPLOY_GUARD }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate read-only request and OneWorldz guard
        shell: bash
        env:
          APPROVED_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test -f diagnostics/oneworldz-root-cd.request
          test "$(sed -n 's/^confirmation=//p' diagnostics/oneworldz-root-cd.request | tail -n1)" = 'APPROVE READ ONLY DIAGNOSTIC'
          test "$(sed -n 's/^source_commit=//p' diagnostics/oneworldz-root-cd.request | tail -n1)" = "$APPROVED_BEFORE"
          [[ "$FTP_ACCOUNT_SCOPE" == 'DOMAIN_ONLY' ]]
          [[ "$DEPLOY_GUARD" == 'ONEWORLDZ.COM' ]]
          [[ -n "$FTP_USERNAME" && -n "$FTP_PASSWORD" ]]
          echo "::add-mask::$FTP_USERNAME"

      - name: Install FTP client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Test exact candidate paths without directory listing
        id: paths
        shell: bash
        run: |
          set +e

          check_path() {
            label="$1"
            candidate="$2"
            echo "=== $label : $candidate ==="
            timeout 20 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 1
          set net:timeout 10
          set net:idle 10
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          cd "$candidate"
          pwd
          bye
          LFTP
            result=$?
            echo "${label}_exit=$result"
            echo "${label}_exit=$result" >> "$GITHUB_OUTPUT"
          }

          check_path root /
          check_path public_html /public_html
          check_path domain_public_html /domains/oneworldz.com/public_html
          check_path domain_root /domains/oneworldz.com
          exit 0

      - name: Publish result summary
        shell: bash
        run: |
          {
            echo '## OneWorldz web-root path checks'
            echo
            echo '- Read only: no listing, upload, delete, rename, or DNS change.'
            echo "- / exit: ${{ steps.paths.outputs.root_exit }}"
            echo "- /public_html exit: ${{ steps.paths.outputs.public_html_exit }}"
            echo "- /domains/oneworldz.com/public_html exit: ${{ steps.paths.outputs.domain_public_html_exit }}"
            echo "- /domains/oneworldz.com exit: ${{ steps.paths.outputs.domain_root_exit }}"
          } >> "$GITHUB_STEP_SUMMARY"
