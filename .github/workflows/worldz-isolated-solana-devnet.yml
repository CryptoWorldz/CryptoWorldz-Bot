name: WORLDZ isolated Solana devnet mint proof
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  devnet-mint:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: worldzpad-devnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - name: Execute isolated devnet mint and verify supply
        run: node scripts/08_worldz_isolated_devnet_mint.mjs
      - name: Upload public proof only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldz-solana-devnet-public-proof
          path: worldzpad-devnet/artifacts/worldz-solana-devnet-proof.json
          if-no-files-found: warn
