name: Deploy Locked OneWorldz Ecosystem Total

on:
  push:
    branches: [main]
    paths:
      - 'deployments/locked-ecosystem-total.request'
      - 'apps/oneworldz-ecosystem-release/**'
      - '.github/workflows/deploy-locked-ecosystem-total.yml'

permissions:
  contents: read

concurrency:
  group: locked-oneworldz-ecosystem-production
  cancel-in-progress: true

jobs:
  authorize:
    name: Lock total-deployment authority
    runs-on: ubuntu-latest
    outputs:
      source_commit: ${{ steps.lock.outputs.source_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: lock
        shell: bash
        run: |
          set -euo pipefail
          request='deployments/locked-ecosystem-total.request'
          test -s "$request"
          requested_by="$(grep -E '^requested_by=' "$request" | tail -n1 | cut -d= -f2-)"
          authorization="$(grep -E '^authorization=' "$request" | tail -n1 | cut -d= -f2-)"
          scope="$(grep -E '^scope=' "$request" | tail -n1 | cut -d= -f2-)"
          source_commit="$(git rev-parse HEAD)"
          test "$requested_by" = 'JayJayTeamDev'
          test "$authorization" = 'APPROVE COMPLETE ECOSYSTEM BUILD AND TOTAL DEPLOYMENT'
          test "$scope" = 'LOCKED-ONEWORLDZ-ECOSYSTEM-15-STATIC-TARGETS'
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"

  validate:
    name: Build and prove complete locked release
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.source_commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run complete locked release gate
        working-directory: apps/oneworldz-ecosystem-release
        run: npm run verify
      - name: Reject protected or unsafe release content
        shell: bash
        run: |
          set -euo pipefail
          root='apps/oneworldz-ecosystem-release/dist/ecosystem'
          test ! -d "$root/oneworldz"
          test ! -d "$root/cryptobotz"
          ! grep -RIE 'gofundme|go fund me|coming soon|one-world-one-mission\.webp|100002482[01]|Screenshot_2026' "$root" --include='*.html'
          ! grep -RIE 'sk_live_|sk_test_|service_role|FTP_PASSWORD|DATABASE_URL|SUPABASE_SERVICE' "$root"
          test "$(find "$root" -mindepth 2 -maxdepth 2 -name index.html | wc -l | tr -d ' ')" = '15'
      - uses: actions/upload-artifact@v4
        with:
          name: locked-ecosystem-verified-${{ github.run_id }}
          path: apps/oneworldz-ecosystem-release/dist/ecosystem/
          if-no-files-found: error
          retention-days: 30

  preflight-fleet:
    name: Prepare and prove all Hostinger target directories
    needs: [authorize, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
    steps:
      - name: Install verified FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Prepare and prove all fifteen exact website roots before any upload
        shell: bash
        run: |
          set -euo pipefail
          domains=(cryptoworldz.xyz solworldz.xyz ethworldz.xyz baseworldz.xyz bnbworldz.xyz xrpworldz.xyz suiworldz.xyz hyperworldz.xyz robinworldz.xyz bitcoinworldz.xyz hodlerworldz.xyz purplediamondcrew.com impactbased.oneworldz.com law.oneworldz.com learn.oneworldz.com)
          raw_host="$(printf '%s' "$FTP_HOST" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#^ftp://##' -e 's#^ftps://##' -e 's#/.*$##')"
          if [[ "$raw_host" != *:*:* && "$raw_host" == *:* ]]; then raw_host="${raw_host%%:*}"; fi
          ftp_ip="$(getent ahostsv4 "$raw_host" | awk 'NR==1{print $1}')"
          test -n "$ftp_ip"
          tls_ok=false
          for attempt in 1 2 3; do
            if timeout 30 openssl s_client -starttls ftp -connect "$ftp_ip:$FTP_PORT" -verify_return_error -CAfile /etc/ssl/certs/ca-certificates.crt </dev/null >/dev/null 2>&1; then
              tls_ok=true
              break
            fi
            sleep 3
          done
          test "$tls_ok" = true
          echo 'Hostinger domains visible to the deployment account:'
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" "$ftp_ip" <<EOF
          set cmd:fail-exit true
          set net:max-retries 1
          set net:timeout 30
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          cd domains
          cls -1
          bye
          EOF
          for domain in "${domains[@]}"; do
            remote_dir="domains/$domain/public_html"
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" "$ftp_ip" <<EOF
          set cmd:fail-exit true
          set net:max-retries 1
          set net:timeout 30
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          mkdir -p $remote_dir
          cd $remote_dir
          cls -1
          bye
          EOF
          done
  deploy:
    name: Backup, deploy and prove ${{ matrix.domain }}
    needs: [authorize, validate, preflight-fleet]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - key: cryptoworldz
            domain: cryptoworldz.xyz
            remote_dir: domains/cryptoworldz.xyz/public_html
            environment: cryptoworldz-production
            guard: CRYPTOWORLDZ.XYZ
            expected_title: CryptoWorldz | One World • One Mission
          - key: solworldz
            domain: solworldz.xyz
            remote_dir: domains/solworldz.xyz/public_html
            environment: solworldz-production
            guard: SOLWORLDZ.XYZ
            expected_title: SolWorldz | One World • One Mission
          - key: ethworldz
            domain: ethworldz.xyz
            remote_dir: domains/ethworldz.xyz/public_html
            environment: ethworldz-production
            guard: ETHWORLDZ.XYZ
            expected_title: EthWorldz | One World • One Mission
          - key: baseworldz
            domain: baseworldz.xyz
            remote_dir: domains/baseworldz.xyz/public_html
            environment: baseworldz-production
            guard: BASEWORLDZ.XYZ
            expected_title: BaseWorldz | One World • One Mission
          - key: bnbworldz
            domain: bnbworldz.xyz
            remote_dir: domains/bnbworldz.xyz/public_html
            environment: bnbworldz-production
            guard: BNBWORLDZ.XYZ
            expected_title: BNBWorldz | One World • One Mission
          - key: xrpworldz
            domain: xrpworldz.xyz
            remote_dir: domains/xrpworldz.xyz/public_html
            environment: xrpworldz-production
            guard: XRPWORLDZ.XYZ
            expected_title: XRPWorldz | One World • One Mission
          - key: suiworldz
            domain: suiworldz.xyz
            remote_dir: domains/suiworldz.xyz/public_html
            environment: suiworldz-production
            guard: SUIWORLDZ.XYZ
            expected_title: SuiWorldz | One World • One Mission
          - key: hyperworldz
            domain: hyperworldz.xyz
            remote_dir: domains/hyperworldz.xyz/public_html
            environment: hyperworldz-production
            guard: HYPERWORLDZ.XYZ
            expected_title: HyperWorldz | One World • One Mission
          - key: robinworldz
            domain: robinworldz.xyz
            remote_dir: domains/robinworldz.xyz/public_html
            environment: robinworldz-production
            guard: ROBINWORLDZ.XYZ
            expected_title: RobinWorldz | One World • One Mission
          - key: bitcoinworldz
            domain: bitcoinworldz.xyz
            remote_dir: domains/bitcoinworldz.xyz/public_html
            environment: bitcoinworldz-production
            guard: BITCOINWORLDZ.XYZ
            expected_title: BitcoinWorldz | One World • One Mission
          - key: hodlerworldz
            domain: hodlerworldz.xyz
            remote_dir: domains/hodlerworldz.xyz/public_html
            environment: hodlerworldz-production
            guard: HODLERWORLDZ.XYZ
            expected_title: HodlerWorldz | One World • One Mission
          - key: purplediamondcrew
            domain: purplediamondcrew.com
            remote_dir: domains/purplediamondcrew.com/public_html
            environment: purplediamondcrew-production
            guard: PURPLEDIAMONDCREW.COM
            expected_title: Purple Diamond Crew | The Legacy Lives On
          - key: impactbased
            domain: impactbased.oneworldz.com
            remote_dir: domains/impactbased.oneworldz.com/public_html
            environment: impactbased-production
            guard: IMPACTBASED.ONEWORLDZ.COM
            expected_title: ImpactBased | Purpose-Driven Launch Board
          - key: law-oneworldz
            domain: law.oneworldz.com
            remote_dir: domains/law.oneworldz.com/public_html
            environment: law-oneworldz-production
            guard: LAW.ONEWORLDZ.COM
            expected_title: Law.OneWorldz | Public Information
          - key: learn-oneworldz
            domain: learn.oneworldz.com
            remote_dir: domains/learn.oneworldz.com/public_html
            environment: learn-oneworldz-production
            guard: LEARN.ONEWORLDZ.COM
            expected_title: Learn.OneWorldz | Knowledge Creates Power
    environment:
      name: ${{ matrix.environment }}
      url: https://${{ matrix.domain }}/
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      FTP_REMOTE_DIR: ${{ matrix.remote_dir }}
      EXPECTED_REMOTE_DIR: domains/${{ matrix.domain }}/public_html
      FTP_ACCOUNT_SCOPE: SHARED_ACCOUNT_EXACT_TARGET
      DEPLOY_GUARD: ${{ matrix.guard }}
      EXPECTED_GUARD: ${{ matrix.guard }}
      LIVE_URL: https://${{ matrix.domain }}/
      EXPECTED_TITLE: ${{ matrix.expected_title }}
      RELEASE_ROOT: apps/oneworldz-ecosystem-release/dist/ecosystem/${{ matrix.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.source_commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download exact verified release package
        uses: actions/download-artifact@v4
        with:
          name: locked-ecosystem-verified-${{ github.run_id }}
          path: apps/oneworldz-ecosystem-release/dist/ecosystem
      - name: Enforce exact domain-only Hostinger destination
        shell: bash
        run: |
          set -euo pipefail
          test "$FTP_ACCOUNT_SCOPE" = 'SHARED_ACCOUNT_EXACT_TARGET'
          test "$FTP_REMOTE_DIR" = "$EXPECTED_REMOTE_DIR"
          [[ "$FTP_REMOTE_DIR" =~ ^domains/[a-z0-9.-]+/public_html$ ]]
          test "$DEPLOY_GUARD" = "$EXPECTED_GUARD"
          test -n "$FTP_HOST"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          test -s "$RELEASE_ROOT/index.html"
          test -d "$RELEASE_ROOT/assets"
          test ! -e "$RELEASE_ROOT/public_html"
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync(process.env.RELEASE_ROOT + '/release-manifest.json'));
          if (manifest.deploy_guard !== process.env.EXPECTED_GUARD) throw new Error('Release guard mismatch');
          if (manifest.ftp_root !== '/' || manifest.homepage !== '/index.html') throw new Error('Release root contract mismatch');
          if (manifest.protected_services_modified.length) throw new Error('Protected-service mutation declared');
          NODE
          echo "::add-mask::$FTP_HOST"
          echo "::add-mask::$FTP_USERNAME"
          echo "::add-mask::$FTP_PASSWORD"
      - name: Install verified FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Establish CA-verified Hostinger FTPS identity
        shell: bash
        run: |
          set -euo pipefail
          raw_host="$(printf '%s' "$FTP_HOST" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#^ftp://##' -e 's#^ftps://##' -e 's#/.*$##')"
          if [[ "$raw_host" != *:*:* && "$raw_host" == *:* ]]; then raw_host="${raw_host%%:*}"; fi
          ftp_ip="$(getent ahostsv4 "$raw_host" | awk 'NR==1{print $1}')"
          test -n "$ftp_ip"
          tls_ok=false
          for attempt in 1 2 3; do
            if timeout 30 openssl s_client -starttls ftp -connect "$ftp_ip:$FTP_PORT" -verify_return_error -CAfile /etc/ssl/certs/ca-certificates.crt -showcerts </dev/null > "$RUNNER_TEMP/ftps-cert.txt" 2>&1; then
              tls_ok=true
              break
            fi
            sleep 3
          done
          test "$tls_ok" = true
          awk '/-----BEGIN CERTIFICATE-----/{p=1} p{print} /-----END CERTIFICATE-----/{exit}' "$RUNNER_TEMP/ftps-cert.txt" > "$RUNNER_TEMP/ftps-leaf.pem"
          test -s "$RUNNER_TEMP/ftps-leaf.pem"
          fingerprint="$(openssl x509 -in "$RUNNER_TEMP/ftps-leaf.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          test -n "$fingerprint"
          {
            echo "FTP_CONNECT_HOST=$ftp_ip"
            echo "FTP_CERT_SHA256=$fingerprint"
          } >> "$GITHUB_ENV"
          echo "::add-mask::$ftp_ip"
      - name: Back up complete current domain root
        shell: bash
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/predeploy-backup"
          mkdir -p "$backup"
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_CONNECT_HOST" <<EOF
          set cmd:fail-exit true
          set net:max-retries 1
          set net:timeout 30
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          cd $FTP_REMOTE_DIR
          mirror --verbose --parallel=2 --exclude-glob .well-known --exclude-glob .well-known/** . $backup
          bye
          EOF
          if test "$(find "$backup" -type f | wc -l | tr -d ' ')" -eq 0; then
            touch "$backup/.predeploy-empty-root"
          fi
          echo "BACKUP_DIR=$backup" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: predeploy-backup-${{ matrix.key }}-${{ github.run_id }}
          path: ${{ runner.temp }}/predeploy-backup
          if-no-files-found: error
          retention-days: 30
      - name: Upload locked package with index last
        shell: bash
        run: |
          set -euo pipefail
          echo 'DEPLOY_STARTED=true' >> "$GITHUB_ENV"
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_CONNECT_HOST" <<EOF
          set cmd:fail-exit true
          set net:max-retries 1
          set net:timeout 30
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          cd $FTP_REMOTE_DIR
          mirror -R --verbose --parallel=2 --exclude-glob index.html --exclude-glob release-manifest.json --exclude-glob .well-known --exclude-glob .well-known/** $RELEASE_ROOT .
          put $RELEASE_ROOT/release-manifest.json -o release-manifest.json
          put $RELEASE_ROOT/index.html -o index.html
          bye
          EOF
      - name: Prove pinned FTPS identity stayed stable
        shell: bash
        run: |
          set -euo pipefail
          timeout 30 openssl s_client -starttls ftp -connect "$FTP_CONNECT_HOST:$FTP_PORT" -verify_return_error -CAfile /etc/ssl/certs/ca-certificates.crt -showcerts </dev/null > "$RUNNER_TEMP/ftps-cert-after.txt" 2>&1
          awk '/-----BEGIN CERTIFICATE-----/{p=1} p{print} /-----END CERTIFICATE-----/{exit}' "$RUNNER_TEMP/ftps-cert-after.txt" > "$RUNNER_TEMP/ftps-leaf-after.pem"
          after="$(openssl x509 -in "$RUNNER_TEMP/ftps-leaf-after.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$after" = "$FTP_CERT_SHA256"
      - name: Prove origin files exactly match manifest
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/origin-proof"
          mkdir -p "$proof"
          script="$RUNNER_TEMP/download-release.lftp"
          node - "$proof" "$script" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const proof = process.argv[2];
          const script = process.argv[3];
          const manifest = JSON.parse(fs.readFileSync(process.env.RELEASE_ROOT + '/release-manifest.json'));
          const lines = [
            'set cmd:fail-exit true',
            'set net:max-retries 1',
            'set net:timeout 30',
            'set ftp:ssl-force true',
            'set ftp:ssl-protect-data true',
            'set ssl:verify-certificate true',
            'set ssl:check-hostname false',
            `cd ${process.env.FTP_REMOTE_DIR}`
          ];
          const quote = value => `'${String(value).replaceAll("'", "'\\''")}'`;
          for (const file of manifest.files) {
            const relative = file.path.slice(1);
            const local = path.join(proof, relative);
            fs.mkdirSync(path.dirname(local), {recursive: true});
            lines.push(`get ${quote(relative)} -o ${quote(local)}`);
          }
          lines.push('bye');
          fs.writeFileSync(script, lines.join('\n') + '\n');
          NODE
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -f "$script" "$FTP_CONNECT_HOST"
          node - "$proof" <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const root = process.argv[2];
          const manifest = JSON.parse(fs.readFileSync(process.env.RELEASE_ROOT + '/release-manifest.json'));
          for (const file of manifest.files) {
            if (file.path === '/release-manifest.json') continue;
            const candidate = path.join(root, file.path.slice(1));
            const bytes = fs.readFileSync(candidate);
            const hash = crypto.createHash('sha256').update(bytes).digest('hex');
            if (hash !== file.sha256) throw new Error(`Origin hash mismatch: ${file.path}`);
          }
          NODE
      - name: Verify live custom domain and SSL
        shell: bash
        run: |
          set -euo pipefail
          success=false
          for attempt in $(seq 1 15); do
            if curl -L -fsS --compressed -H 'Cache-Control: no-cache' --connect-timeout 15 --max-time 45 "${LIVE_URL}?release=${GITHUB_RUN_ID}-$attempt" -o "$RUNNER_TEMP/live.html"; then
              if grep -Fq "<title>${EXPECTED_TITLE}</title>" "$RUNNER_TEMP/live.html"; then success=true; break; fi
            fi
            sleep 3
          done
          test "$success" = 'true'
          ! grep -Eiq 'gofundme|go fund me|coming soon|one-world-one-mission\.webp|100002482[01]|Screenshot_2026' "$RUNNER_TEMP/live.html"
          curl -fsSI --connect-timeout 15 --max-time 30 "${LIVE_URL}assets/css/site.css" | grep -Eq '^HTTP/[^ ]+ 200'
      - name: Roll back exact pre-deployment root on failure
        if: ${{ failure() && env.DEPLOY_STARTED == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -d "$BACKUP_DIR"
          if test -f "$BACKUP_DIR/index.html"; then
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_CONNECT_HOST" <<EOF
          set cmd:fail-exit true
          set net:max-retries 1
          set net:timeout 30
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          cd $FTP_REMOTE_DIR
          mirror -R --delete --verbose --parallel=2 --exclude-glob index.html --exclude-glob .predeploy-empty-root --exclude-glob .well-known --exclude-glob .well-known/** $BACKUP_DIR .
          put $BACKUP_DIR/index.html -o index.html
          bye
          EOF
          else
            lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_CONNECT_HOST" <<EOF
          set cmd:fail-exit true
          set net:max-retries 1
          set net:timeout 30
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          cd $FTP_REMOTE_DIR
          mirror -R --delete --verbose --parallel=2 --exclude-glob .predeploy-empty-root --exclude-glob .well-known --exclude-glob .well-known/** $BACKUP_DIR .
          bye
          EOF
          fi

  verify-protected-and-payments:
    name: Verify protected services and payment destinations
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prove OneWorldz and CryptoBotz remain live
        shell: bash
        run: |
          set -euo pipefail
          curl -L -fsS --connect-timeout 15 --max-time 45 'https://oneworldz.com/' -o "$RUNNER_TEMP/oneworldz.html"
          test -s "$RUNNER_TEMP/oneworldz.html"
          curl -L -fsS --connect-timeout 15 --max-time 45 'https://cryptobotz.cryptoworldz.xyz/health' -o "$RUNNER_TEMP/cryptobotz-health.json"
          grep -Eq '"ok"[[:space:]]*:[[:space:]]*true|"status"[[:space:]]*:[[:space:]]*"ok"' "$RUNNER_TEMP/cryptobotz-health.json"
      - name: Prove payments, Telegram and reciprocal fleet links
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://donate.stripe.com/14A6oHcG61Ox87Y0Xb0kE01'
            'https://donate.stripe.com/9B67sLgWm78R73U35j0kE02'
            'https://buy.stripe.com/6oUeVd9tU0Ktewm0Xb0kE00'
            'https://www.paypal.me/Jayjay3480'
            'https://t.me/CryptoWorldzBot'
            'https://t.me/CryptoWorldzRaaiiiddTeam'
          )
          for url in "${urls[@]}"; do
            code="$(curl -L -sS -o /dev/null -w '%{http_code}' --connect-timeout 15 --max-time 45 "$url" || true)"
            [[ "$code" =~ ^(200|301|302|303|307|308)$ ]] || { echo "::error::Destination failed: $url HTTP $code"; exit 1; }
          done
          domains=(cryptoworldz.xyz solworldz.xyz ethworldz.xyz baseworldz.xyz bnbworldz.xyz xrpworldz.xyz suiworldz.xyz hyperworldz.xyz robinworldz.xyz bitcoinworldz.xyz hodlerworldz.xyz purplediamondcrew.com impactbased.oneworldz.com law.oneworldz.com learn.oneworldz.com)
          for domain in "${domains[@]}"; do
            curl -L -fsS --connect-timeout 15 --max-time 45 "https://$domain/?fleetproof=${GITHUB_RUN_ID}" -o "$RUNNER_TEMP/page.html"
            grep -Fq 'https://oneworldz.com' "$RUNNER_TEMP/page.html"
            grep -Fq 'https://cryptoworldz.xyz' "$RUNNER_TEMP/page.html"
          done
      - name: Write complete production handoff artifact
        shell: bash
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/ONEWORLDZ-ECOSYSTEM-PRODUCTION-HANDOFF.md"
          {
            echo '# OneWorldz Ecosystem Production Handoff'
            echo
            echo "- Production version: oneworldz-ecosystem-locked-v1"
            echo "- Production commit: ${{ needs.deploy.result }} / $GITHUB_SHA"
            echo "- Verified at: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo '- Static destinations: 15/15 deployment jobs passed'
            echo '- OneWorldz.com: live and unchanged'
            echo '- CryptoBotz health: passed'
            echo '- SSL/custom domains: 15/15 HTTPS checks passed'
            echo '- Payment destinations: 3 Stripe + JayJayTeamDev PayPal passed'
            echo '- Telegram routes: Zed + Raaiiidd passed'
            echo '- Reciprocal links: 15/15 passed'
            echo '- GoFundMe: absent'
            echo '- Coming Soon: absent'
            echo '- Rejected poster/screenshots: absent'
            echo '- Protected Supabase/bot/owner/financial controls: unchanged'
          } > "$handoff"
      - uses: actions/upload-artifact@v4
        with:
          name: oneworldz-ecosystem-production-handoff-${{ github.run_id }}
          path: ${{ runner.temp }}/ONEWORLDZ-ECOSYSTEM-PRODUCTION-HANDOFF.md
          if-no-files-found: error
          retention-days: 90
