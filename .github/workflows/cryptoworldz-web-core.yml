name: CryptoWorldz Web Core

on:
  push:
    branches: [main]
    paths:
      - 'apps/cryptoworldz-web-core/**'
      - 'media/approved-worldz/**'
      - 'tools/restore-approved-worldz-media.sh'
      - 'tools/verify-worldz-master-images.mjs'
      - 'tools/evaluate-web-core.mjs'
      - 'package.json'
      - '.github/workflows/cryptoworldz-web-core.yml'
  pull_request:
    paths:
      - 'apps/cryptoworldz-web-core/**'
      - 'media/approved-worldz/**'
      - 'tools/restore-approved-worldz-media.sh'
      - 'tools/verify-worldz-master-images.mjs'
      - 'tools/evaluate-web-core.mjs'
      - 'package.json'
      - '.github/workflows/cryptoworldz-web-core.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluate-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore exact approved master imagery
        shell: bash
        run: |
          set -euo pipefail
          bash tools/restore-approved-worldz-media.sh "$RUNNER_TEMP/approved-worldz"
          rm -rf apps/cryptoworldz-web-core/assets/worldz-master
          mkdir -p apps/cryptoworldz-web-core/assets/worldz-master
          cp -R "$RUNNER_TEMP/approved-worldz/oneworldz" apps/cryptoworldz-web-core/assets/worldz-master/
          cp -R "$RUNNER_TEMP/approved-worldz/cryptoworldz" apps/cryptoworldz-web-core/assets/worldz-master/
          cp -R "$RUNNER_TEMP/approved-worldz/blockchains" apps/cryptoworldz-web-core/assets/worldz-master/
          cp -R "$RUNNER_TEMP/approved-worldz/tokens" apps/cryptoworldz-web-core/assets/worldz-master/
          cp -R "$RUNNER_TEMP/approved-worldz/purple-diamond-crew" apps/cryptoworldz-web-core/assets/worldz-master/

      - name: Run complete web-core evaluation
        run: npm run verify:web

      - name: Create Hostinger deployment archive
        run: |
          cd apps/cryptoworldz-web-core
          zip -r ../../cryptoworldz-web-core-deploy.zip . \
            -x '*.DS_Store' '*.md' '.gitignore'
          cd ../..
          sha256sum cryptoworldz-web-core-deploy.zip > cryptoworldz-web-core-deploy.sha256

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: cryptoworldz-web-core-deploy
          path: |
            cryptoworldz-web-core-deploy.zip
            cryptoworldz-web-core-deploy.sha256
          if-no-files-found: error
          retention-days: 30
