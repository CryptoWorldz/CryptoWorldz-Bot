name: DEPLOY — OneWorldz — FINAL PROOF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-oneworldz-final-proof.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oneworldz-final-proof
  cancel-in-progress: true

env:
  DOMAIN: oneworldz.com
  SOURCE_ROOT: apps/cryptoworldz-web-core
  USERNAME: u643166328
  ORDER_ID: '1009657511'
  ROOT_DIR: /home/u643166328/domains/oneworldz.com/public_html
  ROLLBACK_REF: c544ecd2a7dd003eaf7be4229118da05b2dc83fc
  RELEASE: 20260812-oneworldz-support-v1

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: oneworldz-production
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify exact Hostinger production target and source
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$HOSTINGER_API_TOKEN" ]]
          echo "::add-mask::$HOSTINGER_API_TOKEN"
          node --check "$SOURCE_ROOT/assets/site-pages.js"
          node --check "$SOURCE_ROOT/assets/site-router.js"
          node --check "$SOURCE_ROOT/assets/oneworldz-support-campaign.js"
          grep -Fq "$RELEASE" "$SOURCE_ROOT/index.html"
          grep -Fq 'https://gofund.me/933219353' "$SOURCE_ROOT/assets/site-pages.js"
          grep -Fq 'https://www.gofundme.com/u/jayjayteamdev' "$SOURCE_ROOT/assets/site-pages.js"
          for p in 00 01 02 03; do test -s "$SOURCE_ROOT/assets/campaign/areas-support/$p.b64"; done

          f="$RUNNER_TEMP/site.json"
          code=$(curl -fsS --connect-timeout 10 --max-time 30 -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' -o "$f" -w '%{http_code}' "https://developers.hostinger.com/api/hosting/v1/websites?domain=$DOMAIN")
          [[ "$code" == 200 ]]
          ok=$(jq '[.data[]? | select(.domain=="oneworldz.com" and .username=="u643166328" and (.order_id|tostring)=="1009657511" and .root_directory=="/home/u643166328/domains/oneworldz.com/public_html" and .is_enabled==true)]|length' "$f")
          [[ "$ok" == 1 ]]
          echo 'TARGET=PASS'

      - name: Create deployment and rollback archives
        id: archive
        shell: bash
        run: |
          set -euo pipefail
          cur="$RUNNER_TEMP/oneworldz-current.zip"
          old="$RUNNER_TEMP/oneworldz-rollback.zip"
          (cd "$SOURCE_ROOT" && zip -qr "$cur" .)
          git archive --format=zip --output="$old" "$ROLLBACK_REF:$SOURCE_ROOT"
          unzip -p "$cur" index.html | grep -Fq "$RELEASE"
          unzip -p "$cur" assets/site-pages.js | grep -Fq 'https://gofund.me/933219353'
          unzip -p "$cur" assets/site-pages.js | grep -Fq 'https://www.gofundme.com/u/jayjayteamdev'
          unzip -p "$old" index.html >/dev/null
          echo "current=$cur" >> "$GITHUB_OUTPUT"
          echo "rollback=$old" >> "$GITHUB_OUTPUT"
          echo 'BACKUP=PASS'

      - name: Install Hostinger official deployment client
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/tools"
          mkdir -p "$tools"
          cd "$tools"
          npm init -y >/dev/null
          npm install --silent hostinger-api-mcp @modelcontextprotocol/sdk puppeteer-core
          echo "TOOLS=$tools" >> "$GITHUB_ENV"
          cat > deploy.mjs <<'NODE'
          import {Client} from '@modelcontextprotocol/sdk/client/index.js';
          import {StdioClientTransport} from '@modelcontextprotocol/sdk/client/stdio.js';
          import path from 'node:path';
          const transport=new StdioClientTransport({command:path.resolve(process.env.TOOLS,'node_modules/.bin/hostinger-api-mcp'),args:['--stdio'],env:{...process.env,DEBUG:'false'}});
          const client=new Client({name:'oneworldz-final-proof',version:'1.0.0'},{capabilities:{}});
          await client.connect(transport);
          const result=await client.callTool({name:'hosting_deployStaticWebsite',arguments:{domain:'oneworldz.com',archivePath:process.env.ARCHIVE,removeArchive:false}});
          if(result.isError) throw new Error(JSON.stringify(result.content));
          console.log('HOSTINGER_DEPLOY=ACCEPTED');
          await client.close();
          NODE

      - name: Deploy current build to verified domain target
        id: deployed
        shell: bash
        env:
          ARCHIVE: ${{ steps.archive.outputs.current }}
        run: |
          set -euo pipefail
          cd "$TOOLS"
          node deploy.mjs
          echo 'UPLOAD=PASS'

      - name: Wait for Hostinger deployment to settle and clear cache
        shell: bash
        run: |
          set -euo pipefail
          sleep 45
          for n in 1 2 3; do
            code=$(curl -sS --connect-timeout 10 --max-time 30 -X DELETE -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' -o "$RUNNER_TEMP/cache.json" -w '%{http_code}' "https://developers.hostinger.com/api/hosting/v1/accounts/$USERNAME/websites/$DOMAIN/cache/clear" || true)
            if [[ "$code" == 200 || "$code" == 204 ]]; then echo "CACHE_CLEAR=PASS:$code"; exit 0; fi
            sleep 10
          done
          echo '::error::Hostinger cache clear failed'
          exit 1

      - name: Verify live public files with propagation window
        id: files
        shell: bash
        run: |
          set -euo pipefail
          check(){
            local label="$1" url="$2" needle="$3"
            for n in $(seq 1 12); do
              body="$RUNNER_TEMP/${label}-${n}.txt"
              if curl -fsS --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache, no-store' "${url}?proof=${GITHUB_RUN_ID}-${n}" -o "$body"; then
                if grep -Fq "$needle" "$body"; then echo "$label=PASS"; return 0; fi
              fi
              echo "$label=WAIT:$n"
              sleep 10
            done
            echo "::error::$label never matched live production"
            return 1
          }
          check INDEX "https://$DOMAIN/" "$RELEASE"
          check ROUTER "https://$DOMAIN/assets/site-router.js" 'oneworldz-support-campaign.js'
          check GFM_FEATURED "https://$DOMAIN/assets/site-pages.js" 'https://gofund.me/933219353'
          check GFM_PROFILE "https://$DOMAIN/assets/site-pages.js" 'https://www.gofundme.com/u/jayjayteamdev'
          check SUPPORT_JS "https://$DOMAIN/assets/oneworldz-support-campaign.js" 'areas-support/00.b64'
          for p in 00 01 02 03; do
            good=0
            for n in $(seq 1 8); do
              bytes=$(curl -fsS --connect-timeout 10 --max-time 25 -H 'Cache-Control: no-cache, no-store' "https://$DOMAIN/assets/campaign/areas-support/$p.b64?proof=${GITHUB_RUN_ID}-${n}" 2>/dev/null | wc -c || true)
              if [[ "$bytes" -gt 1000 ]]; then good=1; echo "SUPPORT_$p=PASS:$bytes"; break; fi
              sleep 7
            done
            [[ "$good" == 1 ]]
          done
          echo 'PUBLIC_FILES=PASS'

      - name: Desktop and mobile browser proof
        id: browser
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          [[ -n "$chrome" ]]
          qa="$RUNNER_TEMP/qa"
          mkdir -p "$qa"
          cat > "$TOOLS/qa.mjs" <<'NODE'
          import puppeteer from 'puppeteer-core';
          import fs from 'node:fs';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const browser=await puppeteer.launch({executablePath:process.env.CHROME,headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          const stamp=Date.now();
          const checks=[
            {name:'desktop-home',url:`https://oneworldz.com/?proof=${stamp}`,w:1440,h:1000,help:false},
            {name:'mobile-home',url:`https://oneworldz.com/?proof=${stamp}-m`,w:390,h:844,help:false},
            {name:'desktop-help',url:`https://oneworldz.com/?page=help&proof=${stamp}-h`,w:1440,h:1000,help:true},
            {name:'mobile-help',url:`https://oneworldz.com/?page=help&proof=${stamp}-hm`,w:390,h:844,help:true}
          ];
          const report=[]; let failed=false;
          for(const c of checks){
            const page=await browser.newPage();
            await page.setViewport({width:c.w,height:c.h,isMobile:c.w<500,hasTouch:c.w<500});
            let loaded=false;
            for(let n=0;n<3&&!loaded;n++){
              try{await page.goto(c.url,{waitUntil:'domcontentloaded',timeout:25000});loaded=true;}catch{await sleep(3000);}
            }
            await sleep(5000);
            await page.evaluate(async()=>{
              for(const img of document.images) img.loading='eager';
              for(let y=0;y<document.body.scrollHeight;y+=500){window.scrollTo(0,y);await new Promise(r=>setTimeout(r,80));}
              window.scrollTo(0,0);
            }).catch(()=>{});
            await sleep(2000);
            let data=null;
            for(let n=0;n<6&&!data;n++){
              try{data=await page.evaluate((help)=>{
                const imgs=[...document.images].filter(i=>getComputedStyle(i).display!=='none'&&getComputedStyle(i).visibility!=='hidden');
                const broken=imgs.filter(i=>!i.complete||i.naturalWidth===0||i.naturalHeight===0).map(i=>i.currentSrc||i.src);
                const lowRes=imgs.filter(i=>i.naturalWidth>0&&i.clientWidth>0&&(i.naturalWidth<i.clientWidth*.75||i.naturalHeight<i.clientHeight*.75)).map(i=>({src:i.currentSrc||i.src,natural:[i.naturalWidth,i.naturalHeight],rendered:[i.clientWidth,i.clientHeight]}));
                const hrefs=[...document.querySelectorAll('a[href]')].map(a=>a.href);
                return {title:document.title,url:location.href,viewport:innerWidth,scrollWidth:document.documentElement.scrollWidth,imageCount:imgs.length,broken,lowRes,hasFeatured:hrefs.includes('https://gofund.me/933219353'),hasProfile:hrefs.includes('https://www.gofundme.com/u/jayjayteamdev'),supportLoaded:!document.querySelector('.ow-support-image')||document.querySelector('.ow-support-image').naturalWidth>0,help};
              },c.help);}catch{await sleep(700);}
            }
            if(!data){failed=true;report.push({name:c.name,error:'DOM evaluation unavailable'});await page.close();continue;}
            data.overflow=data.scrollWidth>data.viewport+20;
            data.badLinks=c.help&&(!data.hasFeatured||!data.hasProfile);
            const bad=data.broken.length>0||data.lowRes.length>0||data.overflow||data.badLinks||!data.supportLoaded;
            if(bad) failed=true;
            report.push({name:c.name,...data});
            await page.screenshot({path:`${process.env.QA}/${c.name}.png`,fullPage:true});
            await page.close();
          }
          fs.writeFileSync(`${process.env.QA}/report.json`,JSON.stringify(report,null,2));
          console.log(JSON.stringify(report,null,2));
          await browser.close();
          if(failed) process.exit(2);
          NODE
          cd "$TOOLS"
          CHROME="$chrome" QA="$qa" timeout 110 node qa.mjs
          echo 'DESKTOP_MOBILE_IMAGES_LINKS=PASS'

      - name: Upload final visual proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneworldz-final-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/qa
          retention-days: 14
          if-no-files-found: ignore

      - name: Roll back if any post-deploy proof fails
        if: ${{ failure() && steps.deployed.outcome == 'success' }}
        shell: bash
        env:
          ARCHIVE: ${{ steps.archive.outputs.rollback }}
        run: |
          set -euo pipefail
          cd "$TOOLS"
          node deploy.mjs
          sleep 25
          curl -sS --connect-timeout 10 --max-time 30 -X DELETE -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "https://developers.hostinger.com/api/hosting/v1/accounts/$USERNAME/websites/$DOMAIN/cache/clear" >/dev/null || true
          echo 'ROLLBACK=COMPLETED'
