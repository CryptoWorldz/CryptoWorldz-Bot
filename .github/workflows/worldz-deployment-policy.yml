name: Worldz Deployment Policy

on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tools/worldz-direct-ftp.sh'
      - 'tools/restore-approved-worldz-media.sh'
      - 'tools/verify-worldz-deployment-policy.mjs'
      - 'apps/cryptoworldz-web-core/assets/coming-soon-next.js'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'tools/worldz-direct-ftp.sh'
      - 'tools/restore-approved-worldz-media.sh'
      - 'tools/verify-worldz-deployment-policy.mjs'
      - 'apps/cryptoworldz-web-core/assets/coming-soon-next.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reject old failure patterns
        run: node tools/verify-worldz-deployment-policy.mjs
