name: WLDZ Squads Meteora Build Proof

on:
  workflow_dispatch:
  push:
    paths:
      - "worldzpad-mainnet/scripts/build-wldz-squads-meteora.mjs"
      - "worldzpad-mainnet/package.json"
      - "worldzpad-mainnet/wldz-one-sided-launch.candidate.json"
      - ".github/workflows/wldz-squads-meteora-build.yml"

permissions:
  contents: read

concurrency:
  group: wldz-squads-meteora-build
  cancel-in-progress: true

jobs:
  build-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worldzpad-mainnet
    env:
      SOLANA_RPC_URL: https://hknymhhyqldtzmplzuzh.supabase.co/functions/v1/worldz-solana-rpc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned SDKs
        run: npm install --no-audit --no-fund
      - name: Build and simulate exact Squads → Meteora proposal payload
        run: npm run build:launch
      - name: Upload serialized payload and simulation proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wldz-squads-meteora-build-proof
          path: worldzpad-mainnet/artifacts/*
          if-no-files-found: warn
          retention-days: 30
