name: WLDZ Historical Squads Meteora Build Proof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wldz-squads-meteora-historical
  cancel-in-progress: false

jobs:
  historical-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: worldzpad-mainnet
    env:
      SOLANA_RPC_URL: https://hknymhhyqldtzmplzuzh.supabase.co/functions/v1/worldz-solana-rpc
      SQUADS_CREATOR: Fap54GTCo4ZopkwmHtbSUJZTsjTybftJfN9sPG3MHp4u
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify archived browser proposal route
        run: |
          node --check ../launchpad.cryptoworldz.xyz/wldz/proposal.js
          node --test ../test/wldz-proposal-route.test.js
      - name: Guard against accidental duplicate launch execution
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('../launchpad.cryptoworldz.xyz/wldz/launch-config.json','utf8'));
          if(cfg.execution?.launchExecuted!==true || cfg.execution?.duplicateExecutionDisabled!==true){
            throw new Error('Live WLDZ execution guard missing');
          }
          console.log('WLDZ_HISTORICAL_BUILD_GUARD=PASS duplicate_execution=DISABLED');
          NODE
