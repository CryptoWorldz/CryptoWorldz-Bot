name: Deploy SolWorldz Proof First

on:
  push:
    branches: [main]
    paths:
      - 'deployments/solworldz-live.request'

permissions:
  contents: read

env:
  EXPECTED_GUARD: SOLWORLDZ.XYZ
  REQUEST_FILE: deployments/solworldz-live.request

jobs:
  deploy:
    name: Build, backup, deploy, prove, safe rollback
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: solworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT }}
      FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
      FTP_ACCOUNT_SCOPE: ${{ vars.FTP_ACCOUNT_SCOPE }}
      DEPLOY_GUARD: ${{ vars.DEPLOY_GUARD }}
    steps:
      - name: Check out approved source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify immutable owner release request
        shell: bash
        run: |
          set -euo pipefail
          test -s "$REQUEST_FILE" || { echo '::error::SolWorldz release request missing'; exit 1; }
          target="$(grep -E '^target=' "$REQUEST_FILE" | tail -n1 | cut -d= -f2-)"
          source_commit="$(grep -E '^source_commit=' "$REQUEST_FILE" | tail -n1 | cut -d= -f2-)"
          requested_by="$(grep -E '^requested_by=' "$REQUEST_FILE" | tail -n1 | cut -d= -f2-)"
          authorization="$(grep -E '^authorization=' "$REQUEST_FILE" | tail -n1 | cut -d= -f2-)"
          parent="$(git rev-parse HEAD^)"
          [[ "$target" == 'solworldz' ]] || { echo '::error::Target must be solworldz'; exit 1; }
          [[ "$source_commit" == "$parent" ]] || { echo '::error::source_commit must exactly match request commit parent'; exit 1; }
          [[ "$requested_by" == 'JayJayTeamDev' ]] || { echo '::error::Request owner mismatch'; exit 1; }
          [[ "$authorization" == 'GO' ]] || { echo '::error::Authorization must be GO'; exit 1; }
          echo 'Owner release request verified.'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build exact approved-master release
        shell: bash
        run: |
          set -euo pipefail
          node tools/verify-solworldz-standalone.mjs
          node tools/build-solworldz-release.mjs
          [[ "$(find dist/solworldz/assets/master -type f -name '*.jpg' | wc -l | tr -d ' ')" == '20' ]]
          ! grep -RFiq 'solworld.fun' dist/solworldz
          ! grep -RFiq 'assets/images/website-core' dist/solworldz/index.html

      - name: Prove desktop and mobile before hosting changes
        shell: bash
        run: |
          set -euo pipefail
          SOLWORLDZ_RELEASE_ROOT='dist/solworldz' SOLWORLDZ_RELEASE_PORT=8088 node tools/serve-solworldz-release.mjs > "$RUNNER_TEMP/local-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for i in $(seq 1 30); do
            if curl -fsS 'http://127.0.0.1:8088/' -o /dev/null; then ready=true; break; fi
            sleep 0.2
          done
          [[ "$ready" == 'true' ]] || { cat "$RUNNER_TEMP/local-server.log"; exit 1; }
          SOLWORLDZ_PROOF_URL='http://127.0.0.1:8088/' SOLWORLDZ_BROWSER_PROOF_DIR='dist/solworldz-browser-proof' node tools/check-solworldz-live-browser.mjs
          kill "$server_pid" 2>/dev/null || true
          trap - EXIT

      - name: Validate domain-only Hostinger gate
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FTP_HOST:-}" && test -n "${FTP_USERNAME:-}" && test -n "${FTP_PASSWORD:-}"
          [[ "${FTP_PORT:-21}" == '21' ]]
          [[ "${FTP_SERVER_DIR:-/}" == '/' ]]
          [[ "${FTP_ACCOUNT_SCOPE:-}" == 'DOMAIN_ONLY' ]]
          [[ "${DEPLOY_GUARD:-}" == "$EXPECTED_GUARD" ]]

      - name: Install FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Prove Hostinger TLS identity before credentials
        shell: bash
        run: |
          set -euo pipefail
          ftp_ip="$(getent ahostsv4 "$FTP_HOST" | awk 'NR==1{print $1}')"
          test -n "$ftp_ip"
          openssl s_client -starttls ftp -connect "$ftp_ip:${FTP_PORT:-21}" -verify_return_error -CAfile /etc/ssl/certs/ca-certificates.crt -showcerts </dev/null > "$RUNNER_TEMP/certs.txt" 2>/dev/null
          awk '/-----BEGIN CERTIFICATE-----/{p=1} p{print} /-----END CERTIFICATE-----/{exit}' "$RUNNER_TEMP/certs.txt" > "$RUNNER_TEMP/leaf.pem"
          test -s "$RUNNER_TEMP/leaf.pem"
          openssl x509 -in "$RUNNER_TEMP/leaf.pem" -noout -ext subjectAltName | grep -Fq 'DNS:*.hstgr.io'
          fingerprint="$(openssl x509 -in "$RUNNER_TEMP/leaf.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          echo "FTP_CERT_SHA256=$fingerprint" >> "$GITHUB_ENV"

      - name: Prove current public site equals authenticated FTP origin
        shell: bash
        run: |
          set -euo pipefail
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "${FTP_PORT:-21}" "$FTP_HOST" -e "set cmd:fail-exit true; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true; set ssl:check-hostname false; cd ${FTP_SERVER_DIR:-/}; get index.html -o '$RUNNER_TEMP/pre-index.html'; bye"
          test -s "$RUNNER_TEMP/pre-index.html" || { echo '::error::Healthy current index required; use recovery workflow instead'; exit 1; }
          remote_sha="$(sha256sum "$RUNNER_TEMP/pre-index.html" | awk '{print $1}')"
          matched=false
          for attempt in $(seq 1 6); do
            curl -L -fsS --compressed -H 'Cache-Control: no-cache' "https://solworldz.xyz/?predeploy=${GITHUB_RUN_ID}-$attempt" -o "$RUNNER_TEMP/pre-public.html" || true
            if [[ -s "$RUNNER_TEMP/pre-public.html" ]] && [[ "$(sha256sum "$RUNNER_TEMP/pre-public.html" | awk '{print $1}')" == "$remote_sha" ]]; then matched=true; break; fi
            sleep 2
          done
          [[ "$matched" == 'true' ]] || { echo '::error::Public SolWorldz and FTP origin differ; deployment blocked'; exit 1; }
          echo "PREDEPLOY_INDEX_SHA=$remote_sha" >> "$GITHUB_ENV"

      - name: Back up complete current release surface
        shell: bash
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/solworldz-backup"
          mkdir -p "$backup/assets/master"
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "${FTP_PORT:-21}" "$FTP_HOST" <<EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          set net:max-retries 1
          set net:timeout 30
          cd ${FTP_SERVER_DIR:-/}
          get index.html -o $backup/index.html
          get .htaccess -o $backup/.htaccess
          mirror --verbose --parallel=2 assets/master $backup/assets/master
          bye
          EOF
          test -s "$backup/index.html" && test -s "$backup/.htaccess"
          echo "BACKUP_DIR=$backup" >> "$GITHUB_ENV"

      - name: Upload pre-deployment backup
        uses: actions/upload-artifact@v4
        with:
          name: solworldz-predeploy-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/solworldz-backup
          if-no-files-found: error
          retention-days: 30

      - name: Deploy approved master assets first and index last
        shell: bash
        run: |
          set -euo pipefail
          echo 'DEPLOY_STARTED=true' >> "$GITHUB_ENV"
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "${FTP_PORT:-21}" "$FTP_HOST" <<EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          set net:max-retries 1
          set net:timeout 30
          cd ${FTP_SERVER_DIR:-/}
          set cmd:fail-exit false
          mkdir -p assets/master
          set cmd:fail-exit true
          mirror -R --verbose --parallel=2 "$GITHUB_WORKSPACE/dist/solworldz/assets/master" assets/master
          put "$GITHUB_WORKSPACE/dist/solworldz/.htaccess" -o .htaccess
          put "$GITHUB_WORKSPACE/dist/solworldz/index.html" -o index.html
          bye
          EOF

      - name: Re-prove FTPS certificate stayed stable
        shell: bash
        run: |
          set -euo pipefail
          ftp_ip="$(getent ahostsv4 "$FTP_HOST" | awk 'NR==1{print $1}')"
          openssl s_client -starttls ftp -connect "$ftp_ip:${FTP_PORT:-21}" -verify_return_error -CAfile /etc/ssl/certs/ca-certificates.crt -showcerts </dev/null > "$RUNNER_TEMP/certs-after.txt" 2>/dev/null
          awk '/-----BEGIN CERTIFICATE-----/{p=1} p{print} /-----END CERTIFICATE-----/{exit}' "$RUNNER_TEMP/certs-after.txt" > "$RUNNER_TEMP/leaf-after.pem"
          after="$(openssl x509 -in "$RUNNER_TEMP/leaf-after.pem" -noout -fingerprint -sha256 | cut -d= -f2)"
          [[ "$after" == "$FTP_CERT_SHA256" ]]

      - name: Prove FTP origin exactly matches approved release
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/post-master"
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "${FTP_PORT:-21}" "$FTP_HOST" <<EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          cd ${FTP_SERVER_DIR:-/}
          get index.html -o $RUNNER_TEMP/post-index.html
          get .htaccess -o $RUNNER_TEMP/post-htaccess
          mirror --verbose --parallel=2 assets/master $RUNNER_TEMP/post-master
          bye
          EOF
          [[ "$(sha256sum "$RUNNER_TEMP/post-index.html" | awk '{print $1}')" == "$(sha256sum dist/solworldz/index.html | awk '{print $1}')" ]]
          [[ "$(sha256sum "$RUNNER_TEMP/post-htaccess" | awk '{print $1}')" == "$(sha256sum dist/solworldz/.htaccess | awk '{print $1}')" ]]
          node -e "const m=require('./dist/solworldz/release-manifest.json'); for(const f of m.files.filter(x=>x.path.startsWith('assets/master/'))) console.log(f.path)" > "$RUNNER_TEMP/master-paths.txt"
          count=0
          while IFS= read -r file; do
            count=$((count+1))
            relative="${file#assets/master/}"
            [[ "$(sha256sum "$RUNNER_TEMP/post-master/$relative" | awk '{print $1}')" == "$(sha256sum "dist/solworldz/$file" | awk '{print $1}')" ]] || { echo "::error::Origin hash mismatch: $file"; exit 1; }
          done < "$RUNNER_TEMP/master-paths.txt"
          [[ "$count" == '20' ]]

      - name: Prove public HTML and full-resolution approved images
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(sha256sum dist/solworldz/index.html | awk '{print $1}')"
          matched=false
          for attempt in $(seq 1 10); do
            curl -L -fsS --compressed -H 'Cache-Control: no-cache' "https://solworldz.xyz/?postdeploy=${GITHUB_RUN_ID}-$attempt" -o "$RUNNER_TEMP/live-index.html" || true
            if [[ -s "$RUNNER_TEMP/live-index.html" ]] && [[ "$(sha256sum "$RUNNER_TEMP/live-index.html" | awk '{print $1}')" == "$local_sha" ]]; then matched=true; break; fi
            sleep 2
          done
          [[ "$matched" == 'true' ]] || { echo '::error::Public HTML does not match approved release'; exit 1; }
          ! grep -Fiq 'solworld.fun' "$RUNNER_TEMP/live-index.html"
          node tools/prove-solworldz-public-images.mjs

      - name: Upload desktop/mobile candidate proof
        uses: actions/upload-artifact@v4
        with:
          name: solworldz-browser-proof-${{ github.run_id }}
          path: dist/solworldz-browser-proof
          if-no-files-found: error
          retention-days: 30

      - name: Mark production proof complete
        run: |
          {
            echo '## SolWorldz Production Proof — PASSED'
            echo '- Approved master archive: locked and verified'
            echo '- Retired SolWorld.fun: hard blocked'
            echo '- Desktop + mobile exact candidate: passed before deployment'
            echo '- Domain-only FTPS guard + Hostinger certificate: passed'
            echo '- Pre-deployment complete release backup: saved'
            echo '- FTP origin HTML/.htaccess + 20 image hashes: exact match'
            echo '- Public HTML: exact match'
            echo '- Public master images: exact approved dimensions'
            echo '- Hosted headless browser is intentionally not a deployment gate because anti-bot delivery can create false failures'
            echo '- Zed and Auto: untouched'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Roll back to exact pre-deployment release on failure
        if: ${{ failure() && env.DEPLOY_STARTED == 'true' }}
        shell: bash
        run: |
          set +e
          backup="${BACKUP_DIR:-$RUNNER_TEMP/solworldz-backup}"
          test -s "$backup/index.html" || { echo '::error::Rollback backup index missing'; exit 1; }
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "${FTP_PORT:-21}" "$FTP_HOST" <<EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          cd ${FTP_SERVER_DIR:-/}
          mirror -R --verbose --parallel=2 "$backup/assets/master" assets/master
          put "$backup/.htaccess" -o .htaccess
          put "$backup/index.html" -o index.html
          get index.html -o $RUNNER_TEMP/rollback-index.html
          bye
          EOF
          rollback_sha="$(sha256sum "$RUNNER_TEMP/rollback-index.html" | awk '{print $1}')"
          backup_sha="$(sha256sum "$backup/index.html" | awk '{print $1}')"
          if [[ "$rollback_sha" == "$backup_sha" ]] && [[ "$rollback_sha" == "${PREDEPLOY_INDEX_SHA:-$backup_sha}" ]]; then
            echo 'Rollback restored the exact pre-deployment FTP-origin index.'
          else
            echo '::error::Rollback completed but exact pre-deployment origin hash could not be proved.'
          fi
          exit 1