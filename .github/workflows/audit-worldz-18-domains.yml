name: Audit Worldz portfolio DNS and HTTPS (read only)
on:
  pull_request:
    paths:
      - '.github/workflows/audit-worldz-18-domains.yml'
      - 'ops/worldz-domain-registry.json'
      - 'tools/audit_worldz_portfolio.py'
  workflow_dispatch:
  schedule:
    - cron: '23 8 * * 0'
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-worldz-18-domains.yml'
      - 'ops/worldz-domain-registry.json'
      - 'tools/audit_worldz_portfolio.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate portfolio auditor
        run: |
          python3 -m py_compile tools/audit_worldz_portfolio.py
          python3 -m unittest discover -s test -p 'test_worldz_portfolio_audit.py' -v
      - name: Observe domains from the canonical inventory
        run: python3 tools/audit_worldz_portfolio.py --output worldz-portfolio-health.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worldz-portfolio-domain-health
          path: worldz-portfolio-health.json
          if-no-files-found: warn
