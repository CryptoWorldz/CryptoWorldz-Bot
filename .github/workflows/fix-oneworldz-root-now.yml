name: Fix OneWorldz Root Now

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-oneworldz-root-now.yml'

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    environment: oneworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
    steps:
      - name: Install FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Detect actual web root safely
        shell: bash
        run: |
          set -euo pipefail
          echo '145.223.108.40 oneworldz-fix-root.hstgr.io' | sudo tee -a /etc/hosts >/dev/null
          for root in / /public_html; do
            safe="${root//\//_}"; [[ -n "$safe" ]] || safe=root
            out="$RUNNER_TEMP/index${safe}.html"
            set +e
            timeout 25 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" oneworldz-fix-root.hstgr.io -e "set cmd:fail-exit yes; set net:max-retries 1; set net:timeout 10; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname yes; cd '$root'; get index.html -o '$out'; bye"
            rc=$?
            set -e
            if [[ $rc -eq 0 && -s "$out" ]]; then
              bytes="$(wc -c < "$out")"
              has="NO"; grep -qi 'OneWorldz' "$out" && has="YES"
              echo "ROOT_CANDIDATE=$root INDEX=PASS BYTES=$bytes ONEWORLDZ_TEXT=$has"
            else
              echo "ROOT_CANDIDATE=$root INDEX=FAIL RC=$rc"
            fi
          done
