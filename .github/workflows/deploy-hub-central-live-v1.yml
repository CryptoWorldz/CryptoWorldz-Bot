name: Deploy Hub Central + OneWorldz GPT + Community Support Live

on:
  push:
    branches: [main]
    paths:
      - 'deployments/hub-central-live-v1.request'

permissions:
  contents: read

env:
  TARGET_DOMAIN: cryptobotz.cryptoworldz.xyz
  REMOTE_ROOT: /domains/cryptobotz.cryptoworldz.xyz/nodejs
  RESTART_DIR: /domains/cryptobotz.cryptoworldz.xyz/public_html/tmp

concurrency:
  group: deploy-hub-central-oneworldz-services
  cancel-in-progress: false

jobs:
  deploy:
    name: Backup → additive services → restart → live proof → rollback on failure
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Prove explicit authority and source safety
        shell: bash
        run: |
          set -euo pipefail
          request='deployments/hub-central-live-v1.request'
          test "$(sed -n 's/^target=//p' "$request" | tail -n1)" = "$TARGET_DOMAIN"
          test "$(sed -n 's/^mode=//p' "$request" | tail -n1)" = 'upgrade-hub-central-oneworldz-gpt'
          test "$(sed -n 's/^authority=//p' "$request" | tail -n1)" = 'JayJayTeamDev FULL ACCESS PERMISSION & AUTHORITY'
          test "$(sed -n 's/^openai_mode=//p' "$request" | tail -n1)" = 'server-side-responses-api'
          for file in src/hub-central/live-v1.js src/community-support/live-v1.js; do test -s "$file"; node --check "$file"; done
          grep -Fq '/api/oneworldz-gpt/chat' src/hub-central/live-v1.js
          grep -Fq 'https://api.openai.com/v1/responses' src/hub-central/live-v1.js
          grep -Fq 'oneworldz_support_profiles' src/community-support/live-v1.js
          ! grep -REiq 'sk-proj-|sk-live-|sk_live_|sk_test_' src/hub-central/live-v1.js src/community-support/live-v1.js

      - name: Install FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Capture exact public baseline
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 "https://$TARGET_DOMAIN/" -o "$RUNNER_TEMP/baseline-root"
          test -s "$RUNNER_TEMP/baseline-root"
          sha256sum "$RUNNER_TEMP/baseline-root" > "$RUNNER_TEMP/baseline-root.sha256"

      - name: Backup live runtime and prepare additive upgrade
        shell: bash
        run: |
          set -euo pipefail
          raw_host="$(printf '%s' "$FTP_HOST" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#^ftp://##' -e 's#^ftps://##' -e 's#/.*$##')"
          if [[ "$raw_host" != *:*:* && "$raw_host" == *:* ]]; then raw_host="${raw_host%%:*}"; fi
          test -n "$raw_host"
          echo "::add-mask::$FTP_HOST"; echo "::add-mask::$FTP_USERNAME"; echo "::add-mask::$FTP_PASSWORD"
          [ -z "$OPENAI_API_KEY" ] || echo "::add-mask::$OPENAI_API_KEY"
          printf '%s' "$raw_host" > "$RUNNER_TEMP/raw-host"

          cat > "$RUNNER_TEMP/download.lftp" <<EOF
          set cmd:fail-exit false
          set net:max-retries 2
          set net:timeout 25
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          get $REMOTE_ROOT/index.js -o $RUNNER_TEMP/original-index.js
          get $REMOTE_ROOT/package.json -o $RUNNER_TEMP/original-package.json
          get $REMOTE_ROOT/hub-central-live.js -o $RUNNER_TEMP/original-hub-central-live.js
          get $REMOTE_ROOT/community-support-live.js -o $RUNNER_TEMP/original-community-support-live.js
          get $REMOTE_ROOT/.env -o $RUNNER_TEMP/original.env
          bye
          EOF
          # Missing optional module/.env files are valid for a first additive install.
          # The two required runtime files are proven immediately afterwards.
          timeout 300 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/download.lftp" "$raw_host" || true
          test -s "$RUNNER_TEMP/original-index.js"
          test -s "$RUNNER_TEMP/original-package.json"
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/original-package.json','utf8'));
          if(p.name!=='cryptoworldz-bot'||p.scripts?.start!=='node index.js') throw new Error('unexpected_live_runtime');
          NODE
          [ -s "$RUNNER_TEMP/original-hub-central-live.js" ] && touch "$RUNNER_TEMP/had-hub" || true
          [ -s "$RUNNER_TEMP/original-community-support-live.js" ] && touch "$RUNNER_TEMP/had-community" || true
          [ -s "$RUNNER_TEMP/original.env" ] && touch "$RUNNER_TEMP/had-env" || true

          cp "$RUNNER_TEMP/original-index.js" "$RUNNER_TEMP/patched-index.js"
          node - <<'NODE'
          const fs=require('fs');
          const p=process.env.RUNNER_TEMP+'/patched-index.js';
          let text=fs.readFileSync(p,'utf8');
          const needle='const app = express();';
          if(!text.includes(needle)) throw new Error('unexpected_express_app_structure');
          const lines=[];
          if(!text.includes('registerHubCentralLive')) lines.push('const { registerHubCentralLive } = require("./hub-central-live");','registerHubCentralLive(app);');
          if(!text.includes('registerCommunitySupportLive')) lines.push('const { registerCommunitySupportLive } = require("./community-support-live");','registerCommunitySupportLive(app);');
          if(lines.length) text=text.replace(needle,needle+'\n'+lines.join('\n'));
          fs.writeFileSync(p,text);
          NODE
          node --check "$RUNNER_TEMP/patched-index.js"

          # Hostinger may provide the existing Supabase variables through its app
          # environment rather than a physical .env file. Preserve any .env that
          # exists, and add only the protected OpenAI key when it is absent.
          if [ -s "$RUNNER_TEMP/original.env" ]; then cp "$RUNNER_TEMP/original.env" "$RUNNER_TEMP/patched.env"; else : > "$RUNNER_TEMP/patched.env"; fi
          if ! grep -Eq '^OPENAI_API_KEY=.+$' "$RUNNER_TEMP/patched.env"; then
            test -n "$OPENAI_API_KEY" || { echo '::error::OPENAI_API_KEY unavailable in protected server or GitHub environment'; exit 1; }
            printf '\nOPENAI_API_KEY=%s\nONEWORLDZ_OPENAI_MODEL=gpt-5.6\n' "$OPENAI_API_KEY" >> "$RUNNER_TEMP/patched.env"
          fi
          grep -Eq '^OPENAI_API_KEY=.+$' "$RUNNER_TEMP/patched.env"
          cp src/hub-central/live-v1.js "$RUNNER_TEMP/hub-central-live.js"
          cp src/community-support/live-v1.js "$RUNNER_TEMP/community-support-live.js"
          touch "$RUNNER_TEMP/restart.txt"

      - name: Upload additive server services and restart
        id: write
        shell: bash
        run: |
          set -euo pipefail
          raw_host="$(cat "$RUNNER_TEMP/raw-host")"
          cat > "$RUNNER_TEMP/upload.lftp" <<EOF
          set cmd:fail-exit true
          set net:max-retries 2
          set net:timeout 25
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          put $RUNNER_TEMP/hub-central-live.js -o $REMOTE_ROOT/hub-central-live.js
          put $RUNNER_TEMP/community-support-live.js -o $REMOTE_ROOT/community-support-live.js
          put $RUNNER_TEMP/patched-index.js -o $REMOTE_ROOT/index.js
          put $RUNNER_TEMP/patched.env -o $REMOTE_ROOT/.env
          mkdir -p $RESTART_DIR
          put $RUNNER_TEMP/restart.txt -o $RESTART_DIR/restart.txt
          bye
          EOF
          timeout 300 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/upload.lftp" "$raw_host"
          echo 'written=true' >> "$GITHUB_OUTPUT"

      - name: Prove root unchanged OpenAI live and 35-profile Supabase registry live
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 36); do
            sleep 5
            if curl --fail --silent --show-error --max-time 15 "https://$TARGET_DOMAIN/" -o "$RUNNER_TEMP/current-root" \
              && cmp -s "$RUNNER_TEMP/baseline-root" "$RUNNER_TEMP/current-root" \
              && curl --fail --silent --show-error --max-time 15 "https://$TARGET_DOMAIN/api/hub-central/status" -o "$RUNNER_TEMP/hub-status.json" \
              && node -e "const j=require(process.env.RUNNER_TEMP+'/hub-status.json');if(!j.ok||j.owned_destinations!==19||j.oneworldz_gpt!=='configured')process.exit(1)" \
              && curl --fail --silent --show-error --max-time 15 "https://$TARGET_DOMAIN/api/oneworldz-gpt/status" -o "$RUNNER_TEMP/gpt-status.json" \
              && node -e "const j=require(process.env.RUNNER_TEMP+'/gpt-status.json');if(!j.ok||!j.openai_api_configured||j.payments_in_chat!==false)process.exit(1)" \
              && curl --fail --silent --show-error --max-time 45 -H 'Origin: https://oneworldz.com' -H 'Content-Type: application/json' -d '{"page":"deployment-proof","message":"What is OneWorldz GPT for? Reply in one short sentence."}' "https://$TARGET_DOMAIN/api/oneworldz-gpt/chat" -o "$RUNNER_TEMP/gpt-live-proof.json" \
              && node -e "const j=require(process.env.RUNNER_TEMP+'/gpt-live-proof.json');if(!j.ok||j.powered_by!=='OpenAI'||!j.text)process.exit(1)" \
              && curl --fail --silent --show-error --max-time 20 -H 'Origin: https://oneworldz.com' "https://$TARGET_DOMAIN/api/oneworldz-community-support" -o "$RUNNER_TEMP/community-proof.json" \
              && node -e "const j=require(process.env.RUNNER_TEMP+'/community-proof.json');if(!j.ok||j.count!==35||j.profiles?.length!==35||j.profiles.some(x=>/^Facebook Support Profile/i.test(x.display_name)))process.exit(1)"; then
              success=1; break
            fi
            echo "OneWorldz services convergence attempt $attempt/36"
          done
          test "$success" = 1
          echo 'proved=true' >> "$GITHUB_OUTPUT"

      - name: Roll back exact runtime modules and environment on failed proof
        if: ${{ failure() && steps.write.outputs.written == 'true' && steps.proof.outputs.proved != 'true' }}
        shell: bash
        run: |
          set -u
          raw_host="$(cat "$RUNNER_TEMP/raw-host")"; touch "$RUNNER_TEMP/restart-rollback.txt"
          {
            echo 'set cmd:fail-exit false'; echo 'set net:max-retries 2'; echo 'set net:timeout 25'; echo 'set ftp:ssl-force true'; echo 'set ftp:ssl-protect-data true'; echo 'set ssl:verify-certificate true'; echo 'set ssl:check-hostname false'
            echo "put $RUNNER_TEMP/original-index.js -o $REMOTE_ROOT/index.js"
            if [ -f "$RUNNER_TEMP/had-hub" ]; then echo "put $RUNNER_TEMP/original-hub-central-live.js -o $REMOTE_ROOT/hub-central-live.js"; else echo "rm -f $REMOTE_ROOT/hub-central-live.js"; fi
            if [ -f "$RUNNER_TEMP/had-community" ]; then echo "put $RUNNER_TEMP/original-community-support-live.js -o $REMOTE_ROOT/community-support-live.js"; else echo "rm -f $REMOTE_ROOT/community-support-live.js"; fi
            if [ -f "$RUNNER_TEMP/had-env" ]; then echo "put $RUNNER_TEMP/original.env -o $REMOTE_ROOT/.env"; else echo "rm -f $REMOTE_ROOT/.env"; fi
            echo "mkdir -p $RESTART_DIR"; echo "put $RUNNER_TEMP/restart-rollback.txt -o $RESTART_DIR/restart.txt"; echo 'bye'
          } > "$RUNNER_TEMP/rollback.lftp"
          timeout 300 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/rollback.lftp" "$raw_host" || true

      - name: Preserve non-secret proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneworldz-protected-services-proof-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/baseline-root.sha256
            ${{ runner.temp }}/hub-status.json
            ${{ runner.temp }}/gpt-status.json
            ${{ runner.temp }}/gpt-live-proof.json
            ${{ runner.temp }}/community-proof.json
          if-no-files-found: ignore
          retention-days: 14
