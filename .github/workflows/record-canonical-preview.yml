name: Record Canonical Preview Result

on:
  workflow_run:
    workflows:
      - JayJayTeamDev + ChatGPT Canonical Gate
    types:
      - completed

permissions:
  contents: write
  actions: read

jobs:
  record:
    if: ${{ github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_commit.message == 'PREPARE JAYJAYTEAMDEV CHATGPT TOTAL DEPLOYMENT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact preview head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - id: tree
        name: Resolve exact static source tree
        shell: bash
        run: echo "static_tree=$(git rev-parse HEAD:apps/oneworldz-ecosystem-release)" >> "$GITHUB_OUTPUT"

      - name: Record preview run and artifact evidence
        uses: actions/github-script@v7
        env:
          STATIC_TREE: ${{ steps.tree.outputs.static_tree }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const run = context.payload.workflow_run;
            const runId = run.id;
            const artifactsResponse = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: runId,
              per_page: 100
            });
            const artifacts = artifactsResponse.data.artifacts || [];
            const candidateName = `oneworldz-candidate-${runId}`;
            const visualName = `oneworldz-preview-visual-${runId}`;
            const candidate = artifacts.find((item) => item.name === candidateName) || null;
            const visual = artifacts.find((item) => item.name === visualName) || null;
            const payload = {
              recorded_at: new Date().toISOString(),
              workflow_run_id: runId,
              workflow_conclusion: run.conclusion,
              workflow_status: run.status,
              head_sha: run.head_sha,
              static_tree: process.env.STATIC_TREE,
              candidate_artifact: candidate ? {
                id: candidate.id,
                name: candidate.name,
                size_in_bytes: candidate.size_in_bytes,
                digest: candidate.digest || null,
                expired: candidate.expired
              } : null,
              visual_artifact: visual ? {
                id: visual.id,
                name: visual.name,
                size_in_bytes: visual.size_in_bytes,
                digest: visual.digest || null,
                expired: visual.expired
              } : null
            };
            const path = 'deployments/latest-preview.result.json';
            let sha;
            try {
              const current = await github.rest.repos.getContent({ owner, repo, path, ref: 'main' });
              if (!Array.isArray(current.data)) sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner,
              repo,
              path,
              branch: 'main',
              message: `Record canonical preview run ${runId}`,
              content: Buffer.from(`${JSON.stringify(payload, null, 2)}\n`).toString('base64'),
              ...(sha ? { sha } : {})
            });
