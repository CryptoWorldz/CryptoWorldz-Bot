name: Deploy CryptoWorldz Only — Visual Pass

on:
  push:
    branches: [main]
    paths:
      - 'deployments/cryptoworldz-only.request'

permissions:
  contents: read

concurrency:
  group: cryptoworldz-only-production
  cancel-in-progress: true

env:
  DOMAIN: cryptoworldz.xyz
  REMOTE: domains/cryptoworldz.xyz/public_html
  PACKAGE: apps/oneworldz-ecosystem-release/dist/ecosystem/cryptoworldz
  TITLE: CryptoWorldz | One World • One Mission

jobs:
  build:
    name: Build and prove CryptoWorldz only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Prove one-site deployment authority
        shell: bash
        run: |
          set -euo pipefail
          f='deployments/cryptoworldz-only.request'
          test "$(sed -n 's/^requested_by=//p' "$f" | tail -n1)" = 'JayJayTeamDev'
          test "$(sed -n 's/^authorization=//p' "$f" | tail -n1)" = 'FIX ONE SITE AT A TIME'
          test "$(sed -n 's/^target=//p' "$f" | tail -n1)" = 'cryptoworldz.xyz'
          test "$(sed -n 's/^visual_pass=//p' "$f" | tail -n1)" = '14_PAGES_DESKTOP_AND_MOBILE_REQUIRED'
          test "$(sed -n 's/^protected_app=//p' "$f" | tail -n1)" = 'DO_NOT_MODIFY_CRYPTOBOTZ'
      - name: Install locked dependencies
        run: npm ci
      - name: Build canonical release
        run: npm --prefix apps/oneworldz-ecosystem-release run build:perfect
      - name: Run release gates
        run: |
          npm --prefix apps/oneworldz-ecosystem-release run test:release
          npm --prefix apps/oneworldz-ecosystem-release run test:seo
          npm --prefix apps/oneworldz-ecosystem-release run test:readiness
      - name: Prove exact 14-page CryptoWorldz visual contract
        shell: bash
        run: |
          set -euo pipefail
          test -s "$PACKAGE/index.html"
          test -s "$PACKAGE/assets/css/cryptoworldz-visual.css"
          for route in \
            command-centre/index.html \
            miniapp/index.html \
            support/reagan-children/index.html \
            support/community-impact/index.html \
            support/jayjayteamdev/index.html \
            divisions/visionworldz/index.html \
            divisions/aiworldz/index.html \
            divisions/musicworldz/index.html \
            divisions/movieworldz/index.html \
            divisions/artworldz/index.html \
            divisions/learnworldz/index.html \
            divisions/businessworldz/index.html \
            divisions/lawworldz/index.html; do
            test -s "$PACKAGE/$route"
          done
          node <<'NODE'
          const fs=require('fs');
          const pkg=process.env.PACKAGE;
          const m=JSON.parse(fs.readFileSync(pkg+'/release-manifest.json','utf8'));
          const v=m.cryptoworldz_visual_contract||{};
          if(v.pages!==14) throw new Error('CryptoWorldz page inventory drift');
          if(!v.desktop_mobile_main_visuals||!v.full_background_hero_treatment||!v.approved_separate_mobile_hero_assets_preserved||!v.support_pages_ambient_full_backgrounds) throw new Error('visual contract failed');
          if(v.visual_link_previews_per_page!==4||!v.isolated_link_preview_assets||!v.open_graph_preview_images||!v.twitter_large_image_previews||!v.local_hash_links_verified) throw new Error('preview/link contract failed');
          if(v.protected_cryptobotz_modified!==false) throw new Error('protected cryptobotz boundary failed');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: cryptoworldz-only-package-${{ github.run_id }}
          path: apps/oneworldz-ecosystem-release/dist/ecosystem/cryptoworldz/
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Backup → deploy CryptoWorldz only → live proof
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: cryptoworldz-production
      url: https://cryptoworldz.xyz/
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cryptoworldz-only-package-${{ github.run_id }}
          path: apps/oneworldz-ecosystem-release/dist/ecosystem/cryptoworldz
      - name: Install FTP client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Preflight exact CryptoWorldz Hostinger root
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_HOST"; test -n "$FTP_USERNAME"; test -n "$FTP_PASSWORD"
          host="$(printf '%s' "$FTP_HOST" | sed -e 's#^ftp[s]*://##' -e 's#/.*$##')"; if [[ "$host" != *:*:* && "$host" == *:* ]]; then host="${host%%:*}"; fi
          echo "::add-mask::$FTP_HOST"; echo "::add-mask::$FTP_USERNAME"; echo "::add-mask::$FTP_PASSWORD"
          timeout 120 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "set cmd:fail-exit true; set net:max-retries 2; set net:timeout 25; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true; set ssl:check-hostname false; cd $REMOTE; pwd; bye" "$host"
      - name: Enumerate exact CryptoWorldz package
        shell: bash
        run: |
          set -euo pipefail
          test -s "$PACKAGE/index.html"; test -s "$PACKAGE/release-manifest.json"
          (cd "$PACKAGE" && find . -type f -printf '%P\n' | sort) > "$RUNNER_TEMP/files.txt"
          grep '/' "$RUNNER_TEMP/files.txt" | sed 's#/[^/]*$##' | sort -u > "$RUNNER_TEMP/dirs.txt" || true
          while read -r rel; do mkdir -p "$RUNNER_TEMP/backup/$(dirname "$rel")"; done < "$RUNNER_TEMP/files.txt"
      - id: write
        name: Exact-file backup and CryptoWorldz-only upload
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          host="$(printf '%s' "$FTP_HOST" | sed -e 's#^ftp[s]*://##' -e 's#/.*$##')"; if [[ "$host" != *:*:* && "$host" == *:* ]]; then host="${host%%:*}"; fi
          {
            echo 'set cmd:fail-exit false'; echo 'set net:max-retries 2'; echo 'set net:timeout 25'; echo 'set ftp:ssl-force true'; echo 'set ftp:ssl-protect-data true'; echo 'set ssl:verify-certificate true'; echo 'set ssl:check-hostname false'; echo "cd $REMOTE"
            while read -r rel; do echo "get $rel -o $RUNNER_TEMP/backup/$rel"; done < "$RUNNER_TEMP/files.txt"
            echo bye
          } > "$RUNNER_TEMP/backup.lftp"
          timeout 700 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/backup.lftp" "$host" || true
          {
            echo 'set cmd:fail-exit false'; echo 'set net:max-retries 3'; echo 'set net:timeout 30'; echo 'set ftp:ssl-force true'; echo 'set ftp:ssl-protect-data true'; echo 'set ssl:verify-certificate true'; echo 'set ssl:check-hostname false'; echo "cd $REMOTE"; echo "lcd $PACKAGE"
            while read -r dir; do [ -n "$dir" ] && echo "mkdir -p $dir"; done < "$RUNNER_TEMP/dirs.txt"
            while read -r rel; do echo "rmdir $rel"; done < "$RUNNER_TEMP/files.txt"
            echo 'set cmd:fail-exit true'
            while read -r rel; do echo "put $rel -o $rel"; done < "$RUNNER_TEMP/files.txt"
            echo bye
          } > "$RUNNER_TEMP/upload.lftp"
          timeout 1100 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/upload.lftp" "$host"
      - id: proof
        name: Prove all 14 live CryptoWorldz pages and visual assets
        if: ${{ steps.write.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/routes.txt" <<'ROUTES'
          /
          /command-centre/
          /miniapp/
          /support/reagan-children/
          /support/community-impact/
          /support/jayjayteamdev/
          /divisions/visionworldz/
          /divisions/aiworldz/
          /divisions/musicworldz/
          /divisions/movieworldz/
          /divisions/artworldz/
          /divisions/learnworldz/
          /divisions/businessworldz/
          /divisions/lawworldz/
          ROUTES
          for route in $(cat "$RUNNER_TEMP/routes.txt"); do
            ok=0
            for n in $(seq 1 20); do
              html="$(curl --fail --silent --show-error --location --connect-timeout 15 --max-time 45 -H 'Cache-Control: no-cache' "https://$DOMAIN${route}?release=${GITHUB_SHA}-${GITHUB_RUN_ID}" || true)"
              if printf '%s' "$html" | grep -Fq 'class="cryptoworldz-visual route-' \
                && printf '%s' "$html" | grep -Fq '/assets/css/cryptoworldz-visual.css' \
                && printf '%s' "$html" | grep -Fq 'property="og:image"' \
                && test "$(printf '%s' "$html" | grep -o 'class="cw-link-preview"' | wc -l | tr -d ' ')" = 4; then ok=1; break; fi
              sleep 5
            done
            test "$ok" = 1 || { echo "Live proof failed: $route"; exit 1; }
          done
          for asset in \
            /assets/css/cryptoworldz-visual.css \
            /assets/link-previews/cryptoworldz.png \
            /assets/link-previews/command-centre.png \
            /assets/link-previews/miniapp.png \
            /assets/link-previews/oneworldz.png; do
            curl --fail --silent --show-error --location --max-time 45 "https://$DOMAIN$asset?release=${GITHUB_RUN_ID}" >/dev/null
          done
      - name: Restore exact prior files on failed write or proof
        if: ${{ steps.write.outcome == 'failure' || steps.proof.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          host="$(printf '%s' "$FTP_HOST" | sed -e 's#^ftp[s]*://##' -e 's#/.*$##')"; if [[ "$host" != *:*:* && "$host" == *:* ]]; then host="${host%%:*}"; fi
          {
            echo 'set cmd:fail-exit false'; echo 'set net:max-retries 2'; echo 'set net:timeout 25'; echo 'set ftp:ssl-force true'; echo 'set ftp:ssl-protect-data true'; echo 'set ssl:verify-certificate true'; echo 'set ssl:check-hostname false'; echo "cd $REMOTE"
            while read -r rel; do
              echo "rm $rel"
              echo "rmdir $rel"
              if [ -f "$RUNNER_TEMP/backup/$rel" ]; then echo "put $RUNNER_TEMP/backup/$rel -o $rel"; fi
            done < "$RUNNER_TEMP/files.txt"
            echo bye
          } > "$RUNNER_TEMP/restore.lftp"
          timeout 1100 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/restore.lftp" "$host" || true
      - name: Fail after rollback
        if: ${{ steps.write.outcome == 'failure' || steps.proof.outcome == 'failure' }}
        run: exit 1

  audit:
    name: 28 live screenshots + internal/external link audit
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Locate Chrome
        id: chrome
        shell: bash
        run: |
          chrome="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$chrome"
          echo "path=$chrome" >> "$GITHUB_OUTPUT"
      - name: Define exact 14 live routes
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/routes.tsv" <<'ROUTES'
          home	/
          command-centre	/command-centre/
          miniapp	/miniapp/
          support-reagan	/support/reagan-children/
          support-community	/support/community-impact/
          support-jayjay	/support/jayjayteamdev/
          division-vision	/divisions/visionworldz/
          division-ai	/divisions/aiworldz/
          division-music	/divisions/musicworldz/
          division-movie	/divisions/movieworldz/
          division-art	/divisions/artworldz/
          division-learn	/divisions/learnworldz/
          division-business	/divisions/businessworldz/
          division-law	/divisions/lawworldz/
          ROUTES
      - name: Capture all 28 live desktop/mobile views and DOM
        shell: bash
        env:
          CHROME: ${{ steps.chrome.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p cryptoworldz-live-proof
          while IFS=$'\t' read -r name route; do
            url="https://cryptoworldz.xyz${route}?liveqa=${GITHUB_RUN_ID}"
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,1000 --virtual-time-budget=4000 --screenshot="cryptoworldz-live-proof/${name}-desktop.png" "$url"
            "$CHROME" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --virtual-time-budget=4000 --screenshot="cryptoworldz-live-proof/${name}-mobile.png" "$url"
            "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=7000 --dump-dom "$url" > "cryptoworldz-live-proof/${name}-dom.html"
          done < "$RUNNER_TEMP/routes.tsv"
          test "$(find cryptoworldz-live-proof -name '*-desktop.png' | wc -l | tr -d ' ')" = 14
          test "$(find cryptoworldz-live-proof -name '*-mobile.png' | wc -l | tr -d ' ')" = 14
      - name: Prove visual previews and local links on every live page
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const routes=fs.readFileSync(process.env.RUNNER_TEMP+'/routes.tsv','utf8').trim().split('\n').map(x=>x.split('\t'));
          const failures=[]; const internal=new Set();
          for(const [name] of routes){
            const html=fs.readFileSync(`cryptoworldz-live-proof/${name}-dom.html`,'utf8');
            const ids=new Set([...html.matchAll(/\sid="([^"]+)"/g)].map(m=>m[1]));
            if(!/class="cryptoworldz-visual route-/.test(html)) failures.push(`${name}: visual class missing`);
            if((html.match(/class="cw-link-preview"/g)||[]).length!==4) failures.push(`${name}: preview count != 4`);
            if(!/property="og:image"/.test(html)) failures.push(`${name}: og image missing`);
            if(!/name="twitter:card" content="summary_large_image"/.test(html)) failures.push(`${name}: twitter preview missing`);
            for(const m of html.matchAll(/href="#([^"]+)"/g)) if(!ids.has(m[1])) failures.push(`${name}: broken local #${m[1]}`);
            for(const m of html.matchAll(/href="([^"]+)"/g)){
              const h=m[1];
              if(h.startsWith('/')) internal.add(h.split('#')[0]);
              if(h.startsWith('https://cryptoworldz.xyz')) internal.add(new URL(h).pathname);
            }
          }
          fs.writeFileSync(process.env.RUNNER_TEMP+'/internal.txt',[...internal].filter(Boolean).sort().join('\n')+'\n');
          if(failures.length){console.error(failures.join('\n'));process.exit(1)}
          NODE
          failures=0
          while read -r path; do
            [ -z "$path" ] && continue
            code="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --connect-timeout 15 --max-time 45 "https://cryptoworldz.xyz${path}" || printf '000')"
            if [[ "$code" =~ ^(2|3) ]]; then echo "OK $code $path"; else echo "BROKEN $code $path"; failures=$((failures+1)); fi
          done < "$RUNNER_TEMP/internal.txt"
          test "$failures" = 0
      - name: Check controllable first-party and payment destinations
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/external.txt" <<'URLS'
          https://oneworldz.com
          https://solworldz.xyz
          https://ethworldz.xyz
          https://baseworldz.xyz
          https://bnbworldz.xyz
          https://xrpworldz.xyz
          https://suiworldz.xyz
          https://hyperworldz.xyz
          https://robinworldz.xyz
          https://hodlerworldz.xyz
          https://impactbased.cryptoworldz.xyz
          https://impactbased.oneworldz.com
          https://cryptobotz.cryptoworldz.xyz
          https://cryptobotz.cryptoworldz.xyz/miniapp/
          https://donateworldz.com
          https://foodworldz.com
          https://learn.oneworldz.com
          https://purplediamondcrew.com
          https://donate.stripe.com/14A6oHcG61Ox87Y0Xb0kE01
          https://donate.stripe.com/9B67sLgWm78R73U35j0kE02
          https://buy.stripe.com/6oUeVd9tU0Ktewm0Xb0kE00
          https://www.paypal.me/Jayjay3480
          URLS
          failures=0
          while read -r url; do
            code="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' --user-agent 'Mozilla/5.0' --connect-timeout 15 --max-time 45 "$url" || printf '000')"
            if [[ "$code" =~ ^(2|3) ]]; then echo "OK $code $url"; else echo "BROKEN $code $url"; failures=$((failures+1)); fi
          done < "$RUNNER_TEMP/external.txt"
          test "$failures" = 0
      - name: Prove all 35 Facebook share destinations are preserved exactly
        shell: bash
        run: |
          set -euo pipefail
          dom=cryptoworldz-live-proof/support-community-dom.html
          grep -o 'href="https://www.facebook.com/share/[^"]*"' "$dom" | sed -e 's/^href="//' -e 's/"$//' | sort -u > "$RUNNER_TEMP/live-facebook.txt"
          test "$(wc -l < "$RUNNER_TEMP/live-facebook.txt" | tr -d ' ')" = 35
          while read -r url; do [[ "$url" =~ ^https://www.facebook.com/share/[A-Za-z0-9]+/$ ]] || exit 1; done < "$RUNNER_TEMP/live-facebook.txt"
          echo '35 locked Facebook share destinations preserved. Anonymous HTTP status is intentionally not used as Facebook destination health proof.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cryptoworldz-live-proof-${{ github.run_id }}
          path: cryptoworldz-live-proof/
          if-no-files-found: error
          retention-days: 30
