name: Check SolWorldz Images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-solworldz-images.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  images:
    name: Verify live SolWorldz payload images
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install image verification tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq webp jq

      - name: Validate CryptoWorldz-style live media payloads
        shell: bash
        run: |
          set -euo pipefail
          base='https://solworldz.xyz'
          agent='Mozilla/5.0 (Linux; Android 13; Mobile) SolWorldzPayloadCheck'
          cache="payloadcheck=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          fetch_live() {
            local url="$1"
            local out="$2"
            local attempt
            for attempt in 1 2 3 4; do
              if curl -fsSL -A "$agent" -H 'Cache-Control: no-cache' --connect-timeout 15 --max-time 40 "${url}${url#*\?}" >/dev/null 2>&1; then
                :
              fi
              if curl -fsSL -A "$agent" -H 'Cache-Control: no-cache' --connect-timeout 15 --max-time 40 "$url" -o "$out"; then
                test -s "$out" && return 0
              fi
              sleep $((attempt * 3))
            done
            echo "::error::Unable to fetch $url after retries"
            return 1
          }

          index="$RUNNER_TEMP/solworldz-index.html"
          loader="$RUNNER_TEMP/worldz-media-payload.js"
          manifest="$RUNNER_TEMP/media-manifest.json"
          fetch_live "$base/?$cache" "$index"
          fetch_live "$base/assets/worldz-media-payload.js?$cache" "$loader"
          fetch_live "$base/assets/media-payload/manifest.json?$cache" "$manifest"

          grep -Fq './assets/worldz-media-payload.js' "$index" || {
            echo '::error::Live SolWorldz page does not load the shared media payload renderer.'
            exit 1
          }
          grep -Fq 'WorldzMediaPayload' "$loader" || {
            echo '::error::Live media payload renderer is not the expected implementation.'
            exit 1
          }
          jq -e '.assets | type == "object" and length > 0' "$manifest" >/dev/null || {
            echo '::error::Live media payload manifest is empty or invalid.'
            exit 1
          }

          images=(
            '/assets/images/website-core/solworldz/solworldz-desktop-hero.webp'
            '/assets/images/website-core/solworldz/solworldz-mobile-hero.webp'
            '/assets/images/website-core/action-creates-smiles/action-creates-smiles-reagan-kids.webp'
            '/assets/images/website-core/action-creates-smiles/kids-cartoon-kindness-changes-everything.webp'
            '/assets/images/website-core/action-creates-smiles/kids-cartoon-bunk-bed.webp'
          )

          i=0
          for image in "${images[@]}"; do
            i=$((i+1))
            mime="$(jq -r --arg key "$image" '.assets[$key].mime // empty' "$manifest")"
            expected_bytes="$(jq -r --arg key "$image" '.assets[$key].bytes // 0' "$manifest")"
            mapfile -t parts < <(jq -r --arg key "$image" '.assets[$key].parts[]?' "$manifest")

            [[ "$mime" == 'image/webp' ]] || {
              echo "::error::Missing or wrong payload MIME for $image: $mime"
              exit 1
            }
            (( expected_bytes > 1000 )) || {
              echo "::error::Payload manifest reports an invalid size for $image: $expected_bytes"
              exit 1
            }
            (( ${#parts[@]} > 0 )) || {
              echo "::error::No payload chunks published for $image"
              exit 1
            }

            b64="$RUNNER_TEMP/image-$i.b64"
            : > "$b64"
            p=0
            for part in "${parts[@]}"; do
              p=$((p+1))
              chunk="$RUNNER_TEMP/image-$i-part-$p.txt"
              fetch_live "$base$part?$cache&part=$p" "$chunk"
              tr -d '\r\n\t ' < "$chunk" >> "$b64"
            done

            out="$RUNNER_TEMP/image-$i.webp"
            base64 -d "$b64" > "$out" || {
              echo "::error::Payload Base64 failed to decode for $image"
              exit 1
            }
            actual_bytes="$(wc -c < "$out" | tr -d ' ')"
            [[ "$actual_bytes" == "$expected_bytes" ]] || {
              echo "::error::Reconstructed size mismatch for $image: expected=$expected_bytes actual=$actual_bytes"
              exit 1
            }
            webpinfo "$out" > "$RUNNER_TEMP/webp-$i.txt" 2>&1 || {
              cat "$RUNNER_TEMP/webp-$i.txt"
              echo "::error::Reconstructed payload is not a valid WebP: $image"
              exit 1
            }

            echo "PAYLOAD_OK=$image BYTES=$actual_bytes PARTS=${#parts[@]}"
            grep -E 'Canvas size|Width|Height' "$RUNNER_TEMP/webp-$i.txt" | head -n 8 || true
            echo '---'
          done

          echo 'All five SolWorldz images reconstructed and decoded from the live CryptoWorldz-style payload delivery path.'

      - name: Publish image check
        if: always()
        run: |
          {
            echo '## SolWorldz Payload Image Integrity Check'
            echo '- Verifies the live page loads the shared Worldz media payload renderer'
            echo '- Fetches the live payload manifest and every text chunk used by the five SolWorldz images'
            echo '- Reconstructs each WebP from Base64 and requires exact byte-size equality'
            echo '- Requires successful WebP decoding for every reconstructed image'
          } >> "$GITHUB_STEP_SUMMARY"
