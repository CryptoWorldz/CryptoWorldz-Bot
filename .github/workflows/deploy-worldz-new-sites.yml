name: Deploy Worldz HQ and Live
on:
  push:
    branches: [main]
    paths:
      - 'worldzhq.com/**'
      - 'worldz.live/**'
      - '.github/workflows/deploy-worldz-new-sites.yml'
      - 'purplediamondcrew.com/**'
      - 'tools/check_worldz_public_health.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worldz-new-sites-only
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_TLS_HOST: ${{ vars.FTP_TLS_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      SFTP_HOST: ${{ vars.SFTP_HOST || '145.223.108.40' }}
      SFTP_PORT: ${{ vars.SFTP_PORT || '65002' }}
      SFTP_USERNAME: ${{ secrets.SFTP_USERNAME || vars.SFTP_USERNAME || 'u643166328' }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - name: Validate sites and FTP configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$SFTP_PASSWORD" && -n "$SFTP_USERNAME" && -n "$SFTP_HOST" ]]; then
            echo 'SFTP credentials available; using SFTP deployment'
          else
            test -n "$FTP_HOST" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          fi
          for site in worldzhq.com worldz.live purplediamondcrew.com; do
            test -s "$site/index.html"
            grep -qi '<html' "$site/index.html"
          done
      - name: Install SFTP client
        if: env.SFTP_USERNAME != '' && env.SFTP_PASSWORD != ''
        run: python3 -m pip install --quiet paramiko
      - name: Inspect actual Hostinger folders before deployment
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import ftplib,ssl
          domains=['worldzhq.com','worldz.live','purplediamondcrew.com','worldzlaunch.com','worldz.website','worldz.site','worldz.online','worldz.space','worldz.store','worldz.autos','worldz.shop','worldz.support','worldz.business','worldz.help','worldz.charity','donateworldz.com','foodworldz.com']
          if os.getenv('SFTP_USERNAME') and os.getenv('SFTP_PASSWORD'):
              import paramiko
              transport=paramiko.Transport((os.environ['SFTP_HOST'],int(os.getenv('SFTP_PORT','65002'))))
              transport.connect(username=os.environ['SFTP_USERNAME'],password=os.environ['SFTP_PASSWORD'])
              sftp=paramiko.SFTPClient.from_transport(transport)
              try:
                  print('HOSTINGER_HOME '+sftp.normalize('.'),flush=True)
                  for domain in domains:
                      found=[]
                      for path in ('domains/'+domain+'/public_html',domain+'/public_html'):
                          try:
                              sftp.stat(path)
                              found.append(path)
                          except OSError: pass
                      print('HOSTINGER_SITE '+domain+' '+('READY '+','.join(found) if found else 'NO_SITE_DIRECTORY'),flush=True)
              finally:
                  sftp.close()
                  transport.close()
          else:
              print('HOSTINGER_AUDIT SFTP_NOT_CONFIGURED',flush=True)
          PY
      - name: Upload public assets to verified Hostinger site directories
        shell: bash
        run: |
          python3 - <<'PY'
          import os,ftplib,ssl,time,posixpath
          from pathlib import Path
          from posixpath import join
          root=Path.cwd()
          use_sftp=bool(os.getenv('SFTP_USERNAME') and os.getenv('SFTP_PASSWORD'))
          if use_sftp:
              import paramiko
              host=os.getenv('SFTP_HOST') or os.getenv('FTP_HOST')
              if not host: raise RuntimeError('SFTP host missing')
              import socket
              last_error=None
              for attempt in range(1,4):
                  try:
                      sock=socket.create_connection((host,int(os.getenv('SFTP_PORT','65002'))),timeout=18)
                      transport=paramiko.Transport(sock)
                      transport.connect(username=os.environ['SFTP_USERNAME'],password=os.environ['SFTP_PASSWORD'])
                      break
                  except (socket.timeout,OSError,paramiko.SSHException) as exc:
                      last_error=exc
                      print('SFTP_CONNECTION_ATTEMPT_FAILED '+str(attempt)+' '+type(exc).__name__,flush=True)
                      try: transport.close()
                      except (NameError,OSError): pass
                      if attempt==3: raise RuntimeError('SFTP connection failed after three attempts') from last_error
                      time.sleep(5)
              sftp=paramiko.SFTPClient.from_transport(transport)
              def upload_sftp(domain,files,site):
                  home=sftp.normalize('.')
                  print('SFTP_HOME '+home,flush=True)
                  print('SFTP_ROOT_ENTRIES '+','.join(sftp.listdir('.')),flush=True)
                  candidates=['domains/'+domain+'/public_html',domain+'/public_html']
                  existing=[]
                  for candidate in candidates:
                      try:
                          sftp.stat(candidate)
                          existing.append(candidate)
                      except OSError: pass
                  if len(existing)!=1:
                      raise RuntimeError('Ambiguous or missing SFTP target for '+domain+': '+','.join(existing)+'; refusing to create folders or overwrite wrong site')
                  base=existing[0]
                  for p in files:
                      dest=posixpath.join(base,p.relative_to(site).as_posix())
                      parent=posixpath.dirname(dest)
                      current=''
                      for part in parent.split('/'):
                          if not part: continue
                          current=(current+'/' if current else '')+part
                          try: sftp.stat(current)
                          except FileNotFoundError: sftp.mkdir(current)
                      sftp.put(str(p),dest)
              print('SFTP_SELECTED',flush=True)
          try:
           for domain in ('worldzhq.com','worldz.live','purplediamondcrew.com'):
              site=root/domain
              allowed={'.html','.css','.js','.svg','.png','.jpg','.jpeg','.webp','.gif','.ico','.woff','.woff2','.txt','.json'}
              files=[p for p in site.rglob('*') if p.is_file() and p.suffix.lower() in allowed and not any(part.startswith('.') for part in p.relative_to(site).parts) and p.name not in ('domain-plan.json','package.json','package-lock.json')]
              if not files: raise RuntimeError('No public assets for '+domain)
              print(f'DEPLOY_START {domain} files={len(files)}',flush=True)
              # Hostinger support identified cryptoworldz.xyz as the account's FTPS hostname.
              # Prefer the explicit environment setting, then the provider hostname;
              # retain strict TLS certificate validation and never use the numeric IP.
              if use_sftp:
                  upload_sftp(domain,files,site)
                  print('DEPLOY_UPLOAD_COMPLETE '+domain,flush=True)
                  continue
              ftp_host=os.environ.get('FTP_TLS_HOST') or os.environ.get('FTP_HOST')
              print('FTPS_HOST_SELECTED '+ftp_host,flush=True)
              if not ftp_host or all(ch.isdigit() or ch=='.' for ch in ftp_host):
                  raise RuntimeError('FTPS certificate verification requires a certificate-matching DNS hostname. Set FTP_TLS_HOST as a GitHub environment variable; no files were uploaded.')
              ftp=ftplib.FTP_TLS(context=ssl.create_default_context())
              ftp.connect(ftp_host,int(os.getenv('FTP_PORT','21')),timeout=40)
              ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
              ftp.prot_p()
              ftp.set_pasv(True)
              try:
                  base='domains/'+domain+'/public_html'
                  def ensure(path,create=False):
                      ftp.cwd('/')
                      for part in path.split('/'):
                          if not part:continue
                          try: ftp.cwd(part)
                          except ftplib.error_perm:
                              if not create: raise RuntimeError('Hostinger site root not found: '+path)
                              ftp.mkd(part);ftp.cwd(part)
                  ensure(base)
                  for p in files:
                      rel=p.relative_to(site).as_posix()
                      target=join(base,rel)
                      ensure(target.rsplit('/',1)[0],create=True)
                      with p.open('rb') as f: ftp.storbinary('STOR '+target.rsplit('/',1)[-1],f)
                  print('DEPLOY_UPLOAD_COMPLETE '+domain,flush=True)
              finally:
                  try:ftp.quit()
                  except Exception:ftp.close()
          finally:
              if use_sftp:
                  sftp.close()
                  transport.close()
          PY
      - name: Public HTTPS checks
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.request,urllib.error
          for domain in ('worldzhq.com','worldz.live','purplediamondcrew.com'):
              try:
                  with urllib.request.urlopen('https://'+domain+'/',timeout=20) as r:
                      body=r.read(100000).lower()
                      expected_marker = b'worldz' if domain == 'worldzhq.com' else (b'woodstock revival' if domain == 'worldz.live' else b'purple diamond crew')
                      if r.status != 200 or b'<html' not in body or expected_marker not in body:
                          raise ValueError('Wrong or missing Worldz website content at ' + domain)
                      print('PUBLIC_HTTPS_PASS '+domain)
              except Exception as e:
                  print('::error::PUBLIC_HTTPS_UNVERIFIED '+domain+' '+str(e))
                  raise
          PY

      - name: Verify public site HTML matches committed source
        run: python3 tools/check_worldz_public_health.py
