name: Validate BitWorldz OmniBTC

on:
  push:
    branches:
      - bitworldz-omnibtc-2026-09-25
    paths:
      - 'worldzpad-omnichain/bitworldz/**'
      - 'scripts/validate_worldz_bitworldz.py'
      - 'launchpad.cryptoworldz.xyz/bitworldz/**'
      - 'bitworldz.cryptoworldz.xyz/**'
  pull_request:
    paths:
      - 'worldzpad-omnichain/bitworldz/**'
      - 'scripts/validate_worldz_bitworldz.py'
      - 'launchpad.cryptoworldz.xyz/bitworldz/**'
      - 'bitworldz.cryptoworldz.xyz/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate BitWorldz contracts and public surfaces
        run: python scripts/validate_worldz_bitworldz.py
      - name: Run BitWorldz SDK self-test
        run: node worldzpad-omnichain/bitworldz/sdk/self-test.mjs
