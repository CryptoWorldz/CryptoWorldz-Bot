name: Zed OneWorldz Command Centre

on:
  push:
    branches: [main]
    paths:
      - "zed-command-centre/**"
      - ".github/workflows/zed-worldz-command-centre.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-oneworldz-command-centre
  cancel-in-progress: false

env:
  PROTECTED_DOMAIN: cryptobotz.cryptoworldz.xyz
  PROTECTED_NODE_ROOT: /domains/cryptobotz.cryptoworldz.xyz/nodejs

jobs:
  deploy:
    name: Rebuild Zed -> Hostinger -> Telegram proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Validate rebuilt Command Centre
        run: |
          set -euo pipefail
          node --check zed-command-centre/index.js
          grep -Fq "ResearchWorldz" zed-command-centre/index.js
          grep -Fq "LawWorldz" zed-command-centre/index.js
          grep -Fq "DonateWorldz" zed-command-centre/index.js
          ! grep -Fq "Leaderboards & Rewards" zed-command-centre/index.js
          echo 'ZED_WORLDZ_LOCAL=PASS'

      - name: Preserve current runtime and upload rebuilt Zed
        shell: bash
        run: |
          set -euo pipefail
          : "${FTP_HOST:?}"
          : "${FTP_USERNAME:?}"
          : "${FTP_PASSWORD:?}"
          python3 - <<'PY'
          import os, pathlib
          from ftplib import FTP_TLS

          host = os.environ['FTP_HOST'].replace('ftps://','').replace('ftp://','').split('/')[0]
          if host.count(':') == 1:
              host = host.split(':',1)[0]
          port = int(os.environ.get('FTP_PORT','21'))
          root = os.environ['PROTECTED_NODE_ROOT']
          tmp = pathlib.Path(os.environ['RUNNER_TEMP'])

          ftp = FTP_TLS()
          ftp.connect(host, port, timeout=45)
          ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          ftp.cwd(root)

          def download(name, target):
              try:
                  with open(target, 'wb') as f:
                      ftp.retrbinary('RETR ' + name, f.write)
                  return True
              except Exception:
                  return False

          env_path = tmp / 'zed-protected.env'
          if not download('.env', env_path):
              raise SystemExit('Protected .env could not be preserved')

          old_index = tmp / 'zed-legacy-index.js'
          if download('index.js', old_index):
              with open(old_index, 'rb') as f:
                  ftp.storbinary('STOR index.legacy-pre-worldz.js', f)

          with open('zed-command-centre/index.js', 'rb') as f:
              ftp.storbinary('STOR index.js', f)

          ftp.quit()
          print('ZED_WORLDZ_UPLOAD=PASS')
          PY

      - name: Restart Hostinger Node runtime
        shell: bash
        run: |
          set -euo pipefail
          : "${HOSTINGER_API_TOKEN:?}"
          echo "::add-mask::$HOSTINGER_API_TOKEN"
          domain_enc="$(node -p 'encodeURIComponent(process.env.PROTECTED_DOMAIN)')"
          curl --fail --silent --show-error --location             -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json'             "https://developers.hostinger.com/api/hosting/v1/websites?domain=${domain_enc}&per_page=25"             -o "$RUNNER_TEMP/zed-websites.json"
          username="$(node - <<'NODE'
          const p = require(process.env.RUNNER_TEMP + '/zed-websites.json');
          const domain = process.env.PROTECTED_DOMAIN.toLowerCase();
          const website = (p.data || []).find(function(row){ return String(row.domain || '').toLowerCase() === domain; });
          if (!website || !website.username) process.exit(2);
          process.stdout.write(String(website.username));
          NODE
          )"
          echo "::add-mask::$username"
          user_enc="$(HOSTINGER_USERNAME="$username" node -p 'encodeURIComponent(process.env.HOSTINGER_USERNAME)')"
          base="https://developers.hostinger.com/api/hosting/v1/accounts/${user_enc}/websites/${domain_enc}/nodejs"
          code="$(curl --silent --show-error --location --connect-timeout 15 --max-time 45             --request POST -o "$RUNNER_TEMP/zed-restart.json" -w '%{http_code}'             -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json'             "$base/server/restart" || true)"
          case "$code" in 200|201|202|204) ;; *) echo "Restart rejected: HTTP $code"; exit 1;; esac
          echo 'ZED_WORLDZ_RESTART=PASS'

      - name: Prove live Zed runtime
        shell: bash
        run: |
          set -euo pipefail
          pass=0
          for attempt in $(seq 1 30); do
            sleep 4
            code="$(curl --silent --show-error --location --connect-timeout 5 --max-time 15               -o "$RUNNER_TEMP/zed-health.json" -w '%{http_code}'               "https://${PROTECTED_DOMAIN}/health?proof=${GITHUB_RUN_ID}-${attempt}" || true)"
            if [ "$code" = 200 ] && HEALTH="$RUNNER_TEMP/zed-health.json" node - <<'NODE'
          const p = require(process.env.HEALTH);
          if (p.ok !== true) process.exit(1);
          if (p.service !== 'Zed OneWorldz Command Centre') process.exit(1);
          if (p.build !== 'worldz-problem-solving-v1') process.exit(1);
          if (Number(p.commands) !== 18) process.exit(1);
          NODE
            then
              pass=1
              break
            fi
          done
          test "$pass" = 1
          echo 'ZED_WORLDZ_LIVE=PASS'

      - name: Configure and prove Telegram commands and webhook
        shell: bash
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/zed-protected.env"
          test -s "$env_file"
          BOT_TOKEN="$(ENV_FILE="$env_file" node - <<'NODE'
          const fs = require('fs');
          const text = fs.readFileSync(process.env.ENV_FILE,'utf8');
          for (const raw of text.split(/\r?\n/)) {
            const line = raw.trim();
            if (!line || line.startsWith('#')) continue;
            const at = line.indexOf('=');
            if (at < 1) continue;
            const key = line.slice(0,at).replace(/^export\s+/,'').trim();
            if (key !== 'BOT_TOKEN') continue;
            let value = line.slice(at+1).trim();
            if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) value = value.slice(1,-1);
            process.stdout.write(value);
            process.exit(0);
          }
          process.exit(2);
          NODE
          )"
          test -n "$BOT_TOKEN"
          echo "::add-mask::$BOT_TOKEN"
          secret="$(BOT_TOKEN="$BOT_TOKEN" node -e "process.stdout.write(require('node:crypto').createHash('sha256').update(process.env.BOT_TOKEN).digest('hex').slice(0,64))")"
          commands="$(node - <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('zed-command-centre/index.js','utf8');
          const start = source.indexOf('const COMMANDS = [');
          const end = source.indexOf('];', start);
          if (start < 0 || end < 0) process.exit(2);
          const literal = source.slice(source.indexOf('[', start), end + 1);
          const commands = Function('return (' + literal + ')')();
          process.stdout.write(JSON.stringify({commands:commands}));
          NODE
          )"
          api="https://api.telegram.org/bot${BOT_TOKEN}"
          curl --fail --silent --show-error -X POST "$api/setMyCommands" -H 'Content-Type: application/json' --data-binary "$commands" > "$RUNNER_TEMP/zed-set-commands.json"
          curl --fail --silent --show-error -X POST "$api/setChatMenuButton" -H 'Content-Type: application/json' --data '{"menu_button":{"type":"commands"}}' > "$RUNNER_TEMP/zed-set-menu.json"
          WEBHOOK_SECRET="$secret" node - <<'NODE' > "$RUNNER_TEMP/zed-webhook-request.json"
          process.stdout.write(JSON.stringify({
            url:'https://cryptobotz.cryptoworldz.xyz/telegram/webhook',
            secret_token:process.env.WEBHOOK_SECRET,
            allowed_updates:['message','callback_query'],
            drop_pending_updates:false
          }));
          NODE
          curl --fail --silent --show-error -X POST "$api/setWebhook" -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/zed-webhook-request.json" > "$RUNNER_TEMP/zed-set-webhook.json"
          curl --fail --silent --show-error "$api/getWebhookInfo" > "$RUNNER_TEMP/zed-webhook-info.json"
          FILES="$RUNNER_TEMP/zed-set-commands.json:$RUNNER_TEMP/zed-set-menu.json:$RUNNER_TEMP/zed-set-webhook.json:$RUNNER_TEMP/zed-webhook-info.json" node - <<'NODE'
          const fs = require('fs');
          const files = process.env.FILES.split(':');
          const payloads = files.map(function(file){ return JSON.parse(fs.readFileSync(file,'utf8')); });
          for (const p of payloads) if (p.ok !== true) process.exit(1);
          if (payloads[3].result.url !== 'https://cryptobotz.cryptoworldz.xyz/telegram/webhook') process.exit(1);
          NODE
          echo 'ZED_TELEGRAM_COMMANDS=PASS'
          echo 'ZED_TELEGRAM_WEBHOOK=PASS'

      - name: Final verdict
        run: echo 'ZED_ONEWORLDZ_COMMAND_CENTRE=PASS'
