name: Zed OneWorldz Command Centre

on:
  push:
    branches: [main]
    paths:
      - "zed-command-centre/**"
      - ".github/workflows/zed-worldz-command-centre.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-oneworldz-command-centre
  cancel-in-progress: false

env:
  PROTECTED_DOMAIN: cryptobotz.cryptoworldz.xyz
  PROTECTED_NODE_ROOT: /domains/cryptobotz.cryptoworldz.xyz/nodejs

jobs:
  deploy:
    name: Rebuild Zed -> Hostinger managed release -> Telegram proof
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}

    steps:
      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Validate rebuilt Command Centre
        run: |
          set -euo pipefail
          node --check zed-command-centre/index.js
          node -e "const p=require('./zed-command-centre/package.json'); if(p.type!=='commonjs') process.exit(1)"
          grep -Fq "ResearchWorldz" zed-command-centre/index.js
          grep -Fq "LawWorldz" zed-command-centre/index.js
          grep -Fq "DonateWorldz" zed-command-centre/index.js
          ! grep -Fq "Leaderboards & Rewards" zed-command-centre/index.js
          echo 'ZED_WORLDZ_LOCAL=PASS'

      - name: Preserve protected environment and upload managed-build archive
        shell: bash
        run: |
          set -euo pipefail
          : "${FTP_HOST:?}"
          : "${FTP_USERNAME:?}"
          : "${FTP_PASSWORD:?}"
          python3 - <<'PY'
          import os, pathlib, tarfile
          from ftplib import FTP_TLS

          host = os.environ['FTP_HOST'].replace('ftps://','').replace('ftp://','').split('/')[0]
          if host.count(':') == 1:
              host = host.split(':',1)[0]
          port = int(os.environ.get('FTP_PORT','21'))
          root = os.environ['PROTECTED_NODE_ROOT']
          tmp = pathlib.Path(os.environ['RUNNER_TEMP'])
          archive_name = '.zed-worldz-' + os.environ['GITHUB_RUN_ID'] + '.tgz'
          archive = tmp / archive_name

          ftp = FTP_TLS()
          ftp.connect(host, port, timeout=45)
          ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          ftp.cwd(root)

          def download(name, target):
              try:
                  with open(target, 'wb') as f:
                      ftp.retrbinary('RETR ' + name, f.write)
                  return True
              except Exception:
                  return False

          env_path = tmp / 'zed-protected.env'
          if not download('.env', env_path):
              raise SystemExit('Protected .env could not be preserved')

          legacy = tmp / 'zed-legacy-index.js'
          download('index.js', legacy)

          with tarfile.open(archive, 'w:gz') as tar:
              tar.add('zed-command-centre/index.js', arcname='index.js')
              tar.add('zed-command-centre/package.json', arcname='package.json')
              tar.add('zed-command-centre/package-lock.json', arcname='package-lock.json')

          ftp.cwd(root + '/../public_html')
          with open(archive, 'rb') as f:
              ftp.storbinary('STOR ' + archive_name, f)
          ftp.quit()

          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('ZED_ARCHIVE_NAME=' + archive_name + '\n')
          print('ZED_MANAGED_ARCHIVE_UPLOAD=PASS')
          PY

      - name: Create and activate Hostinger managed Node release
        shell: bash
        run: |
          set -euo pipefail
          : "${HOSTINGER_API_TOKEN:?}"
          echo "::add-mask::$HOSTINGER_API_TOKEN"
          domain_enc="$(node -p 'encodeURIComponent(process.env.PROTECTED_DOMAIN)')"
          curl --fail --silent --show-error --location -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "https://developers.hostinger.com/api/hosting/v1/websites?domain=${domain_enc}&per_page=25" -o "$RUNNER_TEMP/zed-websites.json"
          username="$(node - <<'NODE'
          const p=require(process.env.RUNNER_TEMP+'/zed-websites.json');
          const d=process.env.PROTECTED_DOMAIN.toLowerCase();
          const row=(p.data||[]).find(function(x){return String(x.domain||'').toLowerCase()===d;});
          if(!row||!row.username) process.exit(2);
          process.stdout.write(String(row.username));
          NODE
          )"
          echo "::add-mask::$username"
          user_enc="$(HOSTINGER_USERNAME="$username" node -p 'encodeURIComponent(process.env.HOSTINGER_USERNAME)')"
          base="https://developers.hostinger.com/api/hosting/v1/accounts/${user_enc}/websites/${domain_enc}/nodejs"
          echo "ZED_NODE_API_BASE=$base" >> "$GITHUB_ENV"

          ENV_FILE="$RUNNER_TEMP/zed-protected.env" node - <<'NODE' > "$RUNNER_TEMP/zed-managed-env.json"
          const fs=require('fs');
          const text=fs.readFileSync(process.env.ENV_FILE,'utf8');
          const env_vars=[];
          for(const raw of text.split(/\\r?\\n/)){
            const line=raw.trim();
            if(!line || line.startsWith('#')) continue;
            const at=line.indexOf('=');
            if(at<1) continue;
            const key=line.slice(0,at).replace(/^export\\s+/,'').trim();
            if(!/^[A-Za-z_][A-Za-z0-9_]*$/.test(key)) continue;
            let value=line.slice(at+1).trim();
            if((value.startsWith('"')&&value.endsWith('"'))||(value.startsWith("'")&&value.endsWith("'"))) value=value.slice(1,-1);
            if(!value) continue;
            env_vars.push({key,value});
          }
          if(!env_vars.some(function(x){return x.key==='BOT_TOKEN';})) process.exit(2);
          process.stdout.write(JSON.stringify({env_vars}));
          NODE
          env_code="$(curl --silent --show-error --location --connect-timeout 15 --max-time 60 --request PUT -o "$RUNNER_TEMP/zed-managed-env-response.json" -w '%{http_code}' -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/zed-managed-env.json" "$base/builds/settings/env" || true)"
          rm -f "$RUNNER_TEMP/zed-managed-env.json"
          case "$env_code" in 200|201|202|204) ;; *) cat "$RUNNER_TEMP/zed-managed-env-response.json" || true; echo "Managed environment rejected: HTTP $env_code"; exit 1;; esac
          echo 'ZED_MANAGED_ENV=PASS'

          ARCHIVE_NAME="$ZED_ARCHIVE_NAME" node - <<'NODE' > "$RUNNER_TEMP/zed-build-request.json"
          process.stdout.write(JSON.stringify({
            node_version:22,
            app_type:'express',
            root_directory:'.',
            output_directory:'.',
            entry_file:'index.js',
            package_manager:'npm',
            source_type:'archive',
            source_options:{archive_path:process.env.ARCHIVE_NAME}
          }));
          NODE

          build_code="$(curl --silent --show-error --location --connect-timeout 15 --max-time 60 --request POST -o "$RUNNER_TEMP/zed-build-create.json" -w '%{http_code}' -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/zed-build-request.json" "$base/builds" || true)"
          case "$build_code" in 200|201|202) ;; *) cat "$RUNNER_TEMP/zed-build-create.json" || true; echo "Managed build rejected: HTTP $build_code"; exit 1;; esac

          build_uuid="$(BUILD_CREATE="$RUNNER_TEMP/zed-build-create.json" node - <<'NODE'
          const p=require(process.env.BUILD_CREATE);
          const id=p.uuid||(p.data&&p.data.uuid)||p.id||(p.data&&p.data.id);
          if(!id) process.exit(2);
          process.stdout.write(String(id));
          NODE
          )"
          echo "ZED_MANAGED_BUILD=STARTED uuid=$build_uuid"

          pass=0
          for attempt in $(seq 1 90); do
            sleep 10
            curl --fail --silent --show-error --location -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "$base/builds?per_page=25" -o "$RUNNER_TEMP/zed-builds.json"
            state="$(BUILD_LIST="$RUNNER_TEMP/zed-builds.json" BUILD_UUID="$build_uuid" node - <<'NODE'
          const p=require(process.env.BUILD_LIST);
          const rows=Array.isArray(p)?p:(Array.isArray(p.data)?p.data:(Array.isArray(p.items)?p.items:[]));
          const row=rows.find(function(x){return String(x.uuid||x.id)===process.env.BUILD_UUID;});
          process.stdout.write(String((row&&(row.state||row.status))||'pending').toLowerCase());
          NODE
          )"
            echo "ZED_MANAGED_BUILD attempt=$attempt state=$state"
            case "$state" in
              completed|complete|success|succeeded|ready) pass=1; break;;
              failed|error|cancelled|canceled)
                curl --silent --show-error --location -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "$base/builds/$build_uuid/logs" || true
                exit 1;;
            esac
          done
          test "$pass" = 1
          echo 'ZED_MANAGED_BUILD=PASS'

      - name: Restore protected environment and restart managed release
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib
          from ftplib import FTP_TLS

          host = os.environ['FTP_HOST'].replace('ftps://','').replace('ftp://','').split('/')[0]
          if host.count(':') == 1:
              host = host.split(':',1)[0]
          port = int(os.environ.get('FTP_PORT','21'))
          root = os.environ['PROTECTED_NODE_ROOT']
          tmp = pathlib.Path(os.environ['RUNNER_TEMP'])

          ftp = FTP_TLS()
          ftp.connect(host, port, timeout=45)
          ftp.login(os.environ['FTP_USERNAME'], os.environ['FTP_PASSWORD'])
          ftp.prot_p()
          ftp.cwd(root)
          with open(tmp/'zed-protected.env','rb') as f:
              ftp.storbinary('STOR .env', f)
          legacy = tmp/'zed-legacy-index.js'
          if legacy.exists() and legacy.stat().st_size:
              with open(legacy,'rb') as f:
                  ftp.storbinary('STOR index.legacy-pre-worldz.js', f)
          try:
              ftp.cwd(root + '/../public_html')
              ftp.delete(os.environ['ZED_ARCHIVE_NAME'])
          except Exception:
              pass
          ftp.quit()
          print('ZED_PROTECTED_ENV_RESTORED=PASS')
          PY

          code="$(curl --silent --show-error --location --connect-timeout 15 --max-time 45 --request POST -o "$RUNNER_TEMP/zed-restart.json" -w '%{http_code}' -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "$ZED_NODE_API_BASE/server/restart" || true)"
          case "$code" in 200|201|202|204) ;; *) cat "$RUNNER_TEMP/zed-restart.json" || true; echo "Restart rejected: HTTP $code"; exit 1;; esac
          echo 'ZED_WORLDZ_RESTART=PASS'

      - name: Prove live Zed runtime
        shell: bash
        run: |
          set -euo pipefail
          pass=0
          for attempt in $(seq 1 30); do
            sleep 4
            code="$(curl --silent --show-error --location --connect-timeout 5 --max-time 15 -o "$RUNNER_TEMP/zed-health.json" -w '%{http_code}' "https://${PROTECTED_DOMAIN}/health?proof=${GITHUB_RUN_ID}-${attempt}" || true)"
            echo "ZED_LIVE_PROBE attempt=$attempt http=$code"
            if [ "$code" = 200 ] && HEALTH="$RUNNER_TEMP/zed-health.json" node - <<'NODE'
          const p=require(process.env.HEALTH);
          if(p.ok!==true) process.exit(1);
          if(p.service!=='Zed OneWorldz Command Centre') process.exit(1);
          if(p.build!=='worldz-problem-solving-v1') process.exit(1);
          if(Number(p.commands)!==18) process.exit(1);
          if(p.telegram_configured!==true) process.exit(1);
          NODE
            then pass=1; break; fi
          done
          test "$pass" = 1
          echo 'ZED_WORLDZ_LIVE=PASS'

      - name: Configure and prove Telegram commands and webhook
        shell: bash
        run: |
          set -euo pipefail
          env_file="$RUNNER_TEMP/zed-protected.env"
          BOT_TOKEN="$(ENV_FILE="$env_file" node - <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync(process.env.ENV_FILE,'utf8');
          for(const raw of text.split(/\r?\n/)){
            const line=raw.trim(); if(!line||line.startsWith('#')) continue;
            const at=line.indexOf('='); if(at<1) continue;
            const key=line.slice(0,at).replace(/^export\s+/,'').trim(); if(key!=='BOT_TOKEN') continue;
            let value=line.slice(at+1).trim();
            if((value.startsWith('"')&&value.endsWith('"'))||(value.startsWith("'")&&value.endsWith("'"))) value=value.slice(1,-1);
            process.stdout.write(value); process.exit(0);
          }
          process.exit(2);
          NODE
          )"
          test -n "$BOT_TOKEN"
          echo "::add-mask::$BOT_TOKEN"
          secret="$(BOT_TOKEN="$BOT_TOKEN" node -e "process.stdout.write(require('node:crypto').createHash('sha256').update(process.env.BOT_TOKEN).digest('hex').slice(0,64))")"
          commands="$(node - <<'NODE'
          const fs=require('fs');
          const source=fs.readFileSync('zed-command-centre/index.js','utf8');
          const start=source.indexOf('const COMMANDS = [');
          const end=source.indexOf('];',start);
          const literal=source.slice(source.indexOf('[',start),end+1);
          process.stdout.write(JSON.stringify({commands:Function('return ('+literal+')')()}));
          NODE
          )"
          api="https://api.telegram.org/bot${BOT_TOKEN}"
          curl --fail --silent --show-error -X POST "$api/setMyCommands" -H 'Content-Type: application/json' --data-binary "$commands" > "$RUNNER_TEMP/zed-set-commands.json"
          curl --fail --silent --show-error -X POST "$api/setChatMenuButton" -H 'Content-Type: application/json' --data '{"menu_button":{"type":"commands"}}' > "$RUNNER_TEMP/zed-set-menu.json"
          WEBHOOK_SECRET="$secret" node - <<'NODE' > "$RUNNER_TEMP/zed-webhook-request.json"
          process.stdout.write(JSON.stringify({
            url:'https://cryptobotz.cryptoworldz.xyz/telegram/webhook',
            secret_token:process.env.WEBHOOK_SECRET,
            allowed_updates:['message','callback_query'],
            drop_pending_updates:false
          }));
          NODE
          curl --fail --silent --show-error -X POST "$api/setWebhook" -H 'Content-Type: application/json' --data-binary "@$RUNNER_TEMP/zed-webhook-request.json" > "$RUNNER_TEMP/zed-set-webhook.json"
          curl --fail --silent --show-error "$api/getWebhookInfo" > "$RUNNER_TEMP/zed-webhook-info.json"
          curl --fail --silent --show-error "$api/getMyCommands" > "$RUNNER_TEMP/zed-get-commands.json"
          FILES="$RUNNER_TEMP/zed-set-commands.json:$RUNNER_TEMP/zed-set-menu.json:$RUNNER_TEMP/zed-set-webhook.json:$RUNNER_TEMP/zed-webhook-info.json:$RUNNER_TEMP/zed-get-commands.json" node - <<'NODE'
          const fs=require('fs');
          const p=process.env.FILES.split(':').map(function(file){return JSON.parse(fs.readFileSync(file,'utf8'));});
          for(const x of p) if(x.ok!==true) process.exit(1);
          if(p[3].result.url!=='https://cryptobotz.cryptoworldz.xyz/telegram/webhook') process.exit(1);
          const commands=(p[4].result||[]).map(function(x){return x.command;});
          const expected=['start','help','system','research','food','water','grow','health','shelter','education','energy','waste','transport','money','integrity','law','oneworldz','donate'];
          if(JSON.stringify(commands)!==JSON.stringify(expected)) process.exit(1);
          const retired=['profile','register','rewards','points','leaderboard','raid','raaiiidd','missions','wallet','kitty','governance','vote','impact','airdrop','airdrops','events','treasury'];
          if(retired.some(function(x){return commands.includes(x);})) process.exit(1);
          NODE
          echo 'ZED_TELEGRAM_COMMANDS=PASS'
          echo 'ZED_TELEGRAM_WEBHOOK=PASS'

      - name: Final verdict
        run: echo 'ZED_ONEWORLDZ_COMMAND_CENTRE=PASS'
