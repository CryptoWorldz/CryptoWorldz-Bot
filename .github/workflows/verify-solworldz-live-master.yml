name: Verify SolWorldz Live Master Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-solworldz-live-master.yml'
      - 'tools/prove-solworldz-public-images.mjs'

permissions:
  contents: read

env:
  EXPECTED_GUARD: SOLWORLDZ.XYZ

jobs:
  verify:
    name: Read-only live origin and public proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: solworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT }}
      FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
      FTP_ACCOUNT_SCOPE: ${{ vars.FTP_ACCOUNT_SCOPE }}
      DEPLOY_GUARD: ${{ vars.DEPLOY_GUARD }}
    steps:
      - name: Check out source of truth
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild exact approved release
        shell: bash
        run: |
          set -euo pipefail
          node tools/verify-solworldz-standalone.mjs
          node tools/build-solworldz-release.mjs
          node tools/audit-solworldz-links.mjs
          [[ "$(find dist/solworldz/assets/master -type f -name '*.jpg' | wc -l | tr -d ' ')" == '20' ]]
          ! grep -RFiq 'solworld.fun' dist/solworldz

      - name: Prove exact release renders on desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          SOLWORLDZ_RELEASE_ROOT='dist/solworldz' SOLWORLDZ_RELEASE_PORT=8088 node tools/serve-solworldz-release.mjs > "$RUNNER_TEMP/solworldz-local-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do curl -fsS 'http://127.0.0.1:8088/' -o /dev/null && break || sleep 0.2; done
          SOLWORLDZ_PROOF_URL='http://127.0.0.1:8088/' SOLWORLDZ_BROWSER_PROOF_DIR='dist/solworldz-live-verification-browser-proof' node tools/check-solworldz-live-browser.mjs
          kill "$server_pid" 2>/dev/null || true
          trap - EXIT

      - name: Validate domain-only FTPS guard
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FTP_HOST:-}" && test -n "${FTP_USERNAME:-}" && test -n "${FTP_PASSWORD:-}"
          [[ "${FTP_PORT:-21}" == '21' ]]
          [[ "${FTP_SERVER_DIR:-/}" == '/' ]]
          [[ "${FTP_ACCOUNT_SCOPE:-}" == 'DOMAIN_ONLY' ]]
          [[ "${DEPLOY_GUARD:-}" == "$EXPECTED_GUARD" ]]

      - name: Install FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Prove Hostinger TLS identity before credentials
        shell: bash
        run: |
          set -euo pipefail
          ftp_ip="$(getent ahostsv4 "$FTP_HOST" | awk 'NR==1{print $1}')"
          test -n "$ftp_ip"
          openssl s_client -starttls ftp -connect "$ftp_ip:${FTP_PORT:-21}" -verify_return_error -CAfile /etc/ssl/certs/ca-certificates.crt -showcerts </dev/null > "$RUNNER_TEMP/ftp-certs.txt" 2>/dev/null
          awk '/-----BEGIN CERTIFICATE-----/{p=1} p{print} /-----END CERTIFICATE-----/{exit}' "$RUNNER_TEMP/ftp-certs.txt" > "$RUNNER_TEMP/ftp-leaf.pem"
          openssl x509 -in "$RUNNER_TEMP/ftp-leaf.pem" -noout -ext subjectAltName | grep -Fq 'DNS:*.hstgr.io'
          echo 'CA-verified Hostinger FTPS identity proved.'

      - name: Download live FTP origin release surface read-only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/origin-master"
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "${FTP_PORT:-21}" "$FTP_HOST" <<EOF
          set cmd:fail-exit true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          set net:max-retries 1
          set net:timeout 30
          cd ${FTP_SERVER_DIR:-/}
          get index.html -o $RUNNER_TEMP/origin-index.html
          get .htaccess -o $RUNNER_TEMP/origin-htaccess
          mirror --verbose --parallel=2 assets/master $RUNNER_TEMP/origin-master
          bye
          EOF
          test -s "$RUNNER_TEMP/origin-index.html"
          test -s "$RUNNER_TEMP/origin-htaccess"

      - name: Prove FTP origin exactly matches approved HTML and all 20 image bytes
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(sha256sum "$RUNNER_TEMP/origin-index.html" | awk '{print $1}')" == "$(sha256sum dist/solworldz/index.html | awk '{print $1}')" ]]
          [[ "$(sha256sum "$RUNNER_TEMP/origin-htaccess" | awk '{print $1}')" == "$(sha256sum dist/solworldz/.htaccess | awk '{print $1}')" ]]
          node -e "const m=require('./dist/solworldz/release-manifest.json'); for(const f of m.files.filter(x=>x.path.startsWith('assets/master/'))) console.log(f.path)" > "$RUNNER_TEMP/master-paths.txt"
          count=0
          while IFS= read -r file; do
            count=$((count+1))
            relative="${file#assets/master/}"
            origin="$RUNNER_TEMP/origin-master/$relative"
            test -s "$origin" || { echo "::error::FTP origin missing $file"; exit 1; }
            [[ "$(sha256sum "$origin" | awk '{print $1}')" == "$(sha256sum "dist/solworldz/$file" | awk '{print $1}')" ]] || { echo "::error::FTP origin hash mismatch: $file"; exit 1; }
          done < "$RUNNER_TEMP/master-paths.txt"
          [[ "$count" == '20' ]]
          echo 'FTP origin exact proof passed: HTML, .htaccess and all 20 master image byte hashes match the approved release.'

      - name: Prove public HTML exactly matches approved release
        shell: bash
        run: |
          set -euo pipefail
          local_sha="$(sha256sum dist/solworldz/index.html | awk '{print $1}')"
          matched=false
          for attempt in $(seq 1 8); do
            curl -L -fsS --compressed -H 'Cache-Control: no-cache' "https://solworldz.xyz/?liveproof=${GITHUB_RUN_ID}-$attempt" -o "$RUNNER_TEMP/public-index.html" || true
            if [[ -s "$RUNNER_TEMP/public-index.html" ]] && [[ "$(sha256sum "$RUNNER_TEMP/public-index.html" | awk '{print $1}')" == "$local_sha" ]]; then matched=true; break; fi
            sleep 2
          done
          [[ "$matched" == 'true' ]] || { echo '::error::Public SolWorldz HTML does not exactly match approved release'; exit 1; }
          ! grep -Fiq 'solworld.fun' "$RUNNER_TEMP/public-index.html"
          echo 'Public SolWorldz HTML exact SHA-256 proof passed.'

      - name: Prove all public master images remain full resolution
        run: node tools/prove-solworldz-public-images.mjs

      - name: Re-prove published clickable destinations
        run: node tools/audit-solworldz-links.mjs

      - name: Upload browser proof
        uses: actions/upload-artifact@v4
        with:
          name: solworldz-live-verification-browser-proof-${{ github.run_id }}
          path: dist/solworldz-live-verification-browser-proof
          if-no-files-found: error
          retention-days: 30

      - name: Publish verified status
        run: |
          {
            echo '## SolWorldz LIVE — VERIFIED'
            echo '- Approved master archive checksum: passed'
            echo '- Desktop + mobile rendering of exact live source package: passed'
            echo '- FTP origin HTML/.htaccess: exact hash match'
            echo '- FTP origin 20 master images: exact byte hash match'
            echo '- Public HTML: exact hash match'
            echo '- Public 20 master images: exact approved dimensions'
            echo '- Retired SolWorld.fun: absent and hard blocked'
            echo '- Published clickable Worldz links: passed'
            echo '- Zed and Auto: untouched'
          } >> "$GITHUB_STEP_SUMMARY"
