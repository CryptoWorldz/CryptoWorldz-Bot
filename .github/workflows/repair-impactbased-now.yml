name: Repair ImpactBased Canonical Route

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-impactbased-now.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: impactbased-canonical-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Check and repair impactbased.oneworldz.com only
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      PREVIEW_RUN_ID: '32040381728'
      TARGET_DOMAIN: impactbased.oneworldz.com
      TARGET_DIR: domains/oneworldz.com/public_html/impactbased
    steps:
      - name: Checkout deployment rail
        uses: actions/checkout@v4

      - name: Check canonical public route before write
        id: before
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -L -sS -o "$RUNNER_TEMP/before.html" -w '%{http_code}' --connect-timeout 15 --max-time 45 -H 'Cache-Control: no-cache, no-store' "https://${TARGET_DOMAIN}/?repair_check=${GITHUB_RUN_ID}" || true)"
          echo "status=$code" >> "$GITHUB_OUTPUT"
          echo "ImpactBased pre-repair HTTP status: $code"
          if [ "$code" = '200' ] && grep -Fq '<title>ImpactBased | Purpose-Driven Launch Board</title>' "$RUNNER_TEMP/before.html" && grep -Fq 'ImpactBased' "$RUNNER_TEMP/before.html"; then
            echo 'healthy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'healthy=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Download exact approved immutable fleet candidate
        if: ${{ steps.before.outputs.healthy != 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: oneworldz-candidate-${{ env.PREVIEW_RUN_ID }}
          path: approved-candidate
          github-token: ${{ github.token }}
          repository: CryptoWorldz/CryptoWorldz-Bot
          run-id: ${{ env.PREVIEW_RUN_ID }}

      - name: Verify exact ImpactBased candidate boundary
        if: ${{ steps.before.outputs.healthy != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          root='approved-candidate/impactbased'
          test -s "$root/index.html"
          grep -Fq '<title>ImpactBased | Purpose-Driven Launch Board</title>' "$root/index.html"
          grep -Fq 'ImpactBased' "$root/index.html"
          test -s "$root/robots.txt"
          test -s "$root/sitemap.xml"
          ! grep -RIE 'OPENAI_API_KEY|sk-proj-|sk_live_|sk_test_|service_role|FTP_PASSWORD|DATABASE_URL|SUPABASE_SERVICE' "$root"

      - name: Install FTPS client
        if: ${{ steps.before.outputs.healthy != 'true' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Restore exact ImpactBased package to canonical Hostinger root
        if: ${{ steps.before.outputs.healthy != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_HOST"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          echo "::add-mask::$FTP_HOST"
          echo "::add-mask::$FTP_USERNAME"
          echo "::add-mask::$FTP_PASSWORD"
          host="$(printf '%s' "$FTP_HOST" | sed -e 's#^ftp[s]*://##' -e 's#/.*$##')"
          if [[ "$host" != *:*:* && "$host" == *:* ]]; then host="${host%%:*}"; fi
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" "$host" <<LFTP
          set cmd:fail-exit true
          set net:max-retries 2
          set net:timeout 30
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          cd "$TARGET_DIR"
          pwd
          cls -la
          mirror -R --delete --verbose "approved-candidate/impactbased" .
          cls -la
          bye
          LFTP

      - name: Verify canonical ImpactBased after repair
        shell: bash
        run: |
          set -euo pipefail
          passed=0
          for attempt in $(seq 1 12); do
            code="$(curl -L -sS -o "$RUNNER_TEMP/after.html" -w '%{http_code}' --connect-timeout 15 --max-time 45 -H 'Cache-Control: no-cache, no-store' -H 'Pragma: no-cache' "https://${TARGET_DOMAIN}/?repair_verify=${GITHUB_RUN_ID}-${attempt}" || true)"
            echo "Attempt ${attempt}: HTTP ${code}"
            if [ "$code" = '200' ] && grep -Fq '<title>ImpactBased | Purpose-Driven Launch Board</title>' "$RUNNER_TEMP/after.html" && grep -Fq 'ImpactBased' "$RUNNER_TEMP/after.html"; then
              passed=1
              break
            fi
            sleep 5
          done
          test "$passed" = '1'
          echo 'IMPACTBASED_CANONICAL_ROUTE_PASS_HTTP_200'

      - name: Record repair result
        if: always()
        shell: bash
        run: |
          {
            echo '## ImpactBased canonical route repair'
            echo "- Domain: https://${TARGET_DOMAIN}/"
            echo "- Canonical Hostinger root: ${TARGET_DIR}"
            echo "- Pre-check healthy: ${{ steps.before.outputs.healthy }}"
            echo "- Pre-check HTTP: ${{ steps.before.outputs.status }}"
            echo '- Approved candidate run: 32040381728'
            echo '- Scope: ImpactBased only; no other production directory is written by this workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
