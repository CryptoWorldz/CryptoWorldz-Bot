name: Audit Worldz Browser Rendering

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'diagnostics/worldz-browser-audit.request'

permissions:
  contents: read

env:
  FORCE_COLOR: '1'

jobs:
  browser-audit:
    name: Render ${{ matrix.target.name }} in Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target:
          - { name: OneWorldz, url: 'https://oneworldz.com/' }
          - { name: Reagan, url: 'https://oneworldz.com/reagan-kauja/' }
          - { name: ImpactBased, url: 'https://oneworldz.com/worldz/impactbased' }
          - { name: LawWorldz, url: 'https://oneworldz.com/worldz/law' }
          - { name: LearnWorldz, url: 'https://oneworldz.com/worldz/learn' }
          - { name: BitWorldz, url: 'https://oneworldz.com/worldz/bitworldz' }
          - { name: CryptoWorldz, url: 'https://cryptoworldz.xyz/' }
          - { name: SolWorldz, url: 'https://solworldz.xyz/' }
          - { name: EthWorldz, url: 'https://ethworldz.xyz/' }
          - { name: BaseWorldz, url: 'https://baseworldz.xyz/' }
          - { name: BNBWorldz, url: 'https://bnbworldz.xyz/' }
          - { name: XRPWorldz, url: 'https://xrpworldz.xyz/' }
          - { name: SuiWorldz, url: 'https://suiworldz.xyz/' }
          - { name: HyperWorldz, url: 'https://hyperworldz.xyz/' }
          - { name: RobinWorldz, url: 'https://robinworldz.xyz/' }
          - { name: HodlerWorldz, url: 'https://hodlerworldz.xyz/' }
          - { name: PurpleDiamondCrew, url: 'https://purplediamondcrew.com/' }

    steps:
      - name: Check out production source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm browser availability
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            google-chrome-stable --version
          elif command -v chromium >/dev/null 2>&1; then
            chromium --version
          elif command -v chromium-browser >/dev/null 2>&1; then
            chromium-browser --version
          else
            echo 'No Chrome/Chromium found on GitHub runner' >&2
            exit 1
          fi

      - name: Run challenge-aware desktop/mobile browser proof
        id: audit
        continue-on-error: true
        env:
          TARGET_NAME: ${{ matrix.target.name }}
          TARGET_URL: ${{ matrix.target.url }}
        run: node tools/worldz-browser-audit-fast-v3.mjs

      - name: Upload this target screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldz-browser-${{ matrix.target.name }}-${{ github.run_id }}
          path: browser-audit/
          if-no-files-found: error
          retention-days: 14

      - name: Print proof result
        if: always()
        shell: bash
        run: |
          test -f browser-audit/report.json
          node -e "const r=require('./browser-audit/report.json'); for (const x of r.results) console.log((x.ok?'PASS ':'FAIL ')+r.target+' '+x.viewport+(x.reasons.length?' :: '+x.reasons.join('; '):'')); if(!r.passed) process.exit(1)"

      - name: Enforce audit outcome
        if: always()
        shell: bash
        run: |
          test '${{ steps.audit.outcome }}' = 'success'
