name: Audit Worldz Browser Rendering

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - forensics/browser-proof-gate-v4
    paths:
      - 'diagnostics/worldz-browser-audit.request'
      - 'tools/worldz-browser-audit-fast-v5.mjs'
      - 'tools/worldz-css-url-parser.mjs'
      - 'tools/worldz-css-url-parser.test.mjs'
      - '.github/workflows/audit-worldz-browser.yml'

permissions:
  contents: read

env:
  FORCE_COLOR: '1'

jobs:
  parser-regression:
    name: Validate browser proof parser guards
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out audit source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run CSS image URL regression tests
        run: node --test tools/worldz-css-url-parser.test.mjs
      - name: Syntax-check Browser Proof Gate v5
        run: node --check tools/worldz-browser-audit-fast-v5.mjs

  browser-audit:
    needs: parser-regression
    name: Render ${{ matrix.target.name }} in Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        target:
          - { name: OneWorldz, url: 'https://oneworldz.com/', require_image: 'true' }
          - { name: Reagan, url: 'https://oneworldz.com/reagan-kauja/', require_image: 'true' }
          - { name: ImpactBased, url: 'https://impactbased.oneworldz.com/', require_image: 'true' }
          - { name: LawWorldz, url: 'https://law.oneworldz.com/', require_image: 'true' }
          - { name: LearnWorldz, url: 'https://learn.oneworldz.com/', require_image: 'true' }
          - { name: BitcoinWorldz, url: 'https://bitcoinworldz.xyz/', require_image: 'true' }
          - { name: CryptoWorldz, url: 'https://cryptoworldz.xyz/', require_image: 'false' }
          - { name: SolWorldz, url: 'https://solworldz.xyz/', require_image: 'true' }
          - { name: EthWorldz, url: 'https://ethworldz.xyz/', require_image: 'true' }
          - { name: BaseWorldz, url: 'https://baseworldz.xyz/', require_image: 'true' }
          - { name: BNBWorldz, url: 'https://bnbworldz.xyz/', require_image: 'true' }
          - { name: XRPWorldz, url: 'https://xrpworldz.xyz/', require_image: 'true' }
          - { name: SuiWorldz, url: 'https://suiworldz.xyz/', require_image: 'true' }
          - { name: HyperWorldz, url: 'https://hyperworldz.xyz/', require_image: 'true' }
          - { name: RobinWorldz, url: 'https://robinworldz.xyz/', require_image: 'true' }
          - { name: HodlerWorldz, url: 'https://hodlerworldz.xyz/', require_image: 'true' }
          - { name: PurpleDiamondCrew, url: 'https://purplediamondcrew.com/', require_image: 'true' }

    steps:
      - name: Check out production source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm browser availability
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            google-chrome-stable --version
          elif command -v chromium >/dev/null 2>&1; then
            chromium --version
          elif command -v chromium-browser >/dev/null 2>&1; then
            chromium-browser --version
          else
            echo 'No Chrome/Chromium found on GitHub runner' >&2
            exit 1
          fi

      - name: Run direct-launch desktop/mobile browser proof v5
        id: audit
        continue-on-error: true
        env:
          TARGET_NAME: ${{ matrix.target.name }}
          TARGET_URL: ${{ matrix.target.url }}
          REQUIRE_REAL_IMAGE: ${{ matrix.target.require_image }}
        run: node tools/worldz-browser-audit-fast-v5.mjs

      - name: Upload this target screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: worldz-browser-${{ matrix.target.name }}-${{ github.run_id }}
          path: browser-audit/
          if-no-files-found: error
          retention-days: 14

      - name: Print proof result
        if: always()
        shell: bash
        run: |
          test -f browser-audit/report.json
          node -e "const r=require('./browser-audit/report.json'); for (const x of r.results) console.log((x.ok?'PASS ':'FAIL ')+r.target+' '+x.viewport+(x.reasons.length?' :: '+x.reasons.join('; '):'')); if(!r.passed) process.exit(1)"

      - name: Enforce audit outcome
        if: always()
        shell: bash
        run: |
          test '${{ steps.audit.outcome }}' = 'success'
