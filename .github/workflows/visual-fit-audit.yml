name: Final Visual Fit Audit

on:
  push:
    branches: [fix/visual-fit-final-audit, build/one-screen-18]
    paths:
      - ".github/workflows/visual-fit-audit.yml"
      - ".github/full-current-candidate-proof.sh"
      - "apps/oneworldz-ecosystem-release/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/visual-fit-audit.yml"
      - ".github/full-current-candidate-proof.sh"
      - "apps/oneworldz-ecosystem-release/**"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MIN_PAGE_ROUTES: "93"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Build final ecosystem exactly as production builds it
        run: |
          set -euo pipefail
          npm ci
          npm run build:ecosystem-release

      - name: Verify one-screen route architecture
        run: |
          set -euo pipefail
          node --test apps/oneworldz-ecosystem-release/test/one-screen-architecture.test.mjs

      - name: Install browser proof runtime
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium

      - name: Verify all 34 live Community Facebook destinations
        run: |
          set -euo pipefail
          node apps/oneworldz-ecosystem-release/audit-live-facebook.mjs
          cat audit-results/live-facebook-summary.txt
          grep -Fxq 'COMMUNITY_FACEBOOK_EXPECTED=34' audit-results/live-facebook-summary.txt
          grep -Fxq 'COMMUNITY_FACEBOOK_PASSED=34' audit-results/live-facebook-summary.txt
          grep -Fxq 'COMMUNITY_FACEBOOK_FAILED=0' audit-results/live-facebook-summary.txt
          grep -Fxq 'DAVIS_SEPARATE=PASS' audit-results/live-facebook-summary.txt
          grep -Fxq 'REAGAN_SEPARATE=PASS' audit-results/live-facebook-summary.txt
          grep -Fxq 'COMMUNITY_FACEBOOK_GATE=PASS' audit-results/live-facebook-summary.txt

      - name: Audit every live click, menu, outlet, legacy token, DEX route and GPT
        run: |
          set -euo pipefail
          node apps/oneworldz-ecosystem-release/audit-live-every-click.mjs
          cat audit-results/live-every-click-summary.txt
          grep -Fxq 'LIVE_PAGES_EXPECTED=93' audit-results/live-every-click-summary.txt
          grep -Fxq 'LIVE_PAGES_AUDITED=93' audit-results/live-every-click-summary.txt
          grep -Fxq 'HOME_LINKS_AUDITED=93' audit-results/live-every-click-summary.txt
          grep -Fxq 'MENU_BUTTONS_AUDITED=93' audit-results/live-every-click-summary.txt
          grep -Fxq 'COMMUNITY_FACEBOOK_PASSED=34' audit-results/live-every-click-summary.txt
          grep -Fxq 'PDC_LEGACY_TOKENS_AUDITED=10' audit-results/live-every-click-summary.txt
          grep -Fxq 'PDC_DEX_LINKS_PRESENT=10' audit-results/live-every-click-summary.txt
          grep -Fxq 'ONEWORLDZ_GPT_LIVE=PASS' audit-results/live-every-click-summary.txt
          grep -Fxq 'INTERACTION_FAILURES=0' audit-results/live-every-click-summary.txt
          grep -Fxq 'EVERY_CLICK_GATE=PASS' audit-results/live-every-click-summary.txt

      - name: Prove every route fits one viewport without clipping or normal scrolling
        run: |
          set -euo pipefail
          node apps/oneworldz-ecosystem-release/audit-one-screen-layout.mjs \
            --root apps/oneworldz-ecosystem-release/dist/ecosystem \
            --out audit-results
          cat audit-results/one-screen-layout-summary.txt
          grep -Fxq 'ONE_SCREEN_ROUTES=93' audit-results/one-screen-layout-summary.txt
          grep -Fxq 'VIEWPORT_CHECKS=186' audit-results/one-screen-layout-summary.txt
          grep -Fxq 'ONE_SCREEN_LAYOUT_FAILURES=0' audit-results/one-screen-layout-summary.txt

      - name: Prove all 18 candidate sites and all 93 routes in real browsers
        run: |
          set -euo pipefail
          bash .github/full-current-candidate-proof.sh
          test "$(node -p "require('./deployment-proof/current-candidate-browser-summary.json').generated_page_routes")" = "93"
          test "$(node -p "require('./deployment-proof/current-candidate-browser-summary.json').desktop_pages_audited")" = "93"
          test "$(node -p "require('./deployment-proof/current-candidate-browser-summary.json').mobile_pages_audited")" = "93"

      - name: Audit every final built page and every visible image slot
        run: |
          set -euo pipefail
          node apps/oneworldz-ecosystem-release/audit-image-fit.mjs \
            --root apps/oneworldz-ecosystem-release/dist/ecosystem \
            --out audit-results
          cat audit-results/visual-fit-summary.txt

      - name: Enforce zero visual-fit defects
        run: |
          set -euo pipefail
          grep -Fxq 'FINAL_BUILT_PAGES=93' audit-results/visual-fit-summary.txt
          grep -Fxq 'TARGETS=18' audit-results/visual-fit-summary.txt
          grep -Fxq 'ASPECT_MISMATCHES=0' audit-results/visual-fit-summary.txt
          grep -Fxq 'BROKEN_IMAGES=0' audit-results/visual-fit-summary.txt
          echo 'FINAL_BUILD_GATE=PASS sites=18 pages=93 desktop=93 mobile=93 mismatches=0 broken=0 no_scroll=PASS'

      - name: Preserve audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-visual-fit-audit
          path: |
            audit-results/
            candidate-proof/
            deployment-proof/current-candidate-browser-summary.json
          if-no-files-found: error
