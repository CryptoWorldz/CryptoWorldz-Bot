name: Validate WorldzFullBuild

on:
  pull_request:
    paths:
      - 'src/fullbuild/**'
      - 'src/fullscope/**'
      - 'src/command-centre.js'
      - 'src/command-registry.js'
      - 'src/full-runtime-entry.js'\n      - 'src/websites-telegram.js'\n      - 'test/fullbuild.test.js'\n      - 'test/fullscope.test.js'\n      - 'test/command-centre.test.js'\n      - 'test/command-registry.test.js'\n      - 'test/websites-telegram.test.js'\n      - 'worldzpad-omnichain/fullscope/worldz-fullbuild.v1.json'
      - 'worldzpad-omnichain/fullscope/worldz-fullscope.v1.json'
      - 'launchpad.cryptoworldz.xyz/fullbuild/**'
      - 'launchpad.cryptoworldz.xyz/fullscope/**'
      - 'launchpad.cryptoworldz.xyz/sitemap.xml'
      - 'public/miniapp/index.html'
      - 'public/miniapp/app.js'
      - 'cryptoworldz.xyz/command-centre-max/index.html'\n      - 'cryptoworldz.xyz/worldzlinkz/**'\n      - 'docs/WORLDZFULLBUILD-PROJECT-SOURCE-OF-TRUTH.md'\n      - 'docs/WORLDZFULLBUILD-PROJECT-CONTINUITY-2026-09-27.md'\n      - 'scripts/validate_worldz_fullbuild.py'
      - 'scripts/validate_worldz_fullscope.py'
      - '.github/workflows/validate-worldz-fullbuild.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate WorldzFullBuild
        run: python scripts/validate_worldz_fullbuild.py
      - name: Validate WorldzFullScope
        run: python scripts/validate_worldz_fullscope.py
      - name: Syntax checks
        run: |
          node --check src/fullbuild/core.js
          node --check src/fullbuild/telegram.js
          node --check src/command-centre.js
          node --check src/command-registry.js
          node --check src/full-runtime-entry.js\n          node --check src/websites-telegram.js\n          node --check public/miniapp/app.js
      - name: Focused tests
        run: node --test test/fullbuild.test.js test/fullscope.test.js test/command-centre.test.js test/command-registry.test.js test/websites-telegram.test.js
