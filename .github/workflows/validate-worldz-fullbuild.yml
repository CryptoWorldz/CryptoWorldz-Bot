name: Validate WorldzFullBuild

on:
  pull_request:
    paths:
      - 'src/fullbuild/**'
      - 'src/fullscope/**'
      - 'src/worldz-app/**'
      - 'src/command-centre.js'
      - 'src/command-registry.js'
      - 'src/full-runtime-entry.js'
      - 'src/websites-telegram.js'
      - 'test/fullbuild.test.js'
      - 'test/fullscope.test.js'
      - 'test/worldz-app-stage3.test.js'
      - 'test/worldz-app-stage3b.test.js'
      - 'test/worldz-app-stage4.test.js'
      - 'test/worldz-app-stage5.test.js'
      - 'test/command-centre.test.js'
      - 'test/command-registry.test.js'
      - 'test/websites-telegram.test.js'
      - 'worldzpad-omnichain/fullscope/worldz-fullbuild.v1.json'
      - 'worldzpad-omnichain/fullscope/worldz-fullscope.v1.json'
      - 'worldzpad-omnichain/fullscope/worldz-app.v1.json'
      - 'launchpad.cryptoworldz.xyz/fullbuild/**'
      - 'launchpad.cryptoworldz.xyz/fullscope/**'
      - 'launchpad.cryptoworldz.xyz/worldz-app/**'
      - 'launchpad.cryptoworldz.xyz/sitemap.xml'
      - 'public/miniapp/index.html'
      - 'public/miniapp/app.js'
      - 'cryptoworldz.xyz/command-centre-max/index.html'
      - 'cryptoworldz.xyz/worldzlinkz/**'
      - 'docs/WORLDZFULLBUILD-PROJECT-SOURCE-OF-TRUTH.md'
      - 'docs/WORLDZFULLBUILD-PROJECT-CONTINUITY-2026-09-27.md'
      - 'scripts/validate_worldz_fullbuild.py'
      - 'scripts/validate_worldz_fullscope.py'
      - '.github/workflows/validate-worldz-fullbuild.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate WorldzFullBuild
        run: python scripts/validate_worldz_fullbuild.py
      - name: Validate WorldzFullScope
        run: python scripts/validate_worldz_fullscope.py
      - name: Syntax checks
        run: |
          node --check src/fullbuild/core.js
          node --check src/fullbuild/telegram.js
          node --check src/command-centre.js
          node --check src/command-registry.js
          node --check src/full-runtime-entry.js
          node --check src/websites-telegram.js
          node --check public/miniapp/app.js
          node --check src/worldz-app/session-contract.js
          node --check src/worldz-app/wallet-connection-contract.js
          node --check src/worldz-app/identity-assertion-contract.js
          node --check src/worldz-app/mobile-handoff-contract.js
          node --check src/worldz-app/simulation-contract.js
          node --check src/worldz-app/simulation-adapter-contract.js
          node --check src/worldz-app/simulation-adapters.js
          node --check src/worldz-app/multisig-approval-contract.js
          node --check src/worldz-app/multisig-approval-adapters.js
          node --check launchpad.cryptoworldz.xyz/worldz-app/app.js
          node --check launchpad.cryptoworldz.xyz/worldz-app/wallet-connect.js
          node --check launchpad.cryptoworldz.xyz/worldz-app/mobile-handoff.js
      - name: Focused tests
        run: node --test test/fullbuild.test.js test/fullscope.test.js test/worldz-app-stage3.test.js test/worldz-app-stage3b.test.js test/worldz-app-stage4.test.js test/worldz-app-stage5.test.js test/command-centre.test.js test/command-registry.test.js test/websites-telegram.test.js
