name: Validate WorldzFullBuild

on:
  pull_request:
    paths:
      - 'WORLDZFULLBUILD.md'
      - 'src/fullbuild/**'
      - 'src/fullscope/**'
      - 'src/command-centre.js'
      - 'src/command-registry.js'
      - 'src/full-runtime-entry.js'
      - 'test/fullbuild.test.js'
      - 'test/fullscope.test.js'
      - 'test/command-centre.test.js'
      - 'test/command-registry.test.js'
      - 'worldzpad-omnichain/fullbuild/**'
      - 'worldzpad-omnichain/fullscope/**'
      - 'launchpad.cryptoworldz.xyz/fullbuild/**'
      - 'launchpad.cryptoworldz.xyz/fullscope/**'
      - 'launchpad.cryptoworldz.xyz/sitemap.xml'
      - 'public/miniapp/index.html'
      - 'public/miniapp/app.js'
      - 'cryptoworldz.xyz/command-centre-max/index.html'
      - 'scripts/validate_worldz_fullbuild.py'
      - '.github/workflows/validate-worldz-fullbuild.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate WorldzFullBuild master contract
        run: python scripts/validate_worldz_fullbuild.py
      - name: Syntax checks
        run: |
          node --check src/fullbuild/core.js
          node --check src/fullbuild/telegram.js
          node --check src/fullscope/core.js
          node --check src/fullscope/telegram.js
          node --check src/command-centre.js
          node --check src/command-registry.js
          node --check src/full-runtime-entry.js
          node --check public/miniapp/app.js
      - name: Focused FullBuild tests
        run: node --test test/fullbuild.test.js test/fullscope.test.js test/command-centre.test.js test/command-registry.test.js
