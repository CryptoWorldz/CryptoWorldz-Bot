name: Pause OneWorldz Production After PDC

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pause-oneworldz-after-pdc.yml'

permissions:
  actions: write
  contents: read

jobs:
  pause:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Purple Diamond Crew deployment to finish, then cancel original fleet run
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: '31906945316'
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/jobs?per_page=100"
          for attempt in $(seq 1 90); do
            json="$(curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api")"
            status="$(jq -r '.jobs[] | select(.name == "Backup → deploy → prove purplediamondcrew.com") | .status' <<<"$json" | head -n1)"
            echo "Purple Diamond Crew job status: ${status:-unknown}"
            if [ "$status" = 'completed' ]; then
              break
            fi
            sleep 10
          done
          curl --fail --silent --show-error -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/cancel"
          echo "Cancellation requested for OneWorldz fleet run ${TARGET_RUN_ID}."
