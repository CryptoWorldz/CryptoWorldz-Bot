name: Deploy SolWorldz Standalone

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deployments/solworldz-standalone.request'

permissions:
  contents: read

concurrency:
  group: solworldz-standalone-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Back up, deploy and prove SolWorldz.xyz
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment:
      name: solworldz-production
      url: https://solworldz.xyz
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || '/' }}
      FTP_ACCOUNT_SCOPE: ${{ vars.FTP_ACCOUNT_SCOPE }}
      DEPLOY_GUARD: ${{ vars.DEPLOY_GUARD }}
      LIVE_URL: https://solworldz.xyz
    steps:
      - name: Check out approved main commit
        uses: actions/checkout@v4

      - name: Restore and fingerprint exact approved SolWorldz media
        shell: bash
        run: |
          set -euo pipefail
          bash tools/restore-approved-worldz-media.sh "$RUNNER_TEMP/approved-worldz"
          mkdir -p apps/worldz-sites/solworldz/assets/media
          cp "$RUNNER_TEMP/approved-worldz/solworldz/"*.png apps/worldz-sites/solworldz/assets/media/
          for image in solworldz-hero-desktop.png solworldz-hero-mobile.png solworldz-approved-atlas.png; do
            src="$RUNNER_TEMP/approved-worldz/solworldz/$image"
            dst="apps/worldz-sites/solworldz/assets/media/$image"
            test -s "$src" && test -s "$dst"
            test "$(sha256sum "$src" | awk '{print $1}')" = "$(sha256sum "$dst" | awk '{print $1}')"
          done

      - name: Run static production gate
        run: node tools/verify-solworldz-standalone.mjs

      - name: Lock deployment to SolWorldz only
        shell: bash
        run: |
          set -euo pipefail
          host="${FTP_HOST#ftp://}"; host="${host#ftps://}"; host="${host%%/*}"; host="${host%%:*}"
          [[ "$host" == '145.223.108.40' ]] || { echo '::error::Wrong FTP host'; exit 1; }
          [[ "$FTP_PORT" == '21' && "$FTP_SERVER_DIR" == '/' ]] || { echo '::error::Wrong FTP target'; exit 1; }
          [[ "$FTP_ACCOUNT_SCOPE" == 'DOMAIN_ONLY' && "$DEPLOY_GUARD" == 'SOLWORLDZ.XYZ' ]] || { echo '::error::Wrong deploy guard'; exit 1; }
          [[ -n "$FTP_USERNAME" && -n "$FTP_PASSWORD" ]] || { echo '::error::FTP credentials missing'; exit 1; }
          echo "::add-mask::$FTP_USERNAME"; echo "::add-mask::$FTP_HOST"

      - name: Install secure FTP client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp zip

      - name: Confirm encrypted Hostinger target with certificate validation
        shell: bash
        run: |
          set -euo pipefail
          timeout 45 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" -e "set cmd:fail-exit yes; set net:max-retries 1; set net:timeout 15; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; cd '$FTP_SERVER_DIR'; bye"

      - name: Capture mandatory rollback snapshot
        shell: bash
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/solworldz-backup"; mkdir -p "$backup"
          timeout 120 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 1
          set net:timeout 25
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          cd "$FTP_SERVER_DIR"
          lcd "$backup"
          mirror --parallel=3 . .
          bye
          LFTP
          test -n "$(find "$backup" -mindepth 1 -print -quit)"
          cd "$backup"; zip -qr "$RUNNER_TEMP/solworldz-predeploy.zip" .
          test -s "$RUNNER_TEMP/solworldz-predeploy.zip"

      - name: Preserve rollback package
        uses: actions/upload-artifact@v4
        with:
          name: solworldz-predeploy-${{ github.run_id }}
          path: ${{ runner.temp }}/solworldz-predeploy.zip
          retention-days: 14
          if-no-files-found: error

      - name: Upload approved SolWorldz bundle
        shell: bash
        run: |
          set -euo pipefail
          echo 'SOL_UPLOAD_STARTED=true' >> "$GITHUB_ENV"
          source="$GITHUB_WORKSPACE/apps/worldz-sites/solworldz"
          timeout 180 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 1
          set net:timeout 30
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          cd "$FTP_SERVER_DIR"
          lcd "$source"
          mirror --reverse --delete --parallel=3 . .
          bye
          LFTP

      - name: Prove live SolWorldz exact imagery and content
        shell: bash
        run: |
          set -euo pipefail
          cache="release=${GITHUB_SHA}-${GITHUB_RUN_ID}"
          curl -L -fsS -H 'Cache-Control: no-cache' --max-time 30 "$LIVE_URL/?$cache" -o "$RUNNER_TEMP/live.html"
          grep -Fq 'data-approved-art="solworldz-hero"' "$RUNNER_TEMP/live.html"
          grep -Fq 'solworldz-hero-desktop.png' "$RUNNER_TEMP/live.html"
          grep -Fq 'solworldz-hero-mobile.png' "$RUNNER_TEMP/live.html"
          ! grep -Eqi 'Loading the Worldz experience|default page|parked domain|solworld\.fun' "$RUNNER_TEMP/live.html"
          for image in solworldz-hero-desktop.png solworldz-hero-mobile.png solworldz-approved-atlas.png; do
            live="$RUNNER_TEMP/live-$image"; source="$RUNNER_TEMP/approved-worldz/solworldz/$image"
            curl -L -fsS -H 'Cache-Control: no-cache' --max-time 30 "$LIVE_URL/assets/media/$image?$cache" -o "$live"
            test "$(sha256sum "$source" | awk '{print $1}')" = "$(sha256sum "$live" | awk '{print $1}')" || { echo "::error::LIVE IMAGE HASH MISMATCH: $image"; exit 1; }
          done
          echo 'SOLWORLDZ PRODUCTION PROOF PASSED: live HTML and exact approved image hashes verified.'

      - name: Restore previous site if deployment fails
        if: failure() && env.SOL_UPLOAD_STARTED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/solworldz-backup"
          test -n "$(find "$backup" -mindepth 1 -print -quit)"
          timeout 180 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 1
          set net:timeout 30
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          cd "$FTP_SERVER_DIR"
          lcd "$backup"
          mirror --reverse --delete --parallel=3 . .
          bye
          LFTP

      - name: Publish factual summary
        if: always()
        run: |
          {
            echo '## SolWorldz Production Proof'
            echo '- Job conclusion is authoritative; this summary does not override failures.'
            echo '- Exact desktop/mobile/atlas SHA-256 equality: required'
            echo '- SolWorld.fun references: forbidden'
            echo '- Rollback snapshot: mandatory before upload'
          } >> "$GITHUB_STEP_SUMMARY"
