name: Deploy SolWorldz Standalone

on:
  push:
    branches: [main]
    paths:
      - 'apps/worldz-sites/solworldz/**'
      - 'media/approved-worldz/**'
      - 'tools/restore-approved-worldz-media.sh'
      - 'tools/verify-solworldz-standalone.mjs'
      - '.github/workflows/deploy-solworldz-standalone.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solworldz-standalone-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy approved SolWorldz
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: solworldz-production
      url: https://solworldz.xyz
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || '/' }}
      FTP_ACCOUNT_SCOPE: ${{ vars.FTP_ACCOUNT_SCOPE }}
      DEPLOY_GUARD: ${{ vars.DEPLOY_GUARD }}
      LIVE_URL: https://solworldz.xyz
    steps:
      - name: Check out approved main commit
        uses: actions/checkout@v4

      - name: Restore exact approved SolWorldz media
        shell: bash
        run: |
          set -euo pipefail
          bash tools/restore-approved-worldz-media.sh "$RUNNER_TEMP/approved-worldz"
          mkdir -p apps/worldz-sites/solworldz/assets/media
          cp "$RUNNER_TEMP/approved-worldz/solworldz/"*.png apps/worldz-sites/solworldz/assets/media/
          for image in solworldz-hero-desktop.png solworldz-hero-mobile.png solworldz-approved-atlas.png; do
            test "$(wc -c < "apps/worldz-sites/solworldz/assets/media/$image")" -gt 50000
          done

      - name: Run approved-image production gate
        run: node tools/verify-solworldz-standalone.mjs

      - name: Lock deployment to SolWorldz only
        shell: bash
        run: |
          set -euo pipefail
          host="${FTP_HOST#ftp://}"; host="${host#ftps://}"; host="${host%%/*}"; host="${host%%:*}"
          [[ "$host" == '145.223.108.40' ]] || { echo '::error::Wrong FTP host'; exit 1; }
          [[ "$FTP_PORT" == '21' && "$FTP_SERVER_DIR" == '/' ]] || { echo '::error::Wrong FTP target'; exit 1; }
          [[ "$FTP_ACCOUNT_SCOPE" == 'DOMAIN_ONLY' && "$DEPLOY_GUARD" == 'SOLWORLDZ.XYZ' ]] || { echo '::error::Wrong deploy guard'; exit 1; }
          [[ -n "$FTP_USERNAME" && -n "$FTP_PASSWORD" ]] || { echo '::error::FTP credentials missing'; exit 1; }
          echo "::add-mask::$FTP_USERNAME"; echo "::add-mask::$FTP_HOST"

      - name: Install secure FTP client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp zip

      - name: Capture rollback snapshot
        shell: bash
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/solworldz-backup"; mkdir -p "$backup"
          timeout 90 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" <<LFTP || true
          set cmd:fail-exit no
          set net:max-retries 1
          set net:timeout 20
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          cd "$FTP_SERVER_DIR"
          lcd "$backup"
          mirror --parallel=3 . .
          bye
          LFTP
          cd "$backup"; zip -qr "$RUNNER_TEMP/solworldz-predeploy.zip" .

      - name: Preserve rollback package
        uses: actions/upload-artifact@v4
        with:
          name: solworldz-predeploy-${{ github.run_id }}
          path: ${{ runner.temp }}/solworldz-predeploy.zip
          retention-days: 14
          if-no-files-found: error

      - name: Upload approved SolWorldz bundle
        shell: bash
        run: |
          set -euo pipefail
          echo 'SOL_UPLOAD_STARTED=true' >> "$GITHUB_ENV"
          source="$GITHUB_WORKSPACE/apps/worldz-sites/solworldz"
          timeout 150 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 1
          set net:timeout 25
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          cd "$FTP_SERVER_DIR"
          lcd "$source"
          mirror --reverse --delete --parallel=3 . .
          bye
          LFTP

      - name: Verify live approved SolWorldz imagery
        shell: bash
        run: |
          set -euo pipefail
          cache="release=${GITHUB_SHA}-${GITHUB_RUN_ID}"
          curl -L -fsS -H 'Cache-Control: no-cache' "$LIVE_URL/?$cache" -o "$RUNNER_TEMP/live.html"
          grep -Fq 'data-approved-art="solworldz-hero"' "$RUNNER_TEMP/live.html"
          grep -Fq 'solworldz-hero-desktop.png' "$RUNNER_TEMP/live.html"
          grep -Fq 'solworldz-hero-mobile.png' "$RUNNER_TEMP/live.html"
          grep -Fq 'RecoverYourDebt belongs to Robin Hood Chain / RobinWorldz' "$RUNNER_TEMP/live.html"
          for image in solworldz-hero-desktop.png solworldz-hero-mobile.png solworldz-approved-atlas.png; do
            curl -L -fsS -H 'Cache-Control: no-cache' "$LIVE_URL/assets/media/$image?$cache" -o "$RUNNER_TEMP/$image"
            test "$(wc -c < "$RUNNER_TEMP/$image")" -gt 50000
          done
          echo 'SolWorldz live approved-image verification passed.'

      - name: Restore previous site if deployment fails
        if: failure() && env.SOL_UPLOAD_STARTED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/solworldz-backup"
          [[ -d "$backup" ]] || exit 0
          timeout 150 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 1
          set net:timeout 25
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          cd "$FTP_SERVER_DIR"
          lcd "$backup"
          mirror --reverse --delete --parallel=3 . .
          bye
          LFTP

      - name: Publish summary
        if: always()
        run: |
          {
            echo '## SolWorldz Approved Production'
            echo '- Approved desktop PNG hero: required + byte-verified'
            echo '- Approved mobile PNG hero: required + byte-verified'
            echo '- Approved PNG ecosystem atlas: required + byte-verified'
            echo '- RecoverYourDebt: Robin Hood Chain / RobinWorldz'
            echo '- DEX / Trade Station: CryptoWorldz registry links'
            echo '- Rollback snapshot: required before upload'
          } >> "$GITHUB_STEP_SUMMARY"
