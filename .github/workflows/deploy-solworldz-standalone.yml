name: Deploy SolWorldz Standalone

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['deployments/solworldz-standalone.request']

permissions:
  contents: read

concurrency:
  group: solworldz-standalone-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Back up, deploy and prove SolWorldz.xyz
    runs-on: ubuntu-latest
    timeout-minutes: 28
    environment:
      name: solworldz-production
      url: https://solworldz.xyz
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || '/' }}
      FTP_ACCOUNT_SCOPE: ${{ vars.FTP_ACCOUNT_SCOPE }}
      DEPLOY_GUARD: ${{ vars.DEPLOY_GUARD }}
      LIVE_URL: https://solworldz.xyz
      HOSTINGER_LOCKED_IP: '145.223.108.40'
      HOSTINGER_TLS_ALIAS: 'solworldz-ftp-pinned.hstgr.io'
      HOSTINGER_CERT_SHA256: '47:E1:B5:DC:5D:61:02:E8:ED:8C:01:21:61:AF:8B:22:53:70:AB:55:63:B0:0C:AF:14:6C:BD:7A:96:51:E9:5E'
      WORLDZ_MEDIA_RMSE_MAX: '0.05'
    steps:
      - uses: actions/checkout@v4
        name: Check out approved main commit

      - name: Restore exact approved SolWorldz media
        shell: bash
        run: |
          set -euo pipefail
          bash tools/restore-approved-worldz-media.sh "$RUNNER_TEMP/approved-worldz"
          mkdir -p apps/worldz-sites/solworldz/assets/media
          cp "$RUNNER_TEMP/approved-worldz/solworldz/"*.png apps/worldz-sites/solworldz/assets/media/
          for image in solworldz-hero-desktop.png solworldz-hero-mobile.png solworldz-approved-atlas.png; do
            src="$RUNNER_TEMP/approved-worldz/solworldz/$image"; dst="apps/worldz-sites/solworldz/assets/media/$image"
            test -s "$src" && test -s "$dst"
            test "$(sha256sum "$src"|awk '{print $1}')" = "$(sha256sum "$dst"|awk '{print $1}')"
          done

      - name: Run static production gate
        run: node tools/verify-solworldz-standalone.mjs

      - name: Lock deployment to SolWorldz only
        shell: bash
        run: |
          set -euo pipefail
          host="${FTP_HOST#ftp://}"; host="${host#ftps://}"; host="${host%%/*}"; host="${host%%:*}"
          [[ "$host" == "$HOSTINGER_LOCKED_IP" ]]
          [[ "$FTP_PORT" == '21' && "$FTP_SERVER_DIR" == '/' ]]
          [[ "$FTP_ACCOUNT_SCOPE" == 'DOMAIN_ONLY' && "$DEPLOY_GUARD" == 'SOLWORLDZ.XYZ' ]]
          [[ -n "$FTP_USERNAME" && -n "$FTP_PASSWORD" ]]
          echo "::add-mask::$FTP_USERNAME"; echo "::add-mask::$FTP_PASSWORD"; echo "::add-mask::$FTP_HOST"

      - name: Install secure transfer and visual proof tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp zip imagemagick

      - name: Establish pinned certificate-validated Hostinger FTPS
        shell: bash
        run: |
          set -euo pipefail
          echo "$HOSTINGER_LOCKED_IP $HOSTINGER_TLS_ALIAS" | sudo tee -a /etc/hosts >/dev/null
          test "$(getent ahostsv4 "$HOSTINGER_TLS_ALIAS"|awk 'NR==1{print $1}')" = "$HOSTINGER_LOCKED_IP"
          cert="$RUNNER_TEMP/cert.pem"; session="$RUNNER_TEMP/session.txt"; err="$RUNNER_TEMP/openssl.err"
          timeout 25 openssl s_client -starttls ftp -connect "$HOSTINGER_LOCKED_IP:21" -verify_return_error -showcerts </dev/null >"$session" 2>"$err"
          sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' "$session" | sed -n '1,/-----END CERTIFICATE-----/p' > "$cert"
          test -s "$cert"
          test "$(openssl x509 -in "$cert" -noout -fingerprint -sha256|cut -d= -f2)" = "$HOSTINGER_CERT_SHA256"
          openssl x509 -in "$cert" -noout -ext subjectAltName | grep -Fq 'DNS:*.hstgr.io'
          grep -Fq 'Verify return code: 0 (ok)' "$session"
          ! grep -Eqi 'verify error|certificate verify failed' "$err"
          echo "FTP_CONNECT_HOST=$HOSTINGER_TLS_ALIAS" >> "$GITHUB_ENV"

      - name: Confirm encrypted Hostinger target
        run: timeout 45 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_CONNECT_HOST" -e "set cmd:fail-exit yes; set net:max-retries 1; set net:timeout 15; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname yes; cd '$FTP_SERVER_DIR'; bye"

      - name: Capture mandatory rollback snapshot
        shell: bash
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/solworldz-backup"; mkdir -p "$backup"
          timeout 240 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_CONNECT_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set ssl:check-hostname yes
          cd "$FTP_SERVER_DIR"
          lcd "$backup"
          mirror --parallel=3 . .
          bye
          LFTP
          test -n "$(find "$backup" -mindepth 1 -print -quit)"
          (cd "$backup" && find . -type f -print0|sort -z|xargs -0 sha256sum|sed 's#  \./#  #') > "$RUNNER_TEMP/solworldz-backup.sha256"
          (cd "$backup" && zip -qr "$RUNNER_TEMP/solworldz-predeploy.zip" .)

      - name: Preserve rollback package
        uses: actions/upload-artifact@v4
        with:
          name: solworldz-predeploy-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/solworldz-predeploy.zip
            ${{ runner.temp }}/solworldz-backup.sha256
          retention-days: 14

      - name: Upload approved SolWorldz bundle
        shell: bash
        run: |
          set -euo pipefail
          echo 'SOL_UPLOAD_STARTED=true' >> "$GITHUB_ENV"
          source="$GITHUB_WORKSPACE/apps/worldz-sites/solworldz"
          timeout 240 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_CONNECT_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set ssl:check-hostname yes
          cd "$FTP_SERVER_DIR"
          lcd "$source"
          mirror --reverse --delete --parallel=3 . .
          bye
          LFTP

      - name: Prove exact origin media and CDN visual equivalence
        run: bash tools/prove-worldz-origin-media.sh "$GITHUB_WORKSPACE/apps/worldz-sites/solworldz" 'assets/media/solworldz-hero-desktop.png' 'assets/media/solworldz-hero-mobile.png' 'assets/media/solworldz-approved-atlas.png'

      - name: Prove live SolWorldz content
        shell: bash
        run: |
          set -euo pipefail
          cache="release=${GITHUB_SHA}-${GITHUB_RUN_ID}"
          curl -4 -L -fsS --retry 2 --retry-all-errors -H 'Cache-Control: no-cache' --max-time 40 "$LIVE_URL/?$cache" -o "$RUNNER_TEMP/live.html"
          grep -Fq 'data-approved-art="solworldz-hero"' "$RUNNER_TEMP/live.html"
          grep -Fq 'solworldz-hero-desktop.png' "$RUNNER_TEMP/live.html"
          grep -Fq 'solworldz-hero-mobile.png' "$RUNNER_TEMP/live.html"
          grep -Fq 'https://gofund.me/933219353' "$RUNNER_TEMP/live.html"
          grep -Fq 'https://oneworldz.com/gofundme/' "$RUNNER_TEMP/live.html"
          ! grep -Eqi 'Loading the Worldz experience|default page|parked domain|solworld\.fun' "$RUNNER_TEMP/live.html"

      - name: Prove desktop and mobile SolWorldz rendering
        run: WORLDZ_PROOF_DIR="$RUNNER_TEMP/solworldz-proof" node tools/prove-live-worldz-v2.mjs "$LIVE_URL" 'SOLWORLDZ' 'solworldz-hero-desktop.png'

      - name: Preserve browser proof screenshots
        if: success() && env.SOL_UPLOAD_STARTED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: solworldz-production-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/solworldz-proof/
          retention-days: 30

      - name: Restore previous site if deployment fails
        if: failure() && env.SOL_UPLOAD_STARTED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/solworldz-backup"
          timeout 240 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_CONNECT_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set ssl:check-hostname yes
          cd "$FTP_SERVER_DIR"
          lcd "$backup"
          mirror --reverse --delete --parallel=3 . .
          bye
          LFTP
