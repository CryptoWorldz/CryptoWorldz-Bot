name: Fix Workflow Null Byte Candidate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'FIX WORKFLOW NULL BYTE CANDIDATE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish authenticated fix start
        run: bash .github/publish-progress.sh WORKFLOW_NULL_FIX STARTED

      - name: Build corrected workflow candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/main.yml').read_bytes()
          if b'\x00' not in src:
              raise SystemExit('Expected NUL byte not found')
          fixed = src.replace(b'actions/checkout\x00v4', b'actions/checkout@v4')
          if b'\x00' in fixed:
              raise SystemExit('NUL byte survived correction')
          text = fixed.decode('utf-8')
          for token in [
              '  build:\n',
              '  tests:\n',
              '  lighthouse:\n',
              '    needs: lighthouse\n',
              '    needs: [build, lighthouse, preview]\n',
              'needs.build.outputs.static_tree',
              'actions/checkout@v4'
          ]:
              if token not in text:
                  raise SystemExit('Missing corrected workflow token: '+token)
          if '  verify:\n' in text:
              raise SystemExit('Bundled verify returned')
          Path('workflow-candidate-fixed.txt').write_bytes(fixed)
          PY

      - name: Publish corrected candidate as normal file
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add workflow-candidate-fixed.txt
          git commit -m 'PUBLISH CORRECTED UNBUNDLED WORKFLOW CANDIDATE'
          git push origin HEAD:main
