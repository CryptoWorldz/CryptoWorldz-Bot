name: Validate PNEX Purple Diamond Handz

on:
  pull_request:
    paths:
      - "worldzpad-mainnet/phenix/pnex-purple-diamond-handz.v1.json"
      - "worldzpad-mainnet/phenix/build-pdh-claims.py"
      - "scripts/validate_pnex_pdh.py"
      - ".github/workflows/validate-pnex-pdh.yml"
  push:
    branches: [phenix-launch-prep, revive-v1-build]
    paths:
      - "worldzpad-mainnet/phenix/pnex-purple-diamond-handz.v1.json"
      - "worldzpad-mainnet/phenix/build-pdh-claims.py"
      - "scripts/validate_pnex_pdh.py"
      - ".github/workflows/validate-pnex-pdh.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_pnex_pdh.py
      - run: python worldzpad-mainnet/phenix/build-pdh-claims.py --self-test
