name: OneWorldz 19-Destination Live Approval Audit

on:
  push:
    branches: [main]
    paths:
      - 'deployments/oneworldz-19-live-approval-audit.request'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Run complete 19-destination live approval audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/oneworldz-audit"
          python3 - <<'PY'
          import html
          import json
          import os
          import re
          import ssl
          import urllib.request
          from pathlib import Path

          out = Path(os.environ['RUNNER_TEMP']) / 'oneworldz-audit'
          out.mkdir(parents=True, exist_ok=True)

          static_targets = [
              ('OneWorldz','https://oneworldz.com/','OneWorldz | OneWorldz One Vision', 'OneWorldz'),
              ('CryptoWorldz','https://cryptoworldz.xyz/','CryptoWorldz | One World • One Mission','CryptoWorldz'),
              ('SolWorldz','https://solworldz.xyz/','SolWorldz | One World • One Mission','SolWorldz'),
              ('EthWorldz','https://ethworldz.xyz/','EthWorldz | One World • One Mission','EthWorldz'),
              ('BaseWorldz','https://baseworldz.xyz/','BaseWorldz | One World • One Mission','BaseWorldz'),
              ('BNBWorldz','https://bnbworldz.xyz/','BNBWorldz | One World • One Mission','BNBWorldz'),
              ('XRPWorldz','https://xrpworldz.xyz/','XRPWorldz | One World • One Mission','XRPWorldz'),
              ('SuiWorldz','https://suiworldz.xyz/','SuiWorldz | One World • One Mission','SuiWorldz'),
              ('HyperWorldz','https://hyperworldz.xyz/','HyperWorldz | One World • One Mission','HyperWorldz'),
              ('RobinWorldz','https://robinworldz.xyz/','RobinWorldz | One World • One Mission','RobinWorldz'),
              ('HodlerWorldz','https://hodlerworldz.xyz/','HodlerWorldz | One World • One Mission','HodlerWorldz'),
              ('HodlerGalaxy','https://hodlergalaxy.xyz/','HodlerGalaxy | Explore the OneWorldz Ecosystem','HodlerGalaxy'),
              ('Purple Diamond Crew','https://purplediamondcrew.com/','Purple Diamond Crew | On the Ground','Purple Diamond Crew'),
              ('FoodWorldz','https://foodworldz.com/','FoodWorldz | See the Need • Support the Mission','FoodWorldz'),
              ('DonateWorldz','https://donateworldz.com/','DonateWorldz | Choose a Purpose • Support Clearly','DonateWorldz'),
              ('ImpactBased','https://impactbased.cryptoworldz.xyz/','ImpactBased | Purpose-Driven Launch Board','ImpactBased'),
              ('Law.OneWorldz','https://law.oneworldz.com/','Law.OneWorldz | People-First Public Ideas','Law.OneWorldz'),
              ('Learn.OneWorldz','https://learn.oneworldz.com/','Learn.OneWorldz | Learn • Share • Do','Learn.OneWorldz'),
          ]

          ctx = ssl.create_default_context()
          ua = {'User-Agent': 'OneWorldz-Live-Approval-Audit/2.0'}
          placeholder_re = re.compile(r'default web site page|website coming soon|hostinger default|apache2 ubuntu default page|nginx welcome|index of /', re.I)
          viewport_re = re.compile(r'<meta[^>]+name\s*=\s*["\']viewport["\']', re.I)
          title_re = re.compile(r'<title[^>]*>(.*?)</title>', re.I | re.S)

          def get(url, timeout=45):
              req = urllib.request.Request(url, headers=ua)
              with urllib.request.urlopen(req, timeout=timeout, context=ctx) as resp:
                  raw = resp.read(8_000_000)
                  return str(resp.status), resp.geturl(), raw.decode(resp.headers.get_content_charset() or 'utf-8', errors='replace')

          def get_json(url, timeout=30):
              code, final_url, body = get(url, timeout)
              return code, final_url, json.loads(body)

          results = []
          for name, url, expected_title, brand in static_targets:
              score = 0
              checks = {'https':0,'http':0,'identity':0,'surface':0,'brand':0,'clean':0}
              code = '000'; final_url = ''; title = ''; error = ''; body = ''
              try:
                  code, final_url, body = get(url)
                  if final_url.startswith('https://') and body:
                      checks['https'] = 25; score += 25
                  if code.startswith('2'):
                      checks['http'] = 20; score += 20
              except Exception as exc:
                  error = f'{type(exc).__name__}: {exc}'

              if body:
                  m = title_re.search(body)
                  if m:
                      title = html.unescape(re.sub(r'\s+', ' ', m.group(1)).strip())
                  if title == expected_title:
                      checks['identity'] = 15; score += 15
                  if viewport_re.search(body):
                      checks['surface'] = 10; score += 10
                  if brand.lower() in body.lower() or 'oneworldz' in body.lower():
                      checks['brand'] = 15; score += 15
                  if not placeholder_re.search(body):
                      checks['clean'] = 15; score += 15

              status = 'PASS' if score >= 85 else 'FAIL'
              results.append({'name':name,'url':url,'final_url':final_url,'http_code':code,'title':title,'expected_title':expected_title,'checks':checks,'score':score,'result':status,'error':error,'mode':'static'})
              slug = re.sub(r'[^a-z0-9.-]+','-',name.lower()).strip('-')
              (out / f'{slug}.html').write_text(body, encoding='utf-8')
              print(f'{name} :: HTTP {code} :: {score}/100 :: {status} :: {title or error}')

          # Protected CryptoBotz is a Node application, not a static marketing page.
          # Score it using the live protected service APIs while still proving the HTTPS root is reachable and clean.
          name='CryptoBotz Command Centre'; url='https://cryptobotz.cryptoworldz.xyz/'
          checks = {'https':0,'http':0,'identity':0,'surface':0,'brand':0,'clean':0}
          score=0; code='000'; final_url=''; title='Protected Node application'; error=''; root=''
          hub={}; gpt={}; community={}
          try:
              code, final_url, root = get(url)
              if final_url.startswith('https://') and root:
                  checks['https']=25; score+=25
              if code.startswith('2'):
                  checks['http']=20; score+=20
              _, _, hub = get_json(url+'api/hub-central/status')
              _, _, gpt = get_json(url+'api/oneworldz-gpt/status')
              _, _, community = get_json(url+'api/oneworldz-community-support')
              if hub.get('ok') is True and hub.get('owned_destinations') == 19:
                  checks['identity']=15; score+=15
              if gpt.get('ok') is True and gpt.get('openai_api_configured') is True and gpt.get('payments_in_chat') is False:
                  checks['surface']=10; score+=10
              if hub.get('service') == 'OneWorldz Hub Central' and hub.get('write_mode') == 'approval_controlled':
                  checks['brand']=15; score+=15
              if not placeholder_re.search(root) and community.get('ok') is True and community.get('count') == 35 and len(community.get('profiles') or []) == 35:
                  checks['clean']=15; score+=15
          except Exception as exc:
              error = f'{type(exc).__name__}: {exc}'
          status='PASS' if score >= 85 else 'FAIL'
          results.append({'name':name,'url':url,'final_url':final_url,'http_code':code,'title':title,'expected_title':'Protected service API proof','checks':checks,'score':score,'result':status,'error':error,'mode':'protected','hub':hub,'gpt':gpt,'community_count':community.get('count') if isinstance(community,dict) else None})
          (out/'cryptobotz-command-centre.html').write_text(root, encoding='utf-8')
          (out/'cryptobotz-service-proof.json').write_text(json.dumps({'hub':hub,'gpt':gpt,'community_count':community.get('count') if isinstance(community,dict) else None},indent=2),encoding='utf-8')
          print(f'{name} :: HTTP {code} :: {score}/100 :: {status} :: {error or "protected API proof"}')

          passed = sum(r['result']=='PASS' for r in results)
          lines = [
              '# OneWorldz 19-Destination Live Approval Audit', '',
              '**Standard:** JayJayTeamDev × ChatGPT Approval Rating', '',
              '**Protected-app rule:** CryptoBotz is scored by its live Hub/GPT/community APIs rather than static-page presentation.', '',
              '| Destination | HTTPS | HTTP | Identity | Mobile/API | Brand/Control | Clean | Score | Result |',
              '|---|---:|---:|---:|---:|---:|---:|---:|---|'
          ]
          for r in results:
              c=r['checks']
              lines.append(f"| {r['name']} | {c['https']}/25 | {c['http']}/20 | {c['identity']}/15 | {c['surface']}/10 | {c['brand']}/15 | {c['clean']}/15 | **{r['score']}/100** | **{r['result']}** |")
          lines += ['', '## Fleet result', '', f'- Destinations tested: **{len(results)}**', f'- Approval passes (>=85): **{passed}**', f'- Approval failures: **{len(results)-passed}**', f"- Full-fleet approval: **{'PASS' if passed == len(results) else 'NOT YET'}**"]
          report='\n'.join(lines)+'\n'
          (out/'approval-report.md').write_text(report, encoding='utf-8')
          (out/'results.json').write_text(json.dumps(results, indent=2, ensure_ascii=False), encoding='utf-8')
          print('\n'+report)
          PY

      - name: Upload audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: oneworldz-19-live-approval-${{ github.run_id }}
          path: ${{ runner.temp }}/oneworldz-audit/
          if-no-files-found: error
          retention-days: 14
