name: Grace Stage 3 Live Proof

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/grace-stage3-live-proof.request'

permissions:
  contents: read

jobs:
  prove-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Confirm explicit read-only request
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's/^confirmation=//p' diagnostics/grace-stage3-live-proof.request | tail -n1)" = 'APPROVE READ ONLY GRACE STAGE3 PROOF'

      - name: Verify live Grace Stage 3 health
        shell: bash
        run: |
          set -euo pipefail
          url='https://cryptobotz.cryptoworldz.xyz/grace/health'
          out="$RUNNER_TEMP/grace-health.json"
          code=''
          for attempt in 1 2 3; do
            code="$(curl -4 -L -sS --retry 2 --retry-delay 2 --retry-all-errors --connect-timeout 12 --max-time 40 -A 'Mozilla/5.0 (Grace Stage3 Production Proof)' -H 'Cache-Control: no-cache' -o "$out" -w '%{http_code}' "$url?proof=${GITHUB_RUN_ID}-${attempt}" || true)"
            [[ "$code" == '200' ]] && break
            sleep 3
          done
          test "$code" = '200' || { echo "::error::Grace health returned HTTP $code"; exit 1; }
          node - "$out" <<'NODE'
          const fs = require('fs');
          const p = process.argv[2];
          const x = JSON.parse(fs.readFileSync(p, 'utf8'));
          const required = {
            ok: true,
            service: 'grace-social-engine',
            stage3_power_upgrade: true,
            campaign_centre: true,
            analytics: true,
            ads_budget_controls: true,
            automatic_ad_spend: false
          };
          for (const [key, value] of Object.entries(required)) {
            if (x[key] !== value) throw new Error(`LIVE PROOF FAILED: ${key} expected ${JSON.stringify(value)} got ${JSON.stringify(x[key])}`);
          }
          console.log('GRACE STAGE 3 LIVE PROOF PASSED');
          console.log(JSON.stringify(required, null, 2));
          NODE

      - name: Proof summary
        if: always()
        run: |
          {
            echo '## Grace Stage 3 production proof'
            echo
            echo '- Read-only HTTPS check of cryptobotz production'
            echo '- Requires Stage 3 health fingerprint'
            echo '- Requires automatic_ad_spend=false'
          } >> "$GITHUB_STEP_SUMMARY"
