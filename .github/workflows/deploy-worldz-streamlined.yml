name: Deploy Worldz Streamlined — Exact Files Only

on:
  push:
    branches: [main]
    paths:
      - 'deployments/worldz-streamlined.request'
  workflow_dispatch:
    inputs:
      target:
        description: 'Worldz target'
        required: true
        type: choice
        options:
          - oneworldz
          - impactbased
          - law-oneworldz
          - learn-oneworldz
          - ethworldz
          - baseworldz
          - bnbworldz
          - xrpworldz
          - hyperworldz
          - robinworldz
          - bitcoinworldz
          - hodlerworldz

permissions:
  contents: read

concurrency:
  group: worldz-streamlined-${{ github.event.inputs.target || github.sha }}
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.r.outputs.target }}
      environment: ${{ steps.r.outputs.environment }}
      live_url: ${{ steps.r.outputs.live_url }}
      guard: ${{ steps.r.outputs.guard }}
      expected_text: ${{ steps.r.outputs.expected_text }}
      hero_image: ${{ steps.r.outputs.hero_image }}
      secondary_image: ${{ steps.r.outputs.secondary_image }}
      art_marker: ${{ steps.r.outputs.art_marker }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        shell: bash
        env:
          INPUT_TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == 'workflow_dispatch' ]]; then
            target="$INPUT_TARGET"
          else
            target="$(sed -n 's/^target=//p' deployments/worldz-streamlined.request | tail -n1)"
            test "$(sed -n 's/^approval=//p' deployments/worldz-streamlined.request | tail -n1)" = 'Approved by JayJayTeamDev'
          fi
          case "$target" in
            oneworldz) environment='oneworldz-production'; live_url='https://oneworldz.com'; guard='ONEWORLDZ.COM'; expected_text='OneWorldz'; hero_image='assets/worldz-master/oneworldz/oneworldz-master.png'; secondary_image='assets/worldz-master/oneworldz/oneworldz-gpt.png'; art_marker='oneworldz-master.png' ;;
            impactbased) environment='impactbased-production'; live_url='https://impactbased.oneworldz.com'; guard='IMPACTBASED.ONEWORLDZ.COM'; expected_text='ImpactBased'; hero_image='assets/worldz-master/cryptoworldz/impactbased.png'; secondary_image=''; art_marker='impactbased.png' ;;
            law-oneworldz) environment='law-oneworldz-production'; live_url='https://law.oneworldz.com'; guard='LAW.ONEWORLDZ.COM'; expected_text='Robin Hood'; hero_image='assets/worldz-master/tokens/robin-hood-law.png'; secondary_image=''; art_marker='robin-hood-law.png' ;;
            learn-oneworldz) environment='learn-oneworldz-production'; live_url='https://learn.oneworldz.com'; guard='LEARN.ONEWORLDZ.COM'; expected_text='LearnWorldz'; hero_image='assets/worldz-master/oneworldz/oneworldz-gpt.png'; secondary_image=''; art_marker='oneworldz-gpt.png' ;;
            ethworldz) environment='ethworldz-production'; live_url='https://ethworldz.xyz'; guard='ETHWORLDZ.XYZ'; expected_text='EthWorldz'; hero_image='assets/worldz-master/cryptoworldz/we-need-you.png'; secondary_image='assets/worldz-master/blockchains/ethworldz.png'; art_marker='cryptoworldz-we-need-you' ;;
            baseworldz) environment='baseworldz-production'; live_url='https://baseworldz.xyz'; guard='BASEWORLDZ.XYZ'; expected_text='BaseWorldz'; hero_image='assets/worldz-master/cryptoworldz/we-need-you.png'; secondary_image='assets/worldz-master/blockchains/baseworldz.png'; art_marker='cryptoworldz-we-need-you' ;;
            bnbworldz) environment='bnbworldz-production'; live_url='https://bnbworldz.xyz'; guard='BNBWORLDZ.XYZ'; expected_text='BNBWorldz'; hero_image='assets/worldz-master/cryptoworldz/we-need-you.png'; secondary_image='assets/worldz-master/blockchains/bnbworldz.png'; art_marker='cryptoworldz-we-need-you' ;;
            xrpworldz) environment='xrpworldz-production'; live_url='https://xrpworldz.xyz'; guard='XRPWORLDZ.XYZ'; expected_text='XRPWorldz'; hero_image='assets/worldz-master/cryptoworldz/we-need-you.png'; secondary_image='assets/worldz-master/blockchains/xrpworldz.png'; art_marker='cryptoworldz-we-need-you' ;;
            hyperworldz) environment='hyperworldz-production'; live_url='https://hyperworldz.xyz'; guard='HYPERWORLDZ.XYZ'; expected_text='HyperWorldz'; hero_image='assets/worldz-master/cryptoworldz/we-need-you.png'; secondary_image='assets/worldz-master/blockchains/hyperworldz.png'; art_marker='cryptoworldz-we-need-you' ;;
            robinworldz) environment='robinworldz-production'; live_url='https://robinworldz.xyz'; guard='ROBINWORLDZ.XYZ'; expected_text='RobinWorldz'; hero_image='assets/worldz-master/cryptoworldz/we-need-you.png'; secondary_image='assets/worldz-master/blockchains/robinworldz.png'; art_marker='cryptoworldz-we-need-you' ;;
            bitcoinworldz) environment='bitcoinworldz-production'; live_url='https://bitcoinworldz.xyz'; guard='BITCOINWORLDZ.XYZ'; expected_text='BitcoinWorldz'; hero_image='assets/worldz-master/cryptoworldz/we-need-you.png'; secondary_image='assets/worldz-master/blockchains/bitworldz.png'; art_marker='cryptoworldz-we-need-you' ;;
            hodlerworldz) environment='hodlerworldz-production'; live_url='https://hodlerworldz.xyz'; guard='HODLERWORLDZ.XYZ'; expected_text='HodlerWorldz'; hero_image='assets/worldz-master/cryptoworldz/we-need-you.png'; secondary_image=''; art_marker='cryptoworldz-we-need-you' ;;
            *) echo "::error::Unsupported or protected target: $target"; exit 1 ;;
          esac
          for key in target environment live_url guard expected_text hero_image secondary_image art_marker; do printf '%s=%s\n' "$key" "${!key}" >> "$GITHUB_OUTPUT"; done

  deploy:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ needs.resolve.outputs.environment }}
      url: ${{ needs.resolve.outputs.live_url }}
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || '/public_html' }}
      FTP_ACCOUNT_SCOPE: ${{ vars.FTP_ACCOUNT_SCOPE }}
      DEPLOY_GUARD: ${{ vars.DEPLOY_GUARD }}
      EXPECTED_GUARD: ${{ needs.resolve.outputs.guard }}
      LIVE_URL: ${{ needs.resolve.outputs.live_url }}
      HERO_IMAGE: ${{ needs.resolve.outputs.hero_image }}
      SECONDARY_IMAGE: ${{ needs.resolve.outputs.secondary_image }}
      EXPECTED_TEXT: ${{ needs.resolve.outputs.expected_text }}
      ART_MARKER: ${{ needs.resolve.outputs.art_marker }}
      FTP_TLS_VERIFY: yes
      FTP_TLS_CHECK_HOSTNAME: yes
      HOSTINGER_LOCKED_IP: '145.223.108.40'
      HOSTINGER_TLS_ALIAS: 'worldz-streamlined-ftp.hstgr.io'
      WORLDZ_MEDIA_RMSE_MAX: '0.05'
    steps:
      - uses: actions/checkout@v4

      - name: Restore approved images and verify package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf apps/cryptoworldz-web-core/assets/worldz-master
          bash tools/restore-approved-worldz-media.sh apps/cryptoworldz-web-core/assets/worldz-master
          test -s "apps/cryptoworldz-web-core/$HERO_IMAGE"
          if [[ -n "$SECONDARY_IMAGE" ]]; then test -s "apps/cryptoworldz-web-core/$SECONDARY_IMAGE"; fi
          npm ci
          npm run verify
          node tools/build-worldz-media-payloads.mjs apps/cryptoworldz-web-core
          node tools/worldz-upload-manifest.mjs apps/cryptoworldz-web-core "$RUNNER_TEMP/upload.txt"
          test -s "$RUNNER_TEMP/upload.txt"
          if grep -nE '(^/|(^|/)\.\.(/|$)|[[:cntrl:]])' "$RUNNER_TEMP/upload.txt"; then echo '::error::Unsafe upload path'; exit 1; fi

      - name: Lock exact domain target
        shell: bash
        run: |
          set -euo pipefail
          test "$FTP_ACCOUNT_SCOPE" = 'DOMAIN_ONLY'
          test "$DEPLOY_GUARD" = "$EXPECTED_GUARD"
          [[ "$FTP_SERVER_DIR" == '/' || "$FTP_SERVER_DIR" == '/public_html' ]]
          test "$FTP_PORT" = '21'
          test -n "$FTP_HOST" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          echo "::add-mask::$FTP_HOST"; echo "::add-mask::$FTP_USERNAME"; echo "::add-mask::$FTP_PASSWORD"

      - name: Install secure transfer and proof tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp zip imagemagick

      - name: Establish certificate-validated Hostinger connection
        shell: bash
        run: |
          set -euo pipefail
          host="$(printf '%s' "$FTP_HOST" | sed -e 's#^ftp://##' -e 's#^ftps://##' -e 's#/.*$##')"
          if [[ "$host" != *:*:* && "$host" == *:* ]]; then host="${host%%:*}"; fi
          if [[ "$host" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            test "$host" = "$HOSTINGER_LOCKED_IP"
            echo "$HOSTINGER_LOCKED_IP $HOSTINGER_TLS_ALIAS" | sudo tee -a /etc/hosts >/dev/null
            echo "FTP_CONNECT_HOST=$HOSTINGER_TLS_ALIAS" >> "$GITHUB_ENV"
          else
            echo "FTP_CONNECT_HOST=$host" >> "$GITHUB_ENV"
          fi

      - name: Back up only files this release can replace
        shell: bash
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/scoped-backup"; mkdir -p "$backup"
          commands="$RUNNER_TEMP/scoped-backup.lftp"
          {
            echo 'set cmd:fail-exit no'
            echo 'set net:max-retries 1'
            echo 'set net:timeout 20'
            echo 'set ftp:ssl-force yes'
            echo 'set ftp:ssl-protect-data yes'
            echo 'set ssl:verify-certificate yes'
            echo 'set ssl:check-hostname yes'
            printf 'cd "%s"\n' "${FTP_SERVER_DIR//\"/\\\"}"
            while IFS= read -r rel; do
              [[ -n "$rel" ]] || continue
              mkdir -p "$backup/$(dirname "$rel")"
              esc="${rel//\\/\\\\}"; esc="${esc//\"/\\\"}"
              out="$backup/$rel"; out="${out//\\/\\\\}"; out="${out//\"/\\\"}"
              printf 'get "%s" -o "%s"\n' "$esc" "$out"
            done < "$RUNNER_TEMP/upload.txt"
            echo 'bye'
          } > "$commands"
          timeout 120 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_CONNECT_HOST" < "$commands" || true
          (cd "$backup" && find . -type f -printf '%P\n' | sort) > "$RUNNER_TEMP/existing.txt"
          comm -23 "$RUNNER_TEMP/upload.txt" "$RUNNER_TEMP/existing.txt" > "$RUNNER_TEMP/new-files.txt"
          if [[ ! -s "$RUNNER_TEMP/existing.txt" ]]; then touch "$backup/.empty-target"; fi
          (cd "$backup" && zip -qr "$RUNNER_TEMP/scoped-backup.zip" .)
          test -s "$RUNNER_TEMP/scoped-backup.zip"
          echo "Scoped rollback captured $(wc -l < "$RUNNER_TEMP/existing.txt") existing release files; $(wc -l < "$RUNNER_TEMP/new-files.txt") are new."

      - name: Preserve scoped rollback
        uses: actions/upload-artifact@v4
        with:
          name: streamlined-rollback-${{ needs.resolve.outputs.target }}-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/scoped-backup.zip
            ${{ runner.temp }}/upload.txt
            ${{ runner.temp }}/existing.txt
            ${{ runner.temp }}/new-files.txt
          retention-days: 14

      - name: Upload exact approved website
        shell: bash
        run: |
          set -euo pipefail
          echo 'WORLDZ_UPLOAD_STARTED=true' >> "$GITHUB_ENV"
          FTP_TRANSFER_TIMEOUT=360 bash tools/worldz-direct-ftp.sh upload "$GITHUB_WORKSPACE/apps/cryptoworldz-web-core"

      - name: Prove exact image bytes at origin and CDN
        run: bash tools/prove-worldz-origin-media.sh "$GITHUB_WORKSPACE/apps/cryptoworldz-web-core" "$HERO_IMAGE" "$SECONDARY_IMAGE"

      - name: Prove desktop and mobile live rendering
        run: WORLDZ_PROOF_DIR="$RUNNER_TEMP/worldz-proof" node tools/prove-live-worldz.mjs "$LIVE_URL" "$EXPECTED_TEXT" "$ART_MARKER"

      - name: Preserve browser proof
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: streamlined-proof-${{ needs.resolve.outputs.target }}-${{ github.run_id }}
          path: ${{ runner.temp }}/worldz-proof/
          retention-days: 30

      - name: Restore scoped rollback if live proof fails
        if: failure() && env.WORLDZ_UPLOAD_STARTED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/scoped-backup"
          if [[ -s "$RUNNER_TEMP/new-files.txt" ]]; then
            rmcmd="$RUNNER_TEMP/remove-new.lftp"
            {
              echo 'set cmd:fail-exit no'
              echo 'set ftp:ssl-force yes'
              echo 'set ftp:ssl-protect-data yes'
              echo 'set ssl:verify-certificate yes'
              echo 'set ssl:check-hostname yes'
              printf 'cd "%s"\n' "${FTP_SERVER_DIR//\"/\\\"}"
              while IFS= read -r rel; do esc="${rel//\\/\\\\}"; esc="${esc//\"/\\\"}"; printf 'rm "%s"\n' "$esc"; done < "$RUNNER_TEMP/new-files.txt"
              echo 'bye'
            } > "$rmcmd"
            timeout 120 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_CONNECT_HOST" < "$rmcmd" || true
          fi
          if [[ -s "$RUNNER_TEMP/existing.txt" ]]; then
            FTP_TRANSFER_TIMEOUT=240 bash tools/worldz-direct-ftp.sh restore "$backup"
          fi
          echo 'SCOPED_ROLLBACK_COMPLETE'
