name: Deploy OneWorldz Hub Central

on:
  push:
    branches: [main]
    paths:
      - 'deployments/oneworldz-hub-central.request'

permissions:
  contents: read

concurrency:
  group: deploy-oneworldz-hub-central
  cancel-in-progress: false

jobs:
  deploy:
    name: Prove parent → create isolated folder → upload → prove
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      ROOT: /domains/oneworldz.com/public_html
      HUB_DIR: /domains/oneworldz.com/public_html/hub-central
      LIVE_URL: https://oneworldz.com/hub-central/
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v4

      - name: Prove exact authority and source
        shell: bash
        run: |
          set -euo pipefail
          request=deployments/oneworldz-hub-central.request
          test "$(sed -n 's/^target=//p' "$request" | tail -n1)" = 'oneworldz.com/hub-central'
          test "$(sed -n 's/^mode=//p' "$request" | tail -n1)" = 'isolated-additive-deploy'
          test "$(sed -n 's/^authority=//p' "$request" | tail -n1)" = 'JayJayTeamDev FULL ACCESS PERMISSION & AUTHORITY'
          test -s apps/oneworldz-hub-central/index.html
          grep -Fq '<title>OneWorldz Hub Central | Full Support</title>' apps/oneworldz-hub-central/index.html
          grep -Fq 'ONEWORLDZ 🌐 FULL SUPPORT™' apps/oneworldz-hub-central/index.html
          grep -Fq 'HOSTINGER WRITES' apps/oneworldz-hub-central/index.html
          grep -Fq 'dns.google/resolve' apps/oneworldz-hub-central/index.html
          ! grep -Eiq 'sk_live_|sk_test_|service_role|FTP_PASSWORD|HOSTINGER_API_TOKEN|OPENAI_API_KEY' apps/oneworldz-hub-central/index.html

      - name: Install FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Capture exact OneWorldz homepage baseline
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 https://oneworldz.com/ -o "$RUNNER_TEMP/root-before.html"
          test -s "$RUNNER_TEMP/root-before.html"
          sha256sum "$RUNNER_TEMP/root-before.html" | tee "$RUNNER_TEMP/root-before.sha256"

      - name: Prove protected parent and Hub folder is new
        shell: bash
        run: |
          set -euo pipefail
          raw_host="$(printf '%s' "$FTP_HOST" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#^ftp://##' -e 's#^ftps://##' -e 's#/.*$##')"
          if [[ "$raw_host" != *:*:* && "$raw_host" == *:* ]]; then raw_host="${raw_host%%:*}"; fi
          echo "::add-mask::$FTP_HOST"
          echo "::add-mask::$FTP_USERNAME"
          echo "::add-mask::$FTP_PASSWORD"
          printf '%s' "$raw_host" > "$RUNNER_TEMP/raw-host"
          cat > "$RUNNER_TEMP/preflight.lftp" <<EOF
          set cmd:fail-exit true
          set net:max-retries 1
          set net:timeout 20
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          cd $ROOT
          cls -1
          bye
          EOF
          timeout 240 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/preflight.lftp" "$raw_host" > "$RUNNER_TEMP/root-list.txt"
          ! grep -Eq '^hub-central/?$' "$RUNNER_TEMP/root-list.txt"

      - name: Upload only the new Hub Central directory
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          raw_host="$(cat "$RUNNER_TEMP/raw-host")"
          cat > "$RUNNER_TEMP/upload.lftp" <<EOF
          set cmd:fail-exit true
          set net:max-retries 1
          set net:timeout 20
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          mkdir -p $HUB_DIR
          put apps/oneworldz-hub-central/index.html -o $HUB_DIR/index.html
          bye
          EOF
          timeout 240 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/upload.lftp" "$raw_host"
          echo 'written=true' >> "$GITHUB_OUTPUT"

      - name: Prove Hub Central live and OneWorldz homepage byte-identical
        id: proof
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 18); do
            sleep 5
            if curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "${LIVE_URL}?release=${GITHUB_SHA}-${GITHUB_RUN_ID}" -o "$RUNNER_TEMP/hub.html" \
              && grep -Fq '<title>OneWorldz Hub Central | Full Support</title>' "$RUNNER_TEMP/hub.html" \
              && grep -Fq '19-destination register' "$RUNNER_TEMP/hub.html" \
              && curl --fail --silent --show-error --max-time 20 https://oneworldz.com/ -o "$RUNNER_TEMP/root-after.html" \
              && cmp -s "$RUNNER_TEMP/root-before.html" "$RUNNER_TEMP/root-after.html"; then
              success=1
              break
            fi
            echo "Hub Central live proof attempt $attempt/18"
          done
          test "$success" = 1
          echo 'proved=true' >> "$GITHUB_OUTPUT"
          echo 'OneWorldz Hub Central live proof passed; protected homepage is byte-identical.'

      - name: Remove only the new Hub folder if proof fails
        if: ${{ failure() && steps.upload.outputs.written == 'true' && steps.proof.outputs.proved != 'true' }}
        shell: bash
        run: |
          set -u
          raw_host="$(cat "$RUNNER_TEMP/raw-host")"
          cat > "$RUNNER_TEMP/rollback.lftp" <<EOF
          set cmd:fail-exit false
          set net:max-retries 1
          set net:timeout 20
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          rm -r $HUB_DIR
          bye
          EOF
          timeout 240 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/rollback.lftp" "$raw_host" || true
          curl --fail --silent --show-error --max-time 20 https://oneworldz.com/ -o "$RUNNER_TEMP/root-rollback.html" || true
          cmp -s "$RUNNER_TEMP/root-before.html" "$RUNNER_TEMP/root-rollback.html" && echo 'Protected OneWorldz homepage remains exact.' || true

      - name: Preserve deployment proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneworldz-hub-central-proof-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/root-before.sha256
            ${{ runner.temp }}/hub.html
          if-no-files-found: ignore
          retention-days: 14
