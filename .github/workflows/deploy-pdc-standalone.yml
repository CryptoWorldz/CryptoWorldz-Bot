name: Deploy PurpleDiamondCrew Standalone

on:
  push:
    branches: [main]
    paths:
      - 'deployments/pdc-standalone.request'
      - '.github/workflows/deploy-pdc-standalone.yml'
      - 'apps/worldz-sites/purplediamondcrew/**'
      - 'tools/verify-pdc-standalone.mjs'
      - 'tools/restore-approved-worldz-media.sh'
      - 'media/approved-worldz/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: purplediamondcrew-standalone-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Back up, deploy and verify PurpleDiamondCrew.com
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: purplediamondcrew-production
      url: https://purplediamondcrew.com
    env:
      FTP_HOST: 145.223.108.40
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: '21'
      FTP_SERVER_DIR: '/'
      FTP_ACCOUNT_SCOPE: DOMAIN_ONLY
      DEPLOY_GUARD: PURPLEDIAMONDCREW.COM
      LIVE_URL: https://purplediamondcrew.com
    steps:
      - name: Check out approved main commit
        uses: actions/checkout@v4

      - name: Install verification and secure FTP tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp zip webp

      - name: Restore approved PDC master media
        shell: bash
        run: |
          set -euo pipefail
          restored="$RUNNER_TEMP/approved-worldz-media"
          site_media="$GITHUB_WORKSPACE/apps/worldz-sites/purplediamondcrew/assets/media"
          bash tools/restore-approved-worldz-media.sh "$restored"
          mkdir -p "$site_media"
          cp "$restored/pdc/pdc-mission-board.webp" "$site_media/pdc-mission-board.webp"
          cp "$restored/pdc/pdc-hope-chest.webp" "$site_media/pdc-hope-chest.webp"
          cp "$restored/pdc/pdc-crest.webp" "$site_media/pdc-crest.webp"
          for file in "$site_media"/*.webp; do
            test "$(wc -c < "$file" | tr -d ' ')" -gt 10000
            webpinfo "$file" >/dev/null
          done
          echo 'Approved PDC master media restored, hash-verified and WebP-decoded.'

      - name: Run standalone production gate
        run: node tools/verify-pdc-standalone.mjs

      - name: Lock deployment to PurpleDiamondCrew only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FTP_HOST" == '145.223.108.40' ]] || { echo '::error::Locked Hostinger IP changed'; exit 1; }
          [[ -n "$FTP_USERNAME" ]] || { echo '::error::FTP_USERNAME missing'; exit 1; }
          [[ -n "$FTP_PASSWORD" ]] || { echo '::error::FTP_PASSWORD missing'; exit 1; }
          [[ "$FTP_PORT" == '21' && "$FTP_SERVER_DIR" == '/' ]] || { echo '::error::Locked FTP target changed'; exit 1; }
          [[ "$FTP_ACCOUNT_SCOPE" == 'DOMAIN_ONLY' && "$DEPLOY_GUARD" == 'PURPLEDIAMONDCREW.COM' ]] || { echo '::error::PDC guard changed'; exit 1; }
          echo "::add-mask::$FTP_USERNAME"
          echo "::add-mask::$FTP_HOST"

      - name: Confirm encrypted Hostinger target
        shell: bash
        run: |
          set -euo pipefail
          timeout 45 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 1
          set net:timeout 15
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          cd "$FTP_SERVER_DIR"
          bye
          LFTP

      - name: Capture full rollback snapshot
        shell: bash
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/pdc-backup"
          mkdir -p "$backup"
          timeout 90 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 1
          set net:timeout 20
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          cd "$FTP_SERVER_DIR"
          lcd "$backup"
          mirror --parallel=3 . .
          bye
          LFTP
          cd "$backup"
          zip -qr "$RUNNER_TEMP/pdc-predeploy.zip" .

      - name: Preserve rollback package
        uses: actions/upload-artifact@v4
        with:
          name: purplediamondcrew-predeploy-${{ github.run_id }}
          path: ${{ runner.temp }}/pdc-predeploy.zip
          retention-days: 14
          if-no-files-found: error

      - name: Upload standalone PurpleDiamondCrew
        shell: bash
        run: |
          set -euo pipefail
          echo 'PDC_UPLOAD_STARTED=true' >> "$GITHUB_ENV"
          source="$GITHUB_WORKSPACE/apps/worldz-sites/purplediamondcrew"
          timeout 120 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 1
          set net:timeout 20
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          cd "$FTP_SERVER_DIR"
          lcd "$source"
          mirror --reverse --delete --parallel=3 . .
          bye
          LFTP

      - name: Verify live three-page PDC site and master media
        shell: bash
        run: |
          set -euo pipefail
          check_page() {
            local path="$1" marker1="$2" marker2="$3" out="$4"
            local ok=false
            for attempt in 1 2 3 4 5 6; do
              if curl -L -fsS -A 'Mozilla/5.0 (PDC Production Verify)' -H 'Cache-Control: no-cache' --connect-timeout 15 --max-time 30 "$LIVE_URL$path?release=${GITHUB_SHA}-${GITHUB_RUN_ID}-${attempt}" -o "$out"; then
                if grep -Fqi "$marker1" "$out" && grep -Fqi "$marker2" "$out" && ! grep -Fqi 'Loading the Worldz experience' "$out"; then ok=true; break; fi
              fi
              sleep 5
            done
            [[ "$ok" == true ]] || { echo "::error::Live verification failed for $path"; exit 1; }
          }
          check_page '/' 'PURPLE DIAMOND CREW' 'Action Team' "$RUNNER_TEMP/home.html"
          check_page '/crew/' 'Support' 'Contribute' "$RUNNER_TEMP/crew.html"
          check_page '/hope-chest/' 'THE ONEWORLDZ HOPE CHEST' 'Baby Emu' "$RUNNER_TEMP/chest.html"
          curl -L -fsS "$LIVE_URL/assets/pdc.css?release=$GITHUB_SHA" -o "$RUNNER_TEMP/pdc.css"
          curl -L -fsS "$LIVE_URL/assets/pdc.js?release=$GITHUB_SHA" -o "$RUNNER_TEMP/pdc.js"
          grep -Fq 'token-grid' "$RUNNER_TEMP/pdc.css"
          grep -Fq '/assets/media/pdc-hope-chest.webp' "$RUNNER_TEMP/pdc.js"
          grep -Fq '/assets/media/pdc-mission-board.webp' "$RUNNER_TEMP/pdc.js"
          grep -Fq '/assets/media/pdc-crest.webp' "$RUNNER_TEMP/pdc.js"
          i=0
          for media in pdc-mission-board.webp pdc-hope-chest.webp pdc-crest.webp; do
            i=$((i+1))
            out="$RUNNER_TEMP/pdc-master-$i.webp"
            curl -L -fsS -A 'Mozilla/5.0 (PDC Media Verify)' -H 'Cache-Control: no-cache' --connect-timeout 15 --max-time 30 "$LIVE_URL/assets/media/$media?release=${GITHUB_SHA}-${GITHUB_RUN_ID}" -o "$out"
            test "$(wc -c < "$out" | tr -d ' ')" -gt 10000
            webpinfo "$out" >/dev/null
            echo "LIVE_MASTER_OK=$media BYTES=$(wc -c < "$out" | tr -d ' ')"
          done
          echo 'PurpleDiamondCrew live verification passed with all three approved master images.'

      - name: Restore previous site if deployment fails
        if: failure() && env.PDC_UPLOAD_STARTED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/pdc-backup"
          [[ -d "$backup" ]] || { echo 'No rollback snapshot exists; restore skipped.'; exit 0; }
          timeout 120 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 1
          set net:timeout 20
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          cd "$FTP_SERVER_DIR"
          lcd "$backup"
          mirror --reverse --delete --parallel=3 . .
          bye
          LFTP

      - name: Publish deployment summary
        if: always()
        run: |
          {
            echo '## PurpleDiamondCrew Standalone Production'
            echo '- Dedicated domain bundle: yes'
            echo '- Pages: Action Team / Crew / Hope Chest'
            echo '- Hope Chest legacy records: 10'
            echo '- Approved master media: mission board / Hope Chest / crest'
            echo '- Required visual fallbacks: inline SVG'
            echo '- Hostinger target: locked to 145.223.108.40:21'
            echo '- Rollback snapshot: required before upload'
            echo '- Zed: untouched'
            echo '- Auto: untouched'
          } >> "$GITHUB_STEP_SUMMARY"
