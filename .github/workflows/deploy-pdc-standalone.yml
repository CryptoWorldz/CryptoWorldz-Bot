name: Deploy PurpleDiamondCrew Standalone

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['deployments/pdc-standalone.request']

permissions:
  contents: read

concurrency:
  group: purplediamondcrew-standalone-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Back up, deploy and prove PurpleDiamondCrew.com
    runs-on: ubuntu-latest
    timeout-minutes: 32
    environment:
      name: purplediamondcrew-production
      url: https://purplediamondcrew.com
    env:
      FTP_HOST: '145.223.108.40'
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: '21'
      FTP_SERVER_DIR: '/'
      FTP_ACCOUNT_SCOPE: DOMAIN_ONLY
      DEPLOY_GUARD: PURPLEDIAMONDCREW.COM
      LIVE_URL: https://purplediamondcrew.com
      FUNDRAISER_URL: https://gofund.me/c2e4fa936
      COMMUNITY_FUNDRAISER_URL: https://gofund.me/933219353
      JAYJAY_PROFILE_URL: https://www.gofundme.com/u/jayjayteamdev
      IMPACTBASED_URL: https://impactbased.oneworldz.com
      HOSTINGER_LOCKED_IP: '145.223.108.40'
      HOSTINGER_TLS_ALIAS: 'pdc-ftp-pinned.hstgr.io'
      HOSTINGER_CERT_SHA256: '47:E1:B5:DC:5D:61:02:E8:ED:8C:01:21:61:AF:8B:22:53:70:AB:55:63:B0:0C:AF:14:6C:BD:7A:96:51:E9:5E'
    steps:
      - uses: actions/checkout@v4
        name: Check out approved main commit

      - name: Validate explicit PDC request
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          test "$(sed -n 's/^target=//p' deployments/pdc-standalone.request | tail -n1)" = 'purplediamondcrew.com'
          test "$(sed -n 's/^bundle=//p' deployments/pdc-standalone.request | tail -n1)" = 'apps/worldz-sites/purplediamondcrew'
          test "$(sed -n 's/^approval=//p' deployments/pdc-standalone.request | tail -n1)" = 'Approved by JayJayTeamDev'

      - name: Restore and fingerprint exact approved PDC media
        shell: bash
        run: |
          set -euo pipefail
          bash tools/restore-approved-worldz-media.sh "$RUNNER_TEMP/approved-worldz"
          mkdir -p apps/worldz-sites/purplediamondcrew/assets/media
          cp "$RUNNER_TEMP/approved-worldz/pdc/"*.png apps/worldz-sites/purplediamondcrew/assets/media/
          for image in pdc-mission-board.png pdc-hope-chest.png pdc-crest.png; do
            src="$RUNNER_TEMP/approved-worldz/pdc/$image"; dst="apps/worldz-sites/purplediamondcrew/assets/media/$image"
            test -s "$src" && test -s "$dst"
            test "$(sha256sum "$src"|awk '{print $1}')" = "$(sha256sum "$dst"|awk '{print $1}')"
          done

      - name: Install verification and secure transfer tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp zip imagemagick

      - name: Run static production gate
        run: node tools/verify-pdc-standalone.mjs

      - name: Prove exact required links before upload
        shell: bash
        run: |
          set -euo pipefail
          site='apps/worldz-sites/purplediamondcrew'
          grep -RFlq "$FUNDRAISER_URL" "$site"
          grep -RFlq "$COMMUNITY_FUNDRAISER_URL" "$site"
          grep -RFlq "$JAYJAY_PROFILE_URL" "$site"
          grep -RFlq "$IMPACTBASED_URL" "$site"
          ! grep -RFlq 'https://gofund.me/65129e58' "$site"
          echo 'Exact approved external URLs verified in source; third-party DNS availability does not gate the site upload.'

      - name: Lock deployment to PurpleDiamondCrew only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FTP_HOST" == "$HOSTINGER_LOCKED_IP" ]]
          [[ -n "$FTP_USERNAME" && -n "$FTP_PASSWORD" ]]
          [[ "$FTP_PORT" == '21' && "$FTP_SERVER_DIR" == '/' ]]
          [[ "$FTP_ACCOUNT_SCOPE" == 'DOMAIN_ONLY' && "$DEPLOY_GUARD" == 'PURPLEDIAMONDCREW.COM' ]]
          echo "::add-mask::$FTP_USERNAME"; echo "::add-mask::$FTP_PASSWORD"; echo "::add-mask::$FTP_HOST"

      - name: Establish pinned certificate-validated Hostinger FTPS
        shell: bash
        run: |
          set -euo pipefail
          echo "$HOSTINGER_LOCKED_IP $HOSTINGER_TLS_ALIAS" | sudo tee -a /etc/hosts >/dev/null
          test "$(getent ahostsv4 "$HOSTINGER_TLS_ALIAS"|awk 'NR==1{print $1}')" = "$HOSTINGER_LOCKED_IP"
          cert="$RUNNER_TEMP/cert.pem"; session="$RUNNER_TEMP/session.txt"; err="$RUNNER_TEMP/openssl.err"
          timeout 25 openssl s_client -starttls ftp -connect "$HOSTINGER_LOCKED_IP:21" -verify_return_error -showcerts </dev/null >"$session" 2>"$err"
          sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' "$session" | sed -n '1,/-----END CERTIFICATE-----/p' > "$cert"
          test -s "$cert"
          test "$(openssl x509 -in "$cert" -noout -fingerprint -sha256|cut -d= -f2)" = "$HOSTINGER_CERT_SHA256"
          openssl x509 -in "$cert" -noout -ext subjectAltName | grep -Fq 'DNS:*.hstgr.io'
          grep -Fq 'Verify return code: 0 (ok)' "$session"
          ! grep -Eqi 'verify error|certificate verify failed' "$err"
          echo "FTP_CONNECT_HOST=$HOSTINGER_TLS_ALIAS" >> "$GITHUB_ENV"

      - name: Confirm encrypted Hostinger target
        run: timeout 45 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_CONNECT_HOST" -e "set cmd:fail-exit yes; set net:max-retries 1; set net:timeout 15; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname yes; cd '$FTP_SERVER_DIR'; bye"

      - name: Capture full rollback snapshot
        shell: bash
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/pdc-backup"; mkdir -p "$backup"
          timeout 360 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_CONNECT_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set ssl:check-hostname yes
          cd "$FTP_SERVER_DIR"
          lcd "$backup"
          mirror --parallel=3 . .
          bye
          LFTP
          test -n "$(find "$backup" -mindepth 1 -print -quit)"
          (cd "$backup" && find . -type f -print0|sort -z|xargs -0 sha256sum|sed 's#  \./#  #') > "$RUNNER_TEMP/pdc-backup.sha256"
          (cd "$backup" && zip -qr "$RUNNER_TEMP/pdc-predeploy.zip" .)
          test -s "$RUNNER_TEMP/pdc-predeploy.zip"

      - name: Preserve rollback package
        uses: actions/upload-artifact@v4
        with:
          name: purplediamondcrew-predeploy-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/pdc-predeploy.zip
            ${{ runner.temp }}/pdc-backup.sha256
          retention-days: 14

      - name: Upload standalone PurpleDiamondCrew
        shell: bash
        run: |
          set -euo pipefail
          echo 'PDC_UPLOAD_STARTED=true' >> "$GITHUB_ENV"
          source="$GITHUB_WORKSPACE/apps/worldz-sites/purplediamondcrew"
          timeout 360 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_CONNECT_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set ssl:check-hostname yes
          cd "$FTP_SERVER_DIR"
          lcd "$source"
          mirror --reverse --delete --parallel=3 . .
          bye
          LFTP

      - name: Prove exact origin media and CDN visual equivalence
        run: bash tools/prove-worldz-origin-media.sh "$GITHUB_WORKSPACE/apps/worldz-sites/purplediamondcrew" 'assets/media/pdc-mission-board.png' 'assets/media/pdc-hope-chest.png' 'assets/media/pdc-crest.png'

      - name: Prove live pages and exact links
        shell: bash
        run: |
          set -euo pipefail
          cache="release=${GITHUB_SHA}-${GITHUB_RUN_ID}"
          for path in / /mission/ /our-work/ /impact/ /crew/ /donate/ /hope-chest/; do
            out="$RUNNER_TEMP/page-$(echo "$path"|tr '/' '_').html"
            curl -4 -L -fsS --retry 2 --retry-all-errors -A 'Mozilla/5.0 (Worldz Production Proof)' -H 'Cache-Control: no-cache' --max-time 40 "$LIVE_URL$path?$cache" -o "$out"
            grep -Fqi 'PURPLE DIAMOND CREW' "$out"
            ! grep -Eqi 'Loading the Worldz experience|Loading OneWorldz|default page|parked domain' "$out"
          done
          home="$RUNNER_TEMP/page-_.html"; donate="$RUNNER_TEMP/page-_donate_.html"; hope="$RUNNER_TEMP/page-_hope-chest_.html"
          grep -Fq "$FUNDRAISER_URL" "$home"
          grep -Fq "$FUNDRAISER_URL" "$donate"
          grep -Fq "$COMMUNITY_FUNDRAISER_URL" "$donate"
          grep -Fq "$JAYJAY_PROFILE_URL" "$donate"
          grep -Fq "$IMPACTBASED_URL" "$home"
          grep -Fq 'data-approved-art="pdc-hope-chest"' "$hope"

      - name: Prove desktop and mobile PDC rendering
        run: WORLDZ_PROOF_DIR="$RUNNER_TEMP/pdc-proof" node tools/prove-live-worldz-v2.mjs "$LIVE_URL" 'PURPLE DIAMOND CREW' 'pdc-mission-board.png'

      - name: Preserve browser proof screenshots
        if: success() && env.PDC_UPLOAD_STARTED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: purplediamondcrew-production-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/pdc-proof/
          retention-days: 30

      - name: Restore previous site exactly if deployment fails
        if: failure() && env.PDC_UPLOAD_STARTED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/pdc-backup"
          timeout 360 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_CONNECT_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set ssl:check-hostname yes
          cd "$FTP_SERVER_DIR"
          lcd "$backup"
          mirror --reverse --delete --parallel=3 . .
          bye
          LFTP
          verify="$RUNNER_TEMP/pdc-rollback-verify"; mkdir -p "$verify"
          timeout 360 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_CONNECT_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set ssl:check-hostname yes
          cd "$FTP_SERVER_DIR"
          lcd "$verify"
          mirror --parallel=3 . .
          bye
          LFTP
          (cd "$verify" && find . -type f -print0|sort -z|xargs -0 sha256sum|sed 's#  \./#  #') > "$RUNNER_TEMP/pdc-rollback-verify.sha256"
          diff -u "$RUNNER_TEMP/pdc-backup.sha256" "$RUNNER_TEMP/pdc-rollback-verify.sha256"
          echo 'PDC_ROLLBACK_EXACT=PASS'
