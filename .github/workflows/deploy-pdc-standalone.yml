name: Deploy PurpleDiamondCrew Standalone

on:
  push:
    branches: [main]
    paths:
      - 'deployments/pdc-standalone.request'
      - '.github/workflows/deploy-pdc-standalone.yml'
      - 'apps/worldz-sites/purplediamondcrew/**'
      - 'media/approved-worldz/**'
      - 'tools/restore-approved-worldz-media.sh'
      - 'tools/verify-pdc-standalone.mjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: purplediamondcrew-standalone-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Back up, deploy and verify PurpleDiamondCrew.com
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: purplediamondcrew-production
      url: https://purplediamondcrew.com
    env:
      FTP_HOST: 145.223.108.40
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: '21'
      FTP_SERVER_DIR: '/'
      FTP_ACCOUNT_SCOPE: DOMAIN_ONLY
      DEPLOY_GUARD: PURPLEDIAMONDCREW.COM
      LIVE_URL: https://purplediamondcrew.com
    steps:
      - name: Check out approved main commit
        uses: actions/checkout@v4

      - name: Restore exact approved PDC media
        shell: bash
        run: |
          set -euo pipefail
          bash tools/restore-approved-worldz-media.sh "$RUNNER_TEMP/approved-worldz"
          mkdir -p apps/worldz-sites/purplediamondcrew/assets/media
          cp "$RUNNER_TEMP/approved-worldz/pdc/"*.png apps/worldz-sites/purplediamondcrew/assets/media/
          test "$(wc -c < apps/worldz-sites/purplediamondcrew/assets/media/pdc-mission-board.png)" -gt 50000
          test "$(wc -c < apps/worldz-sites/purplediamondcrew/assets/media/pdc-hope-chest.png)" -gt 50000
          test "$(wc -c < apps/worldz-sites/purplediamondcrew/assets/media/pdc-crest.png)" -gt 50000

      - name: Install verification and secure FTP tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp zip

      - name: Run approved-image production gate
        run: node tools/verify-pdc-standalone.mjs

      - name: Lock deployment to PurpleDiamondCrew only
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FTP_HOST" == '145.223.108.40' ]] || { echo '::error::Locked Hostinger IP changed'; exit 1; }
          [[ -n "$FTP_USERNAME" && -n "$FTP_PASSWORD" ]] || { echo '::error::FTP credentials missing'; exit 1; }
          [[ "$FTP_PORT" == '21' && "$FTP_SERVER_DIR" == '/' ]] || { echo '::error::Locked FTP target changed'; exit 1; }
          [[ "$FTP_ACCOUNT_SCOPE" == 'DOMAIN_ONLY' && "$DEPLOY_GUARD" == 'PURPLEDIAMONDCREW.COM' ]] || { echo '::error::PDC guard changed'; exit 1; }
          echo "::add-mask::$FTP_USERNAME"
          echo "::add-mask::$FTP_HOST"

      - name: Confirm encrypted Hostinger target
        shell: bash
        run: |
          set -euo pipefail
          timeout 45 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" -e "set cmd:fail-exit yes; set net:max-retries 1; set net:timeout 15; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate no; cd '$FTP_SERVER_DIR'; bye"

      - name: Capture full rollback snapshot
        shell: bash
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/pdc-backup"; mkdir -p "$backup"
          timeout 90 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 1
          set net:timeout 20
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          cd "$FTP_SERVER_DIR"
          lcd "$backup"
          mirror --parallel=3 . .
          bye
          LFTP
          cd "$backup"; zip -qr "$RUNNER_TEMP/pdc-predeploy.zip" .

      - name: Preserve rollback package
        uses: actions/upload-artifact@v4
        with:
          name: purplediamondcrew-predeploy-${{ github.run_id }}
          path: ${{ runner.temp }}/pdc-predeploy.zip
          retention-days: 14
          if-no-files-found: error

      - name: Upload standalone PurpleDiamondCrew
        shell: bash
        run: |
          set -euo pipefail
          echo 'PDC_UPLOAD_STARTED=true' >> "$GITHUB_ENV"
          source="$GITHUB_WORKSPACE/apps/worldz-sites/purplediamondcrew"
          timeout 150 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 1
          set net:timeout 25
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          cd "$FTP_SERVER_DIR"
          lcd "$source"
          mirror --reverse --delete --parallel=3 . .
          bye
          LFTP

      - name: Verify live approved PDC imagery and pages
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          cache="release=${GITHUB_SHA}-${GITHUB_RUN_ID}"
          for path in / /mission/ /our-work/ /impact/ /crew/ /donate/ /hope-chest/; do
            curl -L -fsS -A 'Mozilla/5.0 (PDC Approved Image Verify)' -H 'Cache-Control: no-cache' --max-time 30 "$LIVE_URL$path?$cache" -o "$RUNNER_TEMP/page.html"
            grep -Fqi 'PURPLE DIAMOND CREW' "$RUNNER_TEMP/page.html"
            ! grep -Fqi 'Loading the Worldz experience' "$RUNNER_TEMP/page.html"
          done
          curl -L -fsS -H 'Cache-Control: no-cache' "$LIVE_URL/assets/media/pdc-mission-board.png?$cache" -o "$RUNNER_TEMP/mission.png"
          curl -L -fsS -H 'Cache-Control: no-cache' "$LIVE_URL/assets/media/pdc-hope-chest.png?$cache" -o "$RUNNER_TEMP/chest.png"
          test "$(wc -c < "$RUNNER_TEMP/mission.png")" -gt 50000
          test "$(wc -c < "$RUNNER_TEMP/chest.png")" -gt 50000
          curl -L -fsS -H 'Cache-Control: no-cache' "$LIVE_URL/?$cache" | grep -Fq 'pdc-mission-board.png'
          curl -L -fsS -H 'Cache-Control: no-cache' "$LIVE_URL/hope-chest/?$cache" | grep -Fq 'data-approved-art="pdc-hope-chest"'
          echo 'verified=true' >> "$GITHUB_OUTPUT"

      - name: Restore previous site if deployment fails
        if: failure() && env.PDC_UPLOAD_STARTED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/pdc-backup"
          [[ -d "$backup" ]] || exit 0
          timeout 150 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 1
          set net:timeout 25
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          cd "$FTP_SERVER_DIR"
          lcd "$backup"
          mirror --reverse --delete --parallel=3 . .
          bye
          LFTP

      - name: Publish deployment summary
        if: always()
        run: |
          {
            echo '## PurpleDiamondCrew Approved Production'
            echo '- Approved mission board PNG: required and byte-verified'
            echo '- Approved Hope Chest PNG: required and byte-verified'
            echo '- Glass Hope Chest action links: required'
            echo '- Pages: Home / Mission / Our Work / Impact / Join / Donate / Hope Chest'
            echo '- Legacy records preserved: 10'
            echo '- Rollback snapshot: required before upload'
            echo '- Zed / Auto services: untouched'
          } >> "$GITHUB_STEP_SUMMARY"
