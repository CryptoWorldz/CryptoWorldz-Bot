name: Worldz Bonk and RevShare research
on:
  push:
    paths:
      - 'tools/worldz-bonk-revshare-discovery.mjs'
      - '.github/workflows/worldz-bonk-revshare-discovery.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/worldz-bonk-revshare-discovery.mjs
      - name: Commit evidence probe
        run: |
          git config user.name "worldz-discovery-bot"
          git config user.email "worldz-discovery-bot@users.noreply.github.com"
          git add launchpad.cryptoworldz.xyz/wallet-snapshots/bonk-revshare-research.latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Bonk and RevShare public evidence probe [cancel-full-deploy]"
            git push
          fi
