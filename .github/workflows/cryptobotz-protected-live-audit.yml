name: CryptoBotz Protected Live Audit
on:
  push:
    branches: [main]
    paths: ['deployments/cryptobotz-protected-live-audit.request']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Verify protected root and Mini App
        shell: bash
        run: |
          set -euo pipefail
          for url in https://cryptobotz.cryptoworldz.xyz/ https://cryptobotz.cryptoworldz.xyz/miniapp/; do
            echo "===== $url ====="
            curl --fail --silent --show-error --location --connect-timeout 15 --max-time 45 -D - "$url" -o /tmp/body.html
            python3 - <<'PY'
          import re,html
          t=open('/tmp/body.html',encoding='utf-8',errors='ignore').read()
          m=re.search(r'<title[^>]*>(.*?)</title>',t,re.I|re.S)
          print('TITLE:',html.unescape(re.sub(r'\s+',' ',m.group(1)).strip()) if m else '')
          print('VIEWPORT:', bool(re.search(r'<meta[^>]+name\s*=\s*["\']viewport["\']',t,re.I)))
          print('CRYPTOWORLDZ:', 'cryptoworldz' in t.lower())
          print('ZED:', 'zed' in t.lower())
          print('BYTES:', len(t.encode()))
          PY
          done
