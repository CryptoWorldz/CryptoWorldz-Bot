name: WorldzApp Android API 36 Foundation

on:
  pull_request:
    paths:
      - 'apps/worldzapp-android/**'
      - 'tools/verify-worldzapp-android-package.js'
      - 'launchpad.cryptoworldz.xyz/worldz-app/manifest.webmanifest'
      - 'worldzpad-omnichain/fullscope/worldz-app.v1.json'
      - '.github/workflows/verify-worldzapp-android-api36.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-android-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify WorldzApp Android release contract
        run: node tools/verify-worldzapp-android-package.js
      - name: Install pinned Bubblewrap tooling
        run: npm install --no-save --ignore-scripts --no-audit --no-fund @bubblewrap/cli@1.25.0
      - name: Verify Bubblewrap API 36 template
        run: |
          npx bubblewrap version
          grep -q 'compileSdkVersion 36' node_modules/@bubblewrap/core/template_project/app/build.gradle
          grep -q 'targetSdkVersion 36' node_modules/@bubblewrap/core/template_project/app/build.gradle
          echo WORLDZAPP_BUBBLEWRAP_API36_TEMPLATE=PASS
