name: WLDZ Mainnet Preparation Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'worldzpad-mainnet/**'
      - '.github/workflows/worldzpad-mainnet-prep.yml'
  push:
    branches: [main]
    paths:
      - 'worldzpad-mainnet/**'
      - '.github/workflows/worldzpad-mainnet-prep.yml'

permissions:
  contents: read

concurrency:
  group: wldz-mainnet-preparation
  cancel-in-progress: false

jobs:
  mainnet-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove canonical WLDZ preparation gate
        run: node worldzpad-mainnet/scripts/preflight.mjs

      - name: Confirm execution remains disabled
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const plan = JSON.parse(fs.readFileSync('worldzpad-mainnet/wldz-one-sided-launch.candidate.json', 'utf8'));
          if (plan.executionEnabled !== false) {
            throw new Error('WLDZ candidate attempted to enable execution before live Squads threshold approval');
          }
          if (plan.launchAuthorized !== true || plan.status !== 'OWNER_AUTHORIZED__AWAITING_LIVE_SQUADS_THRESHOLD') {
            throw new Error('WLDZ owner authorization state is missing or inconsistent');
          }
          console.log('WLDZ_MAINNET_EXECUTION_LOCK=PASS execution_enabled=0 launch_authorized=1 awaiting_squads_threshold=1');
          NODE

      - name: Publish preparation report
        uses: actions/upload-artifact@v4
        with:
          name: wldz-mainnet-preparation-report
          path: worldzpad-mainnet/artifacts/wldz-mainnet-preparation-report.json
          if-no-files-found: error
          retention-days: 30
