name: WLDZ Canonical State Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'worldzpad-mainnet/**'
      - '.github/workflows/worldzpad-mainnet-prep.yml'
  push:
    branches: [main]
    paths:
      - 'worldzpad-mainnet/**'
      - '.github/workflows/worldzpad-mainnet-prep.yml'

permissions:
  contents: read

concurrency:
  group: wldz-mainnet-preparation
  cancel-in-progress: false

jobs:
  mainnet-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove canonical WLDZ preparation gate
        run: node worldzpad-mainnet/scripts/preflight.mjs

      - name: Confirm execution is fail-closed
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const plan = JSON.parse(fs.readFileSync('worldzpad-mainnet/wldz-one-sided-launch.candidate.json', 'utf8'));
          if (plan.executionEnabled !== false) {
            throw new Error('WLDZ execution flag must remain false');
          }
          if (plan.status === 'LIVE_EXECUTED__DO_NOT_REEXECUTE') {
            if (plan.launchCompleted !== true || plan.duplicateExecutionProhibited !== true) {
              throw new Error('Completed WLDZ launch is missing duplicate-execution protection');
            }
            if (plan.livePool !== 'GCFKk1H5Z8EfxFuAvDEXTHn8b28deUA7HxVRsipjfPiJ') {
              throw new Error('Canonical WLDZ live pool drift');
            }
            console.log('WLDZ_LIVE_EXECUTION_GUARD=PASS execution_enabled=0 duplicate_execution=PROHIBITED');
          } else {
            if (plan.launchAuthorized !== true || !String(plan.status).startsWith('OWNER_AUTHORIZED__')) {
              throw new Error('WLDZ owner authorization state is missing or inconsistent');
            }
            console.log('WLDZ_PRELAUNCH_EXECUTION_GUARD=PASS execution_enabled=0');
          }
          NODE

      - name: Publish canonical state report (non-blocking)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: wldz-canonical-state-report
          path: worldzpad-mainnet/artifacts/wldz-mainnet-preparation-report.json
          if-no-files-found: error
          retention-days: 30
