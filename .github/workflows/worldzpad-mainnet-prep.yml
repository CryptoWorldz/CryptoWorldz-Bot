name: WLDZ Canonical Post-Launch Safety Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'worldzpad-mainnet/**'
      - '.github/workflows/worldzpad-mainnet-prep.yml'
  push:
    branches: [main]
    paths:
      - 'worldzpad-mainnet/**'
      - '.github/workflows/worldzpad-mainnet-prep.yml'

permissions:
  contents: read

concurrency:
  group: wldz-mainnet-preparation
  cancel-in-progress: false

jobs:
  mainnet-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Prove canonical WLDZ preparation gate
        run: node worldzpad-mainnet/scripts/preflight.mjs

      - name: Confirm historical candidate remains non-executable
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const plan = JSON.parse(fs.readFileSync('worldzpad-mainnet/wldz-one-sided-launch.candidate.json', 'utf8'));
          if (plan.executionEnabled !== false) {
            throw new Error('Historical WLDZ launch candidate must remain non-executable after canonical launch');
          }
          if (plan.launchAuthorized !== true) {
            throw new Error('Historical WLDZ owner authorization record is missing');
          }
          if (plan.token?.mint !== 'AHYnPvXMsdWxjQQrS9j5P631WWS8xBVYC57jXB6hrJ6U') {
            throw new Error('Canonical WLDZ mint drift');
          }
          if (plan.launch?.baseAmountTokens !== 15000000 || plan.launch?.liquidityCeilingPercent !== 15) {
            throw new Error('Canonical 15M / 15% launch record drift');
          }
          if (plan.launch?.permanentLockAfterCreate !== true) {
            throw new Error('Canonical permanent-lock launch intent drift');
          }
          console.log('WLDZ_POST_LAUNCH_SAFETY=PASS historical_candidate_execution=0 canonical_mint=1 launch_15m=1 permanent_lock_intent=1');
          NODE

      - name: Publish preparation report
        uses: actions/upload-artifact@v4
        with:
          name: wldz-mainnet-preparation-report
          path: worldzpad-mainnet/artifacts/wldz-mainnet-preparation-report.json
          if-no-files-found: error
          retention-days: 30
