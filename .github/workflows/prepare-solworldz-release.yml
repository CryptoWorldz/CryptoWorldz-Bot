name: Prepare SolWorldz Production Candidate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-solworldz-release.yml'
      - 'apps/worldz-sites/solworldz/**'
      - 'apps/cryptoworldz-web-core/assets/images/website-core/solworldz/**'
      - 'apps/cryptoworldz-web-core/assets/images/website-core/blockchain/blockchain-worldz-multichain-directory.webp'
      - 'tools/verify-solworldz-standalone.mjs'
      - 'tools/build-solworldz-release.mjs'
      - 'tools/audit-solworldz-links.mjs'

permissions:
  contents: read

jobs:
  prepare:
    name: Build and prove SolWorldz release package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out approved source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run SolWorldz hard gate
        run: node tools/verify-solworldz-standalone.mjs

      - name: Prove clickable Worldz destinations are live
        run: node tools/audit-solworldz-links.mjs

      - name: Assemble canonical release folder
        run: node tools/build-solworldz-release.mjs

      - name: Prove retired domain is absent from public package
        shell: bash
        run: |
          set -euo pipefail
          if grep -RFiq 'solworld.fun' dist/solworldz; then
            echo '::error::Retired SolWorld.fun reference leaked into the public release package.'
            exit 1
          fi
          echo 'Legacy-domain gate passed.'

      - name: Prove required production files and hashes
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/solworldz/index.html
          test -s dist/solworldz/.htaccess
          test -s dist/solworldz/assets/images/website-core/solworldz/solworldz-desktop-hero.webp
          test -s dist/solworldz/assets/images/website-core/solworldz/solworldz-mobile-hero.webp
          test -s dist/solworldz/assets/images/website-core/blockchain/blockchain-worldz-multichain-directory.webp
          test -s dist/solworldz/release-manifest.json
          sha256sum dist/solworldz/assets/images/website-core/solworldz/solworldz-desktop-hero.webp
          sha256sum dist/solworldz/assets/images/website-core/solworldz/solworldz-mobile-hero.webp
          sha256sum dist/solworldz/assets/images/website-core/blockchain/blockchain-worldz-multichain-directory.webp

      - name: Upload reviewable production candidate
        uses: actions/upload-artifact@v4
        with:
          name: solworldz-production-candidate-${{ github.run_id }}
          path: dist/solworldz
          if-no-files-found: error
          retention-days: 14

      - name: Publish preparation summary
        if: always()
        run: |
          {
            echo '## SolWorldz Production Candidate'
            echo '- Active destination: https://solworldz.xyz'
            echo '- Retired SolWorld.fun reference: BLOCKED by hard gate'
            echo '- Approved desktop/mobile SolWorldz artwork: packaged from canonical repository assets'
            echo '- Clickable Worldz network: static + live-destination gated'
            echo '- No production upload performed by this workflow'
            echo '- Next gate: backup -> guarded deploy -> live desktop/mobile/link proof -> owner acceptance'
          } >> "$GITHUB_STEP_SUMMARY"
