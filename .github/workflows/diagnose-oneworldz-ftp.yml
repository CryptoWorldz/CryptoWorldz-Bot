name: Diagnose OneWorldz FTP

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/oneworldz-ftp.request'
  pull_request:
    paths:
      - '.github/workflows/diagnose-oneworldz-ftp.yml'

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate non-destructive workflow
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'oneworldz-production' .github/workflows/diagnose-oneworldz-ftp.yml
          grep -Fq '145.223.108.40' .github/workflows/diagnose-oneworldz-ftp.yml
          grep -Fq 'FTP_ACCOUNT_SCOPE' .github/workflows/diagnose-oneworldz-ftp.yml
          grep -Fq 'DEPLOY_GUARD' .github/workflows/diagnose-oneworldz-ftp.yml
          ! grep -Eq '^[[:space:]]+(put|mput|mirror[[:space:]]+--reverse|rm[[:space:]]|delete[[:space:]])' .github/workflows/diagnose-oneworldz-ftp.yml

  diagnose:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: oneworldz-production
    env:
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || '/' }}
      FTP_ACCOUNT_SCOPE: ${{ vars.FTP_ACCOUNT_SCOPE }}
      DEPLOY_GUARD: ${{ vars.DEPLOY_GUARD }}
      APPROVED_FTP_HOST: '145.223.108.40'
      FTP_PORT: '21'
    steps:
      - uses: actions/checkout@v4

      - name: Validate approved diagnostic request
        shell: bash
        env:
          APPROVED_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test -f diagnostics/oneworldz-ftp.request
          test "$(sed -n 's/^confirmation=//p' diagnostics/oneworldz-ftp.request | tail -n1)" = 'APPROVE NON-DESTRUCTIVE DIAGNOSTIC'
          test "$(sed -n 's/^source_commit=//p' diagnostics/oneworldz-ftp.request | tail -n1)" = "$APPROVED_BEFORE"
          [[ "$FTP_ACCOUNT_SCOPE" == 'DOMAIN_ONLY' ]]
          [[ "$DEPLOY_GUARD" == 'ONEWORLDZ.COM' ]]
          [[ "$FTP_SERVER_DIR" == '/' ]]
          [[ -n "$FTP_USERNAME" && -n "$FTP_PASSWORD" ]]
          echo "::add-mask::$FTP_USERNAME"

      - name: Install diagnostic clients
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp netcat-openbsd openssl

      - name: Test locked Hostinger control ports
        shell: bash
        run: |
          set +e
          echo '=== Locked Hostinger endpoint ==='
          timeout 12 nc -vz "$APPROVED_FTP_HOST" "$FTP_PORT"
          echo "ftp21_exit=$?"
          timeout 12 nc -vz "$APPROVED_FTP_HOST" 65002
          echo "sftp65002_exit=$?"
          exit 0

      - name: Test explicit TLS handshake on locked Hostinger IP
        shell: bash
        run: |
          set +e
          timeout 20 openssl s_client -starttls ftp -connect "$APPROVED_FTP_HOST:$FTP_PORT" -servername "$APPROVED_FTP_HOST" -brief </dev/null
          echo "tls_exit=$?"
          exit 0

      - name: Test OneWorldz authenticated control channel only
        id: auth
        shell: bash
        run: |
          set +e
          timeout 40 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$APPROVED_FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 1
          set net:timeout 15
          set net:idle 15
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate no
          cd "$FTP_SERVER_DIR"
          pwd
          quote SYST
          bye
          LFTP
          status=$?
          echo "auth_control_exit=$status"
          echo "auth_control_exit=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Diagnostic summary
        shell: bash
        run: |
          {
            echo '## OneWorldz locked-IP FTP diagnostic'
            echo
            echo '- No files were uploaded, modified, renamed, or deleted.'
            echo '- Target was locked to Hostinger IP 145.223.108.40.'
            echo '- OneWorldz domain-only credentials were tested only for encrypted FTP control authentication.'
            echo "- Authentication control exit: ${{ steps.auth.outputs.auth_control_exit }}"
          } >> "$GITHUB_STEP_SUMMARY"
