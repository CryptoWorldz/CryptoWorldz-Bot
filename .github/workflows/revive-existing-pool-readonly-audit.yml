name: REVIVE Existing Pool Read-Only Audit
on:
  workflow_dispatch:
  push:
    branches: [revive-v1-build]
    paths:
      - 'worldzpad-devnet/revive-party/scripts/15_existing_pool_readonly_audit.mjs'
      - '.github/workflows/revive-existing-pool-readonly-audit.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: worldzpad-devnet/revive-party
    env:
      SOLANA_MAINNET_RPC_URL: ${{ secrets.LEGACY_READ_RPC_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Decode existing pool, mints, vaults, fees and positions — READ ONLY
        run: node scripts/15_existing_pool_readonly_audit.mjs
