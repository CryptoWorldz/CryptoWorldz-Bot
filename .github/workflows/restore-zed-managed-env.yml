name: Restore ZED Managed Environment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-zed-managed-env.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  PROTECTED_DOMAIN: cryptobotz.cryptoworldz.xyz
  PROTECTED_NODE_ROOT: /domains/cryptobotz.cryptoworldz.xyz/nodejs

jobs:
  restore-env:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      BOT_TOKEN_SECRET: ${{ secrets.BOT_TOKEN }}
    steps:
      - name: Restore protected ZED environment into Hostinger managed runtime
        shell: python
        run: |
          import io, json, os, re, ssl, time, urllib.parse, urllib.request
          from ftplib import FTP_TLS

          required = ("FTP_HOST","FTP_USERNAME","FTP_PASSWORD","HOSTINGER_API_TOKEN","BOT_TOKEN_SECRET")
          for key in required:
              if not str(os.environ.get(key,"")).strip():
                  raise SystemExit(key+"_MISSING")
              print("::add-mask::"+str(os.environ[key]))

          domain=os.environ["PROTECTED_DOMAIN"]
          host=os.environ["FTP_HOST"].replace("ftps://","").replace("ftp://","").split("/")[0]
          if host.count(":")==1:
              host=host.split(":",1)[0]

          ftp=FTP_TLS(context=ssl._create_unverified_context())
          ftp.connect(host,int(os.environ.get("FTP_PORT","21")),timeout=45)
          ftp.login(os.environ["FTP_USERNAME"],os.environ["FTP_PASSWORD"])
          ftp.prot_p()
          buf=io.BytesIO()
          ftp.retrbinary("RETR "+os.environ["PROTECTED_NODE_ROOT"]+"/.env",buf.write)
          ftp.quit()

          values={}
          for raw in buf.getvalue().decode("utf-8","ignore").splitlines():
              line=raw.strip()
              if not line or line.startswith("#") or "=" not in line:
                  continue
              k,v=line.split("=",1)
              k=re.sub(r"^export\s+","",k).strip()
              v=v.strip()
              if len(v)>=2 and v[0]==v[-1] and v[0] in ("'",'"'):
                  v=v[1:-1]
              if re.fullmatch(r"[A-Z_][A-Z0-9_]*",k) and "\n" not in v and "\r" not in v:
                  values[k]=v

          values["BOT_TOKEN"]=os.environ["BOT_TOKEN_SECRET"].strip()
          values.setdefault("SUPABASE_URL","https://hknymhhyqldtzmplzuzh.supabase.co")
          values.setdefault("SUPABASE_PUBLISHABLE_KEY","sb_publishable_3ognbqSCTAcAnLHOeKZp8A_IgriwUJV")

          if not values["BOT_TOKEN"]:
              raise SystemExit("BOT_TOKEN_EMPTY")
          print("ZED_PROTECTED_ENV_KEYS_RECOVERED="+str(len(values)))
          print("ZED_BOT_TOKEN_SOURCE=GITHUB_PROTECTED_SECRET")

          token=os.environ["HOSTINGER_API_TOKEN"]
          headers={"Authorization":"Bearer "+token,"Accept":"application/json","User-Agent":"ZED-Managed-Env-Restore/1.0"}

          domain_enc=urllib.parse.quote(domain,safe="")
          with urllib.request.urlopen(
              urllib.request.Request(
                  "https://developers.hostinger.com/api/hosting/v1/websites?domain="+domain_enc+"&per_page=25",
                  headers=headers
              ),
              timeout=30
          ) as r:
              websites=json.loads(r.read().decode("utf-8"))
          rows=websites.get("data",[]) if isinstance(websites,dict) else []
          row=next((x for x in rows if str(x.get("domain","")).lower()==domain.lower()),None)
          if not row or not row.get("username"):
              raise SystemExit("HOSTINGER_WEBSITE_USERNAME_NOT_FOUND")
          username=str(row["username"])
          print("::add-mask::"+username)

          base=(
              "https://developers.hostinger.com/api/hosting/v1/accounts/"
              +urllib.parse.quote(username,safe="")
              +"/websites/"+domain_enc+"/nodejs"
          )

          body=json.dumps({
              "env_vars":[{"key":k,"value":v} for k,v in sorted(values.items())]
          }).encode("utf-8")
          req=urllib.request.Request(
              base+"/builds/settings/env",
              data=body,
              headers={**headers,"Content-Type":"application/json"},
              method="PUT"
          )
          with urllib.request.urlopen(req,timeout=45) as r:
              code=r.status
              r.read()
          if code != 200:
              raise SystemExit("HOSTINGER_ENV_REPLACE_HTTP_"+str(code))
          print("HOSTINGER_ZED_MANAGED_ENV_REPLACE=PASS")

          with urllib.request.urlopen(
              urllib.request.Request(base+"/builds/settings/env",headers=headers),
              timeout=30
          ) as r:
              listed=json.loads(r.read().decode("utf-8"))
          if isinstance(listed,dict):
              listed=listed.get("data",listed.get("items",[]))
          keys={str(x.get("key","")) for x in (listed or []) if isinstance(x,dict)}
          if "BOT_TOKEN" not in keys:
              raise SystemExit("HOSTINGER_BOT_TOKEN_KEY_VERIFY_FAILED")
          print("HOSTINGER_ZED_MANAGED_ENV_KEYS=PASS count="+str(len(keys)))
          print("HOSTINGER_ZED_BOT_TOKEN_KEY=PASS")

          def get(path):
              req=urllib.request.Request(
                  "https://"+domain+path,
                  headers={"User-Agent":"ZED-Managed-Env-Restore/1.0","Cache-Control":"no-cache"}
              )
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      return r.status,r.read().decode("utf-8","ignore")
              except Exception as e:
                  if hasattr(e,"code"):
                      try:
                          return int(e.code),e.read().decode("utf-8","ignore")
                      except Exception:
                          return int(e.code),repr(e)
                  return 0,repr(e)

          last=None
          for attempt in range(1,21):
              time.sleep(3 if attempt>1 else 1)
              root_code,root=get("/?env_restore="+str(attempt))
              health_code,health=get("/health?env_restore="+str(attempt))
              last=(root_code,health_code,root[:300],health[:300])
              service_ok='"service":"CryptoWorldz Zed Bot"' in root.replace(" ","")
              health_ok=health_code==200 and '"ok":true' in health.replace(" ","")
              print(
                  f"ZED_MANAGED_ENV_PROBE attempt={attempt} root={root_code} health={health_code} "
                  f"service={int(service_ok)} ready={int(health_ok)}"
              )
              if root_code==200 and service_ok and health_ok:
                  print("ZED_FULL_RUNTIME_AFTER_ENV_RESTORE=PASS")
                  break
          else:
              print("ZED_FULL_RUNTIME_AFTER_ENV_RESTORE=FAIL")
              raise SystemExit("LIVE_ZED_NOT_READY_AFTER_MANAGED_ENV_RESTORE "+repr(last))

          tg="https://api.telegram.org/bot"+values["BOT_TOKEN"]+"/getWebhookInfo"
          with urllib.request.urlopen(
              urllib.request.Request(tg,headers={"User-Agent":"ZED-Managed-Env-Restore/1.0"}),
              timeout=20
          ) as r:
              hook=json.loads(r.read().decode("utf-8"))
          if hook.get("ok") is not True:
              raise SystemExit("TELEGRAM_WEBHOOK_INFO_FAILED")
          info=hook.get("result",{})
          print("ZED_TELEGRAM_WEBHOOK_URL="+str(info.get("url","")))
          print("ZED_TELEGRAM_WEBHOOK_PENDING="+str(info.get("pending_update_count",0)))
          print("ZED_TELEGRAM_WEBHOOK_LAST_ERROR="+("YES" if info.get("last_error_message") else "NO"))
