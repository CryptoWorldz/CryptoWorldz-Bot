name: Temporary Deploy X-SAVE

on:
  push:
    paths:
      - ".github/workflows/deploy-x-save-temporary.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate X-SAVE source
        shell: python
        run: |
          from pathlib import Path
          p=Path('launchpad.cryptoworldz.xyz/x-save/index.html')
          s=Path('launchpad.cryptoworldz.xyz/x-save/style.css')
          text=p.read_text(encoding='utf-8')
          assert p.is_file() and s.is_file()
          assert 'data-worldz-x-save="1"' in text
          assert 'X-SAVE MAINNET — OFF UNTIL PROOF' in text
          assert 'Open X-SAVE' in text
          assert 'Explore WorldzLaunchPad™' in text
          assert 'Build with Worldz' in text
          assert 'Read the GitHub Validation' in text
          print('XSAVE_SOURCE=PASS')
      - name: Deploy X-SAVE only
        shell: python
        run: |
          import os,ssl
          from ftplib import FTP_TLS,error_perm
          from pathlib import Path,PurePosixPath
          local=Path('launchpad.cryptoworldz.xyz/x-save')
          remote='domains/cryptoworldz.xyz/public_html/launchpad/x-save'
          ftp=FTP_TLS(context=ssl._create_unverified_context())
          ftp.connect(os.environ['FTP_HOST'],int(os.environ.get('FTP_PORT','21')),timeout=40)
          ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True)
          ftp.cwd('/')
          for part in PurePosixPath(remote).parts:
              if part in ('','/'):continue
              try:ftp.cwd(part)
              except error_perm:
                  ftp.mkd(part);ftp.cwd(part)
          for name in ('index.html','style.css'):
              with (local/name).open('rb') as f:
                  ftp.storbinary('STOR '+name,f,blocksize=262144)
          try:ftp.quit()
          except Exception:ftp.close()
          print('XSAVE_DEPLOY=PASS files=2')
      - name: Verify live X-SAVE
        shell: python
        run: |
          import time,urllib.request
          url='https://launchpad.cryptoworldz.xyz/x-save/'
          last=''
          for attempt in range(1,6):
              try:
                  req=urllib.request.Request(url+f'?v={int(time.time()*1000)}',headers={'User-Agent':'Worldz-X-SAVE-Verify/1.0','Cache-Control':'no-cache, no-store','Pragma':'no-cache'})
                  with urllib.request.urlopen(req,timeout=25) as r:
                      body=r.read().decode('utf-8','ignore')
                      assert r.status==200
                      assert 'data-worldz-x-save="1"' in body
                      assert 'Worldz X-SAVE' in body
                      assert 'X-SAVE MAINNET — OFF UNTIL PROOF' in body
                      assert 'Open X-SAVE' in body
                      assert 'Explore WorldzLaunchPad™' in body
                      assert 'Build with Worldz' in body
                      assert 'Read the GitHub Validation' in body
                      print('XSAVE_LIVE=PASS')
                      raise SystemExit(0)
              except SystemExit: raise
              except Exception as e:
                  last=repr(e);time.sleep(attempt*2)
          raise SystemExit('XSAVE_LIVE=FAIL '+last)
