name: WorldSpeaker Treasury Proof

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/worldspeaker-treasury-test.yml'
      - '.github/worldspeaker-treasury-test.py'
      - '.github/worldspeaker-treasury-image.b64'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worldspeaker-treasury-proof
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
    steps:
      - uses: actions/checkout@v4

      - name: Run ZED WorldSpeaker Telegram proof
        shell: python
        run: |
          import runpy
          runpy.run_path('.github/worldspeaker-treasury-test.py', run_name='__main__')
