name: ZED Telegram Repair Now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zed-telegram-repair-now.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cryptoworldz-production
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN || secrets.ZED_BOT_TOKEN || secrets.CRYPTOWORLDZ_BOT_TOKEN }}

    steps:
      - name: Restore Telegram webhook and prove delivery
        shell: python
        run: |
          import hashlib, json, os, time, urllib.request

          token=str(os.environ.get("BOT_TOKEN","")).strip()
          if not token:
              raise SystemExit("BOT_TOKEN missing")
          print("::add-mask::"+token)

          api="https://api.telegram.org/bot"+token+"/"
          webhook="https://cryptobotz.cryptoworldz.xyz/telegram-webhook"
          secret=hashlib.sha256(token.encode()).hexdigest()

          def call(method,payload=None):
              data=None
              headers={}
              if payload is not None:
                  data=json.dumps(payload).encode("utf-8")
                  headers["content-type"]="application/json"
              with urllib.request.urlopen(urllib.request.Request(api+method,data=data,headers=headers),timeout=30) as response:
                  result=json.loads(response.read().decode("utf-8"))
              if result.get("ok") is not True:
                  raise SystemExit("Telegram "+method+" failed")
              return result.get("result")

          with urllib.request.urlopen("https://cryptobotz.cryptoworldz.xyz/health",timeout=20) as response:
              health=json.loads(response.read().decode("utf-8"))
          if health.get("ok") is not True:
              raise SystemExit("Full ZED runtime health is not ready")
          print("ZED_FULL_RUNTIME_HEALTH=PASS")

          bot=call("getMe")
          print("ZED_TELEGRAM_BOT_IDENTITY=PASS")

          before=call("getWebhookInfo")
          pending_before=int(before.get("pending_update_count") or 0)
          print("ZED_TELEGRAM_BACKLOG_BEFORE="+str(pending_before))

          call("setWebhook",{
              "url":webhook,
              "secret_token":secret,
              "allowed_updates":["message","callback_query"],
              "drop_pending_updates":False,
              "max_connections":5
          })
          print("ZED_TELEGRAM_WEBHOOK_SET=PASS")

          pending_after=pending_before
          hook=None
          for attempt in range(1,13):
              time.sleep(5)
              hook=call("getWebhookInfo")
              pending_after=int(hook.get("pending_update_count") or 0)
              print("ZED_TELEGRAM_BACKLOG_CHECK="+str(attempt)+" PENDING="+str(pending_after))
              if pending_after == 0 or pending_after < pending_before:
                  break

          if hook is None:
              hook=call("getWebhookInfo")
          if hook.get("url") != webhook:
              raise SystemExit("Webhook URL mismatch")
          if pending_before and pending_after >= pending_before:
              raise SystemExit("Backlog has not begun draining")

          print("ZED_TELEGRAM_BACKLOG_AFTER="+str(pending_after))
          print("ZED_TELEGRAM_LAST_ERROR="+("YES" if hook.get("last_error_message") else "NO"))
          print("ZED_TELEGRAM_BACKLOG_CONTROL=PASS")
          print("ZED_TELEGRAM_INBOUND_ROUTE=READY")
