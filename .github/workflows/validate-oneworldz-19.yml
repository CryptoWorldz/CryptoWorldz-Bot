name: Validate OneWorldz 19-Destination Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/oneworldz-ecosystem-release/**'
      - '.github/workflows/validate-oneworldz-19.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oneworldz-19-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and verify 19-destination architecture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and run ecosystem tests
        working-directory: apps/oneworldz-ecosystem-release
        run: npm run verify
      - name: Assert exact architecture counts
        working-directory: apps/oneworldz-ecosystem-release
        run: |
          node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('dist/ecosystem/fleet-manifest.json', 'utf8'));
          if (manifest.targets.length !== 17) throw new Error(`Expected 17 static packages, got ${manifest.targets.length}`);
          if (manifest.architecture?.ecosystem_destinations !== 19) throw new Error('Expected 19 ecosystem destinations');
          if (manifest.architecture?.active_owned_root_domains !== 15) throw new Error('Expected 15 active owned root domains');
          if (JSON.stringify(manifest.architecture?.excluded_owned_root_domains) !== JSON.stringify(['solworld.fun'])) throw new Error('SolWorld.fun exclusion missing');
          console.log('OneWorldz architecture verified: 15 active owned roots + 4 subdomains = 19 destinations.');
          NODE
