name: ZED Hostinger Origin Diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zed-hostinger-origin-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  origin:
    runs-on: ubuntu-latest
    environment:
      name: cryptoworldz-production
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - name: Read origin network metadata safely
        shell: python
        run: |
          import ipaddress, json, os, re, urllib.parse, urllib.request

          token=str(os.environ.get("HOSTINGER_API_TOKEN","")).strip()
          if not token:
              raise SystemExit("HOSTINGER_API_TOKEN missing")
          print("::add-mask::"+token)
          domain="cryptobotz.cryptoworldz.xyz"
          url="https://developers.hostinger.com/api/hosting/v1/websites?domain="+urllib.parse.quote(domain)+"&per_page=25"
          request=urllib.request.Request(url,headers={"Authorization":"Bearer "+token,"Accept":"application/json","User-Agent":"ZED-Origin-Diagnostic/1.0"})
          with urllib.request.urlopen(request,timeout=30) as response:
              payload=json.loads(response.read().decode("utf-8"))

          rows=payload.get("data",[]) if isinstance(payload,dict) else []
          row=next((x for x in rows if str(x.get("domain","")).lower()==domain),None)
          if not row:
              raise SystemExit("Hostinger website row not found")

          print("HOSTINGER_WEBSITE_KEYS="+",".join(sorted(str(k) for k in row.keys())))

          found=[]
          def walk(obj,path="root"):
              if isinstance(obj,dict):
                  for k,v in obj.items():
                      walk(v,path+"."+str(k))
              elif isinstance(obj,list):
                  for i,v in enumerate(obj):
                      walk(v,path+"["+str(i)+"]")
              elif isinstance(obj,str):
                  for m in re.findall(r"(?<!\d)(?:\d{1,3}\.){3}\d{1,3}(?!\d)",obj):
                      try:
                          ipaddress.ip_address(m)
                          found.append((path,m))
                      except ValueError:
                          pass
          walk(row)
          unique=[]
          for item in found:
              if item not in unique:
                  unique.append(item)
          if not unique:
              print("HOSTINGER_ORIGIN_IPV4=NONE_FOUND")
          else:
              for path,value in unique[:20]:
                  print("HOSTINGER_ORIGIN_IPV4_CANDIDATE path="+path+" value="+value)

          zone_url="https://developers.hostinger.com/api/dns/v1/zones/cryptoworldz.xyz"
          zone_request=urllib.request.Request(
              zone_url,
              headers={"Authorization":"Bearer "+token,"Accept":"application/json","User-Agent":"ZED-Origin-Diagnostic/1.0"}
          )
          with urllib.request.urlopen(zone_request,timeout=30) as response:
              zone=json.loads(response.read().decode("utf-8"))

          records=zone if isinstance(zone,list) else zone.get("data",zone.get("zone",zone.get("records",[])))
          if isinstance(records,dict):
              records=records.get("records",[])
          print("HOSTINGER_DNS_RECORDS_TOTAL="+str(len(records) if isinstance(records,list) else 0))
          if isinstance(records,list):
              for record in records:
                  name=str(record.get("name","")).lower()
                  if "cryptobotz" not in name:
                      continue
                  rtype=str(record.get("type",""))
                  ttl=record.get("ttl")
                  values=record.get("records",record.get("content",record.get("value","")))
                  print("HOSTINGER_CRYPTOBOTZ_DNS name="+name+" type="+rtype+" ttl="+str(ttl)+" values="+json.dumps(values,separators=(",",":"))[:500])
