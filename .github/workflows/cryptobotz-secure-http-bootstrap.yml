name: CryptoBotz Secure HTTPS Runtime Bootstrap

on:
  push:
    branches: [main]
    paths:
      - 'deployments/cryptobotz-secure-http-bootstrap.request'

permissions:
  contents: read

concurrency:
  group: cryptobotz-secure-http-bootstrap
  cancel-in-progress: false

env:
  TARGET_DOMAIN: cryptobotz.cryptoworldz.xyz
  HOSTINGER_USERNAME: u643166328

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: cryptoworldz-production
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate protected request and secrets
        shell: bash
        run: |
          set -euo pipefail
          request='deployments/cryptobotz-secure-http-bootstrap.request'
          test "$(sed -n 's/^target=//p' "$request" | tail -n1)" = "$TARGET_DOMAIN"
          test "$(sed -n 's/^authority=//p' "$request" | tail -n1)" = 'JayJayTeamDev FULL ACCESS PERMISSION & AUTHORITY'
          test "$(sed -n 's/^mode=//p' "$request" | tail -n1)" = 'secure-https-bootstrap'
          test -n "$OPENAI_API_KEY"
          test -n "$HOSTINGER_API_TOKEN"
          echo "::add-mask::$OPENAI_API_KEY"
          echo "::add-mask::$HOSTINGER_API_TOKEN"

      - name: Wait for the Git-deployed bootstrap route to be live
        shell: bash
        run: |
          set -euo pipefail
          commit_time="$(jq -r '.head_commit.timestamp // empty' "$GITHUB_EVENT_PATH")"
          test -n "$commit_time"
          url="https://developers.hostinger.com/api/hosting/v1/accounts/$HOSTINGER_USERNAME/websites/$TARGET_DOMAIN/nodejs/builds"
          ready=0
          sleep 20
          for attempt in $(seq 1 180); do
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' \
              "$url" -o "$RUNNER_TEMP/builds.json"
            if python3 - "$commit_time" "$RUNNER_TEMP/builds.json" <<'PY'
          import datetime as dt, json, sys
          commit=dt.datetime.fromisoformat(sys.argv[1].replace('Z','+00:00'))-dt.timedelta(seconds=8)
          payload=json.load(open(sys.argv[2]))
          items=payload if isinstance(payload,list) else payload.get('data',payload.get('items',[])) if isinstance(payload,dict) else []
          recent=[]
          for item in items:
              if not isinstance(item,dict): continue
              raw=item.get('created_at') or item.get('createdAt')
              if not raw: continue
              try: created=dt.datetime.fromisoformat(str(raw).replace('Z','+00:00'))
              except Exception: continue
              if created >= commit: recent.append((created,item))
          if not recent: raise SystemExit(2)
          created,item=max(recent,key=lambda x:x[0])
          state=str(item.get('state') or item.get('status') or '').lower()
          if state in {'pending','running','queued','in_progress'}: raise SystemExit(3)
          if state != 'completed': raise SystemExit(4)
          PY
            then
              ready=1
              break
            fi
            echo "Waiting for secure bootstrap build $attempt/180"
            sleep 5
          done
          test "$ready" = 1

      - name: Install server-only runtime secrets through verified HTTPS bootstrap
        shell: bash
        run: |
          set -euo pipefail
          jq -nc \
            --arg confirmation 'APPROVE SECURE RUNTIME' \
            --arg hostinger "$HOSTINGER_API_TOKEN" \
            --arg openai "$OPENAI_API_KEY" \
            '{confirmation:$confirmation,hostinger_api_token:$hostinger,openai_api_key:$openai}' > "$RUNNER_TEMP/bootstrap-body.json"
          success=0
          for attempt in $(seq 1 12); do
            code="$(curl --silent --show-error --location --connect-timeout 10 --max-time 45 \
              -H 'Content-Type: application/json' \
              --data-binary @"$RUNNER_TEMP/bootstrap-body.json" \
              -o "$RUNNER_TEMP/bootstrap.json" -w '%{http_code}' \
              "https://$TARGET_DOMAIN/api/hub-central/secure-runtime-bootstrap" || true)"
            if [ "$code" = 200 ] && node -e "const j=require(process.env.RUNNER_TEMP+'/bootstrap.json');if(!j.ok||!j.persisted||!j.hostinger_access_verified||!j.openai_configured)process.exit(1)"; then
              success=1
              break
            fi
            echo "Secure HTTPS bootstrap convergence $attempt/12 (HTTP $code)"
            sleep 5
          done
          rm -f "$RUNNER_TEMP/bootstrap-body.json"
          test "$success" = 1

      - name: Restart Node.js through official Hostinger API
        shell: bash
        run: |
          set -euo pipefail
          url="https://developers.hostinger.com/api/hosting/v1/accounts/$HOSTINGER_USERNAME/websites/$TARGET_DOMAIN/nodejs/server/restart"
          code="$(curl --silent --show-error --location --request POST \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" \
            -H 'Accept: application/json' -H 'Content-Type: application/json' \
            -o "$RUNNER_TEMP/restart.json" -w '%{http_code}' "$url")"
          echo "Hostinger NodeJS restart HTTP $code"
          case "$code" in 200|201|202|204) ;; *) exit 1;; esac

      - name: Prove persisted Hostinger auth OpenAI and Community Support live
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 48); do
            sleep 5
            if curl --fail --silent --show-error --max-time 20 "https://$TARGET_DOMAIN/api/hub-central/status" -o "$RUNNER_TEMP/hub.json" \
              && curl --fail --silent --show-error --max-time 20 "https://$TARGET_DOMAIN/api/oneworldz-gpt/status" -o "$RUNNER_TEMP/gpt.json" \
              && curl --fail --silent --show-error --max-time 20 -H 'Origin: https://oneworldz.com' "https://$TARGET_DOMAIN/api/oneworldz-community-support" -o "$RUNNER_TEMP/community.json" \
              && node - <<'NODE'
          const fs=require('fs'), root=process.env.RUNNER_TEMP;
          const hub=JSON.parse(fs.readFileSync(root+'/hub.json'));
          const gpt=JSON.parse(fs.readFileSync(root+'/gpt.json'));
          const community=JSON.parse(fs.readFileSync(root+'/community.json'));
          if(!hub.ok||hub.hostinger_write_control!=='configured'||hub.oneworldz_gpt!=='configured') process.exit(1);
          if(!gpt.ok||gpt.openai_api_configured!==true||gpt.payments_in_chat!==false) process.exit(1);
          if(!community.ok||community.count!==35||(community.profiles||[]).length!==35) process.exit(1);
          NODE
            then
              success=1
              break
            fi
            echo "Protected runtime convergence $attempt/48"
          done
          test "$success" = 1
          curl --fail --silent --show-error --max-time 60 \
            -H 'Origin: https://oneworldz.com' -H 'Content-Type: application/json' \
            -d '{"page":"deployment-proof","message":"Reply with one short sentence confirming the OneWorldz guide is online."}' \
            "https://$TARGET_DOMAIN/api/oneworldz-gpt/chat" -o "$RUNNER_TEMP/gpt-live.json"
          node - <<'NODE'
          const j=require(process.env.RUNNER_TEMP+'/gpt-live.json');
          if(!j.ok||j.powered_by!=='OpenAI'||!String(j.text||'').trim()) process.exit(1);
          NODE

      - name: Preserve non-secret proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptobotz-secure-http-proof-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/bootstrap.json
            ${{ runner.temp }}/hub.json
            ${{ runner.temp }}/gpt.json
            ${{ runner.temp }}/community.json
            ${{ runner.temp }}/gpt-live.json
          if-no-files-found: ignore
          retention-days: 7
