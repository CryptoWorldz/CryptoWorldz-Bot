name: OneWorldz Canonical Production Release
run-name: Canonical One Run — ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      deploy_websites:
        description: Deploy and byte-prove all 18 static OneWorldz destinations
        required: true
        type: boolean
        default: true
      deploy_zed:
        description: Deploy and live-prove protected ZED / Command Centre runtime
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  websites:
    if: ${{ inputs.deploy_websites }}
    name: WEBSITES — CLEAN → BUILD → 18 STATIC DESTINATIONS → LIVE BYTES
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install protected FTPS transport
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/lftp-compat.py
          mkdir -p "$RUNNER_TEMP/oneworldz-bin"
          cat > "$RUNNER_TEMP/oneworldz-bin/lftp" <<'SH'
          #!/usr/bin/env bash
          exec python3 "$GITHUB_WORKSPACE/.github/lftp-compat.py" "$@"
          SH
          chmod +x "$RUNNER_TEMP/oneworldz-bin/lftp"
          echo "$RUNNER_TEMP/oneworldz-bin" >> "$GITHUB_PATH"

      - name: Install repository dependencies
        run: npm ci

      - name: Build and fail-closed validate complete static fleet
        run: npm run build:ecosystem-release

      - name: Prove static destination boundary
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { productionTargets } from './apps/oneworldz-ecosystem-release/production-targets.mjs';
          if (productionTargets.length !== 18) throw new Error(`Expected 18 static targets, got ${productionTargets.length}`);
          for (const target of productionTargets) {
            if (/cryptobotz|\/nodejs/.test(target.hostingerTransportDir)) throw new Error(`Protected ZED path leaked into static targets: ${target.key}`);
            console.log(`${target.key}\t${target.domain}\t${target.hostingerTransportDir}`);
          }
          NODE

      - name: Clean owned static trees and deploy exact candidate
        shell: bash
        run: bash .github/full-current-static-deploy.sh

      - name: Websites verdict
        run: echo 'ONEWORLDZ_STATIC_FLEET=PASS'

  zed:
    if: ${{ inputs.deploy_zed }}
    name: ZED — PROTECTED NODE RUNTIME → TELEGRAM + GRACE LIVE PROOF
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: cryptoworldz-production
    env:
      PROTECTED_DOMAIN: cryptobotz.cryptoworldz.xyz
      PROTECTED_NODE_ROOT: /domains/cryptobotz.cryptoworldz.xyz/nodejs
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install protected FTPS transport
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/lftp-compat.py
          mkdir -p "$RUNNER_TEMP/oneworldz-bin"
          cat > "$RUNNER_TEMP/oneworldz-bin/lftp" <<'SH'
          #!/usr/bin/env bash
          exec python3 "$GITHUB_WORKSPACE/.github/lftp-compat.py" "$@"
          SH
          chmod +x "$RUNNER_TEMP/oneworldz-bin/lftp"
          echo "$RUNNER_TEMP/oneworldz-bin" >> "$GITHUB_PATH"

      - name: Prove protected destination boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$PROTECTED_DOMAIN" = 'cryptobotz.cryptoworldz.xyz'
          test "$PROTECTED_NODE_ROOT" = '/domains/cryptobotz.cryptoworldz.xyz/nodejs'

      - name: Deploy and prove ZED runtime only
        shell: bash
        run: bash .github/full-current-zed-runtime.sh

      - name: Prove Telegram Command Centre launcher
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BOT_TOKEN"
          echo "::add-mask::$BOT_TOKEN"
          curl --fail --silent --show-error --max-time 20 \
            "https://api.telegram.org/bot${BOT_TOKEN}/getChatMenuButton" \
            -o "$RUNNER_TEMP/menu-button.json"
          MENU_FILE="$RUNNER_TEMP/menu-button.json" node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync(process.env.MENU_FILE, 'utf8'));
          const button = payload && payload.result;
          if (payload.ok !== true) throw new Error('Telegram getChatMenuButton failed');
          if (!button || button.type !== 'web_app') throw new Error('Telegram menu button is not web_app');
          if (button.text !== '🌐 OPEN COMMAND CENTRE') throw new Error(`Unexpected menu text: ${button.text || ''}`);
          if (!button.web_app || button.web_app.url !== 'https://cryptobotz.cryptoworldz.xyz/miniapp/') throw new Error(`Unexpected Mini App URL: ${button.web_app?.url || ''}`);
          console.log('TELEGRAM_COMMAND_CENTRE_BUTTON=PASS');
          NODE

      - name: Prove GRACE social-control configuration
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 20 \
            'https://cryptobotz.cryptoworldz.xyz/grace/health' -o "$RUNNER_TEMP/grace-health.json"
          GRACE_FILE="$RUNNER_TEMP/grace-health.json" node <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync(process.env.GRACE_FILE, 'utf8'));
          if (x.ok !== true || x.service !== 'grace-social-engine') throw new Error('GRACE health failed');
          if (x.posting !== 'approval-controlled') throw new Error(`Unexpected GRACE posting mode: ${x.posting}`);
          if (x.automatic_ad_spend !== false) throw new Error('Automatic ad spend must remain disabled until platform/account authorization is explicit');
          if (x.x_oauth_configured !== true) throw new Error('GRACE X OAuth app configuration is missing');
          if (x.facebook_oauth_configured !== true) throw new Error('GRACE Facebook OAuth app configuration is missing');
          console.log('GRACE_SOCIAL_CONTROL_CONFIGURATION=PASS');
          NODE

      - name: ZED verdict
        run: echo 'ZED_PROTECTED_RUNTIME=PASS'

  external_public_proof:
    name: EXTERNAL PUBLIC PROOF — STRIPE + 35 FACEBOOK REGISTRY + GRACE
    if: ${{ always() && (inputs.deploy_websites || inputs.deploy_zed) }}
    needs: [websites, zed]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require selected deployment jobs to succeed
        shell: bash
        env:
          WEBSITE_RESULT: ${{ needs.websites.result }}
          ZED_RESULT: ${{ needs.zed.result }}
          WANT_WEBSITES: ${{ inputs.deploy_websites }}
          WANT_ZED: ${{ inputs.deploy_zed }}
        run: |
          set -euo pipefail
          if [ "$WANT_WEBSITES" = 'true' ] && [ "$WEBSITE_RESULT" != 'success' ]; then echo "Websites job result: $WEBSITE_RESULT" >&2; exit 1; fi
          if [ "$WANT_ZED" = 'true' ] && [ "$ZED_RESULT" != 'success' ]; then echo "ZED job result: $ZED_RESULT" >&2; exit 1; fi

      - name: Prove four live Stripe destinations are reachable
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            'https://donate.stripe.com/14A6oHcG61Ox87Y0Xb0kE01' \
            'https://donate.stripe.com/9B67sLgWm78R73U35j0kE02' \
            'https://donate.stripe.com/dRm8wPdKa0Kt2NE7lz0kE03' \
            'https://buy.stripe.com/6oUeVd9tU0Ktewm0Xb0kE00'; do
            curl --fail --silent --show-error --location --connect-timeout 10 --max-time 30 -o /dev/null "$url"
            echo "STRIPE_DESTINATION_REACHABLE $url"
          done

      - name: Prove Supabase-backed 35 Facebook registry through protected runtime
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            'https://cryptobotz.cryptoworldz.xyz/api/oneworldz-community-support' \
            -o "$RUNNER_TEMP/community.json"
          COMMUNITY_FILE="$RUNNER_TEMP/community.json" node <<'NODE'
          const fs = require('fs');
          const x = JSON.parse(fs.readFileSync(process.env.COMMUNITY_FILE, 'utf8'));
          if (x.ok !== true || x.count !== 35 || !Array.isArray(x.profiles) || x.profiles.length !== 35) throw new Error('35-record community registry proof failed');
          if (x.preview_rule !== 'verified_metadata_or_exact_facebook_link_never_invent') throw new Error('Facebook preview safety contract missing');
          const orders = x.profiles.map(p => Number(p.display_order));
          if (new Set(orders).size !== 35 || Math.min(...orders) !== 1 || Math.max(...orders) !== 35) throw new Error('Community registry order is not exactly 1-35');
          for (const p of x.profiles) if (!/^https:\/\/(?:www\.)?facebook\.com\//i.test(String(p.facebook_url || ''))) throw new Error(`Invalid Facebook destination at ${p.display_order}`);
          console.log(`COMMUNITY_REGISTRY=PASS verified_previews=${Number(x.verified_previews || 0)} exact_links=35`);
          NODE

      - name: Canonical release verdict
        run: echo 'ONEWORLDZ_CANONICAL_ONE_RUN=PASS'
