name: PATCH — OneWorldz Areas of Support — Proof First

on:
  push:
    branches:
      - main
    paths:
      - deployments/oneworldz-support-patch.request

permissions:
  contents: read

concurrency:
  group: oneworldz-support-patch-production
  cancel-in-progress: false

jobs:
  patch:
    name: Backup → Patch → Verify → Rollback on failure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: oneworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || '/' }}
      FTP_ACCOUNT_SCOPE: ${{ vars.FTP_ACCOUNT_SCOPE }}
      HOSTINGER_LOCKED_IP: '145.223.108.40'
      HOSTINGER_TLS_ALIAS: 'worldz-ftp-pinned.hstgr.io'
      HOSTINGER_CERT_SHA256: '47:E1:B5:DC:5D:61:02:E8:ED:8C:01:21:61:AF:8B:22:53:70:AB:55:63:B0:0C:AF:14:6C:BD:7A:96:51:E9:5E'
      SOURCE_ROOT: apps/cryptoworldz-web-core
      REQUEST_FILE: deployments/oneworldz-support-patch.request

    steps:
      - name: Checkout requested patch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate explicit approval and patch payload
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'target=oneworldz' "$REQUEST_FILE"
          grep -Fx 'requested_by=JayJayTeamDev' "$REQUEST_FILE"
          grep -Fx 'confirmation=APPROVE SUPPORT PATCH' "$REQUEST_FILE"
          source_commit="$(sed -n 's/^source_commit=//p' "$REQUEST_FILE" | head -n1)"
          [[ -n "$source_commit" ]]
          [[ "$source_commit" == "${{ github.event.before }}" ]]
          [[ "$(git rev-parse HEAD^)" == "$source_commit" ]]
          test "$FTP_ACCOUNT_SCOPE" = 'DOMAIN_ONLY'
          test -n "$FTP_HOST" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          [[ "$FTP_SERVER_DIR" == '/' || "$FTP_SERVER_DIR" == '/public_html' ]]

          test -f "$SOURCE_ROOT/index.html"
          test -f "$SOURCE_ROOT/assets/site-router.js"
          test -f "$SOURCE_ROOT/assets/oneworldz-support-campaign.js"
          for part in 00 01 02 03; do test -s "$SOURCE_ROOT/assets/campaign/areas-support/$part.b64"; done
          node --check "$SOURCE_ROOT/assets/site-router.js"
          node --check "$SOURCE_ROOT/assets/oneworldz-support-campaign.js"
          cat "$SOURCE_ROOT"/assets/campaign/areas-support/{00,01,02,03}.b64 | base64 -d > /tmp/oneworldz-areas-support.avif
          test -s /tmp/oneworldz-areas-support.avif
          grep -Fq '20260812-oneworldz-support-v1' "$SOURCE_ROOT/index.html"
          grep -Fq 'oneworldz-support-campaign.js' "$SOURCE_ROOT/assets/site-router.js"
          echo 'Patch payload validated.'

      - name: Install secure FTPS client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp openssl

      - name: Establish certificate-validated transfer host
        id: cert
        shell: bash
        run: |
          set -euo pipefail
          host="$(printf '%s' "$FTP_HOST" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#^ftp://##' -e 's#^ftps://##' -e 's#/.*$##')"
          if [[ "$host" != *:*:* && "$host" == *:* ]]; then host="${host%%:*}"; fi
          test -n "$host"

          if [[ "$host" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            test "$host" = "$HOSTINGER_LOCKED_IP"
            test "$FTP_PORT" = '21'
            echo "$HOSTINGER_LOCKED_IP $HOSTINGER_TLS_ALIAS" | sudo tee -a /etc/hosts >/dev/null
            cert_ok=0
            for attempt in 1 2 3; do
              session="$RUNNER_TEMP/ftps-session-$attempt.txt"
              cert="$RUNNER_TEMP/ftps-cert-$attempt.pem"
              err="$RUNNER_TEMP/ftps-err-$attempt.txt"
              set +e
              timeout 20 openssl s_client -connect "$HOSTINGER_LOCKED_IP:21" -servername "$HOSTINGER_TLS_ALIAS" -starttls ftp -showcerts </dev/null >"$session" 2>"$err"
              rc=$?
              set -e
              if [[ "$rc" -ne 0 ]]; then sleep $((attempt * 2)); continue; fi
              sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' "$session" | sed -n '1,/-----END CERTIFICATE-----/p' > "$cert"
              [[ -s "$cert" ]] || { sleep $((attempt * 2)); continue; }
              fp="$(openssl x509 -in "$cert" -noout -fingerprint -sha256 | cut -d= -f2)"
              if [[ "$fp" == "$HOSTINGER_CERT_SHA256" ]] && openssl x509 -in "$cert" -noout -ext subjectAltName | grep -Fq 'DNS:*.hstgr.io' && grep -Fq 'Verify return code: 0 (ok)' "$session"; then cert_ok=1; break; fi
              sleep $((attempt * 2))
            done
            [[ "$cert_ok" == '1' ]]
            connect_host="$HOSTINGER_TLS_ALIAS"
          else
            connect_host="$host"
          fi

          echo "connect_host=$connect_host" >> "$GITHUB_OUTPUT"
          timeout 45 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$connect_host" -e "set cmd:fail-exit yes; set net:max-retries 1; set net:timeout 15; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname yes; cd '$FTP_SERVER_DIR'; bye"
          echo 'Certificate-validated production target confirmed.'

      - name: Capture targeted rollback snapshot
        id: backup
        shell: bash
        env:
          FTP_CONNECT_HOST: ${{ steps.cert.outputs.connect_host }}
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/oneworldz-support-backup"
          mkdir -p "$backup/assets"
          timeout 45 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_CONNECT_HOST" -e "set cmd:fail-exit yes; set net:max-retries 2; set net:timeout 20; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname yes; cd '$FTP_SERVER_DIR'; get index.html -o '$backup/index.html'; get assets/site-router.js -o '$backup/assets/site-router.js'; bye"
          test -s "$backup/index.html"
          test -s "$backup/assets/site-router.js"
          echo "backup_dir=$backup" >> "$GITHUB_OUTPUT"
          echo 'Targeted rollback snapshot captured.'

      - name: Upload OneWorldz support patch
        id: upload
        shell: bash
        env:
          FTP_CONNECT_HOST: ${{ steps.cert.outputs.connect_host }}
        run: |
          set -euo pipefail
          timeout 90 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_CONNECT_HOST" -e "set cmd:fail-exit yes; set net:max-retries 2; set net:timeout 20; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname yes; cd '$FTP_SERVER_DIR'; mkdir -p assets; mkdir -p assets/campaign; mkdir -p assets/campaign/areas-support; put -O . '$SOURCE_ROOT/index.html'; put -O assets '$SOURCE_ROOT/assets/site-router.js'; put -O assets '$SOURCE_ROOT/assets/oneworldz-support-campaign.js'; put -O assets/campaign/areas-support '$SOURCE_ROOT/assets/campaign/areas-support/00.b64'; put -O assets/campaign/areas-support '$SOURCE_ROOT/assets/campaign/areas-support/01.b64'; put -O assets/campaign/areas-support '$SOURCE_ROOT/assets/campaign/areas-support/02.b64'; put -O assets/campaign/areas-support '$SOURCE_ROOT/assets/campaign/areas-support/03.b64'; bye"
          echo 'Patch upload completed.'

      - name: Verify live OneWorldz support release
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          cb="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          retry() {
            local url="$1" pattern="$2"
            for n in 1 2 3 4 5 6; do
              if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "${url}?cb=${cb}-${n}" | grep -Fq "$pattern"; then return 0; fi
              sleep 5
            done
            return 1
          }
          retry 'https://oneworldz.com/' '20260812-oneworldz-support-v1'
          retry 'https://oneworldz.com/assets/site-router.js' 'oneworldz-support-campaign.js'
          retry 'https://oneworldz.com/assets/oneworldz-support-campaign.js' 'areas-support/00.b64'
          for part in 00 01 02 03; do
            size="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://oneworldz.com/assets/campaign/areas-support/${part}.b64?cb=${cb}" | wc -c)"
            [[ "$size" -gt 1000 ]]
          done
          echo 'Live OneWorldz support release verified.'

      - name: Roll back patch if upload or live proof fails
        if: ${{ failure() && steps.backup.outcome == 'success' && steps.upload.outcome != 'skipped' }}
        shell: bash
        env:
          FTP_CONNECT_HOST: ${{ steps.cert.outputs.connect_host }}
          BACKUP_DIR: ${{ steps.backup.outputs.backup_dir }}
        run: |
          set -euo pipefail
          timeout 90 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_CONNECT_HOST" -e "set cmd:fail-exit yes; set net:max-retries 2; set net:timeout 20; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname yes; cd '$FTP_SERVER_DIR'; put -O . '$BACKUP_DIR/index.html'; put -O assets '$BACKUP_DIR/assets/site-router.js'; rm -f assets/oneworldz-support-campaign.js; rm -f assets/campaign/areas-support/00.b64; rm -f assets/campaign/areas-support/01.b64; rm -f assets/campaign/areas-support/02.b64; rm -f assets/campaign/areas-support/03.b64; bye"
          echo 'Patch rollback completed.'
