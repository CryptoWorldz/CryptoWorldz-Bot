name: PATCH — OneWorldz Areas of Support — Proof First

on:
  push:
    branches: [main]
    paths:
      - deployments/oneworldz-support-patch.request

permissions:
  contents: read

concurrency:
  group: oneworldz-support-patch-production
  cancel-in-progress: false

jobs:
  patch:
    name: Backup → Patch → Verify → Rollback on failure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: oneworldz-production
    env:
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || '/' }}
      FTP_ACCOUNT_SCOPE: ${{ vars.FTP_ACCOUNT_SCOPE }}
      DEPLOY_GUARD: ${{ vars.DEPLOY_GUARD }}
      APPROVED_FTP_HOST: '145.223.108.40'
      TLS_ALIAS: 'oneworldz-ftp-pinned.hstgr.io'
      FTP_PORT: '21'
      APPROVED_CERT_SHA256: '47:E1:B5:DC:5D:61:02:E8:ED:8C:01:21:61:AF:8B:22:53:70:AB:55:63:B0:0C:AF:14:6C:BD:7A:96:51:E9:5E'
      SOURCE_ROOT: apps/cryptoworldz-web-core
      REQUEST_FILE: deployments/oneworldz-support-patch.request

    steps:
      - name: Checkout requested patch commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate explicit approval and patch payload
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx 'target=oneworldz' "$REQUEST_FILE"
          grep -Fx 'requested_by=JayJayTeamDev' "$REQUEST_FILE"
          grep -Fx 'confirmation=APPROVE SUPPORT PATCH' "$REQUEST_FILE"
          source_commit="$(sed -n 's/^source_commit=//p' "$REQUEST_FILE" | head -n1)"
          [[ -n "$source_commit" ]]
          [[ "$source_commit" == "${{ github.event.before }}" ]]
          [[ "$(git rev-parse HEAD^)" == "$source_commit" ]]
          [[ "$FTP_ACCOUNT_SCOPE" == 'DOMAIN_ONLY' ]]
          [[ "$DEPLOY_GUARD" == 'ONEWORLDZ.COM' ]]
          [[ "$FTP_SERVER_DIR" == '/' ]]
          [[ -n "$FTP_USERNAME" && -n "$FTP_PASSWORD" ]]
          test -f "$SOURCE_ROOT/index.html"
          test -f "$SOURCE_ROOT/assets/site-router.js"
          test -f "$SOURCE_ROOT/assets/oneworldz-support-campaign.js"
          for part in 00 01 02 03; do test -s "$SOURCE_ROOT/assets/campaign/areas-support/$part.b64"; done
          node --check "$SOURCE_ROOT/assets/site-router.js"
          node --check "$SOURCE_ROOT/assets/oneworldz-support-campaign.js"
          cat "$SOURCE_ROOT"/assets/campaign/areas-support/{00,01,02,03}.b64 | base64 -d > /tmp/oneworldz-areas-support.avif
          test -s /tmp/oneworldz-areas-support.avif
          grep -Fq '20260812-oneworldz-support-v1' "$SOURCE_ROOT/index.html"
          grep -Fq 'oneworldz-support-campaign.js' "$SOURCE_ROOT/assets/site-router.js"
          echo 'Patch payload validated.'

      - name: Install secure FTPS client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp openssl

      - name: Verify locked Hostinger TLS certificate and production root
        id: target
        shell: bash
        run: |
          set -euo pipefail
          session="$RUNNER_TEMP/oneworldz-ftps-session.txt"
          cert="$RUNNER_TEMP/oneworldz-ftps-cert.pem"
          timeout 20 openssl s_client -starttls ftp -connect "$APPROVED_FTP_HOST:$FTP_PORT" -verify_return_error -showcerts </dev/null > "$session" 2>/dev/null
          grep -Fq 'Verify return code: 0 (ok)' "$session"
          sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' "$session" | sed -n '1,/-----END CERTIFICATE-----/p' > "$cert"
          test -s "$cert"
          openssl x509 -in "$cert" -noout -subject -ext subjectAltName | grep -Fq '*.hstgr.io'
          actual_fp="$(openssl x509 -in "$cert" -noout -fingerprint -sha256 | cut -d= -f2)"
          [[ "$actual_fp" == "$APPROVED_CERT_SHA256" ]]
          echo "$APPROVED_FTP_HOST $TLS_ALIAS" | sudo tee -a /etc/hosts >/dev/null

          probe="$RUNNER_TEMP/oneworldz-live-probe.html"
          timeout 40 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$TLS_ALIAS" -e "set cmd:fail-exit yes; set net:max-retries 1; set net:timeout 15; set net:idle 15; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname yes; cd '$FTP_SERVER_DIR'; get index.html -o '$probe'; bye"
          grep -Fq 'site-router.js' "$probe"
          echo "connect_host=$TLS_ALIAS" >> "$GITHUB_OUTPUT"
          echo 'Pinned Hostinger FTPS certificate and OneWorldz production root confirmed.'

      - name: Capture targeted rollback snapshot
        id: backup
        shell: bash
        env:
          FTP_CONNECT_HOST: ${{ steps.target.outputs.connect_host }}
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/oneworldz-support-backup"
          mkdir -p "$backup/assets"
          timeout 45 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_CONNECT_HOST" -e "set cmd:fail-exit yes; set net:max-retries 2; set net:timeout 20; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname yes; cd '$FTP_SERVER_DIR'; get index.html -o '$backup/index.html'; get assets/site-router.js -o '$backup/assets/site-router.js'; bye"
          test -s "$backup/index.html"
          test -s "$backup/assets/site-router.js"
          echo "backup_dir=$backup" >> "$GITHUB_OUTPUT"
          echo 'Targeted rollback snapshot captured.'

      - name: Upload OneWorldz support patch
        id: upload
        shell: bash
        env:
          FTP_CONNECT_HOST: ${{ steps.target.outputs.connect_host }}
        run: |
          set -euo pipefail
          timeout 90 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_CONNECT_HOST" -e "set cmd:fail-exit yes; set net:max-retries 2; set net:timeout 20; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname yes; cd '$FTP_SERVER_DIR'; set cmd:fail-exit no; mkdir assets/campaign; mkdir assets/campaign/areas-support; set cmd:fail-exit yes; put -O . '$SOURCE_ROOT/index.html'; put -O assets '$SOURCE_ROOT/assets/site-router.js'; put -O assets '$SOURCE_ROOT/assets/oneworldz-support-campaign.js'; put -O assets/campaign/areas-support '$SOURCE_ROOT/assets/campaign/areas-support/00.b64'; put -O assets/campaign/areas-support '$SOURCE_ROOT/assets/campaign/areas-support/01.b64'; put -O assets/campaign/areas-support '$SOURCE_ROOT/assets/campaign/areas-support/02.b64'; put -O assets/campaign/areas-support '$SOURCE_ROOT/assets/campaign/areas-support/03.b64'; bye"
          echo 'Patch upload completed.'

      - name: Verify live OneWorldz support release
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          cb="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          retry() {
            local url="$1" pattern="$2"
            for n in 1 2 3 4 5 6; do
              if curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "${url}?cb=${cb}-${n}" | grep -Fq "$pattern"; then return 0; fi
              sleep 5
            done
            return 1
          }
          retry 'https://oneworldz.com/' '20260812-oneworldz-support-v1'
          retry 'https://oneworldz.com/assets/site-router.js' 'oneworldz-support-campaign.js'
          retry 'https://oneworldz.com/assets/oneworldz-support-campaign.js' 'areas-support/00.b64'
          for part in 00 01 02 03; do
            size="$(curl -fsS --max-time 20 -H 'Cache-Control: no-cache' "https://oneworldz.com/assets/campaign/areas-support/${part}.b64?cb=${cb}" | wc -c)"
            [[ "$size" -gt 1000 ]]
          done
          echo 'Live OneWorldz support release verified.'

      - name: Roll back patch if upload or live proof fails
        if: ${{ failure() && steps.backup.outcome == 'success' && steps.upload.outcome != 'skipped' }}
        shell: bash
        env:
          FTP_CONNECT_HOST: ${{ steps.target.outputs.connect_host }}
          BACKUP_DIR: ${{ steps.backup.outputs.backup_dir }}
        run: |
          set -euo pipefail
          timeout 90 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_CONNECT_HOST" -e "set cmd:fail-exit yes; set net:max-retries 2; set net:timeout 20; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname yes; cd '$FTP_SERVER_DIR'; put -O . '$BACKUP_DIR/index.html'; put -O assets '$BACKUP_DIR/assets/site-router.js'; set cmd:fail-exit no; rm -f assets/oneworldz-support-campaign.js; rm -f assets/campaign/areas-support/00.b64; rm -f assets/campaign/areas-support/01.b64; rm -f assets/campaign/areas-support/02.b64; rm -f assets/campaign/areas-support/03.b64; bye"
          echo 'Patch rollback completed.'
