name: ZED Emergency Runtime Repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/zed-emergency-repair.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-emergency-runtime-repair
  cancel-in-progress: true

env:
  PROTECTED_DOMAIN: cryptobotz.cryptoworldz.xyz
  PROTECTED_NODE_ROOT: /domains/cryptobotz.cryptoworldz.xyz/nodejs

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BOT_TOKEN_SECRET: ${{ secrets.BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN || secrets.ZED_BOT_TOKEN || secrets.CRYPTOWORLDZ_BOT_TOKEN }}
      SUPABASE_URL_SECRET: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY_SECRET: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_PUBLISHABLE_KEY_SECRET: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_KEY }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install repository FTPS transport
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/lftp-compat.py
          mkdir -p "$RUNNER_TEMP/oneworldz-bin"
          cat > "$RUNNER_TEMP/oneworldz-bin/lftp" <<'SH'
          #!/usr/bin/env bash
          exec python3 "$GITHUB_WORKSPACE/.github/lftp-compat.py" "$@"
          SH
          chmod +x "$RUNNER_TEMP/oneworldz-bin/lftp"
          echo "$RUNNER_TEMP/oneworldz-bin" >> "$GITHUB_PATH"

      - name: Deploy full ZED runtime
        shell: bash
        run: |
          set -euo pipefail
          bash .github/full-current-zed-runtime.sh

      - name: Restore Telegram webhook and prove backlog is moving
        shell: python
        run: |
          import hashlib, json, os, time, urllib.request

          token=str(os.environ.get("BOT_TOKEN_SECRET","")).strip()
          if not token:
              raise SystemExit("BOT_TOKEN_SECRET missing")
          print("::add-mask::"+token)

          api="https://api.telegram.org/bot"+token+"/"
          webhook="https://cryptobotz.cryptoworldz.xyz/telegram-webhook"
          secret=hashlib.sha256(token.encode()).hexdigest()

          def call(method,payload=None):
              data=None
              headers={}
              if payload is not None:
                  data=json.dumps(payload).encode("utf-8")
                  headers["content-type"]="application/json"
              request=urllib.request.Request(api+method,data=data,headers=headers)
              with urllib.request.urlopen(request,timeout=30) as response:
                  result=json.loads(response.read().decode("utf-8"))
              if result.get("ok") is not True:
                  raise SystemExit("Telegram "+method+" failed")
              return result.get("result")

          before=call("getWebhookInfo")
          pending_before=int(before.get("pending_update_count") or 0)
          print("ZED_TELEGRAM_BACKLOG_BEFORE="+str(pending_before))

          call("setWebhook",{
              "url":webhook,
              "secret_token":secret,
              "allowed_updates":["message","callback_query"],
              "drop_pending_updates":False,
              "max_connections":5
          })

          root=urllib.request.Request("https://cryptobotz.cryptoworldz.xyz/health",headers={"Cache-Control":"no-cache"})
          with urllib.request.urlopen(root,timeout=20) as response:
              health=json.loads(response.read().decode("utf-8"))
          if health.get("ok") is not True:
              raise SystemExit("ZED health is not ready")

          pending_after=pending_before
          hook=None
          for attempt in range(1,13):
              time.sleep(5)
              hook=call("getWebhookInfo")
              pending_after=int(hook.get("pending_update_count") or 0)
              print("ZED_TELEGRAM_BACKLOG_CHECK="+str(attempt)+" PENDING="+str(pending_after))
              if pending_after == 0 or pending_after < pending_before:
                  break

          if hook is None:
              hook=call("getWebhookInfo")
          if hook.get("url") != webhook:
              raise SystemExit("Telegram webhook URL mismatch")
          if pending_before and pending_after >= pending_before:
              raise SystemExit("Telegram backlog did not begin draining")

          print("ZED_FULL_RUNTIME=PASS")
          print("ZED_TELEGRAM_WEBHOOK=PASS")
          print("ZED_TELEGRAM_BACKLOG_CONTROL=PASS")
          print("ZED_COMMAND_CENTRE_MAX_REPAIR=PASS")
