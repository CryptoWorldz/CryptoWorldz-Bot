name: Worldz Jupiter Studio creator research
on:
  push:
    paths:
      - 'tools/worldz-jupiter-studio-creators.mjs'
      - '.github/workflows/worldz-jupiter-studio-creators.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read Jupiter Studio on-chain launches
        env:
          SOLANA_RPC_URL: ${{ vars.SOLANA_RPC_URL }}
        run: node tools/worldz-jupiter-studio-creators.mjs
      - name: Save public research
        run: |
          git config user.name worldz-discovery-bot
          git config user.email worldz-discovery-bot@users.noreply.github.com
          git add launchpad.cryptoworldz.xyz/wallet-snapshots/jupiter-studio-creators.latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Record Jupiter Studio on-chain launch research [cancel-full-deploy]"
            git push
          fi
