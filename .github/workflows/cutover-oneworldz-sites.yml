name: Cut over OneWorldz to Sites

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/cutover-oneworldz-sites.yml

permissions:
  contents: read

concurrency:
  group: oneworldz-sites-dns-cutover
  cancel-in-progress: false

jobs:
  cutover:
    name: Validate, cut over, and verify OneWorldz DNS
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: cryptoworldz-production
    env:
      HOSTINGER_API_TOKEN_PRIMARY: ${{ secrets.HOSTINGER_API_TOKEN }}
      HOSTINGER_API_TOKEN_LEGACY: ${{ secrets.API_TOKEN }}
      HOSTINGER_API_TOKEN_ALT: ${{ secrets.HAPI_TOKEN }}
      HOSTINGER_API_TOKEN_KEY: ${{ secrets.HOSTINGER_API_KEY }}
    steps:
      - name: Select configured Hostinger API token
        shell: bash
        run: |
          set -euo pipefail
          token=''
          for candidate in \
            "$HOSTINGER_API_TOKEN_PRIMARY" \
            "$HOSTINGER_API_TOKEN_LEGACY" \
            "$HOSTINGER_API_TOKEN_ALT" \
            "$HOSTINGER_API_TOKEN_KEY"; do
            if [[ -n "$candidate" ]]; then
              token="$candidate"
              break
            fi
          done

          if [[ -z "$token" ]]; then
            echo '::error::No Hostinger API token is configured in the cryptoworldz-production environment.'
            exit 1
          fi

          echo "::add-mask::$token"
          echo "HOSTINGER_CONTROL_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Snapshot current zone and build the exact change
        id: preflight
        shell: bash
        env:
          BEFORE: ${{ runner.temp }}/oneworldz-before.json
          DESIRED: ${{ runner.temp }}/oneworldz-desired.json
          ROLLBACK: ${{ runner.temp }}/oneworldz-rollback-core.json
        run: |
          set -euo pipefail
          base='https://developers.hostinger.com'
          domain='oneworldz.com'

          status="$(curl -sS --max-time 30 \
            -H "Authorization: Bearer $HOSTINGER_CONTROL_TOKEN" \
            -H 'Accept: application/json' \
            -o "$BEFORE" \
            -w '%{http_code}' \
            "$base/api/dns/v1/zones/$domain")"

          case "$status" in
            2??) ;;
            *)
              echo "::error::Hostinger DNS snapshot failed with HTTP $status."
              exit 1
              ;;
          esac

          node <<'NODE'
          const fs = require('node:fs');

          const before = JSON.parse(fs.readFileSync(process.env.BEFORE, 'utf8'));
          if (!Array.isArray(before)) {
            throw new Error('Hostinger returned an unexpected DNS zone shape.');
          }

          const domain = 'oneworldz.com';
          const canonical = (value) => String(value || '').toLowerCase().replace(/\.$/, '');
          const relative = (name) => {
            const value = canonical(name);
            if (value === domain || value === '@') return '@';
            if (value.endsWith('.' + domain)) return value.slice(0, -(domain.length + 1));
            return value;
          };
          const contents = (groups) => groups.flatMap((group) =>
            Array.isArray(group.records)
              ? group.records
                  .map((record) => record && record.content)
                  .filter((value) => typeof value === 'string' && value.length > 0)
              : []
          );
          const group = (name, type) => before.filter((entry) =>
            relative(entry.name) === name && String(entry.type || '').toUpperCase() === type
          );

          const rollbackZone = [];
          for (const spec of [
            { name: '@', type: 'A' },
            { name: 'www', type: 'CNAME' },
          ]) {
            const existing = group(spec.name, spec.type);
            const records = contents(existing);
            if (records.length > 0) {
              rollbackZone.push({
                name: spec.name,
                type: spec.type,
                ttl: Number(existing[0].ttl) || 300,
                records: records.map((content) => ({ content })),
              });
            }
          }

          const oldA = rollbackZone.find((entry) => entry.name === '@' && entry.type === 'A');
          if (!oldA || oldA.records.length === 0) {
            throw new Error('Refusing cutover: no existing apex A record was available for rollback.');
          }

          const desired = {
            overwrite: true,
            zone: [
              {
                name: '@',
                type: 'A',
                ttl: 300,
                records: [
                  { content: '162.159.143.30' },
                  { content: '172.66.3.26' },
                ],
              },
              {
                name: 'www',
                type: 'CNAME',
                ttl: 300,
                records: [{ content: 'custom-domains.chatgpt.site.' }],
              },
              {
                name: '_openai-site-verification',
                type: 'TXT',
                ttl: 300,
                records: [{ content: 'openai-site-verification=UBrsIxE6I81zWVHMri0q6raWEjuTlg9crpLDhdTk-UY' }],
              },
              {
                name: '_cf-custom-hostname',
                type: 'TXT',
                ttl: 300,
                records: [{ content: '73b99df8-1ef2-439d-900c-dcdce18cf4b9' }],
              },
              {
                name: '_openai-site-verification.www',
                type: 'TXT',
                ttl: 300,
                records: [{ content: 'openai-site-verification=iNab7ynr0HmHYXlU5Misg1z_YyT4cYaIAWsVNWmXdYo' }],
              },
              {
                name: '_cf-custom-hostname.www',
                type: 'TXT',
                ttl: 300,
                records: [{ content: '65440d99-e622-428d-b034-5fd91a402228' }],
              },
            ],
          };

          fs.writeFileSync(process.env.DESIRED, JSON.stringify(desired));
          fs.writeFileSync(process.env.ROLLBACK, JSON.stringify({ overwrite: true, zone: rollbackZone }));
          console.log('snapshot.total_groups=' + before.length);
          console.log('snapshot.rollback_web_groups=' + rollbackZone.length);
          console.log('change.target_groups=' + desired.zone.length);
          NODE

          validation_response="$RUNNER_TEMP/oneworldz-validation-response.json"
          validation_status="$(curl -sS --max-time 30 \
            -X POST \
            -H "Authorization: Bearer $HOSTINGER_CONTROL_TOKEN" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data-binary @"$DESIRED" \
            -o "$validation_response" \
            -w '%{http_code}' \
            "$base/api/dns/v1/zones/$domain/validate")"

          case "$validation_status" in
            2??) echo 'Hostinger accepted the exact DNS change.' ;;
            *)
              echo "::error::Hostinger rejected the DNS preflight with HTTP $validation_status."
              head -c 1000 "$validation_response" || true
              exit 1
              ;;
          esac

      - name: Apply only OneWorldz web and validation records
        id: apply
        shell: bash
        env:
          DESIRED: ${{ runner.temp }}/oneworldz-desired.json
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/oneworldz-apply-response.json"
          status="$(curl -sS --max-time 30 \
            -X PUT \
            -H "Authorization: Bearer $HOSTINGER_CONTROL_TOKEN" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data-binary @"$DESIRED" \
            -o "$response" \
            -w '%{http_code}' \
            'https://developers.hostinger.com/api/dns/v1/zones/oneworldz.com')"

          case "$status" in
            2??) echo 'OneWorldz DNS cutover accepted.' ;;
            *)
              echo "::error::Hostinger rejected the DNS update with HTTP $status."
              head -c 1000 "$response" || true
              exit 1
              ;;
          esac

      - name: Verify the authoritative Hostinger zone
        id: verify
        shell: bash
        env:
          AFTER: ${{ runner.temp }}/oneworldz-after.json
        run: |
          set -euo pipefail
          status="$(curl -sS --max-time 30 \
            -H "Authorization: Bearer $HOSTINGER_CONTROL_TOKEN" \
            -H 'Accept: application/json' \
            -o "$AFTER" \
            -w '%{http_code}' \
            'https://developers.hostinger.com/api/dns/v1/zones/oneworldz.com')"

          case "$status" in
            2??) ;;
            *)
              echo "::error::Hostinger DNS verification read failed with HTTP $status."
              exit 1
              ;;
          esac

          node <<'NODE'
          const fs = require('node:fs');
          const after = JSON.parse(fs.readFileSync(process.env.AFTER, 'utf8'));
          if (!Array.isArray(after)) throw new Error('Unexpected Hostinger DNS response.');

          const domain = 'oneworldz.com';
          const canonical = (value) => String(value || '').toLowerCase().replace(/\.$/, '');
          const relative = (name) => {
            const value = canonical(name);
            if (value === domain || value === '@') return '@';
            if (value.endsWith('.' + domain)) return value.slice(0, -(domain.length + 1));
            return value;
          };
          const unquote = (value) => {
            const text = String(value || '');
            return text.startsWith('"') && text.endsWith('"') ? text.slice(1, -1) : text;
          };
          const recordSet = (name, type, transform = (value) => value) => new Set(
            after
              .filter((entry) =>
                relative(entry.name) === name &&
                String(entry.type || '').toUpperCase() === type
              )
              .flatMap((entry) => Array.isArray(entry.records) ? entry.records : [])
              .map((record) => transform(record && record.content))
          );
          const exact = (actual, expected, label) => {
            const wanted = new Set(expected);
            if (actual.size !== wanted.size || [...wanted].some((value) => !actual.has(value))) {
              throw new Error(label + ' did not match the exact intended record set.');
            }
          };

          exact(recordSet('@', 'A'), ['162.159.143.30', '172.66.3.26'], 'Apex A');
          exact(recordSet('www', 'CNAME', canonical), ['custom-domains.chatgpt.site'], 'www CNAME');
          exact(
            recordSet('_openai-site-verification', 'TXT', unquote),
            ['openai-site-verification=UBrsIxE6I81zWVHMri0q6raWEjuTlg9crpLDhdTk-UY'],
            'Apex OpenAI validation'
          );
          exact(
            recordSet('_cf-custom-hostname', 'TXT', unquote),
            ['73b99df8-1ef2-439d-900c-dcdce18cf4b9'],
            'Apex provider validation'
          );
          exact(
            recordSet('_openai-site-verification.www', 'TXT', unquote),
            ['openai-site-verification=iNab7ynr0HmHYXlU5Misg1z_YyT4cYaIAWsVNWmXdYo'],
            'www OpenAI validation'
          );
          exact(
            recordSet('_cf-custom-hostname.www', 'TXT', unquote),
            ['65440d99-e622-428d-b034-5fd91a402228'],
            'www provider validation'
          );

          console.log('Hostinger authoritative zone matches all six intended record groups.');
          NODE

      - name: Roll back the old web route if verification fails
        if: ${{ failure() && steps.apply.outcome == 'success' }}
        shell: bash
        env:
          ROLLBACK: ${{ runner.temp }}/oneworldz-rollback-core.json
        run: |
          set -euo pipefail
          if [[ ! -s "$ROLLBACK" ]]; then
            echo '::error::Rollback payload is unavailable.'
            exit 1
          fi

          response="$RUNNER_TEMP/oneworldz-rollback-response.json"
          status="$(curl -sS --max-time 30 \
            -X PUT \
            -H "Authorization: Bearer $HOSTINGER_CONTROL_TOKEN" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/json' \
            --data-binary @"$ROLLBACK" \
            -o "$response" \
            -w '%{http_code}' \
            'https://developers.hostinger.com/api/dns/v1/zones/oneworldz.com')"

          case "$status" in
            2??) echo 'Old OneWorldz apex and www web records restored.' ;;
            *)
              echo "::error::Automatic DNS rollback failed with HTTP $status."
              head -c 1000 "$response" || true
              exit 1
              ;;
          esac

      - name: Retain the pre-change DNS snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneworldz-dns-before-cutover
          path: ${{ runner.temp }}/oneworldz-before.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish cutover result
        if: success()
        shell: bash
        run: |
          {
            echo '## OneWorldz DNS cutover'
            echo
            echo '- Hostinger preflight: passed'
            echo '- Apex A records: replaced with the two Sites targets'
            echo '- www CNAME: replaced with the Sites target'
            echo '- Apex and www validation TXT records: present'
            echo '- Unrelated DNS records: preserved'
            echo '- Authoritative Hostinger zone verification: passed'
          } >> "$GITHUB_STEP_SUMMARY"
