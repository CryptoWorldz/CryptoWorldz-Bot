name: Diagnose EthWorldz FTP Root

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/ethworldz-root.request'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ethworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      FTP_ACCOUNT_SCOPE: ${{ vars.FTP_ACCOUNT_SCOPE }}
      DEPLOY_GUARD: ${{ vars.DEPLOY_GUARD }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify approved read-only request
        shell: bash
        env:
          APPROVED_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          source_commit="$(sed -n 's/^source_commit=//p' diagnostics/ethworldz-root.request | tail -n1)"
          confirmation="$(sed -n 's/^confirmation=//p' diagnostics/ethworldz-root.request | tail -n1)"
          test "$source_commit" = "$APPROVED_BEFORE"
          test "$confirmation" = 'APPROVE READ ONLY DIAGNOSTIC'
          test "$FTP_ACCOUNT_SCOPE" = 'DOMAIN_ONLY'
          test "$DEPLOY_GUARD" = 'ETHWORLDZ.XYZ'
          test -n "$FTP_HOST"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"

      - name: Inspect public FTPS certificate identity without credentials
        shell: bash
        run: |
          set -euo pipefail
          host="${FTP_HOST#ftp://}"; host="${host#ftps://}"; host="${host%%/*}"
          if [[ "$host" != *:*:* && "$host" == *:* ]]; then host="${host%%:*}"; fi
          test "$host" = '145.223.108.40'
          echo "Reverse DNS: $(getent hosts "$host" | awk '{print $2}' | head -n1 || true)"
          timeout 20 openssl s_client -starttls ftp -connect "$host:$FTP_PORT" -showcerts </dev/null 2>/dev/null \
            | openssl x509 -noout -subject -issuer -ext subjectAltName

      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Check FTP roots without writing
        shell: bash
        run: |
          set -euo pipefail
          host="${FTP_HOST#ftp://}"
          host="${host#ftps://}"
          host="${host%%/*}"
          if [[ "$host" != *:*:* && "$host" == *:* ]]; then host="${host%%:*}"; fi
          test "$host" = '145.223.108.40'

          check_dir() {
            local dir="$1"
            set +e
            timeout 45 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" -e "set cmd:fail-exit yes; set net:max-retries 1; set net:timeout 15; set net:idle 15; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate no; cd \"$dir\"; bye"
            rc=$?
            set -e
            printf '%s exit=%s\n' "$dir" "$rc"
          }

          check_dir '/'
          check_dir '/public_html'
