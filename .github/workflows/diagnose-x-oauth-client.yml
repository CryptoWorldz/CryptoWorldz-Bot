name: Diagnose X OAuth Client Authentication

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-x-oauth-client.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
    steps:
      - name: Fetch protected runtime environment
        shell: python
        run: |
          import io, os
          from ftplib import FTP_TLS
          host=os.environ["FTP_HOST"].replace("ftps://","").replace("ftp://","").split("/")[0]
          if host.count(":")==1: host=host.split(":",1)[0]
          ftp=FTP_TLS(); ftp.connect(host,int(os.environ.get("FTP_PORT","21")),timeout=45)
          ftp.login(os.environ["FTP_USERNAME"],os.environ["FTP_PASSWORD"]); ftp.prot_p()
          buf=io.BytesIO()
          ftp.retrbinary("RETR /domains/cryptobotz.cryptoworldz.xyz/nodejs/.env",buf.write)
          ftp.quit()
          path=os.path.join(os.environ["RUNNER_TEMP"],"protected.env")
          open(path,"wb").write(buf.getvalue())
          print("PROTECTED_ENV_FETCH=PASS")

      - name: Probe X token endpoint authentication without real authorization code
        shell: python
        run: |
          import base64, json, os, re, urllib.parse, urllib.request, urllib.error

          env={}
          for raw in open(os.path.join(os.environ["RUNNER_TEMP"],"protected.env"),encoding="utf-8").read().splitlines():
              line=raw.strip()
              if not line or line.startswith("#") or "=" not in line: continue
              k,v=line.split("=",1)
              k=re.sub(r"^export\s+","",k).strip()
              v=v.strip()
              if (v.startswith('"') and v.endswith('"')) or (v.startswith("'") and v.endswith("'")): v=v[1:-1]
              env[k]=v

          cid=env.get("GRACE_X_CLIENT_ID","").strip()
          secret=env.get("GRACE_X_CLIENT_SECRET","").strip()
          redirect=env.get("GRACE_X_REDIRECT_URI","https://cryptobotz.cryptoworldz.xyz/grace/oauth/x/callback").strip()
          if not cid or not secret: raise SystemExit("X client credentials missing")
          print("X_CLIENT_ID_VALUE="+cid)
          print("X_CLIENT_ID_LENGTH="+str(len(cid)))
          print("X_CLIENT_SECRET_LENGTH="+str(len(secret)))
          print("::add-mask::"+secret)

          common={
              "code":"INTENTIONAL_DIAGNOSTIC_INVALID_CODE",
              "grant_type":"authorization_code",
              "redirect_uri":redirect,
              "code_verifier":"diagnostic-verifier-not-a-real-oauth-attempt"
          }

          def probe(label,body_map,headers):
              body=urllib.parse.urlencode(body_map).encode()
              req=urllib.request.Request("https://api.x.com/2/oauth2/token",data=body,headers=headers,method="POST")
              try:
                  with urllib.request.urlopen(req,timeout=30) as resp:
                      code=resp.status; payload=json.loads(resp.read().decode())
              except urllib.error.HTTPError as exc:
                  code=exc.code
                  try: payload=json.loads(exc.read().decode())
                  except Exception: payload={"error":"non_json_response"}
              safe={"http":code,"error":payload.get("error"),"error_description":payload.get("error_description"),"title":payload.get("title"),"detail":payload.get("detail")}
              print(label+"="+json.dumps(safe,separators=(",",":")))
              return safe

          raw_basic=base64.b64encode((cid+":"+secret).encode()).decode()
          raw=probe("X_AUTH_RAW_BASIC",common,{"Authorization":"Basic "+raw_basic,"Content-Type":"application/x-www-form-urlencoded"})

          encoded_pair=urllib.parse.quote_plus(cid,safe="")+":"+urllib.parse.quote_plus(secret,safe="")
          encoded_basic=base64.b64encode(encoded_pair.encode()).decode()
          enc=probe("X_AUTH_ENCODED_BASIC",common,{"Authorization":"Basic "+encoded_basic,"Content-Type":"application/x-www-form-urlencoded"})

          post=probe("X_AUTH_CLIENT_SECRET_POST",{**common,"client_id":cid,"client_secret":secret},{"Content-Type":"application/x-www-form-urlencoded"})

          def rejected(safe):
              text=" ".join(str(v or "") for v in safe.values()).lower()
              return "missing valid authorization header" in text or "invalid_client" in text or "unauthorized_client" in text

          print("X_AUTH_RAW_BASIC_ACCEPTED="+("NO" if rejected(raw) else "YES"))
          print("X_AUTH_ENCODED_BASIC_ACCEPTED="+("NO" if rejected(enc) else "YES"))
          print("X_AUTH_CLIENT_SECRET_POST_ACCEPTED="+("NO" if rejected(post) else "YES"))
          if rejected(raw) and rejected(enc) and rejected(post):
              raise SystemExit("ALL_X_CLIENT_AUTH_METHODS_REJECTED")
