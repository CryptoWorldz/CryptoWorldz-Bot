name: Audit WorldDexPush

on:
  pull_request:
    paths:
      - "worldzpad-mainnet/worlddexpush/**"
      - "scripts/audit_worlddexpush.mjs"
      - ".github/workflows/audit-worlddexpush.yml"
      - "worldzpad-mainnet/token-identity/**"
      - "launchpad.cryptoworldz.xyz/tokenlist.json"
      - "launchpad.cryptoworldz.xyz/wldz/**"
      - "launchpad.cryptoworldz.xyz/rviv/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Read Jupiter and DEX Screener status
        run: node scripts/audit_worlddexpush.mjs
      - name: Upload WorldDexPush status
        uses: actions/upload-artifact@v4
        with:
          name: worlddexpush-status
          path: artifacts/worlddexpush-status.json
          retention-days: 14
