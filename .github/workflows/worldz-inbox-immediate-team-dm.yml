name: Worldz Inbox Immediate Team DM

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/worldz-inbox-immediate-team-dm.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    name: Send immediate Worldz team DMs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN || secrets.ZED_BOT_TOKEN || secrets.CRYPTOWORLDZ_BOT_TOKEN }}
    steps:
      - name: Send Telegram DMs
        shell: python
        run: |
          import json, os, time, urllib.request, urllib.error

          token=str(os.environ.get("BOT_TOKEN","")).strip()
          if not token:
              raise SystemExit("BOT_TOKEN missing")
          print("::add-mask::"+token)

          recipients=[
              (5978625584,"Savage"),
              (5457233387,"SolMusic"),
          ]

          message=(
              "🌐 WORLDZ — A BETTER WORLD 🌏\n\n"
              "JayJayTeamDev is asking the core Worldz team to start actively helping test, share and build the new Worldz system.\n\n"
              "📥 WORLDZ INBOX\n"
              "Open ZED privately and use /inbox so we can test direct messaging and replies.\n"
              "https://cryptobotz.cryptoworldz.xyz/miniapp/#inbox\n\n"
              "💜 SUPPORT JAYJAYTEAMDEV\n"
              "https://donateworldz.com/jayjay-support/\n\n"
              "🚀 CREATE YOUR OWN CRYPTO TOKEN\n"
              "https://launchpad.cryptoworldz.xyz/create-your-own-money/\n\n"
              "🌍 WORLDZLAUNCHPAD\n"
              "https://launchpad.cryptoworldz.xyz/worldz-launch/\n\n"
              "🗳 WORLDZ PUBLIC VOICE\n"
              "A worldwide, non-binding space for people to document concerns, ideas and community priorities.\n"
              "https://cryptobotz.cryptoworldz.xyz/miniapp/#worldz-civic-votes\n\n"
              "Please jump in, test it and help us move Worldz forward. 🌐💜"
          )

          def send(chat_id,name):
              data=json.dumps({
                  "chat_id":chat_id,
                  "text":message,
                  "disable_web_page_preview":True
              },ensure_ascii=False).encode("utf-8")
              req=urllib.request.Request(
                  "https://api.telegram.org/bot"+token+"/sendMessage",
                  data=data,
                  headers={"content-type":"application/json"},
                  method="POST"
              )
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      out=json.loads(r.read().decode("utf-8"))
                  if out.get("ok") is True:
                      print(f"DM_ACCEPTED name={name} telegram_message_id={out.get('result',{}).get('message_id')}")
                      return True
                  print(f"DM_REJECTED name={name} reason={out.get('description','unknown')}")
                  return False
              except urllib.error.HTTPError as e:
                  body=e.read().decode("utf-8","replace")
                  try: reason=json.loads(body).get("description",body[:180])
                  except: reason=body[:180]
                  print(f"DM_REJECTED name={name} reason={reason}")
                  return False

          accepted=0
          for chat_id,name in recipients:
              if send(chat_id,name): accepted+=1
              time.sleep(2)

          print(f"DM_ACCEPTED_TOTAL={accepted}")
          print(f"DM_ATTEMPTED_TOTAL={len(recipients)}")
          if accepted==0:
              raise SystemExit("Telegram accepted no immediate team DMs")
