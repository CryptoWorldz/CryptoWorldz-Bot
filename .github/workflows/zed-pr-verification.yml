name: ZED PR verification

on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'public/**'
      - '.github/**'
      - 'package.json'
      - 'package-lock.json'
      - 'supabase/migrations/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zed-safe-checks:
    name: ZED safe checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Syntax checks
        run: npm run check
      - name: Command Centre regression tests
        run: node --test test/command-centre-static.test.js test/command-centre.test.js
      - name: WorldPing and build-poll regression tests
        run: node --test test/worldping.test.js test/zed-hostinger-build-poll-timeouts.test.js
      - name: Full Node test suite
        run: npm test

  worldz-wallet-apk:
    name: Worldz Wallet APK compilation
    if: github.event_name == 'pull_request' && github.head_ref == 'feat/worldz-wallet-android-beta-apk'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/worldz-wallet-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile Android APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Generate SHA256
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: worldz-wallet-beta-apk
          path: |
            apps/worldz-wallet-android/app/build/outputs/apk/debug/app-debug.apk
            apps/worldz-wallet-android/app/build/outputs/apk/debug/SHA256SUMS.txt
