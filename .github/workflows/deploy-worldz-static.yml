name: Deploy Worldz Static Site

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-worldz-static.yml'
      - 'apps/cryptoworldz-web-core/**'
      - 'tools/evaluate-web-core.mjs'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - 'deployments/worldz-static.request'
  workflow_dispatch:
    inputs:
      target:
        description: Static site target
        required: true
        type: choice
        options:
          - test-oneworldz
          - purplediamondcrew
          - solworldz
          - cryptoworldz
          - oneworldz
          - impactbased
          - law-oneworldz
          - learn-oneworldz
          - ethworldz
          - baseworldz
          - bnbworldz
          - xrpworldz
          - suiworldz
          - hyperworldz
          - robinworldz
          - bitcoinworldz
          - hodlerworldz
      confirmation:
        description: Exact production confirmation
        required: true
        default: CANCEL
        type: choice
        options:
          - CANCEL
          - APPROVE TOTAL DEPLOYMENT

permissions:
  contents: read

concurrency:
  group: worldz-static-${{ github.event.inputs.target || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve guarded target
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      environment: ${{ steps.resolve.outputs.environment }}
      live_url: ${{ steps.resolve.outputs.live_url }}
      guard: ${{ steps.resolve.outputs.guard }}
      expected_script: ${{ steps.resolve.outputs.expected_script }}
      deploy: ${{ steps.resolve.outputs.deploy }}
    steps:
      - name: Check out request
        uses: actions/checkout@v4

      - id: resolve
        name: Validate deployment request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.target }}
          INPUT_CONFIRMATION: ${{ inputs.confirmation }}
          APPROVED_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == 'pull_request' ]]; then
            target='validation-only'
            confirmation='CANCEL'
          elif [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            target="$INPUT_TARGET"
            confirmation="$INPUT_CONFIRMATION"
          else
            test -f deployments/worldz-static.request
            target="$(sed -n 's/^target=//p' deployments/worldz-static.request | tail -n1)"
            confirmation="$(sed -n 's/^confirmation=//p' deployments/worldz-static.request | tail -n1)"
            source_commit="$(sed -n 's/^source_commit=//p' deployments/worldz-static.request | tail -n1)"
            test -n "$source_commit"
            test -n "$APPROVED_BEFORE"
            test "$source_commit" = "$APPROVED_BEFORE"
          fi

          case "$target" in
            validation-only) environment='test-preproduction'; live_url=''; guard='VALIDATION'; expected_script='assets/app.js' ;;
            test-oneworldz) environment='test-preproduction'; live_url='https://test.oneworldz.com'; guard='TEST.ONEWORLDZ.COM'; expected_script='assets/app.js' ;;
            purplediamondcrew) environment='purplediamondcrew-production'; live_url='https://purplediamondcrew.com'; guard='PURPLEDIAMONDCREW.COM'; expected_script='assets/pdc-site.js' ;;
            solworldz) environment='solworldz-production'; live_url='https://solworldz.xyz'; guard='SOLWORLDZ.XYZ'; expected_script='assets/app.js' ;;
            cryptoworldz) environment='cryptoworldz-production'; live_url='https://cryptoworldz.xyz'; guard='CRYPTOWORLDZ.XYZ'; expected_script='assets/app.js' ;;
            oneworldz) environment='oneworldz-production'; live_url='https://oneworldz.com'; guard='ONEWORLDZ.COM'; expected_script='assets/oneworldz.js' ;;
            impactbased) environment='impactbased-production'; live_url='https://impactbased.oneworldz.com'; guard='IMPACTBASED.ONEWORLDZ.COM'; expected_script='assets/app.js' ;;
            law-oneworldz) environment='law-oneworldz-production'; live_url='https://law.oneworldz.com'; guard='LAW.ONEWORLDZ.COM'; expected_script='assets/app.js' ;;
            learn-oneworldz) environment='learn-oneworldz-production'; live_url='https://learn.oneworldz.com'; guard='LEARN.ONEWORLDZ.COM'; expected_script='assets/app.js' ;;
            ethworldz) environment='ethworldz-production'; live_url='https://ethworldz.xyz'; guard='ETHWORLDZ.XYZ'; expected_script='assets/coming-soon.js' ;;
            baseworldz) environment='baseworldz-production'; live_url='https://baseworldz.xyz'; guard='BASEWORLDZ.XYZ'; expected_script='assets/coming-soon.js' ;;
            bnbworldz) environment='bnbworldz-production'; live_url='https://bnbworldz.xyz'; guard='BNBWORLDZ.XYZ'; expected_script='assets/coming-soon.js' ;;
            xrpworldz) environment='xrpworldz-production'; live_url='https://xrpworldz.xyz'; guard='XRPWORLDZ.XYZ'; expected_script='assets/coming-soon.js' ;;
            suiworldz) environment='suiworldz-production'; live_url='https://suiworldz.xyz'; guard='SUIWORLDZ.XYZ'; expected_script='assets/coming-soon.js' ;;
            hyperworldz) environment='hyperworldz-production'; live_url='https://hyperworldz.xyz'; guard='HYPERWORLDZ.XYZ'; expected_script='assets/coming-soon.js' ;;
            robinworldz) environment='robinworldz-production'; live_url='https://robinworldz.xyz'; guard='ROBINWORLDZ.XYZ'; expected_script='assets/coming-soon.js' ;;
            bitcoinworldz) environment='bitcoinworldz-production'; live_url='https://bitcoinworldz.xyz'; guard='BITCOINWORLDZ.XYZ'; expected_script='assets/coming-soon.js' ;;
            hodlerworldz) environment='hodlerworldz-production'; live_url='https://hodlerworldz.xyz'; guard='HODLERWORLDZ.XYZ'; expected_script='assets/coming-soon.js' ;;
            *) echo 'Unsupported deployment target.' >&2; exit 1 ;;
          esac

          deploy='false'
          if [[ "$EVENT_NAME" != 'pull_request' && "$confirmation" == 'APPROVE TOTAL DEPLOYMENT' ]]; then
            deploy='true'
          fi

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "environment=$environment" >> "$GITHUB_OUTPUT"
          echo "live_url=$live_url" >> "$GITHUB_OUTPUT"
          echo "guard=$guard" >> "$GITHUB_OUTPUT"
          echo "expected_script=$expected_script" >> "$GITHUB_OUTPUT"
          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"

  validate:
    name: Validate shared Worldz package
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete repository verification
        run: npm run verify

      - name: Package reviewed static files
        shell: bash
        run: |
          set -euo pipefail
          cd apps/cryptoworldz-web-core
          zip -qr ../../worldz-static-${GITHUB_SHA}.zip . -x '*.DS_Store' '*.md' '.gitignore' 'docs/*'
          cd ../..
          sha256sum worldz-static-${GITHUB_SHA}.zip > worldz-static-${GITHUB_SHA}.sha256

      - name: Preserve reviewed package
        uses: actions/upload-artifact@v4
        with:
          name: worldz-static-${{ needs.prepare.outputs.target }}
          path: |
            worldz-static-${{ github.sha }}.zip
            worldz-static-${{ github.sha }}.sha256
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy guarded static target
    needs: [prepare, validate]
    if: needs.prepare.outputs.deploy == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ needs.prepare.outputs.environment }}
      url: ${{ needs.prepare.outputs.live_url }}
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || '/' }}
      FTP_ACCOUNT_SCOPE: ${{ vars.FTP_ACCOUNT_SCOPE }}
      DEPLOY_GUARD: ${{ vars.DEPLOY_GUARD }}
      EXPECTED_GUARD: ${{ needs.prepare.outputs.guard }}
      LIVE_URL: ${{ needs.prepare.outputs.live_url }}
      EXPECTED_SCRIPT: ${{ needs.prepare.outputs.expected_script }}
    steps:
      - name: Check out approved main commit
        uses: actions/checkout@v4

      - name: Verify domain-restricted environment
        shell: bash
        run: |
          set -euo pipefail
          test "$FTP_ACCOUNT_SCOPE" = 'DOMAIN_ONLY'
          test "$DEPLOY_GUARD" = "$EXPECTED_GUARD"
          test "$FTP_SERVER_DIR" = '/'
          test -n "$FTP_HOST"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          echo "::add-mask::$FTP_USERNAME"

      - name: Install secure FTP client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp zip

      - name: Back up current target
        shell: bash
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/worldz-backup"
          mkdir -p "$backup"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          cd "$FTP_SERVER_DIR"
          lcd "$backup"
          mirror --parallel=3 --exclude-glob '.well-known/**' --exclude-glob '.env*' --exclude-glob '*.log' --exclude-glob 'cgi-bin/**' .
          bye
          LFTP
          cd "$backup"
          zip -qr "$RUNNER_TEMP/worldz-backup-${GITHUB_RUN_ID}.zip" .

      - name: Preserve rollback package
        uses: actions/upload-artifact@v4
        with:
          name: worldz-predeploy-backup-${{ needs.prepare.outputs.target }}-${{ github.run_id }}
          path: ${{ runner.temp }}/worldz-backup-${{ github.run_id }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload approved static web core
        shell: bash
        run: |
          set -euo pipefail
          local_root="$GITHUB_WORKSPACE/apps/cryptoworldz-web-core"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          cd "$FTP_SERVER_DIR"
          lcd "$local_root"
          mirror --reverse --overwrite --parallel=4 --exclude-glob '.git*' --exclude-glob '*.md' --exclude-glob 'docs/**' .
          bye
          LFTP

      - name: Verify live target
        shell: bash
        run: |
          set -euo pipefail
          cache="release=${GITHUB_SHA}-${GITHUB_RUN_ID}"
          curl -fsSL --retry 6 --retry-delay 5 "$LIVE_URL/?$cache" -o "$RUNNER_TEMP/index.html"
          curl -fsSL --retry 6 --retry-delay 5 "$LIVE_URL/$EXPECTED_SCRIPT?$cache" -o "$RUNNER_TEMP/expected.js"
          grep -Fq './config/worlds.js' "$RUNNER_TEMP/index.html"
          test -s "$RUNNER_TEMP/expected.js"

      - name: Restore previous site if verification fails
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/worldz-backup"
          test -d "$backup"
          lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          cd "$FTP_SERVER_DIR"
          lcd "$backup"
          mirror --reverse --overwrite --parallel=3 .
          bye
          LFTP
          echo 'Previous target restored after failed verification.' >&2

      - name: Publish deployment summary
        if: always()
        shell: bash
        run: |
          {
            echo '## Worldz Static Deployment'
            echo
            echo "- Target: ${{ needs.prepare.outputs.target }}"
            echo "- Environment: ${{ needs.prepare.outputs.environment }}"
            echo "- Live URL: $LIVE_URL"
            echo "- Source commit: $GITHUB_SHA"
            echo '- Hostinger Horizons credits: 0'
            echo '- Zed Node service: untouched'
            echo '- Auto service: untouched'
          } >> "$GITHUB_STEP_SUMMARY"
