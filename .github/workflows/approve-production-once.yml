name: JayJay Environment Block Inspector — One Time

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/approve-production-once.yml"

permissions:
  actions: read
  statuses: write
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      TARGET_SHA: 4f0aebfa4e9e3e5620692db85eedfcacad61ebb1
      TARGET_WORKFLOW: website-images-direct.yml
    steps:
      - name: Publish exact blocked run URL
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']; target=os.environ['TARGET_SHA']; wf=os.environ['TARGET_WORKFLOW']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28','User-Agent':'jayjay-env-inspector'}
          def api(method,path,payload=None):
              data=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request('https://api.github.com'+path,data=data,method=method,headers=headers)
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read(); return json.loads(raw.decode()) if raw else None
          runs=api('GET',f'/repos/{repo}/actions/workflows/{wf}/runs?branch=main&per_page=50').get('workflow_runs',[])
          exact=[r for r in runs if r.get('head_sha')==target]
          exact.sort(key=lambda r:r.get('run_number',0),reverse=True)
          if not exact:
              raise SystemExit('NO_EXACT_ENVIRONMENT_RUN')
          run=exact[0]
          state='success' if run.get('conclusion')=='success' else 'failure' if run.get('status')=='completed' else 'pending'
          api('POST',f'/repos/{repo}/statuses/{target}',{'state':state,'context':'jayjay/environment-block','description':f"run {run['id']} status={run.get('status')} conclusion={run.get('conclusion')}",'target_url':run.get('html_url')})
          print(json.dumps({'id':run['id'],'status':run.get('status'),'conclusion':run.get('conclusion'),'url':run.get('html_url')}))
          PY
