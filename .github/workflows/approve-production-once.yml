name: JayJay Website Deploy Watch — One Time

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/approve-production-once.yml"

permissions:
  actions: read
  statuses: write
  contents: read

jobs:
  watch:
    name: WATCH EXACT WEBSITE VISUAL RELEASE
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_SHA: e64cf95f0f561f7ad5f05e0cb9c03839e059ebeb
      TARGET_WORKFLOW: website-images-direct.yml
    steps:
      - name: Watch exact deployment and publish status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import time
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          target_sha = os.environ["TARGET_SHA"]
          workflow = os.environ["TARGET_WORKFLOW"]
          api_root = "https://api.github.com"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "jayjay-website-deploy-watch",
          }

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(api_root + path, data=data, method=method, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  return json.loads(raw.decode("utf-8")) if raw else None

          def publish(state, description, target_url=None):
              body = {
                  "state": state,
                  "context": "jayjay/website-deploy",
                  "description": description[:140],
              }
              if target_url:
                  body["target_url"] = target_url
              api("POST", f"/repos/{repo}/statuses/{target_sha}", body)

          run = None
          for attempt in range(30):
              runs = api("GET", f"/repos/{repo}/actions/workflows/{workflow}/runs?branch=main&per_page=50")
              exact = [r for r in runs.get("workflow_runs", []) if r.get("head_sha") == target_sha]
              exact.sort(key=lambda r: r.get("run_number", 0), reverse=True)
              if exact:
                  run = exact[0]
                  break
              publish("pending", f"Waiting for workflow run for {target_sha[:10]}")
              time.sleep(5)

          if not run:
              publish("failure", f"No workflow run created for {target_sha[:10]}")
              raise SystemExit(1)

          run_id = run["id"]
          run_url = run.get("html_url")
          print(f"WATCHING_RUN_ID={run_id}")

          for attempt in range(100):
              runs = api("GET", f"/repos/{repo}/actions/workflows/{workflow}/runs?branch=main&per_page=50")
              exact = [r for r in runs.get("workflow_runs", []) if r.get("id") == run_id]
              if not exact:
                  publish("failure", f"Run {run_id} disappeared", run_url)
                  raise SystemExit(1)
              run = exact[0]
              state = run.get("status") or "unknown"
              conclusion = run.get("conclusion")
              if state == "completed":
                  if conclusion == "success":
                      publish("success", f"Website deploy PASS run {run_id}", run_url)
                      print(f"WEBSITE_DEPLOY=PASS run_id={run_id}")
                      raise SystemExit(0)
                  publish("failure", f"Website deploy {conclusion or 'failed'} run {run_id}", run_url)
                  print(f"WEBSITE_DEPLOY={conclusion or 'failure'} run_id={run_id}")
                  raise SystemExit(1)
              publish("pending", f"Website deploy {state} run {run_id}", run_url)
              time.sleep(10)

          publish("failure", f"Website deploy timed out run {run_id}", run_url)
          raise SystemExit(1)
          PY
