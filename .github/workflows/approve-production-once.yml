name: JayJay Production Approval — One Time

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/approve-production-once.yml"

permissions:
  actions: read
  deployments: write
  statuses: write
  contents: read

jobs:
  approve:
    name: APPROVE EXISTING WEBSITE PRODUCTION DEPLOYMENT
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TARGET_SHA: 4f0aebfa4e9e3e5620692db85eedfcacad61ebb1
      TARGET_WORKFLOW: website-images-direct.yml
      TARGET_ENVIRONMENT: cryptoworldz-production
    steps:
      - name: Approve exact JayJay-authorized pending deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import time
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          helper_sha = os.environ["GITHUB_SHA"]
          target_sha = os.environ["TARGET_SHA"]
          workflow = os.environ["TARGET_WORKFLOW"]
          environment_name = os.environ["TARGET_ENVIRONMENT"]
          api_root = "https://api.github.com"

          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "jayjay-production-approval",
          }

          def api(method, path, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(api_root + path, data=data, method=method, headers=headers)
              with urllib.request.urlopen(req, timeout=30) as response:
                  raw = response.read()
                  return json.loads(raw.decode("utf-8")) if raw else None

          def status(state, description):
              try:
                  api("POST", f"/repos/{repo}/statuses/{helper_sha}", {
                      "state": state,
                      "context": "jayjay/production-approval",
                      "description": description[:140],
                  })
              except Exception as exc:
                  print(f"::warning::Could not publish status: {exc}")

          status("pending", f"Seeking {environment_name} approval for {target_sha[:10]}")

          try:
              approved = None
              for attempt in range(15):
                  runs = api("GET", f"/repos/{repo}/actions/workflows/{workflow}/runs?branch=main&per_page=50")
                  exact = [
                      run for run in runs.get("workflow_runs", [])
                      if run.get("head_sha") == target_sha and run.get("conclusion") is None
                  ]
                  exact.sort(key=lambda run: run.get("run_number", 0), reverse=True)

                  for run in exact:
                      run_id = run["id"]
                      pending = api("GET", f"/repos/{repo}/actions/runs/{run_id}/pending_deployments") or []
                      environment_ids = [
                          item["environment"]["id"]
                          for item in pending
                          if item.get("environment", {}).get("name") == environment_name
                      ]
                      if not environment_ids:
                          continue

                      api(
                          "POST",
                          f"/repos/{repo}/actions/runs/{run_id}/pending_deployments",
                          {
                              "environment_ids": environment_ids,
                              "state": "approved",
                              "comment": "Approved by JayJayTeamDev via explicit full API authority in ChatGPT.",
                          },
                      )
                      approved = run_id
                      print(f"PRODUCTION_DEPLOYMENT_APPROVED run_id={run_id}")
                      break

                  if approved:
                      break
                  print(f"Waiting for exact pending deployment (attempt {attempt + 1}/15)")
                  time.sleep(10)

              if not approved:
                  raise RuntimeError(f"No pending {environment_name} deployment found for {target_sha}")

              status("success", f"Approved production run {approved} for {target_sha[:10]}")
          except Exception as exc:
              message = str(exc)
              print(f"::error::{message}")
              status("failure", message)
              raise
          PY
