name: Verify live ZED service readiness
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-zed-live-readiness.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: cryptoworldz-production
    env:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN || secrets.ZED_BOT_TOKEN || secrets.CRYPTOWORLDZ_BOT_TOKEN }}
      DIPSHIT_BOT_TOKEN: ${{ secrets.DIPSHIT_BOT_TOKEN }}
    steps:
      - name: Verify current runtime, authentication and Telegram delivery state
        shell: python
        run: |
          import json, os, time, urllib.request, urllib.error
          base="https://cryptobotz.cryptoworldz.xyz"
          started=int(time.time())
          def request(url, payload=None):
              body=None if payload is None else json.dumps(payload).encode()
              req=urllib.request.Request(url,data=body,headers={"Content-Type":"application/json","Cache-Control":"no-cache","User-Agent":"Worldz-Live-Readiness/1.0"})
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      return r.status,r.read().decode("utf-8","replace")
              except urllib.error.HTTPError as e:
                  return e.code,e.read().decode("utf-8","replace")
              except Exception:
                  raise SystemExit("Network request failed; credential-bearing URL withheld")
          def require(ok,label):
              if not ok: raise SystemExit(label+"=FAIL")
              print(label+"=PASS",flush=True)
          status,body=request(base+"/health")
          health=json.loads(body)
          require(status==200 and health.get("ok") is True and health.get("ready") is True and health.get("service")=="CryptoWorldz Zed Bot","FULL_ZED_RUNTIME")
          status,body=request(base+"/miniapp/")
          require(status==200 and "Command Centre" in body,"COMMAND_CENTRE_UI")
          for path in ["/api/mini/bootstrap","/api/mini/auto/status","/api/mini/inbox"]:
              status,_=request(base+path)
              require(status==401,"AUTH_REQUIRED "+path)
          status,body=request(base+"/grace/health")
          require(status==200 and json.loads(body).get("ok") is True,"GRACE_HEALTH")
          for label,key,path in [("ZED","BOT_TOKEN","/telegram-webhook"),("DIPSHIT","DIPSHIT_BOT_TOKEN","/dipshit-telegram-webhook")]:
              token=os.environ.get(key,"").strip()
              require(bool(token),label+"_TOKEN_PRESENT")
              print("::add-mask::"+token)
              api="https://api.telegram.org/bot"+token+"/"
              status,body=request(api+"getMe")
              require(status==200 and json.loads(body).get("ok") is True,label+"_TELEGRAM_IDENTITY")
              status,_=request(base+path,{"update_id":0})
              require(status==401,label+"_WEBHOOK_AUTH")
              for attempt in range(3):
                  status,body=request(api+"getWebhookInfo")
                  info=json.loads(body)
                  require(status==200 and info.get("ok") is True,label+"_WEBHOOK_INFO")
                  hook=info["result"]
                  require(hook.get("url")==base+path,label+"_WEBHOOK_URL")
                  pending=int(hook.get("pending_update_count") or 0)
                  if pending==0: break
                  print(label+"_PENDING="+str(pending),flush=True)
                  time.sleep(10)
              require(pending==0,label+"_BACKLOG_EMPTY")
              error_at=int(hook.get("last_error_date") or 0)
              if hook.get("last_error_message"):
                  require(error_at>0 and error_at<started,label+"_NO_NEW_DELIVERY_ERROR")
                  print(label+"_HISTORICAL_DELIVERY_ERROR_RETAINED age_seconds="+str(started-error_at))
              else:
                  print(label+"_DELIVERY_ERROR_NONE")
          print("LIVE_SERVICE_READINESS=PASS")
          print("REAL_USER_COMMAND_REPLY=UNVERIFIED: this read-only check sends no user messages")
