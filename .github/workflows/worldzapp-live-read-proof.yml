name: WorldzApp Live Read Proof

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/worldz-app/**'
      - 'tools/verify-worldzapp-live-reads.js'
      - 'launchpad.cryptoworldz.xyz/worldz-app/core/provider-bindings.json'
      - 'test/worldz-app-provider-bindings.test.js'
      - '.github/workflows/worldzapp-live-read-proof.yml'

permissions:
  contents: read

jobs:
  public-read-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WORLDZAPP_ALLOW_PUBLIC_VERIFY: '1'
      WORLDZAPP_SOLANA_VERIFY_ADDRESS: 'Fap54GTCo4ZopkwmHtbSUJZTsjTybftJfN9sPG3MHp4u'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check WorldzApp live-read verifier
        run: node --check tools/verify-worldzapp-live-reads.js
      - name: Run WorldzApp public live-read proof
        run: npm run verify:worldzapp:reads
