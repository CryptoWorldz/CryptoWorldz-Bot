name: Diagnose OneWorldz Live Root

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-oneworldz-live-root.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: oneworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || '/' }}
      LIVE_URL: https://oneworldz.com
      HOSTINGER_LOCKED_IP: '145.223.108.40'
      HOSTINGER_TLS_ALIAS: 'oneworldz-root-proof.hstgr.io'
    steps:
      - name: Install FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Compare FTP root index with public homepage
        shell: bash
        run: |
          set -euo pipefail
          [[ "$FTP_SERVER_DIR" == '/' || "$FTP_SERVER_DIR" == '/public_html' ]]
          echo "::add-mask::$FTP_USERNAME"; echo "::add-mask::$FTP_PASSWORD"; echo "::add-mask::$FTP_HOST"
          host="${FTP_HOST#ftp://}"; host="${host#ftps://}"; host="${host%%/*}"; host="${host%%:*}"
          if [[ "$host" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            [[ "$host" == "$HOSTINGER_LOCKED_IP" ]]
            echo "$HOSTINGER_LOCKED_IP $HOSTINGER_TLS_ALIAS" | sudo tee -a /etc/hosts >/dev/null
            connect="$HOSTINGER_TLS_ALIAS"
          else
            connect="$host"
          fi
          ftp_index="$RUNNER_TEMP/ftp-index.html"
          live_index="$RUNNER_TEMP/live-index.html"
          headers="$RUNNER_TEMP/live.headers"
          timeout 60 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$connect" -e "set cmd:fail-exit yes; set net:max-retries 1; set net:timeout 20; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname yes; cd '$FTP_SERVER_DIR'; get index.html -o '$ftp_index'; bye"
          test -s "$ftp_index"
          code="$(curl -4 -L -sS -D "$headers" -o "$live_index" -w '%{http_code}' -H 'Cache-Control: no-cache, no-store, must-revalidate' --max-time 40 "$LIVE_URL/?root-proof=${GITHUB_RUN_ID}")"
          echo "public_home_status=$code"
          test "$code" = '200'
          test -s "$live_index"
          ftp_sha="$(sha256sum "$ftp_index"|awk '{print $1}')"
          live_sha="$(sha256sum "$live_index"|awk '{print $1}')"
          if [[ "$ftp_sha" == "$live_sha" ]]; then
            echo 'ONEWORLDZ_ROOT_MATCH=PASS'
          else
            echo 'ONEWORLDZ_ROOT_MATCH=FAIL'
            echo "ftp_index_bytes=$(wc -c < "$ftp_index")"
            echo "live_index_bytes=$(wc -c < "$live_index")"
            echo 'public_headers:'
            grep -Ei '^(server:|content-type:|x-hcdn-cache-status:|cache-control:|location:)' "$headers" || true
            exit 1
          fi

      - name: Probe public static image status only
        if: always()
        shell: bash
        run: |
          set +e
          code="$(curl -4 -L -sS -o "$RUNNER_TEMP/image-body" -w '%{http_code}' -H 'Cache-Control: no-cache' --max-time 30 "$LIVE_URL/assets/worldz-master/oneworldz/oneworldz-master.png?root-proof=${GITHUB_RUN_ID}")"
          echo "public_image_status=$code"
          if [[ -s "$RUNNER_TEMP/image-body" ]]; then
            echo "public_image_response_bytes=$(wc -c < "$RUNNER_TEMP/image-body")"
            file -b "$RUNNER_TEMP/image-body" || true
          fi
          exit 0
