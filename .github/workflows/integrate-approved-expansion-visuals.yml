name: Integrate Approved Expansion Visuals

on:
  workflow_dispatch:
  push:
    branches:
      - build/oneworldz-19-destination-upgrade
    paths:
      - deployments/oneworldz-19-visual-integrate.request

permissions:
  contents: write

concurrency:
  group: oneworldz-approved-visual-integration
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact upgrade branch
        uses: actions/checkout@v4
        with:
          ref: build/oneworldz-19-destination-upgrade
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Materialize the three user-approved responsive visuals
        run: node apps/oneworldz-ecosystem-release/scripts/integrate-approved-expansion-visuals.mjs

      - name: Build complete 19-destination ecosystem release
        working-directory: apps/oneworldz-ecosystem-release
        run: npm run build

      - name: Verify exact architecture and approved artwork references
        shell: bash
        run: |
          set -euo pipefail
          cd apps/oneworldz-ecosystem-release
          node --test test/*.test.mjs
          test -f dist/ecosystem/foodworldz/index.html
          test -f dist/ecosystem/donateworldz/index.html
          test -f dist/ecosystem/hodlergalaxy/index.html
          ! grep -Rni --include='*.html' 'solworld\.fun' dist/ecosystem
          grep -q 'desktop/expansion/foodworldz-hero.avif' expansion-pages.mjs
          grep -q 'desktop/expansion/donateworldz-hero.avif' expansion-pages.mjs
          grep -q 'desktop/expansion/hodlergalaxy-hero.avif' expansion-pages.mjs
          grep -q 'foodworldz-hero.avif' dist/ecosystem/foodworldz/index.html
          grep -q 'donateworldz-hero.avif' dist/ecosystem/donateworldz/index.html
          grep -q 'hodlergalaxy-hero.avif' dist/ecosystem/hodlergalaxy/index.html

      - name: Commit the locked approved visual materialization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "OneWorldz Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            apps/oneworldz-ecosystem-release/source/approved-visuals/approved-visuals.lock.json \
            apps/oneworldz-ecosystem-release/source/assets/desktop/expansion \
            apps/oneworldz-ecosystem-release/source/assets/mobile/expansion \
            apps/oneworldz-ecosystem-release/expansion-pages.mjs
          if git diff --cached --quiet; then
            echo "Approved visuals are already materialized and locked."
            exit 0
          fi
          git commit -m "[visual-integration] Materialize approved Food Donate and HodlerGalaxy visuals"
          git push origin HEAD:build/oneworldz-19-destination-upgrade
