name: CryptoWorldz Hostinger Node Environment Audit V4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hostinger-node-build-env-audit-v4.yml"

permissions:
  contents: write

env:
  CRYPTO_DOMAIN: cryptoworldz.xyz
  ZED_DOMAIN: cryptobotz.cryptoworldz.xyz

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/publish-progress.sh HOSTINGER_NODE_ENV_AUDIT STARTED
      - run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq lftp jq
      - name: Read-only managed Node audit
        shell: bash
        run: |
          set -euo pipefail
          for v in "$FTP_HOST" "$FTP_USERNAME" "$FTP_PASSWORD" "$HOSTINGER_API_TOKEN"; do [ -z "$v" ] || echo "::add-mask::$v"; done
          curl --fail --silent --show-error --location -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' 'https://developers.hostinger.com/api/hosting/v1/websites?per_page=100' -o "$RUNNER_TEMP/websites.json"
          : > "$RUNNER_TEMP/accounts.tsv"
          for domain in "$CRYPTO_DOMAIN" "$ZED_DOMAIN"; do jq -r --arg d "$domain" '.data[] | select((.domain|ascii_downcase)==($d|ascii_downcase)) | [.domain,.username] | @tsv' "$RUNNER_TEMP/websites.json" >> "$RUNNER_TEMP/accounts.tsv"; done
          while IFS=$'\t' read -r domain username; do
            [ -n "$domain" ] || continue
            echo "::add-mask::$username"
            denc="$(DOMAIN="$domain" node -p 'encodeURIComponent(process.env.DOMAIN)')"
            uenc="$(USERNAME="$username" node -p 'encodeURIComponent(process.env.USERNAME)')"
            base="https://developers.hostinger.com/api/hosting/v1/accounts/${uenc}/websites/${denc}/nodejs"
            curl --fail --silent --show-error --location -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "$base/builds?per_page=25" -o "$RUNNER_TEMP/builds.json"
            count="$(jq '.data|length' "$RUNNER_TEMP/builds.json")"
            state="$(jq -r '.data[0].state // "unknown"' "$RUNNER_TEMP/builds.json")"
            uuid="$(jq -r '.data[0].uuid // empty' "$RUNNER_TEMP/builds.json")"
            echo "NODE_BUILD_COUNT $domain=$count"
            echo "NODE_LATEST_STATE $domain=$state"
            if [ -n "$uuid" ]; then
              curl --silent --show-error --location -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "$base/builds/$uuid/logs" -o "$RUNNER_TEMP/logs.json" || true
              for needle in BOT_TOKEN TELEGRAM_TOKEN SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY SUPABASE_ANON_KEY OPENAI_API_KEY HOSTINGER_API_TOKEN ADMIN_API_TOKEN HUB_API_SECRET '.env' nodejs hbuilds cryptoworldz.xyz cryptobotz.cryptoworldz.xyz; do
                if grep -Fqi -- "$needle" "$RUNNER_TEMP/logs.json" 2>/dev/null; then result=YES; else result=NO; fi
                echo "BUILD_LOG_MENTIONS $domain $needle=$result"
              done
            fi
          done < "$RUNNER_TEMP/accounts.tsv"
          raw_host="$(printf '%s' "$FTP_HOST" | sed -e 's#^ftp://##' -e 's#^ftps://##' -e 's#/.*$##')"
          if [[ "$raw_host" != *:*:* && "$raw_host" == *:* ]]; then raw_host="${raw_host%%:*}"; fi
          printf '%s\n' 'set cmd:fail-exit false' 'set net:max-retries 2' 'set net:timeout 25' 'set ftp:ssl-force true' 'set ftp:ssl-protect-data true' 'set ssl:verify-certificate true' 'set ssl:check-hostname false' 'cls -la /domains/cryptoworldz.xyz/hbuilds' 'cls -la /domains/cryptobotz.cryptoworldz.xyz/hbuilds' 'bye' > "$RUNNER_TEMP/hbuilds.lftp"
          timeout 180 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/hbuilds.lftp" "$raw_host" || true
          echo 'CRYPTOWORLDZ_HOSTINGER_NODE_ENV_AUDIT=PASS_READ_ONLY'
      - if: success()
        run: bash .github/publish-progress.sh HOSTINGER_NODE_ENV_AUDIT PASS
      - if: failure()
        run: bash .github/publish-progress.sh HOSTINGER_NODE_ENV_AUDIT FAIL
