name: Verify Complete Production on Slim Runner

# Registered production certification workflow. Updating this marker triggers an independent run.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-complete-slim.yml'
      - 'index.js'
      - 'auto-server.js'
      - 'src/**'
      - 'test/**'
      - 'tools/**'
      - 'apps/cryptoworldz-web-core/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: complete-production-slim-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Zed Grace Auto Database and Worldz Sites
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Check out production source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete verification
        run: npm run verify

      - name: Verify required production assets and migrations
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/cryptoworldz-web-core/assets/images/oneworldz-hero.webp
          test -s apps/cryptoworldz-web-core/assets/images/oneworldz-impact-mosaic.webp
          test -s apps/cryptoworldz-web-core/assets/worldz-imagery.js
          test -s apps/cryptoworldz-web-core/assets/jayjayteamdev.js
          test -s apps/cryptoworldz-web-core/assets/pdc-asset.js
          test -s supabase/migrations/20260806194900_restore_server_access_all_command_tables.sql
          test -s supabase/migrations/20260806203000_lock_sensitive_server_functions.sql
          test -s supabase/migrations/20260806204500_add_missing_foreign_key_indexes.sql
          test -s supabase/migrations/20260806205000_align_owner_investment_weekly_cap.sql
          test -s supabase/migrations/20260806210000_remove_accidental_bot_legend_registration.sql
          grep -Fq 'Grace X Confidential OAuth 2026-08-07.2' src/grace/oauth-telegram.js
          grep -Fq 'purplediamondcrew.com' src/pdc-host.js
          grep -Fq 'oneworldz.com' src/pdc-host.js
          grep -Fq '365%' apps/cryptoworldz-web-core/assets/jayjayteamdev.js

      - name: Publish certification summary
        shell: bash
        run: |
          {
            echo '## Complete Production Verification'
            echo
            echo "- Commit: $GITHUB_SHA"
            echo '- Zed: verified'
            echo '- Grace: verified'
            echo '- Auto safe lock: verified'
            echo '- Database migrations: verified'
            echo '- Worldz visuals and routes: verified'
          } >> "$GITHUB_STEP_SUMMARY"
