name: WorldzPad WLDZ Execution Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worldzpad-devnet/**'
      - '.github/workflows/worldzpad-devnet.yml'

permissions:
  contents: read

concurrency:
  group: worldzpad-wldz-execution-proof
  cancel-in-progress: false

jobs:
  protocol-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worldzpad-devnet
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Solana and Meteora SDKs
        run: npm install --no-audit --no-fund
      - name: Static WorldzPad contract check
        run: npm run static-check
      - name: AUTO deterministic accounting proof
        run: npm run auto-check
      - name: Meteora DAMM v2 live devnet preflight
        run: npm run meteora-preflight

  localnet-token-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worldzpad-devnet
    steps:
      - name: Checkout WorldzPad
        uses: actions/checkout@v4

      - name: Checkout pinned official Meteora local-test fixtures
        uses: actions/checkout@v4
        with:
          repository: MeteoraAg/meteora-invent
          ref: 648871eb1daaf0acd72351e16394e68562ebaac0
          path: vendor/meteora-invent

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Node dependencies
        run: npm install --no-audit --no-fund

      - name: Install current Solana/Agave CLI
        shell: bash
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Start isolated Solana validator with official Meteora programs
        shell: bash
        run: |
          export PATH="$HOME/.local/share/solana/install/active_release/bin:$PATH"
          FIXTURES="$GITHUB_WORKSPACE/vendor/meteora-invent/studio/src/tests/artifacts"
          test -f "$FIXTURES/cp_amm.so"
          test -f "$FIXTURES/metaplex.so"
          solana-test-validator \
            --account-dir "$FIXTURES/accounts" \
            --bpf-program LbVRzDTvBDEcrthxfZ4RL6yiq3uZw8bS6MwtdY6UhFQ "$FIXTURES/lb_clmm.so" \
            --bpf-program Eo7WjKq67rjJQSZxS6z3YkapzY3eMj6Xy8X5EQVn5UaB "$FIXTURES/dynamic_amm.so" \
            --bpf-program cpamdpZCGKUy5JxQXB4dcpGPiikHawvSWAd6mEn1sGG "$FIXTURES/cp_amm.so" \
            --bpf-program 24Uqj9JCLxUeoC3hGfh5W3s9FM9uCHDS2SG3LYwBpyTi "$FIXTURES/dynamic_vault.so" \
            --bpf-program LocpQgucEQHbqNABEYvBvwoxCPsSbG91A1QaQhQQqjn "$FIXTURES/locker.so" \
            --bpf-program metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s "$FIXTURES/metaplex.so" \
            --reset --quiet --ledger /tmp/wldz-ledger > /tmp/wldz-validator.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -s -X POST -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' http://127.0.0.1:8899 | grep -q 'ok'; then
              echo "METEORA_LOCAL_VALIDATOR=READY"
              exit 0
            fi
            sleep 1
          done
          cat /tmp/wldz-validator.log
          exit 1

      - name: Mint 100M TEST WLDZ and allocate four real local-validator vaults
        env:
          SOLANA_RPC_URL: http://127.0.0.1:8899
          WORLDZPAD_NETWORK_LABEL: localnet
        run: npm run phase1

      - name: Independently verify local-validator supply, vaults and revoked authority
        env:
          SOLANA_RPC_URL: http://127.0.0.1:8899
          WORLDZPAD_NETWORK_LABEL: localnet
        run: npm run verify

      - name: Create real local WLDZ-wSOL DAMM v2 pool and prove OnlyB plus 200 bps
        env:
          SOLANA_RPC_URL: http://127.0.0.1:8899
          WORLDZPAD_NETWORK_LABEL: localnet
        run: npm run meteora-phase2

      - name: Execute controlled swap and prove wSOL-only fee claim
        env:
          SOLANA_RPC_URL: http://127.0.0.1:8899
          WORLDZPAD_NETWORK_LABEL: localnet
        run: npm run phase3

      - name: Final pre-mainnet AUTO execution and fail-closed proof
        env:
          SOLANA_RPC_URL: http://127.0.0.1:8899
          WORLDZPAD_NETWORK_LABEL: localnet
        run: npm run final-test

      - name: Publish public local execution proofs
        uses: actions/upload-artifact@v4
        with:
          name: wldz-localnet-execution-proofs
          path: |
            worldzpad-devnet/artifacts/wldz-localnet-phase1-public.json
            worldzpad-devnet/artifacts/wldz-localnet-meteora-phase2-public.json
            worldzpad-devnet/artifacts/wldz-localnet-swap-fee-claim-public.json
            worldzpad-devnet/artifacts/wldz-final-pre-mainnet-local-test-public.json
          if-no-files-found: error
          retention-days: 30

  real-devnet-token-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEVNET_PAYER_SECRET_JSON: ${{ secrets.DEVNET_PAYER_SECRET_JSON }}
      SOLANA_RPC_URL: ${{ secrets.DEVNET_SOLANA_RPC_URL }}
      WORLDZPAD_NETWORK_LABEL: devnet
    defaults:
      run:
        working-directory: worldzpad-devnet
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Detect disposable pre-funded DEVNET payer
        id: devnet_gate
        shell: bash
        run: |
          if [ -n "$DEVNET_PAYER_SECRET_JSON" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "REAL_DEVNET_PAYER=AVAILABLE"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "REAL_DEVNET_PAYER=NOT_CONFIGURED — live devnet mint skipped; local protocol proof still runs"
          fi
      - name: Install Node dependencies
        if: steps.devnet_gate.outputs.ready == 'true'
        run: npm install --no-audit --no-fund
      - name: Mint disposable 100M DEVNET WLDZ and allocate four master vaults
        if: steps.devnet_gate.outputs.ready == 'true'
        run: npm run phase1
      - name: Independently verify DEVNET supply, vault balances and revoked authority
        if: steps.devnet_gate.outputs.ready == 'true'
        run: npm run verify
      - name: Publish public devnet proof only
        if: steps.devnet_gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: wldz-devnet-phase1-public-proof
          path: worldzpad-devnet/artifacts/wldz-devnet-phase1-public.json
          if-no-files-found: error
          retention-days: 30
