name: Repair FoodWorldz DNS via Hostinger API

on:
  push:
    branches: [main]
    paths:
      - 'deployments/hostinger-dns-repair-foodworldz.request'

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - name: Confirm API token and active hosting target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_API_TOKEN"
          api='https://developers.hostinger.com'
          auth="Authorization: Bearer $HOSTINGER_API_TOKEN"
          websites="$(curl --fail --silent --show-error -H "$auth" -H 'Accept: application/json' "$api/api/hosting/v1/websites")"
          printf '%s' "$websites" | jq -e '.data[] | select(.domain=="foodworldz.com" and .is_enabled==true and .username=="u643166328" and .order_id==1009657511)' >/dev/null
          printf '%s' "$websites" | jq -e '.data[] | select(.domain=="donateworldz.com" and .is_enabled==true and .username=="u643166328" and .order_id==1009657511)' >/dev/null
          echo 'FoodWorldz and DonateWorldz are active on the same expected Hostinger Business hosting account.'

      - name: Snapshot current FoodWorldz zone evidence
        id: before
        shell: bash
        run: |
          set -euo pipefail
          api='https://developers.hostinger.com'
          auth="Authorization: Bearer $HOSTINGER_API_TOKEN"
          mkdir -p "$RUNNER_TEMP/food-dns"
          zone="$(curl --fail --silent --show-error -H "$auth" -H 'Accept: application/json' "$api/api/dns/v1/zones/foodworldz.com")"
          printf '%s\n' "$zone" | tee "$RUNNER_TEMP/food-dns/before.json"
          count="$(printf '%s' "$zone" | jq 'length')"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Initialize empty Hostinger DNS zone
        if: ${{ steps.before.outputs.count == '0' }}
        shell: bash
        run: |
          set -euo pipefail
          api='https://developers.hostinger.com'
          auth="Authorization: Bearer $HOSTINGER_API_TOKEN"
          payload='{"sync":true,"reset_email_records":false,"whitelisted_record_types":["MX","TXT"]}'
          code="$(curl --silent --show-error --location \
            -H "$auth" -H 'Accept: application/json' -H 'Content-Type: application/json' \
            --data "$payload" -o "$RUNNER_TEMP/food-dns/reset-response.json" -w '%{http_code}' \
            "$api/api/dns/v1/zones/foodworldz.com/reset" || true)"
          echo "Hostinger zone initialization HTTP $code"
          cat "$RUNNER_TEMP/food-dns/reset-response.json" 2>/dev/null || true
          echo
          test "$code" = '200'

      - name: Read initialized zone and select Hostinger web IPv4
        id: target
        shell: bash
        run: |
          set -euo pipefail
          api='https://developers.hostinger.com'
          auth="Authorization: Bearer $HOSTINGER_API_TOKEN"
          zone="$(curl --fail --silent --show-error -H "$auth" -H 'Accept: application/json' "$api/api/dns/v1/zones/foodworldz.com")"
          printf '%s\n' "$zone" | tee "$RUNNER_TEMP/food-dns/initialized.json"
          ip="$(printf '%s' "$zone" | jq -r '[.[] | select(.name=="@" and .type=="A") | .records[]?.content] | first // empty')"
          if [ -z "$ip" ]; then
            ip="$(dig +short A donateworldz.com | grep -E '^[0-9.]+$' | head -n1)"
            test -n "$ip"
            headers="$(curl --fail --silent --show-error --head --connect-timeout 10 --max-time 20 https://donateworldz.com/)"
            printf '%s\n' "$headers" | grep -Eiq '^platform:[[:space:]]*hostinger'
            echo "No default A record returned; using proven sibling Hostinger web IPv4: $ip"
          else
            echo "Hostinger initialized web IPv4: $ip"
          fi
          echo "ipv4=$ip" >> "$GITHUB_OUTPUT"

      - name: Validate exact FoodWorldz web DNS records
        shell: bash
        env:
          HOSTING_IPV4: ${{ steps.target.outputs.ipv4 }}
        run: |
          set -euo pipefail
          api='https://developers.hostinger.com'
          auth="Authorization: Bearer $HOSTINGER_API_TOKEN"
          payload="$(jq -n --arg ip "$HOSTING_IPV4" '{overwrite:true,zone:[{name:"@",type:"A",ttl:1800,records:[{content:$ip}]},{name:"www",type:"CNAME",ttl:300,records:[{content:"foodworldz.com"}]}]}')"
          printf '%s\n' "$payload" | tee "$RUNNER_TEMP/food-dns/proposed.json"
          curl --fail --silent --show-error --location \
            -H "$auth" -H 'Accept: application/json' -H 'Content-Type: application/json' \
            --data "$payload" "$api/api/dns/v1/zones/foodworldz.com/validate"
          echo
          echo 'Hostinger validation passed.'

      - name: Apply FoodWorldz web DNS records only
        shell: bash
        env:
          HOSTING_IPV4: ${{ steps.target.outputs.ipv4 }}
        run: |
          set -euo pipefail
          api='https://developers.hostinger.com'
          auth="Authorization: Bearer $HOSTINGER_API_TOKEN"
          payload="$(jq -n --arg ip "$HOSTING_IPV4" '{overwrite:true,zone:[{name:"@",type:"A",ttl:1800,records:[{content:$ip}]},{name:"www",type:"CNAME",ttl:300,records:[{content:"foodworldz.com"}]}]}')"
          code="$(curl --silent --show-error --location --request PUT \
            -H "$auth" -H 'Accept: application/json' -H 'Content-Type: application/json' \
            --data "$payload" -o "$RUNNER_TEMP/food-dns/update-response.json" -w '%{http_code}' \
            "$api/api/dns/v1/zones/foodworldz.com" || true)"
          echo "Hostinger DNS update HTTP $code"
          cat "$RUNNER_TEMP/food-dns/update-response.json" 2>/dev/null || true
          echo
          test "$code" = '200'

      - name: Prove Hostinger zone now contains intended records
        shell: bash
        env:
          HOSTING_IPV4: ${{ steps.target.outputs.ipv4 }}
        run: |
          set -euo pipefail
          api='https://developers.hostinger.com'
          auth="Authorization: Bearer $HOSTINGER_API_TOKEN"
          zone="$(curl --fail --silent --show-error -H "$auth" -H 'Accept: application/json' "$api/api/dns/v1/zones/foodworldz.com")"
          printf '%s\n' "$zone" | tee "$RUNNER_TEMP/food-dns/after.json"
          printf '%s' "$zone" | jq -e --arg ip "$HOSTING_IPV4" '.[] | select(.name=="@" and .type=="A") | .records[] | select(.content==$ip)' >/dev/null
          printf '%s' "$zone" | jq -e '.[] | select(.name=="www" and .type=="CNAME") | .records[] | select(.content=="foodworldz.com")' >/dev/null
          echo 'Hostinger DNS zone proof passed.'

      - name: Wait for public FoodWorldz DNS
        shell: bash
        env:
          HOSTING_IPV4: ${{ steps.target.outputs.ipv4 }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            public_ip="$(dig +short A foodworldz.com | grep -E '^[0-9.]+$' | head -n1 || true)"
            if [ "$public_ip" = "$HOSTING_IPV4" ]; then
              echo "Public DNS live: foodworldz.com -> $public_ip"
              exit 0
            fi
            echo "Waiting for DNS propagation ($attempt/30)..."
            sleep 20
          done
          echo '::error::FoodWorldz public DNS did not reach the intended Hostinger IP within 10 minutes.'
          exit 1

      - name: Check FoodWorldz HTTPS readiness
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl --fail --silent --show-error --head --connect-timeout 10 --max-time 20 https://foodworldz.com/ >/dev/null; then
              echo 'FoodWorldz HTTPS is responding.'
              exit 0
            fi
            echo "Waiting for HTTPS/SSL readiness ($attempt/20)..."
            sleep 30
          done
          echo '::warning::DNS is repaired, but HTTPS is not ready yet. Deployment should wait for SSL readiness.'

      - name: Upload repair evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: foodworldz-dns-repair-${{ github.run_id }}
          path: ${{ runner.temp }}/food-dns/
          if-no-files-found: warn
          retention-days: 14
