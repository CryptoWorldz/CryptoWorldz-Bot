name: Command Centre v4

on:
  push:
    branches: [main, clean-platform-v4]
    paths:
      - "platform/**"
      - "src/oneworldz-gpt/**"
      - "src/hub-central/live-v1.js"
      - "test/oneworldz-gpt.test.js"
      - "test/hub-central-live-v1.test.js"
      - "index.js"
      - "package.json"
      - "supabase/migrations/20260808235139_command_centre_v4_bootstrap.sql"
      - ".github/workflows/command-centre-v4.yml"
  pull_request:
    paths:
      - "platform/**"
      - "src/oneworldz-gpt/**"
      - "src/hub-central/live-v1.js"
      - "test/oneworldz-gpt.test.js"
      - "test/hub-central-live-v1.test.js"
      - "index.js"
      - "package.json"
      - "supabase/migrations/20260808235139_command_centre_v4_bootstrap.sql"
      - ".github/workflows/command-centre-v4.yml"

permissions:
  contents: read

env:
  PROTECTED_DOMAIN: cryptobotz.cryptoworldz.xyz
  PROTECTED_NODE_ROOT: /domains/cryptobotz.cryptoworldz.xyz/nodejs
  PROTECTED_RESTART_DIR: /domains/cryptobotz.cryptoworldz.xyz/nodejs/tmp

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: docker build .

  protected-oneworldz-gpt:
    name: Deploy + prove protected OneWorldz GPT guarded production
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify guarded source
        run: |
          set -euo pipefail
          npm ci
          node --test test/oneworldz-gpt.test.js test/hub-central-live-v1.test.js
          npm run check:structure

      - name: Install protected FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Backup protected runtime and build guarded flat runtime
        shell: bash
        run: |
          set -euo pipefail
          raw_host="$(printf '%s' "$FTP_HOST" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#^ftp://##' -e 's#^ftps://##' -e 's#/.*$##')"
          if [[ "$raw_host" != *:*:* && "$raw_host" == *:* ]]; then raw_host="${raw_host%%:*}"; fi
          test -n "$raw_host"
          echo "::add-mask::$FTP_HOST"
          echo "::add-mask::$FTP_USERNAME"
          echo "::add-mask::$FTP_PASSWORD"
          printf '%s' "$raw_host" > "$RUNNER_TEMP/protected-host"

          cat > "$RUNNER_TEMP/download.lftp" <<EOF
          set cmd:fail-exit false
          set net:max-retries 2
          set net:timeout 25
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          get $PROTECTED_NODE_ROOT/index.js -o $RUNNER_TEMP/original-index.js
          get $PROTECTED_NODE_ROOT/package.json -o $RUNNER_TEMP/original-package.json
          get $PROTECTED_NODE_ROOT/hub-central-live.js -o $RUNNER_TEMP/original-hub-central-live.js
          get $PROTECTED_NODE_ROOT/.env -o $RUNNER_TEMP/protected.env
          bye
          EOF
          timeout 300 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/download.lftp" "$raw_host"
          test -s "$RUNNER_TEMP/original-index.js"
          test -s "$RUNNER_TEMP/original-package.json"
          test -s "$RUNNER_TEMP/protected.env"
          grep -Eq '^OPENAI_API_KEY=.+$' "$RUNNER_TEMP/protected.env"
          echo 'OPENAI_API_KEY_PRESENT=yes'

          cp "$RUNNER_TEMP/original-index.js" "$RUNNER_TEMP/patched-index.js"
          node - <<'NODE'
          const fs=require('fs');
          const p=process.env.RUNNER_TEMP+'/patched-index.js';
          let text=fs.readFileSync(p,'utf8');
          text=text.replace('require("dotenv").config({ path: require("node:path").join(__dirname, ".env") });','require("dotenv").config();');
          const needle='const app = express();';
          if(!text.includes('registerHubCentralLive')) {
            if(!text.includes(needle)) throw new Error('unexpected_express_app_structure');
            text=text.replace(needle,'const { registerHubCentralLive } = require("./hub-central-live");\n'+needle+'\nregisterHubCentralLive(app);');
          }
          fs.writeFileSync(p,text);
          NODE
          node --check "$RUNNER_TEMP/patched-index.js"

          cat > "$RUNNER_TEMP/openai-key-bootstrap.js" <<'NODE'
          (() => {
            if (String(process.env.OPENAI_API_KEY || '').trim()) return;
            try {
              const fs = require('node:fs');
              const path = require('node:path');
              const text = fs.readFileSync(path.join(__dirname, '.env'), 'utf8');
              const line = text.split(/\r?\n/).find((row) => /^OPENAI_API_KEY=/.test(row));
              if (!line) return;
              let value = line.slice('OPENAI_API_KEY='.length).trim();
              if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) value = value.slice(1, -1);
              if (value) process.env.OPENAI_API_KEY = value;
            } catch {}
          })();
          NODE
          cat "$RUNNER_TEMP/openai-key-bootstrap.js" src/hub-central/live-v1.js > "$RUNNER_TEMP/guarded-hub-central-live.js"
          node --check "$RUNNER_TEMP/guarded-hub-central-live.js"
          touch "$RUNNER_TEMP/restart.txt"

      - name: Install exact guarded protected runtime
        id: install
        shell: bash
        run: |
          set -euo pipefail
          raw_host="$(cat "$RUNNER_TEMP/protected-host")"
          cat > "$RUNNER_TEMP/upload.lftp" <<EOF
          set cmd:fail-exit false
          set net:max-retries 2
          set net:timeout 25
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          put $RUNNER_TEMP/guarded-hub-central-live.js -o $PROTECTED_NODE_ROOT/hub-central-live.js
          put $RUNNER_TEMP/patched-index.js -o $PROTECTED_NODE_ROOT/index.js
          put $RUNNER_TEMP/restart.txt -o $PROTECTED_RESTART_DIR/restart.txt
          bye
          EOF
          timeout 300 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/upload.lftp" "$raw_host"
          echo 'written=true' >> "$GITHUB_OUTPUT"

      - name: Prove exact protected bytes
        id: bytes
        shell: bash
        run: |
          set -euo pipefail
          raw_host="$(cat "$RUNNER_TEMP/protected-host")"
          cat > "$RUNNER_TEMP/prove.lftp" <<EOF
          set cmd:fail-exit true
          set net:max-retries 2
          set net:timeout 25
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          get $PROTECTED_NODE_ROOT/hub-central-live.js -o $RUNNER_TEMP/remote-hub.js
          get $PROTECTED_NODE_ROOT/index.js -o $RUNNER_TEMP/remote-index.js
          bye
          EOF
          timeout 300 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/prove.lftp" "$raw_host"
          cmp "$RUNNER_TEMP/guarded-hub-central-live.js" "$RUNNER_TEMP/remote-hub.js"
          cmp "$RUNNER_TEMP/patched-index.js" "$RUNNER_TEMP/remote-index.js"
          sha256sum "$RUNNER_TEMP/remote-hub.js" "$RUNNER_TEMP/remote-index.js"
          echo 'proved=true' >> "$GITHUB_OUTPUT"
          echo 'PROTECTED_GUARDED_BYTES=PASS'

      - name: Prove live guarded API fingerprint
        id: live
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://$PROTECTED_DOMAIN/api/oneworldz-gpt/status"
          hub_endpoint="https://$PROTECTED_DOMAIN/api/hub-central/status"
          for attempt in $(seq 1 18); do
            sleep 7
            status="$(curl --fail --silent --show-error --location --connect-timeout 12 --max-time 25 -H 'Cache-Control: no-cache, no-store' "${endpoint}?guard=${GITHUB_SHA}-${GITHUB_RUN_ID}-${attempt}" || true)"
            hub="$(curl --fail --silent --show-error --location --connect-timeout 12 --max-time 25 -H 'Cache-Control: no-cache, no-store' "${hub_endpoint}?guard=${GITHUB_SHA}-${GITHUB_RUN_ID}-${attempt}" || true)"
            if STATUS="$status" HUB="$hub" node <<'NODE'
          const status=JSON.parse(process.env.STATUS||'{}');
          const hub=JSON.parse(process.env.HUB||'{}');
          if(status.ok!==true||status.openai_api_configured!==true) process.exit(1);
          if(status.guard_profile!=="oneworldz-public-low-cost-v1"||status.guard_enforced!==true) process.exit(1);
          if(status.model!=="gpt-4o-mini"||status.max_output_tokens!==320) process.exit(1);
          if(status.per_ip_limit_10m!==8||status.daily_request_limit!==1000) process.exit(1);
          if(status.payments_in_chat!==false||status.secrets_in_browser!==false) process.exit(1);
          if(hub.ok!==true||hub.oneworldz_gpt!=="configured"||hub.oneworldz_gpt_guard!=="oneworldz-public-low-cost-v1") process.exit(1);
          NODE
            then
              echo "$status"
              echo 'PROTECTED_ONEWORLDZ_GPT_GUARD=PASS'
              echo 'proved=true' >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Waiting for protected runtime restart $attempt/18"
          done
          echo '::error::Protected runtime did not expose the exact guarded OpenAI fingerprint.'
          exit 1

      - name: Capture sanitized protected startup errors on failure
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          raw_host="$(cat "$RUNNER_TEMP/protected-host" 2>/dev/null)"
          [ -z "$raw_host" ] && exit 0
          cat > "$RUNNER_TEMP/logs.lftp" <<EOF
          set cmd:fail-exit false
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          get $PROTECTED_NODE_ROOT/stderr.log -o $RUNNER_TEMP/stderr.log
          get $PROTECTED_NODE_ROOT/console.log -o $RUNNER_TEMP/console.log
          bye
          EOF
          timeout 120 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/logs.lftp" "$raw_host" || true
          for f in "$RUNNER_TEMP/stderr.log" "$RUNNER_TEMP/console.log"; do
            [ -s "$f" ] || continue
            echo "Sanitized tail: $(basename "$f")"
            tail -80 "$f" | sed -E 's/sk-[A-Za-z0-9_-]+/[OPENAI_KEY_MASKED]/g; s/(Bearer )[A-Za-z0-9._-]+/\1[TOKEN_MASKED]/g' | grep -E 'Fatal|Error|error|MODULE|Syntax|TypeError|ReferenceError|ENOENT|EADDR|dotenv|hub-central|listening|startup' | tail -40 || true
          done

      - name: Roll back only on failed byte installation
        if: ${{ failure() && steps.install.outputs.written == 'true' && steps.bytes.outputs.proved != 'true' }}
        shell: bash
        run: |
          set -u
          raw_host="$(cat "$RUNNER_TEMP/protected-host")"
          touch "$RUNNER_TEMP/restart-rollback.txt"
          cat > "$RUNNER_TEMP/rollback.lftp" <<EOF
          set cmd:fail-exit false
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          put $RUNNER_TEMP/original-index.js -o $PROTECTED_NODE_ROOT/index.js
          put $RUNNER_TEMP/original-hub-central-live.js -o $PROTECTED_NODE_ROOT/hub-central-live.js
          put $RUNNER_TEMP/restart-rollback.txt -o $PROTECTED_RESTART_DIR/restart.txt
          bye
          EOF
          timeout 300 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/rollback.lftp" "$raw_host" || true
