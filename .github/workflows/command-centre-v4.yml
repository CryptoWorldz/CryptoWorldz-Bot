name: Command Centre v4

on:
  push:
    branches: [main, clean-platform-v4]
    paths:
      - "platform/**"
      - "src/hub-central/live-v1.js"
      - "src/hub-central/preload.js"
      - "src/oneworldz-gpt/**"
      - "src/community-support/live-v1.js"
      - "test/oneworldz-gpt.test.js"
      - "test/hub-central-live-v1.test.js"
      - "index.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/command-centre-v4.yml"
  pull_request:
    paths:
      - "platform/**"
      - "src/hub-central/live-v1.js"
      - "src/hub-central/preload.js"
      - "src/oneworldz-gpt/**"
      - "src/community-support/live-v1.js"
      - "test/oneworldz-gpt.test.js"
      - "test/hub-central-live-v1.test.js"
      - "index.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/command-centre-v4.yml"

permissions:
  contents: read

env:
  PROTECTED_DOMAIN: cryptobotz.cryptoworldz.xyz
  PROTECTED_NODE_ROOT: /domains/cryptobotz.cryptoworldz.xyz/nodejs

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: docker build .

  protected-oneworldz-gpt:
    name: Deploy + prove protected guarded OneWorldz GPT
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify hard-locked protected public runtime
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --test test/oneworldz-gpt.test.js test/hub-central-live-v1.test.js
          node --check index.js
          grep -Fq 'startProtectedPublicFallback' index.js
          grep -Fq 'require("./src/hub-central/preload")' index.js
          grep -Fq 'oneworldz-public-low-cost-v1' src/oneworldz-gpt/http.js
          grep -Fq 'model: "gpt-4o-mini"' src/hub-central/live-v1.js
          for key in OPENAI_API_KEY HOSTINGER_API_TOKEN FTP_HOST FTP_USERNAME FTP_PASSWORD; do
            test -n "${!key:-}"
            echo "::add-mask::${!key}"
          done
          echo 'PROTECTED_PUBLIC_GUARD_SOURCE=PASS'

      - name: Install protected runtime utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Resolve Hostinger managed application
        shell: bash
        run: |
          set -euo pipefail
          domain_enc="$(node -p 'encodeURIComponent(process.env.PROTECTED_DOMAIN)')"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' \
            "https://developers.hostinger.com/api/hosting/v1/websites?domain=${domain_enc}&per_page=25" \
            -o "$RUNNER_TEMP/websites.json"
          username="$(node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/websites.json','utf8'));
          const d=process.env.PROTECTED_DOMAIN.toLowerCase();
          const row=(p.data||[]).find(x=>String(x.domain||'').toLowerCase()===d);
          if(!row?.username) process.exit(2);
          process.stdout.write(String(row.username));
          NODE
          )"
          test -n "$username"
          echo "::add-mask::$username"
          printf '%s' "$username" > "$RUNNER_TEMP/hostinger-username"
          raw_host="$(printf '%s' "$FTP_HOST" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#^ftp://##' -e 's#^ftps://##' -e 's#/.*$##')"
          if [[ "$raw_host" != *:*:* && "$raw_host" == *:* ]]; then raw_host="${raw_host%%:*}"; fi
          printf '%s' "$raw_host" > "$RUNNER_TEMP/raw-host"
          echo 'HOSTINGER_MANAGED_APP_RESOLVED=PASS'

      - name: Wait for Hostinger automatic build activity to settle
        shell: bash
        run: |
          set -euo pipefail
          username="$(cat "$RUNNER_TEMP/hostinger-username")"
          domain_enc="$(node -p 'encodeURIComponent(process.env.PROTECTED_DOMAIN)')"
          user_enc="$(HOSTINGER_USERNAME="$username" node -p 'encodeURIComponent(process.env.HOSTINGER_USERNAME)')"
          base="https://developers.hostinger.com/api/hosting/v1/accounts/${user_enc}/websites/${domain_enc}/nodejs"
          for attempt in $(seq 1 90); do
            curl --fail --silent --show-error --location -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "$base/builds?per_page=25" -o "$RUNNER_TEMP/builds.json"
            active="$(node -e "const p=require(process.env.RUNNER_TEMP+'/builds.json');process.stdout.write(String((p.data||[]).filter(x=>!['completed','failed'].includes(String(x.state||'').toLowerCase())).length))")"
            latest="$(node -e "const p=require(process.env.RUNNER_TEMP+'/builds.json');const x=(p.data||[])[0]||{};process.stdout.write((x.uuid||'')+':'+(x.state||''))")"
            echo "HOSTINGER_BUILD_ACTIVITY attempt=$attempt active=$active latest=$latest"
            [ "$active" = 0 ] && break
            sleep 5
          done
          [ "$active" = 0 ]
          echo 'HOSTINGER_BUILD_ACTIVITY_SETTLED=PASS'

      - name: Capture existing protected environment
        shell: bash
        run: |
          set -euo pipefail
          raw_host="$(cat "$RUNNER_TEMP/raw-host")"
          : > "$RUNNER_TEMP/protected.env"
          cat > "$RUNNER_TEMP/get-env.lftp" <<EOF
          set cmd:fail-exit false
          set net:max-retries 2
          set net:timeout 25
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          get $PROTECTED_NODE_ROOT/.env -o $RUNNER_TEMP/protected.env
          bye
          EOF
          timeout 180 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/get-env.lftp" "$raw_host" || true
          echo 'PROTECTED_ENV_CAPTURE=PASS'

      - name: Force exact protected Node runtime source to Hostinger
        shell: bash
        run: |
          set -euo pipefail
          raw_host="$(cat "$RUNNER_TEMP/raw-host")"
          cat > "$RUNNER_TEMP/sync-runtime.lftp" <<EOF
          set cmd:fail-exit false
          set net:max-retries 2
          set net:timeout 30
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          mkdir -p $PROTECTED_NODE_ROOT/src
          mkdir -p $PROTECTED_NODE_ROOT/public
          mkdir -p $PROTECTED_NODE_ROOT/.well-known
          set cmd:fail-exit true
          put index.js -o $PROTECTED_NODE_ROOT/index.js
          put package.json -o $PROTECTED_NODE_ROOT/package.json
          put package-lock.json -o $PROTECTED_NODE_ROOT/package-lock.json
          mirror -R --verbose --no-perms --exclude-glob .DS_Store src $PROTECTED_NODE_ROOT/src
          mirror -R --verbose --no-perms --exclude-glob .DS_Store public $PROTECTED_NODE_ROOT/public
          mirror -R --verbose --no-perms --exclude-glob .DS_Store .well-known $PROTECTED_NODE_ROOT/.well-known
          bye
          EOF
          timeout 480 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/sync-runtime.lftp" "$raw_host"
          echo 'PROTECTED_RUNTIME_SOURCE_SYNC=PASS'

      - name: Apply protected OpenAI guard environment
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs=require('fs');
          const p=process.env.RUNNER_TEMP+'/protected.env';
          let rows=[];
          try { rows=fs.readFileSync(p,'utf8').split(/\r?\n/).filter(Boolean); } catch {}
          const overrides={OPENAI_API_KEY:process.env.OPENAI_API_KEY,ONEWORLDZ_OPENAI_MODEL:'gpt-4o-mini'};
          rows=rows.filter(row=>!Object.keys(overrides).some(k=>row.startsWith(k+'=')));
          for(const [k,v] of Object.entries(overrides)) rows.push(`${k}=${v}`);
          fs.writeFileSync(p,rows.join('\n')+'\n');
          NODE
          grep -Eq '^OPENAI_API_KEY=.+$' "$RUNNER_TEMP/protected.env"
          grep -Eq '^ONEWORLDZ_OPENAI_MODEL=gpt-4o-mini$' "$RUNNER_TEMP/protected.env"
          raw_host="$(cat "$RUNNER_TEMP/raw-host")"
          cat > "$RUNNER_TEMP/put-env.lftp" <<EOF
          set cmd:fail-exit true
          set net:max-retries 2
          set net:timeout 25
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          put $RUNNER_TEMP/protected.env -o $PROTECTED_NODE_ROOT/.env
          bye
          EOF
          timeout 180 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/put-env.lftp" "$raw_host"
          echo 'PROTECTED_OPENAI_GUARD_ENV=PASS'

      - name: Verify remote runtime fingerprints
        shell: bash
        run: |
          set -euo pipefail
          raw_host="$(cat "$RUNNER_TEMP/raw-host")"
          rm -f "$RUNNER_TEMP/remote-index.js" "$RUNNER_TEMP/remote-http.js"
          cat > "$RUNNER_TEMP/get-proof.lftp" <<EOF
          set cmd:fail-exit true
          set net:max-retries 2
          set net:timeout 25
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          get $PROTECTED_NODE_ROOT/index.js -o $RUNNER_TEMP/remote-index.js
          get $PROTECTED_NODE_ROOT/src/oneworldz-gpt/http.js -o $RUNNER_TEMP/remote-http.js
          bye
          EOF
          timeout 180 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/get-proof.lftp" "$raw_host"
          cmp -s index.js "$RUNNER_TEMP/remote-index.js"
          cmp -s src/oneworldz-gpt/http.js "$RUNNER_TEMP/remote-http.js"
          echo 'PROTECTED_REMOTE_SOURCE_FINGERPRINT=PASS'

      - name: Official Hostinger managed restart
        shell: bash
        run: |
          set -euo pipefail
          username="$(cat "$RUNNER_TEMP/hostinger-username")"
          domain_enc="$(node -p 'encodeURIComponent(process.env.PROTECTED_DOMAIN)')"
          user_enc="$(HOSTINGER_USERNAME="$username" node -p 'encodeURIComponent(process.env.HOSTINGER_USERNAME)')"
          url="https://developers.hostinger.com/api/hosting/v1/accounts/${user_enc}/websites/${domain_enc}/nodejs/server/restart"
          code="$(curl --silent --show-error --location --connect-timeout 15 --max-time 45 --request POST -o "$RUNNER_TEMP/restart.json" -w '%{http_code}' -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "$url")"
          case "$code" in 200|201|202|204) echo "HOSTINGER_MANAGED_RESTART=PASS HTTP=$code" ;; *) cat "$RUNNER_TEMP/restart.json"; exit 1 ;; esac

      - name: Prove protected production API live fingerprint
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 60); do
            sleep 5
            code="$(curl --silent --show-error --location --connect-timeout 12 --max-time 20 -o "$RUNNER_TEMP/status.json" -w '%{http_code}' "https://$PROTECTED_DOMAIN/api/oneworldz-gpt/status?proof=${GITHUB_SHA}-${GITHUB_RUN_ID}-${i}" || true)"
            if [ "$code" = 200 ] && STATUS="$RUNNER_TEMP/status.json" node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.STATUS,'utf8'));
          if(p.ok!==true||p.openai_api_configured!==true) process.exit(1);
          if(p.guard_profile!=="oneworldz-public-low-cost-v1"||p.guard_enforced!==true) process.exit(1);
          if(p.model!=="gpt-4o-mini"||p.max_output_tokens!==320) process.exit(1);
          if(p.per_ip_limit_10m!==8||p.daily_request_limit!==1000) process.exit(1);
          if(p.payments_in_chat!==false||p.secrets_in_browser!==false) process.exit(1);
          NODE
            then
              echo 'PROTECTED_ONEWORLDZ_GPT_PRODUCTION=PASS'
              cat "$RUNNER_TEMP/status.json"
              exit 0
            fi
            echo "Protected API convergence $i/60 HTTP=$code"
          done
          echo '::error::Protected production API live fingerprint failed.'
          exit 1
