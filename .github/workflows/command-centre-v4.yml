name: Command Centre v4

on:
  push:
    branches: [main, clean-platform-v4]
    paths:
      - "platform/**"
      - "src/hub-central/live-v1.js"
      - "src/community-support/live-v1.js"
      - "src/oneworldz-gpt/**"
      - "test/oneworldz-gpt.test.js"
      - "test/hub-central-live-v1.test.js"
      - "package.json"
      - ".github/workflows/command-centre-v4.yml"
  pull_request:
    paths:
      - "platform/**"
      - "src/hub-central/live-v1.js"
      - "src/community-support/live-v1.js"
      - "src/oneworldz-gpt/**"
      - "test/oneworldz-gpt.test.js"
      - "test/hub-central-live-v1.test.js"
      - "package.json"
      - ".github/workflows/command-centre-v4.yml"

permissions:
  contents: read

env:
  PROTECTED_DOMAIN: cryptobotz.cryptoworldz.xyz
  PROTECTED_NODE_ROOT: /domains/cryptobotz.cryptoworldz.xyz/nodejs
  PROTECTED_RESTART_DIR: /domains/cryptobotz.cryptoworldz.xyz/nodejs/tmp
  PROTECTED_WEB_RESTART: /domains/cryptobotz.cryptoworldz.xyz/public_html/tmp/restart.txt

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: docker build .

  protected-oneworldz-gpt:
    name: Restore + deploy + prove protected guarded OneWorldz GPT
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify current guarded source
        run: |
          set -euo pipefail
          npm ci
          node --test test/oneworldz-gpt.test.js test/hub-central-live-v1.test.js
          npm run check:structure
          node --check src/hub-central/live-v1.js
          node --check src/community-support/live-v1.js
          grep -Fq 'oneworldz-public-low-cost-v1' src/hub-central/live-v1.js
          grep -Fq 'model: "gpt-4o-mini"' src/hub-central/live-v1.js

      - name: Install FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Backup runtime and prepare guarded startup
        shell: bash
        run: |
          set -euo pipefail
          raw_host="$(printf '%s' "$FTP_HOST" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#^ftp://##' -e 's#^ftps://##' -e 's#/.*$##')"
          if [[ "$raw_host" != *:*:* && "$raw_host" == *:* ]]; then raw_host="${raw_host%%:*}"; fi
          test -n "$raw_host"
          echo "::add-mask::$FTP_HOST"; echo "::add-mask::$FTP_USERNAME"; echo "::add-mask::$FTP_PASSWORD"
          [ -z "$OPENAI_API_KEY" ] || echo "::add-mask::$OPENAI_API_KEY"
          printf '%s' "$raw_host" > "$RUNNER_TEMP/raw-host"

          cat > "$RUNNER_TEMP/download.lftp" <<EOF
          set cmd:fail-exit false
          set net:max-retries 2
          set net:timeout 25
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          get $PROTECTED_NODE_ROOT/index.js -o $RUNNER_TEMP/original-index.js
          get $PROTECTED_NODE_ROOT/package.json -o $RUNNER_TEMP/original-package.json
          get $PROTECTED_NODE_ROOT/hub-central-live.js -o $RUNNER_TEMP/original-hub.js
          get $PROTECTED_NODE_ROOT/community-support-live.js -o $RUNNER_TEMP/original-community.js
          get $PROTECTED_NODE_ROOT/.env -o $RUNNER_TEMP/original.env
          bye
          EOF
          timeout 300 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/download.lftp" "$raw_host" || true
          test -s "$RUNNER_TEMP/original-index.js"
          test -s "$RUNNER_TEMP/original-package.json"
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/original-package.json','utf8'));
          if(p.name!=='cryptoworldz-bot'||p.scripts?.start!=='node index.js') throw new Error('unexpected_protected_runtime');
          NODE

          cp "$RUNNER_TEMP/original-index.js" "$RUNNER_TEMP/patched-index.js"
          node - <<'NODE'
          const fs=require('fs');
          const p=process.env.RUNNER_TEMP+'/patched-index.js';
          let text=fs.readFileSync(p,'utf8');
          text=text.replace('require("dotenv").config({ path: require("node:path").join(__dirname, ".env") });','require("dotenv").config();');
          const needle='const app = express();';
          if(!text.includes(needle)) throw new Error('unexpected_express_app_structure');
          if(!text.includes('registerHubCentralLive')) text=text.replace(needle, needle+'\nconst { registerHubCentralLive } = require("./hub-central-live");\nregisterHubCentralLive(app);');
          if(!text.includes('registerCommunitySupportLive')) text=text.replace(needle, needle+'\nconst { registerCommunitySupportLive } = require("./community-support-live");\nregisterCommunitySupportLive(app);');
          fs.writeFileSync(p,text);
          NODE
          node --check "$RUNNER_TEMP/patched-index.js"

          if [ -s "$RUNNER_TEMP/original.env" ]; then cp "$RUNNER_TEMP/original.env" "$RUNNER_TEMP/patched.env"; else : > "$RUNNER_TEMP/patched.env"; fi
          if [ -n "$OPENAI_API_KEY" ]; then
            OPENAI_API_KEY="$OPENAI_API_KEY" node - <<'NODE'
          const fs=require('fs');
          const p=process.env.RUNNER_TEMP+'/patched.env';
          const key=process.env.OPENAI_API_KEY;
          let rows=fs.readFileSync(p,'utf8').split(/\r?\n/).filter(Boolean);
          rows=rows.filter(row=>!/^OPENAI_API_KEY=/.test(row)&&!/^ONEWORLDZ_OPENAI_MODEL=/.test(row));
          rows.push(`OPENAI_API_KEY=${key}`,'ONEWORLDZ_OPENAI_MODEL=gpt-4o-mini');
          fs.writeFileSync(p,rows.join('\n')+'\n');
          NODE
          fi
          grep -Eq '^OPENAI_API_KEY=.+$' "$RUNNER_TEMP/patched.env" || { echo '::error::Protected OPENAI_API_KEY is unavailable.'; exit 1; }
          grep -Eq '^ONEWORLDZ_OPENAI_MODEL=gpt-4o-mini$' "$RUNNER_TEMP/patched.env" || printf '\nONEWORLDZ_OPENAI_MODEL=gpt-4o-mini\n' >> "$RUNNER_TEMP/patched.env"
          echo 'PROTECTED_OPENAI_KEY_CONFIGURED=YES'
          cp src/hub-central/live-v1.js "$RUNNER_TEMP/hub-central-live.js"
          cp src/community-support/live-v1.js "$RUNNER_TEMP/community-support-live.js"
          printf 'restart %s %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/restart.txt"

      - name: Upload guarded services and trigger both protected restart sentinels
        id: write
        shell: bash
        run: |
          set -euo pipefail
          raw_host="$(cat "$RUNNER_TEMP/raw-host")"
          cat > "$RUNNER_TEMP/upload.lftp" <<EOF
          set cmd:fail-exit true
          set net:max-retries 2
          set net:timeout 25
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          put $RUNNER_TEMP/hub-central-live.js -o $PROTECTED_NODE_ROOT/hub-central-live.js
          put $RUNNER_TEMP/community-support-live.js -o $PROTECTED_NODE_ROOT/community-support-live.js
          put $RUNNER_TEMP/patched-index.js -o $PROTECTED_NODE_ROOT/index.js
          put $RUNNER_TEMP/patched.env -o $PROTECTED_NODE_ROOT/.env
          put $RUNNER_TEMP/restart.txt -o $PROTECTED_RESTART_DIR/restart.txt
          put $RUNNER_TEMP/restart.txt -o $PROTECTED_WEB_RESTART
          bye
          EOF
          timeout 300 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/upload.lftp" "$raw_host"
          echo 'written=true' >> "$GITHUB_OUTPUT"

      - name: Prove exact guarded bytes, environment and restart markers
        id: bytes
        shell: bash
        run: |
          set -euo pipefail
          raw_host="$(cat "$RUNNER_TEMP/raw-host")"
          cat > "$RUNNER_TEMP/prove.lftp" <<EOF
          set cmd:fail-exit true
          set net:max-retries 2
          set net:timeout 25
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          get $PROTECTED_NODE_ROOT/hub-central-live.js -o $RUNNER_TEMP/remote-hub.js
          get $PROTECTED_NODE_ROOT/community-support-live.js -o $RUNNER_TEMP/remote-community.js
          get $PROTECTED_NODE_ROOT/index.js -o $RUNNER_TEMP/remote-index.js
          get $PROTECTED_NODE_ROOT/.env -o $RUNNER_TEMP/remote.env
          get $PROTECTED_RESTART_DIR/restart.txt -o $RUNNER_TEMP/remote-node-restart.txt
          get $PROTECTED_WEB_RESTART -o $RUNNER_TEMP/remote-web-restart.txt
          bye
          EOF
          timeout 300 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/prove.lftp" "$raw_host"
          cmp "$RUNNER_TEMP/hub-central-live.js" "$RUNNER_TEMP/remote-hub.js"
          cmp "$RUNNER_TEMP/community-support-live.js" "$RUNNER_TEMP/remote-community.js"
          cmp "$RUNNER_TEMP/patched-index.js" "$RUNNER_TEMP/remote-index.js"
          cmp "$RUNNER_TEMP/restart.txt" "$RUNNER_TEMP/remote-node-restart.txt"
          cmp "$RUNNER_TEMP/restart.txt" "$RUNNER_TEMP/remote-web-restart.txt"
          grep -Eq '^OPENAI_API_KEY=.+$' "$RUNNER_TEMP/remote.env"
          grep -Eq '^ONEWORLDZ_OPENAI_MODEL=gpt-4o-mini$' "$RUNNER_TEMP/remote.env"
          sha256sum "$RUNNER_TEMP/remote-hub.js" "$RUNNER_TEMP/remote-community.js" "$RUNNER_TEMP/remote-index.js"
          echo 'proved=true' >> "$GITHUB_OUTPUT"
          echo 'PROTECTED_GUARDED_BYTES=PASS'
          echo 'PROTECTED_HOSTINGER_WEB_RESTART_SENTINEL=PASS'

      - name: Prove live guarded API fingerprint
        id: live
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 36); do
            sleep 5
            root_code="$(curl --silent --show-error --location --connect-timeout 12 --max-time 20 -o "$RUNNER_TEMP/root" -w '%{http_code}' "https://$PROTECTED_DOMAIN/?proof=${GITHUB_SHA}-${GITHUB_RUN_ID}-${attempt}" || true)"
            gpt_code="$(curl --silent --show-error --location --connect-timeout 12 --max-time 20 -o "$RUNNER_TEMP/gpt.json" -w '%{http_code}' "https://$PROTECTED_DOMAIN/api/oneworldz-gpt/status?proof=${GITHUB_SHA}-${GITHUB_RUN_ID}-${attempt}" || true)"
            hub_code="$(curl --silent --show-error --location --connect-timeout 12 --max-time 20 -o "$RUNNER_TEMP/hub.json" -w '%{http_code}' "https://$PROTECTED_DOMAIN/api/hub-central/status?proof=${GITHUB_SHA}-${GITHUB_RUN_ID}-${attempt}" || true)"
            if [ "$root_code" = '200' ] && [ "$gpt_code" = '200' ] && [ "$hub_code" = '200' ] && node - <<'NODE'
          const fs=require('fs'), p=process.env.RUNNER_TEMP;
          const status=JSON.parse(fs.readFileSync(p+'/gpt.json','utf8'));
          const hub=JSON.parse(fs.readFileSync(p+'/hub.json','utf8'));
          if(status.ok!==true||status.openai_api_configured!==true) process.exit(1);
          if(status.guard_profile!=="oneworldz-public-low-cost-v1"||status.guard_enforced!==true) process.exit(1);
          if(status.model!=="gpt-4o-mini"||status.max_output_tokens!==320) process.exit(1);
          if(status.per_ip_limit_10m!==8||status.daily_request_limit!==1000) process.exit(1);
          if(status.payments_in_chat!==false||status.secrets_in_browser!==false) process.exit(1);
          if(hub.ok!==true||hub.oneworldz_gpt!=="configured"||hub.oneworldz_gpt_guard!=="oneworldz-public-low-cost-v1") process.exit(1);
          NODE
            then
              success=1
              echo 'PROTECTED_ONEWORLDZ_GPT_GUARD=PASS'
              cat "$RUNNER_TEMP/gpt.json"
              break
            fi
            echo "Protected startup convergence $attempt/36 root=$root_code gpt=$gpt_code hub=$hub_code"
          done
          test "$success" = 1
          echo 'proved=true' >> "$GITHUB_OUTPUT"

      - name: Capture sanitized runtime evidence on failure
        if: ${{ failure() }}
        shell: bash
        run: |
          set +e
          raw_host="$(cat "$RUNNER_TEMP/raw-host" 2>/dev/null)"
          [ -z "$raw_host" ] && exit 0
          cat > "$RUNNER_TEMP/evidence.lftp" <<EOF
          set cmd:fail-exit false
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          cls -l $PROTECTED_NODE_ROOT > $RUNNER_TEMP/root-list.txt
          cls -l $PROTECTED_RESTART_DIR > $RUNNER_TEMP/tmp-list.txt
          get $PROTECTED_NODE_ROOT/stderr.log -o $RUNNER_TEMP/stderr.log
          get $PROTECTED_NODE_ROOT/console.log -o $RUNNER_TEMP/console.log
          bye
          EOF
          timeout 120 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/evidence.lftp" "$raw_host" || true
          echo 'Protected runtime files:'; grep -v '\.env' "$RUNNER_TEMP/root-list.txt" | tail -50 || true
          echo 'Restart directory:'; cat "$RUNNER_TEMP/tmp-list.txt" || true
          for f in "$RUNNER_TEMP/stderr.log" "$RUNNER_TEMP/console.log"; do
            [ -s "$f" ] || continue
            echo "Sanitized tail: $(basename "$f")"
            tail -120 "$f" | sed -E 's/sk-[A-Za-z0-9_-]+/[OPENAI_KEY_MASKED]/g; s/(Bearer )[A-Za-z0-9._-]+/\1[TOKEN_MASKED]/g' | tail -80
          done
