name: Command Centre v4

on:
  push:
    branches: [main, clean-platform-v4]
    paths:
      - "platform/**"
      - "src/hub-central/live-v1.js"
      - "src/hub-central/preload.js"
      - "src/oneworldz-gpt/**"
      - "src/community-support/live-v1.js"
      - "test/oneworldz-gpt.test.js"
      - "test/hub-central-live-v1.test.js"
      - "index.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/command-centre-v4.yml"
  pull_request:
    paths:
      - "platform/**"
      - "src/hub-central/live-v1.js"
      - "src/hub-central/preload.js"
      - "src/oneworldz-gpt/**"
      - "src/community-support/live-v1.js"
      - "test/oneworldz-gpt.test.js"
      - "test/hub-central-live-v1.test.js"
      - "index.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/command-centre-v4.yml"

permissions:
  contents: read

env:
  PROTECTED_DOMAIN: cryptobotz.cryptoworldz.xyz
  PROTECTED_NODE_ROOT: /domains/cryptobotz.cryptoworldz.xyz/nodejs
  PROTECTED_WEB_RESTART: /domains/cryptobotz.cryptoworldz.xyz/public_html/tmp/restart.txt

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - run: docker build .

  protected-oneworldz-gpt:
    name: Deploy + prove protected guarded OneWorldz GPT
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify hard-locked managed entrypoint
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node --test test/oneworldz-gpt.test.js test/hub-central-live-v1.test.js
          node --check index.js
          grep -Fq 'require("./src/hub-central/preload")' index.js
          grep -Fq 'oneworldz-public-low-cost-v1' src/oneworldz-gpt/http.js
          grep -Fq 'model: "gpt-4o-mini"' src/hub-central/live-v1.js
          test -n "$OPENAI_API_KEY"; test -n "$HOSTINGER_API_TOKEN"
          test -n "$FTP_HOST"; test -n "$FTP_USERNAME"; test -n "$FTP_PASSWORD"
          echo "::add-mask::$OPENAI_API_KEY"; echo "::add-mask::$HOSTINGER_API_TOKEN"
          echo "::add-mask::$FTP_HOST"; echo "::add-mask::$FTP_USERNAME"; echo "::add-mask::$FTP_PASSWORD"
          echo 'PROTECTED_MANAGED_SOURCE=PASS'

      - name: Install protected runtime utilities
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Resolve Hostinger managed application
        shell: bash
        run: |
          set -euo pipefail
          domain_enc="$(node -p 'encodeURIComponent(process.env.PROTECTED_DOMAIN)')"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' \
            "https://developers.hostinger.com/api/hosting/v1/websites?domain=${domain_enc}&per_page=25" \
            -o "$RUNNER_TEMP/websites.json"
          username="$(node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/websites.json','utf8'));
          const d=process.env.PROTECTED_DOMAIN.toLowerCase();
          const row=(p.data||[]).find(x=>String(x.domain||'').toLowerCase()===d);
          if(!row?.username) process.exit(2);
          process.stdout.write(String(row.username));
          NODE
          )"
          test -n "$username"
          echo "::add-mask::$username"
          printf '%s' "$username" > "$RUNNER_TEMP/hostinger-username"
          echo 'HOSTINGER_MANAGED_APP_RESOLVED=PASS'

      - name: Preserve current protected environment before rebuild
        shell: bash
        run: |
          set -euo pipefail
          raw_host="$(printf '%s' "$FTP_HOST" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#^ftp://##' -e 's#^ftps://##' -e 's#/.*$##')"
          if [[ "$raw_host" != *:*:* && "$raw_host" == *:* ]]; then raw_host="${raw_host%%:*}"; fi
          printf '%s' "$raw_host" > "$RUNNER_TEMP/raw-host"
          cat > "$RUNNER_TEMP/get-env.lftp" <<EOF
          set cmd:fail-exit true
          set net:max-retries 2
          set net:timeout 25
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          get $PROTECTED_NODE_ROOT/.env -o $RUNNER_TEMP/protected.env
          bye
          EOF
          timeout 180 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/get-env.lftp" "$raw_host"
          test -s "$RUNNER_TEMP/protected.env"
          for key in BOT_TOKEN SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if grep -Eq "^${key}=.+$" "$RUNNER_TEMP/protected.env"; then echo "PRESERVED_${key}=PASS"; else echo "::error::Protected environment missing $key before rebuild"; exit 1; fi
          done
          echo 'PROTECTED_ENV_PRESERVED=PASS'

      - name: Wait for fresh Hostinger managed Git build
        shell: bash
        run: |
          set -euo pipefail
          username="$(cat "$RUNNER_TEMP/hostinger-username")"
          domain_enc="$(node -p 'encodeURIComponent(process.env.PROTECTED_DOMAIN)')"
          user_enc="$(HOSTINGER_USERNAME="$username" node -p 'encodeURIComponent(process.env.HOSTINGER_USERNAME)')"
          base="https://developers.hostinger.com/api/hosting/v1/accounts/${user_enc}/websites/${domain_enc}/nodejs"
          threshold="$(date -u -d '20 minutes ago' +%s)"
          for attempt in $(seq 1 72); do
            curl --fail --silent --show-error --location \
              -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' \
              "$base/builds?per_page=25" -o "$RUNNER_TEMP/builds.json"
            result="$(THRESHOLD="$threshold" node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/builds.json','utf8'));
          const threshold=Number(process.env.THRESHOLD||0)*1000;
          const rows=(p.data||[]).filter(x=>String(x.options?.source_type||'')==='git' && Date.parse(x.created_at||0)>=threshold).sort((a,b)=>Date.parse(b.created_at)-Date.parse(a.created_at));
          const active=(p.data||[]).filter(x=>!['completed','failed'].includes(String(x.state||'').toLowerCase()));
          const x=rows[0]||null;
          process.stdout.write(JSON.stringify({uuid:x?.uuid||'',state:x?.state||'missing',created_at:x?.created_at||'',active:active.length}));
          NODE
          )"
            echo "Hostinger managed build: $result"
            state="$(printf '%s' "$result" | jq -r '.state')"
            uuid="$(printf '%s' "$result" | jq -r '.uuid')"
            active="$(printf '%s' "$result" | jq -r '.active')"
            if [ -n "$uuid" ] && [ "$state" = completed ] && [ "$active" = 0 ]; then
              printf '%s' "$uuid" > "$RUNNER_TEMP/managed-build-uuid"
              echo "HOSTINGER_MANAGED_GIT_BUILD=PASS UUID=$uuid"
              exit 0
            fi
            if [ -n "$uuid" ] && [ "$state" = failed ]; then
              curl --silent --show-error --location \
                -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' \
                "$base/builds/$uuid/logs?from_line=0" | head -c 5000
              exit 1
            fi
            sleep 5
          done
          echo '::error::Fresh Hostinger managed Git build did not reach completed state.'
          exit 1

      - name: Restore protected environment with OpenAI guard settings
        shell: bash
        run: |
          set -euo pipefail
          OPENAI_API_KEY="$OPENAI_API_KEY" node - <<'NODE'
          const fs=require('fs');
          const p=process.env.RUNNER_TEMP+'/protected.env';
          let rows=fs.readFileSync(p,'utf8').split(/\r?\n/).filter(Boolean);
          rows=rows.filter(x=>!/^OPENAI_API_KEY=/.test(x)&&!/^ONEWORLDZ_OPENAI_MODEL=/.test(x));
          rows.push(`OPENAI_API_KEY=${process.env.OPENAI_API_KEY}`,'ONEWORLDZ_OPENAI_MODEL=gpt-4o-mini');
          fs.writeFileSync(p,rows.join('\n')+'\n');
          NODE
          for key in BOT_TOKEN SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY OPENAI_API_KEY; do grep -Eq "^${key}=.+$" "$RUNNER_TEMP/protected.env"; done
          grep -Eq '^ONEWORLDZ_OPENAI_MODEL=gpt-4o-mini$' "$RUNNER_TEMP/protected.env"
          raw_host="$(cat "$RUNNER_TEMP/raw-host")"
          cat > "$RUNNER_TEMP/put-env.lftp" <<EOF
          set cmd:fail-exit true
          set net:max-retries 2
          set net:timeout 25
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          put $RUNNER_TEMP/protected.env -o $PROTECTED_NODE_ROOT/.env
          bye
          EOF
          timeout 180 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/put-env.lftp" "$raw_host"
          echo 'PROTECTED_MANAGED_ENV=PASS'

      - name: Official Hostinger managed restart
        shell: bash
        run: |
          set -euo pipefail
          username="$(cat "$RUNNER_TEMP/hostinger-username")"
          domain_enc="$(node -p 'encodeURIComponent(process.env.PROTECTED_DOMAIN)')"
          user_enc="$(HOSTINGER_USERNAME="$username" node -p 'encodeURIComponent(process.env.HOSTINGER_USERNAME)')"
          url="https://developers.hostinger.com/api/hosting/v1/accounts/${user_enc}/websites/${domain_enc}/nodejs/server/restart"
          code="$(curl --silent --show-error --location --connect-timeout 15 --max-time 45 --request POST \
            -o "$RUNNER_TEMP/restart.json" -w '%{http_code}' \
            -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "$url")"
          case "$code" in
            200|201|202|204) echo "HOSTINGER_MANAGED_RESTART=PASS HTTP=$code" ;;
            *) cat "$RUNNER_TEMP/restart.json"; echo "::error::Hostinger restart HTTP $code"; exit 1 ;;
          esac

      - name: Prove protected production API live fingerprint
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 48); do
            sleep 5
            code="$(curl --silent --show-error --location --connect-timeout 12 --max-time 20 \
              -o "$RUNNER_TEMP/status.json" -w '%{http_code}' \
              "https://$PROTECTED_DOMAIN/api/oneworldz-gpt/status?proof=${GITHUB_SHA}-${GITHUB_RUN_ID}-${i}" || true)"
            if [ "$code" = 200 ] && STATUS="$RUNNER_TEMP/status.json" node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.STATUS,'utf8'));
          if(p.ok!==true||p.openai_api_configured!==true) process.exit(1);
          if(p.guard_profile!=="oneworldz-public-low-cost-v1"||p.guard_enforced!==true) process.exit(1);
          if(p.model!=="gpt-4o-mini"||p.max_output_tokens!==320) process.exit(1);
          if(p.per_ip_limit_10m!==8||p.daily_request_limit!==1000) process.exit(1);
          if(p.payments_in_chat!==false||p.secrets_in_browser!==false) process.exit(1);
          NODE
            then
              echo 'PROTECTED_ONEWORLDZ_GPT_PRODUCTION=PASS'
              cat "$RUNNER_TEMP/status.json"
              exit 0
            fi
            echo "Protected API convergence $i/48 HTTP=$code"
          done
          echo '::error::Protected production API live fingerprint failed.'
          exit 1
