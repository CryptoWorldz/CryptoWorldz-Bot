name: CryptoWorldz Zed Bot Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: Test and Verify Zed Bot
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and test Zed Bot
        run: npm run verify

      - name: Verify required project files
        run: |
          test -f package.json
          test -f package-lock.json
          test -f index.js
          test -f README.md
          test -f .well-known/openapi.yaml
          test -f openapi.yaml
          cmp .well-known/openapi.yaml openapi.yaml
          test -n "$(find supabase/migrations -type f -name '*.sql' -print -quit)"
          test ! -f .well-known/ai-plugin.json

      - name: Prevent committed environment files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.local$|\.production$|\.development$|\.test$)'; then
            echo "::error::An environment file is committed."
            exit 1
          fi

      - name: Scan for dangerous secret files
        run: |
          if git ls-files | grep -Ei \
            '\.(pem|key|p12|pfx)$|seed|private[-_]?key|service[-_]?role'; then
            echo "::error::A potentially sensitive file is committed."
            exit 1
          fi

      - name: Dependency security audit
        run: npm audit --audit-level=high
