name: OneWorldz Locked Checkpoint Resume

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/main.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: jayjay-chatgpt-oneworldz-single-rail
  cancel-in-progress: true

env:
  LOCKED_SOURCE_COMMIT: 3b52c7eae7834a33f1f74e312433644ea239904c
  LOCKED_SOURCE_RUN: "32219855385"
  LOCKED_STATIC_TREE: 295e0706bc033b294736d7f87dc6d36f783eaa3a
  LOCKED_CANDIDATE_FINGERPRINT: 47ceec16e10ff1f8fca8002c52c75b63781dab8cf6b44742d14ec78d1b4afb59
  PROTECTED_DOMAIN: cryptobotz.cryptoworldz.xyz
  PROTECTED_NODE_ROOT: /domains/cryptobotz.cryptoworldz.xyz/nodejs

jobs:
  checkpoint:
    name: Verify locked BUILD → TESTS → LIGHTHOUSE → DESKTOP checkpoint
    runs-on: ubuntu-latest
    outputs:
      static_tree: ${{ steps.authority.outputs.static_tree }}
      candidate_fingerprint: ${{ steps.authority.outputs.candidate_fingerprint }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish authenticated checkpoint start
        run: bash .github/publish-progress.sh CHECKPOINT STARTED

      - id: authority
        name: Prove checkpoint identity and recorded passes
        env:
          GH_AUTH: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git cat-file -e "$LOCKED_SOURCE_COMMIT^{commit}"
          test "$(git rev-parse HEAD:apps/oneworldz-ecosystem-release)" = "$LOCKED_STATIC_TREE"

          changed="$(git diff --name-only "$LOCKED_SOURCE_COMMIT" HEAD)"
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            case "$path" in
              .github/workflows/main.yml|.github/resume-locked-zed.sh|.github/resume-locked-static-deploy.sh|.github/resume-locked-live-proof.sh) ;;
              *) echo "::error::Checkpoint invalidated by changed path: $path"; exit 1 ;;
            esac
          done <<< "$changed"

          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_AUTH" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$LOCKED_SOURCE_RUN/jobs?per_page=100" \
            -o "$RUNNER_TEMP/checkpoint-jobs.json"
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/checkpoint-jobs.json','utf8'));
          const required=[
            'SUCCESS STORY 1 — BUILD',
            'SUCCESS STORY 2 — TESTS',
            'SUCCESS STORY 3 — LIGHTHOUSE 100',
            'Desktop + mobile candidate proof'
          ];
          for(const name of required){
            const job=(p.jobs||[]).find(x=>x.name===name);
            if(!job||job.status!=='completed'||job.conclusion!=='success'){
              console.error(`Checkpoint gate not proven: ${name}`);
              process.exit(1);
            }
          }
          NODE

          echo "static_tree=$LOCKED_STATIC_TREE" >> "$GITHUB_OUTPUT"
          echo "candidate_fingerprint=$LOCKED_CANDIDATE_FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo "LOCKED_CHECKPOINT=PASS source_run=$LOCKED_SOURCE_RUN static_tree=$LOCKED_STATIC_TREE fingerprint=$LOCKED_CANDIDATE_FINGERPRINT"

      - name: Publish authenticated checkpoint pass
        if: success()
        run: bash .github/publish-progress.sh CHECKPOINT PASS

      - name: Publish authenticated checkpoint failure
        if: failure()
        run: bash .github/publish-progress.sh CHECKPOINT FAIL

  zed:
    needs: checkpoint
    name: SUCCESS STORY 5 — ZED/MINIAPP checkpoint resume
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      BOT_TOKEN_SECRET: ${{ secrets.BOT_TOKEN }}
      SUPABASE_URL_SECRET: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY_SECRET: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish authenticated ZED resume start
        run: bash .github/publish-progress.sh ZED_MINIAPP STARTED

      - name: Refuse stale resume generation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD:apps/oneworldz-ecosystem-release)" = "$LOCKED_STATIC_TREE"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Repair, deploy and prove protected runtime
        run: bash .github/resume-locked-zed.sh

      - name: Publish authenticated ZED resume failure
        if: failure()
        run: bash .github/publish-progress.sh ZED_MINIAPP FAIL

  deploy:
    needs: [checkpoint, zed]
    name: SUCCESS STORY 6 — HOSTINGER checkpoint resume
    runs-on: ubuntu-latest
    timeout-minutes: 150
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish authenticated Hostinger resume start
        run: bash .github/publish-progress.sh HOSTINGER STARTED

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Refuse stale generation and materialize exact locked candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD:apps/oneworldz-ecosystem-release)" = "$LOCKED_STATIC_TREE"
          npm ci
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq imagemagick libavif-bin lftp
          npm run build:ecosystem-release
          got="$(node apps/oneworldz-ecosystem-release/fingerprint-candidate.mjs)"
          test "$got" = "$LOCKED_CANDIDATE_FINGERPRINT"
          echo "LOCKED_CANDIDATE_REBUILT_FOR_TRANSPORT=PASS $got"

      - name: Deploy and prove exact 18-site Hostinger fleet
        run: bash .github/resume-locked-static-deploy.sh

      - name: Publish authenticated Hostinger resume failure
        if: failure()
        run: bash .github/publish-progress.sh HOSTINGER FAIL

  live-proof:
    needs: deploy
    name: SUCCESS STORY 7 — LIVE PROOF checkpoint resume
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish authenticated live-proof resume start
        run: bash .github/publish-progress.sh LIVE_PROOF STARTED

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refuse stale live proof generation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD:apps/oneworldz-ecosystem-release)" = "$LOCKED_STATIC_TREE"

      - name: Install browser proof runtime
        working-directory: apps/oneworldz-ecosystem-release
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prove all 18 live sites and ZED remain live
        run: bash .github/resume-locked-live-proof.sh

      - name: Publish authenticated live-proof resume failure
        if: failure()
        run: bash .github/publish-progress.sh LIVE_PROOF FAIL

  record:
    needs: [checkpoint, live-proof]
    name: SUCCESS STORY 8 — FINAL locked checkpoint record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish authenticated final-record start
        run: bash .github/publish-progress.sh FINAL STARTED

      - name: Refuse stale final record
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD:apps/oneworldz-ecosystem-release)" = "$LOCKED_STATIC_TREE"

      - name: Record final 100 percent production pass
        shell: bash
        run: |
          set -euo pipefail
          state='deployments/oneworldz-19-total.request'
          set_key() {
            key="$1"; value="$2"
            if grep -q "^${key}=" "$state"; then
              sed -i "s#^${key}=.*#${key}=${value}#" "$state"
            else
              printf '%s=%s\n' "$key" "$value" >> "$state"
            fi
          }
          set_key final_100_percent_pass YES
          set_key final_pass_scope FULL_18_SITE_STATIC_PLUS_ZED_MINIAPP_AUTHENTICATED_PARTICIPANT_GPT_LIVE_PROOF
          set_key execution_phase COMPLETE
          set_key active_executor_run "$GITHUB_RUN_ID"
          set_key checkpoint_source_run "$LOCKED_SOURCE_RUN"
          set_key checkpoint_source_commit "$LOCKED_SOURCE_COMMIT"
          set_key approved_static_tree "$LOCKED_STATIC_TREE"
          set_key approved_candidate_fingerprint "$LOCKED_CANDIDATE_FINGERPRINT"
          set_key build_pass PASS
          set_key tests_pass PASS
          set_key chatgpt_preview_visual_pass PASS
          set_key seo_lighthouse_run "$LOCKED_SOURCE_RUN"
          set_key seo_lighthouse_score 100
          set_key seo_lighthouse_pass PASS
          set_key seo_required_before_deploy PASS
          set_key step5_production_write PASS
          set_key live_technical_pass PASS
          set_key live_visual_pass PASS
          set_key protected_oneworldz_gpt_production_proof "PASS_RUN_${GITHUB_RUN_ID}"
          set_key success_story_1_build PASS
          set_key success_story_2_tests PASS
          set_key success_story_3_lighthouse PASS
          set_key success_story_4_desktop_mobile PASS
          set_key success_story_5_zed_miniapp PASS
          set_key success_story_6_hostinger PASS
          set_key success_story_7_live_proof PASS
          set_key success_story_8_final PASS
          set_key next_action COMPLETE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$state"
          git commit -m 'RECORD JAYJAYTEAMDEV CHATGPT TOTAL DEPLOYMENT PASS'
          git push origin HEAD:main
          bash .github/publish-progress.sh FINAL PASS

      - name: Publish authenticated final-record failure
        if: failure()
        run: bash .github/publish-progress.sh FINAL FAIL
