name: JayJayTeamDev + ChatGPT Canonical Gate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: jayjay-chatgpt-oneworldz-single-rail
  cancel-in-progress: false

jobs:
  verify:
    name: Clean source + canonical build verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      phase: ${{ steps.state.outputs.phase }}
      static_tree: ${{ steps.state.outputs.static_tree }}
      preview_run_id: ${{ steps.state.outputs.preview_run_id }}
      approved_static_tree: ${{ steps.state.outputs.approved_static_tree }}
      preview_pass: ${{ steps.state.outputs.preview_pass }}
    steps:
      - name: Checkout exact main candidate
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - id: state
        name: Lock JayJayTeamDev + ChatGPT state and static tree
        shell: bash
        run: |
          set -euo pipefail
          request='deployments/oneworldz-19-total.request'
          test "$(sed -n 's/^state=//p' "$request" | tail -n1)" = 'TOTAL_DEPLOYMENT_PLAN_ACTIVE'
          test "$(sed -n 's/^owner_authority=//p' "$request" | tail -n1)" = 'PERFORM_TOTAL_DEPLOYMENT_PLAN'
          test "$(sed -n 's/^canonical_deployment_rail=//p' "$request" | tail -n1)" = 'ONE_AUTHENTICATED_HOSTINGER_STATIC_FLEET_RAIL'
          phase="$(sed -n 's/^execution_phase=//p' "$request" | tail -n1)"; phase="${phase:-IDLE}"
          preview_run_id="$(sed -n 's/^preview_run_id=//p' "$request" | tail -n1)"; preview_run_id="${preview_run_id:-NONE}"
          approved_static_tree="$(sed -n 's/^approved_static_tree=//p' "$request" | tail -n1)"; approved_static_tree="${approved_static_tree:-NONE}"
          preview_pass="$(sed -n 's/^chatgpt_preview_visual_pass=//p' "$request" | tail -n1)"; preview_pass="${preview_pass:-PENDING}"
          static_tree="$(git rev-parse HEAD:apps/oneworldz-ecosystem-release)"
          echo "phase=$phase" >> "$GITHUB_OUTPUT"
          echo "preview_run_id=$preview_run_id" >> "$GITHUB_OUTPUT"
          echo "approved_static_tree=$approved_static_tree" >> "$GITHUB_OUTPUT"
          echo "preview_pass=$preview_pass" >> "$GITHUB_OUTPUT"
          echo "static_tree=$static_tree" >> "$GITHUB_OUTPUT"
          {
            echo '## Canonical source lock'
            echo "- Phase: $phase"
            echo "- Static tree: $static_tree"
            echo '- Deployment rail: ONE_AUTHENTICATED_HOSTINGER_STATIC_FLEET_RAIL'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install locked runtime dependencies
        run: npm ci

      - name: Run full protected + static verification
        run: npm run verify

      - name: Run canonical ecosystem release tests
        run: npm --prefix apps/oneworldz-ecosystem-release test

      - name: Dependency security audit
        run: npm audit --audit-level=high

      - name: Upload immutable preview candidate
        if: ${{ steps.state.outputs.phase == 'PREVIEW' && github.event_name == 'push' && github.event.head_commit.message == 'PREPARE JAYJAYTEAMDEV CHATGPT TOTAL DEPLOYMENT' }}
        uses: actions/upload-artifact@v4
        with:
          name: oneworldz-candidate-${{ github.run_id }}
          path: apps/oneworldz-ecosystem-release/dist/ecosystem/
          if-no-files-found: error
          retention-days: 30

  preview:
    name: ChatGPT candidate desktop + mobile proof — NO PRODUCTION WRITE
    needs: verify
    if: ${{ needs.verify.outputs.phase == 'PREVIEW' && github.event_name == 'push' && github.event.head_commit.message == 'PREPARE JAYJAYTEAMDEV CHATGPT TOTAL DEPLOYMENT' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Download exact candidate built by verification job
        uses: actions/download-artifact@v4
        with:
          name: oneworldz-candidate-${{ github.run_id }}
          path: apps/oneworldz-ecosystem-release/dist/ecosystem
      - name: Install browser proof runtime
        working-directory: apps/oneworldz-ecosystem-release
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prove all 18 candidate sites at desktop and mobile sizes
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p visual-proof
          cd apps/oneworldz-ecosystem-release
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/targets.tsv"
          import { productionTargets } from './production-targets.mjs';
          for (const target of productionTargets) console.log([target.key,target.expectedTitle,target.requiredIdentityText,target.requiredIdentityImage].join('\t'));
          NODE
          test "$(wc -l < "$RUNNER_TEMP/targets.tsv" | tr -d ' ')" = '18' || exit 1
          failed=0
          while IFS=$'\t' read -r key title required_text required_image; do
            node browser-visual-proof.mjs \
              --name "$key" \
              --root "dist/ecosystem/$key" \
              --expected-title "$title" \
              --required-text "$required_text" \
              --required-image "$required_image" \
              --out "$GITHUB_WORKSPACE/visual-proof/$key" || failed=1
          done < "$RUNNER_TEMP/targets.tsv"
          test "$(find "$GITHUB_WORKSPACE/visual-proof" -mindepth 2 -maxdepth 2 -name visual-report.json | wc -l | tr -d ' ')" = '18' || failed=1
          test "$(find "$GITHUB_WORKSPACE/visual-proof" -mindepth 2 -maxdepth 2 -name desktop.png | wc -l | tr -d ' ')" = '18' || failed=1
          test "$(find "$GITHUB_WORKSPACE/visual-proof" -mindepth 2 -maxdepth 2 -name mobile.png | wc -l | tr -d ' ')" = '18' || failed=1
          exit "$failed"
      - name: Upload ChatGPT preview visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneworldz-preview-visual-${{ github.run_id }}
          path: visual-proof/
          if-no-files-found: error
          retention-days: 30

  hostinger-preflight:
    name: Authenticated read-only Hostinger proof — 18 static destinations
    needs: verify
    if: ${{ needs.verify.outputs.phase == 'PREFLIGHT' && github.event_name == 'push' && github.event.head_commit.message == 'PROVE HOSTINGER DESTINATIONS - NO PRODUCTION WRITE' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install read-only FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp

      - name: Build exact 18-target read-only map
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' > "$RUNNER_TEMP/targets.tsv"
          import { productionTargets } from './apps/oneworldz-ecosystem-release/production-targets.mjs';
          for (const target of productionTargets) console.log([target.key,target.domain,target.hostingerTransportDir].join('\t'));
          NODE
          test "$(wc -l < "$RUNNER_TEMP/targets.tsv" | tr -d ' ')" = '18'
          grep -F $'impactbased\timpactbased.oneworldz.com\tdomains/oneworldz.com/public_html/impactbased' "$RUNNER_TEMP/targets.tsv"
          ! grep -F 'domains/cryptoworldz.xyz/public_html/impactbased' "$RUNNER_TEMP/targets.tsv"

      - name: Authenticate exact Hostinger folders and compare public files — READ ONLY
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FTP_HOST"; test -n "$FTP_USERNAME"; test -n "$FTP_PASSWORD"
          echo "::add-mask::$FTP_HOST"; echo "::add-mask::$FTP_USERNAME"; echo "::add-mask::$FTP_PASSWORD"
          host="$(printf '%s' "$FTP_HOST" | sed -e 's#^ftp[s]*://##' -e 's#/.*$##')"
          if [[ "$host" != *:*:* && "$host" == *:* ]]; then host="${host%%:*}"; fi
          proof="$RUNNER_TEMP/hostinger-preflight"
          mkdir -p "$proof"
          : > "$proof/results.tsv"
          failed=0

          while IFS=$'\t' read -r key domain transport; do
            mkdir -p "$proof/$key"
            script="$proof/$key.lftp"
            {
              echo 'set cmd:fail-exit true'
              echo 'set net:max-retries 2'
              echo 'set net:timeout 30'
              echo 'set ftp:ssl-force true'
              echo 'set ftp:ssl-protect-data true'
              echo 'set ssl:verify-certificate true'
              echo 'set ssl:check-hostname false'
              printf 'cd "%s"\n' "$transport"
              echo 'pwd'
              echo 'cls -la'
              echo 'set cmd:fail-exit false'
              printf 'get "robots.txt" -o "%s/%s/robots.txt"\n' "$proof" "$key"
              printf 'get "index.html" -o "%s/%s/index.html"\n' "$proof" "$key"
              echo 'set cmd:fail-exit true'
              echo 'bye'
            } > "$script"
            if grep -Eiq '(^|[[:space:]])(put|mput|mkdir|rm|mv|chmod|mirror[[:space:]]+-R)([[:space:]]|$)' "$script"; then
              echo "::error::Write verb detected in read-only preflight for $key"
              exit 1
            fi
            if ! timeout 180 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $script" "$host" > "$proof/$key/ftp.log" 2>&1; then
              echo "::error::Authenticated Hostinger folder failed: $domain -> $transport"
              printf '%s\t%s\t%s\tFTP_AUTH_FAIL\n' "$key" "$domain" "$transport" >> "$proof/results.tsv"
              failed=1
              continue
            fi

            http_code="$(curl --silent --show-error --location --connect-timeout 15 --max-time 45 -o "$proof/$key/public-root.html" -w '%{http_code}' -H 'Cache-Control: no-cache, no-store' "https://$domain/?preflight=${GITHUB_RUN_ID}-${key}" || echo CURL_FAIL)"
            if [ "$http_code" = 'CURL_FAIL' ] || [ "$http_code" = '000' ]; then
              echo "::error::Public TLS/HTTP failed for $domain"
              printf '%s\t%s\t%s\tPUBLIC_TLS_FAIL\n' "$key" "$domain" "$transport" >> "$proof/results.tsv"
              failed=1
              continue
            fi

            match='NO_COMPARABLE_FILE'
            if [ -s "$proof/$key/robots.txt" ]; then
              if curl --fail --silent --show-error --location --connect-timeout 15 --max-time 45 -H 'Cache-Control: no-cache, no-store' "https://$domain/robots.txt?preflight=${GITHUB_RUN_ID}-${key}" -o "$proof/$key/public-robots.txt" \
                && cmp -s "$proof/$key/robots.txt" "$proof/$key/public-robots.txt"; then
                match='ROBOTS_BYTE_MATCH'
              fi
            fi
            if [ "$match" = 'NO_COMPARABLE_FILE' ] && [ -s "$proof/$key/index.html" ]; then
              if cmp -s "$proof/$key/index.html" "$proof/$key/public-root.html"; then match='INDEX_BYTE_MATCH'; fi
            fi

            if [ "$key" = 'impactbased' ]; then
              state='deployments/oneworldz-19-total.request'
              grep -Fq 'impactbased_subdomain_created_in_hostinger=CONFIRMED_BY_JAYJAYTEAMDEV' "$state"
              grep -Fq 'impactbased_public_ssl=CONFIRMED_LIVE_BY_JAYJAYTEAMDEV' "$state"
              if [ "$match" = 'NO_COMPARABLE_FILE' ]; then match='COMPOSITE_NEW_DEFAULT_SUBDOMAIN_ROOT_PROOF'; fi
            elif [ "$match" = 'NO_COMPARABLE_FILE' ]; then
              echo "::error::Could not byte-map public host to authenticated folder for $domain"
              failed=1
            fi

            printf '%s\t%s\t%s\t%s\tHTTP_%s\n' "$key" "$domain" "$transport" "$match" "$http_code" >> "$proof/results.tsv"
          done < "$RUNNER_TEMP/targets.tsv"

          test "$(wc -l < "$proof/results.tsv" | tr -d ' ')" = '18'
          cp "$proof/results.tsv" "$GITHUB_WORKSPACE/hostinger-preflight-results.tsv"
          cat "$proof/results.tsv"
          exit "$failed"

      - name: Upload non-secret Hostinger preflight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-readonly-preflight-${{ github.run_id }}
          path: hostinger-preflight-results.tsv
          if-no-files-found: warn
          retention-days: 30

      - name: Record no-write boundary
        if: always()
        run: |
          {
            echo '## HOSTINGER READ-ONLY PREFLIGHT'
            echo '- Production write: NO'
            echo '- Static destinations requested: 18'
            echo '- FTP operations allowed: cd / pwd / list / get only'
            echo '- No put, mkdir, rm, mv, chmod or reverse mirror is permitted in this job.'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-locked:
    name: Production write remains locked until Step 4 is recorded
    needs: verify
    if: ${{ needs.verify.outputs.phase == 'DEPLOY' }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo 'Production deployment is intentionally fail-closed until the authenticated read-only Hostinger Step 4 result is written into the canonical deployment record.'
          exit 1
