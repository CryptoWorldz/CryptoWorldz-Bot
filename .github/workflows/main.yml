name: OneWorldz Static Release

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/main.yml"
      - ".github/ftps-preflight.py"
      - ".github/prove-oneworldz-gpt-live.sh"
      - ".github/full-current-candidate-proof.sh"
      - ".github/full-current-live-proof.sh"
      - ".github/resume-locked-static-deploy.sh"
      - ".github/resume-locked-live-proof.sh"
      - ".github/lftp-compat.py"
      - "apps/oneworldz-ecosystem-release/**"
      - "deployments/oneworldz-19-total.request"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: oneworldz-static-release
  cancel-in-progress: false

jobs:
  static_release:
    name: PREFLIGHT → BUILD → CANDIDATE → 18 HOSTINGER ROOTS → LIVE PROOF
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies and repository FTPS transport
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          python3 -m py_compile .github/lftp-compat.py
          mkdir -p "$RUNNER_TEMP/oneworldz-bin"
          printf '%s\n' '#!/usr/bin/env bash' 'exec python3 "$GITHUB_WORKSPACE/.github/lftp-compat.py" "$@"' > "$RUNNER_TEMP/oneworldz-bin/lftp"
          chmod +x "$RUNNER_TEMP/oneworldz-bin/lftp"
          echo "$RUNNER_TEMP/oneworldz-bin" >> "$GITHUB_PATH"

      - name: Load canonical release contract
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' >> "$GITHUB_ENV"
          import { releaseContract } from './apps/oneworldz-ecosystem-release/release-contract.mjs';
          console.log(`MIN_PAGE_ROUTES=${releaseContract.pageRoutes}`);
          console.log(`STATIC_TARGETS=${releaseContract.staticTargets}`);
          console.log(`ARCHITECTURE_DESTINATIONS=${releaseContract.architectureDestinations}`);
          console.log(`PROTECTED_DOMAIN=${releaseContract.protectedDomain}`);
          NODE

      - name: Fail fast on Hostinger FTPS certificate
        shell: bash
        run: python3 .github/ftps-preflight.py

      - name: Build the final 18-site candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run check:structure
          npm run check
          npm run check:auto
          npm run build:ecosystem-release
          node --test apps/oneworldz-ecosystem-release/test/one-screen-architecture.test.mjs
          candidate_tree="$(git rev-parse HEAD:apps/oneworldz-ecosystem-release)"
          candidate_fingerprint="$(node apps/oneworldz-ecosystem-release/fingerprint-candidate.mjs)"
          test -n "$candidate_tree"
          test -n "$candidate_fingerprint"
          echo "CANDIDATE_TREE=$candidate_tree" >> "$GITHUB_ENV"
          echo "CANDIDATE_FINGERPRINT=$candidate_fingerprint" >> "$GITHUB_ENV"
          mkdir -p deployment-proof
          printf 'run_id=%s\ncommit=%s\ncandidate_tree=%s\ncandidate_fingerprint=%s\nstatic_transport_roots=%s\narchitecture_destinations=%s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$candidate_tree" "$candidate_fingerprint" "$STATIC_TARGETS" "$ARCHITECTURE_DESTINATIONS" > deployment-proof/current-build.txt
          echo "BUILD_FINAL_ONE_SCREEN=PASS tree=$candidate_tree fingerprint=$candidate_fingerprint"

      - name: Install browser proof runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium

      - name: Prove image integrity on all candidate routes
        shell: bash
        run: |
          set -euo pipefail
          node apps/oneworldz-ecosystem-release/audit-image-fit.mjs \
            --root apps/oneworldz-ecosystem-release/dist/ecosystem \
            --out audit-results
          grep -Fxq "FINAL_BUILT_PAGES=$MIN_PAGE_ROUTES" audit-results/visual-fit-summary.txt
          grep -Fxq "TARGETS=$STATIC_TARGETS" audit-results/visual-fit-summary.txt
          grep -Fxq 'ASPECT_MISMATCHES=0' audit-results/visual-fit-summary.txt
          grep -Fxq 'BROKEN_IMAGES=0' audit-results/visual-fit-summary.txt
          echo "CANDIDATE_IMAGE_GATE=PASS routes=$MIN_PAGE_ROUTES mismatch=0 broken=0"

      - name: Require Lighthouse SEO 100 on all 93 candidate routes
        shell: bash
        run: |
          set -euo pipefail
          export CHROME_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          npm run check:lighthouse-seo
          summary='apps/oneworldz-ecosystem-release/dist/seo-proof/summary.json'
          test "$(node -p "require('./' + process.argv[1]).pass" "$summary")" = 'true'
          test "$(node -p "require('./' + process.argv[1]).totalPages" "$summary")" = "$MIN_PAGE_ROUTES"
          test "$(node -p "require('./' + process.argv[1]).fullMarksPages" "$summary")" = "$MIN_PAGE_ROUTES"
          cp "$summary" deployment-proof/lighthouse-seo-summary.json
          echo 'LIGHTHOUSE_SEO_GATE=PASS routes=93 score=100'

      - name: Prove all 18 candidate sites in real browsers
        shell: bash
        run: |
          set -euo pipefail
          bash .github/full-current-candidate-proof.sh
          route_count="$(node -p "require('./deployment-proof/current-candidate-browser-summary.json').generated_page_routes")"
          test "$route_count" = "$MIN_PAGE_ROUTES"
          test "$(node -p "require('./deployment-proof/current-candidate-browser-summary.json').desktop_pages_audited")" = "$MIN_PAGE_ROUTES"
          test "$(node -p "require('./deployment-proof/current-candidate-browser-summary.json').mobile_pages_audited")" = "$MIN_PAGE_ROUTES"
          echo "PAGE_ROUTE_COUNT=$route_count" >> "$GITHUB_ENV"
          test "$(node apps/oneworldz-ecosystem-release/fingerprint-candidate.mjs)" = "$CANDIDATE_FINGERPRINT"
          echo 'CANDIDATE_BROWSER_GATE=PASS sites=18 routes=93 desktop=93 mobile=93'

      - name: Refuse stale source before production writes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD:apps/oneworldz-ecosystem-release)" = "$CANDIDATE_TREE"
          test "$(node apps/oneworldz-ecosystem-release/fingerprint-candidate.mjs)" = "$CANDIDATE_FINGERPRINT"
          echo 'CURRENT_MAIN_AUTHORITY=PASS'

      - name: Require healthy protected OneWorldz GPT before static writes
        shell: bash
        run: bash .github/prove-oneworldz-gpt-live.sh

      - name: Deploy exact candidate to all 18 Hostinger static destinations
        shell: bash
        run: |
          set -euo pipefail
          test "$(node apps/oneworldz-ecosystem-release/fingerprint-candidate.mjs)" = "$CANDIDATE_FINGERPRINT"
          bash .github/full-current-static-deploy.sh
          echo 'HOSTINGER_18_STATIC_DESTINATIONS=PASS'

      - name: Prove all 18 live sites plus protected Command Centre and GPT
        shell: bash
        run: |
          set -euo pipefail
          bash .github/full-current-live-proof.sh
          live_routes="$(node -p "require('./deployment-proof/live-fleet-summary.json').generated_page_routes")"
          test "$live_routes" = "$MIN_PAGE_ROUTES"
          test "$live_routes" = "$PAGE_ROUTE_COUNT"
          echo 'LIVE_FLEET_GATE=PASS static_sites=18 routes=93 protected_command_centre=PASS gpt=PASS'

      - name: Write final deployment record
        shell: bash
        run: |
          set -euo pipefail
          cat > deployment-proof/final.txt <<EOF
          record=ONEWORLDZ_ONE_SCREEN_FULL_PRODUCTION
          run_id=$GITHUB_RUN_ID
          commit=$GITHUB_SHA
          candidate_tree=$CANDIDATE_TREE
          candidate_fingerprint=$CANDIDATE_FINGERPRINT
          static_sites=$STATIC_TARGETS
          routes=$MIN_PAGE_ROUTES
          desktop_routes_proved=$MIN_PAGE_ROUTES
          mobile_routes_proved=$MIN_PAGE_ROUTES
          aspect_mismatches=0
          broken_images=0
          normal_page_scroll_failures=0
          lighthouse_seo=PASS
          protected_command_centre=PASS
          protected_oneworldz_gpt=PASS
          hostinger_deploy=PASS
          live_proof=PASS
          final=PASS
          EOF
          echo 'ONEWORLDZ_ONE_SCREEN_FULL_PRODUCTION=PASS'

      - name: Preserve production proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oneworldz-one-screen-production-${{ github.run_id }}
          path: |
            deployment-proof/
            audit-results/
            candidate-proof/
            live-proof/
          if-no-files-found: warn
          retention-days: 30
