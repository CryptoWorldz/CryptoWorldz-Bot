name: Legacy OneWorldz Full Fleet Rail — Disabled

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jayjay-chatgpt-oneworldz-single-rail
  cancel-in-progress: false

jobs:
  disabled:
    name: Full fleet rail intentionally disabled
    runs-on: ubuntu-latest
    steps:
      - name: Explain replacement deployment structure
        run: |
          echo 'LEGACY_FULL_FLEET_DEPLOYMENT=DISABLED'
          echo 'Bot and Mini App changes deploy through .github/workflows/zed-direct.yml.'
          echo 'The former automatic 18-site / Lighthouse / all-page rebuild is intentionally disabled.'
          echo 'A future website release rail must use visual checks that prove the intended live design and images before deployment.'
