name: CryptoWorldz Zed Bot Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: zed-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-verify:
    name: Test and Verify Zed Bot
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check JavaScript syntax
        run: |
          node --check index.js

          if [ -f db.js ]; then
            node --check db.js
          fi

          find commands handlers services utils config \
            -type f -name "*.js" \
            -exec node --check {} \; 2>/dev/null || true

      - name: Run automated tests
        run: |
          if npm pkg get scripts.test | grep -qv null; then
            npm test
          else
            echo "No automated test script exists yet."
          fi

      - name: Verify required project files
        run: |
          test -f package.json
          test -f index.js

          if [ ! -f README.md ]; then
            echo "::warning::README.md is missing"
          fi

          if [ ! -f .well-known/openapi.yaml ]; then
            echo "::warning::.well-known/openapi.yaml is missing"
          fi

      - name: Prevent committed environment files
        run: |
          if git ls-files | grep -E '(^|/)\.env($|\.)'; then
            echo "::error::An environment file is committed."
            exit 1
          fi

      - name: Scan for dangerous secret files
        run: |
          if git ls-files | grep -Ei \
            '\.(pem|key|p12|pfx)$|seed|private[-_]?key|service[-_]?role'; then
            echo "::error::A potentially sensitive file is committed."
            exit 1
          fi

      - name: Dependency security audit
        run: npm audit --audit-level=high
