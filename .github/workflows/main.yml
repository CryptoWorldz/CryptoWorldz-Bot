name: OneWorldz Canonical Full Rebuild Deployment

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/main.yml"
      - ".github/full-current-*.sh"
      - ".github/resume-locked-zed.sh"
      - ".github/resume-locked-static-deploy.sh"
      - ".github/resume-locked-live-proof.sh"
      - ".github/install-ci-apt-wrapper.cjs"
      - ".github/lftp-compat.py"
      - "apps/oneworldz-ecosystem-release/**"
      - "src/**"
      - "public/**"
      - "index.js"
      - "package.json"
      - "package-lock.json"
      - "tools/**"
      - "deployments/oneworldz-19-total.request"
      - "governance/JAYJAY-CHATGPT-DEPLOYMENT-GATE.md"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: jayjay-chatgpt-oneworldz-single-rail
  cancel-in-progress: false

env:
  MIN_PAGE_ROUTES: "83"
  PROTECTED_DOMAIN: cryptobotz.cryptoworldz.xyz
  PROTECTED_NODE_ROOT: /domains/cryptobotz.cryptoworldz.xyz/nodejs

jobs:
  full_rebuild_deploy:
    name: FULL CURRENT ECOSYSTEM → BUILD → TEST → SEO → ROUTES → ZED CORE → GPT EXTENSION → HOSTINGER → LIVE → FINAL
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      BOT_TOKEN_SECRET: ${{ secrets.BOT_TOKEN }}
      SUPABASE_URL_SECRET: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY_SECRET: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install bounded package-network guard
        run: node .github/install-ci-apt-wrapper.cjs

      - name: Install repository-owned FTPS transport
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/lftp-compat.py
          python3 .github/lftp-compat.py --version
          mkdir -p "$RUNNER_TEMP/oneworldz-bin"
          cat > "$RUNNER_TEMP/oneworldz-bin/lftp" <<'SH'
          #!/usr/bin/env bash
          exec python3 "$GITHUB_WORKSPACE/.github/lftp-compat.py" "$@"
          SH
          chmod +x "$RUNNER_TEMP/oneworldz-bin/lftp"
          echo "$RUNNER_TEMP/oneworldz-bin" >> "$GITHUB_PATH"
          echo 'REPOSITORY_FTPS_TRANSPORT=READY'

      - name: Install current runtime dependencies
        run: npm ci

      - name: BUILD current main candidate
        shell: bash
        run: |
          set -euo pipefail
          bash .github/publish-progress.sh BUILD STARTED
          trap 'bash .github/publish-progress.sh BUILD FAIL || true' ERR
          npm run check:structure
          npm run check
          npm run build:ecosystem-release
          candidate_tree="$(git rev-parse HEAD:apps/oneworldz-ecosystem-release)"
          candidate_fingerprint="$(node apps/oneworldz-ecosystem-release/fingerprint-candidate.mjs)"
          test -n "$candidate_tree"
          test -n "$candidate_fingerprint"
          echo "CANDIDATE_TREE=$candidate_tree" >> "$GITHUB_ENV"
          echo "CANDIDATE_FINGERPRINT=$candidate_fingerprint" >> "$GITHUB_ENV"
          mkdir -p deployment-proof
          printf 'run_id=%s\ncommit=%s\ncandidate_tree=%s\ncandidate_fingerprint=%s\ncandidate_policy=BUILD_CURRENT_MAIN_THEN_FREEZE_WITHIN_RUN\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "$candidate_tree" "$candidate_fingerprint" \
            > deployment-proof/current-build.txt
          trap - ERR
          bash .github/publish-progress.sh BUILD PASS
          echo "BUILD_CURRENT_MAIN=PASS tree=$candidate_tree fingerprint=$candidate_fingerprint"

      - name: TEST full Command Centre and ecosystem
        shell: bash
        run: |
          set -euo pipefail
          bash .github/publish-progress.sh TESTS STARTED
          trap 'bash .github/publish-progress.sh TESTS FAIL || true' ERR
          npm test
          npm --prefix apps/oneworldz-ecosystem-release test
          npm run check:web
          npm run check:auto
          trap - ERR
          bash .github/publish-progress.sh TESTS PASS
          echo 'FULL_COMMAND_CENTRE_AND_ECOSYSTEM_TESTS=PASS'

      - name: LIGHTHOUSE SEO 100
        shell: bash
        run: |
          set -euo pipefail
          bash .github/publish-progress.sh LIGHTHOUSE STARTED
          trap 'bash .github/publish-progress.sh LIGHTHOUSE FAIL || true' ERR
          npm run check:lighthouse-seo
          trap - ERR
          bash .github/publish-progress.sh LIGHTHOUSE PASS
          echo 'LIGHTHOUSE_SEO_100=PASS'

      - name: Install browser proof runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium

      - name: DESKTOP + MOBILE all generated page routes
        shell: bash
        run: |
          set -euo pipefail
          bash .github/publish-progress.sh DESKTOP_MOBILE STARTED
          trap 'bash .github/publish-progress.sh DESKTOP_MOBILE FAIL || true' ERR
          bash .github/full-current-candidate-proof.sh
          route_count="$(node -p "require('./deployment-proof/current-candidate-browser-summary.json').generated_page_routes")"
          test "$route_count" -ge "$MIN_PAGE_ROUTES"
          echo "PAGE_ROUTE_COUNT=$route_count" >> "$GITHUB_ENV"
          current_fingerprint="$(node apps/oneworldz-ecosystem-release/fingerprint-candidate.mjs)"
          test "$current_fingerprint" = "$CANDIDATE_FINGERPRINT"
          trap - ERR
          bash .github/publish-progress.sh DESKTOP_MOBILE PASS
          echo "DESKTOP_MOBILE_FULL_PAGE_FLEET=PASS routes=$route_count"

      - name: Refuse superseded generation before first production write
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD:apps/oneworldz-ecosystem-release)" = "$CANDIDATE_TREE"
          test "$(node apps/oneworldz-ecosystem-release/fingerprint-candidate.mjs)" = "$CANDIDATE_FINGERPRINT"
          echo 'CURRENT_MAIN_AUTHORITY_BEFORE_PRODUCTION=PASS'

      - name: Deploy and prove standalone ZED Core
        shell: bash
        run: |
          set -euo pipefail
          bash .github/publish-progress.sh ZED_CORE STARTED
          trap 'bash .github/publish-progress.sh ZED_CORE FAIL || true' ERR
          zed_log="$RUNNER_TEMP/zed-runtime.log"
          legacy_status=0
          if bash .github/full-current-zed-runtime.sh 2>&1 | tee "$zed_log"; then
            legacy_status=0
          else
            legacy_status=1
          fi

          if [ "$legacy_status" != 0 ]; then
            # The legacy runtime script historically coupled ZED health to the
            # OneWorldz GPT extension. It may be treated as a ZED Core pass only
            # when its own convergence evidence proves every core surface green
            # and the sole remaining predicate is gpt_contract=0.
            grep -Eq 'ZED_CONVERGENCE attempt=[0-9]+ root=200 health=200 mini=200 gpt=200 root_service=1 health_ok=1 splashback=1 zed_guide=1 create=1 heroes=1 gpt_contract=0' "$zed_log"

            core_pass=0
            for attempt in $(seq 1 8); do
              tag="zed_core=${GITHUB_SHA}-${GITHUB_RUN_ID}-${attempt}"
              root_code="$(curl --silent --show-error --location --connect-timeout 5 --max-time 12 -o "$RUNNER_TEMP/zed-core-root.json" -w '%{http_code}' "https://$PROTECTED_DOMAIN/?$tag" || true)"
              health_code="$(curl --silent --show-error --location --connect-timeout 5 --max-time 12 -o "$RUNNER_TEMP/zed-core-health.json" -w '%{http_code}' "https://$PROTECTED_DOMAIN/health?$tag" || true)"
              mini_code="$(curl --silent --show-error --location --connect-timeout 5 --max-time 12 -o "$RUNNER_TEMP/zed-core-mini.html" -w '%{http_code}' "https://$PROTECTED_DOMAIN/miniapp/?$tag" || true)"
              root_service=0; health_ok=0; splashback=0; zed_guide=0; create=0; heroes=0
              grep -Fq '"service":"CryptoWorldz Zed Bot"' "$RUNNER_TEMP/zed-core-root.json" && root_service=1 || true
              grep -Fq '"ok":true' "$RUNNER_TEMP/zed-core-health.json" && health_ok=1 || true
              grep -Fq 'id="splashback"' "$RUNNER_TEMP/zed-core-mini.html" && splashback=1 || true
              grep -Fq 'id="zed-guide"' "$RUNNER_TEMP/zed-core-mini.html" && zed_guide=1 || true
              grep -Fq 'id="create"' "$RUNNER_TEMP/zed-core-mini.html" && create=1 || true
              grep -Fq 'id="heroes"' "$RUNNER_TEMP/zed-core-mini.html" && heroes=1 || true
              echo "ZED_CORE_PROBE attempt=$attempt/8 root=$root_code health=$health_code mini=$mini_code root_service=$root_service health_ok=$health_ok splashback=$splashback zed_guide=$zed_guide create=$create heroes=$heroes"
              if [ "$root_code" = 200 ] && [ "$health_code" = 200 ] && [ "$mini_code" = 200 ] \
                && [ "$root_service" = 1 ] && [ "$health_ok" = 1 ] && [ "$splashback" = 1 ] \
                && [ "$zed_guide" = 1 ] && [ "$create" = 1 ] && [ "$heroes" = 1 ]; then
                core_pass=1
                break
              fi
              sleep 4
            done
            test "$core_pass" = 1
          fi

          trap - ERR
          bash .github/publish-progress.sh ZED_CORE PASS
          echo 'CURRENT_STANDALONE_ZED_CORE=PASS'

      - name: Prove OneWorldz GPT extension independently
        shell: bash
        run: |
          set -euo pipefail
          bash .github/publish-progress.sh ONEWORLDZ_GPT_EXTENSION STARTED
          trap 'bash .github/publish-progress.sh ONEWORLDZ_GPT_EXTENSION FAIL || true' ERR
          bash .github/full-current-oneworldz-gpt-extension.sh
          trap - ERR
          bash .github/publish-progress.sh ONEWORLDZ_GPT_EXTENSION PASS
          echo 'CURRENT_ONEWORLDZ_GPT_EXTENSION=PASS'

      - name: Re-prove frozen static candidate after protected runtime deployment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:apps/oneworldz-ecosystem-release)" = "$CANDIDATE_TREE"
          test "$(node apps/oneworldz-ecosystem-release/fingerprint-candidate.mjs)" = "$CANDIDATE_FINGERPRINT"
          test -s deployment-proof/current-candidate-browser-summary.json
          echo "FROZEN_CURRENT_CANDIDATE=PASS routes=$PAGE_ROUTE_COUNT"

      - name: Verify repository FTPS transport client
        shell: bash
        run: |
          set -euo pipefail
          command -v lftp
          lftp --version
          echo 'STATIC_FTPS_TRANSPORT_CLIENT=READY'

      - name: Deploy current candidate to static transport roots
        shell: bash
        run: |
          set -euo pipefail
          bash .github/publish-progress.sh HOSTINGER STARTED
          trap 'bash .github/publish-progress.sh HOSTINGER FAIL || true' ERR
          bash .github/full-current-static-deploy.sh
          trap - ERR
          echo "HOSTINGER_STATIC_TRANSPORTS=PASS roots=18 routes=$PAGE_ROUTE_COUNT"

      - name: Reinstall browser proof runtime after ZED npm clean install
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium

      - name: LIVE PROOF all generated page routes
        shell: bash
        run: |
          set -euo pipefail
          bash .github/publish-progress.sh LIVE_PROOF STARTED
          trap 'bash .github/publish-progress.sh LIVE_PROOF FAIL || true' ERR
          bash .github/full-current-live-proof.sh
          live_routes="$(node -p "require('./deployment-proof/live-fleet-summary.json').generated_page_routes")"
          test "$live_routes" = "$PAGE_ROUTE_COUNT"
          trap - ERR
          echo "LIVE_FULL_ECOSYSTEM_PROOF=PASS routes=$live_routes static_transport_roots=18 architecture_destinations=19"

      - name: FINAL current candidate record
        shell: bash
        run: |
          set -euo pipefail
          bash .github/publish-progress.sh FINAL STARTED
          trap 'bash .github/publish-progress.sh FINAL FAIL || true' ERR
          test -s deployment-proof/current-build.txt
          test -s deployment-proof/current-candidate-browser-summary.json
          test -s deployment-proof/current-candidate.txt
          test -s deployment-proof/live-fleet-summary.json
          live_routes="$(node -p "require('./deployment-proof/live-fleet-summary.json').generated_page_routes")"
          candidate_routes="$(node -p "require('./deployment-proof/current-candidate-browser-summary.json').generated_page_routes")"
          test "$live_routes" = "$candidate_routes"
          test "$live_routes" -ge "$MIN_PAGE_ROUTES"
          cat > deployment-proof/final.txt <<EOF
          record=ONEWORLDZ_CANONICAL_FULL_REBUILD_FINAL
          run_id=$GITHUB_RUN_ID
          commit=$GITHUB_SHA
          candidate_tree=$CANDIDATE_TREE
          candidate_fingerprint=$CANDIDATE_FINGERPRINT
          generated_page_routes=$live_routes
          static_transport_roots=18
          architecture_destinations=19
          protected_command_centre=cryptobotz.cryptoworldz.xyz
          build=PASS
          tests=PASS
          lighthouse_seo=100_PASS
          desktop_mobile_all_generated_routes=PASS
          zed_core=PASS
          oneworldz_gpt_extension=PASS
          zed_auto_grace_command_centre=PASS
          hostinger_static_transports=PASS
          live_all_generated_routes=PASS
          final=PASS
          EOF
          trap - ERR
          bash .github/publish-progress.sh FINAL PASS
          echo "ONEWORLDZ_CANONICAL_FULL_REBUILD_FINAL=PASS routes=$live_routes fingerprint=$CANDIDATE_FINGERPRINT"

      - name: Preserve full deployment proof
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: oneworldz-current-full-deployment-proof-${{ github.run_id }}
          path: |
            deployment-proof/
            candidate-proof/
            live-proof/
          if-no-files-found: warn
          retention-days: 30
