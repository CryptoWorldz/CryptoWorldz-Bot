name: CryptoWorldz Second — Single Site Fix & Proof
# Stage 2 of the 19-destination recovery: perfect and deploy CryptoWorldz.xyz only.
# Static writes are locked to domains/cryptoworldz.xyz/public_html.
# The existing OneWorldz GPT protected backend is reused and updated only to allow
# the CryptoWorldz web origin; no second AI backend or browser secret is created.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/main.yml"
      - ".github/cryptoworldz-only-deploy.sh"
      - ".github/full-current-oneworldz-gpt-extension.sh"
      - ".github/operation-oneworldz-gpt.sh"
      - ".github/lftp-compat.py"
      - "src/hub-central/preload.js"
      - "src/oneworldz-gpt/**"
      - "tools/verify-deployment-structure.mjs"
      - "apps/oneworldz-ecosystem-release/**"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: cryptoworldz-second-single-site
  cancel-in-progress: true

env:
  PROTECTED_DOMAIN: cryptobotz.cryptoworldz.xyz
  PROTECTED_NODE_ROOT: /domains/cryptobotz.cryptoworldz.xyz/nodejs

jobs:
  cryptoworldz_only:
    name: CRYPTOWORLDZ BUILD → VISUAL PROOF → GPT SHARE → DEPLOY → LIVE PROOF
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install build and FTPS transport
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          python3 -m py_compile .github/lftp-compat.py
          bash -n .github/cryptoworldz-only-deploy.sh
          bash -n .github/full-current-oneworldz-gpt-extension.sh
          bash -n .github/operation-oneworldz-gpt.sh
          mkdir -p "$RUNNER_TEMP/cryptoworldz-bin"
          printf '%s\n' '#!/usr/bin/env bash' 'exec python3 "$GITHUB_WORKSPACE/.github/lftp-compat.py" "$@"' > "$RUNNER_TEMP/cryptoworldz-bin/lftp"
          chmod +x "$RUNNER_TEMP/cryptoworldz-bin/lftp"
          echo "$RUNNER_TEMP/cryptoworldz-bin" >> "$GITHUB_PATH"

      - name: Build exact CryptoWorldz candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run check:structure
          npm run build:ecosystem-release
          test -s apps/oneworldz-ecosystem-release/dist/ecosystem/cryptoworldz/index.html
          test -s apps/oneworldz-ecosystem-release/dist/ecosystem/cryptoworldz/release-manifest.json
          node apps/oneworldz-ecosystem-release/verify-cryptoworldz-perfect.mjs
          echo "CANDIDATE_TREE=$(git rev-parse HEAD:apps/oneworldz-ecosystem-release)" >> "$GITHUB_ENV"

      - name: Prove CryptoWorldz destination contract only
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { productionTargets } from './apps/oneworldz-ecosystem-release/production-targets.mjs';
          const target = productionTargets.find((item) => item.key === 'cryptoworldz');
          if (!target) throw new Error('CryptoWorldz target missing');
          if (target.domain !== 'cryptoworldz.xyz') throw new Error('CryptoWorldz domain drift');
          if (target.hostingerTransportDir !== 'domains/cryptoworldz.xyz/public_html') throw new Error('CryptoWorldz Hostinger destination drift');
          const root = 'apps/oneworldz-ecosystem-release/dist/ecosystem/cryptoworldz';
          const required = ['index.html','release-manifest.json','command-centre/index.html','miniapp/index.html','assets/css/cryptoworldz-perfect.css','assets/js/oneworldz-gpt.js','assets/support/davis-family/davis-family-hero.webp'];
          for (const rel of required) if (!fs.existsSync(`${root}/${rel}`)) throw new Error(`Missing CryptoWorldz output: ${rel}`);
          const home = fs.readFileSync(`${root}/index.html`, 'utf8');
          for (const token of ['data-visual-contract="cryptoworldz-main-image"','https://donateworldz.com/davis-family/','/assets/js/oneworldz-gpt.js','https://t.me/CryptoWorldzRaaiiiddTeam']) {
            if (!home.includes(token)) throw new Error(`Missing CryptoWorldz contract token: ${token}`);
          }
          console.log('CRYPTOWORLDZ_STATIC_CONTRACT=PASS');
          NODE

      - name: Prove every CryptoWorldz route on desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium
          node apps/oneworldz-ecosystem-release/browser-visual-proof.mjs \
            --name cryptoworldz-candidate \
            --root apps/oneworldz-ecosystem-release/dist/ecosystem/cryptoworldz \
            --out candidate-proof/cryptoworldz \
            --expected-title 'CryptoWorldz | One World • One Mission' \
            --required-text 'CryptoWorldz' \
            --required-image 'zed-command-centre|blockchain-portal'
          bash .github/publish-progress.sh CRYPTOWORLDZ_CANDIDATE PASS

      - name: Deploy shared OneWorldz GPT origin support
        shell: bash
        run: |
          set -euo pipefail
          bash .github/full-current-oneworldz-gpt-extension.sh
          headers="$RUNNER_TEMP/cryptoworldz-gpt-cors.txt"
          curl --silent --show-error --dump-header "$headers" --output /dev/null \
            --request OPTIONS \
            -H 'Origin: https://cryptoworldz.xyz' \
            -H 'Access-Control-Request-Method: POST' \
            "https://$PROTECTED_DOMAIN/api/oneworldz-gpt/chat"
          tr -d '\r' < "$headers" | grep -Fqi 'Access-Control-Allow-Origin: https://cryptoworldz.xyz'
          echo 'CRYPTOWORLDZ_SHARED_GPT_CORS=PASS'

      - name: Refuse stale source and recheck exact CryptoWorldz destination
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD:apps/oneworldz-ecosystem-release)" = "$CANDIDATE_TREE"
          node --input-type=module <<'NODE'
          import { productionTargets } from './apps/oneworldz-ecosystem-release/production-targets.mjs';
          const t = productionTargets.find((x) => x.key === 'cryptoworldz');
          if (!t || t.domain !== 'cryptoworldz.xyz' || t.hostingerTransportDir !== 'domains/cryptoworldz.xyz/public_html') process.exit(1);
          console.log(`CRYPTOWORLDZ_DESTINATION_LOCK=${t.domain}\t${t.hostingerTransportDir}`);
          NODE

      - name: Backup, deploy and byte-prove CryptoWorldz only
        shell: bash
        run: |
          set -euo pipefail
          bash .github/cryptoworldz-only-deploy.sh
          bash .github/publish-progress.sh CRYPTOWORLDZ_HOSTINGER PASS

      - name: Prove live CryptoWorldz desktop and mobile routes
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright
          npx playwright install chromium
          node apps/oneworldz-ecosystem-release/browser-visual-proof.mjs \
            --name cryptoworldz-live \
            --url https://cryptoworldz.xyz/ \
            --out live-proof/cryptoworldz \
            --expected-title 'CryptoWorldz | One World • One Mission' \
            --required-text 'CryptoWorldz' \
            --required-image 'zed-command-centre|blockchain-portal'
          node apps/oneworldz-ecosystem-release/verify-cryptoworldz-perfect.mjs
          bash .github/publish-progress.sh CRYPTOWORLDZ_FINAL PASS
          echo 'CRYPTOWORLDZ_SECOND_SITE=PASS VISUAL=PASS LINKS=PASS DAVIS=PASS GPT=PASS FIT=PASS'

      - name: Publish failure state
        if: failure()
        shell: bash
        run: bash .github/publish-progress.sh CRYPTOWORLDZ_SECOND_SITE FAIL || true

      - name: Preserve CryptoWorldz proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptoworldz-second-site-${{ github.run_id }}
          path: |
            deployment-proof/
            candidate-proof/cryptoworldz/
            live-proof/cryptoworldz/
          if-no-files-found: warn
          retention-days: 30
