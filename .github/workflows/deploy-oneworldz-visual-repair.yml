name: Deploy OneWorldz Visual Repair

on:
  push:
    branches: [main]
    paths:
      - 'deployments/oneworldz-visual-repair.request'

permissions:
  contents: read

concurrency:
  group: deploy-oneworldz-visual-repair
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: oneworldz-production
      url: https://oneworldz.com
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      LIVE_URL: https://oneworldz.com
      EXPECTED_TEXT: One Vision
      PROOF_MEDIA: assets/images/website-core/oneworldz/oneworldz-one-vision-one-future.webp
    steps:
      - name: Checkout request commit and candidate parent
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Prove request and lock exact candidate
        shell: bash
        run: |
          set -euo pipefail
          request='deployments/oneworldz-visual-repair.request'
          test -s "$request"
          source_commit="$(sed -n 's/^source_commit=//p' "$request" | tail -n1)"
          test "$(sed -n 's/^target=//p' "$request" | tail -n1)" = 'oneworldz.com'
          test "$(sed -n 's/^authorization=//p' "$request" | tail -n1)" = 'GO'
          test "$source_commit" = '${{ github.event.before }}'
          git cat-file -e "$source_commit^{commit}"
          git checkout --detach "$source_commit"
          test "$(git rev-parse HEAD)" = "$source_commit"
          test -s apps/cryptoworldz-web-core/assets/oneworldz-next.js
          test -s apps/cryptoworldz-web-core/assets/oneworldz-live-fix.css
          ! grep -Eqi 'NEXT PASS' apps/cryptoworldz-web-core/assets/oneworldz-next.js
          grep -Fq 'https://donateworldz.com/reagan-children/' apps/cryptoworldz-web-core/assets/oneworldz-next.js
          grep -Fq 'https://impactbased.cryptoworldz.xyz/' apps/cryptoworldz-web-core/assets/oneworldz-next.js
          grep -Fq 'oneworldz-live-fix.css' apps/cryptoworldz-web-core/assets/site-router.js
          grep -Fq '20260816-oneworldz-visual2' apps/cryptoworldz-web-core/index.html
          echo 'Exact OneWorldz visual-repair candidate authorised and locked.'

      - name: Install build and FTPS tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          npm ci

      - name: Verify and stage exact public release
        shell: bash
        run: |
          set -euo pipefail
          npm run verify:web
          rm -rf dist/worldz-shared
          mkdir -p dist/worldz-shared
          node tools/worldz-upload-manifest.mjs apps/cryptoworldz-web-core "$RUNNER_TEMP/worldz-manifest.txt"
          rsync -a --files-from="$RUNNER_TEMP/worldz-manifest.txt" apps/cryptoworldz-web-core/ dist/worldz-shared/
          test -s dist/worldz-shared/index.html
          test -s dist/worldz-shared/assets/oneworldz-next.js
          test -s dist/worldz-shared/assets/oneworldz-live-fix.css

      - name: Prove Hostinger account target and CA-verified FTPS login
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOSTINGER_API_TOKEN"
          api='https://developers.hostinger.com'
          auth="Authorization: Bearer $HOSTINGER_API_TOKEN"
          websites="$(curl --fail --silent --show-error -H "$auth" -H 'Accept: application/json' "$api/api/hosting/v1/websites")"
          printf '%s' "$websites" | jq -e '.data[] | select(.domain=="oneworldz.com" and .is_enabled==true)' >/dev/null
          raw_host="$(printf '%s' "$FTP_HOST" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#^ftp://##' -e 's#^ftps://##' -e 's#/.*$##')"
          if [[ "$raw_host" != *:*:* && "$raw_host" == *:* ]]; then raw_host="${raw_host%%:*}"; fi
          test -n "$raw_host"
          echo "::add-mask::$raw_host"
          echo "::add-mask::$FTP_USERNAME"
          echo "::add-mask::$FTP_PASSWORD"
          printf '%s' "$raw_host" > "$RUNNER_TEMP/ftp-connect-host"
          cat > "$RUNNER_TEMP/preflight.lftp" <<'EOF'
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set ssl:check-hostname no
          cls -1 /
          bye
          EOF
          timeout 120 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" "$raw_host" < "$RUNNER_TEMP/preflight.lftp" > "$RUNNER_TEMP/ftps-preflight.txt"
          test -s "$RUNNER_TEMP/ftps-preflight.txt"
          echo 'Hostinger account target and CA-verified FTPS login passed.'

      - name: Back up complete current OneWorldz release
        shell: bash
        run: |
          set -euo pipefail
          raw_host="$(cat "$RUNNER_TEMP/ftp-connect-host")"
          mkdir -p "$RUNNER_TEMP/oneworldz-backup"
          cat > "$RUNNER_TEMP/backup.lftp" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set ssl:check-hostname no
          cd /
          lcd "$RUNNER_TEMP/oneworldz-backup"
          mirror --verbose . .
          bye
          EOF
          timeout 600 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" "$raw_host" < "$RUNNER_TEMP/backup.lftp"
          find "$RUNNER_TEMP/oneworldz-backup" -type f -print -quit | grep -q .
          echo 'Exact pre-deployment OneWorldz backup completed.'

      - name: Upload repaired release with index last
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          raw_host="$(cat "$RUNNER_TEMP/ftp-connect-host")"
          cat > "$RUNNER_TEMP/upload.lftp" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set ssl:check-hostname no
          cd /
          lcd "$GITHUB_WORKSPACE/dist/worldz-shared"
          mirror -R --verbose --exclude-glob index.html . .
          put index.html -o index.html
          bye
          EOF
          timeout 900 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" "$raw_host" < "$RUNNER_TEMP/upload.lftp"
          echo 'written=true' >> "$GITHUB_OUTPUT"
          echo 'Repaired OneWorldz release uploaded.'

      - name: Re-prove FTPS login after write
        shell: bash
        run: |
          set -euo pipefail
          raw_host="$(cat "$RUNNER_TEMP/ftp-connect-host")"
          cat > "$RUNNER_TEMP/postflight.lftp" <<'EOF'
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set ssl:check-hostname no
          cls -1 /
          bye
          EOF
          timeout 120 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" "$raw_host" < "$RUNNER_TEMP/postflight.lftp" >/dev/null
          echo 'Post-write CA-verified FTPS proof passed.'

      - name: Prove exact repaired assets reached public CDN
        id: public
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in $(seq 1 30); do
            router="$(curl --fail --silent --show-error --connect-timeout 15 --max-time 30 -H 'Cache-Control: no-cache' "$LIVE_URL/assets/site-router.js?v=${GITHUB_RUN_ID}-$attempt" || true)"
            page="$(curl --fail --silent --show-error --connect-timeout 15 --max-time 30 -H 'Cache-Control: no-cache' "$LIVE_URL/assets/oneworldz-next.js?v=${GITHUB_RUN_ID}-$attempt" || true)"
            css="$(curl --fail --silent --show-error --connect-timeout 15 --max-time 30 -H 'Cache-Control: no-cache' "$LIVE_URL/assets/oneworldz-live-fix.css?v=${GITHUB_RUN_ID}-$attempt" || true)"
            index="$(curl --fail --silent --show-error --connect-timeout 15 --max-time 30 -H 'Cache-Control: no-cache' "$LIVE_URL/?release=${GITHUB_RUN_ID}-$attempt" || true)"
            if printf '%s' "$router" | grep -Fq 'oneworldz-live-fix.css' \
              && printf '%s' "$page" | grep -Fq 'reagan-children/' \
              && ! printf '%s' "$page" | grep -Eqi 'NEXT PASS' \
              && printf '%s' "$page" | grep -Fq 'One Connected Gateway' \
              && printf '%s' "$css" | grep -Fq 'owz-fixed-hero' \
              && printf '%s' "$index" | grep -Fq '20260816-oneworldz-visual2'; then
              success=1
              break
            fi
            echo "Waiting for repaired OneWorldz assets at CDN ($attempt/30)..."
            sleep 10
          done
          test "$success" = 1
          echo 'proved=true' >> "$GITHUB_OUTPUT"
          echo 'Repaired OneWorldz JS/CSS/index assets are publicly live.'

      - name: Prove live desktop and mobile render
        id: visual
        shell: bash
        env:
          WORLDZ_PROOF_DIR: ${{ runner.temp }}/oneworldz-live-proof
        run: |
          set -euo pipefail
          mkdir -p "$WORLDZ_PROOF_DIR"
          node tools/prove-live-worldz-v2.mjs "$LIVE_URL/?visual-repair=${GITHUB_RUN_ID}" 'One Vision' "$PROOF_MEDIA"
          echo 'proved=true' >> "$GITHUB_OUTPUT"

      - name: Roll back exact pre-deployment release on failed live proof
        if: ${{ failure() && steps.upload.outputs.written == 'true' && (steps.public.outputs.proved != 'true' || steps.visual.outputs.proved != 'true') }}
        shell: bash
        run: |
          set -u
          raw_host="$(cat "$RUNNER_TEMP/ftp-connect-host" 2>/dev/null || true)"
          if [ -n "$raw_host" ] && find "$RUNNER_TEMP/oneworldz-backup" -type f -print -quit 2>/dev/null | grep -q .; then
            cat > "$RUNNER_TEMP/rollback.lftp" <<EOF
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set ssl:check-hostname no
          cd /
          lcd "$RUNNER_TEMP/oneworldz-backup"
          mirror -R --delete --verbose . .
          bye
          EOF
            timeout 900 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" "$raw_host" < "$RUNNER_TEMP/rollback.lftp" || true
            echo 'Rollback attempted from exact pre-deployment backup.'
          else
            echo '::error::Rollback requested but exact backup was unavailable.'
          fi

      - name: Upload live visual proof evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: oneworldz-visual-repair-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/oneworldz-live-proof/
            ${{ runner.temp }}/ftps-preflight.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Final OneWorldz approval gate
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.public.outputs.proved }}' = 'true'
          test '${{ steps.visual.outputs.proved }}' = 'true'
          echo 'ONEWORLDZ VISUAL REPAIR LIVE PROOF PASSED.'
