name: Publish OneWorldz Heroes Now

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-heroes-now.yml"
      - "tools/apply_heroes_worldz.py"
      - "oneworldz.com/assets/heroes/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oneworldz-heroes-now
  cancel-in-progress: true

jobs:
  publish-heroes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
    steps:
      - uses: actions/checkout@v4

      - name: Build approved Heroes package
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/build_ecosystem.py
          python3 tools/apply_visual_fixes.py
          python3 tools/apply_facebook_support.py
          python3 tools/remove_retired_uganda_support.py
          python3 tools/apply_mobile_safety.py
          python3 tools/apply_jayjay_vision_57.py
          python3 tools/apply_mission_worldz.py
          python3 tools/apply_specialist_worldz.py
          python3 tools/apply_heroes_worldz.py
          python3 tools/apply_mobile_safety.py
          python3 tools/repair_stage_1_writing.py
          python3 tools/repair_stage_2_images.py
          python3 tools/repair_stage_3_other.py
          python3 tools/apply_global_image_overrides.py
          python3 tools/prune_public_bloat.py
          python3 - <<'PY'
          from pathlib import Path
          routes=[
              "heroes",
              "heroes/just-knate",
              "heroes/victor-good-boss",
              "heroes/sam-weidenhofer",
              "heroes/bi-phakathi",
              "heroes/mdmotivator",
              "heroes/dylan-thiry",
              "heroes/destination-inspiration",
          ]
          for route in routes:
              p=Path("oneworldz.com")/route/"index.html"
              assert p.is_file(), p
              text=p.read_text(encoding="utf-8")
              assert 'data-oneworldz-build=' in text
              assert 'data-oneworldz-heroes=' in text
          home=Path("oneworldz.com/heroes/index.html").read_text(encoding="utf-8")
          for name in ("Just Knate","Victor — The Good Boss","Sam Weidenhofer","Bi Phakathi","MDMotivator","Dylan Thiry"):
              assert name in home, name
          for banned in ("Reagan Kauja","Bob — The Giving Roofer","SolMotivator"):
              assert banned not in home, banned
          import hashlib
          expected_assets={"exact-just-knate.webp":"34b18d7a7b6cb2758c0d72add3c6c01a4082228772b52b74f55fd231f309f633","exact-victor-good-boss.webp":"7c3fff6894b2338d8ad773a40885c48623848bb019f31f8b4ce7b92490bb53fc","exact-sam-weidenhofer.webp":"7f311358707db8c46e5bc5b7f86f72f62a269171b77c44d67f48e85005e30b3d","exact-bi-phakathi.webp":"cd760066f91deb9aac199a0bf4f0680f639c39dc8f2668dd1b8434d21a8b2d5d","exact-mdmotivator.webp":"a6e8b9837b9baecfaacef9c3d7ccdddb95651261c3232824fc4b7c6bc81998e4","exact-dylan-thiry.webp":"235becfe9a5a47cf0bec21c0c8a117edbb91c94f4a51b7168050e7f02263077d","exact-purple-diamond-crew.webp":"b5e03f867b81fc18877e5a3025577f3089c8b7742198b9e4476725225d000ae2","exact-sounds-grounds.webp":"0a4cc8fd4b500e064d776c052e3cfe87a60db6b0f0b5235b7eab941d5c35a3a0","exact-uganda-on-ground.webp":"367e80535b6371e61e0d0a7a7683bd709f6fabc83a01ae81c59790fecbaa8925","exact-uganda-global-support.webp":"055afbda011435d481baf675203f6381d0dca90bfd6a5f679ef54ab516566b90"}
          asset_root=Path("oneworldz.com/assets/heroes")
          for filename,want in expected_assets.items():
              p=asset_root/filename
              assert p.is_file(), ("missing-hero-asset",filename)
              got=hashlib.sha256(p.read_bytes()).hexdigest()
              assert got==want, ("wrong-hero-asset",filename,got,want)
          mapping_checks={
              "Just Knate":"exact-just-knate.webp",
              "Victor — The Good Boss":"exact-victor-good-boss.webp",
              "Sam Weidenhofer":"exact-sam-weidenhofer.webp",
              "Bi Phakathi":"exact-bi-phakathi.webp",
              "MDMotivator":"exact-mdmotivator.webp",
              "Dylan Thiry":"exact-dylan-thiry.webp",
          }
          for name,filename in mapping_checks.items():
              assert name in home and filename in home, ("hero-map",name,filename)
          assert "exact-purple-diamond-crew.webp" in home
          assert "exact-sounds-grounds.webp" in home
          print("HERO_ASSET_HASH_PASS exact_assets=10 mapping=6")
          print("HERO_PACKAGE=PASS routes=8 approved_heroes=6")
          PY

      - name: Publish Heroes files only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, ssl
          from ftplib import FTP_TLS, error_perm
          from pathlib import Path, PurePosixPath

          root=Path("oneworldz.com")
          remote_root=PurePosixPath("domains/oneworldz.com/public_html")
          files=[]
          files += sorted(p for p in (root/"heroes").rglob("*") if p.is_file())
          files += sorted(p for p in (root/"assets"/"heroes").rglob("*") if p.is_file())
          for rel in ("style.css","mobile-safe.css","global-image-overrides.css"):
              p=root/rel
              if p.is_file(): files.append(p)

          ftp=FTP_TLS(context=ssl._create_unverified_context())
          ftp.connect(os.environ["FTP_HOST"],int(os.environ.get("FTP_PORT","21")),timeout=45)
          ftp.login(os.environ["FTP_USERNAME"],os.environ["FTP_PASSWORD"])
          ftp.prot_p(); ftp.set_pasv(True)

          def ensure(directory):
              ftp.cwd("/")
              for part in PurePosixPath(directory).parts:
                  if part in ("","/"): continue
                  try: ftp.cwd(part)
                  except error_perm:
                      ftp.mkd(part); ftp.cwd(part)

          count=0
          try:
              for f in files:
                  rel=f.relative_to(root).as_posix()
                  remote=remote_root/rel
                  ensure(str(remote.parent))
                  with f.open("rb") as h:
                      ftp.storbinary("STOR "+remote.name,h,blocksize=262144)
                  count+=1
          finally:
              try: ftp.quit()
              except Exception:
                  try: ftp.close()
                  except Exception: pass
          print(f"HERO_PUBLISH=PASS files={count}")
          PY

      - name: Verify Heroes live
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import time, urllib.request
          checks={
            "https://oneworldz.com/heroes/":["Just Knate","Victor — The Good Boss","Sam Weidenhofer","Bi Phakathi","MDMotivator","Dylan Thiry","Purple Diamond Crew"],
            "https://oneworldz.com/heroes/just-knate/":["Just Knate","facebook.com/justknate","Purple Diamond Crew"],
            "https://oneworldz.com/heroes/victor-good-boss/":["Victor — The Good Boss","facebook.com/victorthegoodboss","Purple Diamond Crew"],
            "https://oneworldz.com/heroes/sam-weidenhofer/":["Sam Weidenhofer","facebook.com/itssozer","Purple Diamond Crew"],
            "https://oneworldz.com/heroes/bi-phakathi/":["Bi Phakathi","facebook.com/biphakathi","Purple Diamond Crew"],
            "https://oneworldz.com/heroes/mdmotivator/":["MDMotivator","facebook.com/MdMotivatorOfficial","Purple Diamond Crew"],
            "https://oneworldz.com/heroes/dylan-thiry/":["Dylan Thiry","facebook.com/dylanthirypro","Purple Diamond Crew"],
            "https://oneworldz.com/heroes/destination-inspiration/":["Worldz Live","Sounds & Grounds","WOODSTOCK SPIRIT. WORLDZ ACTION.","Open invitation to P!NK","Uganda Pilot","UNDP 2025 MPI Data"],
          }
          for url,needles in checks.items():
              last=""
              for attempt in range(8):
                  try:
                      req=urllib.request.Request(url+"?heroesnow=1",headers={"User-Agent":"OneWorldz-Heroes-Verify/1.0","Cache-Control":"no-cache"})
                      with urllib.request.urlopen(req,timeout=25) as r:
                          body=r.read().decode("utf-8","ignore")
                          missing=[n for n in needles if n not in body]
                          if r.status==200 and not missing:
                              print("HERO_LIVE_PASS",url)
                              break
                          last=f"status={r.status} missing={missing}"
                  except Exception as e:
                      last=repr(e)
                  time.sleep(2+attempt)
              else:
                  raise SystemExit(f"HERO_LIVE_FAIL {url} {last}")
          import hashlib
          expected_assets={"exact-just-knate.webp":"34b18d7a7b6cb2758c0d72add3c6c01a4082228772b52b74f55fd231f309f633","exact-victor-good-boss.webp":"7c3fff6894b2338d8ad773a40885c48623848bb019f31f8b4ce7b92490bb53fc","exact-sam-weidenhofer.webp":"7f311358707db8c46e5bc5b7f86f72f62a269171b77c44d67f48e85005e30b3d","exact-bi-phakathi.webp":"cd760066f91deb9aac199a0bf4f0680f639c39dc8f2668dd1b8434d21a8b2d5d","exact-mdmotivator.webp":"a6e8b9837b9baecfaacef9c3d7ccdddb95651261c3232824fc4b7c6bc81998e4","exact-dylan-thiry.webp":"235becfe9a5a47cf0bec21c0c8a117edbb91c94f4a51b7168050e7f02263077d","exact-purple-diamond-crew.webp":"b5e03f867b81fc18877e5a3025577f3089c8b7742198b9e4476725225d000ae2","exact-sounds-grounds.webp":"0a4cc8fd4b500e064d776c052e3cfe87a60db6b0f0b5235b7eab941d5c35a3a0","exact-uganda-on-ground.webp":"367e80535b6371e61e0d0a7a7683bd709f6fabc83a01ae81c59790fecbaa8925","exact-uganda-global-support.webp":"055afbda011435d481baf675203f6381d0dca90bfd6a5f679ef54ab516566b90"}
          for filename,want in expected_assets.items():
              url="https://oneworldz.com/assets/heroes/"+filename
              last=""
              for attempt in range(8):
                  try:
                      req=urllib.request.Request(url+"?exactheroes=1",headers={"User-Agent":"OneWorldz-Hero-Asset-Verify/1.0","Cache-Control":"no-cache"})
                      with urllib.request.urlopen(req,timeout=25) as r:
                          data=r.read()
                          got=hashlib.sha256(data).hexdigest()
                          if r.status==200 and got==want:
                              print("HERO_ASSET_LIVE_PASS",filename)
                              break
                          last=f"status={r.status} sha256={got} want={want} bytes={len(data)}"
                  except Exception as e:
                      last=repr(e)
                  time.sleep(2+attempt)
              else:
                  raise SystemExit(f"HERO_ASSET_LIVE_FAIL {filename} {last}")
          print("HERO_LIVE_ASSET_HASH_PASS exact_assets=10")
          print("HEROES_LIVE=PASS routes=8")
          PY
