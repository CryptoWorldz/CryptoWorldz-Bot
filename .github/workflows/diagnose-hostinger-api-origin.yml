name: Diagnose Hostinger API Origin

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'diagnostics/hostinger-api-origin.request'

permissions:
  contents: read

concurrency:
  group: hostinger-api-origin-diagnostic
  cancel-in-progress: false

jobs:
  lookup:
    name: Resolve CryptoWorldz hosting root from Hostinger API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cryptoworldz-production
    env:
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: '21'
      HOSTINGER_LOCKED_IP: '145.223.108.40'
      HOSTINGER_TLS_ALIAS: 'cryptoworldz-ftp-pinned.hstgr.io'
      HOSTINGER_CERT_SHA256: '47:E1:B5:DC:5D:61:02:E8:ED:8C:01:21:61:AF:8B:22:53:70:AB:55:63:B0:0C:AF:14:6C:BD:7A:96:51:E9:5E'
      HOSTINGER_API_BASE: 'https://developers.hostinger.com'
    steps:
      - uses: actions/checkout@v4

      - name: Validate read-only API request
        if: github.event_name == 'push'
        shell: bash
        env:
          APPROVED_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test "$(sed -n 's/^target=//p' diagnostics/hostinger-api-origin.request | tail -n1)" = 'cryptoworldz.xyz'
          test "$(sed -n 's/^mode=//p' diagnostics/hostinger-api-origin.request | tail -n1)" = 'read-only-hostinger-api-origin'
          test "$(sed -n 's/^approval=//p' diagnostics/hostinger-api-origin.request | tail -n1)" = 'Approved by JayJayTeamDev'
          test "$(sed -n 's/^source_commit=//p' diagnostics/hostinger-api-origin.request | tail -n1)" = "$APPROVED_BEFORE"

      - name: Install secure transfer tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp jq

      - name: Retrieve existing API token without exposing it
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$FTP_USERNAME" && -n "$FTP_PASSWORD" ]] || { echo '::error::FTP credentials missing'; exit 1; }
          echo "::add-mask::$FTP_USERNAME"
          echo "::add-mask::$FTP_PASSWORD"
          echo "$HOSTINGER_LOCKED_IP $HOSTINGER_TLS_ALIAS" | sudo tee -a /etc/hosts >/dev/null
          cert="$RUNNER_TEMP/hostinger-cert.pem"
          session="$RUNNER_TEMP/hostinger-session.txt"
          timeout 30 openssl s_client -starttls ftp -connect "$HOSTINGER_LOCKED_IP:21" -verify_return_error -showcerts </dev/null >"$session" 2>/dev/null
          sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' "$session" | sed -n '1,/-----END CERTIFICATE-----/p' > "$cert"
          [[ "$(openssl x509 -in "$cert" -noout -fingerprint -sha256 | cut -d= -f2)" == "$HOSTINGER_CERT_SHA256" ]]
          token_file="$RUNNER_TEMP/hostinger-api-token"
          timeout 60 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$HOSTINGER_TLS_ALIAS" -e "set cmd:fail-exit yes; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname yes; cd '/'; get .api_token -o '$token_file'; bye"
          test -s "$token_file"
          chmod 600 "$token_file"
          token="$(tr -d '\r\n' < "$token_file")"
          [[ ${#token} -ge 20 ]] || { echo '::error::Existing API token file is not a valid token candidate'; exit 1; }
          echo "::add-mask::$token"
          printf '%s' "$token" > "$RUNNER_TEMP/hostinger-api-token-clean"
          chmod 600 "$RUNNER_TEMP/hostinger-api-token-clean"
          echo 'HOSTINGER_API_TOKEN_READY=YES'

      - name: Resolve CryptoWorldz website through official Hostinger API
        shell: bash
        run: |
          set -euo pipefail
          token="$(cat "$RUNNER_TEMP/hostinger-api-token-clean")"
          response="$RUNNER_TEMP/hostinger-websites.json"
          http="$(curl -sS -o "$response" -w '%{http_code}' --max-time 45 \
            -H 'Accept: application/json' \
            -H "Authorization: Bearer $token" \
            "$HOSTINGER_API_BASE/api/hosting/v1/websites?domain=cryptoworldz.xyz&per_page=50")"
          echo "HOSTINGER_WEBSITES_HTTP=$http"
          [[ "$http" == '200' ]] || { echo '::error::Existing API token did not authorize Hostinger website lookup'; exit 1; }
          jq -e '.data | type == "array"' "$response" >/dev/null
          count="$(jq '[.data[] | select((.domain // "" | ascii_downcase) == "cryptoworldz.xyz")] | length' "$response")"
          echo "CRYPTOWORLDZ_API_MATCH_COUNT=$count"
          [[ "$count" -ge 1 ]] || { echo '::error::Hostinger API account contains no cryptoworldz.xyz website'; exit 1; }
          jq -r '.data[] | select((.domain // "" | ascii_downcase) == "cryptoworldz.xyz") | "HOSTINGER_SITE domain=\(.domain) username=\(.username) vhost_type=\(.vhost_type) enabled=\(.is_enabled) order_id=\(.order_id) root_directory=\(.root_directory) created_at=\(.created_at)"' "$response"

      - name: Resolve related CryptoWorldz entries only
        shell: bash
        run: |
          set -euo pipefail
          response="$RUNNER_TEMP/hostinger-websites.json"
          jq -r '.data[] | select(((.domain // "") | ascii_downcase | contains("cryptoworldz"))) | "RELATED_SITE domain=\(.domain) username=\(.username) vhost_type=\(.vhost_type) enabled=\(.is_enabled) root_directory=\(.root_directory)"' "$response"
