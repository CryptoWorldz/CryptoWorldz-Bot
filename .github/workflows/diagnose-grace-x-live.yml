name: Diagnose Grace X Live

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/diagnose-grace-x-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe live Grace X configuration
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location             "https://cryptobotz.cryptoworldz.xyz/grace/health?probe=${GITHUB_RUN_ID}"             -o "$RUNNER_TEMP/grace-health.json"
          python3 - <<'PY'
          import json, os
          p=json.load(open(os.path.join(os.environ["RUNNER_TEMP"],"grace-health.json")))
          print("GRACE_OK="+str(bool(p.get("ok"))).upper())
          print("X_OAUTH_CONFIGURED="+str(bool(p.get("x_oauth_configured"))).upper())
          print("FACEBOOK_OAUTH_CONFIGURED="+str(bool(p.get("facebook_oauth_configured"))).upper())
          print("X_REDIRECT="+str(p.get("x_redirect") or "/grace/oauth/x/callback"))
          PY
