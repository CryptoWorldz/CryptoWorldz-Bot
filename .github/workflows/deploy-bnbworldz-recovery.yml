name: Deploy BnbWorldz Recovery

on:
  push:
    branches: [main]
    paths:
      - 'deployments/bnbworldz-recovery.request'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: bnbworldz-production
      url: https://bnbworldz.xyz
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      FTP_SERVER_DIR: /public_html
      FTP_ACCOUNT_SCOPE: ${{ vars.FTP_ACCOUNT_SCOPE }}
      DEPLOY_GUARD: ${{ vars.DEPLOY_GUARD }}
      LIVE_URL: https://bnbworldz.xyz
      EXPECTED_SCRIPT: assets/coming-soon.js
      VERIFY_USER_AGENT: Mozilla/5.0 (compatible; CryptoWorldzDeployment/1.0; +https://cryptoworldz.xyz)
    steps:
      - name: Check out approved commit
        uses: actions/checkout@v4

      - name: Verify approval and domain lock
        shell: bash
        env:
          APPROVED_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          source_commit="$(sed -n 's/^source_commit=//p' deployments/bnbworldz-recovery.request | tail -n1)"
          confirmation="$(sed -n 's/^confirmation=//p' deployments/bnbworldz-recovery.request | tail -n1)"
          test "$source_commit" = "$APPROVED_BEFORE"
          test "$confirmation" = 'APPROVE TOTAL DEPLOYMENT'
          test "$FTP_ACCOUNT_SCOPE" = 'DOMAIN_ONLY'
          test "$DEPLOY_GUARD" = 'BNBWORLDZ.XYZ'
          test -n "$FTP_HOST"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          host="${FTP_HOST#ftp://}"
          host="${host#ftps://}"
          host="${host%%/*}"
          if [[ "$host" != *:*:* && "$host" == *:* ]]; then host="${host%%:*}"; fi
          test "$host" = '145.223.108.40'
          test "$FTP_SERVER_DIR" = '/public_html'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run complete repository verification
        run: npm run verify

      - name: Install secure FTP client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp zip

      - name: Confirm encrypted target root
        shell: bash
        run: |
          set -euo pipefail
          timeout 45 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" -e "set cmd:fail-exit yes; set net:max-retries 1; set net:timeout 15; set net:idle 15; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate no; cd \"$FTP_SERVER_DIR\"; bye"

      - name: Capture rollback snapshot
        shell: bash
        run: |
          set -euo pipefail
          source_root="$GITHUB_WORKSPACE/apps/cryptoworldz-web-core"
          backup="$RUNNER_TEMP/worldz-backup"
          command_file="$RUNNER_TEMP/worldz-backup-${GITHUB_RUN_ID}.lftp"
          mkdir -p "$backup"

          mapfile -d '' files < <(
            {
              for relative in 404.html _headers live.html .htaccess; do
                [[ -f "$source_root/$relative" ]] && printf '%s\0' "$source_root/$relative"
              done
              for directory in assets config; do
                [[ -d "$source_root/$directory" ]] && find "$source_root/$directory" -type f -print0
              done
              [[ -f "$source_root/index.html" ]] && printf '%s\0' "$source_root/index.html"
            } | sort -z
          )

          {
            echo 'set cmd:fail-exit no'
            echo 'set net:max-retries 1'
            echo 'set net:timeout 15'
            echo 'set net:idle 15'
            echo 'set ftp:ssl-force yes'
            echo 'set ftp:ssl-protect-data yes'
            echo 'set ssl:verify-certificate no'
            printf 'cd "%s"\n' "$FTP_SERVER_DIR"
            for file in "${files[@]}"; do
              relative="${file#"$source_root"/}"
              mkdir -p "$backup/$(dirname "$relative")"
              printf 'get "%s" -o "%s"\n' "$relative" "$backup/$relative"
            done
            echo 'bye'
          } > "$command_file"

          timeout 120 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_HOST" < "$command_file" || true
          find "$backup" -type f -size 0 -delete || true
          find "$backup" -mindepth 1 -type d -empty -delete || true
          if ! find "$backup" -type f -print -quit | grep -q .; then
            touch "$backup/.empty-target"
          fi
          cd "$backup"
          zip -qr "$RUNNER_TEMP/worldz-backup-${GITHUB_RUN_ID}.zip" .

      - name: Preserve rollback package
        uses: actions/upload-artifact@v4
        with:
          name: bnbworldz-predeploy-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/worldz-backup-${{ github.run_id }}.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload approved BnbWorldz package
        shell: bash
        env:
          FTP_TRANSFER_TIMEOUT: '300'
          FTP_TLS_VERIFY: 'no'
        run: bash tools/worldz-direct-ftp.sh upload "$GITHUB_WORKSPACE/apps/cryptoworldz-web-core"

      - name: Verify live BnbWorldz
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          verified='false'
          for attempt in 1 2 3 4 5 6; do
            cache="release=${GITHUB_SHA}-${GITHUB_RUN_ID}-${attempt}"
            if curl -fsSL -A "$VERIFY_USER_AGENT" -H 'Cache-Control: no-cache' --max-time 20 "$LIVE_URL/?$cache" -o "$RUNNER_TEMP/index.html" \
              && curl -fsSL -A "$VERIFY_USER_AGENT" -H 'Cache-Control: no-cache' --max-time 20 "$LIVE_URL/$EXPECTED_SCRIPT?$cache" -o "$RUNNER_TEMP/expected.js" \
              && grep -Fq './config/worlds.js' "$RUNNER_TEMP/index.html" \
              && test -s "$RUNNER_TEMP/expected.js"; then
              verified='true'
              break
            fi
            sleep 10
          done
          echo "verified=$verified" >> "$GITHUB_OUTPUT"
          test "$verified" = 'true'

      - name: Restore previous site if verification fails
        if: failure() && steps.verify.outcome == 'failure'
        shell: bash
        env:
          FTP_TRANSFER_TIMEOUT: '180'
          FTP_TLS_VERIFY: 'no'
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/worldz-backup"
          if [[ -f "$backup/.empty-target" ]]; then
            echo 'Target was empty before deployment; manual cleanup may be required.' >&2
            exit 0
          fi
          bash tools/worldz-direct-ftp.sh restore "$backup"
