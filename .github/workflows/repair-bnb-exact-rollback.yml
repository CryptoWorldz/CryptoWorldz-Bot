name: Repair BNBWorldz Exact Rollback

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/bnb-exact-rollback.request'

permissions:
  contents: read
  actions: read

concurrency:
  group: repair-bnbworldz-exact-rollback
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: bnbworldz-production
      url: https://bnbworldz.xyz
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || '/' }}
      FTP_ACCOUNT_SCOPE: ${{ vars.FTP_ACCOUNT_SCOPE }}
      DEPLOY_GUARD: ${{ vars.DEPLOY_GUARD }}
      FTP_TLS_VERIFY: yes
      FTP_TLS_CHECK_HOSTNAME: yes
      HOSTINGER_LOCKED_IP: '145.223.108.40'
      HOSTINGER_TLS_ALIAS: 'worldz-ftp-pinned.hstgr.io'
      HOSTINGER_CERT_SHA256: '47:E1:B5:DC:5D:61:02:E8:ED:8C:01:21:61:AF:8B:22:53:70:AB:55:63:B0:0C:AF:14:6C:BD:7A:96:51:E9:5E'
      ROLLBACK_ARTIFACT_ID: '9069297657'
      ROLLBACK_RUN_ID: '31405005533'
    steps:
      - uses: actions/checkout@v4

      - name: Validate locked BNB target
        shell: bash
        run: |
          set -euo pipefail
          test "$FTP_ACCOUNT_SCOPE" = 'DOMAIN_ONLY'
          test "$DEPLOY_GUARD" = 'BNBWORLDZ.XYZ'
          [[ "$FTP_SERVER_DIR" == '/' || "$FTP_SERVER_DIR" == '/public_html' ]]
          test -n "$FTP_HOST" && test -n "$FTP_USERNAME" && test -n "$FTP_PASSWORD"
          host="$(printf '%s' "$FTP_HOST" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#^ftp://##' -e 's#^ftps://##' -e 's#/.*$##')"
          if [[ "$host" != *:*:* && "$host" == *:* ]]; then host="${host%%:*}"; fi
          test "$host" = "$HOSTINGER_LOCKED_IP"
          test "$FTP_PORT" = '21'
          echo "::add-mask::$FTP_USERNAME"; echo "::add-mask::$FTP_HOST"; echo "::add-mask::$FTP_PASSWORD"

      - name: Install secure transfer tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp unzip

      - name: Pin and validate Hostinger FTPS identity
        shell: bash
        run: |
          set -euo pipefail
          echo "$HOSTINGER_LOCKED_IP $HOSTINGER_TLS_ALIAS" | sudo tee -a /etc/hosts >/dev/null
          test "$(getent ahostsv4 "$HOSTINGER_TLS_ALIAS" | awk 'NR==1{print $1}')" = "$HOSTINGER_LOCKED_IP"
          cert="$RUNNER_TEMP/hostinger-cert.pem"
          session="$RUNNER_TEMP/hostinger-session.txt"
          timeout 25 openssl s_client -starttls ftp -connect "$HOSTINGER_LOCKED_IP:21" -verify_return_error -showcerts </dev/null >"$session" 2>"$RUNNER_TEMP/hostinger.err"
          sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' "$session" | sed -n '1,/-----END CERTIFICATE-----/p' > "$cert"
          test -s "$cert"
          fp="$(openssl x509 -in "$cert" -noout -fingerprint -sha256 | cut -d= -f2)"
          test "$fp" = "$HOSTINGER_CERT_SHA256"
          openssl x509 -in "$cert" -noout -ext subjectAltName | grep -Fq 'DNS:*.hstgr.io'
          grep -Fq 'Verify return code: 0 (ok)' "$session"
          echo "FTP_CONNECT_HOST=$HOSTINGER_TLS_ALIAS" >> "$GITHUB_ENV"

      - name: Download exact pre-deploy rollback artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-all-errors \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ROLLBACK_ARTIFACT_ID}/zip" \
            -o "$RUNNER_TEMP/rollback-artifact.zip"
          mkdir -p "$RUNNER_TEMP/rollback-artifact"
          unzip -q "$RUNNER_TEMP/rollback-artifact.zip" -d "$RUNNER_TEMP/rollback-artifact"
          test -s "$RUNNER_TEMP/rollback-artifact/worldz-backup-${ROLLBACK_RUN_ID}.zip"
          test -s "$RUNNER_TEMP/rollback-artifact/worldz-backup.sha256"
          test -f "$RUNNER_TEMP/rollback-artifact/worldz-rollback-new-files.txt"
          mkdir -p "$RUNNER_TEMP/worldz-backup"
          unzip -q "$RUNNER_TEMP/rollback-artifact/worldz-backup-${ROLLBACK_RUN_ID}.zip" -d "$RUNNER_TEMP/worldz-backup"
          test -n "$(find "$RUNNER_TEMP/worldz-backup" -type f -print -quit)"

      - name: Remove deployment-new files without blocking restore
        shell: bash
        run: |
          set -euo pipefail
          new_files="$RUNNER_TEMP/rollback-artifact/worldz-rollback-new-files.txt"
          cleanup="$RUNNER_TEMP/remove-bnb-new-files.lftp"
          {
            echo 'set cmd:fail-exit no'
            echo 'set net:max-retries 2'
            echo 'set net:timeout 30'
            echo 'set ftp:ssl-force yes'
            echo 'set ftp:ssl-protect-data yes'
            echo 'set ssl:verify-certificate yes'
            echo 'set ssl:check-hostname yes'
            printf 'cd "%s"\n' "${FTP_SERVER_DIR//\"/\\\"}"
            while IFS= read -r rel; do
              [[ -n "$rel" ]] || continue
              [[ "$rel" != /* && "$rel" != *'..'* && "$rel" != *$'\n'* && "$rel" != *$'\r'* ]] || exit 9
              escaped="${rel//\\/\\\\}"; escaped="${escaped//\"/\\\"}"
              printf 'rm "%s"\n' "$escaped"
            done < "$new_files"
            echo 'bye'
          } > "$cleanup"
          set +e
          timeout 180 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_CONNECT_HOST" < "$cleanup"
          cleanup_rc=$?
          set -e
          echo "New-file cleanup exit=$cleanup_rc; mandatory restore continues regardless."

      - name: Restore exact pre-deploy files
        shell: bash
        run: |
          set -euo pipefail
          FTP_TRANSFER_TIMEOUT=360 bash tools/worldz-direct-ftp.sh restore "$RUNNER_TEMP/worldz-backup"

      - name: Verify exact pre-deploy file state
        shell: bash
        run: |
          set -euo pipefail
          verify="$RUNNER_TEMP/worldz-rollback-verify"
          mkdir -p "$verify"
          timeout 150 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_CONNECT_HOST" <<LFTP
          set cmd:fail-exit yes
          set net:max-retries 2
          set net:timeout 30
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set ssl:check-hostname yes
          cd "$FTP_SERVER_DIR"
          lcd "$verify"
          mirror --parallel=3 --exclude-glob '.well-known/**' --exclude-glob '.env*' --exclude-glob '*.log' --exclude-glob 'cgi-bin/**' .
          bye
          LFTP
          (cd "$verify" && find . -type f -print0 | sort -z | xargs -0 sha256sum | sed 's#  \./#  #') > "$RUNNER_TEMP/worldz-rollback-verify.sha256"
          diff -u "$RUNNER_TEMP/rollback-artifact/worldz-backup.sha256" "$RUNNER_TEMP/worldz-rollback-verify.sha256"
          echo 'WORLDZ_BNB_EXACT_ROLLBACK=PASS'
