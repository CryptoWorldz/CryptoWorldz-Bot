name: Deploy REVIVE Distribution on WorldzLaunchPad

on:
  push:
    branches: [main]
    paths:
      - 'cryptoworldz.xyz/revive-distribution/index.html'
      - 'launchpad.cryptoworldz.xyz/revive-distribution/rpc.php'
      - 'launchpad.cryptoworldz.xyz/mint/jupiter-mobile.js'
      - '.github/workflows/deploy-revive-distribution-launchpad.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revive-distribution-launchpad
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}

    steps:
      - uses: actions/checkout@v4

      - name: Build LaunchPad-hosted owner console
        shell: python
        run: |
          import re
          from pathlib import Path

          src=Path('cryptoworldz.xyz/revive-distribution/index.html')
          out=Path('launchpad.cryptoworldz.xyz/revive-distribution/index.html')
          out.parent.mkdir(parents=True,exist_ok=True)
          t=src.read_text()

          # LaunchPad origin + dedicated same-origin mainnet RPC bridge.
          t=t.replace("const RPC='/revive-launch/rpc.php';",
                      "const RPC='/revive-distribution/rpc.php';")

          # Replace the old hidden Jupiter React bridge with Reown's official
          # framework-agnostic AppKit + Solana adapter.
          t=t.replace(
              "import {getWallets} from 'https://esm.sh/@wallet-standard/app@1.1.0?bundle';",
              "import {createAppKit,SolanaAdapter,networks} from 'https://cdn.jsdelivr.net/npm/@reown/appkit-cdn@1.8.24/dist/appkit.js';"
          )

          init_marker="const connection=new Connection(RPC,'confirmed');"
          init_code=r"""const connection=new Connection(RPC,'confirmed');
          const REOWN_PROJECT_ID='e3d5fc46a07eb8ecb162ee048625348e';
          const worldzSolanaAdapter=new SolanaAdapter({});
          const worldzAppKit=createAppKit({
            adapters:[worldzSolanaAdapter],
            networks:[networks.solana],
            projectId:REOWN_PROJECT_ID,
            metadata:{
              name:'WorldzLaunchPad',
              description:'WorldzLaunchPad™ • REVIVE $RVIV owner distribution',
              url:'https://launchpad.cryptoworldz.xyz',
              icons:[]
            },
            themeMode:'dark',
            features:{analytics:false,email:false,socials:[]}
          });
          let worldzAccount={};
          let worldzProvider=null;
          worldzAppKit.subscribeAccount(state=>{worldzAccount=state||{};});
          worldzAppKit.subscribeProviders(state=>{worldzProvider=state?.solana||null;});
          window.__REVIVE_DISTRIBUTION_WALLET__='WORLDZ_APPKIT_DIRECT_V1';"""
          assert init_marker in t
          t=t.replace(init_marker,init_code,1)

          replacement=r"""async function connectWallet(){
            setStatus('WORLDZLAUNCHPAD WALLET LOGIN…\nChoose your Solana wallet in the WorldzLaunchPad connection window. No transaction is being sent.','warn');

            if(!(worldzAccount?.isConnected&&worldzAccount?.address)){
              await worldzAppKit.open();
              for(let i=0;i<240;i++){
                if(worldzAccount?.isConnected&&worldzAccount?.address)break;
                await sleep(500);
              }
            }

            if(!(worldzAccount?.isConnected&&worldzAccount?.address)){
              throw new Error('WorldzLaunchPad wallet login was not completed.');
            }

            const address=String(worldzAccount.address);
            if(address!==MEMBER.toBase58()){
              try{await worldzAppKit.disconnect();}catch{}
              throw new Error('Wrong wallet connected: '+address);
            }

            const provider=worldzProvider||worldzAppKit.getWalletProvider?.();
            if(!provider)throw new Error('WorldzLaunchPad connected the wallet but no Solana signing provider was returned.');
            if(typeof provider.signAllTransactions!=='function'){
              throw new Error('Connected Solana provider does not support transaction batch signing.');
            }

            wallet={
              name:'WorldzLaunchPad AppKit',
              publicKey:new PublicKey(address),
              signAllTransactions:txs=>provider.signAllTransactions(txs)
            };

            $('#connect').textContent='Connected '+short(address);
            $('#connect').disabled=true;
            $('#preflight').disabled=false;
            setStatus('WORLDZLAUNCHPAD WALLET CONNECTED ✅\n'+short(address)+'\nRun FINAL LIVE PREFLIGHT.','good');
          }"""

          pattern=r"async function connectWallet\(\)\{.*?\n\}\nasync function buildPlan\(\)\{"
          t,n=re.subn(pattern,lambda m: replacement+"\nasync function buildPlan(){",t,count=1,flags=re.S)
          assert n==1, 'connectWallet replacement failed'

          t=t.replace(
              '<p class="sub">Approved post-launch distribution — exact 200M model reconciliation</p>',
              '<p class="sub">WorldzLaunchPad™ owner console • Approved post-launch distribution • exact 200M reconciliation</p>'
          )
          t=t.replace(
              'Connect JayJayTeamDev using Jupiter Mobile / Wallet Standard. No transaction will be built until the live 170,000,000 RVIV treasury balance is verified.',
              'Connect JayJayTeamDev directly through WorldzLaunchPad. No transaction will be built until the live 170,000,000 RVIV treasury balance is verified.'
          )

          out.write_text(t)
          assert "WORLDZ_APPKIT_DIRECT_V1" in t
          assert "@reown/appkit-cdn@1.8.24/dist/appkit.js" in t
          assert "worldzAppKit.open()" in t
          assert "/mint/jupiter-mobile.js" not in t
          assert "70,000,000 RVIV" in t
          assert "100,000,000 RVIV" in t
          print('REVIVE_DISTRIBUTION_LAUNCHPAD_BUILD=PASS')

      - name: Validate generated browser module syntax
        shell: python
        run: |
          import re,subprocess
          from pathlib import Path
          html=Path('launchpad.cryptoworldz.xyz/revive-distribution/index.html').read_text()
          m=re.search(r'<script type="module">(.*?)</script>',html,re.S)
          assert m, 'module script not found'
          p=Path('/tmp/revive-distribution-module.mjs')
          p.write_text(m.group(1))
          r=subprocess.run(['node','--check',str(p)],capture_output=True,text=True)
          print(r.stdout)
          print(r.stderr)
          assert r.returncode==0, 'generated browser module has JavaScript syntax errors'
          print('REVIVE_DISTRIBUTION_JS_SYNTAX=PASS')

      - name: Upload to WorldzLaunchPad
        shell: python
        run: |
          import os,ssl
          from ftplib import FTP_TLS,error_perm
          from pathlib import Path

          local_dir=Path('launchpad.cryptoworldz.xyz/revive-distribution')
          remote='domains/cryptoworldz.xyz/public_html/launchpad/revive-distribution'
          ftp=FTP_TLS(context=ssl._create_unverified_context())
          ftp.connect(os.environ['FTP_HOST'],int(os.environ.get('FTP_PORT','21')),timeout=40)
          ftp.login(os.environ['FTP_USERNAME'],os.environ['FTP_PASSWORD'])
          ftp.prot_p();ftp.set_pasv(True);ftp.cwd('/')
          for part in remote.split('/'):
              if not part: continue
              try: ftp.cwd(part)
              except error_perm: ftp.mkd(part);ftp.cwd(part)
          for name in ('index.html','rpc.php'):
              with (local_dir/name).open('rb') as h:
                  ftp.storbinary('STOR '+name,h,blocksize=262144)
          ftp.quit()
          print('REVIVE_DISTRIBUTION_LAUNCHPAD_DEPLOY=PASS')

      - name: Verify live LaunchPad console and RPC methods
        shell: python
        run: |
          import urllib.request,time,json
          page_url='https://launchpad.cryptoworldz.xyz/revive-distribution/?v='+str(int(time.time()))
          rpc_url='https://launchpad.cryptoworldz.xyz/revive-distribution/rpc.php'
          last=''

          def rpc(method,params):
              body=json.dumps({'jsonrpc':'2.0','id':method,'method':method,'params':params}).encode()
              req=urllib.request.Request(
                  rpc_url,
                  data=body,
                  headers={
                      'Content-Type':'application/json',
                      'Origin':'https://launchpad.cryptoworldz.xyz',
                      'User-Agent':'WorldzLaunchPad-REVIVE-Verify/2.0',
                      'Cache-Control':'no-cache'
                  },
                  method='POST'
              )
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read().decode('utf-8','ignore')
                  if r.status != 200:
                      raise RuntimeError(method+' HTTP '+str(r.status)+' '+raw)
              data=json.loads(raw)
              if 'error' in data:
                  raise RuntimeError(method+' '+json.dumps(data['error']))
              if 'result' not in data:
                  raise RuntimeError(method+' returned no result: '+raw)
              return data['result']

          for _ in range(8):
              try:
                  req=urllib.request.Request(page_url,headers={'User-Agent':'WorldzLaunchPad-REVIVE-Verify/2.0','Cache-Control':'no-cache'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      body=r.read().decode('utf-8','ignore')
                  assert 'WORLDZLAUNCHPAD' in body
                  assert 'WORLDZ_APPKIT_DIRECT_V1' in body
                  assert '@reown/appkit-cdn@1.8.24/dist/appkit.js' in body
                  assert "const RPC='/revive-distribution/rpc.php';" in body
                  assert '/mint/jupiter-mobile.js' not in body
                  assert 'Connect JayJayTeamDev Wallet' in body
                  assert '70,000,000 RVIV' in body
                  assert '100,000,000 RVIV' in body

                  genesis=rpc('getGenesisHash',[])
                  assert genesis == '5eykt4UsFv8P8NJdTREpY1vzqKqZKvdpKuc147dw2N9d', 'wrong Solana network genesis: '+str(genesis)
                  rpc('getBalance',['Fap54GTCo4ZopkwmHtbSUJZTsjTybftJfN9sPG3MHp4u',{'commitment':'confirmed'}])
                  rpc('getAccountInfo',['DnpNayNJqzoXnz1tHgJpCq345kNdxzJPo8RAdCeNqx9R',{'encoding':'base64','commitment':'confirmed'}])
                  rpc('getMultipleAccounts',[[
                      'DnpNayNJqzoXnz1tHgJpCq345kNdxzJPo8RAdCeNqx9R',
                      'B9S37HguduNZ5TXWCxMi7cZMCm89ExCB751N4bpMQ7bN'
                  ],{'encoding':'base64','commitment':'confirmed'}])
                  rpc('getTokenAccountBalance',['28CwdVt2y997WZqTzEuBpuwoyVYAj6JcaD4qDMzyCdtn',{'commitment':'confirmed'}])
                  rpc('getLatestBlockhash',[{'commitment':'confirmed'}])
                  rpc('getMinimumBalanceForRentExemption',[165,{'commitment':'confirmed'}])
                  rpc('getBlockHeight',[{'commitment':'confirmed'}])
                  rpc('getSlot',[{'commitment':'confirmed'}])
                  rpc('getEpochInfo',[{'commitment':'confirmed'}])

                  print('REVIVE_DISTRIBUTION_LAUNCHPAD_LIVE=PASS')
                  print('REVIVE_DISTRIBUTION_RPC_REQUIRED_READ_METHODS=PASS')
                  raise SystemExit(0)
              except SystemExit:
                  raise
              except Exception as e:
                  last=str(e)
                  print('VERIFY_RETRY:',last)
                  time.sleep(5)
          raise SystemExit('LaunchPad live verification failed: '+last)
