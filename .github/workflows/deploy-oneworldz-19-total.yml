name: Deploy OneWorldz 19-Destination Total Release

on:
  push:
    branches: [main]
    paths:
      - 'deployments/oneworldz-19-total.request'

permissions:
  contents: read

concurrency:
  group: oneworldz-19-total-production
  cancel-in-progress: true

jobs:
  authorize:
    name: Lock canonical 18-static-target total authority
    runs-on: ubuntu-latest
    outputs:
      source_commit: ${{ steps.lock.outputs.source_commit }}
      target_matrix: ${{ steps.lock.outputs.target_matrix }}
      deployment_mode: ${{ steps.lock.outputs.deployment_mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: lock
        shell: bash
        run: |
          set -euo pipefail
          request='deployments/oneworldz-19-total.request'
          test "$(sed -n 's/^requested_by=//p' "$request" | tail -n1)" = 'JayJayTeamDev'
          test "$(sed -n 's/^authorization=//p' "$request" | tail -n1)" = 'APPROVE COMPLETE ECOSYSTEM BUILD AND TOTAL DEPLOYMENT'
          test "$(sed -n 's/^scope=//p' "$request" | tail -n1)" = 'LOCKED-ONEWORLDZ-ECOSYSTEM-18-STATIC-TARGETS'
          mode="$(sed -n 's/^mode=//p' "$request" | tail -n1)"
          test "$(sed -n 's/^targets=//p' "$request" | tail -n1)" = 'all'
          case "$mode" in deploy|handoff-only) ;; *) exit 1 ;; esac
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "deployment_mode=$mode" >> "$GITHUB_OUTPUT"
          cd apps/oneworldz-ecosystem-release
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { productionTargets, productionGate } from './production-targets.mjs';
          if (productionTargets.length !== 18) throw new Error('Expected 18 static targets');
          if (productionGate.ecosystemDestinations !== 19) throw new Error('Expected 19 destinations');
          if (productionGate.activeOwnedRootDomains !== 15) throw new Error('Expected 15 owned roots');
          if (JSON.stringify(productionGate.protectedDestinations) !== JSON.stringify(['cryptobotz.cryptoworldz.xyz'])) throw new Error('CryptoBotz protection drift');
          if (!productionTargets.some(x => x.domain === 'oneworldz.com')) throw new Error('OneWorldz missing');
          if (productionTargets.some(x => ['cryptobotz.cryptoworldz.xyz','solworld.fun'].includes(x.domain))) throw new Error('Protected/excluded target entered static fleet');
          console.log('target_matrix=' + JSON.stringify({include: productionTargets.map(x => ({key:x.key,domain:x.domain,remote_dir:x.remoteDir,guard:x.guard,expected_title:x.expectedTitle}))}));
          NODE

  validate:
    name: Build and prove whole release before remote write
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.source_commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Canonical verification
        working-directory: apps/oneworldz-ecosystem-release
        run: npm run verify
      - name: Public boundary proof
        shell: bash
        run: |
          set -euo pipefail
          root='apps/oneworldz-ecosystem-release/dist/ecosystem'
          test "$(find "$root" -mindepth 2 -maxdepth 2 -name index.html | wc -l | tr -d ' ')" = '18'
          test -s "$root/oneworldz/index.html"
          test ! -d "$root/cryptobotz"
          ! grep -Rni --include='*.html' 'solworld\.fun' "$root"
          ! grep -RIE 'OPENAI_API_KEY|sk-proj-|sk_live_|sk_test_|service_role|FTP_PASSWORD|DATABASE_URL|SUPABASE_SERVICE' "$root"
      - uses: actions/upload-artifact@v4
        with:
          name: oneworldz-19-perfect-${{ github.run_id }}
          path: apps/oneworldz-ecosystem-release/dist/ecosystem/
          if-no-files-found: error
          retention-days: 30

  preflight:
    name: Read-only prove all 18 exact Hostinger roots
    needs: [authorize, validate]
    if: ${{ needs.authorize.outputs.deployment_mode != 'handoff-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      TARGET_MATRIX: ${{ needs.authorize.outputs.target_matrix }}
    steps:
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - shell: bash
        run: |
          set -euo pipefail
          host="$(printf '%s' "$FTP_HOST" | sed -e 's#^ftp[s]*://##' -e 's#/.*$##')"
          if [[ "$host" != *:*:* && "$host" == *:* ]]; then host="${host%%:*}"; fi
          echo "::add-mask::$FTP_HOST"; echo "::add-mask::$FTP_USERNAME"; echo "::add-mask::$FTP_PASSWORD"
          node -e 'for(const x of JSON.parse(process.env.TARGET_MATRIX).include) console.log(x.remote_dir)' > "$RUNNER_TEMP/dirs.txt"
          test "$(wc -l < "$RUNNER_TEMP/dirs.txt" | tr -d ' ')" = '18'
          {
            echo 'set cmd:fail-exit true'; echo 'set net:max-retries 2'; echo 'set net:timeout 30'; echo 'set ftp:ssl-force true'; echo 'set ftp:ssl-protect-data true'; echo 'set ssl:verify-certificate true'; echo 'set ssl:check-hostname false'
            while read -r dir; do echo "cd $dir"; echo 'pwd'; echo 'cd /'; done < "$RUNNER_TEMP/dirs.txt"
            echo 'bye'
          } > "$RUNNER_TEMP/preflight.lftp"
          timeout 900 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/preflight.lftp" "$host"

  deploy:
    name: Exact-file backup → deploy → prove ${{ matrix.domain }}
    needs: [authorize, validate, preflight]
    if: ${{ needs.authorize.outputs.deployment_mode != 'handoff-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix: ${{ fromJSON(needs.authorize.outputs.target_matrix) }}
    environment:
      name: cryptoworldz-production
      url: https://${{ matrix.domain }}/
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      FTP_REMOTE_DIR: ${{ matrix.remote_dir }}
      DOMAIN: ${{ matrix.domain }}
      DEPLOY_GUARD: ${{ matrix.guard }}
      EXPECTED_TITLE: ${{ matrix.expected_title }}
      LIVE_URL: https://${{ matrix.domain }}/
      RELEASE_ROOT: apps/oneworldz-ecosystem-release/dist/ecosystem/${{ matrix.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.source_commit }}
      - uses: actions/download-artifact@v4
        with:
          name: oneworldz-19-perfect-${{ github.run_id }}
          path: apps/oneworldz-ecosystem-release/dist/ecosystem
      - name: Enforce package destination contract and enumerate exact files
        shell: bash
        run: |
          set -euo pipefail
          case "$DOMAIN" in
            impactbased.cryptoworldz.xyz) expected='domains/cryptoworldz.xyz/public_html/impactbased' ;;
            law.oneworldz.com) expected='domains/oneworldz.com/public_html/law' ;;
            learn.oneworldz.com) expected='domains/oneworldz.com/public_html/learn' ;;
            *) expected="domains/$DOMAIN/public_html" ;;
          esac
          test "$FTP_REMOTE_DIR" = "$expected"
          test -s "$RELEASE_ROOT/index.html"; test -s "$RELEASE_ROOT/release-manifest.json"
          case "$DOMAIN" in cryptobotz.cryptoworldz.xyz|solworld.fun) exit 1 ;; esac
          node - <<'NODE'
          const fs=require('fs');const m=JSON.parse(fs.readFileSync(process.env.RELEASE_ROOT+'/release-manifest.json'));
          if(m.deploy_guard!==process.env.DEPLOY_GUARD||m.ftp_root!=='/'||m.homepage!=='/index.html') throw new Error('release contract mismatch');
          if((m.protected_services_modified||[]).length) throw new Error('protected mutation declared');
          NODE
          (cd "$RELEASE_ROOT" && find . -type f -printf '%P\n' | sort) > "$RUNNER_TEMP/files.txt"
          test -s "$RUNNER_TEMP/files.txt"
          ! grep -Eq '^/|\.\./' "$RUNNER_TEMP/files.txt"
          while read -r rel; do mkdir -p "$RUNNER_TEMP/remote-backup/$(dirname "$rel")"; done < "$RUNNER_TEMP/files.txt"
          sed 's#/[^/]*$##' "$RUNNER_TEMP/files.txt" | grep -v '^$' | sort -u > "$RUNNER_TEMP/dirs.txt" || true
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - id: transfer
        name: Back up and upload only exact release files
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          host="$(printf '%s' "$FTP_HOST" | sed -e 's#^ftp[s]*://##' -e 's#/.*$##')"; if [[ "$host" != *:*:* && "$host" == *:* ]]; then host="${host%%:*}"; fi
          echo "::add-mask::$FTP_HOST"; echo "::add-mask::$FTP_USERNAME"; echo "::add-mask::$FTP_PASSWORD"
          backup="$RUNNER_TEMP/remote-backup"
          {
            echo 'set cmd:fail-exit false'; echo 'set net:max-retries 2'; echo 'set net:timeout 25'; echo 'set ftp:ssl-force true'; echo 'set ftp:ssl-protect-data true'; echo 'set ssl:verify-certificate true'; echo 'set ssl:check-hostname false'; echo "cd $FTP_REMOTE_DIR"
            while read -r rel; do echo "get $rel -o $backup/$rel"; done < "$RUNNER_TEMP/files.txt"
            echo 'bye'
          } > "$RUNNER_TEMP/backup.lftp"
          timeout 600 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/backup.lftp" "$host" || true
          {
            echo 'set cmd:fail-exit true'; echo 'set net:max-retries 3'; echo 'set net:timeout 30'; echo 'set ftp:ssl-force true'; echo 'set ftp:ssl-protect-data true'; echo 'set ssl:verify-certificate true'; echo 'set ssl:check-hostname false'; echo "cd $FTP_REMOTE_DIR"; echo "lcd $RELEASE_ROOT"
            while read -r dir; do [ -n "$dir" ] && echo "mkdir -p $dir"; done < "$RUNNER_TEMP/dirs.txt"
            while read -r rel; do echo "put $rel -o $rel"; done < "$RUNNER_TEMP/files.txt"
            echo 'bye'
          } > "$RUNNER_TEMP/upload.lftp"
          timeout 900 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/upload.lftp" "$host"
      - id: liveproof
        name: Prove exact live title
        if: ${{ steps.transfer.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            html="$(curl --fail --silent --show-error --location --connect-timeout 15 --max-time 45 -H 'Cache-Control: no-cache' "${LIVE_URL}?release=${GITHUB_SHA}-${GITHUB_RUN_ID}" || true)"
            if printf '%s' "$html" | grep -Fq "<title>$EXPECTED_TITLE</title>"; then echo "VERIFIED $LIVE_URL"; exit 0; fi
            sleep 10
          done
          exit 1
      - name: Roll back exact release files if proof fails
        if: ${{ steps.transfer.outcome == 'failure' || steps.liveproof.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          host="$(printf '%s' "$FTP_HOST" | sed -e 's#^ftp[s]*://##' -e 's#/.*$##')"; if [[ "$host" != *:*:* && "$host" == *:* ]]; then host="${host%%:*}"; fi
          backup="$RUNNER_TEMP/remote-backup"
          {
            echo 'set cmd:fail-exit false'; echo 'set net:max-retries 2'; echo 'set net:timeout 25'; echo 'set ftp:ssl-force true'; echo 'set ftp:ssl-protect-data true'; echo 'set ssl:verify-certificate true'; echo 'set ssl:check-hostname false'; echo "cd $FTP_REMOTE_DIR"
            while read -r rel; do echo "rm -f $rel"; done < "$RUNNER_TEMP/files.txt"
            while read -r dir; do [ -n "$dir" ] && echo "mkdir -p $dir"; done < "$RUNNER_TEMP/dirs.txt"
            while read -r rel; do [ -f "$backup/$rel" ] && echo "put $backup/$rel -o $rel"; done < "$RUNNER_TEMP/files.txt"
            echo 'bye'
          } > "$RUNNER_TEMP/rollback.lftp"
          timeout 900 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/rollback.lftp" "$host" || true
      - name: Fail after rollback
        if: ${{ steps.transfer.outcome == 'failure' || steps.liveproof.outcome == 'failure' }}
        run: exit 1

  complete:
    name: Prove all 18 static destinations and protected CryptoBotz
    needs: [authorize, validate, deploy]
    if: ${{ always() && needs.authorize.result == 'success' && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_MATRIX: ${{ needs.authorize.outputs.target_matrix }}
      DEPLOYMENT_MODE: ${{ needs.authorize.outputs.deployment_mode }}
      DEPLOY_RESULT: ${{ needs.deploy.result }}
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          if [ "$DEPLOYMENT_MODE" = handoff-only ]; then exit 0; fi
          test "$DEPLOY_RESULT" = success
          node -e 'for(const x of JSON.parse(process.env.TARGET_MATRIX).include) console.log([x.domain,x.expected_title].join("\t"))' > "$RUNNER_TEMP/targets.tsv"
          test "$(wc -l < "$RUNNER_TEMP/targets.tsv" | tr -d ' ')" = '18'
          while IFS=$'\t' read -r domain title; do
            html="$(curl --fail --silent --show-error --location --connect-timeout 15 --max-time 45 -H 'Cache-Control: no-cache' "https://$domain/?final=${GITHUB_SHA}-${GITHUB_RUN_ID}")"
            printf '%s' "$html" | grep -Fq "<title>$title</title>"
            echo "VERIFIED https://$domain/"
          done < "$RUNNER_TEMP/targets.tsv"
          curl --fail --silent --show-error --max-time 30 https://cryptobotz.cryptoworldz.xyz/ > "$RUNNER_TEMP/cryptobotz.html"
          test -s "$RUNNER_TEMP/cryptobotz.html"
          echo 'VERIFIED protected https://cryptobotz.cryptoworldz.xyz/'
