name: Deploy OneWorldz 19-Destination Total Release

on:
  push:
    branches: [main]
    paths:
      - 'deployments/oneworldz-19-total.request'

permissions:
  contents: read

concurrency:
  group: oneworldz-19-total-production
  cancel-in-progress: false

jobs:
  authorize:
    name: Lock canonical 18-static-target total authority
    runs-on: ubuntu-latest
    outputs:
      source_commit: ${{ steps.lock.outputs.source_commit }}
      target_matrix: ${{ steps.lock.outputs.target_matrix }}
      deployment_mode: ${{ steps.lock.outputs.deployment_mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: lock
        shell: bash
        run: |
          set -euo pipefail
          request='deployments/oneworldz-19-total.request'
          test -s "$request"
          requested_by="$(sed -n 's/^requested_by=//p' "$request" | tail -n1)"
          authorization="$(sed -n 's/^authorization=//p' "$request" | tail -n1)"
          scope="$(sed -n 's/^scope=//p' "$request" | tail -n1)"
          mode="$(sed -n 's/^mode=//p' "$request" | tail -n1)"
          targets="$(sed -n 's/^targets=//p' "$request" | tail -n1)"
          test "$requested_by" = 'JayJayTeamDev'
          test "$authorization" = 'APPROVE COMPLETE ECOSYSTEM BUILD AND TOTAL DEPLOYMENT'
          test "$scope" = 'LOCKED-ONEWORLDZ-ECOSYSTEM-18-STATIC-TARGETS'
          test "$targets" = 'all'
          case "$mode" in deploy|handoff-only) ;; *) echo '::error::Invalid deployment mode'; exit 1 ;; esac
          source_commit="$(git rev-parse HEAD)"
          echo "source_commit=$source_commit" >> "$GITHUB_OUTPUT"
          echo "deployment_mode=$mode" >> "$GITHUB_OUTPUT"
          cd apps/oneworldz-ecosystem-release
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { productionTargets, productionGate } from './production-targets.mjs';
          if (productionTargets.length !== 18) throw new Error('Production fleet must contain exactly 18 static targets');
          if (productionGate.ecosystemDestinations !== 19) throw new Error('Ecosystem must contain exactly 19 destinations');
          if (productionGate.activeOwnedRootDomains !== 15) throw new Error('Active owned roots must contain exactly 15 domains');
          if (JSON.stringify(productionGate.protectedDestinations) !== JSON.stringify(['cryptobotz.cryptoworldz.xyz'])) throw new Error('CryptoBotz protection drift');
          const forbidden = new Set(['cryptobotz.cryptoworldz.xyz','solworld.fun']);
          for (const site of productionTargets) if (forbidden.has(site.domain)) throw new Error('Protected/excluded destination entered static fleet: ' + site.domain);
          if (!productionTargets.some(site => site.domain === 'oneworldz.com')) throw new Error('OneWorldz global gateway missing from static fleet');
          console.log('target_matrix=' + JSON.stringify({ include: productionTargets.map(site => ({
            key: site.key,
            domain: site.domain,
            remote_dir: site.remoteDir,
            guard: site.guard,
            expected_title: site.expectedTitle
          })) }));
          NODE

  validate:
    name: Build and prove the whole release before any remote write
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.source_commit }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run complete canonical verification
        working-directory: apps/oneworldz-ecosystem-release
        run: npm run verify
      - name: Enforce whole-system boundaries and no public secrets
        shell: bash
        run: |
          set -euo pipefail
          root='apps/oneworldz-ecosystem-release/dist/ecosystem'
          test "$(find "$root" -mindepth 2 -maxdepth 2 -name index.html | wc -l | tr -d ' ')" = '18'
          test -s "$root/oneworldz/index.html"
          test ! -d "$root/cryptobotz"
          ! grep -Rni --include='*.html' 'solworld\.fun' "$root"
          ! grep -RIE 'OPENAI_API_KEY|sk-proj-|sk_live_|sk_test_|service_role|FTP_PASSWORD|DATABASE_URL|SUPABASE_SERVICE' "$root"
      - uses: actions/upload-artifact@v4
        with:
          name: oneworldz-19-perfect-${{ github.run_id }}
          path: apps/oneworldz-ecosystem-release/dist/ecosystem/
          if-no-files-found: error
          retention-days: 30

  preflight-fleet:
    name: Read-only prove all 18 exact Hostinger roots
    needs: [authorize, validate]
    if: ${{ needs.authorize.outputs.deployment_mode != 'handoff-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      TARGET_MATRIX: ${{ needs.authorize.outputs.target_matrix }}
    steps:
      - name: Install FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - name: Authenticate and prove exact roots without creating or deleting anything
        shell: bash
        run: |
          set -euo pipefail
          raw_host="$(printf '%s' "$FTP_HOST" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#^ftp://##' -e 's#^ftps://##' -e 's#/.*$##')"
          if [[ "$raw_host" != *:*:* && "$raw_host" == *:* ]]; then raw_host="${raw_host%%:*}"; fi
          test -n "$raw_host"
          echo "::add-mask::$FTP_HOST"
          echo "::add-mask::$FTP_USERNAME"
          echo "::add-mask::$FTP_PASSWORD"
          node -e 'for (const x of JSON.parse(process.env.TARGET_MATRIX).include) console.log(x.remote_dir)' > "$RUNNER_TEMP/dirs.txt"
          test "$(wc -l < "$RUNNER_TEMP/dirs.txt" | tr -d ' ')" = '18'
          {
            echo 'set cmd:fail-exit true'
            echo 'set net:max-retries 2'
            echo 'set net:timeout 30'
            echo 'set ftp:ssl-force true'
            echo 'set ftp:ssl-protect-data true'
            echo 'set ssl:verify-certificate true'
            echo 'set ssl:check-hostname false'
            while read -r dir; do echo "cd $dir"; echo 'pwd'; echo 'cls -1'; echo 'cd /'; done < "$RUNNER_TEMP/dirs.txt"
            echo 'bye'
          } > "$RUNNER_TEMP/preflight.lftp"
          ! grep -Eiq '(^|[[:space:]])(mkdir|mirror|put|mput|rm|mv|chmod)([[:space:]]|$)' "$RUNNER_TEMP/preflight.lftp"
          timeout 900 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/preflight.lftp" "$raw_host"

  deploy:
    name: Backup owned paths → deploy → prove ${{ matrix.domain }}
    needs: [authorize, validate, preflight-fleet]
    if: ${{ needs.authorize.outputs.deployment_mode != 'handoff-only' }}
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.authorize.outputs.target_matrix) }}
    environment:
      name: cryptoworldz-production
      url: https://${{ matrix.domain }}/
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      FTP_REMOTE_DIR: ${{ matrix.remote_dir }}
      DOMAIN: ${{ matrix.domain }}
      DEPLOY_GUARD: ${{ matrix.guard }}
      EXPECTED_TITLE: ${{ matrix.expected_title }}
      LIVE_URL: https://${{ matrix.domain }}/
      RELEASE_ROOT: apps/oneworldz-ecosystem-release/dist/ecosystem/${{ matrix.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.authorize.outputs.source_commit }}
      - uses: actions/download-artifact@v4
        with:
          name: oneworldz-19-perfect-${{ github.run_id }}
          path: apps/oneworldz-ecosystem-release/dist/ecosystem
      - name: Enforce exact package → exact destination contract
        shell: bash
        run: |
          set -euo pipefail
          case "$DOMAIN" in
            impactbased.cryptoworldz.xyz) expected_remote='domains/cryptoworldz.xyz/public_html/impactbased' ;;
            law.oneworldz.com) expected_remote='domains/oneworldz.com/public_html/law' ;;
            learn.oneworldz.com) expected_remote='domains/oneworldz.com/public_html/learn' ;;
            *) expected_remote="domains/$DOMAIN/public_html" ;;
          esac
          test "$FTP_REMOTE_DIR" = "$expected_remote"
          test -s "$RELEASE_ROOT/index.html"
          test -s "$RELEASE_ROOT/release-manifest.json"
          case "$LIVE_URL" in 'https://cryptobotz.cryptoworldz.xyz/'|'https://solworld.fun/') exit 1 ;; esac
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync(process.env.RELEASE_ROOT + '/release-manifest.json'));
          if (manifest.deploy_guard !== process.env.DEPLOY_GUARD) throw new Error('Deploy guard mismatch');
          if (manifest.ftp_root !== '/' || manifest.homepage !== '/index.html') throw new Error('Release-root contract mismatch');
          if ((manifest.protected_services_modified || []).length) throw new Error('Protected-service mutation declared');
          NODE
          find "$RELEASE_ROOT" -mindepth 1 -maxdepth 1 -printf '%f\n' | sort > "$RUNNER_TEMP/top-level.txt"
          test -s "$RUNNER_TEMP/top-level.txt"
          ! grep -Eq '[[:space:]/]' "$RUNNER_TEMP/top-level.txt"
      - name: Install FTPS client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
      - id: transfer
        name: Backup only package-owned paths and upload exact verified package
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          raw_host="$(printf '%s' "$FTP_HOST" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#^ftp://##' -e 's#^ftps://##' -e 's#/.*$##')"
          if [[ "$raw_host" != *:*:* && "$raw_host" == *:* ]]; then raw_host="${raw_host%%:*}"; fi
          echo "::add-mask::$FTP_HOST"
          echo "::add-mask::$FTP_USERNAME"
          echo "::add-mask::$FTP_PASSWORD"
          backup="$RUNNER_TEMP/remote-backup"
          mkdir -p "$backup"
          {
            echo 'set cmd:fail-exit false'
            echo 'set net:max-retries 3'
            echo 'set net:timeout 30'
            echo 'set ftp:ssl-force true'
            echo 'set ftp:ssl-protect-data true'
            echo 'set ssl:verify-certificate true'
            echo 'set ssl:check-hostname false'
            echo "cd $FTP_REMOTE_DIR"
            while read -r name; do
              if [ -d "$RELEASE_ROOT/$name" ]; then
                echo "mirror --verbose $name $backup/$name"
              else
                echo "get $name -o $backup/$name"
              fi
            done < "$RUNNER_TEMP/top-level.txt"
            echo 'set cmd:fail-exit true'
            echo "lcd $RELEASE_ROOT"
            while read -r name; do
              if [ -d "$RELEASE_ROOT/$name" ]; then
                echo "mirror -R --delete --verbose $name $name"
              else
                echo "put $name -o $name"
              fi
            done < "$RUNNER_TEMP/top-level.txt"
            echo 'bye'
          } > "$RUNNER_TEMP/deploy.lftp"
          timeout 1800 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/deploy.lftp" "$raw_host"
      - id: liveproof
        name: Prove exact live title after upload
        if: ${{ steps.transfer.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            html="$(curl --fail --silent --show-error --location --connect-timeout 15 --max-time 45 -H 'Cache-Control: no-cache' "${LIVE_URL}?release=${GITHUB_SHA}-${GITHUB_RUN_ID}" || true)"
            if printf '%s' "$html" | grep -Fq "<title>$EXPECTED_TITLE</title>"; then
              echo "Live proof passed: $LIVE_URL"
              exit 0
            fi
            sleep 20
          done
          echo "::error::Live title proof failed for $LIVE_URL"
          exit 1
      - name: Roll back only package-owned paths if transfer or live proof fails
        if: ${{ steps.transfer.outcome == 'failure' || steps.liveproof.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/remote-backup"
          test -d "$backup"
          raw_host="$(printf '%s' "$FTP_HOST" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's#^ftp://##' -e 's#^ftps://##' -e 's#/.*$##')"
          if [[ "$raw_host" != *:*:* && "$raw_host" == *:* ]]; then raw_host="${raw_host%%:*}"; fi
          {
            echo 'set cmd:fail-exit false'
            echo 'set net:max-retries 3'
            echo 'set net:timeout 30'
            echo 'set ftp:ssl-force true'
            echo 'set ftp:ssl-protect-data true'
            echo 'set ssl:verify-certificate true'
            echo 'set ssl:check-hostname false'
            echo "cd $FTP_REMOTE_DIR"
            while read -r name; do
              if [ -d "$RELEASE_ROOT/$name" ]; then echo "rm -r $name"; else echo "rm $name"; fi
            done < "$RUNNER_TEMP/top-level.txt"
            while read -r name; do
              if [ -d "$backup/$name" ]; then
                echo "lcd $backup"
                echo "mirror -R --verbose $name $name"
              elif [ -f "$backup/$name" ]; then
                echo "put $backup/$name -o $name"
              fi
            done < "$RUNNER_TEMP/top-level.txt"
            echo 'bye'
          } > "$RUNNER_TEMP/rollback.lftp"
          timeout 1800 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/rollback.lftp" "$raw_host"
      - name: Fail after rollback
        if: ${{ steps.transfer.outcome == 'failure' || steps.liveproof.outcome == 'failure' }}
        run: exit 1

  complete:
    name: Prove the 18 static destinations and protected CryptoBotz
    needs: [authorize, validate, deploy]
    if: ${{ always() && needs.authorize.result == 'success' && needs.validate.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_MATRIX: ${{ needs.authorize.outputs.target_matrix }}
      DEPLOYMENT_MODE: ${{ needs.authorize.outputs.deployment_mode }}
    steps:
      - name: Require all deployments or acknowledge handoff-only
        shell: bash
        env:
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail
          if [ "$DEPLOYMENT_MODE" = 'handoff-only' ]; then exit 0; fi
          test "$DEPLOY_RESULT" = 'success'
      - name: Prove every static homepage and protected application
        if: ${{ env.DEPLOYMENT_MODE != 'handoff-only' }}
        shell: bash
        run: |
          set -euo pipefail
          node -e 'for (const x of JSON.parse(process.env.TARGET_MATRIX).include) console.log([x.domain,x.expected_title].join("\t"))' > "$RUNNER_TEMP/targets.tsv"
          test "$(wc -l < "$RUNNER_TEMP/targets.tsv" | tr -d ' ')" = '18'
          while IFS=$'\t' read -r domain title; do
            html="$(curl --fail --silent --show-error --location --connect-timeout 15 --max-time 45 -H 'Cache-Control: no-cache' "https://$domain/?final=${GITHUB_SHA}-${GITHUB_RUN_ID}")"
            printf '%s' "$html" | grep -Fq "<title>$title</title>"
            echo "VERIFIED https://$domain/"
          done < "$RUNNER_TEMP/targets.tsv"
          curl --fail --silent --show-error --max-time 30 https://cryptobotz.cryptoworldz.xyz/ > "$RUNNER_TEMP/cryptobotz-root.html"
          test -s "$RUNNER_TEMP/cryptobotz-root.html"
          echo 'VERIFIED protected https://cryptobotz.cryptoworldz.xyz/'
