name: Worldz on-chain creator wallet discovery
on:
  push:
    paths:
      - 'tools/worldz-launch-record-creators.mjs'
      - '.github/workflows/worldz-onchain-launch-creators.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    environment: cryptoworldz-production
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect on-chain launch records
        env:
          BITQUERY_ACCESS_TOKEN: ${{ secrets.BITQUERY_ACCESS_TOKEN }}
        run: node tools/worldz-launch-record-creators.mjs
      - name: Save creator evidence
        run: |
          git config user.name "worldz-discovery-bot"
          git config user.email "worldz-discovery-bot@users.noreply.github.com"
          git add launchpad.cryptoworldz.xyz/wallet-snapshots/onchain-launch-creators.latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Record on-chain creator wallet evidence [cancel-full-deploy]"
            git push
          fi
