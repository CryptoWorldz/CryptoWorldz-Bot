name: WLDZ Owner Single-Signer Cutover Proof

on:
  push:
    branches: [main]
    paths:
      - "worldzpad-mainnet/scripts/build-wldz-owner-cutover.mjs"
      - ".github/workflows/wldz-owner-cutover.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worldzpad-mainnet
    env:
      SOLANA_RPC_URL: https://hknymhhyqldtzmplzuzh.supabase.co/functions/v1/worldz-solana-rpc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned SDKs
        run: npm install --no-audit --no-fund
      - name: Build + simulate owner cutover
        run: node scripts/build-wldz-owner-cutover.mjs
      - name: Upload exact owner cutover payload
        uses: actions/upload-artifact@v4
        with:
          name: wldz-owner-single-signer-cutover
          path: worldzpad-mainnet/artifacts/wldz-owner-cutover-*
          if-no-files-found: error
          retention-days: 30
