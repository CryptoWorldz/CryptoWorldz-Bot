name: Deploy Purple Diamond Crew Preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/cryptoworldz-web-core/**'
      - '.github/workflows/deploy-pdc-pages.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: purple-diamond-crew-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Prepare Purple Diamond Crew site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R apps/cryptoworldz-web-core/. _site/
          rm -rf _site/docs
          find _site -maxdepth 1 -type f -name '*.md' -delete
          sed -i "s/if (hostname !== 'purplediamondcrew.com') return;/if (hostname !== 'purplediamondcrew.com' \&\& hostname !== 'cryptoworldz.github.io') return;/" _site/assets/pdc-site.js
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
