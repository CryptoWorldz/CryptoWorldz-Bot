name: Deploy CryptoWorldz Standalone — Proof First

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'deployments/cryptoworldz-standalone.request'

permissions:
  contents: read

concurrency:
  group: cryptoworldz-standalone-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Back up, deploy and prove CryptoWorldz.xyz
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cryptoworldz-production
      url: https://cryptoworldz.xyz/command-centre-ultimate-20260811.html
    env:
      FTP_HOST: '145.223.108.40'
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: '21'
      FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || '/' }}
      FTP_ACCOUNT_SCOPE: DOMAIN_ONLY
      DEPLOY_GUARD: CRYPTOWORLDZ.XYZ
      LIVE_URL: https://cryptoworldz.xyz/command-centre-ultimate-20260811.html
      RELEASE_FILE: apps/cryptoworldz-web-core/command-centre-ultimate-20260811.html
      REMOTE_FILE: command-centre-ultimate-20260811.html
      HOSTINGER_LOCKED_IP: '145.223.108.40'
      HOSTINGER_TLS_ALIAS: 'cryptoworldz-ftp-pinned.hstgr.io'
      HOSTINGER_CERT_SHA256: '47:E1:B5:DC:5D:61:02:E8:ED:8C:01:21:61:AF:8B:22:53:70:AB:55:63:B0:0C:AF:14:6C:BD:7A:96:51:E9:5E'
    steps:
      - uses: actions/checkout@v4

      - name: Validate explicit CryptoWorldz request
        if: github.event_name == 'push'
        shell: bash
        env:
          APPROVED_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          test "$(sed -n 's/^target=//p' deployments/cryptoworldz-standalone.request | tail -n1)" = 'cryptoworldz.xyz'
          test "$(sed -n 's/^approval=//p' deployments/cryptoworldz-standalone.request | tail -n1)" = 'Approved by JayJayTeamDev'
          test "$(sed -n 's/^source_commit=//p' deployments/cryptoworldz-standalone.request | tail -n1)" = "$APPROVED_BEFORE"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify approved source and deployment policy
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run verify
          test -s "$RELEASE_FILE"
          grep -Fq 'Command Centre Ultimate' "$RELEASE_FILE"
          grep -Fq 'JayJayTeamDev' "$RELEASE_FILE"
          grep -Fq 'STATUS: LEGAL REVIEW' "$RELEASE_FILE"
          bash -n tools/cryptoworldz-versioned-ftp.sh
          source_sha="$(sha256sum "$RELEASE_FILE" | awk '{print $1}')"
          test -n "$source_sha"
          echo "APPROVED_RELEASE_SHA=$source_sha" >> "$GITHUB_ENV"

      - name: Install secure transfer and browser-proof tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp imagemagick

      - name: Lock target and prove pinned Hostinger TLS identity
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$FTP_USERNAME" && -n "$FTP_PASSWORD" ]] || { echo '::error::CryptoWorldz FTP credentials missing'; exit 1; }
          [[ "$FTP_HOST" == "$HOSTINGER_LOCKED_IP" && "$FTP_PORT" == '21' ]] || { echo '::error::Locked Hostinger target changed'; exit 1; }
          [[ "$FTP_SERVER_DIR" == '/' || "$FTP_SERVER_DIR" == '/public_html' ]] || { echo '::error::Unexpected CryptoWorldz FTP root'; exit 1; }
          [[ "$FTP_ACCOUNT_SCOPE" == 'DOMAIN_ONLY' && "$DEPLOY_GUARD" == 'CRYPTOWORLDZ.XYZ' ]] || { echo '::error::CryptoWorldz guard changed'; exit 1; }
          echo "::add-mask::$FTP_USERNAME"
          echo "::add-mask::$FTP_PASSWORD"
          echo "$HOSTINGER_LOCKED_IP $HOSTINGER_TLS_ALIAS" | sudo tee -a /etc/hosts >/dev/null
          test "$(getent ahostsv4 "$HOSTINGER_TLS_ALIAS" | awk 'NR==1{print $1}')" = "$HOSTINGER_LOCKED_IP"
          cert="$RUNNER_TEMP/hostinger-cert.pem"
          session="$RUNNER_TEMP/hostinger-session.txt"
          ok=0
          for attempt in 1 2 3; do
            rm -f "$cert" "$session"
            if timeout 25 openssl s_client -starttls ftp -connect "$HOSTINGER_LOCKED_IP:21" -verify_return_error -showcerts </dev/null >"$session" 2>/dev/null; then
              sed -n '/-----BEGIN CERTIFICATE-----/,/-----END CERTIFICATE-----/p' "$session" | sed -n '1,/-----END CERTIFICATE-----/p' > "$cert"
              if [[ -s "$cert" ]] \
                && [[ "$(openssl x509 -in "$cert" -noout -fingerprint -sha256 | cut -d= -f2)" == "$HOSTINGER_CERT_SHA256" ]] \
                && openssl x509 -in "$cert" -noout -ext subjectAltName | grep -Fq 'DNS:*.hstgr.io' \
                && grep -Fq 'Verify return code: 0 (ok)' "$session"; then ok=1; break; fi
            fi
            sleep 2
          done
          [[ "$ok" == '1' ]] || { echo '::error::Pinned Hostinger TLS proof failed'; exit 1; }
          echo "FTP_CONNECT_HOST=$HOSTINGER_TLS_ALIAS" >> "$GITHUB_ENV"

      - name: Prove encrypted domain-only target
        shell: bash
        run: |
          set -euo pipefail
          timeout 45 lftp -u "$FTP_USERNAME","$FTP_PASSWORD" -p "$FTP_PORT" "$FTP_CONNECT_HOST" -e "set cmd:fail-exit yes; set ftp:ssl-force yes; set ftp:ssl-protect-data yes; set ssl:verify-certificate yes; set ssl:check-hostname yes; cd '$FTP_SERVER_DIR'; bye"

      - name: Capture exact predeploy state
        shell: bash
        run: |
          set -euo pipefail
          backup="$RUNNER_TEMP/versioned-before.html"
          rm -f "$backup"
          FTP_TRANSFER_TIMEOUT=90 bash tools/cryptoworldz-versioned-ftp.sh backup "$backup" "$REMOTE_FILE"
          if [[ -s "$backup" ]]; then
            sha256sum "$backup" > "$RUNNER_TEMP/versioned-before.sha256"
            echo 'VERSIONED_PREEXISTED=true' >> "$GITHUB_ENV"
          else
            printf '%s\n' 'ABSENT' > "$RUNNER_TEMP/versioned-before.sha256"
            echo 'VERSIONED_PREEXISTED=false' >> "$GITHUB_ENV"
          fi

      - name: Preserve rollback proof before upload
        uses: actions/upload-artifact@v4
        with:
          name: cryptoworldz-ultimate-predeploy-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/versioned-before.sha256
            ${{ runner.temp }}/versioned-before.html
          retention-days: 14
          if-no-files-found: warn

      - name: Upload one uncached Ultimate release file
        shell: bash
        run: |
          set -euo pipefail
          echo 'CRYPTOWORLDZ_UPLOAD_STARTED=true' >> "$GITHUB_ENV"
          FTP_TRANSFER_TIMEOUT=90 bash tools/cryptoworldz-versioned-ftp.sh upload "$GITHUB_WORKSPACE/$RELEASE_FILE" "$REMOTE_FILE"

      - name: Prove exact remote SHA-256
        shell: bash
        run: |
          set -euo pipefail
          remote="$RUNNER_TEMP/versioned-after.html"
          FTP_TRANSFER_TIMEOUT=90 bash tools/cryptoworldz-versioned-ftp.sh verify "$remote" "$REMOTE_FILE"
          remote_sha="$(sha256sum "$remote" | awk '{print $1}')"
          [[ "$remote_sha" == "$APPROVED_RELEASE_SHA" ]] || { echo "::error::Remote SHA mismatch"; exit 1; }
          echo "CRYPTOWORLDZ_REMOTE_SHA256=PASS $remote_sha"

      - name: Prove uncached public URL
        shell: bash
        run: |
          set -euo pipefail
          body="$RUNNER_TEMP/versioned-live.html"
          ok=0
          for attempt in $(seq 1 12); do
            code="$(curl -4 -L -sS -o "$body" -w '%{http_code}' --retry 1 --retry-all-errors -H 'Cache-Control: no-cache, no-store, must-revalidate' --max-time 30 "$LIVE_URL?release=${GITHUB_SHA}-${GITHUB_RUN_ID}-${attempt}" || true)"
            if [[ "$code" == '200' ]] \
              && grep -Fq 'Command Centre Ultimate' "$body" \
              && grep -Fq 'JayJayTeamDev' "$body" \
              && grep -Fq 'STATUS: LEGAL REVIEW' "$body"; then ok=1; break; fi
            sleep 4
          done
          [[ "$ok" == '1' ]] || { echo '::error::Versioned public Ultimate URL did not prove'; exit 1; }
          echo 'CRYPTOWORLDZ_PUBLIC_VERSIONED_PROOF=PASS'

      - name: Prove desktop and mobile rendering
        shell: bash
        run: |
          set -euo pipefail
          WORLDZ_PROOF_DIR="$RUNNER_TEMP/ultimate-versioned-proof" node tools/prove-live-worldz-v2.mjs "$LIVE_URL" 'Command Centre Ultimate'

      - name: Preserve production browser proof
        uses: actions/upload-artifact@v4
        with:
          name: cryptoworldz-ultimate-production-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/ultimate-versioned-proof/
          retention-days: 30
          if-no-files-found: error

      - name: Restore exact predeploy state if proof fails
        if: failure() && env.CRYPTOWORLDZ_UPLOAD_STARTED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          before="$RUNNER_TEMP/versioned-before.html"
          if [[ "$VERSIONED_PREEXISTED" == 'true' ]]; then
            FTP_TRANSFER_TIMEOUT=90 bash tools/cryptoworldz-versioned-ftp.sh restore "$before" "$REMOTE_FILE"
            verify="$RUNNER_TEMP/versioned-rollback.html"
            FTP_TRANSFER_TIMEOUT=90 bash tools/cryptoworldz-versioned-ftp.sh verify "$verify" "$REMOTE_FILE"
            diff -u <(sha256sum "$before" | awk '{print $1}') <(sha256sum "$verify" | awk '{print $1}')
          else
            rm -f "$before"
            FTP_TRANSFER_TIMEOUT=90 bash tools/cryptoworldz-versioned-ftp.sh restore "$before" "$REMOTE_FILE"
            check="$RUNNER_TEMP/versioned-rollback-check.html"
            rm -f "$check"
            FTP_TRANSFER_TIMEOUT=90 bash tools/cryptoworldz-versioned-ftp.sh backup "$check" "$REMOTE_FILE"
            [[ ! -e "$check" ]] || { echo '::error::Rollback failed to remove new versioned file'; exit 1; }
          fi
          echo 'CRYPTOWORLDZ_VERSIONED_ROLLBACK_EXACT=PASS'
