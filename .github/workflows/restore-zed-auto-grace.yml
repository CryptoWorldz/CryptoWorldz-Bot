name: Restore ZED AUTO GRACE Command Centre

on:
  push:
    branches: [main]
    paths:
      - "index.js"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "public/**"
      - ".well-known/**"
      - ".github/full-current-zed-runtime.sh"
      - ".github/workflows/restore-zed-auto-grace.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-zed-auto-grace
  cancel-in-progress: false

env:
  PROTECTED_DOMAIN: cryptobotz.cryptoworldz.xyz
  PROTECTED_NODE_ROOT: /domains/cryptobotz.cryptoworldz.xyz/nodejs

jobs:
  restore:
    name: Restore ZED + AUTO + GRACE + Command Centre
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BOT_TOKEN_SECRET: ${{ secrets.BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN || secrets.ZED_BOT_TOKEN || secrets.CRYPTOWORLDZ_BOT_TOKEN }}
      SUPABASE_URL_SECRET: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY_SECRET: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_PUBLISHABLE_KEY_SECRET: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_KEY }}

    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install repository FTPS transport
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/lftp-compat.py
          mkdir -p "$RUNNER_TEMP/oneworldz-bin"
          cat > "$RUNNER_TEMP/oneworldz-bin/lftp" <<'SH'
          #!/usr/bin/env bash
          exec python3 "$GITHUB_WORKSPACE/.github/lftp-compat.py" "$@"
          SH
          chmod +x "$RUNNER_TEMP/oneworldz-bin/lftp"
          echo "$RUNNER_TEMP/oneworldz-bin" >> "$GITHUB_PATH"

      - name: Diagnose protected secret names without exposing values
        shell: bash
        env:
          HAS_BOT_TOKEN: ${{ secrets.BOT_TOKEN != '' }}
          HAS_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
          HAS_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN != '' }}
          HAS_ZED_BOT_TOKEN: ${{ secrets.ZED_BOT_TOKEN != '' }}
          HAS_CRYPTOWORLDZ_BOT_TOKEN: ${{ secrets.CRYPTOWORLDZ_BOT_TOKEN != '' }}
          HAS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
          HAS_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY != '' }}
          HAS_SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY != '' }}
          HAS_SUPABASE_KEY: ${{ secrets.SUPABASE_KEY != '' }}
          HAS_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY != '' }}
          HAS_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY != '' }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "BOT_TOKEN=$HAS_BOT_TOKEN" \
            "TELEGRAM_BOT_TOKEN=$HAS_TELEGRAM_BOT_TOKEN" \
            "TELEGRAM_TOKEN=$HAS_TELEGRAM_TOKEN" \
            "ZED_BOT_TOKEN=$HAS_ZED_BOT_TOKEN" \
            "CRYPTOWORLDZ_BOT_TOKEN=$HAS_CRYPTOWORLDZ_BOT_TOKEN" \
            "SUPABASE_SERVICE_ROLE_KEY=$HAS_SUPABASE_SERVICE_ROLE_KEY" \
            "SUPABASE_SERVICE_KEY=$HAS_SUPABASE_SERVICE_KEY" \
            "SUPABASE_SECRET_KEY=$HAS_SUPABASE_SECRET_KEY" \
            "SUPABASE_KEY=$HAS_SUPABASE_KEY" \
            "SUPABASE_ANON_KEY=$HAS_SUPABASE_ANON_KEY" \
            "SUPABASE_PUBLISHABLE_KEY=$HAS_SUPABASE_PUBLISHABLE_KEY"

      - name: Recover protected ZED environment from Hostinger backups
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import io, os, posixpath, re
          from ftplib import FTP_TLS

          domain_root = "/domains/cryptobotz.cryptoworldz.xyz"
          node_root = domain_root + "/nodejs"
          public_root = domain_root + "/public_html"
          required = ("BOT_TOKEN",)

          host = os.environ["FTP_HOST"].replace("ftps://","").replace("ftp://","").split("/")[0]
          if host.count(":") == 1:
              host = host.split(":",1)[0]
          port = int(os.environ.get("FTP_PORT","21"))
          ftp = FTP_TLS()
          ftp.connect(host, port, timeout=45)
          ftp.login(os.environ["FTP_USERNAME"], os.environ["FTP_PASSWORD"])
          ftp.prot_p()

          def read_file(path):
              buf = io.BytesIO()
              try:
                  ftp.retrbinary("RETR " + path, buf.write)
              except Exception:
                  return None
              data = buf.getvalue()
              if not data or len(data) > 262144:
                  return None
              try:
                  return data.decode("utf-8")
              except UnicodeDecodeError:
                  return None

          def parse(text):
              out = {}
              for raw in (text or "").splitlines():
                  line = raw.strip()
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  key, value = line.split("=", 1)
                  key = re.sub(r"^export\s+", "", key).strip()
                  value = value.strip()
                  if len(value) >= 2 and value[0] == value[-1] and value[0] in ("'", '"'):
                      value = value[1:-1]
                  if re.match(r"^[A-Za-z_][A-Za-z0-9_]*$", key) and value:
                      out[key] = value
              return out

          candidates = {
              node_root + "/.env",
              node_root + "/.env.production",
              node_root + "/.env.backup",
              node_root + "/.env.bak",
              node_root + "/protected.env",
              domain_root + "/.env",
              public_root + "/.env",
          }

          def safe_list(path):
              try:
                  return ftp.nlst(path)
              except Exception:
                  return []

          for base in (node_root, domain_root, public_root):
              for entry in safe_list(base):
                  name = posixpath.basename(str(entry).rstrip("/"))
                  low = name.lower()
                  if "env" in low or "protected" in low:
                      candidates.add(entry if str(entry).startswith("/") else posixpath.join(base, name))

          for container in (node_root + "/releases", node_root + "/backups", node_root + "/builds"):
              for entry in safe_list(container):
                  full = entry if str(entry).startswith("/") else posixpath.join(container, posixpath.basename(str(entry).rstrip("/")))
                  candidates.add(full + "/.env")
                  candidates.add(full + "/protected.env")

          found = []
          current_text = read_file(node_root + "/.env") or ""
          current = parse(current_text)
          for path in sorted(candidates):
              text = read_file(path)
              if text is None:
                  continue
              values = parse(text)
              present = tuple(k for k in required if values.get(k))
              if present:
                  found.append((len(present), len(values), path, values))

          # Hostinger managed Node environment can retain values even when the
          # filesystem .env was replaced. Read it server-side without logging values.
          managed = {}
          try:
              import json, urllib.parse, urllib.request
              domain = "cryptobotz.cryptoworldz.xyz"
              token = os.environ.get("HOSTINGER_API_TOKEN", "").strip()
              req = urllib.request.Request(
                  "https://developers.hostinger.com/api/hosting/v1/websites?domain=" + urllib.parse.quote(domain) + "&per_page=25",
                  headers={"Authorization":"Bearer "+token,"Accept":"application/json"}
              )
              with urllib.request.urlopen(req, timeout=30) as response:
                  websites = json.loads(response.read().decode("utf-8"))
              row = next((x for x in websites.get("data",[]) if str(x.get("domain","")).lower()==domain), None)
              if row and row.get("username"):
                  username = urllib.parse.quote(str(row["username"]), safe="")
                  denv = urllib.parse.quote(domain, safe="")
                  env_url = f"https://developers.hostinger.com/api/hosting/v1/accounts/{username}/websites/{denv}/nodejs/builds/settings/env"
                  req = urllib.request.Request(env_url, headers={"Authorization":"Bearer "+token,"Accept":"application/json"})
                  with urllib.request.urlopen(req, timeout=30) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  def collect(obj):
                      if isinstance(obj, dict):
                          k = obj.get("key") or obj.get("name")
                          v = obj.get("value")
                          if isinstance(k,str) and isinstance(v,(str,int,float,bool)) and str(v).strip() and str(v).strip() not in ("***","********"):
                              managed[k] = str(v)
                          for value in obj.values():
                              collect(value)
                      elif isinstance(obj, list):
                          for value in obj: collect(value)
                  collect(payload)
          except Exception:
              managed = {}

          # Merge legitimate protected sources, but do NOT blindly trust the
          # current BOT_TOKEN. Test every recovered candidate against Telegram
          # and choose a token Telegram itself confirms is valid.
          import json, urllib.request
          bot_candidates = []
          def add_bot(value):
              value = str(value or "").strip()
              if value and value not in bot_candidates:
                  bot_candidates.append(value)

          add_bot(os.environ.get("BOT_TOKEN_SECRET", ""))
          add_bot(current.get("BOT_TOKEN", ""))
          for _, _, _, values in found:
              add_bot(values.get("BOT_TOKEN", ""))
          add_bot(managed.get("BOT_TOKEN", ""))

          valid_bot_token = ""
          for candidate in bot_candidates:
              try:
                  req = urllib.request.Request(
                      "https://api.telegram.org/bot" + candidate + "/getMe",
                      headers={"Accept":"application/json"}
                  )
                  with urllib.request.urlopen(req, timeout=15) as response:
                      result = json.loads(response.read().decode("utf-8"))
                  if result.get("ok") is True and result.get("result", {}).get("id"):
                      valid_bot_token = candidate
                      break
              except Exception:
                  continue

          merged = {}
          merged.update({k:v for k,v in current.items() if v and k != "BOT_TOKEN"})
          merged["SUPABASE_URL"] = os.environ.get("SUPABASE_URL_SECRET", "").strip() or "https://hknymhhyqldtzmplzuzh.supabase.co"
          service_key = os.environ.get("SUPABASE_SERVICE_ROLE_KEY_SECRET", "").strip()
          publishable_key = os.environ.get("SUPABASE_PUBLISHABLE_KEY_SECRET", "").strip()
          if service_key:
              merged["SUPABASE_SERVICE_ROLE_KEY"] = service_key
          merged["SUPABASE_PUBLISHABLE_KEY"] = publishable_key or merged.get("SUPABASE_PUBLISHABLE_KEY", "") or "sb_publishable_3ognbqSCTAcAnLHOeKZp8A_IgriwUJV"
          for _, _, _, values in sorted(found, key=lambda row: row[0]):
              for key, value in values.items():
                  if value and key not in merged and key != "BOT_TOKEN":
                      merged[key] = value
          for key, value in managed.items():
              if value and key not in merged and key != "BOT_TOKEN":
                  merged[key] = value
          if valid_bot_token:
              merged["BOT_TOKEN"] = valid_bot_token

          print("ZED_TELEGRAM_TOKEN_CANDIDATES_CHECKED=" + str(len(bot_candidates)))
          print("ZED_TELEGRAM_VALID_TOKEN_FOUND=" + ("YES" if valid_bot_token else "NO"))

          missing = [key for key in required if not merged.get(key)]
          if missing:
              print("ZED_ENV_RECOVERY=FAIL")
              print("ZED_ENV_MISSING_KEYS=" + ",".join(missing))
              print("HOSTINGER_MANAGED_ENV_REQUIRED_KEYS=" + str(sum(1 for k in required if managed.get(k))) + "_OF_1")
              raise SystemExit("Protected BOT_TOKEN is still missing")

          source = "merged-protected-sources"

          # Prefer current protected OpenAI key supplied by GitHub without logging it.
          openai = os.environ.get("OPENAI_API_KEY", "").strip()
          if openai:
              merged["OPENAI_API_KEY"] = openai

          # Bootstrap the database bridge from the already-protected Telegram
          # bot token. Telegram validates the token; Supabase stores only a
          # one-way derived runtime key, never the bot token itself.
          import json, urllib.request
          bootstrap_url = merged["SUPABASE_URL"] + "/rest/v1/rpc/zed_runtime_bootstrap"
          request = urllib.request.Request(
              bootstrap_url,
              data=json.dumps({"p_bot_token": merged["BOT_TOKEN"]}).encode("utf-8"),
              headers={
                  "apikey": merged["SUPABASE_PUBLISHABLE_KEY"],
                  "content-type": "application/json"
              },
              method="POST"
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              bootstrap_result = json.loads(response.read().decode("utf-8"))
          if bootstrap_result is not True:
              raise SystemExit("ZED_SUPABASE_BRIDGE_BOOTSTRAP_FAILED")

          payload = "".join(f"{k}={v}\n" for k, v in sorted(merged.items()))
          bio = io.BytesIO(payload.encode("utf-8"))
          ftp.storbinary("STOR " + node_root + "/.env", bio)
          ftp.quit()

          print("ZED_ENV_RECOVERY=PASS")
          print("ZED_SUPABASE_BRIDGE=PASS")
          print("ZED_ENV_SOURCE=" + posixpath.basename(source))
          print("ZED_ENV_REQUIRED_KEYS=BOT_TOKEN,SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY")
          PY

      - name: Prove restored historical runtime is present
        shell: bash
        run: |
          set -euo pipefail
          test -s src/full-runtime-entry.js
          test -s src/telegram.js
          test -s src/auto/telegram.js
          test -s src/grace/telegram.js
          test -s public/miniapp/index.html
          grep -Fq 'registerAutoTelegramHandlers' src/full-runtime-entry.js
          grep -Fq 'registerGraceTelegramHandlers' src/full-runtime-entry.js
          grep -Fq 'registerProjectWalletSystem' src/full-runtime-entry.js
          grep -Fq 'leaderboard' src/telegram.js
          grep -Fq 'wallet' src/telegram.js
          grep -Fq 'governance' src/telegram.js
          grep -Fq 'kitty' src/telegram.js
          echo 'ZED_AUTO_GRACE_HISTORICAL_RUNTIME=PASS'

      - name: Deploy restored protected runtime
        shell: bash
        run: |
          set -euo pipefail
          zed_log="$RUNNER_TEMP/zed-restore.log"
          status=0
          if bash .github/full-current-zed-runtime.sh 2>&1 | tee "$zed_log"; then
            status=0
          else
            status=1
          fi

          if [ "$status" != 0 ]; then
            core_pass=0
            for attempt in $(seq 1 12); do
              sleep 4
              tag="restore_zed=${GITHUB_SHA}-${GITHUB_RUN_ID}-${attempt}"
              root_code="$(curl --silent --show-error --location --connect-timeout 5 --max-time 12 -o "$RUNNER_TEMP/root.json" -w '%{http_code}' "https://$PROTECTED_DOMAIN/?$tag" || true)"
              health_code="$(curl --silent --show-error --location --connect-timeout 5 --max-time 12 -o "$RUNNER_TEMP/health.json" -w '%{http_code}' "https://$PROTECTED_DOMAIN/health?$tag" || true)"
              mini_code="$(curl --silent --show-error --location --connect-timeout 5 --max-time 12 -o "$RUNNER_TEMP/mini.html" -w '%{http_code}' "https://$PROTECTED_DOMAIN/miniapp/?$tag" || true)"
              root_service=0; health_ok=0; splashback=0; zed_guide=0; create=0; heroes=0
              grep -Fq '"service":"CryptoWorldz Zed Bot"' "$RUNNER_TEMP/root.json" && root_service=1 || true
              grep -Fq '"ok":true' "$RUNNER_TEMP/health.json" && health_ok=1 || true
              grep -Fq 'id="splashback"' "$RUNNER_TEMP/mini.html" && splashback=1 || true
              grep -Fq 'id="zed-guide"' "$RUNNER_TEMP/mini.html" && zed_guide=1 || true
              grep -Fq 'id="create"' "$RUNNER_TEMP/mini.html" && create=1 || true
              grep -Fq 'id="heroes"' "$RUNNER_TEMP/mini.html" && heroes=1 || true
              echo "RESTORE_ZED_PROBE attempt=$attempt root=$root_code health=$health_code mini=$mini_code service=$root_service ok=$health_ok splashback=$splashback guide=$zed_guide create=$create heroes=$heroes"
              if [ "$root_code" = 200 ] && [ "$health_code" = 200 ] && [ "$mini_code" = 200 ]                 && [ "$root_service" = 1 ] && [ "$health_ok" = 1 ] && [ "$splashback" = 1 ]                 && [ "$zed_guide" = 1 ] && [ "$create" = 1 ] && [ "$heroes" = 1 ]; then
                core_pass=1
                break
              fi
            done
            test "$core_pass" = 1
          fi
          echo 'ZED_AUTO_GRACE_LIVE_CORE=PASS'

      - name: Configure and prove Telegram legacy Command Centre
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, os, re, urllib.request
          from ftplib import FTP_TLS

          root="/domains/cryptobotz.cryptoworldz.xyz/nodejs"
          host=os.environ["FTP_HOST"].replace("ftps://","").replace("ftp://","").split("/")[0]
          if host.count(":")==1: host=host.split(":",1)[0]
          ftp=FTP_TLS(); ftp.connect(host,int(os.environ.get("FTP_PORT","21")),timeout=45)
          ftp.login(os.environ["FTP_USERNAME"],os.environ["FTP_PASSWORD"]); ftp.prot_p()
          buf=io.BytesIO(); ftp.retrbinary("RETR "+root+"/.env",buf.write); ftp.quit()
          env={}
          for raw in buf.getvalue().decode("utf-8").splitlines():
              line=raw.strip()
              if not line or line.startswith("#") or "=" not in line: continue
              k,v=line.split("=",1); k=re.sub(r"^export\s+","",k).strip(); v=v.strip().strip('"').strip("'")
              if v: env[k]=v
          token=env.get("BOT_TOKEN","")
          if not token: raise SystemExit("BOT_TOKEN missing after protected recovery")
          print("::add-mask::"+token)

          api="https://api.telegram.org/bot"+token+"/"
          def call(method,payload=None):
              data=None
              headers={}
              if payload is not None:
                  data=json.dumps(payload).encode("utf-8")
                  headers["content-type"]="application/json"
              with urllib.request.urlopen(urllib.request.Request(api+method,data=data,headers=headers),timeout=30) as r:
                  out=json.loads(r.read().decode("utf-8"))
              if out.get("ok") is not True: raise SystemExit("Telegram "+method+" failed")
              return out.get("result")

          commands=[
            {"command":"start","description":"Open the Zed Command Centre"},
            {"command":"help","description":"View the public command menu"},
            {"command":"register","description":"Register your Legend Profile"},
            {"command":"profile","description":"View your Legend Profile"},
            {"command":"rewards","description":"View reward history"},
            {"command":"points","description":"View your Legend Points"},
            {"command":"leaderboard","description":"View the Top 25 Legends"},
            {"command":"raaiiidd","description":"View the newest active Raaiiidd"},
            {"command":"missions","description":"View every active Raaiiidd"},
            {"command":"wallet","description":"Connect a public Solana wallet"},
            {"command":"kitty","description":"View the community SOL/USDC kitty"},
            {"command":"governance","description":"View active community votes"},
            {"command":"vote","description":"Vote on a governance proposal"},
            {"command":"impact","description":"Open the featured impact mission"},
            {"command":"donate","description":"Open the featured donation route"},
            {"command":"cancel","description":"Cancel wallet registration"},
            {"command":"community","description":"Open CryptoWorldz community links"},
            {"command":"website","description":"Open CryptoWorldz.xyz"}
          ]
          call("setMyCommands",{"commands":commands})
          call("setChatMenuButton",{"menu_button":{"type":"web_app","text":"🌐 OPEN COMMAND CENTRE","web_app":{"url":"https://cryptobotz.cryptoworldz.xyz/miniapp/"}}})
          secret=hashlib.sha256(token.encode()).hexdigest()
          call("setWebhook",{
            "url":"https://cryptobotz.cryptoworldz.xyz/telegram-webhook",
            "secret_token":secret,
            "allowed_updates":["message","callback_query"],
            "drop_pending_updates":False
          })
          bot=call("getMe")
          actual=call("getMyCommands")
          hook=call("getWebhookInfo")
          got=[x.get("command") for x in actual]
          expected=[x["command"] for x in commands]
          if got != expected: raise SystemExit("Telegram command list mismatch")
          if hook.get("url") != "https://cryptobotz.cryptoworldz.xyz/telegram-webhook": raise SystemExit("Telegram webhook URL mismatch")
          if hook.get("last_error_message"): raise SystemExit("Telegram webhook reports an error: "+str(hook.get("last_error_message"))[:160])
          print("ZED_TELEGRAM_BOT=PASS")
          print("ZED_TELEGRAM_COMMANDS=18")
          print("ZED_TELEGRAM_WEBHOOK=PASS")
          print("ZED_TELEGRAM_MENU_BUTTON=PASS")
          PY

      - name: Prove live AUTO, GRACE and protected surfaces
        shell: bash
        run: |
          set -euo pipefail
          root="https://$PROTECTED_DOMAIN"
          test "$(curl --silent --show-error --location -o "$RUNNER_TEMP/grace.json" -w '%{http_code}' "$root/grace/health")" = 200
          grep -Fq '"ok":true' "$RUNNER_TEMP/grace.json"
          auto_code="$(curl --silent --show-error --location -o "$RUNNER_TEMP/auto.json" -w '%{http_code}' "$root/api/mini/auto/status" || true)"
          case "$auto_code" in 200|401|403) ;; *) echo "AUTO route missing HTTP=$auto_code"; exit 1;; esac
          wallet_code="$(curl --silent --show-error --location -o "$RUNNER_TEMP/wallet.json" -w '%{http_code}' "$root/api/mini/project-wallets" || true)"
          case "$wallet_code" in 200|401|403) ;; *) echo "Project-wallet route missing HTTP=$wallet_code"; exit 1;; esac
          gpt_code="$(curl --silent --show-error --location -o "$RUNNER_TEMP/gpt.json" -w '%{http_code}' "$root/api/oneworldz-gpt/status" || true)"
          test "$gpt_code" = 200
          echo 'ZED_AUTO_ROUTE=PASS'
          echo 'ZED_GRACE_ROUTE=PASS'
          echo 'ZED_PROJECT_WALLETS_ROUTE=PASS'
          echo 'ONEWORLDZ_GPT_ROUTE=PASS'

      - name: Final verdict
        run: echo 'ZED_AUTO_GRACE_COMMAND_CENTRE_RESTORED=PASS'
