name: Restore ZED AUTO GRACE Command Centre

on:
  push:
    branches: [main]
    paths:
      - "index.js"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "supabase/migrations/*worldz_fullscope*.sql"
      - "public/**"
      - ".well-known/**"
      - ".github/full-current-zed-runtime.sh"
      - ".github/workflows/restore-zed-auto-grace.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: restore-zed-auto-grace
  cancel-in-progress: true

env:
  PROTECTED_DOMAIN: cryptobotz.cryptoworldz.xyz
  PROTECTED_NODE_ROOT: /domains/cryptobotz.cryptoworldz.xyz/nodejs

jobs:
  restore:
    name: Restore ZED + AUTO + GRACE + Command Centre
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      BOT_TOKEN_SECRET: ${{ secrets.BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN || secrets.ZED_BOT_TOKEN || secrets.CRYPTOWORLDZ_BOT_TOKEN }}
      SUPABASE_URL_SECRET: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY_SECRET: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY || secrets.SUPABASE_SECRET_KEY }}
      SUPABASE_PUBLISHABLE_KEY_SECRET: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_ANON_KEY || secrets.SUPABASE_KEY }}

    steps:
      - name: Checkout exact current main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install repository FTPS transport
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/lftp-compat.py
          mkdir -p "$RUNNER_TEMP/oneworldz-bin"
          cat > "$RUNNER_TEMP/oneworldz-bin/lftp" <<'SH'
          #!/usr/bin/env bash
          exec python3 "$GITHUB_WORKSPACE/.github/lftp-compat.py" "$@"
          SH
          chmod +x "$RUNNER_TEMP/oneworldz-bin/lftp"
          echo "$RUNNER_TEMP/oneworldz-bin" >> "$GITHUB_PATH"

      - name: Diagnose protected secret names without exposing values
        shell: bash
        env:
          HAS_BOT_TOKEN: ${{ secrets.BOT_TOKEN != '' }}
          HAS_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}
          HAS_TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN != '' }}
          HAS_ZED_BOT_TOKEN: ${{ secrets.ZED_BOT_TOKEN != '' }}
          HAS_CRYPTOWORLDZ_BOT_TOKEN: ${{ secrets.CRYPTOWORLDZ_BOT_TOKEN != '' }}
          HAS_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
          HAS_SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY != '' }}
          HAS_SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY != '' }}
          HAS_SUPABASE_KEY: ${{ secrets.SUPABASE_KEY != '' }}
          HAS_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY != '' }}
          HAS_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY != '' }}
        run: |
          set -euo pipefail
          printf '%s\n' \
            "BOT_TOKEN=$HAS_BOT_TOKEN" \
            "TELEGRAM_BOT_TOKEN=$HAS_TELEGRAM_BOT_TOKEN" \
            "TELEGRAM_TOKEN=$HAS_TELEGRAM_TOKEN" \
            "ZED_BOT_TOKEN=$HAS_ZED_BOT_TOKEN" \
            "CRYPTOWORLDZ_BOT_TOKEN=$HAS_CRYPTOWORLDZ_BOT_TOKEN" \
            "SUPABASE_SERVICE_ROLE_KEY=$HAS_SUPABASE_SERVICE_ROLE_KEY" \
            "SUPABASE_SERVICE_KEY=$HAS_SUPABASE_SERVICE_KEY" \
            "SUPABASE_SECRET_KEY=$HAS_SUPABASE_SECRET_KEY" \
            "SUPABASE_KEY=$HAS_SUPABASE_KEY" \
            "SUPABASE_ANON_KEY=$HAS_SUPABASE_ANON_KEY" \
            "SUPABASE_PUBLISHABLE_KEY=$HAS_SUPABASE_PUBLISHABLE_KEY"

      - name: Validate protected ZED runtime credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, urllib.request

          token=str(os.environ.get("BOT_TOKEN_SECRET","")).strip()
          if not token:
              raise SystemExit("Protected Telegram bot token is missing.")
          print("::add-mask::"+token)

          request=urllib.request.Request(
              "https://api.telegram.org/bot"+token+"/getMe",
              headers={"Accept":"application/json","User-Agent":"ZED-Restore-Preflight/1.0"}
          )
          with urllib.request.urlopen(request,timeout=20) as response:
              payload=json.loads(response.read().decode("utf-8"))
          if payload.get("ok") is not True or not payload.get("result",{}).get("id"):
              raise SystemExit("Protected Telegram bot token failed Telegram validation.")

          print("ZED_TELEGRAM_PROTECTED_TOKEN=PASS")
          print("ZED_PROTECTED_CREDENTIAL_PREFLIGHT=PASS")
          PY

      - name: Verify WorldzFullScope database schema before runtime activation
        shell: python
        run: |
          import json, os, urllib.parse, urllib.request

          base=str(os.environ.get("SUPABASE_URL_SECRET","")).rstrip("/")
          key=str(os.environ.get("SUPABASE_SERVICE_ROLE_KEY_SECRET","")).strip()
          if not base or not key:
              raise SystemExit("FullScope schema verification requires Supabase service credentials.")
          print("::add-mask::"+key)

          headers={
              "apikey":key,
              "authorization":"Bearer "+key,
              "accept":"application/json",
              "user-agent":"WorldzFullScope-Schema-Gate/1.0"
          }
          probes=[
              ("worldz_fullscope_chains","chain_key,label,family,mainnet_execution_enabled"),
              ("worldz_fullscope_tokens","id,chain_key,name,symbol,status"),
              ("worldz_popularity_votes","token_id,telegram_id,verification_state"),
              ("worldz_fullscope_events","event_type,chain_key,amount_raw,quote_value,observed_at"),
              ("worldz_fullscope_action_intents","id,action_type,state,mainnet_execution_enabled"),
              ("worldz_fullscope_locks","id,lock_kind,status"),
              ("worldz_fullscope_vesting","id,schedule_kind,status")
          ]
          for table,columns in probes:
              url=base+"/rest/v1/"+table+"?select="+urllib.parse.quote(columns,safe=",")+"&limit=1"
              req=urllib.request.Request(url,headers=headers)
              try:
                  with urllib.request.urlopen(req,timeout=20) as response:
                      if response.status != 200:
                          raise SystemExit(f"FullScope schema probe failed for {table}: HTTP {response.status}")
                      json.loads(response.read().decode("utf-8"))
              except Exception as exc:
                  raise SystemExit(f"FullScope schema missing/incompatible for {table}: {exc}") from exc

          print("WORLDZ_FULLSCOPE_SCHEMA=PASS")

          # Prove the exact publishable-key + x-zed-runtime-key bridge used by
          # the protected runtime when a service-role key is not loaded.
          import hashlib
          publishable=str(os.environ.get("SUPABASE_PUBLISHABLE_KEY_SECRET","")).strip() or "sb_publishable_3ognbqSCTAcAnLHOeKZp8A_IgriwUJV"
          bot_token=str(os.environ.get("BOT_TOKEN_SECRET","")).strip()
          if not bot_token:
              raise SystemExit("FullScope runtime bridge proof requires the protected bot token.")
          runtime_key=hashlib.sha256(("zed-runtime-v1:"+bot_token).encode()).hexdigest()
          runtime_headers={
              "apikey":publishable,
              "authorization":"Bearer "+publishable,
              "x-zed-runtime-key":runtime_key,
              "content-type":"application/json",
              "accept":"application/json",
              "user-agent":"WorldzFullScope-Runtime-Bridge-Gate/1.0"
          }
          auth_req=urllib.request.Request(
              base+"/rest/v1/rpc/zed_runtime_authorized",
              data=b"{}",
              headers=runtime_headers,
              method="POST"
          )
          with urllib.request.urlopen(auth_req,timeout=20) as response:
              authorized=json.loads(response.read().decode("utf-8"))
          if authorized is not True:
              raise SystemExit("FullScope protected publishable-key runtime bridge is not authorized.")

          read_req=urllib.request.Request(
              base+"/rest/v1/worldz_fullscope_chains?select=chain_key&limit=1",
              headers=runtime_headers
          )
          with urllib.request.urlopen(read_req,timeout=20) as response:
              rows=json.loads(response.read().decode("utf-8"))
          if not isinstance(rows,list):
              raise SystemExit("FullScope protected runtime bridge cannot read the chain registry.")

          print("WORLDZ_FULLSCOPE_RUNTIME_BRIDGE=PASS")
          print("WORLDZ_FULLSCOPE_RUNTIME_ACTIVATION_GATE=PASS")

      - name: Prove restored historical runtime is present
        shell: bash
        run: |
          set -euo pipefail
          test -s src/full-runtime-entry.js
          test -s src/telegram.js
          test -s src/auto/telegram.js
          test -s src/grace/telegram.js
          test -s public/miniapp/index.html
          grep -Fq 'registerAutoTelegramHandlers' src/full-runtime-entry.js
          grep -Fq 'registerGraceTelegramHandlers' src/full-runtime-entry.js
          grep -Fq 'registerProjectWalletSystem' src/full-runtime-entry.js
          grep -Fq 'leaderboard' src/telegram.js
          grep -Fq 'wallet' src/telegram.js
          grep -Fq 'governance' src/telegram.js
          grep -Fq 'kitty' src/telegram.js
          echo 'ZED_AUTO_GRACE_HISTORICAL_RUNTIME=PASS'

      - name: Deploy restored protected runtime
        shell: bash
        run: |
          set -euo pipefail
          zed_log="$RUNNER_TEMP/zed-restore.log"
          status=0
          if bash .github/full-current-zed-runtime.sh 2>&1 | tee "$zed_log"; then
            status=0
          else
            status=1
          fi

          if [ "$status" != 0 ]; then
            core_pass=0
            for attempt in $(seq 1 12); do
              sleep 4
              tag="restore_zed=${GITHUB_SHA}-${GITHUB_RUN_ID}-${attempt}"
              root_code="$(curl --silent --show-error --location --connect-timeout 5 --max-time 12 -o "$RUNNER_TEMP/root.json" -w '%{http_code}' "https://$PROTECTED_DOMAIN/?$tag" || true)"
              health_code="$(curl --silent --show-error --location --connect-timeout 5 --max-time 12 -o "$RUNNER_TEMP/health.json" -w '%{http_code}' "https://$PROTECTED_DOMAIN/health?$tag" || true)"
              mini_code="$(curl --silent --show-error --location --connect-timeout 5 --max-time 12 -o "$RUNNER_TEMP/mini.html" -w '%{http_code}' "https://$PROTECTED_DOMAIN/miniapp/?$tag" || true)"
              root_service=0; health_ok=0; splashback=0; zed_guide=0; create=0; heroes=0
              grep -Fq '"service":"CryptoWorldz Zed Bot"' "$RUNNER_TEMP/root.json" && root_service=1 || true
              grep -Fq '"ok":true' "$RUNNER_TEMP/health.json" && health_ok=1 || true
              grep -Fq 'id="splashback"' "$RUNNER_TEMP/mini.html" && splashback=1 || true
              grep -Fq 'id="zed-guide"' "$RUNNER_TEMP/mini.html" && zed_guide=1 || true
              grep -Fq 'id="create"' "$RUNNER_TEMP/mini.html" && create=1 || true
              grep -Fq 'id="heroes"' "$RUNNER_TEMP/mini.html" && heroes=1 || true
              echo "RESTORE_ZED_PROBE attempt=$attempt root=$root_code health=$health_code mini=$mini_code service=$root_service ok=$health_ok splashback=$splashback guide=$zed_guide create=$create heroes=$heroes"
              if [ "$root_code" = 200 ] && [ "$health_code" = 200 ] && [ "$mini_code" = 200 ]                 && [ "$root_service" = 1 ] && [ "$health_ok" = 1 ] && [ "$splashback" = 1 ]                 && [ "$zed_guide" = 1 ] && [ "$create" = 1 ] && [ "$heroes" = 1 ]; then
                core_pass=1
                break
              fi
            done
            test "$core_pass" = 1
          fi
          echo 'ZED_AUTO_GRACE_LIVE_CORE=PASS'

      - name: Configure and prove Telegram legacy Command Centre
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, io, json, os, re, urllib.request
          from ftplib import FTP_TLS

          root="/domains/cryptobotz.cryptoworldz.xyz/nodejs"
          host=os.environ["FTP_HOST"].replace("ftps://","").replace("ftp://","").split("/")[0]
          if host.count(":")==1: host=host.split(":",1)[0]
          ftp=FTP_TLS(); ftp.connect(host,int(os.environ.get("FTP_PORT","21")),timeout=45)
          ftp.login(os.environ["FTP_USERNAME"],os.environ["FTP_PASSWORD"]); ftp.prot_p()
          buf=io.BytesIO(); ftp.retrbinary("RETR "+root+"/.env",buf.write); ftp.quit()
          env={}
          for raw in buf.getvalue().decode("utf-8").splitlines():
              line=raw.strip()
              if not line or line.startswith("#") or "=" not in line: continue
              k,v=line.split("=",1); k=re.sub(r"^export\s+","",k).strip(); v=v.strip().strip('"').strip("'")
              if v: env[k]=v
          token=env.get("BOT_TOKEN","")
          if not token and os.environ.get("HOSTINGER_MANAGED_BOT_TOKEN","").strip()=="1":
              print("ZED_TELEGRAM_DIRECT_CONFIG=DEFERRED_TO_HOSTINGER_MANAGED_RUNTIME")
              raise SystemExit(0)
          if not token: raise SystemExit("BOT_TOKEN missing after protected recovery")
          print("::add-mask::"+token)

          api="https://api.telegram.org/bot"+token+"/"
          def call(method,payload=None):
              data=None
              headers={}
              if payload is not None:
                  data=json.dumps(payload).encode("utf-8")
                  headers["content-type"]="application/json"
              with urllib.request.urlopen(urllib.request.Request(api+method,data=data,headers=headers),timeout=30) as r:
                  out=json.loads(r.read().decode("utf-8"))
              if out.get("ok") is not True: raise SystemExit("Telegram "+method+" failed")
              return out.get("result")

          commands=[
            {"command":"start","description":"Open the Zed Command Centre"},
            {"command":"help","description":"View the public command menu"},
            {"command":"register","description":"Register your Legend Profile"},
            {"command":"profile","description":"View your Legend Profile"},
            {"command":"rewards","description":"View reward history"},
            {"command":"points","description":"View your Legend Points"},
            {"command":"leaderboard","description":"View the Top 25 Legends"},
            {"command":"raaiiidd","description":"View the newest active Raaiiidd"},
            {"command":"missions","description":"View every active Raaiiidd"},
            {"command":"wallet","description":"Connect a public Solana wallet"},
            {"command":"kitty","description":"View the community SOL/USDC kitty"},
            {"command":"governance","description":"View active community votes"},
            {"command":"vote","description":"Vote on a governance proposal"},
            {"command":"impact","description":"Open the featured impact mission"},
            {"command":"donate","description":"Open the featured donation route"},
            {"command":"cancel","description":"Cancel wallet registration"},
            {"command":"community","description":"Open CryptoWorldz community links"},
            {"command":"website","description":"Open CryptoWorldz.xyz"}
          ]
          call("setMyCommands",{"commands":commands})
          call("setChatMenuButton",{"menu_button":{"type":"web_app","text":"🌐 OPEN COMMAND CENTRE","web_app":{"url":"https://cryptobotz.cryptoworldz.xyz/miniapp/"}}})
          secret=hashlib.sha256(token.encode()).hexdigest()
          before=call("getWebhookInfo")
          pending_before=int(before.get("pending_update_count") or 0)
          print("ZED_TELEGRAM_BACKLOG_BEFORE="+str(pending_before))
          call("setWebhook",{
            "url":"https://cryptobotz.cryptoworldz.xyz/telegram-webhook",
            "secret_token":secret,
            "allowed_updates":["message","callback_query"],
            "drop_pending_updates":False,
            "max_connections":5
          })
          bot=call("getMe")
          actual=call("getMyCommands")
          hook=call("getWebhookInfo")
          got=[x.get("command") for x in actual]
          expected=[x["command"] for x in commands]
          if got != expected: raise SystemExit("Telegram command list mismatch")
          if hook.get("url") != "https://cryptobotz.cryptoworldz.xyz/telegram-webhook": raise SystemExit("Telegram webhook URL mismatch")

          pending_after=int(hook.get("pending_update_count") or 0)
          for attempt in range(1,13):
              if pending_after == 0 or pending_after < pending_before:
                  break
              import time
              time.sleep(5)
              hook=call("getWebhookInfo")
              pending_after=int(hook.get("pending_update_count") or 0)
              print("ZED_TELEGRAM_BACKLOG_CHECK attempt="+str(attempt)+" pending="+str(pending_after))

          print("ZED_TELEGRAM_BACKLOG_AFTER="+str(pending_after))
          if pending_before and pending_after >= pending_before:
              raise SystemExit("Telegram backlog is not draining through repaired webhook")
          if hook.get("last_error_message") and pending_after:
              raise SystemExit("Telegram webhook still reports an active delivery error: "+str(hook.get("last_error_message"))[:160])
          print("ZED_TELEGRAM_BOT=PASS")
          print("ZED_TELEGRAM_COMMANDS=18")
          print("ZED_TELEGRAM_BACKLOG_CONTROL=PASS")
          print("ZED_TELEGRAM_WEBHOOK=PASS")
          print("ZED_TELEGRAM_MENU_BUTTON=PASS")
          PY

      - name: Prove live AUTO, GRACE and protected surfaces
        shell: bash
        run: |
          set -euo pipefail
          root="https://$PROTECTED_DOMAIN"
          test "$(curl --silent --show-error --location -o "$RUNNER_TEMP/grace.json" -w '%{http_code}' "$root/grace/health")" = 200
          grep -Fq '"ok":true' "$RUNNER_TEMP/grace.json"
          auto_code="$(curl --silent --show-error --location -o "$RUNNER_TEMP/auto.json" -w '%{http_code}' "$root/api/mini/auto/status" || true)"
          case "$auto_code" in 200|401|403) ;; *) echo "AUTO route missing HTTP=$auto_code"; exit 1;; esac
          wallet_code="$(curl --silent --show-error --location -o "$RUNNER_TEMP/wallet.json" -w '%{http_code}' "$root/api/mini/project-wallets" || true)"
          case "$wallet_code" in 200|401|403) ;; *) echo "Project-wallet route missing HTTP=$wallet_code"; exit 1;; esac
          gpt_code="$(curl --silent --show-error --location -o "$RUNNER_TEMP/gpt.json" -w '%{http_code}' "$root/api/oneworldz-gpt/status" || true)"
          test "$gpt_code" = 200
          echo 'ZED_AUTO_ROUTE=PASS'
          echo 'ZED_GRACE_ROUTE=PASS'
          echo 'ZED_PROJECT_WALLETS_ROUTE=PASS'
          echo 'ONEWORLDZ_GPT_ROUTE=PASS'

      - name: Final verdict
        run: echo 'ZED_AUTO_GRACE_COMMAND_CENTRE_RESTORED=PASS'
