name: Diagnose Worldz Public DNS and HTTPS
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-worldz-public.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Public DNS and HTTP connectivity diagnostics (read only)
        shell: bash
        run: |
          python3 - <<'PY'
          import socket,ssl,urllib.request,urllib.error
          for host in ('worldzhq.com','www.worldzhq.com','worldz.live','www.worldz.live','donateworldz.com'):
              print('HOST',host,flush=True)
              try:
                  infos=socket.getaddrinfo(host,443,type=socket.SOCK_STREAM)
                  ips=sorted({x[4][0] for x in infos})
                  print('DNS',','.join(ips),flush=True)
              except Exception as e:
                  print('DNS_ERROR',type(e).__name__,str(e)[:160],flush=True)
                  continue
              for port in (80,443):
                  try:
                      with socket.create_connection((host,port),timeout=5):
                          print('TCP',port,'OPEN',flush=True)
                  except Exception as e:print('TCP',port,'FAIL',type(e).__name__,flush=True)
              for scheme in ('http','https'):
                  try:
                      req=urllib.request.Request(scheme+'://'+host+'/',headers={'User-Agent':'Worldz-Healthcheck/1.0'})
                      with urllib.request.urlopen(req,timeout=7) as response:
                          body=response.read(150000)
                          print('WEB',scheme,response.status,'FINAL',response.url,'BYTES',len(body),'WORLDZ',b'worldz' in body.lower(),flush=True)
                  except Exception as e:print('WEB',scheme,'FAIL',type(e).__name__,str(e)[:160],flush=True)
          PY
