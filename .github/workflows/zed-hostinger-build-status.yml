name: ZED Hostinger Build Status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/zed-hostinger-build-status.yml'

permissions:
  contents: read

env:
  PROTECTED_DOMAIN: cryptobotz.cryptoworldz.xyz

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: cryptoworldz-production
    env:
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read current Hostinger Node build state
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$HOSTINGER_API_TOKEN"
          domain_enc="$(node -p 'encodeURIComponent(process.env.PROTECTED_DOMAIN)')"
          curl --fail --silent --show-error --location -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "https://developers.hostinger.com/api/hosting/v1/websites?domain=${domain_enc}&per_page=25" -o /tmp/websites.json
          username="$(node - <<'NODE'
          const fs=require('fs');const p=JSON.parse(fs.readFileSync('/tmp/websites.json','utf8'));const d=process.env.PROTECTED_DOMAIN.toLowerCase();const r=(p.data||[]).find(x=>String(x.domain||'').toLowerCase()===d);if(!r?.username)process.exit(2);process.stdout.write(String(r.username));
          NODE
          )"
          echo "::add-mask::$username"
          user_enc="$(HOSTINGER_USERNAME="$username" node -p 'encodeURIComponent(process.env.HOSTINGER_USERNAME)')"
          base="https://developers.hostinger.com/api/hosting/v1/accounts/${user_enc}/websites/${domain_enc}/nodejs"
          curl --fail --silent --show-error --location -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "$base/builds?per_page=10" -o /tmp/builds.json
          BUILDS=/tmp/builds.json node - <<'NODE'
          const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.env.BUILDS,'utf8'));const rows=Array.isArray(p)?p:(Array.isArray(p.data)?p.data:(Array.isArray(p.items)?p.items:[]));for(const b of rows.slice(0,8)){const o=b._options||b.options||{};console.log('ZED_HOSTINGER_BUILD '+JSON.stringify({uuid:b.uuid||b.id||null,state:b.state||b.status||null,created_at:b.created_at||null,source_type:o.source_type||null,node_version:o.node_version||null,app_type:o.app_type||null,entry_file:o.entry_file||null,root_directory:o.root_directory||null}));}
          NODE
