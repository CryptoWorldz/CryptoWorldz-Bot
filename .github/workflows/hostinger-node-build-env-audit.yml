name: CryptoWorldz Hostinger Node Build Environment Audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hostinger-node-build-env-audit.yml"

permissions:
  contents: write

env:
  CRYPTO_DOMAIN: cryptoworldz.xyz
  ZED_DOMAIN: cryptobotz.cryptoworldz.xyz

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: cryptoworldz-production
    env:
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_PORT: ${{ vars.FTP_PORT || '21' }}
      HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish audit start
        run: bash .github/publish-progress.sh HOSTINGER_NODE_ENV_AUDIT STARTED
      - name: Install lftp
        run: |
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq lftp
      - name: Audit managed Node build records and roots read-only
        shell: bash
        run: |
          set -euo pipefail
          for v in "$FTP_HOST" "$FTP_USERNAME" "$FTP_PASSWORD" "$HOSTINGER_API_TOKEN"; do [ -z "$v" ] || echo "::add-mask::$v"; done
          curl --fail --silent --show-error --location -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' \
            'https://developers.hostinger.com/api/hosting/v1/websites?per_page=100' -o "$RUNNER_TEMP/websites.json"
          node - <<'NODE' > "$RUNNER_TEMP/accounts.tsv"
          const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/websites.json','utf8'));const rows=p.data||[];
          for(const d of [process.env.CRYPTO_DOMAIN,process.env.ZED_DOMAIN]){const r=rows.find(x=>String(x.domain||'').toLowerCase()===d.toLowerCase());if(r?.username)console.log(`${d}\t${r.username}`)}
          NODE
          while IFS=$'\t' read -r domain username; do
            [ -n "$domain" ] || continue
            echo "::add-mask::$username"
            denc="$(DOMAIN="$domain" node -p 'encodeURIComponent(process.env.DOMAIN)')"; uenc="$(USERNAME="$username" node -p 'encodeURIComponent(process.env.USERNAME)')"
            base="https://developers.hostinger.com/api/hosting/v1/accounts/${uenc}/websites/${denc}/nodejs"
            curl --fail --silent --show-error --location -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "$base/builds?per_page=25" -o "$RUNNER_TEMP/${domain}.builds.json"
            DOMAIN="$domain" FILE="$RUNNER_TEMP/${domain}.builds.json" node - <<'NODE'
            const fs=require('fs');const p=JSON.parse(fs.readFileSync(process.env.FILE,'utf8'));const rows=p.data||[];console.log(`NODE_BUILD_COUNT ${process.env.DOMAIN}=${rows.length}`);if(rows[0]){console.log(`NODE_LATEST_STATE ${process.env.DOMAIN}=${rows[0].state||'unknown'}`);console.log(`NODE_LATEST_UUID_PRESENT ${process.env.DOMAIN}=${rows[0].uuid?'YES':'NO'}`)}
            NODE
            uuid="$(FILE="$RUNNER_TEMP/${domain}.builds.json" node -p "const p=require(process.env.FILE);(p.data&&p.data[0]&&p.data[0].uuid)||''")"
            if [ -n "$uuid" ]; then
              curl --fail --silent --show-error --location -H "Authorization: Bearer $HOSTINGER_API_TOKEN" -H 'Accept: application/json' "$base/builds/$uuid/logs" -o "$RUNNER_TEMP/${domain}.logs.json" || true
              DOMAIN="$domain" FILE="$RUNNER_TEMP/${domain}.logs.json" node - <<'NODE'
              const fs=require('fs');let raw='';try{raw=fs.readFileSync(process.env.FILE,'utf8')}catch{};const u=raw.toUpperCase();
              const names=['BOT_TOKEN','TELEGRAM_TOKEN','SUPABASE_URL','SUPABASE_SERVICE_ROLE_KEY','SUPABASE_ANON_KEY','OPENAI_API_KEY','HOSTINGER_API_TOKEN','ADMIN_API_TOKEN','HUB_API_SECRET','.ENV','NODEJS','HBUILDS','CRYPTOWORLDZ.XYZ','CRYPTOBOTZ.CRYPTOWORLDZ.XYZ'];
              for(const n of names) console.log(`BUILD_LOG_MENTIONS ${process.env.DOMAIN} ${n}=${u.includes(n.toUpperCase())?'YES':'NO'}`);
              NODE
            fi
          done < "$RUNNER_TEMP/accounts.tsv"

          raw_host="$(printf '%s' "$FTP_HOST" | sed -e 's#^ftp://##' -e 's#^ftps://##' -e 's#/.*$##')"; if [[ "$raw_host" != *:*:* && "$raw_host" == *:* ]]; then raw_host="${raw_host%%:*}"; fi
          cat > "$RUNNER_TEMP/list-hbuilds.lftp" <<'EOF'
          set cmd:fail-exit false
          set net:max-retries 2
          set net:timeout 25
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set ssl:check-hostname false
          cls -la /domains/cryptoworldz.xyz/hbuilds
          cls -la /domains/cryptobotz.cryptoworldz.xyz/hbuilds
          bye
          EOF
          timeout 180 lftp -u "$FTP_USERNAME,$FTP_PASSWORD" -p "$FTP_PORT" -e "source $RUNNER_TEMP/list-hbuilds.lftp" "$raw_host" || true
          echo 'CRYPTOWORLDZ_HOSTINGER_NODE_ENV_AUDIT=PASS_READ_ONLY'
      - name: Publish audit pass
        if: success()
        run: bash .github/publish-progress.sh HOSTINGER_NODE_ENV_AUDIT PASS
      - name: Publish audit fail
        if: failure()
        run: bash .github/publish-progress.sh HOSTINGER_NODE_ENV_AUDIT FAIL
