name: Verify Complete Release Candidate

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-release-candidate.yml'
      - 'index.js'
      - 'auto-server.js'
      - 'src/**'
      - 'test/**'
      - 'apps/cryptoworldz-web-core/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: complete-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-complete-release:
    name: Verify Zed Grace Auto and Worldz Web Core
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify complete repository
        run: npm run verify

      - name: Verify critical release files
        shell: bash
        run: |
          set -euo pipefail
          test -s apps/cryptoworldz-web-core/assets/worldz-imagery.js
          test -s apps/cryptoworldz-web-core/assets/worldz-imagery.css
          test -s apps/cryptoworldz-web-core/assets/jayjayteamdev.js
          test -s apps/cryptoworldz-web-core/assets/jayjayteamdev.css
          test -s apps/cryptoworldz-web-core/assets/pdc-site.js
          test -s supabase/migrations/20260806194900_restore_service_role_access_all_command_tables.sql
          grep -Fq 'Grace X Confidential OAuth 2026-08-07.2' src/grace/oauth-telegram.js
          grep -Fq 'worldz-imagery.js' apps/cryptoworldz-web-core/index.html
          grep -Fq 'jayjayteamdev.js' apps/cryptoworldz-web-core/index.html
          grep -Fq '365%' apps/cryptoworldz-web-core/assets/jayjayteamdev.js

      - name: Build deployment package
        shell: bash
        run: |
          set -euo pipefail
          cd apps/cryptoworldz-web-core
          zip -qr ../../complete-worldz-release-${GITHUB_SHA}.zip . -x '*.DS_Store' '*.md' '.gitignore' 'docs/*'
          cd ../..
          test -s complete-worldz-release-${GITHUB_SHA}.zip
          sha256sum complete-worldz-release-${GITHUB_SHA}.zip
