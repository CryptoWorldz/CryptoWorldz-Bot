name: Validate Worldz token identity
on:
  pull_request:
    paths:
      - "worldzpad-mainnet/token-identity/**"
      - "launchpad.cryptoworldz.xyz/tokenlist.json"
      - "launchpad.cryptoworldz.xyz/wldz/token-metadata.json"
      - "launchpad.cryptoworldz.xyz/rviv/**"
      - "launchpad.cryptoworldz.xyz/.well-known/worldz-tokens.json"
      - "scripts/validate_worldz_token_identity.py"
      - ".github/workflows/deploy-worldzlaunchpad.yml"
      - ".github/workflows/indexnow-worldzlaunchpad.yml"
      - "scripts/audit_worldz_token_identity_onchain.mjs"
      - ".github/workflows/audit-worldz-token-identity-onchain.yml"
      - ".github/workflows/validate-worldz-token-identity.yml"
  push:
    paths:
      - "worldzpad-mainnet/token-identity/**"
      - "launchpad.cryptoworldz.xyz/tokenlist.json"
      - "launchpad.cryptoworldz.xyz/wldz/token-metadata.json"
      - "launchpad.cryptoworldz.xyz/rviv/**"
      - "launchpad.cryptoworldz.xyz/.well-known/worldz-tokens.json"
      - "scripts/validate_worldz_token_identity.py"
      - ".github/workflows/deploy-worldzlaunchpad.yml"
      - ".github/workflows/indexnow-worldzlaunchpad.yml"
      - "scripts/audit_worldz_token_identity_onchain.mjs"
      - ".github/workflows/audit-worldz-token-identity-onchain.yml"
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/validate_worldz_token_identity.py
