name: WLDZ Historical Squads Proposal Guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify the old proposal builder cannot become an automatic second launch
        run: |
          node --check worldzpad-mainnet/scripts/build-wldz-squads-proposal.mjs
          node - <<'NODE'
          const fs=require('fs');
          const plan=JSON.parse(fs.readFileSync('worldzpad-mainnet/wldz-one-sided-launch.candidate.json','utf8'));
          if(plan.status!=='LIVE_EXECUTED__DO_NOT_REEXECUTE') throw new Error('WLDZ live state missing');
          if(plan.duplicateExecutionProhibited!==true || plan.executionEnabled!==false) throw new Error('duplicate execution guard missing');
          console.log('WLDZ_HISTORICAL_SQUADS_PROPOSAL_GUARD=PASS');
          NODE
