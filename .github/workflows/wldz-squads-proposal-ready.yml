name: WLDZ Squads Proposal Ready Proof

on:
  workflow_dispatch:
  push:
    paths:
      - "worldzpad-mainnet/scripts/build-wldz-squads-proposal.mjs"
      - "worldzpad-mainnet/wldz-one-sided-launch.candidate.json"
      - "worldzpad-mainnet/package.json"
      - ".github/workflows/wldz-squads-proposal-ready.yml"

permissions:
  contents: read

concurrency:
  group: wldz-squads-proposal-ready
  cancel-in-progress: true

jobs:
  build-simulate-proposal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: worldzpad-mainnet
    env:
      SOLANA_RPC_URL: https://hknymhhyqldtzmplzuzh.supabase.co/functions/v1/worldz-solana-rpc
      SQUADS_CREATOR: Fap54GTCo4ZopkwmHtbSUJZTsjTybftJfN9sPG3MHp4u
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned SDKs
        run: npm install --no-audit --no-fund
      - name: Build exact proposal payload and simulate
        run: npm run build:proposal
      - name: Upload exact proposal proof
        uses: actions/upload-artifact@v4
        with:
          name: wldz-squads-proposal-ready
          path: worldzpad-mainnet/artifacts/wldz-squads-proposal-ready.json
          if-no-files-found: error
          retention-days: 30
