<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08040e">
<title>Open Raid Post in X</title>
<meta name="worldz-raid-launcher" content="exact-web-v2">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#44207f,#120820 48%,#050208);color:#fff;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:18px}
.card{width:min(520px,100%);border:1px solid #ffffff24;border-radius:26px;padding:28px;background:#10091bea;box-shadow:0 25px 80px #000a}
.logo{font-size:2.2rem}h1{font-size:clamp(1.8rem,7vw,3rem);line-height:1;margin:.6rem 0}.lead{color:#d3c7df}.status{padding:12px 14px;border-radius:14px;background:#ffffff09;border:1px solid #ffffff14;margin:16px 0;color:#c8bad7;word-break:break-word}.actions{display:grid;gap:10px;margin-top:18px}.btn{display:block;border:0;border-radius:14px;padding:14px 16px;text-decoration:none;text-align:center;font-weight:950;font-size:1rem;cursor:pointer;color:#fff;background:linear-gradient(90deg,#7d3de6,#176fe1)}.btn.alt{background:#ffffff0c;border:1px solid #ffffff24}.btn.copy{background:#173f8b}.note{font-size:.78rem;color:#a798b8;margin-top:16px}.ok{color:#7fffb6}.warn{color:#ffd070}
</style>
</head>
<body>
<main class="card">
  <div class="logo">🤠⚡𝕏</div>
  <h1>Open the exact Raid post</h1>
  <p class="lead">Tap below to open this specific post. The full link is shown so you can check or copy it.</p>
  <div id="status" class="status">Checking Raid link…</div>
  <div class="actions">
    <a id="open-app" class="btn" href="#">𝕏 OPEN RAID POST IN X APP</a>
    <a id="open-web" class="btn alt" href="#" rel="noopener">🌐 OPEN EXACT POST IN BROWSER</a>
    <button id="copy" class="btn copy" type="button">📋 COPY EXACT POST LINK</button>
  </div>
  <p class="note">This launcher never asks for an X password, wallet key, seed phrase or private key.</p>
</main>
<script>
(() => {
  "use strict";
  const params = new URLSearchParams(location.search);
  const id = String(params.get("id") || "").trim();
  const raw = String(params.get("src") || "").trim();
  const validId = /^\d{5,25}$/.test(id);

  function safeSource(value) {
    try {
      const url = new URL(value);
      const host = url.hostname.toLowerCase().replace(/^www\./, "");
      if (url.protocol !== "https:" || !["x.com","twitter.com"].includes(host)) return "";
      const match = url.pathname.match(/\/(?:i\/web\/)?status(?:es)?\/(\d{5,25})(?:\/|$)/i);
      return match && match[1] === id ? url.href : "";
    } catch { return ""; }
  }

  if (!validId) {
    document.getElementById("status").innerHTML = '<span class="warn">Invalid Raid post ID.</span> Return to Telegram and press Refresh.';
    document.getElementById("open-app").hidden = true;
    document.getElementById("open-web").hidden = true;
    document.getElementById("copy").hidden = true;
    return;
  }

  const exactWeb = safeSource(raw) || ("https://x.com/i/web/status/" + id);
  const status = document.getElementById("status");
  const openApp = document.getElementById("open-app");
  const openWeb = document.getElementById("open-web");
  const copy = document.getElementById("copy");

  status.innerHTML = '<span class="ok">Exact Raid post locked:</span> ' + id;
  openApp.href = exactWeb;
  openApp.textContent = "𝕏 OPEN EXACT RAID POST";
  openWeb.href = exactWeb;
  openWeb.target = "_blank";
  const displayedLink = document.createElement("p");
  displayedLink.textContent = exactWeb;
  displayedLink.style.overflowWrap = "anywhere";
  status.appendChild(displayedLink);

  copy.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(exactWeb);
      copy.textContent = "✅ RAID LINK COPIED";
    } catch {
      const box = document.createElement("textarea");
      box.value = exactWeb;
      document.body.appendChild(box);
      box.select();
      document.execCommand("copy");
      box.remove();
      copy.textContent = "✅ RAID LINK COPIED";
    }
  });

  // Navigation requires a user click. Never auto-launch an app scheme.

})();
</script>
</body>
</html>
