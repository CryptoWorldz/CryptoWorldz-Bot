<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="OneWorldz — one simple gateway to the Worldz network.">
  <title>OneWorldz</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0d1020;color:#fff}
    body{display:grid;place-items:center;padding:24px}
    main{width:min(920px,100%);text-align:center}
    h1{font-size:clamp(2.4rem,9vw,5rem);margin:0 0 8px}
    p{margin:0 0 28px;color:#cfd4e8;font-size:clamp(1rem,3vw,1.25rem)}
    nav{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
    a{display:flex;align-items:center;justify-content:center;min-height:54px;padding:12px 16px;border:1px solid #343b5d;border-radius:14px;background:#171b30;color:#fff;text-decoration:none;font-weight:700;overflow-wrap:anywhere}
    a:hover,a:focus-visible{background:#232946;outline:2px solid #fff;outline-offset:2px}
  </style>
</head>
<body>
  <main>
    <h1>OneWorldz</h1>
    <p>Choose a destination.</p>
    <nav aria-label="Worldz destinations">
      <a href="https://cryptoworldz.xyz">CryptoWorldz</a>
      <a href="https://solworldz.xyz">SolWorldz</a>
      <a href="https://ethworldz.xyz">EthWorldz</a>
      <a href="https://baseworldz.xyz">BaseWorldz</a>
      <a href="https://bnbworldz.xyz">BNBWorldz</a>
      <a href="https://xrpworldz.xyz">XRPWorldz</a>
      <a href="https://suiworldz.xyz">SuiWorldz</a>
      <a href="https://hyperworldz.xyz">HyperWorldz</a>
      <a href="https://robinworldz.xyz">RobinWorldz</a>
      <a href="https://hodlerworldz.xyz">HodlerWorldz</a>
      <a href="https://purplediamondcrew.com">Purple Diamond Crew</a>
      <a href="https://impactbased.oneworldz.com">ImpactBased</a>
      <a href="https://law.oneworldz.com">Law</a>
      <a href="https://learn.oneworldz.com">Learn</a>
      <a href="https://hodlergalaxy.xyz">HodlerGalaxy</a>
      <a href="https://foodworldz.com">FoodWorldz</a>
      <a href="https://donateworldz.com">DonateWorldz</a>
    </nav>
  </main>
</body>
</html>
